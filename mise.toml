# mise.toml — toolchains and tasks for this yidam-derived repository.
# https://mise.jdx.dev
#
# `mise install`          provisions the toolchains below.
# `mise tasks`            lists every available task.
# `mise run yidam-build`  installs the yidam CLI (do this once).
#
# The yidam CLI tasks live in mise.yidam.toml, pulled in by `includes` below.
# Domain tasks belong in THIS file — keep mise.yidam.toml as the inherited layer
# so a future `mise run yidam-vendor-update` can replace it without clobbering
# anything you wrote.
#
# `[task_config] includes` and not a top-level `extends`: mise accepts `extends`
# on an individual task, never on a config file. It warns about the unknown field
# and carries on, so the failure looks like nothing at all — every inherited task
# just isn't there, and `mise run graph-check` reports an unknown task.

[task_config]
includes = ["mise.yidam.toml"]

# `.yidam/bin` first, so everything mise runs resolves the binary this repository
# pinned rather than whichever `yidam` some earlier `cargo install` left in
# ~/.cargo/bin. It has to be here and not in mise.yidam.toml: that is a task
# file, where `[env]` declares a task named env and mise rejects `_.path` as an
# unknown field — which orphans every inherited task, so the file that promised
# the guarantee was the one file that could not make it.
#
# This guards anything mise runs. It does not guard a script, a CI step, or an
# agent that assembles PATH itself; those have to put `.yidam/bin` first
# themselves. `yidam` warns on stderr when a binary other than the pin answers.
[env]
_.path = [".yidam/bin"]

[tools]
# <!-- YIDAM:TOOLS --> written by yidam-vendor-update from .yidam.toml — do not edit
"github:goedelsoup/yidam" = { version = "0.8.0", version_prefix = "cli/v" }
# <!-- /YIDAM:TOOLS -->
# Rust — the domain computer in crates/.
rust = { version = "1.88.0", components = "rustfmt,clippy" }
# Rust is the only toolchain carried at genesis. crates/ and packages/ hold no
# code yet, so every other toolchain here would be time on every CI run buying
# nothing.
#
# Add python + uv when the first connector lands. The sources this domain draws
# on — decennial census and ACS tables, Secretary of State election returns,
# county parcel and GIS exports — are all better served by the Python tabular
# and geospatial ecosystem than by Rust.
# python = "3.12"
# uv = "latest"
#
# Node — the web layer in web/, added the day it became an application rather
# than a README: an Astro site over the exported feeds, deck.gl over the county's
# vendored census geography, Plotly over its measures.
node = "lts"

# ── domain computer (crates/) ─────────────────────────────────────────────
# These no-op until crates/Cargo.toml exists — the same condition
# .github/workflows/ci.yml's `detect` job gates its crates jobs on. They said so
# in this comment for a while before they did it: `cargo --manifest-path` on a
# file that does not exist is a usage error, so on a freshly bootstrapped
# repository every one of them failed, and `mise run ci` — the local gate the
# README tells a new repo to run first — failed with it.

[tasks.build]
description = "Build the domain computer (crates/ workspace). No-op until crates/ exists."
run = """
if [ ! -f crates/Cargo.toml ]; then echo "no crates/Cargo.toml yet — skipping"; exit 0; fi
cargo build --workspace --manifest-path crates/Cargo.toml
"""

[tasks.test]
description = "Run domain computer tests. No-op until crates/ exists."
run = """
if [ ! -f crates/Cargo.toml ]; then echo "no crates/Cargo.toml yet — skipping"; exit 0; fi
cargo test --workspace --manifest-path crates/Cargo.toml
"""

[tasks.lint]
description = "Clippy across the domain computer. No-op until crates/ exists."
run = """
if [ ! -f crates/Cargo.toml ]; then echo "no crates/Cargo.toml yet — skipping"; exit 0; fi
cargo clippy --workspace --all-targets --manifest-path crates/Cargo.toml -- -D warnings
"""

# `-p` per member and not `--all`, and the difference is not cosmetic. Cargo's own
# help for the flag is "Format all packages, **and also their local path-based
# dependencies**" — and crates/proximity has one: the vendored geodesics crate at
# .yidam/.vendor/prelude/domains/geodesics/rust, which it depends on by path
# because that is where the prelude puts it.
#
# That directory is read-only. Upstream does not run rustfmt over prelude/domains/,
# so whether the copy this repository holds is rustfmt-clean is an accident of which
# pin it is on — it was at 1162287e and is not at 7b0cef2e, where two hand edits left
# a wrapped expression and an unsorted `use`. So `--all` made this repository's
# formatting gate fail on code it is forbidden to format, with no legal fix: running
# `cargo fmt` on it is an edit under .vendor/, discarded at the next re-vendor.
#
# Naming the members is the honest boundary — a repository formats what it writes.
# The cost is that a new crate has to be added here and in the two other places this
# list appears (`ci` below, and the crates job in .github/workflows/ci.yml), and
# nothing checks that it was: a crate left off is simply never formatted, quietly.
# Reported upstream in .yidam/decisions/upstream-findings.yml.

[tasks.fmt]
description = "Format domain computer Rust code. No-op until crates/ exists."
run = """
if [ ! -f crates/Cargo.toml ]; then echo "no crates/Cargo.toml yet — skipping"; exit 0; fi
cargo fmt --manifest-path crates/Cargo.toml -p covering -p ground -p provenance -p proximity -p publish -p succession
"""

# ── publication (crates/publish → web/src/feeds/) ─────────────────────────
# The feeds under web/src/feeds/ are derived from .yidam/corpus/ and committed.
# `publish` rewrites them. The gate that they are current is `cargo test` — a
# corpus test in crates/publish compares the committed bytes to a fresh
# derivation — so it is already inside `ci` below rather than beside it. The
# derivation is the gate, which is what the directory conventions ask of
# anything outside the corpus that derives from it.
#
# These are named `publish`/`site` rather than `web-*`: mise.yidam.toml already
# defines `web-install`, `web-dev` and `web-build` for yidam's own corpus-search
# shell under packages/web/, and shadowing an inherited task is a collision that
# comes back at the next `yidam-vendor-update`.

[tasks.publish]
description = "Rewrite the public feeds in web/src/feeds/ from the corpus."
run = """
if [ ! -f crates/Cargo.toml ]; then echo "no crates/Cargo.toml yet — skipping"; exit 0; fi
cargo run --quiet --manifest-path crates/Cargo.toml -p publish --bin publish-feeds
"""

[tasks.publish-check]
description = "Report whether the committed feeds are what the corpus says."
run = """
if [ ! -f crates/Cargo.toml ]; then echo "no crates/Cargo.toml yet — skipping"; exit 0; fi
cargo run --quiet --manifest-path crates/Cargo.toml -p publish --bin publish-feeds -- --check
"""

[tasks.boundaries]
description = "Re-vendor the county's census geography from TIGERweb. Reaches the network."
# The only task in this repository that is not hermetic, and it is run by hand.
# Its output is committed, so no build and no CI run ever needs the Census
# Bureau to be reachable.
run = """
if [ ! -d web/node_modules ]; then echo "run 'npm ci' in web/ first"; exit 1; fi
node web/scripts/fetch-boundaries.mjs
"""

# ── the ground key (crates/ground) ────────────────────────────────────────
# Reaches the network, like `boundaries` above and for the same reason: its
# output is committed, so no build and no CI run needs the county to be up.
# It rebuilds only the sections some corpus node stands on — see
# `.yidam/decisions/what-crosses-from-the-recorder.yml` for why not all 404.

[tasks.ground-fixture]
description = "Rebuild crates/ground's section fixture from the county's live layer 55."
run = "python3 crates/ground/fixtures/refresh.py"

# ── the site (web/) ───────────────────────────────────────────────────────
# Each no-ops with a loud line when web/node_modules is absent rather than
# failing a fresh clone. CI always installs, so CI is where these are binding.

[tasks.site-install]
description = "Install the web layer's npm dependencies."
run = "cd web && npm ci"

[tasks.site-dev]
description = "Serve the site at localhost:4321 with live reload."
run = "cd web && npm run dev"

[tasks.site-lint]
description = "Oxlint over the web layer."
run = """
if [ ! -d web/node_modules ]; then echo "web/node_modules absent — skipping lint (mise run site-install)"; exit 0; fi
cd web && npm run --silent lint
"""

[tasks.site-test]
description = "Vitest over the web layer, including the corpus-to-geometry join."
run = """
if [ ! -d web/node_modules ]; then echo "web/node_modules absent — skipping tests (mise run site-install)"; exit 0; fi
cd web && npm run --silent test
"""

[tasks.site-build]
description = "Build the static site into web/dist/."
run = """
if [ ! -d web/node_modules ]; then echo "web/node_modules absent — skipping build (mise run site-install)"; exit 0; fi
cd web && npm run --silent build
"""

[tasks.site]
description = "Lint, test and build the web layer."
depends = ["site-lint", "site-test", "site-build"]

# ── ci ────────────────────────────────────────────────────────────────────
# The local equivalent of what .github/workflows/ci.yml runs, and "equivalent"
# is checked rather than intended: `the_local_gate_runs_what_ci_gates_on` reads
# both files and holds them together. It ran `graph-check` alone for a while
# and CI's corpus job ran three gates, so a repository could pass the gate its
# own README tells it to run first and fail the build on the next push — with
# `regen --check`, on generated content nobody had written.
#
# These come from mise.yidam.toml and work from the genesis commit onward,
# before any crate exists.

[tasks.ci]
description = "Full local gate: corpus graph check, the domain computer, then the site."
run = """
set -eu
mise run graph-check
mise run graph-lint
mise run regen-check
if [ ! -f crates/Cargo.toml ]; then
  echo
  echo "no crates/Cargo.toml yet — the domain computer does not exist."
  echo "corpus gate only, which is the whole gate on day one."
  exit 0
fi
cargo fmt --manifest-path crates/Cargo.toml -p covering -p ground -p provenance -p proximity -p publish -p succession -- --check
cargo clippy --workspace --all-targets --manifest-path crates/Cargo.toml -- -D warnings
cargo test --workspace --manifest-path crates/Cargo.toml
RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --manifest-path crates/Cargo.toml

# The publication gate is inside `cargo test` above, not here: crates/publish's
# corpus test compares the committed feeds byte for byte against a fresh
# derivation from .yidam/corpus/. A separate step would be a second place to
# remember, and this repository has already been bitten by a gate list that
# drifted from the one CI runs.

if [ ! -f web/package.json ]; then
  echo
  echo "no web/package.json — the web layer does not exist."
  exit 0
fi
mise run site-lint
mise run site-test
mise run site-build
"""
