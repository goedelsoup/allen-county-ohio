class: jurisdiction
label: Lima City School District
description: |
  The county's largest school district by population and its smallest by area — 28,122 people
  over 8.745 square miles, internal point 40.739641, -84.112076, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population. At 3,200 people to the
  square mile it is more than seven times as dense as any other district touching the county; the
  next is Shawnee Local at 417.

  School districts are jurisdictions rather than divisions in this ontology because they hold
  governmental authority: an Ohio school district has an elected board, levies taxes, and its
  boundary is not drawn to report or elect anything but to govern. That is the whole test the
  two classes are separated on.

  **It is not the city, and the gap runs both ways.** It holds 27,821 of Lima's 35,579 people —
  78 per cent — while the other 7,758 residents of the city are in four suburban districts. It
  also reaches outside the corporate boundary: 301 people in
  [American Township](../place/american-township.yml), and unpopulated blocks in Shawnee and Bath
  townships that are the trace of annexed ground the school boundary followed. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block. The earlier form of this node said the boundary "does
  not follow the municipal or township lines around it. [inference] — from the area and internal
  point alone". It has now been compared against the places, and the inference holds in detail.

  **Who governs it now.** Its five board members are Heather J. Rutz and Sandra Jean Monfort to
  31 December 2029, and Alice Marie Donahue, Grant M. Sullivan and Saul E. Allen Jr. to 31 December
  2027 — five elected seats on four-year terms, staggered two and three. [verified] — [the elected
  officials roster](../../catalog/ohio-boe-elected-officials-allen.md). Five is the most the statute
  allows a city district under fifty thousand people, which is *"not less than three nor more than
  five members elected at large"*. [verified] —
  [Ohio Revised Code 3313.02](../../catalog/ohio-revised-code.md).

  **It is the county's largest district, its poorest, its highest spender and the one that raises
  the least of what it spends.** 3,394 pupils in the autumn of 2022, down from 4,280 in 2009;
  $19,321 of current
  spending a pupil; 18.4 per cent of revenue local against 59.2 from the state and 22.4 federal;
  31.7 per cent of its children aged 5 to 17 in poverty. [verified] —
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml), [the finance
  survey](../measure/allen-county-school-finance-2023.yml) and [child
  poverty](../measure/allen-county-school-district-poverty-2023.yml). Its
  property tax raises $3,098 a pupil where [Shawnee](shawnee-local-school-district.yml) raises
  $7,727.

  **It lost a fifth of its pupils in thirteen years** — 886 of 4,280, against a county that fell
  under four per cent over the same span. [verified] — same sources. This district empties faster
  than the city it is named for. [inference]
