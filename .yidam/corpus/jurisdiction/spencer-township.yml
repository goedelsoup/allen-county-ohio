class: jurisdiction
label: Spencer Township (government)
description: |
  The township government whose territory is [Spencer Township](../place/spencer-township.yml). Its township house
  is at 13080 Kolter Road, its telephone is 419.647.6172, and its trustees meet
  on the first Tuesday of the month at 7:30 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.699764, -84.354338, landmarked
  `SPENCER TOWNSHIP HALL`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  **Its trustees meet once a month**, where every other board in the county meets twice.
  [verified] — [Allen County](../../catalog/allen-county-official-site.md), townships page. Nothing retrieved explains why, and it is
  not a matter of size: Spencer holds 3,067 people, more than four of the townships that meet
  twice.

  The county's address file landmarks the building as `SPENCER TOWNSHIP HALL` and four separate
  township parks on Wisher Drive and Kolter Road — more park landmarks than any other township in
  the county. [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  [open] When the township was erected, under what order, and who its trustees are. The county's
  site names no officers and gives no dates.
