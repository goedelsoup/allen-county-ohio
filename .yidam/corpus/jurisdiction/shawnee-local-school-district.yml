class: jurisdiction
label: Shawnee Local School District
description: |
  The county's third largest district — 17,056 people over 40.932 square miles south and west of
  Lima, internal point 40.700628, -84.180974, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  It holds every one of [Shawnee Township](../place/shawnee-township.yml)'s 12,482 people, and
  more than a quarter of its own population lives elsewhere: 2,847 in
  [American Township](../place/american-township.yml), 1,033 inside [Lima](../place/lima.yml),
  665 in [Amanda Township](../place/amanda-township.yml), and **29 across the line in Auglaize
  County**. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block. Those 29 people on four blocks are why this node no
  longer says its territory is within Allen County.

  It contains [Fort Shawnee](../place/fort-shawnee.yml) and its 6,263 people — a third of the
  district, in a place with no municipal government of its own. [verified] — same source. The
  earlier form of this node called the boundary's disagreement with the township lines an
  inference from area and internal point; the comparison has now been made against the places
  themselves.

  **Who governs it now.** Its five board members are Manu B. Aggarwal, Marlena Franziska Schaaf and
  Scott R. Gephart to 31 December 2029, and Jerome J. O’Neal and Todd Joseph Washam to 31 December
  2027; Aggarwal and Gephart were appointed. [verified] — [the elected officials
  roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **It raises more of its own money than any district in the county.** 65.8 per cent of its revenue
  is local and $7,727 a pupil comes from property tax — the highest figure in the county, against
  $3,098 in [Lima](lima-city-school-district.yml). [verified] — [the finance
  survey](../measure/allen-county-school-finance-2023.yml). It spends $13,260 a pupil,
  which is less than Lima does. Its child poverty rate is 8.8 per cent. [verified] — [child
  poverty](../measure/allen-county-school-district-poverty-2023.yml).

  **Its enrolment fell 8.3 per cent between 2010 and 2023**, from 2,496 to 2,289 — a smaller fall
  than the twelve districts' 10.4 per cent. [verified] —
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml).
