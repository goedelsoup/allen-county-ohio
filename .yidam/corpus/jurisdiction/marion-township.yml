class: jurisdiction
label: Marion Township (government)
description: |
  The township government whose territory is [Marion Township](../place/marion-township.yml). Its township house
  is at 5405 Kiggins Road, its telephone is 419.692.8846, and its trustees meet
  on the second and fourth Monday of the month at 7:00 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.814513, -84.319250, landmarked
  `MARION TOWNSHIP ROAD & POLICE DEPT`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  **It has its own police force.** The county's address file landmarks the building at
  the township house address as `MARION TOWNSHIP ROAD & POLICE DEPT`. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md). Three of the twelve townships here run police departments; the
  other nine are policed by the county sheriff.

  Its territory contains [Delphos](../place/delphos.yml)'s Allen County half, and it is one of only
  two subdivisions in the county that grew between 2020 and 2024.

  **Set off from the north end of Amanda in December 1833** by the Allen County commissioners, and
  recomposed in the [reorganization of 1848](../event/reorganization-of-1848.yml) — see
  [the place](../place/marion-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **Its first trustees after the 1848 change were Christian Stukey, Michael Swisher and Thomas J.
  Fair**, with William J. Cochran clerk and Ferdinand Miller treasurer; William Brady and William
  Scott were named road commissioners to open the Auglaize & Van Wert road. [verified] — same source.

  [open] Who its trustees are **now**. The county's site gives this government a house, a telephone
  and a meeting schedule and names nobody; the 1885 book names the board that took office a century
  and a half ago. The corpus can say who governed this township first and not who governs it today.
