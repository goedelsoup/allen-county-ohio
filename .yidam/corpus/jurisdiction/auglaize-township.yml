class: jurisdiction
label: Auglaize Township (government)
description: |
  The township government whose territory is [Auglaize Township](../place/auglaize-township.yml). Its township house
  is at 7726 Bellefontaine Road, its telephone is 419.648.7144, and its trustees meet
  on the first and third Monday of the month at 7:30 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.676380, -83.959923, landmarked
  `AUGLAIZE TOWNSHIP HOUSE & GARAGE`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  Its territory holds two settlements, [Harrod](../place/harrod.yml) and
  [Westminster](../place/westminster.yml), and it is one of only two civil subdivisions in the
  county that gained population between 2020 and 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md).

  The township house is a house and a garage at one address, which is the ordinary arrangement here
  and is worth stating because the exceptions — American, Perry, Shawnee and Marion, which run
  separate administration, police or road buildings — are the townships wrapped around Lima.

  **Established March 5, 1832 by order of the Allen County commissioners** — the first township
  the county's own board created rather than inherited — see
  [the place](../place/auglaize-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **Its first township board was Tolson Ford, William Gilmore and James Watt as trustees, with
  Tolson Ford also justice of the peace** — a board of three in a township whose first cabin was
  built by John Goode. [verified] — same source.

  **Who governs it now.** Its trustees are Michael D. Stout and Stephen Glen Ewing, both to
  31 December 2029, and Russell B. Winegardner to 31 December 2027; its fiscal officer is Melissa
  Renee Marshall, to 31 March 2028. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **One of those four is the only appointed township officer in Allen County.** Winegardner is
  marked `*Appointed*`, and he is also the only one of the county's forty-eight township officers
  the roster gives a party. [verified] — same source, and
  [the seat count](../measure/allen-county-elected-seats-2026.yml).

  [open] Whether those two facts go together — whether a party letter appears on a nonpartisan
  office precisely because the seat was filled between elections rather than at one — is not
  something the roster says.
