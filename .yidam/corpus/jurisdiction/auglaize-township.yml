class: jurisdiction
label: Auglaize Township (government)
description: |
  The township government whose territory is [Auglaize Township](../place/auglaize-township.yml). Its township house
  is at 7726 Bellefontaine Road, its telephone is 419.648.7144, and its trustees meet
  on the first and third Monday of the month at 7:30 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.676380, -83.959923, landmarked
  `AUGLAIZE TOWNSHIP HOUSE & GARAGE`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  Its territory holds two settlements, [Harrod](../place/harrod.yml) and
  [Westminster](../place/westminster.yml), and it is one of only two civil subdivisions in the
  county that gained population between 2020 and 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md).

  The township house is a house and a garage at one address, which is the ordinary arrangement here
  and is worth stating because the exceptions — American, Perry, Shawnee and Marion, which run
  separate administration, police or road buildings — are the townships wrapped around Lima.

  [open] When the township was erected, under what order, and who its trustees are. The county's
  site names no officers and gives no dates.
