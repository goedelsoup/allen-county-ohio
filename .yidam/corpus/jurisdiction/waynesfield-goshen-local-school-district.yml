class: jurisdiction
label: Waynesfield-Goshen Local School District
description: |
  An Auglaize County district with the thinnest reach into Allen of any of the twelve — 2,698
  people over 62.864 square miles, internal point 40.591434, -83.964064, serving PK–12.
  [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school
  district file, and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  It is three counties wide and almost entirely in one: 2,629 people in Auglaize, 52 in Logan and
  **17 in Allen**, on two blocks at the south-east corner of
  [Auglaize Township](../place/auglaize-township.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block.

  Seventeen people over two blocks is the floor of what this corpus can find and still call a
  finding. It is recorded because the alternative is a corpus that says
  [Auglaize Township](../place/auglaize-township.yml) is served by one district when it is served
  by two, which is the kind of error that only ever hurts the people in the smaller share.

  **Its board is not on Allen County's roster.** A school board is elected by its own district's
  voters, and this district's centre is in Auglaize County. [verified] — [the elected officials
  roster](../../catalog/ohio-boe-elected-officials-allen.md).

  [open] Who its board members are. The Auglaize County roster would name them.

  **It is the smallest district holding ground in this county and the second-highest spender per
  pupil.** 472 pupils in 2023 against 590 in 2010 — a fall of 20.0 per cent, one of the three
  steepest here — at $17,896 a pupil on 10.2 per cent child poverty. [verified] —
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml), [the finance
  survey](../measure/allen-county-school-finance-2023.yml) and [child
  poverty](../measure/allen-county-school-district-poverty-2023.yml).
