class: jurisdiction
label: City of Delphos
description: |
  The municipal corporation governing [Delphos](../place/delphos.yml), the county's second city.
  **It is the only municipality here made by merger**: the county records that Delphos was
  originally four towns — Howard, Section Ten, West Bredeick and East Bredeick — which combined
  into one in 1851. [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages page.

  Its territory crosses the Allen–Van Wert county line, and its 7,117 people divide 3,935 in Allen
  and 3,182 in Van Wert. [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md) block population and
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md). It is therefore the second corporation in this
  corpus, after [the Village of Bluffton](village-of-bluffton.yml), whose ground is not contained
  by one county — and unlike Bluffton, whose village is split between two school districts, this
  city's schools follow the corporation across the line entire.

  **The corporation dates from an act of February 7, 1851.** Its first election was held March 3 of
  that year and returned Lester Bliss as mayor, Smith Talbott as recorder and five councilmen;
  F. J. Lye as treasurer and E. N. Talbott as marshal were elected on March 21. The corporation
  spent $80.67 in its first year. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans carrying the act's date. So 1851 is
  not only the year four settlements became one settlement — it is the year they became one
  corporation, by a single act, and the merger and the incorporation are the same event.

  **Who governs it now, as far as an Allen County source can see.** Andre Patrick McConnahea is
  mayor, Adam J. Kayser auditor and Andrew D. Knueve (R) director of law, all to 31 December 2027;
  Barbara J. Mesker (R) is treasurer to 31 December 2029. Mark Clement is president of council by
  appointment. Its three at-large council members are Michael J. Edelbrock (D) and, by appointment,
  Josh Bayliff and Scott Wiltsie. Michel A. Clement holds the 1st ward seat and Randy J. McElroy
  the 2nd, both by appointment. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **Five of these ten seats are held by appointees, and the ten are not the whole government.** This
  roster is a county's roster, and 3,182 of the city's 7,117 people live in Van Wert County: a ward
  seat is voted on inside its ward, so any ward of this city lying west of the line is invisible
  here. The corpus does not read these ten as the council of Delphos. [inference] Compare
  [Bluffton](village-of-bluffton.yml), whose council is elected at large and therefore appears
  whole in an Allen County roster despite the same kind of split. [verified] — [the seat count](../measure/allen-county-elected-seats-2026.yml).

  [open] How many wards this city has, and who holds the seats this county cannot see.

  **It files with the federal government twice.** "Delphos, City of (Allen County)" and "Delphos,
  City of (Van Wert County)" are two registered applicants for federal disaster aid, with two
  identifiers, and both were paid — $41,075 for the storm of 2012 and $7,710 for the winter of
  2004–05. [verified] —
  [OpenFEMA assistance programs](../../catalog/openfema-assistance-programs.md); see
  [who was paid](../measure/allen-county-disaster-aid-applicants-2005-2025.yml). **One municipal
  corporation on a county line is two rows in a file keyed to counties**, which is the same shape as
  a Lima address that is not in Lima. [inference] — see
  [a grant file counts offices, not ground](../../decisions/a-grant-file-counts-offices-not-ground.yml).

  [open] When it became a city rather than a village. The 1885 book calls it a village throughout,
  so the transition is later than this source can see.
