class: jurisdiction
label: Delphos City School District
description: |
  A district of 9,903 people over 53.041 square miles on the county's western edge, internal point
  40.829646, -84.35015, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  **It is a Van Wert County district as much as an Allen County one.** 5,696 of its people are in
  Allen County and 4,207 in Van Wert — 57 per cent against 43. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block. Its Allen County ground is 5,547 people of
  [Marion Township](../place/marion-township.yml) and 149 of
  [Spencer Township](../place/spencer-township.yml).

  It holds the whole of [Delphos](../place/delphos.yml) — all 7,117 people on both sides of the
  county line, in one district. [verified] — same source. That is the fact worth keeping: the city
  is split between two counties and its schools are not. Where a municipal boundary and a county
  boundary disagree, the school district followed the municipality.

  **Who governs it now.** Its five board members are Matthew Richard Weitzel (R), Rebecca Suever and
  Wesley Aaron Ditto to 31 December 2029, and Karen Kay Grothouse and Lynn M. Bockey to 31 December
  2027; Weitzel and Suever were appointed. [verified] — [the elected officials
  roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **It lost a fifth of its pupils**, 1,113 to 888 between 2010 and 2023 — very nearly
  [Lima](lima-city-school-district.yml)'s rate of loss, in a district a quarter the size.
  [verified] —
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml). It spends $12,539 a pupil
  on 58.7 per cent local revenue — the second-highest local share in
  the county — and 10.6 per cent child poverty. [verified] — [the finance
  survey](../measure/allen-county-school-finance-2023.yml) and [child
  poverty](../measure/allen-county-school-district-poverty-2023.yml).
