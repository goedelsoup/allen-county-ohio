class: jurisdiction
label: Amanda Township (government)
description: |
  The township government whose territory is [Amanda Township](../place/amanda-township.yml). Its township house
  is at 690 S. Conant Road, its telephone is 419.647.6259, and its trustees meet
  on the first and third Wednesday of the month at 8:00 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.729304, -84.280797, landmarked
  `AMANDA TOWNSHIP HOUSE`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  Its house carries a **Spencerville** postal address, and Spencerville is a village in
  [Spencer Township](../place/spencer-township.yml), not in this one. The county's own address file
  gives the building a blank `MUNI` — its answer for *in no municipality* — and the coordinate falls
  inside Amanda Township. [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and
  [TIGERweb](../../catalog/tigerweb-census2020.md), point-in-polygon against the 2020 county-subdivision layer.

  This is a township with no incorporated place in it and no school district named for it: its
  2,061 people are divided among three districts centred elsewhere.

  [open] When the township was erected, under what order, and who its trustees are. The county's
  site names no officers and gives no dates.
