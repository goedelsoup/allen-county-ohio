class: jurisdiction
label: Monroe Township (government)
description: |
  The township government whose territory is [Monroe Township](../place/monroe-township.yml). Its township house
  is at 8500 Slabtown Road, its telephone is 419.641.5430, and its trustees meet
  on the second and fourth Monday of the month at 7:00 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.861214, -84.051203, landmarked
  `MONROE TOWNSHIP HOUSE`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  **Its township house has a Putnam County postal address.** The county gives it as
  `8500 Slabtown Road, Columbus Grove, Ohio 45833`, and Columbus Grove is a village in Putnam
  County. The building's coordinate is inside Monroe Township, in Allen County, and its `MUNI` is
  blank. [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  It is the sharpest case in the corpus of a postal address naming the wrong county, and it sits
  beside the same township's school geography: 489 of its people are in the Columbus Grove Local
  district, which is also a Putnam County body. The postal address and the school district are
  independent facts that happen to point the same way.

  **Organized in 1835 as a township of Putnam County**, and not in Allen County until the
  [reorganization of 1848](../event/reorganization-of-1848.yml), which let it keep both its name
  and its organization — see [the place](../place/monroe-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **John Peters, Peter Harpster and Anthony Early were its first trustees**, with Benjamin Parker
  clerk and Luke Tipton justice of the peace. N. G. Kidd was still its clerk fifty years later. [verified] — same source.

  **Who governs it now.** Its trustees are Aaron Patrick Vorst and Mark E. Diller, both to
  31 December 2029, and Jon E. Basinger, whose term the roster runs to 31 December 2027 without
  giving its start; its fiscal officer is Amy S. Stechschulte, to 31 March 2028. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **All four were elected, and the village inside this township elected one officer of seven.**
  [Cairo](village-of-cairo.yml)'s mayor was elected; its six council seats are five appointees and
  a vacancy, with no elected member sitting. [verified] —
  [the seat count](../measure/allen-county-elected-seats-2026.yml). The same 508 people are
  governed by a board they filled and a council they did not. [inference]
