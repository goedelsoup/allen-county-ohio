class: jurisdiction
label: Shawnee Township (government)
description: |
  The township government whose territory is
  [Shawnee Township](../place/shawnee-township.yml). Its township house is at 2530 Ft. Amanda
  Road, its telephone is 419.991.8706, and its trustees meet on the second and fourth Monday of
  the month at 10:00 a.m. — the only board in the county that meets in the morning. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  **No municipality shares its ground.** Its territory holds 12,482 people — the county's second
  most populous civil subdivision — and contains no incorporated place at all, so everything a
  village government would do here is done by this board. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md) block population. The county's address file
  landmarks four separate township buildings at or beside 2530 Ft. Amanda Road — administration,
  police, road department and fire — which no other township here approaches. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  Ohio townships are governed by a three-member board of trustees and a fiscal officer, all
  elected. [inference] The county's site does not say so; it says only that trustees meet, which
  is the part this corpus can cite.

  Its `territory-within` edge to the county records nesting of ground and not subordination
  of authority: an Ohio township is a creature of the state, not of the county whose ground
  contains it, and the county commissioners do not direct it. That distinction is the reason
  the edge is named `territory-within` rather than `part-of`.

  [open] When the township was erected, under what order, and who its trustees are.
