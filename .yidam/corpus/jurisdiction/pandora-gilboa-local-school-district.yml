class: jurisdiction
label: Pandora-Gilboa Local School District
description: |
  A Putnam County district whose southern edge crosses into Allen — 3,502 people over 67.625
  square miles, internal point 41.000054, -83.948062, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  3,463 of its people are in Putnam County and **39 in Allen**, across seven blocks in the north
  of [Richland Township](../place/richland-township.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block.

  Thirty-nine people is close to the smallest reach a corpus can be asked to record and still
  matter, and it is the reason the count is stated rather than the fraction. One per cent of a
  district is a rounding error; thirty-nine named residents of a township are not.

  **Its board is not on any Allen County ballot, and it is on Allen County's roster.** No Allen
  precinct votes on it, and the same roster queried by district type returns the board. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md), both views; see
  [the school boards](../measure/allen-county-school-boards-2026.yml).

  **Its board is Angie Basinger, Phillip R Buell and Vance Nofziger to 31 December 2027, and Jeff
  Gerding and Jeffrey A Kempf to 31 December 2029.** [verified] — same source. Buell's term has an
  expiry and no commencement on either county's page. [open] How he came to the seat.

  521 pupils, the second-smallest district holding ground here, at $15,610 of current spending a
  pupil — the third-highest figure in the county, on 6.6 per cent child poverty. [verified] —
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml),
  [the finance survey](../measure/allen-county-school-finance-2023.yml) and [child
  poverty](../measure/allen-county-school-district-poverty-2023.yml). Cost per pupil here is a
  fact about size and not about need. [inference]
