class: jurisdiction
label: Village of Bluffton
description: |
  The municipal corporation governing [Bluffton](../place/bluffton.yml). Its territory
  crosses the Allen–Hancock county line, which makes it the corpus's worked case of a
  jurisdiction whose ground is not contained by one county. [verified] — the county-line
  crossing is recorded by the Census Bureau's `(pt.)` designation in
  [Census Population Estimates](../../catalog/census-popest-2024.md).

  A `territory-within` edge to Allen County's government would therefore be false as an
  unqualified claim, and none is written: part of this village's territory is not within it.
  That absence is deliberate and is the kind of edge the corpus declines to assert rather
  than approximate.

  **Who governs it now.** Richard Lee Johnson (R) is mayor to 31 December 2027. Its six council
  members are Benjamin Lawrence Stahl and Joseph W. Sehlhorst to 31 December 2027, and Elizabeth A.
  Gordon Hancock, Phillip A. Talavinia, Thomas L. Downey and Robert Benjamin Hill (R) to
  31 December 2029; Hill was appointed. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **The county's largest village is also the one that appoints least.** One of its seven elective
  seats is held by an appointee, against four of seven in Lafayette and in Spencerville, and all
  five seated members of Cairo's council. [verified] — [the seat count](../measure/allen-county-elected-seats-2026.yml).

  Its council is elected at large rather than by ward, which is why the Allen County roster carries
  all six seats of a village whose people are split between two counties: every voter in it votes
  on every seat. [inference] Compare [Delphos](city-of-delphos.yml), where the ward seats are
  county-scoped and the roster reaches only part of the council.
