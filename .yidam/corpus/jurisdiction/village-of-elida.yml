class: jurisdiction
label: Village of Elida
description: |
  The municipal corporation governing [Elida](../place/elida.yml), **incorporated in 1878** —
  the same year as [Beaverdam](village-of-beaverdam.yml), twenty miles across the county — over a
  settlement established in 1852. [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages page.

  **The mechanism is now known for Beaverdam and it is a county proceeding, not a state act.**
  Beaverdam was organized "under authority of the commissioners, granted May 13" 1878, and
  [Lafayette](village-of-lafayette.yml) the same way in 1867. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). This village's own
  incorporation is confirmed for 1878 by the same source, which names **R. R. Murray** as its first
  mayor, records his resignation that November, R. Rice appointed president in the interim and Dr.
  John Sherrick chosen mayor in February 1879 — and does not say by whose authority. [verified] —
  same source.

  So the coincidence is no longer a wave and no longer a mystery: villages in this county were
  incorporated by the county commissioners on petition, one at a time, and two petitions reached
  the same board in the same year. [inference] [open] Whether Elida's was that same proceeding is
  the one thing the source omits for this village while giving it for the other two.

  It governs 1,923 people over 1.102 square miles inside
  [American Township](../place/american-township.yml), and it is the only incorporated place in
  that township. [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md) and [Census Population Estimates](../../catalog/census-popest-2024.md).

  [open] Its officers, its form of government, and whether it operates under a charter.
