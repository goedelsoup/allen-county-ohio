class: jurisdiction
label: Village of Beaverdam
description: |
  The municipal corporation governing [Beaverdam](../place/beaverdam.yml), **incorporated in
  1878**, twenty-five years after the settlement it governs was established in 1853. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page.

  That twenty-five-year gap is why this corpus separates `place` from `jurisdiction`, stated as a
  measured interval rather than an argument. For a quarter of a century there was a Beaverdam and
  no Village of Beaverdam: a name, a settlement and ground, with no corporation, no council and no
  boundary that annexation could move. The place node carries 1853 and this one carries 1878, and
  neither year belongs to the other.

  It governs 319 people over 0.63 square miles, wholly inside Allen County and inside
  [Richland Township](../place/richland-township.yml). [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md) and
  [Census Population Estimates](../../catalog/census-popest-2024.md).

  **It was organized in 1878 under authority of the county commissioners, granted May 13 that
  year**, with Joseph Shull elected mayor and Albert Shull clerk; they served until 1881.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The village had been platted twenty-five years earlier by **Frederick
  Shull** — so the men who took the corporation's first two offices carry the founder's surname.

  **Who governs it now.** Todd Aaron Long is mayor to 31 December 2027. Its six council members are
  Anthony E. Myers and Carl L. Murray to 31 December 2027, and Jerry A. Neuenschwander, Thomas Joe
  Nowlan, Barbara Ann Gossard and Tyler James Powley to 31 December 2029; the last two were
  appointed. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  Two of seven is the second-lightest use of appointment among the county's seven villages, and
  this is the smallest of them. [verified] —
  [the seat count](../measure/allen-county-elected-seats-2026.yml). Whichever way village seats
  come to be filled by appointment here, it is not a straightforward matter of size. [inference]

  [open] Its form of government, and whether it operates under a charter.
