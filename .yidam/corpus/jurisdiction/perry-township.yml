class: jurisdiction
label: Perry Township (government)
description: |
  The township government whose territory is [Perry Township](../place/perry-township.yml). Its township house
  is at 2408 E. Breese Road, its telephone is 419.221.2412, and its trustees meet
  on the first and third Tuesday of the month at 7:30 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.687591, -84.060925, landmarked
  `PERRY TOWNSHIP ADMINISTRATION BUILDING`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  It runs an administration building at the township house address and a police
  department a hundred yards east at 2501 E Breese Road. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  Its territory is the ground of the smallest school district lying wholly inside the county, and
  303 of that district's people live inside Lima rather than here.

  [open] When the township was erected, under what order, and who its trustees are. The county's
  site names no officers and gives no dates.
