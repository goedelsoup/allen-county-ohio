class: jurisdiction
label: Perry Township (government)
description: |
  The township government whose territory is [Perry Township](../place/perry-township.yml). Its township house
  is at 2408 E. Breese Road, its telephone is 419.221.2412, and its trustees meet
  on the first and third Tuesday of the month at 7:30 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.687591, -84.060925, landmarked
  `PERRY TOWNSHIP ADMINISTRATION BUILDING`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  It runs an administration building at the township house address and a police
  department a hundred yards east at 2501 E Breese Road. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  Its territory is the ground of the smallest school district lying wholly inside the county, and
  303 of that district's people live inside Lima rather than here.

  **Established by the county board in December 1833 and organized in April 1834** at the house of
  Joseph Crossley — see [the place](../place/perry-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **Hugh Skilling Sr., John Ridenour and Joseph Crossley were elected trustees**, with Moses
  McDonald justice of the peace and James Chenoweth clerk — the man whose house it met in serving
  on its first board. [verified] — same source.

  **Who governs it now.** Its trustees are Frank Eugene Clementz and Scott Stombaugh, both to
  31 December 2029, and Kevin Walter Cox to 31 December 2027; its fiscal officer is Christina Rene
  Stombaugh, whose term the roster runs to 31 March 2028 without giving its start. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md). This corpus now names the board of this township twice, a hundred and ninety-two years
  apart: the three men elected at Joseph Crossley's house in 1834, and the three serving in 2026.
