class: jurisdiction
label: Allen East Local School District
description: |
  A district of 5,908 people over 72.263 square miles in the east of the county, internal point
  40.721894, -83.954012, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  **It is the only one of the twelve whose name is not on any map of the county.** The other
  eleven carry the name of a village, a city or a township; this one carries the county's name and
  a compass direction, which is what a district looks like when it is assembled out of ground
  rather than grown from a town. It spans [Jackson Township](../place/jackson-township.yml) entire
  (3,143),
  [Auglaize Township](../place/auglaize-township.yml) all but 17 people (2,740), and 25 people of
  [Perry Township](../place/perry-township.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block.

  It holds three settlements and no large one: [Harrod](../place/harrod.yml) 423,
  [Lafayette](../place/lafayette.yml) 406, and [Westminster](../place/westminster.yml) 406 —
  1,235 people in named places out of 5,908. [verified] — same source.

  **Who governs it now.** Its five board members are Casey Craig Counts, Claire D. Mackey and
  Crosby L. McDorman to 31 December 2029, and Jason R. Werling and Steven Michael Emerick to
  31 December 2027. [verified] — [the elected officials
  roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **It is the steadiest district in the county.** 1,073 pupils in 2010 and 1,065 in 2023 — a fall of
  eight, where the twelve together lost 1,872. [verified] —
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml). It spends $10,941 a pupil,
  second
  lowest, on 37.0 per cent local revenue and 7.9 per cent child poverty. [verified] — [the finance
  survey](../measure/allen-county-school-finance-2023.yml) and [child
  poverty](../measure/allen-county-school-district-poverty-2023.yml).
