class: jurisdiction
label: Bath Local School District
description: |
  A district of 12,101 people over 44.495 square miles north-east of Lima, internal point
  40.79708, -84.060212, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  It lies wholly inside Allen County and is **not** the same ground as the township it is named
  for. All 9,399 people of [Bath Township](../place/bath-township.yml) are in it — 255 of the
  township's 256 blocks, the exception an unpopulated one that belongs to the Lima City district —
  but so are 1,573 residents of [Lima](../place/lima.yml) and 1,129 of
  [Monroe Township](../place/monroe-township.yml). A fifth of the district lives outside its
  namesake. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block.

  It contains one incorporated place, [Cairo](../place/cairo.yml) and its 517 people. [verified]
  — same source.

  **Most of its Lima share is one block with no housing in it.** 1,360 of those 1,573 city
  residents are in census block `390030112001004`, which holds zero housing units — a group
  quarters, not a neighbourhood. [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md)
  block layer. So the number of Lima *households* in this district is nearer 213 than 1,573, and
  [what stands on that block](../question/who-lives-in-the-county-without-housing.yml) is an open
  question.

  **Who governs it now.** Its five board members are Jessica M. Kelley and Philip C. White to
  31 December 2029, and Michael Thomas Leidy, Rick Allen Kennedy Jr. and Stephanie A. Ernest to
  31 December 2027. [verified] — [the elected officials
  roster](../../catalog/ohio-boe-elected-officials-allen.md).

  1,692 pupils in 2023 against 1,803 in 2010; $12,305 of current spending a pupil, 53.4 per cent of
  revenue local; 12.4 per cent child poverty. [verified] —
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml),
  [the finance survey](../measure/allen-county-school-finance-2023.yml) and
  [child poverty](../measure/allen-county-school-district-poverty-2023.yml).

  [open] What share of its property tax comes from the industrial ground in this township. The
  survey reports one figure for property tax and does not divide it.
