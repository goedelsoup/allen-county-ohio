class: jurisdiction
label: Village of Cairo
description: |
  The municipal corporation governing [Cairo](../place/cairo.yml), 517 people over 0.277 square
  miles inside [Monroe Township](../place/monroe-township.yml). [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md) and
  [Census Population Estimates](../../catalog/census-popest-2024.md).

  **Its name changed and its ground did not.** The settlement was established in 1848 as *West
  Cairo* and the name became Cairo in 1922. [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and
  villages page. Whether the 1922 change was an act of the corporation, of the Post Office, or of
  the Census Bureau is not stated, and the three are different events with different
  consequences — which is the same distinction the corpus draws for
  [Fort Shawnee](../question/what-happened-to-the-village-of-fort-shawnee.yml) in the other
  direction. [open]

  It shares a fire and rescue service with the township it sits in, landmarked
  `CAIRO-MONROE TOWNSHIP VOLUNTEER FIRE & RESCUE`. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  **Who governs it now, and it is the sharpest case of appointment in the county.** John M.
  Vandemark is mayor to 31 December 2027, elected. Its six council seats are Bruce Jerome Painter
  and Gary M. Acheson to 31 December 2027, Bradley A. Clark, Jack Alan Arnold and Miles Lowell
  Bicknell to 31 December 2029, and one seat vacant — and all five sitting members are marked
  appointed. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md). **No elected member sits on this village's council.**

  Its 508 people are governed by two boards: this one, and
  [Monroe Township](monroe-township.yml)'s, whose four officers were all elected. [verified] — [the seat count](../measure/allen-county-elected-seats-2026.yml).
  The same electorate filled one government and not the other. [inference]

  **It was organized on 12 April 1875, on the commissioners' authority and the petition of
  forty-one citizens**, with Dr. J. S. Clippinger as its first mayor — twenty-seven years after the
  ground was platted. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md); see
  [the organization](../event/the-organization-of-cairo-1875.yml). **So the corporation is named
  Cairo forty-seven years before the place is**, and the 1921 history was still calling the
  incorporated village West Cairo in 1920. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).
