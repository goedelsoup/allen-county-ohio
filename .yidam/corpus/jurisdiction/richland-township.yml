class: jurisdiction
label: Richland Township (government)
description: |
  The township government whose territory is [Richland Township](../place/richland-township.yml). Its township house
  is at 8435 N. Dixie Highway, its telephone is 419.358.4897, and its trustees meet
  on the second and fourth Tuesday of the month at 8:00 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.862153, -83.934326, landmarked
  `RICHLAND TOWNSHIP GARAGE`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  The county's address file landmarks the building at that address as
  `RICHLAND TOWNSHIP GARAGE` and nothing else — the only one of the twelve whose sole landmark is
  a works building rather than a hall, house or administration office. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  Its territory holds [Bluffton](../place/bluffton.yml)'s Allen County half and
  [Beaverdam](../place/beaverdam.yml), and 39 of its people are in a Putnam County school
  district.

  **Organized in 1835 as a township of Putnam County**, on David Miller's petition, and not in
  Allen County until the [reorganization of 1848](../event/reorganization-of-1848.yml) — see
  [the place](../place/richland-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **Henry Shank and Daniel Goble were its first justices of the peace and Henry Carter its first
  constable.** Carter's recollection, fifty years later, is the source for the township's name. [verified] — same source.

  [open] Who its trustees are **now**. The county's site gives this government a house, a telephone
  and a meeting schedule and names nobody; the 1885 book names the board that took office a century
  and a half ago. The corpus can say who governed this township first and not who governs it today.
