class: jurisdiction
label: Bluffton Exempted Village School District
description: |
  A district of 6,438 people over 52.909 square miles in the county's north, internal point
  40.865493, -83.95681, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  6,281 of its people are in Allen County and 157 in Hancock — it reaches **out** across the
  county line, which the district-level tally this node was first written from could not see.
  [verified] — [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md)
  crossed with TIGERweb block geography, block by block. Its Allen County ground is 5,832 people
  of [Richland Township](../place/richland-township.yml) and 449 of
  [Monroe Township](../place/monroe-township.yml).

  **It does not hold all of Bluffton.** 3,875 of the village's 3,967 people are in it and 92 are
  in the Cory-Rawson Local district, on the Hancock County side. [verified] — same source. It also
  holds [Beaverdam](../place/beaverdam.yml) and its 319 people, six miles south-west, which is the
  older fact this node was missing: the district is named for one village and serves two.
