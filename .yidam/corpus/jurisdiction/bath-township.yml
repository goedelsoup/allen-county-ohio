class: jurisdiction
label: Bath Township (government)
description: |
  The township government whose territory is [Bath Township](../place/bath-township.yml). Its township house
  is at 2880 Ada Road, its telephone is 419.221.1797, and its trustees meet
  on the first and third Tuesday of the month at 7:00 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.759189, -84.051832, landmarked
  `BATH TOWNSHIP BOARD OF TRUSTEES`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  The county's address file landmarks the building as `BATH TOWNSHIP BOARD OF TRUSTEES`
  and a township garage at the same address. [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md). That
  landmark is the closest thing in any retrieved source to a statement that the board exists as a
  body with a place to sit.

  Its postal address is Lima, and the coordinate is inside Bath Township. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md).

  **It is older than the county's government and its erection is on no record.** The 1885
  compiler, working from the commissioners' books, found "no record of its establishment either in
  the records of Allen or Mercer County" — see [the place](../place/bath-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **A second compiler looked thirty-six years later and reported the same absence.** "While it is
  known that Bath was an organized township before official records were made in Allen County,
  neither the records of Allen nor Mercer give the time of its organization. ... Bath Township is at
  least contemporary with Allen County." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). **This
  node's blank `erected` field is therefore a property of the record and not of this corpus**, and
  it is the only one of the county's thirty-eight jurisdictions of which that can be said.
  [inference] — see
  [a count of absences is not an agenda](../../decisions/a-count-of-absences-is-not-an-agenda.yml).

  **Its justices by 1831 were [Christopher Wood](../person/christopher-wood.yml), John Schrouf and
  James Daniels**, when Bath "had civil jurisdiction over nearly all Allen County" — which makes
  this government, not the county's, the first civil authority over most of this ground. [verified] — same source.

  **Who governs it now.** Its trustees are Andrew F. Heffner and Brad A. Baxter, both to
  31 December 2029, and Lisa R. Fillhart to 31 December 2027; its fiscal officer is Berlin Ralph
  Carroll II, whose term the roster runs to 31 March 2028 without giving its start. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  [open] The corpus can now name every officer of this government and still cannot name the year it
  was erected. `erected` is absent above, and no source read here has supplied it.
