class: jurisdiction
label: Village of Lafayette
description: |
  The municipal corporation governing [Lafayette](../place/lafayette.yml), **incorporated in
  1868** — the earliest incorporation date this corpus holds for any municipality in the county.
  [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages page.

  It governs 406 people over 0.233 square miles inside
  [Jackson Township](../place/jackson-township.yml). Its corporate boundary is also, exactly, a
  voting precinct and nothing else: precinct `LAFAYETTE` holds every block of the village and no
  block outside it. [verified] — [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. The village shares a fire department with the township, at an
  address two doors from the township house. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  **The commissioners granted authority to organize it on September 3, 1867**, on M. C. Murnagh's
  petition, and the first election was held March 13, 1868 — William Smith, William Maginnis and
  T. W. Corbett judges, James Fookes and S. Knoble clerks of election, Murnagh himself elected.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The county's website gives "1868" and collapses two dates in different years.

  **Who governs it now.** Jeffrey S. McVicker is mayor to 31 December 2027. Its six council members
  are Matthew Christophe Hager and Robert Lynn Hutchinson to 31 December 2027, and Adam W. Hawk,
  James Alan Wireman, Matthew Allan McKinley and Michael H. Hefner to 31 December 2029; Hutchinson,
  Hawk, Wireman and McKinley were appointed. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **This village and the township it sits in are run out of the same building**, 225 E. Sugar
  Street, and the two are staffed in opposite ways: [Jackson Township](jackson-township.yml)
  elected all four of its officers and four of this council's six were appointed. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md) and [the seat count](../measure/allen-county-elected-seats-2026.yml).

  [open] Its form of government, and when the settlement was established — the county gives this
  village an incorporation year and no founding year, which is the reverse of what it gives most of
  the others.
