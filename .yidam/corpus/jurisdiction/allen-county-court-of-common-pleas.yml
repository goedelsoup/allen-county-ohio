class: jurisdiction
label: Allen County Court of Common Pleas
description: |
  The county's trial court of general jurisdiction, and the first court in this corpus. It is a
  jurisdiction rather than an organization because it holds authority over a defined territory —
  the county — under an instrument that creates it, which is what this class is for.

  **It is divided five ways by its own rules and staffed four.** The court's local rules, adopted
  under Article IV, Section V(B) of the Ohio Constitution and effective 1 February 2023, govern
  practice "in the General Trial Division, Criminal Division, Domestic Relations Division, and where
  applicable, the Juvenile Division and Probate Division". [verified] —
  [the court's local rules](../../catalog/allen-county-common-pleas-local-rules.md). Four judges are
  elected, to the [General](../office/judge-of-the-common-pleas-general-division.yml) (two seats),
  [Domestic Relations](../office/judge-of-the-common-pleas-domestic-relations-division.yml) and
  [Probate](../office/judge-of-the-common-pleas-probate-division.yml) divisions. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md). The
  Criminal Division has no separately elected judge. [inference]

  **Three sources divide this court three ways and none of them is wrong.** The rules divide
  practice into five, the county's site divides it into three offices with their own sites, and the
  ballot divides it into four seats. They are answers to different questions and the corpus keeps
  all three rather than picking one. [inference]

  Its judges serve six years where every other elected officer of this county serves four.
  [verified] — same roster; the length is arithmetic on the term dates. [inference] Three of the
  four terms begin in February and one in January.

  Its records are kept by [the clerk of courts](../office/allen-county-clerk-of-courts.yml), an
  elected county officer who is not part of the court. [verified] —
  [the clerk's site](../../catalog/allen-county-official-site.md).

  [open] When this court was established, and under what instrument. Ohio's constitution provides
  for courts of common pleas in every county, and the corpus has not retrieved the act that seated
  one here or dated it against [the county's organization](../../corpus/question/when-allen-county-was-organized.yml).
properties:
  jurisdiction_type: court district
  seat: Lima
  authority_source: |
    Article IV, Section V(B) of the Ohio Constitution, cited by the court's own rules as the
    authority under which it adopts them. [verified] That section is the authority for the rules
    and not necessarily for the court's existence, which this corpus has not established. [open]
