class: jurisdiction
label: Allen County (government)
description: |
  The county government: the unit of general-purpose government whose territory is
  [Allen County](../place/allen-county.yml). Ohio counties are administrative subdivisions of
  the state rather than home-rule corporations. [inference]

  **Nine separately elected offices govern Allen County, and eleven people hold them, because the
  board of commissioners seats three.** [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  Each is now a node:
  [the board of commissioners](../office/allen-county-board-of-commissioners.yml), which has three
  members, alongside the [auditor](../office/allen-county-auditor.yml),
  [treasurer](../office/allen-county-treasurer.yml),
  [recorder](../office/allen-county-recorder.yml),
  [sheriff](../office/allen-county-sheriff.yml),
  [prosecuting attorney](../office/allen-county-prosecuting-attorney.yml),
  [clerk of courts](../office/allen-county-clerk-of-courts.yml),
  [coroner](../office/allen-county-coroner.yml) and
  [engineer](../office/allen-county-engineer.yml). [verified] — same source.

  That sentence stood on this node as an untethered `[inference]` for nine phases, naming all nine
  offices while the corpus held nodes for one of them. See
  [a deep instance can hide an empty class](../../decisions/a-deep-instance-can-hide-an-empty-class.yml).

  This node exists apart from the place of the same name because the two have different
  histories: the ground was ceded in 1818 and the county was laid out in 1820, but the
  government was not organized and did not begin exercising authority until later. [open]
  The exact organization date has not been confirmed against a primary source — see
  [when Allen County's government was organized](../question/when-allen-county-was-organized.yml).
properties:
  jurisdiction_type: county
  erected: "1820"
  seat: Lima
  fips_code: "39003"
  authority_source: |
    An act of the Ohio General Assembly laying out the county from lands ceded at the
    Treaty of St. Marys. [inference] — the act itself has not been retrieved.
