class: jurisdiction
label: Lima Municipal Court
description: |
  **Its name says Lima and its territory is the county.** "The Lima municipal court has jurisdiction
  within Allen county." [verified] —
  [Ohio Revised Code §1901.02](../../catalog/ohio-revised-code.md), quoted verbatim. The general
  rule in the same section is that municipal courts "have jurisdiction within the corporate limits
  of their respective municipal corporations"; Lima is one of the named exceptions, and the
  exception is the whole county. [verified] — same source.

  So the court that hears a traffic case from [Spencerville](../place/spencerville.yml) or
  [Bluffton](../place/bluffton.yml) is called the Lima Municipal Court, and nothing in the name
  says so. See [the name is the seat, not the extent](../../decisions/the-name-is-the-seat-not-the-extent.yml).

  **A second source agrees without saying so.** Its two judges appear on the roster of *Allen
  County's* elected officials rather than Lima's, which is where they would appear if the court's
  electorate were the city. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).
  [inference] — a court's judges are elected by the electors of its territory, so a countywide
  electorate implies a countywide territory.

  **Two judges sit, on six-year terms**, which is the same length the
  [common pleas](allen-county-court-of-common-pleas.yml) judges serve and half again the four years
  every elected administrative officer of the county serves. [verified] — same roster. See
  [the office](../office/judge-of-the-lima-municipal-court.yml).

  [open] What this court's subject-matter jurisdiction is, and where it ends and the common pleas
  court's begins. The corpus has established the two courts' territories and neither's competence.
properties:
  jurisdiction_type: court district
  seat: Lima
  authority_source: |
    Ohio Revised Code §1901.02, which names this court and fixes its territory as Allen County.
    [verified]
