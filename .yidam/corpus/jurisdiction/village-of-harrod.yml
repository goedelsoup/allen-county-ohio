class: jurisdiction
label: Village of Harrod
description: |
  The municipal corporation governing [Harrod](../place/harrod.yml), 423 people over 0.234 square
  miles inside [Auglaize Township](../place/auglaize-township.yml). [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md)
  and [Census Population Estimates](../../catalog/census-popest-2024.md).

  The village was established in 1884 and is named for the Harrod family, who settled the ground
  in 1841 — forty-three years between the family and the village. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. It is the only municipality in the county the
  source names a family for; the others are named for a feature, a place elsewhere, or nothing it
  says.

  **Who governs it now, and most of it is nobody.** Mark Anthony Blake is mayor to 31 December
  2027, appointed. Of six council seats, one running to 31 December 2027 is vacant and Cheryl Renee
  Rodriguez holds the other on that term by appointment; of the four running to 31 December 2029,
  Christine Jean Hennis Decker was elected and Harry P. Romell, Ritchie D. Frisby and Zachary
  Joseph Voisin were appointed. Its board of public affairs has three seats and all three are
  empty. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **One person in this village's government of ten seats was put there by its voters.** Four seats
  are vacant, five are held by appointees, and the tenth is a council member elected in 2025.
  [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md),
  counted at [the seat count](../measure/allen-county-elected-seats-2026.yml). No other government
  in the county is close to that.

  [open] Why this one is. Nothing read here says whether the seats drew candidates.

  **Its incorporation is the one municipal founding date in this county that no book here holds,
  and the window is five years wide.** The 1885 history names Harrod as one of Auglaize Township's
  four post offices and gives it no corporation; the 1910 census returns *Harrod village* with 269
  people in 1890; the 1906 history prints a tax valuation for "Harrod corporation" in 1904. So the
  corporation existed by 1 June 1890 and, on the 1885 book's silence, not before that book went to
  press. [inference] —
  [the 1910 supplement](../measure/allen-county-townships-1890-1910.yml) and
  [the incorporations](../measure/allen-county-municipal-incorporations-1842-1904.yml). The county's
  own 1884 sits inside that window and is not corroborated here. [verified] —
  [the county's site](../../catalog/allen-county-official-site.md).

  [open] The instrument and the day. Every other village in the county was organized by an order of
  the commissioners, an act, or a ballot, and each is dated in a book; this one is in the
  commissioners' journal, which this corpus has never opened.
