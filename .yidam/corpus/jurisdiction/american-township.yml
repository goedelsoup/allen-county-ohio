class: jurisdiction
label: American Township (government)
description: |
  The township government whose territory is [American Township](../place/american-township.yml). Its township house
  is at 102 Pioneer Road, its telephone is 419.331.8651, and its trustees meet
  on the second and last Monday of the month at 7:30 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.782867, -84.189127, landmarked
  `AMERICAN TOWNSHIP ADMINISTRATION BUILDING`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  It governs the county's most populous township — 14,538 people, more than any civil
  subdivision but [Lima](../place/lima.yml) — and the building is landmarked as an *administration
  building* rather than a township house, which is what a township of that size looks like in a
  county file. It runs its own fire service from two further addresses on Elida Road and Edgewood
  Drive, and a third station inside [Elida](../place/elida.yml). [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md).

  **Erected December 6, 1831 under the name German**, by act of the Allen County commissioners —
  the county's third township, and this government's original name — see
  [the place](../place/american-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **The boundaries were extended in March 1833 and the town then regularly organized**, with John
  Brand, William Bowman and Samuel Richards elected trustees, **Griffith John** clerk and John
  Ireland justice of the peace. Griffith John, this township's first clerk, went on to petition
  for its enlargement, assess its district in 1846 and plat [Elida](../place/elida.yml) in 1852. [verified] — same source.

  **Who governs it now.** Its trustees are Jody M. Long and Paul Michael Basinger, both to
  31 December 2029, and Ross Michael Harmon to 31 December 2027; its fiscal officer is Brady M.
  Overholt, to 31 March 2028. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md). Four officers for 14,435 people, which is the
  county's largest township government and exactly the same four seats
  [Sugar Creek](sugar-creek-township.yml) fills for 1,398. [verified] —
  [the race table](../measure/allen-county-race-2023.yml) for both figures.
