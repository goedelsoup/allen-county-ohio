class: jurisdiction
label: Jackson Township (government)
description: |
  The township government whose territory is [Jackson Township](../place/jackson-township.yml). Its township house
  is at 225 Sugar Street, Lafayette, its telephone is 419.649.6482, and its trustees meet
  on the first and third Tuesday of the month at 7:00 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  **This is the only one of the twelve the county's address file does not landmark**, so it
  is the only township house here located by street address alone rather than by a coordinate
  checked against the township boundary. [open] Where the building stands is not independently
  confirmed.

  What the address file does carry is a fire department shared with the village: `LAFAYETTE &
  JACKSON TOWNSHIP FIRE DEPARTMENT IN LAFAYETTE AT 215 E SUGAR`, two doors from the township house
  address. [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md). Jackson is one of only two townships in the
  county lying entirely inside one school district; the other is Sugar Creek.

  **Erected June 6, 1831, on the first petition the Allen County commissioners ever granted** —
  see [the place](../place/jackson-township.yml). Re-formed as a congressional township in
  December 1834 after Auglaize, Perry and Bath had claimed sections back. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **William Watt, William Reese and Thomas Nash were the first trustees**, John Jamieson the first
  justice of the peace and Joseph Hall the first clerk. [verified] — same source.

  **Who governs it now.** Its trustees are Christopher L. Shafer and Michael Wayne Bassitt, both to
  31 December 2029, and James I. Shilling to 31 December 2027; its fiscal officer is Brandt C.
  Miller, to 31 March 2028. [verified] — [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **This township and the village inside it are administered from the same address.** The roster
  gives 225 E. Sugar Street, Lafayette for both this government and
  [the village of Lafayette](village-of-lafayette.yml). [verified] — same source. All four township
  officers were elected; four of the village's six council members were appointed. Two governments
  in one building, staffed in opposite ways. [verified] —
  [the seat count](../measure/allen-county-elected-seats-2026.yml).
