class: jurisdiction
label: City of Lima
description: |
  The municipal corporation governing [Lima](../place/lima.yml). Under Ohio law a
  municipality becomes a city rather than a village when its population passes 5,000, and it
  may adopt a home-rule charter; Lima has long been past that threshold. [inference]

  **The corporation was created on March 29, 1842, and the town is eleven years older.** Lima was
  platted in 1831 and for its first decade had no government of its own — the original town "was
  entirely controlled by the county commissioners". In 1841 the inhabitants petitioned the
  commissioners for a system of village government; the village was established, and the town was
  organized on March 29, 1842 with H. D. V. Williams as mayor, W. McHenry as recorder, and five
  trustees. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The county seat was thus a creature of the county board for eleven
  years before it was a corporation, which is the sharpest case in the corpus of why
  [the place](../place/lima.yml) and this node are separate things.

  [open] When it became a city rather than a village. The 1885 book still calls it a village, so
  the transition is later than anything this source can see.

  **Its territory demonstrably moved, and the corpus can now name when.** Between the 1980 and 1990
  censuses Lima annexed ground from American, Bath and Shawnee townships; Bluffton village and
  Delphos city annexed in the same interval. [verified] — [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md), Geographic Change Notes. That is the
  first annexation event this corpus has ever held, and it converts the caveat below from a
  reasonable worry into a documented fact for one decade. [inference] The city's count fell from
  47,827 to 45,549 across that decade **while the corporation was getting larger**.

  It is separated from the place because its territory is not fixed: annexation has moved the
  corporate boundary repeatedly while the name has denoted the same settlement throughout.
  Any population or area figure for Lima is a figure about the corporation's territory on a
  date, which is what makes
  [boundary-comparability](../../skills/boundary-comparability.md) necessary before two of
  them are compared.
