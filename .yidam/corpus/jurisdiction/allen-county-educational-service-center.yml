class: jurisdiction
label: Allen County Educational Service Center
description: |
  The county's school jurisdiction that is not a school district. Its office is at 1920 Slabtown
  Road, Lima, and its governing board has five elected members on four-year terms. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **Who governs it now.** Brooke L. Hedges, David Earnest Mayer and Lori M. Ringwald to 31 December
  2029, and Ann B. Best and Walter W. Paxson to 31 December 2027; Hedges and Paxson were appointed.
  [verified] — same source. Two of five is the heaviest use of appointment on any school board in
  the county. [verified] —
  [the seat count](../measure/allen-county-elected-seats-2026.yml).

  **The statute defines it by subtraction, which is why it has no boundary of its own.** An
  educational service center is *"the territory within the territorial limits of a county ...
  exclusive of the territory embraced in any city school district or exempted village school
  district"*, with territory detached for school purposes excluded and territory attached for them
  included. [verified] —
  [Ohio Revised Code 3311.05](../../catalog/ohio-revised-code.md). So this jurisdiction is Allen
  County minus [Lima City](lima-city-school-district.yml), minus the Allen part of
  [Delphos City](delphos-city-school-district.yml), and minus the Allen part of
  [Bluffton](bluffton-exempted-village-school-district.yml)'s — the three districts here that are
  not *local* districts.

  That subtraction is the statute's rule and not a boundary this corpus has traced. The same
  section provides for territory to be detached and attached for school purposes, and no source
  read here says whether any has been. [open]

  **It is the reason this county's school geography needs a class distinction it has not needed
  elsewhere.** Twelve districts serve pupils; this body serves districts. What it does for them —
  the ORC section read here defines its territory and not its functions — is not established.
  [open]
properties:
