class: jurisdiction
label: Columbus Grove Local School District
description: |
  A Putnam County district that reaches into Allen — 5,120 people over 73.137 square miles,
  internal point 40.907866, -84.118198, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  4,631 of its people are in Putnam County and 489 in Allen — 9.6 per cent. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block. The Allen County portion is 44 blocks in the north of
  [Monroe Township](../place/monroe-township.yml) and contains no incorporated place.

  It is here because a corpus of Allen County that listed only the districts centred in Allen
  County would tell 489 residents the wrong thing about where their children go to school. The
  reach is small and the boundary is real.

  **Its board is not on Allen County's roster, and the reason is the same as Delphos's wards.** A
  school board is elected by the voters of its district, and this district's centre is in Putnam
  County, so no Allen County precinct votes on it. Nine of the twelve districts here have boards
  this corpus can name and three do not. [verified] — [the elected officials
  roster](../../catalog/ohio-boe-elected-officials-allen.md).

  [open] Who its board members are. The Putnam County roster would name them.

  756 pupils in 2023 against 896 in 2010, a fall of 15.6 per cent; $15,384 of current spending a
  pupil, which is the fourth-highest figure in the county on its fourth-smallest roll; 8.0 per cent
  child poverty. [verified] — [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml),
  [the finance survey](../measure/allen-county-school-finance-2023.yml) and [child
  poverty](../measure/allen-county-school-district-poverty-2023.yml).
