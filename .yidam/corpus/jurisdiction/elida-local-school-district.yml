class: jurisdiction
label: Elida Local School District
description: |
  The county's second most populous school district — 18,876 people over 67.454 square miles,
  internal point 40.804278, -84.199108, serving PK–12. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), unified school district file,
  and [TIGERweb](../../catalog/tigerweb-census2020.md) block population.

  It lies wholly inside Allen County and covers **five of the county's thirteen civil
  subdivisions**: 11,390 people in [American Township](../place/american-township.yml), 4,849 in
  [Lima](../place/lima.yml), all 1,231 in [Sugar Creek Township](../place/sugar-creek-township.yml),
  1,082 in [Marion Township](../place/marion-township.yml) and 324 in
  [Amanda Township](../place/amanda-township.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography, block by block.

  Those 4,849 are the reason this node matters to anyone looking something up: **more residents of
  Lima attend school in this district than in any other besides Lima's own**, and the count is a
  seventh of the city. A Lima address does not settle the question.
