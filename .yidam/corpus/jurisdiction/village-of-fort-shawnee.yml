class: jurisdiction
label: Village of Fort Shawnee
description: |
  The municipal corporation that governed [Fort Shawnee](../place/fort-shawnee.yml), on the southern
  edge of Lima inside [Shawnee Township](../place/shawnee-township.yml), until its own electors ended
  it. It was the largest village in Allen County by population — 3,866 people in 2000 and 3,726 in
  2010 — and it is the only municipal corporation this corpus knows of that this county has lost.
  [verified] — [Census intercensal estimates](../../catalog/census-intercensal-2000-2010.md).

  **It was ended by a vote, on a petition, on 6 November 2012.** The question was "Shall the Village
  known as Fort Shawnee surrender its corporate power?" and the answer was **1,058 to 858** — 55.2
  per cent, on 1,916 votes. [verified] —
  [the Secretary of State's report of miscellaneous questions](../../catalog/ohio-sos-local-issue-reports.md)
  for that election, under ALLEN COUNTY. This node exists because that return closes
  [a question this corpus had carried open since its first week](../question/what-happened-to-the-village-of-fort-shawnee.yml).

  **The ballot's words name the instrument.** Ohio ends a village two ways, by surrender of its
  corporate powers under Chapter 703 and by merger with a township under Chapter 709, and the
  question put here is the first. [inference] — the ballot language as printed in
  [the same report](../../catalog/ohio-sos-local-issue-reports.md), against the two routes the open
  question named. The corpus does not hold the certification that followed, so the date above is the
  date the electors decided and not a date of record for the corporation's end.

  **Two instruments with nothing in common put that end inside the next twelve months.** The county
  Auditor's tax set L36, *Fort Shawnee Corp.*, levies 2.150 mills of village tax in tax year 2012 and
  none in 2013; the Census Bureau's gazetteer carries the place with legal code 47, village, in the
  2012 vintage and code 57, census designated place, in the 2013. [verified] —
  [the Auditor's tax rate summaries](../../catalog/allen-county-auditor-tax-rates.md) and
  [the gazetteer](../../catalog/census-gazetteer-2020.md). The vote falls between them, five weeks
  before the first tax year in which nothing was levied.

  **A roster of governments carried it into the year it was voted out.** The 2012 Census of
  Governments lists `VILLAGE OF FORT SHAWNEE`, census identifier 36200250100000, presiding officer
  *Mayor*, at 2050 W Breese Rd; the 2017 and 2022 lists do not. [verified] —
  [the government unit lists](../../catalog/census-of-governments-unit-lists.md).

  **It refused to tax itself twice in the fourteen months before it dissolved.** An additional
  four-mill levy lost 435 to 796 in November 2011, and a 3.25-mill levy lost 592 to 1,323 on the
  same ballot as the dissolution — 30.9 per cent, the lowest yes share on any question put anywhere
  in this county in ten years. [verified] —
  [the ballot record](../measure/allen-county-ballot-questions-2003-2012.yml). A village that will
  not fund itself and then votes to stop being one is a sequence, and this corpus states the order
  and not a cause. [inference]

  **It never moved its own line.** No annexation, detachment or merger for Fort Shawnee appears in
  thirty-five years of Ohio's boundary survey. [verified] —
  [the annexation record](../measure/allen-county-annexations-1990-2024.yml). The survey did not
  record the dissolution either, which is the same silence read twice.

  [open] When it was incorporated. The corpus holds the county's incorporations to 1904 and this
  village is not among them; nothing here dates its erection. See
  [the incorporations](../measure/allen-county-municipal-incorporations-1842-1904.yml).

  **It was in a state fiscal emergency for the last two years of its life.** The Auditor of State
  declared one on 16 September 2010, at the mayor's own request, on an unprovided aggregate deficit
  of $50,761 and a treasury $18,211 short of the funds it was holding. [verified] —
  [the Auditor of State's audit search](../../catalog/ohio-auditor-of-state-audit-search.md); see
  [the declaration](../event/fort-shawnee-declared-in-fiscal-emergency-2010.yml). The village had no
  debt outstanding and had missed no payroll; what it had was $164,982 in the bank against $315,419
  promised to its own funds.

  **Its last audits carry findings for recovery, and its first do not.** Two of the nine reports the
  state released on this village carry one — the audits of 2006–07 and of 2008–09, released in
  February and December 2010 — and both fall in the same eleven months as the fiscal analysis.
  [verified] — the same source, the asterisk in its result table; see
  [the findings](../measure/allen-county-findings-for-recovery-1999-2026.yml).

  **The corporation's last day of record is 15 June 2013.** The final report on this village is an
  agreed-upon-procedures engagement covering 1 January 2012 to 15 June 2013, released on 3 December
  2013 — a closing audit, seven months after the electors voted. [verified] — the same source. The
  `abolished` date above is the day the electors decided; this is the day the state stopped
  auditing. [inference]
