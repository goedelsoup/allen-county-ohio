class: jurisdiction
label: Village of Spencerville
description: |
  The municipal corporation governing [Spencerville](../place/spencerville.yml), 2,198 people over
  0.965 square miles inside [Spencer Township](../place/spencer-township.yml) — the largest of the
  six villages lying wholly inside the county, though smaller than
  [Bluffton](../place/bluffton.yml), which does not. [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md) and [Census Population Estimates](../../catalog/census-popest-2024.md).

  **It was founded on the canal.** The county records the settlement as founded in 1844 on the
  banks of the [Miami and Erie Canal](../site/miami-and-erie-canal.yml). [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. That is the first thing in this corpus to
  connect the canal to a settlement that still exists: the canal node and
  [the canal era](../period/canal-era.yml) had until now no consequence anywhere else in the graph,
  and a village dated to the canal's own decade is one.

  **The act of incorporation was passed in 1867 and the first village election held that year**,
  returning J. C. Campbell mayor, Merritt Harvey recorder, Jacob Dehart treasurer and W. H. Orcutt
  marshal, with five councilmen. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), which then carries the roll of officers
  year by year to 1885. Twenty-three years separate the settlement from the corporation.

  [open] Its officers now, and its form of government. The corpus holds this village's council for
  every year from 1867 to 1885 and for no year since.
properties:
