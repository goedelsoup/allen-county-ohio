class: jurisdiction
label: Sugar Creek Township (government)
description: |
  The township government whose territory is [Sugar Creek Township](../place/sugar-creek-township.yml). Its township house
  is at 4130 W. Lincoln Highway, its telephone is 419.642.7390, and its trustees meet
  on the first and last Tuesday of the month at 8:00 p.m.. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), townships page.

  The county's address file puts the building at 40.844333, -84.182793, landmarked
  `SUGAR CREEK TOWNSHIP TOWN HALL`, and that point falls inside the township. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  Its township house is in [Gomer](../place/gomer.yml), the only township house in the
  county whose postal address is a place with no government of its own — a census designated place,
  so the address names a settlement and not a corporation. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and [TIGERweb](../../catalog/tigerweb-census2020.md).

  It governs the county's least populous township, and the one whose lines everything else here
  agrees with: a single school district covers it entire, and
  [a single voting precinct](../division/voting-district-sugar-creek-2020.yml) is coterminous with
  it. It is the tidiest ground in the county.

  [open] When the township was erected, under what order, and who its trustees are. The county's
  site names no officers and gives no dates.
