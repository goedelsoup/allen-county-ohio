class: tenure
label: James D. Jordan, Representative in Congress, Ohio's 4th District, term of 2025–2027
description: |
  James D. Jordan holds this seat under a term that began 2025-01-03 and is scheduled to expire 2027-01-02.
  [verified] — [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This node is a term, not a career.** `ended` is absent because the holder is serving; the expiry
  above is scheduled and has not happened.

  **He was elected under a map that no longer exists.** The November 2024 election ran on Ohio's
  congressional plan of March 2022, which was replaced on 31 October 2025. [verified] —
  [All About Redistricting — Ohio](../../catalog/all-about-redistricting-ohio.md). So this tenure
  establishes who represents Allen County and does not establish which district the county is now
  in. [open]

  The term runs two years, computed from its own two dates rather than read from a statute.
  [inference] `how_began` is recorded as elected because the source is a roster of elected officials
  for a term it dates. [inference]
