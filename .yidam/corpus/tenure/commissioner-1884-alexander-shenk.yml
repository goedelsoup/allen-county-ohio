class: tenure
label: Alexander Shenk, Allen County Commissioner, 1884–1886
description: |
  [Alexander Shenk](../person/alexander-shenk.yml) came onto the board in place of Charles C.
  Marshall. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), which prints the 1884
  board as "Joseph A. States, Alexander Shenk (vice Marshall) and Abraham Crider".

  **It is a node because the book gives a reason and not only a date**, which is the second of the
  three tests in
  [a table is the line and a tenure is the turn](../../decisions/a-table-is-the-line-and-a-tenure-is-the-turn.yml).
  It passes the first as well: he is one of five men in seventy-five years whose entry breaks the
  roster's own shift, and the only one the book marks. [inference] —
  [the board of 1831–1920](../measure/allen-county-commissioners-1831-1920.yml).

  **The ending is where the printed roster stops naming him and nothing more.** He is in the rows for
  1884, 1885 and 1886 and out of the row for 1887. Whether that is a term expiring or a term he was
  filling out is not stated, and Marshall's own term would have run to about then. [inference]
properties:
  began: "1884"
  ended: "1886"
  how_began: succeeded
