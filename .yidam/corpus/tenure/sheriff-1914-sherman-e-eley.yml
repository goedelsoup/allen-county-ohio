class: tenure
label: Sherman E. Eley, Sheriff of Allen County, 1914–1918
description: |
  Sherman E. Eley held the office of Sheriff of Allen County from 1914 to 1918.
  [verified] — [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  The roster gives year precision only, and says nothing about how the term began or ended, so
  `how_began` and `how_ended` are absent rather than inferred.
  **`how_ended` is still absent and the term is no longer featureless.** The 1921 county history
  records that on 30 August 1916, inside this term, a mob came to the jail and nearly hanged him for
  refusing to surrender a prisoner. [verified] —
  [the mob of 1916](../event/the-mob-at-the-allen-county-jail-1916.yml). That is an event within a
  holding and not a fact about how the holding began or ended, so it stays an event and this node
  stays a row; see
  [a table is the line and a tenure is the turn](../../decisions/a-table-is-the-line-and-a-tenure-is-the-turn.yml).

properties:
