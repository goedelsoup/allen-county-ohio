class: tenure
label: Richard Metheany, Mayor of Lima, 1870-1874
description: |
  [Richard Metheany](../person/richard-metheany.yml) was elected
  [Mayor of Lima](../office/mayor-of-lima.yml) in 1870, re-elected in 1871, continued in office in
  1872, and is named as mayor for 1873 in the book's own list. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **Four consecutive years, matched in this line only by John B. Townsend.** [inference] — computed
  from [the line of mayors](../measure/lima-mayors-1842-1886.yml). It is the end of twenty-six
  years in the village and city government, in which he had already been trustee, recorder and
  treasurer.

  John C. Dunlevy is given as mayor for 1874-76. [verified] — same source.
