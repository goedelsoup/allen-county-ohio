class: tenure
label: Charles N. Lamison, Prosecuting Attorney of Allen County, 1852–1855
description: |
  [Charles N. Lamison](../person/charles-n-lamison.yml) was elected prosecuting attorney in 1852 in
  place of [Mathias H. Nichols](../person/mathias-h-nichols.yml), who had resigned. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md): "Charles N. Lamison
  (elected vice Nichols resigned), 1852".

  **The end date is the next man's start and nothing more.** Jasper N. Gutridge is entered against
  1855 and the book gives no ending for Lamison. `ended` here is the successor's year, which is how
  every date in that roster works, and it is not a statement that he served the whole of 1855.
  [inference]

  **He held the office again from 1857, and that second holding has no node.** The roster records it
  as an ordinary entry with no reason attached, so it lives in
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml) as a row; see
  [a table is the line and a tenure is the turn](../../decisions/a-table-is-the-line-and-a-tenure-is-the-turn.yml).

  **The 1921 county history's roster does not contain this holding at all.** Its list runs from
  Nichols in 1851 straight to Gutridge in 1859, while its own account of the bar says Lamison served
  two terms as prosecuting attorney. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).
properties:
