description: |
  [Anthony Layton Geiger](../person/anthony-layton-geiger.yml) holds the office of
  [Director of Law of the City of Lima](../office/lima-director-of-law.yml) under a term that began 2026-01-01 and is scheduled
  to expire 2029-12-31. [verified] — [the elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

