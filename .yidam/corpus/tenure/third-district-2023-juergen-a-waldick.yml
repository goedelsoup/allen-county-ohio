label: Juergen A. Waldick, Judge of the Third District Court of Appeals, term of 2023–2029
description: |
  Juergen A. Waldick holds this seat under a term that began 2023-02-11 and is scheduled to expire 2029-02-10.
  [verified] — [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This node is a term, not a career.** `ended` is absent because the holder is serving; the expiry
  above is scheduled and has not happened.

  Elected on 8 November 2022 to the seat of retired Judge Stephen R. Shaw. [verified] —
  [the court's own site](../../catalog/third-district-court-of-appeals.md). His term begins two days
  later than his colleagues' February dates, on the 11th rather than the 9th, and the corpus has not
  established why. [open]

  The term runs six years, computed from its own two dates rather than read from a statute.
  [inference] `how_began` is recorded as elected because the source is a roster of elected officials
  for a term it dates. [inference]
