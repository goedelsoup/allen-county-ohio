description: |
  Mona S. Losh holds the office of Recorder of Allen County under a term that began 2025-01-06 and is
  scheduled to expire 2028-12-31. [verified] — [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This node is a term, not a career.** `ended` is absent because the holder is serving; the
  expiry above is scheduled and has not happened. The roster gives the current term only, so
  nothing here establishes when this person first took the office unless it is said below.

  **The holder's service is much longer than this term.** The recorder's own site says she was
  elected to a term "commencing January 2005". [verified] — [the county's site](../../catalog/allen-county-official-site.md). Six four-year terms fall between
  January 2005 and January 2025, so this is her sixth. [inference] — computed here. The five
  earlier terms have no node; no roster of past recorders has been retrieved.

  `how_began` is recorded as elected because the roster this comes from is a roster of elected
  officials for a term it dates; no source states the manner of taking office directly. [inference]
  The term runs four years, computed from its own two dates rather than read from a statute.
  [inference]
