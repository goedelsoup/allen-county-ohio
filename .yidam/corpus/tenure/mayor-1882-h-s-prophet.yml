class: tenure
label: H. S. Prophet, Mayor of Lima, 1882-1884
description: |
  [H. S. Prophet](../person/h-s-prophet.yml) was
  [Mayor of Lima](../office/mayor-of-lima.yml) from 1882 to 1884, as the 1885 book's list of mayors
  since 1873 gives him. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  He is the second-to-last mayor the 1885 book names; William McComb follows for 1884-86.
  [verified] — same source; see [the line of mayors](../measure/lima-mayors-1842-1886.yml).

  **The line does not stop there any more.** Two later histories carry it to 1 January 1922, when
  Lima abolished the office, and this holder returns to it in 1898. [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md); see
  [the mayors of 1886 to 1922](../measure/lima-mayors-1886-1922.yml). What the corpus cannot name is
  a mayor between 1922 and 2021.

  The 1921 history calls him a colonel and a wounded veteran, and the 1885 roster carries a
  Prophet in the 15th Ohio for three months in 1861 and a Hinchman Prophet in the 43rd from
  September 1861. [verified] — the 1921 history and the 1885 history.
