description: |
  [Jeannine M. Jordan](../person/jeannine-m-jordan.yml) holds the office of
  [Member of Lima City Council](../office/member-of-lima-city-council.yml) under a term that began 2024-01-01 and is scheduled
  to expire 2028-01-02. [verified] — [the elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This is the one appointed seat in Lima's government**, against twenty-five appointments among
  the forty-seven seated village officers of this county. [verified] — same source and
  [the county's elective seats](../measure/allen-county-elected-seats-2026.yml).

  [open] Who appointed her, what vacancy she filled and when. The roster marks the seat and gives
  the term of the seat rather than of the appointment.

  `ended` is absent because the holder is serving; the expiry above is scheduled and has not
  happened. [inference] The roster dates the term and not the holder's first day in the office, so
  nothing here says whether this is a first term. [open]
