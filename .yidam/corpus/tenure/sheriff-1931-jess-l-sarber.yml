class: tenure
label: Jess L. Sarber, Sheriff of Allen County, 1931–1933
description: |
  Jess L. Sarber held the office of Sheriff of Allen County from 1931 until he was shot dead in
  the county jail on 12 October 1933. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md) for
  the term, and [Chronicling America](../../catalog/chronicling-america.md) for the ending; see
  [the raid on the Allen County jail](../event/allen-county-jail-raid-1933.yml).

  `how_ended` was absent for two phases because the roster gives year precision and no reasons, and
  a reading that fit was not a record. It is now filled from a source that says it, and `ended`
  carries the day.
properties:
  began: "1931"
  ended: 1933-10-12
  how_ended: died in office
