class: tenure
label: Brion E. Rhodes, Engineer of Allen County, term of 2025–2028
description: |
  Brion E. Rhodes holds the office of Engineer of Allen County under a term that began 2025-01-06 and is
  scheduled to expire 2028-12-31. [verified] — [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This node is a term, not a career.** `ended` is absent because the holder is serving; the
  expiry above is scheduled and has not happened. The roster gives the current term only, so
  nothing here establishes when this person first took the office unless it is said below.

  **The holder's service is much longer than this term, and the account of it does not close.**
  The engineer's own site says he was "appointed in 2009, elected in 2015" and "is currently serving
  his third term". [verified] — [the county's site](../../catalog/allen-county-official-site.md). [open] Those three statements do not reconcile on four-year
  terms: service from 2009 would put a holder in a fourth or fifth term by 2025, and 2015 is not a
  year an Ohio county engineer is chosen. The corpus records the sentence and does not repair it.

  `how_began` is recorded as elected because the roster this comes from is a roster of elected
  officials for a term it dates; no source states the manner of taking office directly. [inference]
  The term runs four years, computed from its own two dates rather than read from a statute.
  [inference]
properties:
  began: "2025-01-06"
  how_began: elected
