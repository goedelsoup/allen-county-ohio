description: |
  Krista N. Bohn holds the office of Treasurer of Allen County under a term that began 2025-09-01 and is
  scheduled to expire 2029-09-02. [verified] — [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This node is a term, not a career.** `ended` is absent because the holder is serving; the
  expiry above is scheduled and has not happened. The roster gives the current term only, so
  nothing here establishes when this person first took the office unless it is said below.

  [open] These dates are irregular. Every other single-seat county office on the roster runs
  6 January 2025 to 31 December 2028, and no source this corpus holds explains a September term.
  `how_began` is absent for that reason rather than inferred from the roster as the others are.

  The term runs four years, computed from its own two dates rather than read from a statute.
  [inference]
