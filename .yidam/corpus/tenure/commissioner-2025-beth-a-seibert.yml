description: |
  Beth A. Seibert holds the office of Commissioner of Allen County under a term that began 2025-01-03 and is
  scheduled to expire 2029-01-02. [verified] — [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This node is a term, not a career.** `ended` is absent because the holder is serving; the
  expiry above is scheduled and has not happened. The roster gives the current term only, so
  nothing here establishes when this person first took the office unless it is said below.

  The third day of January is the statutory commencement for the other of the two commissioner
  seats elected together. [verified] — [Ohio Revised Code §305.01](../../catalog/ohio-revised-code.md).

  `how_began` is recorded as elected because the roster this comes from is a roster of elected
  officials for a term it dates; no source states the manner of taking office directly. [inference]
  The term runs four years, computed from its own two dates rather than read from a statute.
  [inference]
