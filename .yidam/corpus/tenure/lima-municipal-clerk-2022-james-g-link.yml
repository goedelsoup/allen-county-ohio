class: tenure
label: James G. Link, Clerk of the Lima Municipal Court, term of 2022–2027
description: |
  [James G. Link](../person/james-g-link.yml) holds the office of
  [Clerk of the Lima Municipal Court](../office/clerk-of-the-lima-municipal-court.yml) under a term that began 2022-01-01 and is scheduled
  to expire 2027-12-31. [verified] — [the elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  Six years is the longest elective term in this county, and this holder and the court's two judges
  are the only Lima-seated officers on the roster who carry a party letter. [verified]

  `ended` is absent because the holder is serving; the expiry above is scheduled and has not
  happened. [inference] The roster dates the term and not the holder's first day in the office, so
  nothing here says whether this is a first term. [open]
