class: tenure
label: Mathias H. Nichols, Prosecuting Attorney of Allen County, 1851–1852
description: |
  [Mathias H. Nichols](../person/mathias-h-nichols.yml) was elected prosecuting attorney in 1851 and
  resigned the next year to enter Congress. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), whose roster prints
  the reason in the entry: "Mathias H. Nichols, 1851 (resigned in 1852 to enter Congress)".

  **This node exists because the holding is a turn and not a row.** The corpus records a line of
  holders as a table and writes a tenure only where the record says how a term began or ended out
  of course; see
  [a table is the line and a tenure is the turn](../../decisions/a-table-is-the-line-and-a-tenure-is-the-turn.yml).
  The other twenty entries in this office's roster are in
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml) and have no such node,
  because the book says nothing about them but a name and a year.

  The year has no month in it. The book gives years for every officer and days for none, and this
  node does not supply one. [verified] — same source.
properties:
  began: "1851"
  ended: "1852"
  how_ended: resigned to enter Congress
