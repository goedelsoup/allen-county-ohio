class: tenure
label: Henry D. V. Williams, Mayor of Lima, from 1842
description: |
  [Henry D. V. Williams](../person/henry-d-v-williams.yml) held the office of
  [Mayor of Lima](../office/mayor-of-lima.yml) from the town's organization on 29 March 1842.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **He is the office's first holder and the corpus's earliest municipal officer.** The office node
  stood empty from genesis until this year's mayor was added; it now has both ends of a line and
  none of the middle. [verified] — same sources.

  **The 1885 book prints the mayor of every year from 1842 to the year of its printing**, and this
  corpus has recorded one of them. The rest are a succession of about forty holders that no node
  here carries. [open] See
  [the succession this corpus has not written](../office/mayor-of-lima.yml).

  `ended` is absent because the source names his successor only by giving the next year's election,
  and the 1885 book's list runs by year of election rather than by term. [inference] Williams was
  re-elected in 1843 — "the mayor, treasurer and marshal being re-elected" — and H. F. Hubbard was
  elected mayor in 1844. [verified] — the 1885 history.
