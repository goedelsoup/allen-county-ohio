class: tenure
label: Sharetta T. Smith, Mayor of Lima, term of 2025–2029
description: |
  Sharetta T. Smith holds the office of [Mayor of Lima](../office/mayor-of-lima.yml) under a term
  that began 2025-12-01 and is scheduled to expire 2029-11-30. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This is the first holder the office node has ever had.** It was seeded with the note that an
  office is meaningful without its tenures; it has stood empty since genesis because the roster
  that filled the county offices was read at one precinct, and a precinct's page carries only the
  offices its own voters choose. [verified] — same source.

  **The term year is the fact worth keeping.** It runs 1 December to 30 November, where every
  office of [Delphos](../jurisdiction/city-of-delphos.yml) runs 1 January to 31 December and this
  city's own council turns on 2 and 5 January. [verified] — same source. A single city keeping
  three calendars at once is what a charter looks like from the outside, and the corpus treats it
  as evidence rather than as the answer. [inference]

  `how_began` is recorded as elected because this is a roster of elected officials for a term it
  dates, and no source read here states the manner of taking office. [inference] `ended` is absent
  because the holder is serving; the expiry above is scheduled and has not happened.
properties:
  began: "2025-12-01"
  how_began: elected
