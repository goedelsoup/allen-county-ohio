class: tenure
label: Samuel A. Baxter, Mayor of Lima, 1854-1856
description: |
  [Samuel A. Baxter](../person/samuel-a-baxter.yml) was appointed
  [Mayor of Lima](../office/mayor-of-lima.yml) in January 1854, in place of Thomas Milligan, who had
  resigned; he was then elected in his own right later the same year and re-elected in 1855.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  `how_began` is `appointed` because that is how the term opened, and the elections that followed
  are the same tenure rather than new ones. [inference] James E. Harriott was elected in 1856.
  [verified] — same source.

  This is the second of Baxter's two terms and the second of the three interrupted successions in
  [the line](../measure/lima-mayors-1842-1886.yml).
