label: Matthew B. Treglia, Sheriff of Allen County, 2017–present
description: |
  Matthew B. Treglia held the office of Sheriff of Allen County from 2017 to the present.
  [verified] — [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  Still serving as of the roster read on 2026-08-28; `ended` is absent for that reason and
  not because the end is unknown. [verified]

  The roster gives year precision only. A second source now dates his *current term* — 6 January
  2025 to 31 December 2028 — which is a different fact from the 2017 start and does not replace it.
  [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md). This
  node keeps `began: 2017`, because a tenure is a holding and not a term, and the holding is the
  longer of the two.

  `how_began` is now recorded as elected, on the same reasoning applied to the other eight county
  officers: the second source is a roster of elected officials for a term it dates. [inference]
  `how_ended` stays absent because he is serving.
properties:
  began: "2017"
  how_began: elected
