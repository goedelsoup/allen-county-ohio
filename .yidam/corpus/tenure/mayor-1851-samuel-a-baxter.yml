class: tenure
label: Samuel A. Baxter, Mayor of Lima, 1851-1853
description: |
  [Samuel A. Baxter](../person/samuel-a-baxter.yml) was elected
  [Mayor of Lima](../office/mayor-of-lima.yml) in 1851, and the same officers were returned in 1852
  with the marshal changed. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  His first term. Thomas Milligan was elected in 1853 and resigned the following January, at which
  point the council appointed Baxter again; see
  [his second term](mayor-1854-samuel-a-baxter.yml) and
  [the line of mayors](../measure/lima-mayors-1842-1886.yml).

  The dates are years of election, which is how the 1885 book keeps this record; it does not give
  the day any mayor took office. [inference]
