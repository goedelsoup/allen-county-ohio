description: |
  Terri Lynn Kohlrieser holds this seat on the Allen County Court of Common Pleas under a term that began 2025-01-01 and is scheduled to
  expire 2030-12-31. [verified] — [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This node is a term, not a career.** `ended` is absent because the holder is serving; the expiry
  above is scheduled and has not happened. The roster gives the current term only, so nothing here
  establishes when this judge first took the bench.

  This is the General Division seat whose term begins in January; the other begins in February.
  [verified] — same roster.

  [open] Two of the county's four common pleas judges share the surname Kohlrieser. The corpus
  records both and asserts no relation between them.

  The term runs six years, computed from its own two dates rather than read from a statute.
  [inference] `how_began` is recorded as elected because the source is a roster of elected officials
  for a term it dates. [inference]
