class: tenure
label: Donald F. Sarber, Sheriff of Allen County, 1933–1935
description: |
  Donald F. Sarber held the office of Sheriff of Allen County from 1933 to 1935, taking it over
  from his father, who was killed in office. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md) for the
  term, and [Chronicling America](../../catalog/chronicling-america.md) for the relationship: a
  Lima dispatch of 4 March 1934 calls the murdered man "the sheriff's father" and "the elder
  Sarber, who preceded his son as sheriff".

  `how_began` is `succeeded` and not `appointed`. Ohio fills a vacancy in a county office by
  appointment, and no source read here says who made this one or when, so the mechanism is left
  unstated and only the fact of the succession is recorded. [inference]
properties:
  began: "1933"
  ended: "1935"
  how_began: succeeded
