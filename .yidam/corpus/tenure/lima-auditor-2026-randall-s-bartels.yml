class: tenure
label: Randall S. Bartels, Auditor of the City of Lima, term of 2026–2029
description: |
  [Randall S. Bartels](../person/randall-s-bartels.yml) holds the office of
  [Auditor of the City of Lima](../office/lima-city-auditor.yml) under a term that began 2026-01-01 and is scheduled
  to expire 2029-12-31. [verified] — [the elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **This office had no holder in the corpus until now, and neither did four others.** The city's
  auditor, its director of law, its council president, its seven ward seats and the municipal
  court's clerk were all outside the corpus while every county office had a named holder.
  [verified]

  `ended` is absent because the holder is serving; the expiry above is scheduled and has not
  happened. [inference] The roster dates the term and not the holder's first day in the office, so
  nothing here says whether this is a first term. [open]
