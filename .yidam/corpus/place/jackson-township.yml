class: place
label: Jackson Township
description: |
  A township of 35.719 square miles about 10 miles east of the county's centre, internal
  point 40.781058, -83.920597. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 3,144 at the 2020 estimates base and 3,071 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 73 over those four years, as all but two of the county's subdivisions did.

  It contains [Lafayette](lafayette.yml). [verified] — same source, which reports it as a place within this township.

  **Erected June 6, 1831, at the first recorded meeting of the Allen County commissioners** — the
  petition for its organization was the board's opening business, considered and granted the day
  James Daniels, John G. Wood and Samuel Stewart first sat. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), which records the
  petition twice, in this township's chapter and in [Bath's](bath-township.yml). The board also
  authorized a township of Sciota that day. That makes this township's erection the earliest dated
  act of the county's own government anywhere in this corpus — see
  [when the county was organized](../question/when-allen-county-was-organized.yml).

  Its bounds were altered in December 1834 and the original Township 3 south, Range 8 east was set
  off again under the same name. [verified] — same source.

  [open] What the name refers to. The book gives none, and Andrew Jackson is a guess the corpus is
  not making.
