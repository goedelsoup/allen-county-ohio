class: place
label: Allen County
description: |
  The county itself, as ground rather than as government: 402.545 square miles of land and
  4.306 square miles of water in the northwest quarter of Ohio, with an internal point at
  40.771627, -84.106103. [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  The land is glacial till plain, flat and poorly drained, and its northern reach lay within
  the Great Black Swamp until nineteenth-century drainage. [inference] That flatness is the
  reason the county's transport history runs through a canal and then a railway junction
  rather than through a river port: its streams drain north and west to the Auglaize and the
  Maumee and were never navigable here.

  Named in 1820, though for whom is not settled — see
  [what Allen County was named for](../question/namesake-of-allen-county.yml).

  **It is three places.** Lima holds 35,531 people; the three townships wrapped around it —
  [American](american-township.yml) 14,571, [Shawnee](shawnee-township.yml) 12,509 and
  [Bath](bath-township.yml) 9,399 — hold 36,479 between them, more than the city; and the other
  nine townships hold about thirty thousand across roughly five hundred square miles.
  [verified] — [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county
  file. That suburban middle is largely outside any municipality: Shawnee Township contains no
  incorporated place at all. [verified] — same source.

  **Its whole population history, with no gaps.** The county has a count at every decennial census
  from 1830 to 2020 and an estimate for 2024: **578 (1830), 9,079 (1840), 12,100 (1850), 19,185
  (1860), 23,623 (1870), 31,314 (1880), 40,644 (1890), 47,976 (1900), 56,580 (1910), 68,203 (1920),
  69,419 (1930), 73,303 (1940), 88,183 (1950), 103,691 (1960), 111,144 (1970), 112,241 (1980),
  109,755 (1990), 108,464 (2000), 106,331 (2010), 102,217 (2020) and 100,866 (2024).** [verified] —
  assembled from [1830–1900](../measure/allen-county-population-1830-1900.yml),
  [1890–1910](../measure/allen-county-townships-1890-1910.yml),
  [1940–1990](../measure/allen-county-population-1940-1990.yml) and the four modern measures —
  which rest between them on [Leeson 1885](../../catalog/leeson-allen-county-1885.md),
  [the 1910 Ohio supplement](../../catalog/census-1910-abstract-supplement-ohio.md),
  [the 1950 volume](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  [CPH-2-37](../../catalog/census-cph-2-37-ohio.md),
  [the 1970s county estimates](../../catalog/census-county-estimates-1970s.md),
  [the intercensals](../../catalog/census-intercensal-2000-2010.md) and
  [Population Estimates](../../catalog/census-popest-2024.md). Every figure is from a published
  table. Twenty-one observations, and until this phase two of them were missing.

  [open] One figure in it is contested: the 1885 history gives 12,100 for 1850 and the 1906 one
  12,116, a disagreement of sixteen people that neither source can settle. The series above uses
  the 1885 figure because [the county series node](../measure/allen-county-population-1830-1900.yml)
  does.

  **Once, nine-tenths of it was farms.** In 1910 the county held 2,939 farms covering 240,472 of its
  259,840 acres — 92.5 per cent of the land area — with 203,222 acres improved and $25,992,184 of
  farm property standing on them. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the county's farms](../measure/allen-county-farms-1900-1910.yml),
  [what they produced](../measure/allen-county-farm-output-1909.yml) and
  [its animals](../measure/allen-county-domestic-animals-1910.yml). That is the same census that
  counts 30,508 people in Lima, so the county was already more than half city by population while
  still being nine-tenths farm by ground. [inference]

  **It is two-thirds farms now, and it is a hog county.** 178,921 acres in 2022 — 69.4 per cent of
  the land area — on 897 operations, of which 268 part-owners farm 78.4 per cent of the ground and
  more than half of all farmland is rented from somebody else. [verified] —
  [the Census of Agriculture](../../catalog/usda-census-of-agriculture.md); see
  [the modern farms](../measure/allen-county-farms-2002-2022.yml),
  [the livestock](../measure/allen-county-livestock-2002-2022.yml) and
  [the crops](../measure/allen-county-crops-2022.yml). The county held 31,741 hogs on 59 places in
  2002 and 235,800 on 28 in 2022, and sells more of them than of anything else it raises.

  So the county's other nine-tenths has an answer at both ends and none in the middle: 52,322 of the
  61,551 acres that left the farms went in the ninety-two years no census in this catalog covers.
  [inference] — computed here from the two censuses. See
  [when the farmland went](../question/when-the-farmland-went.yml). The 1910 and 2022 farm counts
  are not subtracted anywhere in this corpus, because the two censuses define a farm differently;
  see [a farm count is a definition](../../decisions/a-farm-count-is-a-definition.yml).

  **Half the jobs in it are held by people who live somewhere else.** 48,730 jobs are located in
  Allen County and 24,461 of them are held by residents; 24,269 people commute in and 18,374
  residents commute out, so 42,643 cross the county line on a working day and the county draws 5,895
  more workers than it sends. [verified] —
  [who comes and goes](../measure/allen-county-commuting-2022.yml). The in-commuters come mostly from
  the ring of rural counties — Auglaize, Putnam, Van Wert, Hardin, Hancock.

  **And it pays about four fifths of what the country pays.** An average weekly wage of $1,131 in
  2024 against $1,267 for Ohio and $1,454 nationally, across 49,690 covered jobs. [inference] —
  [what work pays](../measure/allen-county-wages-2024.yml). Health care is the largest employer at
  9,767 jobs and manufacturing the largest payer, at 8,779 jobs and 28.0 per cent of all wages.

  **Who represents it, and under which map.** The county sends one member to the Ohio House from
  [the 78th District](../division/ohio-house-district-78-2023.yml) and one to the Ohio Senate from
  [the 12th](../division/ohio-senate-district-12-2023.yml), both under the legislative map adopted
  29 September 2023; and it is not split between districts in either chamber. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md);
  [inference] for the not-split, reasoned from the roster naming one of each. Its sitting member of
  Congress sits for the 4th District. [verified] — same source.

  [open] Which congressional district this county is in under the plan adopted 31 October 2025. Its
  representative was elected in 2024 under the plan that one replaced — see
  [the question](../question/allen-county-current-congressional-district.yml).

  **Six colleges stand in it and they have lost a third of their students since 2010.** 8,615 in
  the autumn of 2023 and 10,789 across the twelve months, against 16,702 in 2010 — a fall of 35.4
  per cent while the county itself fell 3.9. [verified] —
  [the enrolment series](../measure/allen-county-college-enrollment-2010-2023.yml). Together they
  award 2,918 credentials a year, of which 85 per cent are below a bachelor's degree. [verified] —
  [higher education](../measure/allen-county-higher-education-2023.yml).

  **Three and a half thousand of its people do not live in a household.** 3,522 of 102,206 — 1,513
  in correctional facilities, 966 in nursing homes, 788 in student housing and 255 in shelters,
  group homes and residential treatment centres — leaving 98,684 in 40,935 occupied units, an
  average household of 2.411. Another 3,628 units stood empty. [verified] —
  [the group quarters](../measure/allen-county-group-quarters-2020.yml) and
  [the occupancy](../measure/allen-county-occupancy-2020.yml).

  **It sent one person in ten to the Civil War.** A county of 19,185 in 1860 put 1,920 men into
  United States service over the four years, and at least 164 of them did not come home.
  [inference] — [what the county sent](../measure/allen-county-civil-war-service.yml) and
  [the dead](../measure/allen-county-civil-war-dead.yml). It was also, for a few weeks in August
  1862, the rendezvous of the whole Eighth Military District: about 1,600 men camped across the
  Ottawa from a town of fewer than two thousand. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md); see
  [Camp Lima](../site/camp-lima.yml).

  **It rose for a hundred and fifty years and has fallen for forty-four.** The peak is 1980 and the
  county is now smaller than it was in 1960. [inference] The first two figures count different
  ground — the [reorganization of 1848](../event/reorganization-of-1848.yml) moved 138 square miles
  — so the series is continuous only from 1850.

  **The outline is not fixed either, and this corpus had assumed it was.** Between the 1990 and
  2000 censuses Allen County gained territory from Putnam County, by way of
  [Marion Township](marion-township.yml) taking ground from Jennings Township across the line.
  [verified] — [Census 2000, Population and Housing Unit Counts, Ohio](../../catalog/census-phc-3-37-ohio.md),
  geographic change notes. It is the only movement of the county line on record here since 1848.

  **It is small enough to be invisible in the county's own total area**, which is 406.88 square
  miles in the 2000 volume, 406.85 in the 2010 one and 406.851 in the 2020 gazetteer — three
  hundredths of a square mile across twenty years and a boundary change. The *land* figure in the
  same three sources reads 404.43, 402.50 and 402.545, a fall of more than twelve hundred acres in
  a county that gained ground. [verified] — the same volumes and
  [the 2020 gazetteer](../../catalog/census-gazetteer-2020.md). What moved was the line between
  land and water on a map, not the line around the county; see
  [the control is the figure that cannot move](../../decisions/the-control-is-the-figure-that-cannot-move.yml).


  **It has been named in ten federal disaster declarations since 1965**, for eight distinct
  incidents — tornadoes, a blizzard, four rounds of severe storms and flooding, an evacuation from a
  hurricane nine hundred miles away, and a pandemic. Two of the ten brought money to households.
  [verified] — [the declarations](../measure/allen-county-disaster-declarations-1965-2020.yml).

