class: place
label: Fort Shawnee
description: |
  A community of 9.51 square miles south of Lima, internal point 40.681287, -84.149835.
  [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), where it is
  listed as `Fort Shawnee CDP`.

  It was an incorporated village through at least 2010: the intercensal file lists
  `Fort Shawnee village` with 3,866 at the 2000 base and 3,726 at the 2010 census. [verified]
  — [Census Intercensal Estimates, 2000–2010](../../catalog/census-intercensal-2000-2010.md).
  In the 2020 geography it is a census designated place, and the Vintage 2024 sub-county file
  does not list it at all. [verified]

  **The change is now datable and its direction is known.** The Bureau's gazetteer carries this
  place as legal code 47, village, in the 2012 vintage and as code 57, census designated place, in
  the 2013 one, and the 2012 Census of Governments lists `VILLAGE OF FORT SHAWNEE` with a mayor
  where the 2017 and 2022 lists carry nothing. [verified] —
  [the gazetteer](../../catalog/census-gazetteer-2020.md), Ohio place files, and
  [the government unit lists](../../catalog/census-of-governments-unit-lists.md). A roster of
  governments dropping a unit is evidence about the corporation, not about the tabulation.
  [inference]

  **It never annexed.** Ohio's boundary-change files hold fifty-seven records for Allen County
  between 1990 and 2024 and not one of them is Fort Shawnee's, which makes it the largest of the
  county's villages by population never to have moved its own line. [verified] —
  [the Boundary and Annexation Survey](../../catalog/census-bas-boundary-changes-ohio.md); see
  [the annexation record](../measure/allen-county-annexations-1990-2024.yml).

  What instrument ended it and on what day is still
  [an open question](../question/what-happened-to-the-village-of-fort-shawnee.yml),
  and it is the reason this node exists. The place is the ground and the name; whether the
  *corporation* still exists is a separate matter, and the corpus can hold the first while
  leaving the second unanswered precisely because the two are different classes.

  It lies within [Shawnee Township](shawnee-township.yml): all 120 of its census blocks do, and
  its 6,263 people at the 2020 census are half the township's 12,482. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. That 6,263 is **not** to be read
  against the 3,726 the village recorded in 2010: the CDP outline is drawn by the Census Bureau and
  the village boundary was drawn by annexation, so the two figures count different ground.
  [inference] The size of that difference is now measured: the village held 7.21 square miles of
  land at both the 2000 and 2010 censuses and the CDP drawn in its place holds 9.51, so the outline
  gained 1,506 acres in the step that ended the corporation. [verified] —
  [the 2000 volume](../../catalog/census-phc-3-37-ohio.md), the
  [2010 volume](../../catalog/census-cph-2-37-ohio-2010.md) and
  [the gazetteer](../../catalog/census-gazetteer-2020.md).
  As a CDP it is a statistical outline and not a boundary anyone is governed by, and it does
  not reach the tank plant a mile and a half north of its internal point — the plant is in
  Shawnee Township and in no place at all. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md), point-in-polygon against the 2020 CDP layer.
