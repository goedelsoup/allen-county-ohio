class: place
label: Beaverdam
description: |
  A village of 0.63 square miles in [Richland Township](richland-township.yml), about 8 miles north-east of the
  county's centre, internal point 40.832487, -83.973383. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio places.

  Its population was 321 at the 2020 estimates base and 314 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It lost 7 people over those four years.

  **All of it is in Allen County.** The same file marks a place that crosses a county line with
  `(pt.)` and marks this one plainly, which is what separates it from
  [Bluffton](bluffton.yml) and [Delphos](delphos.yml). [verified] — same source.

  **The village is one voting precinct, exactly.** Precinct `BEAVERDAM` holds 319 people and 151 housing
  units, and every block in it is in the village and every block of the village is in it. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md)
  crossed with [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. Four of the county's
  nine municipalities are single precincts on these terms; the other five are split, and
  [Lima](lima.yml) is cut into 23. [verified] —
  [the county's voting districts](../measure/allen-county-voting-districts-2020.yml).

  **The Census spelt it as two words until at least 1940.** "Beaverdam village returned in 1940 as
  Beaver Dam." [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6, Allen County footnote. So the one-word form is the later one and the change is datable to
  between 1940 and 1950 in federal usage. [inference] The 1885 history agrees: it spells the place
  "Beaver Dam" throughout — scores of times in each of the two scans the corpus holds — and never
  as one word in either. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans. The two
  disagree on the tally, because they break lines differently; they do not disagree on the form. Which is what the etymology below would lead one to expect, and is the kind of agreement
  that makes the etymology likelier rather than merely repeated.

  **Established in 1853, and named for the beaver dams** that were abundant near the original
  town site. [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. The
  [Village of Beaverdam](../jurisdiction/village-of-beaverdam.yml) was incorporated twenty-five
  years later, in 1878.

  **Frederick Shull established it**, laying it out on Sections 29, 30, 31 and 32 of
  [Richland Township](richland-township.yml) — the original town bounded by North Street, Lima
  Street and Church Street. He was the village's postmaster when the office moved here about 1849,
  four years before the plat. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The county's page gives 1853 and no name; this
  source gives the name, and the two agree on the year against an OCR reading of 1858 in the other
  scan — see [two scans of one book](../../decisions/two-scans-of-one-book.yml), where an unrelated
  source settling a scanning dispute is the case the rule was written for.

  [open] Whether the beaver-dam etymology is anything more than the county's own telling. The 1885
  book names the founder and the sections and offers no etymology at all, which neither supports
  the story nor contradicts it.

  **Its ground is the one piece of this county the survey grid cannot name.** Beaverdam's internal
  point falls inside the county's polygon for T3S R8E §5, and that polygon is 1,282 acres on a
  footprint 1.04 by 2.01 miles — one section's number drawn over two sections' ground. No parcel
  contains the point either, so there is no second witness. [verified] —
  [the survey sections](../measure/allen-county-survey-sections.yml).

  So the corpus does not say which section Beaverdam stands on. Every other place and site it holds
  a point for was located twice and agreed. [open]
