class: place
label: Westminster
description: |
  An unincorporated community of 1.821 square miles in the south-east of the county, internal
  point 40.701038, -83.975081, with 406 people at the 2020 census. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), where it is listed as
  `Westminster CDP`, and [TIGERweb](../../catalog/tigerweb-census2020.md) for the count.

  It lies wholly within [Auglaize Township](auglaize-township.yml) — all fourteen of its census
  blocks do — and holds 15 per cent of that township's 2,757 people. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  TIGERweb block geography. The generous test that county subdivisions merely *intersecting* it
  returns two townships, Auglaize and Perry; the block composition returns one. The difference is
  a shared boundary line, and it is why containment here is settled by counting blocks rather than
  by asking a spatial query.

  **It is older than every village in the county but one.** The county's 1834 tax list assesses
  Alex. Creps $1.89 on **thirty-six lots in the village of Westminster**, at a valuation of $172.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans agreeing. A platted village with thirty-six taxable lots in 1834
  predates Bluffton by three years, Spencerville by ten and Gomer by sixteen, and is beaten only by
  [Lima](lima.yml) in 1831. It has never been incorporated in the hundred and ninety years since,
  which is the difference between this place and the nine that were: they got a corporation and a
  boundary, and this got a plat and then nothing.

  It has exactly the population of [Lafayette](lafayette.yml), an incorporated village four miles
  north. The two are the same size and are not the same kind of thing: one has a
  council and a corporate boundary that annexation can move, and this has a statistical outline
  the Census Bureau draws. See [Gomer](gomer.yml) for how both of these places came to be missing
  from a corpus that had called its list of places complete.
