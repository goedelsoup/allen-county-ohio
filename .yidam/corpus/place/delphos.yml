class: place
label: Delphos
description: |
  A city of 3.322 square miles on the county's western edge, internal point 40.846581,
  -84.336474. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  Delphos straddles the Allen–Van Wert county line, and the Census Bureau's Allen County
  rows record it as `Delphos city (pt.)` for exactly that reason: the 3,941 counted there in
  the 2020 estimates base is the Allen County portion, not the city. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md). Any figure for Delphos
  taken from an Allen County table and reported as the city's population understates it. Its
  edge to the county is `partially-within` for the same reason, matching the qualification
  [the Village of Bluffton](../jurisdiction/village-of-bluffton.yml) already carries.

  **A third file now splits the city the same way and lands on the far side.** The federal library
  survey files [the Delphos Public Library](../organization/delphos-public-library.yml) under Allen
  County and geocodes its building into census tract 39161020500, which is Van Wert's. [verified] —
  [the Public Libraries Survey](../../catalog/imls-public-libraries-survey.md). The Census Bureau
  is the only one of the corpus's three sources on this city that handles the split explicitly —
  it writes `Delphos city (pt.)`. The Library of Congress files eighteen Delphos newspapers under
  Allen County, one of them titled "Delphos, Van Wert County, Ohio", and IMLS contradicts itself in
  two columns of one row. [inference] — the three read together. A file that names this city and
  then names a county is making a choice, and it does not always say which.

  **A fourth file makes the choice in the middle of its own run.** Ohio's register of plant closings
  carries five notices from this city — 1996, 2001, 2007, 2012 and 2013 — and names no county at
  all until 2008, so the first three are attributed to Allen County by the city's name and nothing
  else, while the last two are marked `(Allen)` by the state. [verified] —
  [the Ohio WARN registers](../../catalog/ohio-warn-notices-1996-2017.md); see
  [the notices](../measure/allen-county-layoff-notices-1996-2017.yml). Three of this county's
  twenty-three closing notices therefore rest on a place name that is true of two counties, and the
  corpus says so rather than dropping them. [inference]

  The city grew as a port on the Miami and Erie Canal, which is why it sits on the county
  edge rather than on any natural centre. [inference] See
  [the Miami and Erie Canal](../site/miami-and-erie-canal.yml).

  **It is the only place in this county besides Lima with anything on the National Register.**
  Two listings, both on the Allen County side: St. John Catholic Church, listed 3 January 1980, and
  the Marks Family House, 1 April 1982. Every other village in the county has none. [verified] —
  [the NPS spatial dataset](../../catalog/nrhp-national-register.md); see
  [the county's list](../measure/allen-county-national-register.yml).
  **It was four towns before it was one.** The county records Delphos as originally Howard,
  Section Ten, West Bredeick and East Bredeick, merged into a single town in 1851. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. That is the only municipality in the county
  the source describes as made rather than founded, and it is a different kind of origin from a
  platted town site: four settlements with four names, none of which survives on the map.

  **The merged town was incorporated by an act of February 7, 1851**, and held its first election
  on March 3, returning Lester Bliss as mayor and Smith Talbott as recorder. The corporation spent
  $80.67 in its first year. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans agreeing on the act's date. That puts a
  day on the year [the county's own page](../../catalog/allen-county-official-site.md) gives for the
  merger, from a source that had never seen it.

  **Section Ten was a place before it was a name.** The tract was the Ten-Mile Woods: in 1834
  William Brady and William Scott cut a road from the Auglaize River through it to Van Wert and
  "not even one cabin was to be seen in all that distance". [verified] — same source. The town's
  first newspaper, in 1848, was still called the *Section Ten Budget*.

  [open] Where the four stood relative to each other. The book treats Delphos as one town from the
  start and never lays the four out.

  **It was an interurban town as well as a steam one.** The 1906 history lists it on four steam
  railways "besides being on one of the best traction lines in the country — The Fort Wayne, Van
  Wert & Lima". [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). By 1921 it still had
  interurban service to Lima and Fort Wayne; see
  [the interurban](../measure/allen-county-interurban-1901-1921.yml).

  **A third witness to the county line, and it is a mailing list.** The twenty Ohio attorneys with a
  Delphos address of record divide thirteen to Allen County and seven to Van Wert, with none left
  unassigned. [verified] —
  [the attorney directory](../../catalog/ohio-attorney-directory.md). The county on that register is
  self-reported and is demonstrably incomplete elsewhere — seven Lima addresses carry no county at
  all, and Lima lies wholly in one — so its completeness here is the straddle appearing in a source
  with no reason to care about it. [inference]
  **A fourth witness, and this one disagrees with its own filing.** The federal gazetteer files
  Delphos under Allen County and puts its point at 40.8433831, -84.341618, which falls in Van Wert.
  [verified] — [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md); tested against
  [the county polygon](../../catalog/tigerweb-census2020.md). It is the only one of this county's
  120 named features whose filed county and whose ground disagree in that direction. [inference] —
  see [the named features](../measure/allen-county-named-features-2026.yml).
