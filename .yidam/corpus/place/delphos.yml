class: place
label: Delphos
description: |
  A city of 3.322 square miles on the county's western edge, internal point 40.846581,
  -84.336474. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  Delphos straddles the Allen–Van Wert county line, and the Census Bureau's Allen County
  rows record it as `Delphos city (pt.)` for exactly that reason: the 3,941 counted there in
  the 2020 estimates base is the Allen County portion, not the city. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md). Any figure for Delphos
  taken from an Allen County table and reported as the city's population understates it. Its
  edge to the county is `partially-within` for the same reason, matching the qualification
  [the Village of Bluffton](../jurisdiction/village-of-bluffton.yml) already carries.

  The city grew as a port on the Miami and Erie Canal, which is why it sits on the county
  edge rather than on any natural centre. [inference] See
  [the Miami and Erie Canal](../site/miami-and-erie-canal.yml).

  **It is the only place in this county besides Lima with anything on the National Register.**
  Two listings, both on the Allen County side: St. John Catholic Church, listed 3 January 1980, and
  the Marks Family House, 1 April 1982. Every other village in the county has none. [verified] —
  [the NPS spatial dataset](../../catalog/nrhp-national-register.md); see
  [the county's list](../measure/allen-county-national-register.yml).
  **It was four towns before it was one.** The county records Delphos as originally Howard,
  Section Ten, West Bredeick and East Bredeick, merged into a single town in 1851. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. That is the only municipality in the county
  the source describes as made rather than founded, and it is a different kind of origin from a
  platted town site: four settlements with four names, none of which survives on the map.

  **The merged town was incorporated by an act of February 7, 1851**, and held its first election
  on March 3, returning Lester Bliss as mayor and Smith Talbott as recorder. The corporation spent
  $80.67 in its first year. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans agreeing on the act's date. That puts a
  day on the year [the county's own page](../../catalog/allen-county-official-site.md) gives for the
  merger, from a source that had never seen it.

  **Section Ten was a place before it was a name.** The tract was the Ten-Mile Woods: in 1834
  William Brady and William Scott cut a road from the Auglaize River through it to Van Wert and
  "not even one cabin was to be seen in all that distance". [verified] — same source. The town's
  first newspaper, in 1848, was still called the *Section Ten Budget*.

  [open] Where the four stood relative to each other. The book treats Delphos as one town from the
  start and never lays the four out.
