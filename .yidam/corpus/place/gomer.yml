class: place
label: Gomer
description: |
  An unincorporated community of 2.286 square miles in the north-west of the county, internal
  point 40.845448, -84.182796, with 345 people at the 2020 census. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), where it is listed as
  `Gomer CDP`, and [TIGERweb](../../catalog/tigerweb-census2020.md) for the count.

  It lies wholly within [Sugar Creek Township](sugar-creek-township.yml) — all twelve of its
  census blocks do, and it is the only settlement in the county's least populous township.
  [verified] — [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md)
  crossed with TIGERweb block geography. Its 345 people are 28 per cent of that township's 1,231.

  **This node exists because of how it was missed.** The corpus built its list of places from the
  Census Bureau's sub-county population file, which tabulates governmental units — a village has
  a corporation and appears; a census designated place has none and does not. Two places in Allen
  County were therefore invisible to a method that had already been called complete: this one and
  [Westminster](westminster.yml). The place/jurisdiction distinction this ontology insists on had
  quietly become a filter on what the corpus could see.

  **It was laid out in 1850 by Samuel Ramsay and James Nicholas**, on Sections 20, 21, 28 and 29,
  with the first and second additions made by D. D. Nicholas. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), which also
  records it as the only post office in the township — as it is still the township's only
  settlement.

  **The first Welsh preaching here predates the village by twelve years, and it happened in the
  house of the man who laid the village out.** "In 1838, when Rev. B. W. Chidlaw of Paddys Run first
  preached in the Welsh tongue to the people of the settlement in the home of James Nicholas, the
  pulpit was improvised from clapboards." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). James
  Nicholas laid out Gomer with Samuel Ramsay in 1850. [inference] — the same name in two sources,
  and neither says they are the same man.

  **The first Welsh log church, and a disagreement about when.** The 1921 book puts it at 1841; the
  1906 book says of the same settlement that "the first log church was built in the year 1839".
  [verified] — the 1921 history and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). An old account of the
  building, quoted in 1921: "The building was not large and the architecture was not grand, and the
  interior furnishings were not elaborate, but it was larger and better than any of the" homes
  around it — the sentence is cut off at a page break in the scan and the corpus does not complete
  it.

  **The organ divided them in 1857.** "The organ was introduced into the first Welsh church in 1857,
  and the congregation was divided in sentiment about it." [verified] — the 1921 history, which also
  records the settlement reviewing "its seventy-five years of church history" in 1913 — dating
  itself from 1838 — and names five permanent Welsh ministers: Michael Martz, Henry Morris,
  A. R. Brebbs, John W. Thomas and David Jones.

  **The Welsh settlement is on record.** The Welsh Congregationalists built a house of worship just
  south of the village in 1873 at a cost of over $16,000 — an enormous sum for a hamlet in a
  township of a thousand people — and the Welsh had already put up another two and a half miles
  east. [verified] — same source, which names Welsh families among the township's farmers. The
  local account of a Welsh settlement here is therefore not folklore.

  **Nearly a third of it is in the floodplain, which is more than any incorporated place in the
  county.** 448.4 of its 1,469 acres — 30.53 per cent — lie in the special flood hazard area,
  against 17.43 per cent for Bluffton and 4.27 for Lima. [verified] —
  [the mapped floodplain](../measure/allen-county-flood-hazard-2026.yml). It sits in the county's
  most flood-mapped township, [Sugar Creek](sugar-creek-township.yml) at 17.04 per cent, and it is
  the only settlement in it.

  [open] What the name refers to, and where the Welsh came from and when. Gomer is a Welsh name,
  but the book gives no etymology and the corpus is not supplying one.
