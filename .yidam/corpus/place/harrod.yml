class: place
label: Harrod
description: |
  A village of 0.234 square miles in [Auglaize Township](auglaize-township.yml), about 11 miles south-east of the
  county's centre, internal point 40.707214, -83.921405. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio places.

  Its population was 427 at the 2020 estimates base and 427 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population was unchanged between the two figures.

  **All of it is in Allen County.** The same file marks a place that crosses a county line with
  `(pt.)` and marks this one plainly, which is what separates it from
  [Bluffton](bluffton.yml) and [Delphos](delphos.yml). [verified] — same source.

  **The village is one voting precinct, exactly.** Precinct `HARROD` holds 423 people and 173 housing
  units, and every block in it is in the village and every block of the village is in it. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md)
  crossed with [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. Four of the county's
  nine municipalities are single precincts on these terms; the other five are split, and
  [Lima](lima.yml) is cut into 23. [verified] —
  [the county's voting districts](../measure/allen-county-voting-districts-2020.yml).

  **Named for the Harrod family**, who settled the ground in 1841; the village was established in
  1884, forty-three years later. [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. It
  is the only municipality in the county the source names a family for.

  **The Harrod was William Harrod**, born in Knox County, Ohio on October 4, 1819, of Pennsylvania
  stock and from a family among Knox County's early pioneers. He settled on the land in 1841 and
  still occupied it in 1885; his son J. M. Harrod was born in
  [Auglaize Township](auglaize-township.yml) on March 7, 1852 and farmed there, with the post office
  already carrying the family name. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The county's page gives 1841 with no name;
  this is the same year from an unrelated source, with a person attached to it.

  [open] When the [Village of Harrod](../jurisdiction/village-of-harrod.yml) was incorporated. The
  1885 book was printed the year after the settlement was established and treats Harrod only as a
  post office, so the corporation is later than anything this source can see.
