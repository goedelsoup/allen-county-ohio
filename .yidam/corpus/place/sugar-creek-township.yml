class: place
label: Sugar Creek Township
description: |
  The **smallest of the county's thirteen civil subdivisions by population** and among its
  smallest by area — 24.094 square miles, internal point 40.824171, -84.173843. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md). Its 2020 estimates base was
  1,226 and its 2024 estimate 1,197, a twelfth of American Township's on comparable ground, and
  it contains no incorporated place. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file.

  It contains one settlement, [Gomer](gomer.yml), whose 345 people are 28 per cent of the
  township — a census designated place, so the claim above that it holds no *incorporated* place
  still stands. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md). It is also
  one of only two townships in the county that a single school district covers entire; every block
  of it is in [Elida Local](../jurisdiction/elida-local-school-district.yml), a district named for
  a village three miles south of this township and not in it. [verified] — same source, crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography.

  **It was Putnam County's before it was Allen's.** The township was set off in 1831 as a division
  of Putnam County, then Congressional Township 2, Range 6, with James Porter, Daniel Gray and
  William Turner as its first trustees. Its present shape dates from the
  [reorganization of 1848](../event/reorganization-of-1848.yml), which joined the north tier of
  German Township — now [American](american-township.yml) — to the south half of the old township
  and organized the two as Sugar Creek. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **It is named for its sugar maple groves**, whose number and productiveness the 1885 compiler
  gives as the origin, adding that the Shawnee took their year's supply of maple sugar from this
  ground. [verified] — same source.

  It is in the corpus as the worked example of why [division](../division/) is a separate
  class from place: the census tract that covers this ground is
  [tract 39003010300](../division/census-tract-39003010300.yml), whose internal point lies
  about three quarters of a mile from the township's and whose land area is roughly five
  square miles larger. The two units nearly coincide and are not the same ground.
  **It held 1,010 people in 1890, 1,038 in 1900 and 1,088 in 1910.** [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the 1890–1910 divisions](../measure/allen-county-townships-1890-1910.yml). A hundred and thirty years later it is 1,226, and every
  figure the corpus holds for this township — seven counts across that span — lies between 969 and
  1,226, a range of a quarter. [inference]

  **It held 1,023 people in 1930, 969 in 1940 and 990 in 1950**, and 1,226 at the 2020 estimates
  base. [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6; see [the township series](../measure/allen-county-townships-1930-1950.yml). It is the least changed place in
  Allen County: a fifth larger after ninety years, the smallest growth of the twelve townships, and
  smaller in 1950 than it had been in 1930. [inference] It contains no incorporated place.

