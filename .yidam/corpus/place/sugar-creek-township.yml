class: place
label: Sugar Creek Township
description: |
  The **smallest of the county's thirteen civil subdivisions by population** and among its
  smallest by area — 24.094 square miles, internal point 40.824171, -84.173843. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md). Its 2020 estimates base was
  1,226 and its 2024 estimate 1,197, a twelfth of American Township's on comparable ground, and
  it contains no incorporated place. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file.

  It contains one settlement, [Gomer](gomer.yml), whose 345 people are 28 per cent of the
  township — a census designated place, so the claim above that it holds no *incorporated* place
  still stands. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md). It is also
  one of only two townships in the county that a single school district covers entire; every block
  of it is in [Elida Local](../jurisdiction/elida-local-school-district.yml), a district named for
  a village three miles south of this township and not in it. [verified] — same source, crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography.

  It is in the corpus as the worked example of why [division](../division/) is a separate
  class from place: the census tract that covers this ground is
  [tract 39003010300](../division/census-tract-39003010300.yml), whose internal point lies
  about three quarters of a mile from the township's and whose land area is roughly five
  square miles larger. The two units nearly coincide and are not the same ground.
