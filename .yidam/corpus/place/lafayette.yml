class: place
label: Lafayette
description: |
  A village of 0.233 square miles in [Jackson Township](jackson-township.yml), about 8 miles east of the
  county's centre, internal point 40.758911, -83.949922. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio places.

  Its population was 402 at the 2020 estimates base and 395 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It lost 7 people over those four years.

  **All of it is in Allen County.** The same file marks a place that crosses a county line with
  `(pt.)` and marks this one plainly, which is what separates it from
  [Bluffton](bluffton.yml) and [Delphos](delphos.yml). [verified] — same source.

  **The village is one voting precinct, exactly.** Precinct `LAFAYETTE` holds 406 people and 175 housing
  units, and every block in it is in the village and every block of the village is in it. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md)
  crossed with [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. Four of the county's
  nine municipalities are single precincts on these terms; the other five are split, and
  [Lima](lima.yml) is cut into 23. [verified] —
  [the county's voting districts](../measure/allen-county-voting-districts-2020.yml).

  The [Village of Lafayette](../jurisdiction/village-of-lafayette.yml) was **incorporated in
  1868**, the earliest incorporation this corpus holds for any municipality in the county.
  [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages page.

  **It was platted by William B. Weyer**, in Section 28 of [Jackson Township](jackson-township.yml),
  laid out in regular blocks north of Sugar Street with Weyer's own western and southern additions
  around it. **The commissioners granted authority to organize the village on September 3, 1867**,
  on M. C. Murnagh's petition, and the first election was held March 13, 1868. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).
  That is the county's own record behind the bare "incorporated in 1868" on its website, and it
  shows the two dates the website collapses: the authority and the election fall in different years.

  [open] The year the town was platted, and what the name refers to. The book names the platter and
  omits his date — which leaves this still the one village in the county with an incorporation and
  no founding.

  **In 1905 its interurban had not been built.** A resident's chapter speaks of "our railroad, and
  soon-to-be traction line paralleling it and all other facilities of travel through the village of
  LaFayette". [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).
  This village lies east of Lima, and it is the promised eastern line that lets the same book's
  county chapter say traction lines crossed the county "in four directions" while its transportation
  chapter names three companies. [inference] — see
  [the interurban](../measure/allen-county-interurban-1901-1921.yml).

