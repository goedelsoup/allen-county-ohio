class: place
label: Bluffton
description: |
  A village of 3.652 square miles in the county's north, internal point 40.892048,
  -83.887793. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  Like [Delphos](delphos.yml), Bluffton straddles a county line — here the Allen–Hancock
  line — and appears in Allen County tables as `Bluffton village (pt.)`, with 3,762 in the
  2020 estimates base against a village total that is larger. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md). So its edge to the county
  is `partially-within`, not `within`.

  It is the seat of Bluffton University and has a Swiss Mennonite settlement history that
  distinguishes it from the rest of the county. [inference]
  **It was originally known as Shannon.** [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages
  page, which also names [Bluffton University](../organization/bluffton-university.yml) here and
  its Mennonite affiliation.

  **Platted in 1837 as Shannon, by Joseph Deford**, on Sections 1 and 12 of
  [Richland Township](richland-township.yml) — four blocks bounded by Jackson, Monroe, Jefferson and
  Riley streets. **The name was changed to Bluffton in 1872-73**, "although long prior to this the
  latter name was bestowed upon it". [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans agreeing. At 1837 it is the
  county's second-oldest platted town after [Lima](lima.yml).

  **"Long prior to this" is now dated, and it is eleven years prior.** On 17 August 1861 the town
  voted to incorporate and to be called Bluffton. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md) and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the ballot](../event/the-naming-and-incorporation-of-bluffton-1861.yml). **The corporation and
  the post office changed names twelve years apart**: the 1885 book's 1872–73 is the post office,
  which had been Croghan, then Shannon, and "again in 1873 named Bluffton". [inference] — the three
  books read together. So the ground was called Shannon for twenty-four years and its post office
  for thirty-six.

  **Its bank is why John Dillinger was in the Allen County jail.** He was brought up from Dayton
  in the autumn of 1933 charged with robbing "the Bluffton, O., Commercial Bank of $2200", and was
  awaiting trial at Lima when three men shot the sheriff and took him out of the cell. [verified] —
  [Chronicling America](../../catalog/chronicling-america.md), *The Washington Daily News*,
  13 October 1933; see [the raid on the Allen County jail](../event/allen-county-jail-raid-1933.yml).

  A retrospective printed nine months later gives the sum as $2,800. [open]

  **Its two witnesses to its own ground disagree, and the county line is why.** The section grid
  puts Bluffton's internal point in T2S R8E §1; the parcel containing the same point is numbered
  into §12, directly south. [verified] —
  [the survey sections](../measure/allen-county-survey-sections.yml). The point is the *whole*
  village's, Hancock County included, so it sits near that section line rather than inside either
  section with a margin — which is the same straddle that makes this village `Bluffton village
  (pt.)` in every census table. [inference]

  The corpus does not assert its section. [open]

  [open] When the village was incorporated, and what Bluffton refers to — the book names the
  platter and the year and offers no etymology for either name.

  **An interurban ran down its main street, and the through route it belonged to crossed the whole
  state.** "An electric railway passes directly through Main street, starting from Toledo and ending
  in Cincinnati, thus making Bluffton a railroad center." [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). The same book's
  transportation chapter, counting trains that landed passengers in Lima, does not name this line;
  see [the interurban](../measure/allen-county-interurban-1901-1921.yml).


  **Its water crosses a county line and its records show why that matters.** The village owns eight
  wells and buys surface water from Ottawa Village in Putnam County, which is why the federal file
  codes it a surface-water system though it owns no intake. [verified] —
  [the water systems](../measure/allen-county-water-systems-2026.yml). It was over a drinking-water
  standard for ten consecutive quarters from October 2013, the longest such run in the county's
  record, and cleared all ten on 7 April 2016. [verified] —
  [the violations](../measure/allen-county-water-violations-1984-2026.yml).

  **The county's deadliest tornado ended near here.** The F4 of 11 April 1965 is recorded ending at
  40.87, −83.87, 1.8 miles from the village, after 17.8 miles from Elida. [verified] —
  [the tornado](../event/the-tornado-of-11-april-1965.yml).

  **And three-quarters of the county's 2007 flood damage was in this ZIP code.** 45817 holds 109 of
  Allen County's 227 owner registrations for the flood of August 2007, 91 of its 195 inspections and
  $481,404 of the $663,302 of inspected damage — 72.6 per cent, at an average of $4,416.55 a
  property. [verified] —
  [the household aid](../measure/allen-county-household-disaster-aid-2007-2020.yml). The village,
  its university and its school district were all paid public assistance for it. [verified] —
  [who was paid](../measure/allen-county-disaster-aid-applicants-2005-2025.yml).

  **A third witness to the county line, and it is a mailing list.** The eight Ohio attorneys with a
  Bluffton address of record divide six to Allen County and two to Hancock, with none left
  unassigned — the same clean split [Delphos](delphos.yml) shows on its own line. [verified] —
  [the attorney directory](../../catalog/ohio-attorney-directory.md). That register's county is
  self-reported and is incomplete where no county line runs through a city, so its completeness here
  is the straddle appearing in a source with no reason to care about it. [inference]
