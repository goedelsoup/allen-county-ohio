class: place
label: Bluffton
description: |
  A village of 3.652 square miles in the county's north, internal point 40.892048,
  -83.887793. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  Like [Delphos](delphos.yml), Bluffton straddles a county line — here the Allen–Hancock
  line — and appears in Allen County tables as `Bluffton village (pt.)`, with 3,762 in the
  2020 estimates base against a village total that is larger. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md). So its edge to the county
  is `partially-within`, not `within`.

  It is the seat of Bluffton University and has a Swiss Mennonite settlement history that
  distinguishes it from the rest of the county. [inference]
  **It was originally known as Shannon.** [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages
  page, which also names [Bluffton University](../organization/bluffton-university.yml) here and
  its Mennonite affiliation.

  [open] When the name changed from Shannon, when the village was incorporated, and what Bluffton
  refers to.
