class: place
label: Cairo
description: |
  A village of 0.277 square miles in [Monroe Township](monroe-township.yml), about 4 miles north of the
  county's centre, internal point 40.830753, -84.084489. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio places.

  Its population was 519 at the 2020 estimates base and 508 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It lost 11 people over those four years.

  **All of it is in Allen County.** The same file marks a place that crosses a county line with
  `(pt.)` and marks this one plainly, which is what separates it from
  [Bluffton](bluffton.yml) and [Delphos](delphos.yml). [verified] — same source.

  **The village is one voting precinct, exactly.** Precinct `CAIRO` holds 517 people and 216 housing
  units, and every block in it is in the village and every block of the village is in it. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md)
  crossed with [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. Four of the county's
  nine municipalities are single precincts on these terms; the other five are split, and
  [Lima](lima.yml) is cut into 23. [verified] —
  [the county's voting districts](../measure/allen-county-voting-districts-2020.yml).

  **Established in 1848 as West Cairo**, and renamed Cairo in 1922. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. Main Street here was part of the Lincoln
  Highway, the country's first coast-to-coast road. [verified] — same source.

  **It was platted in 1848 by Jacob Miller**, on Sections 29, 30, 31 and 32 of
  [Monroe Township](monroe-township.yml), running east from the Brenneman farm and lying mainly west
  of the Perrysburg Road at its crossing with the Bucyrus Road. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The county's own
  page gives 1848 without a founder; this is a second source arriving at the same year by a
  different route, seventy years earlier.

  [open] When the [Village of Cairo](../jurisdiction/village-of-cairo.yml) was incorporated, what
  the name refers to, and what kind of act the 1922 renaming was. The 1885 book calls it West Cairo
  throughout and never says why, so the corpus now knows the older name was in continuous use for
  at least seventy-four years and still not what either name means.
