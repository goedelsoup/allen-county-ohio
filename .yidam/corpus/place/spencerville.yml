class: place
label: Spencerville
description: |
  A village of 0.965 square miles in [Spencer Township](spencer-township.yml), about 14 miles west of the
  county's centre, internal point 40.707965, -84.353159. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio places.

  Its population was 2,205 at the 2020 estimates base and 2,164 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It lost 41 people over those four years.

  **All of it is in Allen County.** The same file marks a place that crosses a county line with
  `(pt.)` and marks this one plainly, which is what separates it from
  [Bluffton](bluffton.yml) and [Delphos](delphos.yml). [verified] — same source.

  **Founded in 1844 on the banks of the [Miami and Erie Canal](../site/miami-and-erie-canal.yml).**
  [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. That verifies for this village
  what the canal node had only inferred about the two canal towns, and it dates the settlement to
  the canal's own working decade.

  **The county's only National Historic Landmark is filed under this village and is not in it.**
  The Miami and Erie Canal's Deep Cut, listed 15 October 1966, gives its address as "2 mi. S of
  Spencerville on OH 66", carries the register's `Vicinity` flag, and falls in
  [Spencer Township](spencer-township.yml) outside the corporation. The village itself holds no
  listing of any kind. [verified] —
  [the NPS spatial dataset](../../catalog/nrhp-national-register.md) against
  [Allen County GIS](../../catalog/allen-county-gis-rest.md); see
  [the county's list](../measure/allen-county-national-register.yml).

  **It was laid out about 1844-45 for Tyler, McConnell and Conover of Dayton**, who bought 350 acres
  and built a mill at the upper canal lock. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), quoting Dr. Campbell's 1880
  reminiscence. Speculators from Dayton buying at a lock the year the canal opened is what a canal
  town's founding looks like from the inside.

  **The name is [Spencer Township's](spencer-township.yml), and that is Col. Spencer** of the State
  Board of Public Works in 1848, "an ardent supporter of canal building enterprises". [verified] —
  same source. The canal town is named, at one remove, for a canal commissioner.

  **A village died to make it.** "The old village of Hartford ceased to exist upon the founding of
  Spencerville, to which location many of the Hartford people came to reside" — it had two
  physicians practising by 1836. [verified] — same source, though only one of the two scans carries
  the passage legibly; see [two scans of one book](../../decisions/two-scans-of-one-book.yml).

  **[The corporation](../jurisdiction/village-of-spencerville.yml) dates from an act of 1867**,
  twenty-three years after the settlement. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  [open] Where Hartford stood.
