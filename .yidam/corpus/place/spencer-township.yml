class: place
label: Spencer Township
description: |
  A township of 23.308 square miles about 14 miles west of the county's centre, internal
  point 40.732439, -84.371928. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 3,058 at the 2020 estimates base and 2,998 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 60 over those four years, as all but two of the county's subdivisions did.

  It contains [Spencerville](spencerville.yml). [verified] — same source, which reports it as a place within this township.

  **The county's youngest township, created February 28, 1848** — it did not exist before the
  [reorganization](../event/reorganization-of-1848.yml), which took the north-east quarter of Salem
  and the east half of Jennings **from Van Wert County**, added sections 7 and 18 of
  [Amanda](amanda-township.yml), and set the whole off under a new name. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  Its two parent townships have dates of their own: Jennings was laid off June 2, 1834 and organized
  at Benjamin Griffin's house on June 21; Salem was established in December 1836 and organized at
  Michael Tippe's house in January 1837, set off from the older township of Wayne. [verified] —
  same source.

  **It is named for Col. Spencer**, a member of the State Board of Public Works in 1848 and an
  ardent supporter of canal building — which is why the county's canal township carries a canal
  commissioner's name. [verified] — same source. See
  [the Miami and Erie Canal](../site/miami-and-erie-canal.yml), whose lock is in section 36 of this
  township. Charles C. Marshall was justice of the peace at organization.

  [open] Col. Spencer's given name. The book gives a rank and a board seat and no more.
