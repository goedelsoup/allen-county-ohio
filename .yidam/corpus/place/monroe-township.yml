class: place
label: Monroe Township
description: |
  A township of 36.094 square miles about 7 miles north of the county's centre, internal
  point 40.864357, -84.060914. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 2,050 at the 2020 estimates base and 2,005 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 45 over those four years, as all but two of the county's subdivisions did. That makes it the 11th most populous of the county's thirteen civil subdivisions.

  It contains [Cairo](cairo.yml). [verified] — same source, which reports it as a place within this township.

  Three school districts divide it, and one of them is not an Allen County district at all: 1,129
  of its people are in [Bath Local](../jurisdiction/bath-local-school-district.yml), 489 in Putnam
  County's [Columbus Grove Local](../jurisdiction/columbus-grove-local-school-district.yml), and
  449 in [Bluffton Exempted Village](../jurisdiction/bluffton-exempted-village-school-district.yml).
  [verified] — [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md)
  crossed with [TIGERweb](../../catalog/tigerweb-census2020.md) block geography.

  **Organized in 1835 as a township of Putnam County**, on a petition to that county's
  commissioners, with John Peters, Peter Harpster and Anthony Early as trustees, Benjamin Parker
  clerk and Luke Tipton justice of the peace. **It was not in Allen County until 1848**, when this
  portion of Putnam was attached in the
  [reorganization](../event/reorganization-of-1848.yml) — which let it keep both its name and its
  organization while every township around it was recomposed. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **It was largest in 1890, at 1,995 people, then 1,875 in 1900 and 1,768 in 1910.** [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the 1890–1910 divisions](../measure/allen-county-townships-1890-1910.yml). It fell
  at every count the corpus holds from 1890 to 1930 and is 2,050 today, **three per cent above where it started** —
  the least changed of the county's twelve townships across a hundred and thirty years. [inference]
  [Cairo](cairo.yml) appears as *West Cairo village* at all three, at 325, 338 and 386, which is a
  federal witness for the older name. [verified] — same source.

  **It held 1,591 people in 1930, 1,622 in 1940 and 1,699 in 1950**, and 2,050 at the 2020 estimates
  base. [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6; see [the township series](../measure/allen-county-townships-1930-1950.yml). [Cairo](cairo.yml) ran 374, 440 and
  505 across the same three censuses — the village grew by a third while the township grew by a
  fifteenth, so through the 1930s and 1940s Monroe was concentrating into its village. [inference]

  [open] What the name refers to. The book gives none.
