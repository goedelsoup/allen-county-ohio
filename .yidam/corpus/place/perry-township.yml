class: place
label: Perry Township
description: |
  A township of 32.704 square miles about 8 miles south-east of the county's centre, internal
  point 40.675113, -84.041425. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 3,377 at the 2020 estimates base and 3,333 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 44 over those four years, as all but two of the county's subdivisions did.

  It contains no incorporated place; all of it is unincorporated. [verified] — same source, which lists no place within this township.

  **Established by the county board in December 1833 and organized in April 1834** at the house of
  Joseph Crossley, with Hugh Skilling Sr., John Ridenour and Joseph Crossley elected trustees.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). Its twelve western sections had until then belonged to
  [Auglaize Township](auglaize-township.yml). [verified] — same source.

  [open] What the name refers to. The book gives none.
