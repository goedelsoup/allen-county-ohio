class: place
label: Richland Township
description: |
  A township of 41.648 square miles about 11 miles north-east of the county's centre, internal
  point 40.869365, -83.936562. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 5,889 at the 2020 estimates base and 5,775 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 114 over those four years, as all but two of the county's subdivisions did.

  It contains [Beaverdam](beaverdam.yml) and [Bluffton](bluffton.yml). [verified] — same source, which reports them as places within this township.

  **Organized in 1835 as a township of Putnam County**, on the petition of David Miller and others,
  with Henry Shank and Daniel Goble the first justices and Henry Carter the first constable.
  **It was not in Allen County until 1848**, when the
  [reorganization](../event/reorganization-of-1848.yml) added Riley Township's south tier to it.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **It is named for Richland County, Ohio.** Henry Carter's reminiscence, recorded in 1885, credits
  David Miller — a shoemaker "just in from Richland County" — with pushing the new township through
  and giving it his former county's name. [verified] — same source. That is a settler's recollection
  of fifty years earlier, not a record entry, and it is the only name origin in the county that
  comes with the person who chose it.

  [open] Whether the commissioners' record confirms the naming, or only Carter does.
