class: place
label: Auglaize Township
description: |
  A township of 35.99 square miles about 11 miles south-east of the county's centre, internal
  point 40.695518, -83.928053. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 2,764 at the 2020 estimates base and 2,819 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It is one of only two subdivisions in the county that grew over those four years, by 55.

  It contains [Harrod](harrod.yml) [verified] — same source, which reports it as a place within
  this township — and also [Westminster](westminster.yml), a census designated place of 406 that
  the sub-county file does not list because it has no government. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md).

  Its schools are split: 2,740 of its people are in
  [Allen East Local](../jurisdiction/allen-east-local-school-district.yml) and 17, on two blocks at
  the south-east corner, in Auglaize County's
  [Waynesfield-Goshen](../jurisdiction/waynesfield-goshen-local-school-district.yml). [verified] —
  same source, crossed with [TIGERweb](../../catalog/tigerweb-census2020.md) block geography.

  **The continental divide runs through it.** Four of its census blocks — 99 people and 43
  housing units, along the county's eastern edge between 40.6487 and 40.7104 north — are in
  [the Scioto basin](../natural-feature/scioto-river-basin.yml) and drain to the Ohio River and
  the Gulf of Mexico. They are the only ground in Allen County that does. [verified] —
  [USGS Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md), by block composition.

  The same township is where [the Auglaize River](../natural-feature/auglaize-river.yml) rises,
  and the Auglaize runs the other way, to Lake Erie. So this township holds the headwaters of the
  river the county is drained by and the whole of its Gulf-side ground, a few miles apart.

  **Established March 5, 1832 by order of the commissioners of Allen County** — the first township
  the county's own board created from nothing rather than inherited. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **A township named Scioto was disestablished into it in December 1832** and attached to Auglaize
  "for judicial purposes"; until [Perry](perry-township.yml) was established in December 1833 its
  twelve eastern sections were part of this township. [verified] — same source. The county has
  carried no Scioto township since, and this township is still where
  [its Gulf-side ground](../natural-feature/scioto-river-basin.yml) lies — the only part of Allen
  County that drains to the Ohio.

  **The later history says Scioto is unexplained; the earlier one explains it.** In 1921 Rusler
  writes that "when Allen County was organized in 1831, its four townships were Amanda, Bath,
  Jackson and Scioto; in 1832 there was a German but no Scioto and no explanation is offered about
  it." [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). The explanation is in the book on the shelf beside it: the commissioners
  disestablished Scioto in December 1832 and attached its district to this township for judicial
  purposes. The corpus's older source answers its newer source's stated gap — which is the argument
  for holding both.

  **Its 1,929 people in 1890 stood as its highest count for the next sixty years**, against 1,909 in
  1900 and 1,883 in 1910. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the 1890–1910 divisions](../measure/allen-county-townships-1890-1910.yml). [Harrod](harrod.yml) ran 269, 370 and 474 across the same three censuses, so the
  village nearly doubled while the township slipped — the growth below is a recovery before it is
  an expansion. [inference]

  **It held 1,675 people in 1930, 1,719 in 1940 and 1,912 in 1950**, and 2,764 at the 2020 estimates
  base. [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6; see [the township series](../measure/allen-county-townships-1930-1950.yml). It has grown at every observation the
  corpus holds, which no other township here has done, and it is also one of only two subdivisions
  in the county that gained population between 2020 and 2024. [inference]
  [Harrod](harrod.yml) ran 421, 422 and 482, so the village has been about a quarter of the
  township throughout and is now a sixth.

  [open] What Scioto Township comprised, and whether its name and the ground draining to the
  Scioto were connected or a coincidence. The book gives no name origin for Auglaize Township
  itself; the river is the obvious candidate and the corpus is not asserting it.
