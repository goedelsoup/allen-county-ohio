class: place
label: Lima
description: |
  The county seat and largest settlement, 13.617 square miles of land with an internal point
  at 40.740679, -84.112091. [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).
  It is the only place in Allen County that the Census Bureau treats as its own county
  subdivision rather than as a village inside a township, which is the tabular trace of its
  having been separated from the townships around it. [verified] — same source, county
  subdivision file.

  **Ten phases of counting this city and this is the first that says who is in it.** 35,304 people
  in the 2023 survey: 64.0 per cent white, 23.5 per cent Black, 4.8 per cent Hispanic. Median
  household income $43,370 ± $2,298; 24.8 per cent below the poverty line; median age 35.4.
  [verified] — [American Community Survey](../../catalog/census-acs-summary-file.md); see
  [income and poverty](../measure/allen-county-income-and-poverty-2023.yml),
  [race](../measure/allen-county-race-2023.yml) and
  [age](../measure/allen-county-age-structure-2023.yml).

  **It is a third of the county's people, two thirds of its poor, and three quarters of its Black
  residents.** 34.7 per cent of the population, 8,214 of the county's 12,815 people below poverty,
  and 8,290 of its 10,805 Black residents. [verified] — same source. The twelve townships hold the
  remainder and all three sums close exactly on the county's own rows.

  **Its household income is 48 per cent of the township across its southern line.** $43,370 against
  Shawnee Township's $91,134 — a gap of $47,764 against a combined margin of $6,359 — and 55 per
  cent of the national figure. [verified] — same source.

  This does not establish that Lima is the poorest subdivision in the county. Perry Township's
  median household income is higher by $9,902 against a combined margin of $11,142, and two figures
  that close cannot be ordered from this source. [verified] — see
  [a survey is not a count](../../decisions/a-survey-is-not-a-count.yml).

  **And it is the young end of this county, not the old one.** Median age 35.4 against the county's
  39.7, 15.6 per cent over 65 against 18.7, and a higher share under 18. Eleven of the twelve
  townships are older. [verified] — same source. A city losing a third of its people over fifty
  years is not, on this evidence, losing them to age.

  **It is where the county rents, and where the county's empty houses are.** 46.4 per cent of its
  occupied units are owner-occupied, against 72.0 to 91.0 per cent in every township; it holds 35.4
  per cent of the county's housing and 48.2 per cent of its vacant housing. Its median house is
  worth $95,900 where Shawnee Township's, across the southern line, is $210,200. [verified] —
  [the housing stock](../measure/allen-county-housing-stock-2023.yml).

  **The median house standing in Lima was built in 1953**, twenty years before the median house in
  the three townships that ring it, and 34.9 per cent of the city's housing predates 1940 against
  6.4 to 7.1 per cent in those three. [verified] —
  [when the housing was built](../measure/allen-county-housing-age-2023.yml).

  **Borrowing against a house here is the hard thing, and buying one is a little harder too.**
  Across 2018–2024, mortgages to purchase in the city's census tracts were denied at 13.3 per cent
  against 10.8 elsewhere in Allen County, and every other purpose at 37.7 against 21.5. [verified] —
  [seven years of the register](../measure/allen-county-home-lending-2018-2024.yml). Twenty-one per
  cent of the 2023 denials here cite collateral against 13 per cent elsewhere. [verified] —
  [the single year](../measure/allen-county-home-lending-2023.yml). Collateral is the house.
  [inference]

  This node said until now that buying a house here was no harder than buying one anywhere in the
  county. That was 2023, the only year of seven in which Lima's purchase rate is the lower one, and
  it is withdrawn. [verified] — see
  [a rule is not a habit](../../decisions/a-rule-is-not-a-habit.yml).

  **One housing unit in nine here is empty, and its households are the county's smallest.** 16,028
  units, 14,237 occupied, 1,791 vacant — an 11.2 per cent vacancy rate against 8.14 for the county
  and 4.5 for Amanda Township — and 2.344 people per occupied unit against Amanda's 2.691.
  [verified] — [the occupancy](../measure/allen-county-occupancy-2020.yml). No township comes
  within three points of the city on the first or within a tenth of a person on the second.

  **It holds nearly two thirds of the county's people who live outside households.** 2,210 of
  3,522, including all 1,513 in correctional facilities — the two state institutions north of the
  city, [Allen Correctional](../site/allen-correctional-institution.yml) and
  [Oakwood](../site/oakwood-correctional-facility.yml), each of which the Census Bureau treats as
  a block of its own. [verified] —
  [the group quarters](../measure/allen-county-group-quarters-2020.yml). Their ground was the farm
  of [the Lima State Hospital](../site/lima-state-hospital.yml), in Bath Township when the 1921
  history described it and inside the city now. [inference]

  **Its whole line of mayors from 1842 to 1886 is on record.** Twenty-four men over twenty-seven
  terms in forty-four years, from Henry D. V. Williams at the organization to William McComb in
  1884-86; three served twice, two resigned in office and one was made mayor by the council rather
  than by an election. [verified] —
  [the line of mayors](../measure/lima-mayors-1842-1886.yml). After McComb the corpus can name no
  mayor of this city for a hundred and thirty-nine years.

  **It was a garrison town for a fortnight in 1862, and the garrison outnumbered the town.** Lima
  had 1,989 people at the 1860 census; in August 1862 about 1,600 men were camped across the Ottawa
  River at [Camp Lima](../site/camp-lima.yml), the rendezvous of Ohio's Eighth Military District.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  Its war began on a Sunday morning at the second courthouse, with a flag on a wire between Ashton
  Hall and the building and a store box for a platform; the first company was ninety-two men and was
  inducted eight days later. [verified] —
  [the 1921 history](../../catalog/rusler-allen-county-1921.md); see
  [the first company](../event/the-first-lima-company-1861.yml).

  **It was a railroad town before it was an oil town, and the corpus had the order wrong by
  omission.** In March 1879, at about 7,000 people, the city stood at the crossing of the Pittsburg,
  Fort Wayne & Chicago, the Dayton & Michigan and the Lake Erie & Louisville; all three kept repair
  shops here, a street railroad ran from the Union Depot, and the Dayton & Michigan shops covered
  some eight acres and employed 200 to 300 men. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), quoting the *Allen
  County Republican* of 14 March 1879; see [the network](../measure/allen-county-railroads-1883-1921.yml).
  Six years before the strike, the largest establishment in the city was a locomotive shop.
  [inference]

  Two railroads reached it because two railroads chose to cross there, in 1854 and 1858, and the
  canal towns fifteen miles west did not get a crossing. [verified] —
  [the first railroad](../event/the-first-railroad-reaches-allen-county.yml). By 1906 the city was
  "one of the five great trunk lines, which center in this city", with two shops employing more than
  five hundred men each and ten fast passenger trains a day on one road alone. [verified] — same
  source. No passenger train has called at any crossing in this county in the current inventory.
  [verified] — [the network now](../measure/allen-county-railroads-2026.yml).

  **It holds 46.1 per cent of the county's jobs and 37.2 per cent of its employed residents.**
  22,460 jobs sit in the sixteen tracts whose internal point falls inside the city, against 15,950
  residents with work. [inference] —
  [who comes and goes](../measure/allen-county-commuting-2022.yml). The city is a net importer of
  workers inside a county that is a net importer of workers, and it holds a third of the county's
  people.

  **A person born in one of its census tracts could expect about five fewer years than one born
  elsewhere in this county.** The thirteen tracts whose centres fall inside the city have a median
  life expectancy of 72.7 years against 79.0 for the fifteen outside, and the highest Lima tract,
  78.2, sits below all but one of them. [inference] —
  [life expectancy by tract](../measure/allen-county-life-expectancy-2010-2015.yml), from NCHS
  estimates for 2010–2015 built on death certificates.

  **What CDC estimates separates the city from its county in material conditions rather than in
  disease.** Of forty measures, thirteen differ by more than their confidence limits allow, and the
  largest are food stamps, food insecurity, tooth loss, housing insecurity and the threat of a
  utility shut-off. No chronic-disease gap clears at all. [verified] —
  [the health estimates](../measure/allen-county-health-2023.yml). Those figures are a model's and
  not a count of anyone here, and the model's own inputs include the income and poverty data this
  node cites above — so they may not be used to explain one by the other. See
  [a modelled estimate is not an observation](../../decisions/a-modelled-estimate-is-not-an-observation.yml).

  **It tripled after the oil, peaked at the 1970 census and has lost a third of itself since.** 757
  in 1850, 7,567 in 1880, 21,723 in 1900, 41,326 in 1920, 42,287 in 1930, 44,711 in 1940, 50,246 in
  1950, 51,037 in 1960, **53,734 in 1970**, 47,827 in 1980, 45,549 in 1990, 40,307 in 2000, 38,771 in
  2010, 35,579 in 2020. [verified] — [1850–1960](../measure/lima-population-1850-1960.yml) and
  [1970–1990](../measure/lima-population-1970-1990.yml). **Every count rises to 1970 and every count
  falls after it**, so the peak is a census year and not an artefact of where the corpus's data
  began. The 1920 figure was 41,306 here until the Census contradicted the county history that
  supplied it.

  The corpus wrote here two phases ago that the city "was already at its 2000 size before the First
  World War ended", reasoning from the 1920 and 2000 figures alone. Two points that happen to be
  level are not a plateau: between them the city grew by thirty per cent and then lost it. The
  intervening counts are now on the record and the slowest decade before the peak is the 1950s,
  which gained 791.

  **It lies in four townships, and the Census has said so since 1950.** American, Bath, Perry and
  Shawnee held 19,270, 17,469, 10,895 and 2,612 of the city's people at that census. [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6. Those are the same four
  [Ottawa Township](../question/what-became-of-german-and-ottawa-townships.yml) was carved out of in
  1857, and the 1940 census had returned the whole city as coextensive with Ottawa, which the 1950
  volume calls nonexistent. [verified] — same source.

  **Its boundary has moved in both directions, and the record starts in 1902.** "Parts of German
  and Bath townships annexed to Lima city in 1902 and 1905, respectively; parts of Lima city
  annexed to Bath and German townships in 1903 and 1906, respectively." [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md),
  Allen County footnote. Then "part of Shawnee township annexed to Lima city in 1944" and
  annexations from American, Bath and Shawnee between 1980 and 1990. [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md)
  and [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md).

  Six boundary events across ninety years, four into the city and **two out of it**, and the two
  outward ones each follow an inward one by a year. [inference] The caveat this corpus carries about
  the city's counts not being comparable across time now has dates attached, and it is older and
  less one-directional than the caveat assumed.

  **Its wards are on record for 1910**: 5,150, 8,010, 7,830 and 9,518, summing to the city's 30,508.
  [verified] — same 1910 source. Four wards, and the corpus holds no other ward-level figure for
  any place in the county except Delphos in the same year and Lima's four in 1881.

  Lima is the county's industrial centre: the 1885 oil strike, the locomotive works, and the tank
  plant are all here or on its edge. [inference] This node used to add "and the reason its history
  is not an agricultural one", which the county's own figures do not bear — in 1910, with Lima
  already holding more than half the county's people, 92.5 per cent of the county's land was still
  in farms. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the county's farms](../measure/allen-county-farms-1900-1910.yml). Lima is why the county's
  history is not *only* agricultural. [inference] Its population has been falling since the 1970s and continues to fall —
  see [Lima population, 2020](../measure/lima-population-2020.yml) and
  [Lima population, 2024](../measure/lima-population-2024.yml).

  **Its schools are not one system.** The city's 35,579 people at the 2020 census divide among
  five school districts: 27,821 in [Lima City](../jurisdiction/lima-city-school-district.yml),
  4,849 in [Elida Local](../jurisdiction/elida-local-school-district.yml), 1,573 in
  [Bath Local](../jurisdiction/bath-local-school-district.yml), 1,033 in
  [Shawnee Local](../jurisdiction/shawnee-local-school-district.yml) and 303 in
  [Perry Local](../jurisdiction/perry-local-school-district.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography, block by block. A fifth of the
  city is outside the district that carries its name — the shape annexation leaves when the school
  boundaries do not move with the corporate one.

  **The most widely reported hour in its history was in the county jail.** On the night of
  12 October 1933 three armed men walked in, shot Sheriff Jess L. Sarber, freed the prisoner John
  Dillinger and drove west out of town; the three were tried here the following spring under a
  National Guard detachment with machine guns at the approaches to the jail. [verified] —
  [Chronicling America](../../catalog/chronicling-america.md); see
  [the raid on the Allen County jail](../event/allen-county-jail-raid-1933.yml). It is the only
  thing this corpus records happening in Lima between the oil boom and the 1970s. [verified] — the
  corpus's own event nodes.

  **Founded in 1831**, and the county seat. [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and
  villages page — which puts it on Interstate 75 about 72 miles north of Dayton and 78 south of
  Toledo, the county's own way of saying where it is.

  **It is named for Lima in Peru; who proposed it is contested.** The 1885 history says flatly that
  "the name Lima was proposed by Patrick G. Goode, to whom it was suggested by the Peruvians".
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The corpus recorded that as settled and it is not. In 1921 a second historian
  tells it differently: a group at James Daniels Sr.'s cabin dropped fifteen suggested names into a
  hat and Lima was the last drawn out; and while "the reference volumes all attribute the name to
  Patrick W. Goode", Ezekiel Owen recalled a James Daniels Jr. who "always maintained that the slip
  bearing the name Lima had been cast into the hat by his father", a claim to which "general
  credence never attached". [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), which also cannot keep Goode's middle initial steady
  within a page. [open] The corpus asserts the Peruvian derivation, which both sources support in
  substance, and no longer asserts the proposer.
  The town was platted the same year by order of the county's first board of commissioners, who
  controlled it outright: [Christopher Wood](../person/christopher-wood.yml) was appointed director
  for the sale of lots and James W. Riley, working under Justin Hamilton of Mercer County, was the
  surveyor. [verified] — same source. A county seat located by a legislative commission, platted by
  the commissioners and sold off in lots is a town made by a government before it had one of its
  own — see [the City of Lima](../jurisdiction/city-of-lima.yml), which did not exist until 1842.

  **It is also where the county's minority vote lives, and where it is shrinking fastest.** Eleven
  of Allen County's 88 precincts went to Biden in 2020 and ten of them are here; the county as a
  whole went 69 to 29 the other way. [verified] — [OpenElections](../../catalog/openelections-ohio.md). The city holds a third of
  the county's people, most of its density, five school districts and 23 of its 88 precincts, and
  on every one of those measures it is the part that does not resemble the rest.

  Between 2016 and 2020 its 23 precincts moved toward the Republicans by a mean of **3.2 points**
  while the county's other 65 moved 1.6 — the city drifting right about twice as fast as the ground
  around it, from a much more Democratic starting point. [verified] — same source, computed across
  three general elections. So the county's political division is narrowing from the city's side,
  which is the opposite of the direction its
  [population decline](../period/depopulation.yml) runs.

  Pronounced LY-muh, not like the Peruvian capital. [inference]

  **Its streetcars changed hands four times in forty-three years and only one transfer is dated.**
  Lima Street Railroad Company in 1878, the Lima Electric Railway & Light Company by 1902, the Lima
  & Toledo Traction Company from 1 July 1905, and by 1921 fifteen miles operated by
  [the Ohio Electric](../organization/ohio-electric-railway.yml). [verified] — see
  [the street railway under four names](../measure/lima-street-railway-1878-1921.yml). The mules went
  on [4 July 1886](../event/the-first-electric-car-in-lima-1886.yml).

  **In 1905, 77 passenger trains a day landed here, 49 steam and 28 electric**, and 182 men worked
  the yards and freight offices. [verified] —
  [the traffic of 1905](../measure/lima-railroad-traffic-1905.yml).


  **Its violent crime rate has been between two and three times Ohio's in every year from 2015 to
  2024**, and its property crime rate fell forty per cent across the same decade. In 2024 the rate
  was 769.9 per hundred thousand against 311.9 for Ohio and 363.6 for the United States. [verified] —
  [the crime record](../measure/lima-crime-2015-2024.yml).

  **The city is the county's weather record.** Seventy-seven of the 390 severe weather reports here
  name Lima as their location, against twenty-one for Delphos, the next place. [verified] —
  [the storm record](../measure/allen-county-storm-events-1950-2026.yml). **That is where the
  reporters are, not where the storms are.** [inference] On 22 June 2006 a line of wind blew over
  every power pole and traffic signal on a stretch of Shawnee Road and left about two-thirds of the
  county without power. [verified] —
  [the windstorm](../event/the-windstorm-of-22-june-2006.yml).

