class: place
label: Lima
description: |
  The county seat and largest settlement, 13.617 square miles of land with an internal point
  at 40.740679, -84.112091. [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).
  It is the only place in Allen County that the Census Bureau treats as its own county
  subdivision rather than as a village inside a township, which is the tabular trace of its
  having been separated from the townships around it. [verified] — same source, county
  subdivision file.

  **It tripled after the oil, peaked around 1970 and has lost a third of itself since.** 7,567 in
  1880, 21,723 in 1900, 41,306 in 1920, **53,734 in 1970**, 47,827 in 1980, 45,549 in 1990, 40,307 in
  2000, 35,579 in 2020. [verified] — [1880–1920](../measure/lima-population-1880-1920.yml) and
  [1970–1990](../measure/lima-population-1970-1990.yml). The corpus wrote here one phase ago that the
  city "was already at its 2000 size before the First World War ended", reasoning from the 1920 and
  2000 figures alone. Two points that happen to be level are not a plateau: between them the city
  grew by a third and then lost it.

  Lima is the county's industrial centre and the reason its history is not an agricultural
  one: the 1885 oil strike, the locomotive works, and the tank plant are all here or on its
  edge. [inference] Its population has been falling since the 1970s and continues to fall —
  see [Lima population, 2020](../measure/lima-population-2020.yml) and
  [Lima population, 2024](../measure/lima-population-2024.yml).

  **Its schools are not one system.** The city's 35,579 people at the 2020 census divide among
  five school districts: 27,821 in [Lima City](../jurisdiction/lima-city-school-district.yml),
  4,849 in [Elida Local](../jurisdiction/elida-local-school-district.yml), 1,573 in
  [Bath Local](../jurisdiction/bath-local-school-district.yml), 1,033 in
  [Shawnee Local](../jurisdiction/shawnee-local-school-district.yml) and 303 in
  [Perry Local](../jurisdiction/perry-local-school-district.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography, block by block. A fifth of the
  city is outside the district that carries its name — the shape annexation leaves when the school
  boundaries do not move with the corporate one.

  **Founded in 1831**, and the county seat. [verified] — [Allen County](../../catalog/allen-county-official-site.md), cities and
  villages page — which puts it on Interstate 75 about 72 miles north of Dayton and 78 south of
  Toledo, the county's own way of saying where it is.

  **It is named for Lima in Peru; who proposed it is contested.** The 1885 history says flatly that
  "the name Lima was proposed by Patrick G. Goode, to whom it was suggested by the Peruvians".
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The corpus recorded that as settled and it is not. In 1921 a second historian
  tells it differently: a group at James Daniels Sr.'s cabin dropped fifteen suggested names into a
  hat and Lima was the last drawn out; and while "the reference volumes all attribute the name to
  Patrick W. Goode", Ezekiel Owen recalled a James Daniels Jr. who "always maintained that the slip
  bearing the name Lima had been cast into the hat by his father", a claim to which "general
  credence never attached". [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), which also cannot keep Goode's middle initial steady
  within a page. [open] The corpus asserts the Peruvian derivation, which both sources support in
  substance, and no longer asserts the proposer.
  The town was platted the same year by order of the county's first board of commissioners, who
  controlled it outright: [Christopher Wood](../person/christopher-wood.yml) was appointed director
  for the sale of lots and James W. Riley, working under Justin Hamilton of Mercer County, was the
  surveyor. [verified] — same source. A county seat located by a legislative commission, platted by
  the commissioners and sold off in lots is a town made by a government before it had one of its
  own — see [the City of Lima](../jurisdiction/city-of-lima.yml), which did not exist until 1842.

  **It is also where the county's minority vote lives, and where it is shrinking fastest.** Eleven
  of Allen County's 88 precincts went to Biden in 2020 and ten of them are here; the county as a
  whole went 69 to 29 the other way. [verified] — [OpenElections](../../catalog/openelections-ohio.md). The city holds a third of
  the county's people, most of its density, five school districts and 23 of its 88 precincts, and
  on every one of those measures it is the part that does not resemble the rest.

  Between 2016 and 2020 its 23 precincts moved toward the Republicans by a mean of **3.2 points**
  while the county's other 65 moved 1.6 — the city drifting right about twice as fast as the ground
  around it, from a much more Democratic starting point. [verified] — same source, computed across
  three general elections. So the county's political division is narrowing from the city's side,
  which is the opposite of the direction its
  [population decline](../period/deindustrialization.yml) runs.

  Pronounced LY-muh, not like the Peruvian capital. [inference]
