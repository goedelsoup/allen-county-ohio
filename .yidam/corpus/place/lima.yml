class: place
label: Lima
description: |
  The county seat and largest settlement, 13.617 square miles of land with an internal point
  at 40.740679, -84.112091. [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).
  It is the only place in Allen County that the Census Bureau treats as its own county
  subdivision rather than as a village inside a township, which is the tabular trace of its
  having been separated from the townships around it. [verified] — same source, county
  subdivision file.

  Lima is the county's industrial centre and the reason its history is not an agricultural
  one: the 1885 oil strike, the locomotive works, and the tank plant are all here or on its
  edge. [inference] Its population has been falling since the 1970s and continues to fall —
  see [Lima population, 2020](../measure/lima-population-2020.yml) and
  [Lima population, 2024](../measure/lima-population-2024.yml).

  Pronounced LY-muh, not like the Peruvian capital. [inference]
