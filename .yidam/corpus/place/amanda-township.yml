class: place
label: Amanda Township
description: |
  A township of 33.315 square miles about 9 miles west of the county's centre, internal
  point 40.734865, -84.272548. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 2,070 at the 2020 estimates base and 2,049 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 21 over those four years, as all but two of the county's subdivisions did.

  It contains no incorporated place; all of it is unincorporated. [verified] — same source, which lists no place within this township.

  **No school district is named for it and three divide it**: 1,072 of its people are in
  [Spencerville Local](../jurisdiction/spencerville-local-school-district.yml), 665 in
  [Shawnee Local](../jurisdiction/shawnee-local-school-district.yml) and 324 in
  [Elida Local](../jurisdiction/elida-local-school-district.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. A township with no village and
  no district of its own has no institution that takes its name as a whole, which is worth knowing
  before reading anything into how little is written about it.

  [open] Only geography and population are recorded here. When the township was erected, what
  it is named for, and the board that governs it are all unretrieved — see
  [the civil geography](../../decisions/the-civil-geography.yml) for why the jurisdiction side
  of these twelve townships is deliberately not yet written.
