class: place
label: Amanda Township
description: |
  A township of 33.315 square miles about 9 miles west of the county's centre, internal
  point 40.734865, -84.272548. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 2,070 at the 2020 estimates base and 2,049 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 21 over those four years, as all but two of the county's subdivisions did.

  It contains no incorporated place; all of it is unincorporated. [verified] — same source, which lists no place within this township.

  **No school district is named for it and three divide it**: 1,072 of its people are in
  [Spencerville Local](../jurisdiction/spencerville-local-school-district.yml), 665 in
  [Shawnee Local](../jurisdiction/shawnee-local-school-district.yml) and 324 in
  [Elida Local](../jurisdiction/elida-local-school-district.yml). [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) crossed with
  [TIGERweb](../../catalog/tigerweb-census2020.md) block geography. A township with no village and
  no district of its own has no institution that takes its name as a whole, which is worth knowing
  before reading anything into how little is written about it.

  **Erected in 1830 by the commissioners of Mercer County** — the earliest township organization
  recorded in this county, and it happened two years before Allen County had a board of its own,
  while Allen was attached to Mercer for judicial purposes. Thirteen electors lived in it and
  twelve of them came to the organizing meeting; Samuel Baxter was chosen clerk and Daniel Hoak
  justice of the peace. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **It is named for Fort Amanda**, built here in 1812 by Col. Poague's command and named for the
  colonel's wife. [verified] — same source. In the
  [reorganization of 1848](../event/reorganization-of-1848.yml) it lost sections 7 and 18 to
  [Spencer](spencer-township.yml) and was recomposed from the south half of Marion and its own
  north half. [verified] — same source.

  **Earlier still, it was falling: 1,425 people in 1890, 1,384 in 1900 and 1,263 in 1910.** [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the 1890–1910 divisions](../measure/allen-county-townships-1890-1910.yml).
  So its low point is 975 in 1940 and its high point before the war is 1890, and the doubling below
  is measured from near the bottom of a fifty-year decline. [inference]

  **It held 1,008 people in 1930, 975 in 1940 and 980 in 1950**, and 2,070 at the 2020 estimates
  base. [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6; see [the township series](../measure/allen-county-townships-1930-1950.yml). So it doubled, and all of it
  happened after 1950 — through the 1930s and 1940s the township was flat and slightly falling.
  [inference] It has no incorporated place, so every one of those people was and is counted in
  unincorporated territory.

  [open] The trustees' names at organization, and the fort's own history beyond the naming.
