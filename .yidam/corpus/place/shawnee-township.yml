class: place
label: Shawnee Township
description: |
  A township of 28.97 square miles immediately south and west of Lima, internal point
  40.691353, -84.170464. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  Its name records the Shawnee presence on this ground before the cession, and it is the
  clearest surviving toponymic trace of it in the county's civil geography. [inference]
  It is among the county's most populous townships and functions largely as suburban
  Lima. [inference]
