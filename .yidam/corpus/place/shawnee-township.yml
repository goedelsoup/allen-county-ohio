class: place
label: Shawnee Township
description: |
  A township of 28.97 square miles immediately south and west of Lima, internal point
  40.691353, -84.170464. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  **Its name was chosen for that reason and the record says so.** The commissioners, in session
  December 1, 1834, granted the petition of the people of Shawnee to set Township 4, Range 6 off
  from the Hog Creek Reservation "under the name of its original inhabitants"; the first meeting
  was held on December 13 in Ezekiel Hover's log house, and the list of voters ran to twelve names.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The township was cut twice afterwards: its south tier went to the new county
  of Auglaize in 1848, and the north-east quarter of Section 1 to Ottawa Township in May 1857.
  [verified] — same source. The name is the clearest surviving toponymic trace in the county's
  civil geography of the people who were removed from it — and the book that records the naming
  introduces them as "sanguinary savages", which is a fact about the source and not about them.
  See [the Ottawa removal](../event/ottawa-removal.yml).
  With 12,509 people at the 2020 estimates base and 12,490 in 2024 it is the county's second
  most populous civil subdivision after Lima — and it **contains no incorporated place at all**.
  [verified] — [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county
  file, which lists no place row under this township. Twelve and a half thousand people live
  here under township government and no municipal one.

  **It holds the county's heavy industry**, which the corpus attributed to Lima at genesis and
  to [American Township](american-township.yml) alongside it. Both the
  [refinery](../site/lima-refinery.yml) and the
  [tank plant](../site/lima-army-tank-plant.yml) stand on unincorporated ground in this
  township, with Lima postal addresses and no municipality. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and
  [TIGERweb](../../catalog/tigerweb-census2020.md).

  That is a fact about tax base and authority as much as geography: the two largest industrial
  installations in the county are outside every municipality that could levy on them, and the
  township is the government whose ground they sit on. [inference]
  **It held 1,279 people in 1890, 1,493 in 1900 and 1,312 in 1910**, which makes 1890 its lowest
  recorded count and this township **the fastest-growing in the county over the whole period —
  nearly ten times its 1890 size**. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the 1890–1910 divisions](../measure/allen-county-townships-1890-1910.yml).

  **It held 2,070 people in 1930 and 2,336 in 1940**, before Lima crossed into it: the 1950 return
  is 6,408 of which 2,612 is Lima city, leaving 3,796 outside the city. [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6; see [the township series](../measure/allen-county-townships-1930-1950.yml). At 12,509 in 2020 it is **six times its 1930 size
  outside the city — the fastest growth of the county's twelve townships**. [inference]

  **And the annexation into it is dated.** "Part of Shawnee township annexed to Lima city in 1944."
  [verified] — same source, Allen County footnote. That is forty years earlier than the earliest
  annexation this corpus previously held, and it is the mechanism behind the 1950 return above.

