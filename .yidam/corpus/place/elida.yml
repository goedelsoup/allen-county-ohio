class: place
label: Elida
description: |
  A village of 1.102 square miles in [American Township](american-township.yml), about 5 miles west of the
  county's centre, internal point 40.78699, -84.199651. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio places.

  Its population was 1,924 at the 2020 estimates base and 1,904 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It lost 20 people over those four years.

  **All of it is in Allen County.** The same file marks a place that crosses a county line with
  `(pt.)` and marks this one plainly, which is what separates it from
  [Bluffton](bluffton.yml) and [Delphos](delphos.yml). [verified] — same source.

  **Established in 1852**, and the
  [Village of Elida](../jurisdiction/village-of-elida.yml) incorporated in 1878. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page.

  **It has reported more annexation than it is.** Five annexations between May 1990 and May 2021
  totalling 912.9 acres, against a village that occupied 703.6 acres in the 2012 geography and
  745.6 in the 2024 one. [verified] —
  [the Boundary and Annexation Survey](../../catalog/census-bas-boundary-changes-ohio.md) against
  [the gazetteer](../../catalog/census-gazetteer-2020.md), Ohio place files. One of the five,
  ordinance 622-92 of 11 March 1992, claims 640.0 acres — exactly one square mile, which is the
  size of a survey section and not of a parcel. What the excess is, this corpus does not know:
  reported acreage is what a village put on a form, and a form is not a survey. [inference] — see
  [the annexation record](../measure/allen-county-annexations-1990-2024.yml).

  **It was platted in 1852 by Griffith John**, on Sections 7, 8, 17 and 18 of what was then German
  Township — now [American](american-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). Griffith John is the same
  man who petitioned the commissioners in March 1833 to enlarge German Township and who assessed
  its district in 1846: the village was laid out by the township's own long-standing figure, on
  ground he had spent twenty years enlarging. [verified] — same source.

  **It is named for the founder's brother.** "Griffith John was its founder, and it bears the name
  of his brother Elida John who never lived in the community." [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), which also
  confirms 1852 and the 1878 incorporation. That is a single witness read once, and it is the only
  etymology the corpus has for this village; the commonly repeated alternative — that Elida is a
  contraction of two women's names — appears in no source held here.

  [open] Whether any record outside this one account supports the brother.

  **An interurban ran through it, parallel to the steam road.** "It is situated on the Pittsburg,
  Fort Wayne & Chicago Railway and the Fort Wayne, Van Wert & Lima traction line", and in 1905 the
  Pennsylvania handled 484 car-loads of freight at this station, principally grain and live-stock.
  [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). It is the
  only village in the county the sources place on
  [the interurban Lima financed](../organization/fort-wayne-van-wert-and-lima-traction-company.yml)
  by name and by station rather than by compass.

