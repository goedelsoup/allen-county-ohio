class: place
label: Elida
description: |
  A village of 1.102 square miles in [American Township](american-township.yml), about 5 miles west of the
  county's centre, internal point 40.78699, -84.199651. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio places.

  Its population was 1,924 at the 2020 estimates base and 1,904 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It lost 20 people over those four years.

  **All of it is in Allen County.** The same file marks a place that crosses a county line with
  `(pt.)` and marks this one plainly, which is what separates it from
  [Bluffton](bluffton.yml) and [Delphos](delphos.yml). [verified] — same source.

  **Established in 1852**, and the
  [Village of Elida](../jurisdiction/village-of-elida.yml) incorporated in 1878. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page.

  **It was platted in 1852 by Griffith John**, on Sections 7, 8, 17 and 18 of what was then German
  Township — now [American](american-township.yml). [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). Griffith John is the same
  man who petitioned the commissioners in March 1833 to enlarge German Township and who assessed
  its district in 1846: the village was laid out by the township's own long-standing figure, on
  ground he had spent twenty years enlarging. [verified] — same source.

  [open] What the name refers to. Two sources now give 1852 and neither gives an etymology, and
  Elida is not an obvious transfer name.
