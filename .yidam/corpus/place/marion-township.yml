class: place
label: Marion Township
description: |
  A township of 42.371 square miles about 10 miles west of the county's centre, internal
  point 40.81041, -84.292789. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 6,629 at the 2020 estimates base and 6,731 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. It is one of only two subdivisions in the county that grew over those four years, by 102.

  It contains [Delphos](delphos.yml). [verified] — same source, which reports it as a place within this township.

  **Set off from the north end of [Amanda](amanda-township.yml) in December 1833** by the
  commissioners of Allen County, on a petition from the settlers of Township 3 south, Range 5 east.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **Its present shape dates from 1848, not 1833.** In the
  [reorganization of that February](../event/reorganization-of-1848.yml) the original township was
  cut in half — the south half went into Amanda — and six sections from Jennings Township were
  added, giving the forty-two square miles it still has. [verified] — same source. Its first
  trustees after the change were Christian Stukey, Michael Swisher and Thomas J. Fair.

  [open] What the name refers to, and whether the added Jennings sections came from Van Wert or
  Putnam County — the book says both, in different chapters.
