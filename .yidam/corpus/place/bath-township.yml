class: place
label: Bath Township
description: |
  A township of 30.698 square miles about 3 miles east of the county's centre, internal
  point 40.781965, -84.042618. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio county subdivisions.

  Its population was 9,399 at the 2020 estimates base and 9,263 in 2024. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its population fell by 136 over those four years, as all but two of the county's subdivisions did. That makes it the third most populous of the county's thirteen civil subdivisions.

  It contains no incorporated place; all of it is unincorporated. [verified] — same source, which lists no place within this township.

  **It is older than the county's own government and no record of its erection survives.** The 1885
  compiler, working from the commissioners' books, found the name and organization of Bath in use
  before Allen County was organized and "no record of its establishment either in the records of
  Allen or Mercer County"; he concedes that by 1831 it was a regularly organized township with
  Lima at its centre, with Chris. Wood, John Schrouf and James Daniels as justices. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). This is the one township in the county whose erection is not on record anywhere the
  corpus has looked.

  [open] When it was erected, by whose authority, and what the name refers to — all three
  unanswered, and the first is unanswered in the source that answers it for the other eleven.
