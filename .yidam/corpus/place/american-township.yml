class: place
label: American Township
description: |
  A township of 24.017 square miles wrapping the west and north of Lima, internal point
  40.769378, -84.17822. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  It is the most populous township in the county outside Lima itself, and the Census
  Bureau's "balance of American township" figure — the township minus the incorporated
  villages inside it — is the larger part of that. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. Its
  population was 14,571 at the 2020 estimates base and 14,445 in 2024 — **the most populous
  civil subdivision in the county after Lima**, and 12,541 of the 2024 figure is the balance
  outside [Elida](elida.yml), the one village in it. [verified] — same source.

  **Neither the refinery nor the tank plant is here.** This node claimed both stand on or near
  its boundary with Lima, and therefore that this township holds most of the county's heavy
  industry. Both are in [Shawnee Township](shawnee-township.yml), south of Lima; this township
  wraps Lima's west and north. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and
  [TIGERweb](../../catalog/tigerweb-census2020.md), agreeing independently on both points. The
  claim is withdrawn entire rather than narrowed: it named two sites and was wrong about both.

  It does hold a fifth of [census tract 39003010300](../division/census-tract-39003010300.yml)
  — 13,403,443 square metres and 408 people. [verified] — same source, block composition.

  **This township was called German until some time after 1885.** The commissioners' act of
  December 6, 1831 established it "under the name German", over the territory running west from
  Section 3, Town 3, Range 6 to the old Amanda line. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). That book's German
  Township "forms the geographical centre of the county", takes the Ottawa River in from
  [Shawnee](shawnee-township.yml) at Section 33, and passes it by Allentown and
  [Elida](elida.yml) into [Sugar Creek](sugar-creek-township.yml) — which is this township and no
  other, since Elida is in it and in nothing else. [inference] Its erection date therefore belongs
  here, and it makes this the third township the county had.

  In 1848 it lost its north tier of sections to Sugar Creek and kept its name; in 1857 it gave
  1,040 acres to Ottawa Township. [verified] — same source, and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md) independently, giving the same acreage
  thirty-six years later.

  **The name changed on August 16, 1918, and the reason was the war.** The citizens of German
  Township petitioned, and the Allen County commissioners acted — the same instrument that erected
  the county's townships and incorporated its villages. Article II of the petition says only "that
  good cause is shown"; the 1921 historian reads it plainly — "'good cause' means patriotism" —
  and sets it in its moment: "The name German had come into disfavor when the German nation changed
  its attitude toward the rest of the world. School books were undergoing changes at the time, and
  business concerns bearing the name German were eliminating the offensive designation, and the
  people of German Township were caught in the wave of popular sentiment." [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), which
  is a single witness read once for this date.

  **The same page records the dissent**, three years after the fact: "there are residents of the
  township who a little later on would not have voted for the change, because of sacred associations
  in early history. They do not hold the German people responsible for the conduct of some of their
  leaders." [verified] — same source. The corpus had declined to assert the obvious motive; the
  motive is confirmed, and so is that it was contested at the time.
