class: place
label: American Township
description: |
  A township of 24.017 square miles wrapping the west and north of Lima, internal point
  40.769378, -84.17822. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  It is the most populous township in the county outside Lima itself, and the Census
  Bureau's "balance of American township" figure — the township minus the incorporated
  villages inside it — is the larger part of that. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file.
  The village of Elida lies within it. [inference]

  **The tank plant is not here.** This node claimed the refinery and the tank plant both stand
  on or near its boundary with Lima, and so that this township holds most of the county's heavy
  industry. The plant is in [Shawnee Township](shawnee-township.yml), 2.84 miles south of
  Lima's internal point, and this township wraps Lima's west and north. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md), point-in-polygon.

  [open] The refinery is untouched by that correction and unchecked: no coordinate for it
  exists in this corpus, so the claim cannot be tested the same way. GNIS has no `Building`
  class and does not carry it; the county auditor's parcel data is still the only route.

  It does hold a fifth of [census tract 39003010300](../division/census-tract-39003010300.yml)
  — 13,403,443 square metres and 408 people. [verified] — same source, block composition.
