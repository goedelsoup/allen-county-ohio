class: measure
label: Measure
foundational_type:
  ontology: ufo
  type: quality
description: |
  A quantity recorded for a named subject at a stated time, carrying the source it came
  from. It is a class rather than a property because a figure without its date, its unit and
  its provenance is not checkable, and because putting numbers on the node they describe is
  the ordinary way a citation gets lost.
edge_policy: characteristic
# `max_lines` is this class's p90 description length, rounded up to five, measured
# 2026-09-06 over all 282 instances. The estimator is the decision and is recorded in
# `.yidam/decisions/node-length-limits.yml`; recompute it from the corpus, never raise it
# because a node exceeded it.
max_lines: 95
properties:
  - name: parameter
    type: string
    required: true
    description: The measured quantity, by the name its publisher uses — total population, employed persons.
  - name: value
    type: string
    required: true
    description: The figure itself, as published, without rounding or derivation.
  - name: unit
    type: string
    description: What the figure counts.
  - name: as_of
    type: date
    required: true
    description: The date the figure describes — not the date it was published.
  - name: method
    type: text
    description: How it was arrived at, and any break in series that makes it non-comparable.
  - name: table
    type: text
    description: >-
      The measure's rows, where it has many and they are not a time series — a figure per tract,
      per lender, per township. First line names the columns and the first column is the key;
      cells are separated by whitespace and may not contain any. `NA` is the absent cell. It is
      here rather than in the description because a table a reader can read and a machine cannot
      is a table nothing can draw: `crates/publish` carries it into the feed, and the page renders
      it under the prose that argues about it. A measure with one figure does not use it.
edges:
  - relationship: describes
    target: place
    direction: out
    description: The place this figure is about.
  - relationship: describes
    target: jurisdiction
    direction: out
    description: The unit of government this figure is about.
  - relationship: describes
    target: organization
    direction: out
    description: The organization this figure is about.
  - relationship: describes
    target: division
    direction: out
    description: |
      The division this figure is about — the grain elections and public statistics are
      actually published at. Identified as an implied edge at genesis and declared here when
      the first such figure was extracted.
  - relationship: describes
    target: site
    direction: out
    description: |
      The built work this figure is about. Declared for the graves and the boats at Fort Amanda,
      where the figure is a property of the work and of nothing else — the fort stands in another
      county, so `describes` toward a place would have to point outside this corpus's domain or
      point at the wrong ground.
  - relationship: describes
    target: natural-feature
    direction: out
    description: |
      The river, creek or basin this figure is about. Declared when a count of bridge crossings was
      extracted: the figure is a property of the water — how many times the county has had to get
      over it — and pointing it at the county would lose the only thing it says.
  - relationship: describes
    target: office
    direction: out
    description: |
      The office this figure is about. Declared when a line of holders was written as a table
      rather than as tenure nodes, and the table needed somewhere to attach: a succession is a
      figure about an office and about nothing else, and pointing it at the jurisdiction the
      office sits in would have been the wrong claim made to satisfy the schema.
  - relationship: comparable-to
    target: measure
    direction: out
    description: |
      The figure this node publishes may be set beside the figure that one publishes: the same
      quantity, counted under one definition, on ground that did not move between them. Written
      on the later figure and pointing back, which is where `ACTIONS.md` already said a break
      belonged. Carries `because` — a comparability nobody had to argue for is one nobody
      checked, and the reason is what the reader is owed beside the two numbers.
  - relationship: not-comparable-to
    target: measure
    direction: out
    description: |
      The two figures are about the same quantity and may not be set beside each other. This is
      the edge the class was missing: `a-farm-count-is-a-definition` reached the conclusion that
      2,939 farms and 897 farms cannot be subtracted, and had nowhere to put it — "comparability
      is a relation between two measures, and `measure` declares no edge to another `measure`",
      so the judgement lived in prose in four nodes and in no edge anywhere. `because` names what
      broke: a definition, a boundary, a column heading, a change of file.
