class: measure
label: Measure
foundational_type:
  ontology: ufo
  type: quality
description: |
  A quantity recorded for a named subject at a stated time, carrying the source it came
  from. It is a class rather than a property because a figure without its date, its unit and
  its provenance is not checkable, and because putting numbers on the node they describe is
  the ordinary way a citation gets lost.
edge_policy: characteristic
# Raised from 25 after the first gate run. A measure whose subject has a moving boundary
# has to say so beside the figure — that caveat is the difference between a number and a
# comparable number — and three of the six seeded measures could not state it in 25 lines.
# Raised again, from 38, when every edge in the corpus gained a `claim_tag` and — where
# verified — a `source`. That is roughly a line and a half per link, and it is structured
# metadata rather than prose. `node-too-long` counts whole files, so a corpus that makes its
# edges auditable is charged for it against a budget written to stop descriptions sprawling.
# The budget is doing the wrong job here; raising it is the local fix and the finding is
# recorded in `.yidam/decisions/upstream-findings.yml`.
max_lines: 42
properties:
  - name: parameter
    type: string
    required: true
    description: The measured quantity, by the name its publisher uses — total population, employed persons.
  - name: value
    type: string
    required: true
    description: The figure itself, as published, without rounding or derivation.
  - name: unit
    type: string
    description: What the figure counts.
  - name: as_of
    type: date
    required: true
    description: The date the figure describes — not the date it was published.
  - name: method
    type: text
    description: How it was arrived at, and any break in series that makes it non-comparable.
edges:
  - relationship: describes
    target: place
    direction: out
    description: The place this figure is about.
  - relationship: describes
    target: jurisdiction
    direction: out
    description: The unit of government this figure is about.
  - relationship: describes
    target: organization
    direction: out
    description: The organization this figure is about.
  - relationship: describes
    target: division
    direction: out
    description: |
      The division this figure is about — the grain elections and public statistics are
      actually published at. Identified as an implied edge at genesis and declared here when
      the first such figure was extracted.
