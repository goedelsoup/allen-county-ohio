class: organization
label: Lima Memorial Health System
description: |
  An acute care hospital at 1001 Bellefontaine Avenue in [Lima](../place/lima.yml), with an
  emergency department and an overall Medicare rating of 3. [verified] —
  [CMS Hospital General Information](../../catalog/cms-hospital-general-information.md), CCN 360009.

  **It is the only hospital in this county that answers to nobody outside it.** The federal owners
  file lists no organizational owner for it at all — 22 owners, every one of them a person, being
  fifteen corporate directors, four managing employees and three officers. [verified] —
  [CMS provider enrollment](../../catalog/cms-provider-enrollment.md). The other four all have a
  corporate parent, three of them outside Allen County. See
  [Mercy Health–St. Rita's](mercy-health-st-ritas-medical-center.yml),
  [Bluffton Hospital](bluffton-hospital.yml),
  [the Institute for Orthopaedic Surgery](institute-for-orthopaedic-surgery.yml) and
  [Kindred Hospital Lima](kindred-hospital-lima.yml).

  **The body is not the name.** It enrolls as the **Lima Memorial Joint Operating Company**,
  incorporated in Ohio on 12 May 1999, and trades as Lima Memorial Health System. [verified] — same
  source. `founded` here dates the corporation and not the hospital.

  When there was first a hospital on this ground is not established. The nearest thing the corpus
  holds is a **Lima Hospital Society** whose corporate life members in 1906 included
  [Solar Refining](solar-refining-company.yml), the Buckeye Pipe Line Company, the Ohio Oil Company,
  the Lima Natural Gas Company and the Manhattan Oil Company. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). Whether that society
  is an ancestor of this hospital, of [St. Rita's](mercy-health-st-ritas-medical-center.yml), or of
  neither, the corpus does not know. [open]

  **It is the county's second-largest hospital employer and the only large one that has grown.**
  982.94 full-time equivalents in 2011 and 1,261.83 in 2023, up 28 per cent. [verified] —
  [CMS hospital cost reports](../../catalog/cms-hospital-cost-reports.md); see
  [the series](../measure/allen-county-hospital-employment-2011-2023.yml). Over the same thirteen
  years its bed count fell from 195 to 110, and stood as low as 95 in 2019. See
  [the beds](../measure/allen-county-hospital-beds-2011-2023.yml). More staff and half the beds is
  the shape of hospital work moving out of the ward, and this corpus has measured the shape and not
  the cause. [inference]

  **It received $8,777,201 of federal pandemic money — eighty-three per cent of every federal
  disaster dollar recorded for this county since 2005.** Four projects under the COVID-19
  declaration: three of Emergency Protective Measures covering March 2020 to May 2023, the largest
  at $4,645,416, and one of management costs. [verified] —
  [OpenFEMA assistance programs](../../catalog/openfema-assistance-programs.md); see
  [who was paid](../measure/allen-county-disaster-aid-applicants-2005-2025.yml).

  **Having no corporate parent is why that money is in this county's ledger.** The public assistance
  file is keyed to the applicant's registered county. Bon Secours Mercy Health, Inc., which owns
  [St. Rita's](mercy-health-st-ritas-medical-center.yml) in Lima, files as applicant `061-UWDML-00`
  in Cincinnati, and its nine projects and $183,291,707 are counted in Hamilton County. [verified] —
  same source. **The ownership fact recorded above and the accounting fact here are the same fact
  seen in two files**, and the corpus cannot say what any of that $183 million was spent on in Lima.
  [inference] — see
  [a grant file counts offices, not ground](../../decisions/a-grant-file-counts-offices-not-ground.yml).

  It has one further Medicare enrollment, 36T009, flagged as its rehabilitation unit. [verified] —
  the enrollment file.
