class: organization
label: Gramm-Bernstein Motor Truck Company
description: |
  A Lima truck builder, and the county's industrial contribution to the First World War. "Lima
  industry was represented on the war front by the Liberty truck." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The book says the truck built here was the first one used in the war.** Its caption, set under
  a photograph, reads: "The Liberty Truck Built in Lima Was the First Truck Used in the World War."
  [verified] — same source. Two more of the volume's photographs are of Liberty trucks, one of them
  a convoy standing in Lima's Public Square "before leaving for Washington". The corpus records the
  claim as the book's and does not test it: no source held here carries the Liberty truck programme
  from outside Allen County. [open]

  **The firm's own words about it are quoted and they are careful.** "While Gramm-Bernstein feel a
  pardonable pride in the unusual recognition accorded them in this great World war task, still
  they have greater pleasure and satisfaction in the thought that they were equipped with
  facilities and experience which they could devote to so worthy an undertaking." [verified] —
  same source, quoting "one local concern".

  **Its head ran the county's war at home.** B. A. Gramm was named chairman of the Allen County
  Council of Defense when "the community was wrought up over war prospects" — the body that took
  charge of food conservation and coordinated every other war activity in the county. [verified] —
  same source. The man who built the trucks chaired the committee that rationed the flour.

  **It was one of the nine firms that equipped a high school.** On 20 September 1918 it joined the
  Ohio Steel Foundry, the Lima Steel Casting Company,
  [Solar Refining](solar-refining-company.yml), Lima Locomotive Works, East Iron and Machine,
  Chalmers Manufacturing, Buckeye Machine and Steiner Brothers in agreeing to meet half the
  $26,000 cost of a machine shop for Lima's South High School. [verified] — same source.

  **The corpus can locate it only by a cemetery.** The book's one placement of the works is
  incidental: the abandoned "New Cemetery" outside old Lima is "near the Gramm-Bernstein factory".
  [verified] — same source. No address, no acreage, no coordinate, so there is no `site` node for
  the plant and none should be written until there is something to put in it.

  [open] When it was founded, how many trucks it built, and what became of it. The 1906 county
  history does not name it at all, so it postdates that book; the 1921 one has it as a going
  concern. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), searched.
