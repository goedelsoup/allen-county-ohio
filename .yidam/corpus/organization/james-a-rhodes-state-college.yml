class: organization
label: James A. Rhodes State College
description: |
  The county's largest post-secondary institution and the only public one that grants degrees at
  scale: 3,968 students in autumn 2023 and 4,247 over the twelve months. [verified] —
  [IPEDS](../../catalog/ipeds.md), 2023-24 collection.

  **Its students are mostly part-time, and that is the fact to hold on to.** 615 full-time against
  3,353 part-time, for a full-time equivalent of 1,968 — half its headcount, and the only
  institution in the county whose FTE is half its enrolment. [verified] — same source. A college
  of four thousand that is the size of two thousand is a college people attend around a job.
  [inference]

  It is a public institution at the four-year level, offering the bachelor's degree, and in
  2022-23 it awarded none: **261 associate's degrees and 507 certificates**, of which 367 took
  between twelve weeks and a year and 74 took less than twelve weeks. [verified] — same source,
  completions, first majors. Its largest field is health professions at 366 awards, then business
  and management at 174 and engineering technologies at 162.

  **It shares an address with a second institution.** 4240 Campus Drive is also
  [Ohio State's Lima campus](ohio-state-university-at-lima.yml), and the Census Bureau puts both in
  block `390030113012040`, in [Bath Township](../place/bath-township.yml) rather than in the city
  both give as their post town. [verified] — same source and
  [the Census geocoder](../../catalog/census-tiger-landmarks.md).

  **It provides no housing.** Neither institution on that campus reported institutionally
  controlled housing in 2020 or in 2023. [verified] — same source, institutional characteristics.
  That matters for reading the county's group-quarters count; see
  [the group quarters](../measure/allen-county-group-quarters-2020.yml).

  Tuition and fees are $4,560 a year in state and $9,120 out of it — the lowest of the four
  institutions in the county that price by the year, and an eighth of what the county's private
  university charges. [verified] — same source.

  [open] When it was founded and under what name. IPEDS records no alias for it beyond "Rhodes
  State College" and carries no founding date for any institution; the corpus holds nothing else.

  [open] Why an institution licensed to award bachelor's degrees awarded none. The file records the
  offering and the zero, and does not explain either.
