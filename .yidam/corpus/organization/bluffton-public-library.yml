class: organization
label: Bluffton Public Library
description: |
  A single library on South Main Street serving the Bluffton school district, 6,438 people.
  [verified] — [the Public Libraries Survey](../../catalog/imls-public-libraries-survey.md), FY2024.

  **It is the most used library in the county and the smallest service area.** 58,084 visits against
  6,438 people is 9.02 a head, against an Ohio median of 3.54 and a United States median of 2.96,
  and more than five times [Lima](lima-public-library.yml)'s rate. [inference] — computed from the
  same file. Circulation is 98,374, or 15.28 a head.

  **It spent more than it took in.** $503,432 of operating expenditure against $479,475 of income —
  a shortfall of $23,957, the only one of the county's three libraries to report one. [verified] —
  same source.

  **It takes the largest local share in the county and it is still under a third.** $142,230 from
  local government, $294,991 from the state, $42,254 from other sources. [verified] — same source;
  see [the county's libraries](../measure/allen-county-libraries-2024.yml).

  **12,874 square feet, 2,834 hours a year, 6.26 full-time staff.** Both its librarians hold an ALA
  master's degree. It holds 42,063 volumes and spent $53,857 on collections. [verified] — same
  source.

  **Its service area is a school district and school districts cross county lines.** The survey
  files it as `SCHOOL DISTRICT (UNIFIED)` at a ratio of 1, and
  [the Bluffton exempted village district](../jurisdiction/bluffton-exempted-village-school-district.yml)
  reaches into Hancock and Putnam counties, so some of these 6,438 do not live in Allen County.
  [inference] — the district's own extent, not stated in this file.

  [open] Who its seven trustees are and when it was established.
