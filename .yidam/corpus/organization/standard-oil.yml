class: organization
label: Standard Oil
description: |
  The company that industrialized the Lima oil field after the 1885 strike. Standard Oil
  bought into the field, built refining capacity at Lima, and solved the problem that had
  made Lima crude nearly worthless — its high sulphur content, which fouled refining and gave
  the product the name "sour crude" — by acquiring a desulphurization process. [inference]

  It matters to this corpus as the mechanism by which a local discovery became a national
  one. The strike made oil available; Standard made it saleable, and in doing so attached
  this county to a national industrial economy in a way its agriculture never had. [inference]

  **The Standard entity at Lima was the [Solar Refining Company](solar-refining-company.yml)**, and
  the corpus can now date its arrival: in 1886 a Standard committee — Frank Rockefeller, the director
  F. B. Squiers and Solar's attorney Keith — chose 151 acres in
  [Shawnee Township](../place/shawnee-township.yml) for
  [the refinery](../site/lima-refinery.yml) over Findlay and Toledo. [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). Standard
  "at once established headquarters" at Lima and was still operating there in 1921. [verified] —
  same source. It "cornered the Lima oil fields and went into the producing business, building the
  Chicago pipe line and becoming master of the oil supply of the world" — the 1921 historian's
  phrasing, and this corpus records it as his. [verified] — same source.

  Two more of its Lima entities are named in the record: the **Buckeye Pipe Line Company** and the
  **Ohio Oil Company**, which with Solar and the independent Manhattan Oil Company appear together
  as corporate subscribers to the Lima Hospital Society. [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  [open] The terms on which Standard acquired the field, the dates of the desulphurization process
  this node credits it with, and the chain from Solar Refining to the refinery's present operator.
