class: organization
label: Trinity Methodist Episcopal Church
description: |
  Lima's Methodist congregation, and by its own cornerstone the oldest continuously organized church
  in the county seat.

  **The stone gives six dates.** "In 1829 there was a mission; in 1832 there was a church
  organization; in 1835 there was a mission house, and in 1852 there was a church; in 1872 there was
  a second church, and in 1910 the present magnificent edifice." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), quoting the
  cornerstone at Trinity.

  **A mission in 1829 puts Methodist preaching in Lima before the town had a government and three
  years before it had a church organization.** [Lima was organized as a town in 1842](../event/organization-of-the-town-of-lima-1842.yml)
  and [the county in 1831](../event/erection-of-allen-county.yml). [inference] — the dates
  differenced.

  **The stone and the book disagree by two years about the present building.** The stone says 1910;
  the same page says "the present edifice was dedicated on March 17, 1912". A cornerstone is laid
  and a building is dedicated and those are different acts, which may be the whole of it. [verified]
  — same source, both statements; the reconciliation is [inference] and untested.

  **The book's account of its own founding is not settled.** "There are divergent accounts of the
  organization of Trinity, one writer saying that in 1833 John Alexander and James Finney,
  missionaries from St. Marys, visited the community and established the church. It seems that
  Patrick G. Goode had organized a Sunday school two years earlier." [verified] — same source. That
  writer's 1833 is a year after the stone's 1832; see
  [when Lima's first congregation was organized](../question/when-limas-first-congregation-was-organized.yml).

  **Two superlatives the book reports and does not source.** Trinity "is now said to be the seventh
  largest Methodist Church in the world", and its home missionary society of 800 members is "said to
  be the largest similar organization in the world". Its membership is given as 2,000. [verified] —
  same source, with the hedges as printed. This corpus records that the book said it and adopts
  neither claim.

  [open] Whether the congregation still exists under this name, and what became of the 1912
  building. The corpus holds nothing about any Lima congregation after 1921.
