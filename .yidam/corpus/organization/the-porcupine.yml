class: organization
label: The Porcupine
description: |
  The first newspaper printed in Allen County, a Lima weekly that began and ended in 1843.
  [verified] — [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md), which holds
  no Allen County title with an earlier issue.

  **Volume 1, number 1 is dated 4 March 1843, and it ceased the same year.** The imprint is "Lima,
  Allen County, Ohio : M.M. Gillett & A. Hoffman, 1843-". Gutgesell's guide calls it "Democratic".
  [verified] — same source, quoting the record's notes.

  **Lima had a newspaper eleven months after it had a town government.** The town was organized on
  [29 March 1842](../event/organization-of-the-town-of-lima-1842.yml); the county had been organized
  eleven years and erected twenty-three. [inference] — the two dates differenced.

  **What is left of it is eleven issues on one reel.** The Ohio History Connection reports
  4 March, 18 March, 1 April, 22 and 29 April, 27 May, 10 June, 8 and 22 July, 19 August,
  9 September and 30 September to 14 October 1843, all on microfilm roll 39808, and no other
  institution reports a copy. [verified] — same source, the holdings record, reported March 2024.

  **The name is not explained anywhere this corpus holds.** [open] Who Gillett and Hoffman were,
  what a Democratic sheet in a twelve-year-old county was arguing about, and why it stopped after
  seven months. The three county histories all carry press chapters and none has been read; see
  [the county's newspapers](../measure/allen-county-newspapers-1843-2026.yml).
