class: organization
label: Lima Locomotive Works
description: |
  The locomotive builder that made Lima's name in railroading. It began as a machine shop
  building the geared Shay locomotive under Ephraim Shay's patent — a design for logging and
  industrial railways that could work steep, rough, temporary track that a conventional rod
  locomotive could not. [inference]

  It later became one of the three major American builders of mainline steam, and is
  associated with the "Super Power" concept — a design direction emphasising boiler capacity
  and free steaming that the company introduced in the mid-1920s. [inference]

  **Two years of its books are now sourced, and they are the two years the war turned.** The
  company booked orders for 51 locomotives in 1940 against 14 in 1939, closed 1940 with a backlog of
  32 engines and 19 delivered in the year, and turned a net profit of $87,007 after a net loss of
  $134,326 in 1939. Eighteen more locomotives were ordered in the first seven weeks of 1941.
  [verified] — [Chronicling America](../../catalog/chronicling-america.md), *The Bluffton News*,
  20 February 1941, page 3, reporting an Associated Press dispatch from New York, where the
  company's main offices were.

  Its main offices were in New York and its works were in Lima, which is worth stating because this
  corpus's other large employers are described by where they build and this one was not run from
  there. [inference] — same source.

  **It took a tank contract in the same month.** See [the plant](../site/lima-locomotive-works-plant.yml)
  for the $290,000 building and the medium tank programme; the company itself is the party that
  contracted. [verified] — same archive, *Evening Star*, 24 August 1941.

  [open] The company's corporate chronology is still not sourced here: its founding date, its
  sequence of names, the date of the Super Power demonstration locomotive, and the merger
  history that ended it are all unverified. Two annual reports read second-hand through a village
  weekly are not a chronology.
