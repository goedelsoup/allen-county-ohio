class: organization
label: Bluffton University
description: |
  A private liberal arts university at [Bluffton](../place/bluffton.yml), with a Mennonite
  affiliation reflecting the Swiss Mennonite settlement of that part of the county.
  [inference]

  **It was founded as Central Mennonite College and its cornerstone was laid on 19 June 1900.** "The
  Mennonites have established in Bluffton a college which is an ornament to the town as well as
  being an institution of unusual advantage to the citizens. It was founded by the Middle District
  Conference of the Mennonites of North America." Its first president was Noah Calvin Hirschy,
  appointed in 1901, who held the chair of Greek and Biblical languages alongside the presidency and
  had been ordained in the Mennonite ministry on 6 May 1894. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). The affiliation this
  node carried as an inference is therefore founding fact, not present association.

  It is in the corpus as the county's principal residential higher-education institution and
  as an organization whose identity is tied to a place other than Lima — a useful corrective
  to a corpus that would otherwise centre entirely on the county seat and its industry.

  **Its residential population is now a measured number.** Census block `390030101001002` holds
  398 people in 2 housing units — a population living almost entirely outside housing, which is
  what a campus looks like in the block file. The county's address file puts Ropp Hall 0.02 miles
  from that block's internal point, with Bren Dell Hall, College Hall and Musselman Library inside
  0.15. [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md) block layer and
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md). The 398 are students in
  residence on census day; they are not the university's enrolment, and the campus is not
  necessarily one block. [inference]

  That block is in [Bluffton](../place/bluffton.yml) village, which settles by assignment rather
  than by inference where the university sits. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md).

  **It is now measured as an institution and not only as a block.** 678 students in autumn 2023 and
  800 over the twelve months, 647 of them full-time; 190 credentials awarded in 2022-23 — 159
  bachelor's degrees, 28 master's and 3 post-baccalaureate certificates, and nothing below a
  bachelor's, which no other institution in the county can say. [verified] —
  [IPEDS](../../catalog/ipeds.md), 2023-24 collection. Its largest fields are business and
  management at 54 awards and education at 35. Tuition and fees are $35,498, the highest in the
  county by a factor of three.

  **It has more beds than students, and it has for years.** 780 beds against 678 students in 2023;
  838 against 1,292 in 2010. [verified] — same source. Enrolment fell 38.1 per cent over that
  period while the beds fell 7 per cent, so a campus built for a larger college is being kept up
  by a smaller one. [inference] — computed here; see
  [the enrolment series](../measure/allen-county-college-enrollment-2010-2023.yml).

  It is one of only two institutions in Allen County that provide housing at all — the other is
  [the University of Northwestern Ohio](university-of-northwestern-ohio.yml), whose 1,684 beds are
  more than twice as many. [verified] — same source. Neither institution on the shared campus east
  of Lima has ever reported any.

  [open] Its founding date and its earlier name are not verified here. IPEDS records no alias for
  it and carries no founding date for any institution.
