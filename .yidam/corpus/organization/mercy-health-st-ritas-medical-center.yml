class: organization
label: Mercy Health–St. Rita's Medical Center
description: |
  An acute care hospital at 730 West Market Street in [Lima](../place/lima.yml), with an emergency
  department and an overall Medicare rating of 4 — the higher of the county's two rated hospitals.
  [verified] —
  [CMS Hospital General Information](../../catalog/cms-hospital-general-information.md), CCN 360066.
  Its enrollment carries five subgroup flags where the others carry one or none: acute care,
  psychiatric, rehabilitation, and psychiatric and rehabilitation units. [verified] —
  [CMS provider enrollment](../../catalog/cms-provider-enrollment.md).

  **It is the county's largest hospital by every measure this corpus holds, and it is owned in
  Cincinnati.** Bon Secours Mercy Health Inc holds 100 per cent of it, recorded from 1 January 2020,
  and the same body appears as the indirect 51 per cent owner of
  [the Institute for Orthopaedic Surgery](institute-for-orthopaedic-surgery.yml). [verified] —
  [CMS provider enrollment](../../catalog/cms-provider-enrollment.md). Two of Allen County's five
  hospitals therefore answer to one non-profit corporation in another county.

  **Its legal name is not its trading name, and the change of legal name is visible in the
  accounts.** It enrolls as Mercy Health-St Ritas Medical Center LLC, incorporated in Ohio on
  5 May 1970. [verified] — same source. It filed cost reports as "St. Ritas Medical Center" through
  FY2013 and as "St. Ritas Medical Center LLC" from FY2014, and across that boundary its reported
  full-time equivalents fell from 2,303 to 1,678 and its salaries from $145.5 million to
  $94.6 million. [verified] —
  [CMS hospital cost reports](../../catalog/cms-hospital-cost-reports.md).

  Whether a quarter of this hospital's workforce left the county or moved to another employer inside
  the same system, the corpus cannot say. A renaming that coincides with the drop is as good an
  explanation as a redundancy, and the file that records both records neither reason. [open]

  **Its employment fell by more than the county's whole hospital decline.** 2,406 full-time
  equivalents in 2011 against 1,386.92 in 2023 — a fall of 1,019, where the four calendar-year
  filers together fell by 685. [verified] — same source; see
  [the series](../measure/allen-county-hospital-employment-2011-2023.yml). Its beds did not follow:
  322 in 2011 and 329 in 2023, the steadiest bed count of the five. See
  [the beds](../measure/allen-county-hospital-beds-2011-2023.yml).

  **A second hospital operates inside it.** [Kindred Hospital Lima](kindred-hospital-lima.yml)
  enrolls at this same street address. [verified] — the enrollment file. It is a separate body with
  a separate CCN and an owner in Kentucky, and this node makes no claim about the arrangement
  between them.
