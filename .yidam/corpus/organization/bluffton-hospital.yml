class: organization
label: Bluffton Hospital
description: |
  A twenty-five-bed critical access hospital at 139 Garau Street in
  [Bluffton](../place/bluffton.yml), with an emergency department. [verified] —
  [CMS Hospital General Information](../../catalog/cms-hospital-general-information.md), CCN 361322.
  It is the only one of the county's five hospitals outside Lima and its edge, and the only one in a
  village.

  Its municipality was checked and not assumed: the county's address file reads `MUNI` BLUFFTON and
  `USPS_CITY` BLUFFTON, and TIGERweb puts the point in Bluffton village within
  [Richland Township](../place/richland-township.yml). [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and
  [TIGERweb](../../catalog/tigerweb-census2020.md).

  **It is owned in the next county.** Blanchard Valley Health System of Findlay, in Hancock County,
  holds 100 per cent of it, with association dates of 27 January 1983 and 1 July 1995. [verified] —
  [CMS provider enrollment](../../catalog/cms-provider-enrollment.md).

  Which of those two dates ownership began on is not settled here. The file gives both against the
  same owner and reconciles neither. [open]

  **The body is not the name.** It enrolls as **Blanchard Valley Regional Health Center**,
  incorporated in Ohio on 6 July 1982 — a name that belongs to a river valley in Hancock County and
  says nothing about Bluffton. [verified] — same source. Its 101 individual owners are the largest
  such list of the county's five hospitals, and are not recorded here.

  **It is the smallest employer of the four calendar-year filers and it has shrunk.** 108.25
  full-time equivalents in 2011 and 89.19 in 2023, with a spike to 183.25 in 2016 and 146 in 2017
  that the corpus cannot explain. [verified] —
  [CMS hospital cost reports](../../catalog/cms-hospital-cost-reports.md); see
  [the series](../measure/allen-county-hospital-employment-2011-2023.yml). Twenty-five beds in every
  one of the thirteen years, unmoved. See
  [the beds](../measure/allen-county-hospital-beds-2011-2023.yml).

  **It is the only Allen County hospital to report a loss in 2020.** Its net patient revenue fell
  from $22.9 million in 2019 to $8.8 million in 2020 and its net income was **negative $5,799,086**,
  against positive figures at all four of the others. [verified] — same source. Both recovered the
  following year.

  This corpus does not establish that the pandemic caused that year. A critical access hospital is
  reimbursed on a cost basis rather than per case, so a one-year collapse in reported net patient
  revenue can be a settlement or a reclassification as readily as a collapse in care delivered, and
  nothing here separates them. [open]
