class: organization
label: Apollo Career Center
description: |
  The county's public career and technical centre, on Shawnee Road in
  [Shawnee Township](../place/shawnee-township.yml), and the institution whose size depends most on
  how you ask: **527 students in autumn 2023 and 1,439 over the twelve months.** [verified] —
  [IPEDS](../../catalog/ipeds.md), 2023-24 collection.

  It is a public institution below the two-year level and grants no degrees. Everything it awards
  is a certificate: **672 of them in 2022-23**, of which 533 took less than twelve weeks and 85
  took between twelve weeks and a year. [verified] — same source, completions, first majors. Its
  largest field is health professions at 351 awards, then homeland security and protective services
  at 109 and transportation at 83.

  That makes it the county's second largest awarder of credentials after
  [the University of Northwestern Ohio](university-of-northwestern-ohio.yml), on a fifth of that
  university's enrolment. [inference] — computed here. Short credentials are what it produces, and
  they are produced fast.

  **It is also the fastest-shrinking large institution in the county's series**, and it shrank
  early: 2,648 students in 2010, 1,275 in 2013, 1,036 in 2019. [verified] —
  [the enrolment series](../measure/allen-county-college-enrollment-2010-2023.yml). It is the only
  one of the six that has grown since 2020, from 1,147 to 1,439. [inference] — computed here.

  IPEDS records it under three names — Apollo Career Center, Apollo JVS and Apollo Joint Vocational
  School — which is what a joint vocational school district looks like in a federal file that has
  no class for one. [verified] — same source. Its adult-education arm is the part IPEDS surveys;
  its secondary programmes are not in this collection at all. [inference] See
  [the county's school districts](../measure/allen-county-school-finance-2023.yml).

  [open] Which districts it serves and how it is governed. A joint vocational school district is a
  separate taxing subdivision with its own board drawn from its member districts, and this corpus
  holds neither the membership nor the board.
