class: organization
label: First National Bank of Lima
description: |
  The oldest financial institution in Lima by its own history's account, and the place where two of
  the men this corpus names longest were officers of the same company at the same time.

  **It became the First National Bank in 1872, out of the Citizens Bank of Lima.** "The Citizens
  Bank of Lima was opened for business in the corner room of the Lima House with Shelby Taylor as
  cashier. In 1872 it was changed to the First National Bank, which is to-day the oldest financial
  institution in the city." [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). The 1885 history
  gives the same year and no predecessor: "First National Bank was founded in 1872." [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans.

  **Its board in 1885 was Brice, Baxter and four others.** "Directors, C. S. Brice, J. W. King, S.
  A. Baxter, L. Reichelderfer, J. M. Coe and W. L. Porter. President, S. A. Baxter; Vice-President,
  C. S. Brice; Cashier, C. M. Hughes, Jr." [verified] — the 1885 history, both scans. That is
  [Dr. Samuel A. Baxter](../person/dr-samuel-a-baxter.yml), the surgeon of the 18th Ohio and later
  mayor, and [Calvin S. Brice](../person/calvin-s-brice.yml), later a United States senator, in the
  same room. The 1906 history calls Brice "the leading spirit in its organization", says he
  "remained an officer and director until his death", and puts the capital stock at $100,000.
  [verified] — the 1906 history.

  **The presidency changed hands at least three times in the corpus's own sources.** R. Mehaffey
  "was elected president of the First National Bank, of Lima" in January 1875 and left three years
  later; S. A. Baxter is president in the 1885 list and "was for many years president"; by 1906 the
  book is describing him as the founder of a different bank. [verified] — the 1885 and 1906
  histories. The corpus does not order these into a succession, because two of the three are
  undated at one end. [inference]

  **A different First National Bank in the same county is a different bank.** Delphos had one,
  founded on 16 February 1863 by L. G. Roebuck, F. J. Lye and nine others with $100,000 of capital,
  and reorganised on 26 February 1883 as the Delphos National Bank. [verified] — the 1885 history,
  both scans. It shares nothing with this one but the commonest bank name in the United States, and
  is recorded here so the two are not joined by it. See
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  [open] When it ceased. Neither the 1906 nor the 1921 history follows it past its own printing, and
  no twentieth-century source in this corpus names it.
