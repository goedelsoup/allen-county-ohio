class: organization
label: Temple Beth Israel
description: |
  Lima's synagogue, and the only Jewish institution any source in this corpus names.

  **It was erected in 1914.** "Temple Beth Israel, the Jewish Synagogue in Lima, was erected in
  1914 — the Jewish year 5674 — and over the door is this inscription: 'Mine House of Prayer for All
  Peoples.'" [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The 1906 history does not mention it or any Jewish congregation.** Its chapter on the churches
  and ministers of Lima runs through Presbyterian, Methodist, Baptist, Catholic, Lutheran, Reformed,
  Christian, Episcopal, United Brethren and Congregational societies and closes with a
  "miscellaneous" list of five, and no Jewish body is among them. [verified] — the 1906 chapter read
  in full. Whether that means there was no congregation in 1906 or only that the book left one out
  is not settled by its absence. [open]

  **Nothing in the 2020 religion census answers whether it survives.** The county's 49 reporting
  bodies include no Jewish group of any branch. [verified] —
  [the congregations of 2020](../measure/allen-county-congregations-2020.yml). That is a fact about
  which bodies filed a return, not about whether a congregation exists; the same file carries no
  congregation for the Baha'i Faith and 23 adherents. [inference] — see
  [an index of the held is not an inventory of the made](../../decisions/an-index-of-the-held-is-not-an-inventory-of-the-made.yml).

  [open] Its address, its founding congregation, and whether it is still in use. The 1921 book gives
  a year, a Hebrew year, and a lintel.
