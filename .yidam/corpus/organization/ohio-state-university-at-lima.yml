class: organization
label: Ohio State University-Lima Campus
description: |
  A regional campus of the Ohio State University, 740 students in autumn 2023 and 983 over the
  twelve months, sharing a site with
  [Rhodes State College](james-a-rhodes-state-college.yml) at 4240 Campus Drive. [verified] —
  [IPEDS](../../catalog/ipeds.md), 2023-24 collection.

  **It is the only institution in the county that belongs to a system**, and the system is the
  Ohio State University's main campus at Columbus. [verified] — same source, which records the
  parent by name and by identifier for this institution and for no other in Allen County except
  the Ohio State Beauty Academy, whose parent is
  [the University of Northwestern Ohio](university-of-northwestern-ohio.yml).

  In 2022-23 it awarded **90 bachelor's degrees and 50 associate's** and no certificates at all.
  With [Bluffton](bluffton-university.yml), whose 190 awards are all baccalaureate or above, it is
  one of only two institutions in the county whose output is mostly degrees rather than short
  credentials. [verified] — same source, completions, first majors. Its largest field is liberal arts and general studies at
  50 awards, then education at 30.

  **It has lost nearly half its students since 2010** — 1,887 to 983 on the twelve-month count, a
  fall of 47.9 per cent, the second steepest of the county's six. [verified] —
  [the enrolment series](../measure/allen-county-college-enrollment-2010-2023.yml).

  Tuition and fees are $8,937 in state and $34,443 out of it, a ratio of 3.9 to 1 where Rhodes
  State's is 2 to 1. [verified] — same source. 255 of its 263 first-time
  students in autumn 2023 were Ohio residents, so almost nobody pays the second figure.
  [inference] — computed here.

  It provides no housing, and its campus is in [Bath Township](../place/bath-township.yml) outside
  the city it is named for. [verified] — same source and
  [the Census geocoder](../../catalog/census-tiger-landmarks.md).

  [open] When the campus opened. Ohio's regional campuses were largely founded in the 1950s and
  1960s and IPEDS carries no founding date; nothing held here dates this one.
