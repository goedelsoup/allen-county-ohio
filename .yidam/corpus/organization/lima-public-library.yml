class: organization
label: Lima Public Library
description: |
  The county's library: one main building on West Market Street, five branches, and a legal service
  area of 90,173 people — eighty-eight per cent of Allen County. [verified] —
  [the Public Libraries Survey](../../catalog/imls-public-libraries-survey.md), FY2024.

  **It is named for a city, legally based in a school district, and serves a county.** Its legal
  basis is `SD`, a school district free public library under
  [ORC 3375.15](https://codes.ohio.gov/ohio-revised-code/section-3375.15) — seven trustees appointed
  by a board of education, none of whom may have sat on that board within the previous year — and
  the survey files its service area as `COUNTY` at a ratio of 0.882. [verified] — same source and
  the statute; see
  [the administrative key is not the thing](../../decisions/the-administrative-key-is-not-the-thing.yml).

  **It received no local government money in 2024.** $3,865,935 from the state, $1,603,932 from
  other sources, $0 from local government and $0 from federal, against operating expenditure of
  $3,051,076 and capital expenditure of $387,354 with no capital revenue reported. [verified] — same
  source.

  **Six buildings and one of them is a hundred square feet.** The main library at 650 West Market
  Street is 60,650 square feet and open 2,988 hours a year; Spencerville is 5,625, Elida 3,990,
  Cairo 1,281 and Lafayette 600, each open 1,872 hours except Lafayette's 1,092; the Ohio State Lima
  campus outlet is 100 square feet and open 2,964. [verified] — same source, the outlet file.

  **A quarter of the people it serves are registered with it.** 24,819 borrowers against 90,173, and
  146,536 visits — 1.63 a head, against an Ohio median of 3.54. Circulation is 455,405, of which
  137,462 is electronic. It holds 149,348 volumes and spent $444,669 on collections, fourteen and a
  half per cent of what it spent to operate. [verified] — same source; the per-head comparison is
  [inference], computed against the file's per-system medians.

  **It is one of the two institutions that hold this county's newspapers.** The Library of Congress
  union list records it as reporting runs of 19 Allen County newspaper titles, second only to the
  Ohio History Connection's 43. [verified] —
  [the county's newspapers](../measure/allen-county-newspapers-1843-2026.yml).

  [open] Who its seven trustees are, when it was established, and what the $1,603,932 of "other"
  income is — nearly a third of its revenue, in a survey column with no breakdown.
