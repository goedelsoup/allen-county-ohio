class: organization
label: The Western Ohio Railway Company
description: |
  The first interurban railway built through Allen County, and the one that was still its own
  company sixteen years later.

  **It was completed in the spring of 1901 and the county's history calls it the first of its
  kind in this corner of the state.** "The Western Ohio Railway, the pioneer traction line of
  Northwestern Ohio, was completed four years ago, in the spring of 1901." [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **That sentence also dates its own chapter.** A book printed in 1906 that says "four years ago,
  in the spring of 1901" was written in 1905, and the rest of the transportation chapter reads the
  same way: it forecasts what three roads "will in 1906" do. [inference] — same source. The corpus
  treats every figure in that chapter as a figure for 1905.

  **What it ran.** Hourly passenger service between its terminals north and south, a limited every
  two hours from Lima to Dayton, Muncie and Indianapolis, and heavy express and freight cars at
  frequent intervals; by a combination arrangement it handled passengers between Dayton and Toledo
  and St. Louis by way of Lima and [Delphos](../place/delphos.yml) and the Clover Leaf. In 1905 it
  gave Lima twenty trains daily with four through cars to Dayton. [verified] — same source.

  **By 1921 it reached Findlay, and it bought its electricity.** "The Western Ohio Electric Railway
  connecting Findlay and Piqua with Lima, secures its current from St. Mary's." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **A federal census says the same thing in one letter.** The 1917 directory of operating electric
  railway companies lists `Western Ohio Ry. Co.` as **B-X** — railway operating income between
  \$250,000 and \$1,000,000, and **no light and power department**. A company that generated and
  sold current was classed Y. [verified] —
  [Census of Electrical Industries, 1917](../../catalog/census-electrical-industries-1917.md). Two
  sources with nothing in common, one local and admiring and one federal and indifferent, agree that
  this road bought its power rather than made it. [inference]

  **It is the only interurban in the county that the 1917 directory lists on its own line**, without
  an owner above it and without lessors beneath it — unlike
  [the Fort Wayne, Van Wert & Lima](fort-wayne-van-wert-and-lima-traction-company.yml), which by then
  was leased to [the Ohio Electric](ohio-electric-railway.yml). [verified] — same source.

  [open] When it stopped, and where its office was. The corpus's newest narrative source is the 1921
  history and its newest federal one is the 1917 census; neither can say what became of this company,
  and no source here reaches the abandonment. Nor does either name its headquarters: the `seated-in`
  edge below reads Lima as the place it worked from, which is what the route shows and not what any
  source states.
properties:
  org_type: company
  founded: "1901"
  industry: interurban electric railway
  also_known_as: |
    Printed as "the Western Ohio Railway" in 1906, "the Western Ohio Electric Railway" in 1921, and
    "Western Ohio Ry. Co." in the 1917 federal directory. The corpus treats the three as one company
    on the strength of the route — Lima to the south, and later Findlay — and not on any statement
    that they are. [inference]
