class: organization
label: The Lima Argus
description: |
  The county's second newspaper, a Democratic weekly that ran from 1843 to 1854 and was started with
  the price of its founder's waistcoat.

  **It began in 1843 and ceased in November 1854.** Weekly, Democratic on Gutgesell's attribution,
  and the earliest issue any library reports is volume 2, number 61, of 4 May 1844. The Ohio History
  Connection holds three issues — 4 May 1844, 19 September 1845 and 24 October 1845 — on one reel,
  and no other institution reports a copy. [verified] —
  [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md).

  **Its founder sold his only saleable garment to buy the paper for the first issue.** "The story of
  Mathias H. Nichols, who divested himself of his vest — his only garment with market value — in
  order that he might buy white stock paper for the first issue of his newspaper — The Argus."
  [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). See
  [Mathias H. Nichols](../person/mathias-h-nichols.yml), who went on to be prosecuting attorney and
  a three-term congressman.

  **It shared 1843 with [The Porcupine](the-porcupine.yml), and outlived it by eleven years.** Both
  were Democratic weeklies begun in Lima that year, the Porcupine on 4 March. Which came first is
  not established: the directory dates the Argus to 1843 without a month. [open] — the directory,
  both records.

  **Three issues survive of eleven years.** [inference] — the holdings record; see
  [the county's newspapers](../measure/allen-county-newspapers-1843-2026.yml), where 43 of the
  county's 99 titles have no library reporting a copy at all and this one is close to that line.
