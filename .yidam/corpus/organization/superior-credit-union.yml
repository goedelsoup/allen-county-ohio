class: organization
label: Superior Credit Union, Inc.
description: |
  The largest home lender in Allen County by a distance. It originated **646 of the 1,932 mortgages
  made in this county in 2023 — a third of them** — where the second-largest lender made 113.
  [verified] — [the HMDA register](../../catalog/hmda-loan-application-register.md), and
  [the county's lending](../measure/allen-county-home-lending-2023.yml).

  **It is the reason this county's mortgage market is a local one.** A hundred and ninety-one
  institutions lent here in 2023, including Rocket Mortgage and loanDepot, and neither reached
  seventy originations. The three largest after this one are the Union Bank Company of Columbus
  Grove, the Citizens National Bank of Bluffton and Huntington National Bank; the first two are
  seated in or beside this county. [verified] — same source.

  **It denied less often than the county did**: 133 of 795 applications it acted on, 16.7 per cent,
  against 23.4 per cent countywide. [verified] Nothing here explains that. A lender with a third of
  a market is not comparable to the market it dominates, because most of the market's applications
  are its own. [inference]

  **The register names it by Legal Entity Identifier and never in words.** `254900ARL5FDX2OOH702`
  resolves to this name, previously *Superior Financial Credit Union, Inc.*, active, registered in
  Ohio, LEI issued 16 January 2018. [verified] —
  [GLEIF](../../catalog/hmda-loan-application-register.md).

  **Two addresses, and one of them is shared.** Its legal address is 540 W. Market Street, Lima
  45801; its headquarters address is 4230 Elida Road, Lima 45807 — which is also the address given
  by *Superior Financial Solutions, LLC*, the eighth-largest lender in the county at 55
  originations. [verified]

  **Over seven years it is a third of this county's market and not an outlier in what it charges.**
  It originated 4,469 of the 14,703 first-lien loans made on site-built owner-occupied houses here
  between 2018 and 2024, and 8.6 per cent of them were priced above the federal higher-priced
  threshold, against 8.7 per cent for the county as a whole. [verified] — the same register; see
  [what a mortgage costs here](../measure/allen-county-mortgage-prices-2018-2024.yml).

  **Inside the city it charges what the city is charged.** 27.0 per cent of the loans in Lima's
  tracts were its and 31.2 per cent of those outside; its own higher-priced share is 15.7 per cent
  inside and 7.4 outside. [verified] — the same register. One institution and one underwriting
  policy on both sides of the line, which is the closest thing to a control this file offers and
  is not an explanation of anything; see
  [a denial rate is not an underwriting file](../../decisions/a-denial-rate-is-not-an-underwriting-file.yml).

  [open] Whether one of those two holds the other. A shared address is not a corporate structure.

  [open] Whether the Elida Road address is inside the City of Lima. The postal city is Lima and the
  ZIP is Elida's, which is the exact case
  [a postal address is not a municipality](../../decisions/a-postal-address-is-not-a-municipality.yml)
  was written for. The `seated-in` edge below rests on the Market Street address instead.

  [open] When it was founded, how many members it has, and where its branches are. The register
  says who lent and never who the lender is.
