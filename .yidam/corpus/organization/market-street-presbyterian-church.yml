class: organization
label: Market Street Presbyterian Church
description: |
  Lima's Presbyterian congregation, organized in August 1833 — and the two county histories that
  record it disagree about the day and about how many people were there.

  **The 1906 account.** "The first Presbyterian Church of Lima was organized August 1, 1833, by Rev.
  Thomas Clark and Rev. James Cunningham, Mr. and Mrs. Alexander Beatty, Mr. and Mrs. John Ward, Mr.
  and Mrs. John Jameson and Crain Valentine. John Jameson and Alexander Beatty were chosen elders."
  [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). Nine
  people, seven of them lay.

  **The 1921 account.** "The Market Street Presbyterian Church having been organized August 24,
  1833, by the Rev. James Cunningham and the Rev. Thomas Clark ... When the Market Street
  Presbyterian Church was organized it had fourteen charter members." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). Same year,
  same two ministers, a different day and five more members. See
  [when Lima's first congregation was organized](../question/when-limas-first-congregation-was-organized.yml).

  **It split twice and reunited twice in forty years.** A brick church on West Elm Street in 1834; a
  frame building at Elizabeth and Spring in 1845; in February 1855 thirteen members withdrew and
  organized a second "New School" church; a third, Central Presbyterian, separated under Rev. T. P.
  Johnston with 54 members; the New School rejoined in 1869 as "Union Presbyterian"; and on
  4 September 1872 Central joined too, "making the Presbyterians of Lima again one body". [verified]
  — the 1906 history.

  **Its second building became the county's African Methodist Episcopal church.** The 1845 frame
  building at Elizabeth and Spring "is now known as the A. M. E. Church". [verified] — same source,
  writing in 1906. The African Methodist Episcopal Church still reports one congregation and 150
  adherents in this county. [verified] —
  [the congregations of 2020](../measure/allen-county-congregations-2020.yml). Whether it is the
  same congregation, or in the same building, is not established here. [open]

  **The 1921 book dates its present edifice.** Construction began in 1879 and it was dedicated a
  year later. [verified] — the 1921 history, which adds the complaint that "cornerstone information
  is public property, but not all building committees have seen fit to furnish it."
