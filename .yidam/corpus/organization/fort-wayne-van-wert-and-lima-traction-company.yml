class: organization
label: The Fort Wayne, Van Wert & Lima Traction Company
description: |
  The interurban Lima built with its own money, and what became of it.

  **It was local capital, and the 1906 history says so twice over.** "The Fort Wayne, Van Wert &
  Lima Traction Company is a close second in importance to the Western Ohio. It traverses a fertile
  and prosperous territory, paralleling the great Pennsylvania line all the way from this city to
  Fort Wayne. It has been projected by Lima men and financed in a large degree by Lima capital and
  is destined to become one of the greatest traction interests in the country." [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **Its route through the county is on record village by village.** It parallels the Pittsburg, Fort
  Wayne & Chicago through [German Township](../place/elida.yml) with a station at
  [Elida](../place/elida.yml), and it is the line the same book calls "one of the best traction lines
  in the country" when listing what [Delphos](../place/delphos.yml) is served by. [verified] — same
  source. That is the county's western direction, and it is the only interurban route in Allen County
  the sources place at named settlements rather than by compass.

  **In 1905 it ran eight cars a day into Lima and expected twenty-five in 1906**, with a branch to
  Ottawa that year to add sixteen more. [verified] — same source; see
  [the trains of 1905](../measure/lima-railroad-traffic-1905.yml).

  **Eleven years later it was somebody else's road.** The federal directory of operating electric
  railway companies for 1917 lists `The Ohio Electric Ry. Co.` as an operating company and prints
  `Fort Wayne, Van Wert & Lima Traction Co., The` in italics immediately beneath it, which in that
  volume's own notation means a **lessor company** — one whose road is leased and operated by the
  company above. [verified] —
  [Census of Electrical Industries, 1917](../../catalog/census-electrical-industries-1917.md). It is
  one of five lessors listed under the Ohio Electric, the others reaching Cincinnati, Dayton, Toledo,
  Columbus, Newark, Zanesville and Indiana.

  **So the company survived and the enterprise did not.** A lessor still exists — it is a corporation
  with a road and a rent — but it no longer runs anything, and "one of the greatest traction interests
  in the country" is, by 1917, a line item under a company seated elsewhere. [inference] The corpus
  records this as what the two sources show together and not as a failure, because neither says the
  lease was distress and the 1906 forecast was a forecast.

  [open] When the lease was made, on what terms, and whether Lima's investors were bought out or
  kept their stock. The 1917 directory gives the relationship and no date; the 1921 history does not
  mention this company at all, naming only
  [the Ohio Electric](ohio-electric-railway.yml) and
  [the Western Ohio](western-ohio-railway.yml).
properties:
