class: organization
label: The Lima News
description: |
  The county seat's daily, and since 1964 the only one. [verified] —
  [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md).

  **It has published under this title since 21 June 1926, and the title is younger than the paper by
  forty-two years.** The record opens "43rd year (June 21, 1926)-": the paper arrived at its present
  name already counting its forty-third volume. Gutgesell's guide labels it "Independent, 1926-1931;
  Democratic, 1932+". [verified] — same source, quoting the record's notes.

  **Nine titles carry one unbroken issue count from 27 October 1884 to now.** Each successor begins
  at the number after its predecessor's last, and the directory prints both ends. [verified] — same
  source, the nine records read in full:

      1884-10-27  The Daily Democratic Times      v.1 no.1        O.B. Selfridge, Jr.
      to 1889-02-02  The Lima Daily Democratic Times   -v.5 no.89
      1889-02-04  The Lima Daily Times            v.5 no.90  - v.9 no.141   (1893-03-31)
      1893-04-01  The Lima Times-Democrat         v.9 no.142 - v.11 no.287  (1895-09-17)
      1895-09-18  The Times-Democrat              v.11 no.288 - ceased 1901
      1901-04-09  The Lima Times-Democrat         v.17 no.151 - 36th yr no.122 (1920-05-01)
      1920-05-03  The Lima Daily News and Times-Democrat   36th yr - (1920-06-05)
      1920-06-06  The Lima News and Times-Democrat         36th yr - 43rd yr (1926-06-20)
      1926-06-21  The Lima News                            43rd yr - Current

  **The arithmetic closes.** A first volume beginning in October 1884 puts the thirty-sixth year in
  1919–20 and the forty-third in 1926–27, which is where the directory puts them. [inference] —
  computed from the two volume-year statements and the founding date; the records themselves do not
  connect the Lima News to the Daily Democratic Times, only each title to the next.

  **In the merger of 1920 the paper kept one parent's name and the other's age.** The Lima Daily
  News, founded November 1897, ran to its "24th year (May 2, 1920)"; the combined paper appeared the
  next day as the thirty-sixth. The News gave the surviving title and the Times-Democrat the
  surviving count. [verified] — same source, both records.

  **Its worst interruption is a strike.** Suspended 10 May to 27 June 1957; see
  [the strike](../event/the-lima-news-strike-of-1957.yml). [verified] — same source.

  [open] Who has owned it. The 1926 imprint is "[publisher not identified]" and the directory
  records no owner for any title in the chain after Selfridge in 1884.
