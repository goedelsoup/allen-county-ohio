class: organization
label: The Lima Citizen
description: |
  A second daily in Lima, founded four days after a strike at the first one ended and dead six and
  a half years later. [verified] —
  [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md).

  **First year, number 1 is dated 1 July 1957 and volume 7, number 190 is dated 7 January 1964.**
  Daily except Saturday, published by the Lima Citizen Printing Company. [verified] — same source,
  the item record read in full.

  **[The Lima News](the-lima-news.yml) had been shut by a strike from 10 May to 27 June 1957.** The
  Citizen's first issue is four days after the older paper resumed. [verified] — same source, both
  records; see [the strike](../event/the-lima-news-strike-of-1957.yml). The directory states the
  suspension and states the founding and does not connect them; the connection is this corpus's.
  [inference]

  **It is the last competitor Lima has had.** No newspaper record for the city after 1964 carries a
  daily frequency, and the county has been a one-daily county since. [verified] — same source, all
  66 Lima records checked; see
  [the county's newspapers](../measure/allen-county-newspapers-1843-2026.yml).

  **The Lima Public Library reports the whole run and nobody else reports any of it.** Originals for
  1 July 1957 to 30 December 1960 and microfilm for 1 July 1957 to 7 January 1964. [verified] — same
  source, the holdings record.

  [open] Who founded and financed it, whether it was a strike paper made permanent, and what closed
  it. The directory gives a printing company and no people.
