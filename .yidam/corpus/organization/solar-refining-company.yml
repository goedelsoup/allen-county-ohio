class: organization
label: Solar Refining Company
description: |
  The Standard Oil subsidiary that built and operated [the Lima refinery](../site/lima-refinery.yml)
  — the corporate name attached to the county's longest-running industrial installation, and the
  first link in an ownership chain the refinery node has asked for since genesis. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **It appears in the record as the buyer, not as Standard.** When Standard Oil resolved in 1886 to
  put a refinery in north-west Ohio, the committee that toured the candidate sites was
  Frank Rockefeller, the director F. B. Squiers, and **Keith, "an attorney for the Solar Refining
  Company"** — and the 151 acres of the Hover farm were contracted "to the Solar Refining Company".
  So the entity that dealt with the landowner, took the deed and took possession was Solar, with
  Standard's officers making the decision. [verified] — same source. That distinction is why
  [Standard Oil](standard-oil.yml) and this node are separate: one chose, the other bought.

  Thirty-five years later the 1921 historian's summary of what the boom left is one clause: "About
  all that is left is the Solar refinery and the different companies dealing in oil commodities."
  [verified] — same source. The refinery had already outlasted the field that justified it, which is
  the fact [the boom's](../period/lima-oil-boom.yml) end bound is really about.

  **It moved the Red Cross for nothing.** "In Lima all drayage was donated by the Solar Refinery
  Company" during the war, while the county's Red Cross chapter was supplying nurses to the influenza
  epidemic and lending them to other communities. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the period](../period/the-world-war-in-allen-county.yml).

  In 1918 it was one of nine Lima industrial firms that agreed to meet half the cost of equipping a
  machine shop at South High School, alongside Lima Locomotive Works and the Ohio Steel Foundry.
  [verified] — same source. It is also a corporate life member of the Lima Hospital Society, with
  the Buckeye Pipe Line Company, the Ohio Oil Company, the Lima Natural Gas Company and the
  Manhattan Oil Company. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **The far end of the chain it starts is now held.** BP Oil Corp. operated
  [the refinery](../site/lima-refinery.yml) in 1994, and
  [Lima Refining Company](lima-refining-company.yml) operates it now under Cenovus. [verified] —
  [EIA Refinery Capacity Report](../../catalog/eia-refinery-capacity.md). So the question this node
  has carried since genesis is no longer *who has it now*; it is the hundred and eight years in
  between.

  [open] When this company was incorporated and under what law, when it ceased to be the refinery's
  operator, and what succeeded it. `organization.dissolved` and `succeeded-by` are both declared and
  both empty here, which is still the shape of the question rather than an answer to it — the
  federal census reaches back to 1994 and no further.
