class: organization
label: The Ohio Electric Railway Company
description: |
  The company that owned Lima's electricity and Lima's streetcars at the same time, and the largest
  corporate body of any kind this corpus holds for the county's industrial era.

  **It ran the city's cars and sold the city's current, and the 1921 history could not tell the two
  apart.** "The Lima Light and Power Company is subsidiary to the Ohio Electric Company; it has a
  power station in Lima and manufactures current for public use ... it is hard to separate the Lima
  Light and Power Company from its parent company, the Ohio Electric Company, which has three large
  plants with power stations in other towns, operating its 600 miles of electric railway system,
  supplying current in many towns. It has functioned in Lima since 1901, and is still adding to the
  number of its patrons; while it now lights 9,000 homes, there are some old houses in Lima that are
  not wired for electricity." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The city has fifteen miles of its track.** "The city has fifteen miles of electric railways
  operated by the Ohio Electric Company." [verified] — same source. Against the same book's 600 miles
  for the whole system, Lima holds one fortieth of it. [inference]

  **A federal census confirms the shape of the company without confirming its size.** The 1917
  directory of operating electric railway companies lists `The Ohio Electric Ry. Co.` as **A-Y** —
  railway operating income over \$1,000,000, and a railway that generates and sells electric energy
  for light and power — and marks it with an asterisk, meaning it is one of the 110 companies carried
  in that volume's comparative summary for 1917 and 1912. [verified] —
  [Census of Electrical Industries, 1917](../../catalog/census-electrical-industries-1917.md). The Y
  is the Lima Light and Power Company seen from Washington. [inference]

  **Five companies are printed in italics beneath it, and one of them is Allen County's own.** In
  that directory's notation an italic name immediately below an operating company is a lessor whose
  road the company above leases and operates. The five are the Cincinnati, Dayton & Toledo Traction
  Company; the Columbus, Newark & Zanesville Electric Railway Company; the Dayton & Western Traction
  Company; **the Fort Wayne, Van Wert & Lima Traction Company**; and the Indiana, Columbus & Eastern
  Traction Company. [verified] — same source; see
  [what became of Lima's own line](fort-wayne-van-wert-and-lima-traction-company.yml).

  **What it did not swallow was the other one.** [The Western Ohio](western-ohio-railway.yml) stands
  on its own line in the same directory, classed B-X. So the two interurbans the 1921 history names
  as serving Lima were, four years earlier, in different halves of the industry: one over a million
  dollars and selling power, one under it and buying power. [verified] — same source.

  **It has no `seated-in` edge and that is the claim.** Every other company in this corpus points at
  a place in Allen County, on the reasoning that it worked here. This one had power stations in other
  towns and lessors reaching Cincinnati, Dayton, Toledo, Columbus, Newark, Zanesville and Indiana, and
  Lima was fifteen miles of a six-hundred-mile system. Pointing it at Lima would say the county held
  it; the county was held by it. [inference] — see
  [the name is the seat, not the extent](../../decisions/the-name-is-the-seat-not-the-extent.yml).

  [open] Where it was in fact seated, and its size measured rather than asserted. The 1917 directory gives no mileage, revenue or employment
  for any individual company, so the 600 miles is
  [a single witness read once](../../decisions/a-single-witness-read-once.yml) and stays that way.
properties:
  org_type: company
  industry: interurban electric railway, and electric light and power
  also_known_as: |
    "The Ohio Electric Company" throughout the 1921 history; "The Ohio Electric Ry. Co." in the 1917
    federal directory. Its Lima lighting business is carried under the name Lima Light and Power
    Company, which the 1921 history calls a subsidiary.
