class: organization
label: The Bluffton News
description: |
  The village weekly this corpus has read more of than any other document, and the only Allen County
  newspaper the Library of Congress has digitized. [verified] —
  [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md) and
  [Chronicling America](../../catalog/chronicling-america.md).

  **It began with the issue of 28 July 1875 and it has not stopped.** Published by the Bluffton News
  Publishing Company, weekly, and the record carries no end date. [verified] — the directory.

  **A hundred and fifty-one years exist and twenty-one of them are online.** Chronicling America
  holds 1939 through 1959; the microfilm at Bowling Green State University runs
  15 November 1877, then 22 July 1880 to 13 June 1889, 18 February 1892 to 26 December 1895, and
  **28 May 1896 continuously to 31 December 1960**, with a further reel for 1 December 1970 to
  30 December 1982. The Ohio History Connection reports paper volumes besides. [verified] — the
  directory, the holdings record read in full.

  **That changes what this corpus can still ask of it.** The digitized window opens in 1939, which
  is why [Lima's mayors 1922–1939](../office/mayor-of-lima.yml) are still missing and 1939–1956 are
  not. The film covers 1922 to 1939 without a gap, in Bowling Green. [inference] — the holdings
  ranges read against the corpus's own open interval; nothing on that film has been read here.

  **It is the source of four mayors of Lima, two villages' election returns and a county's war
  news.** [verified] —
  [the mayors named inside the gap](../measure/lima-mayors-1939-1956.yml),
  [Bluffton and Beaverdam elections](../measure/bluffton-and-beaverdam-elections-1939-1959.yml) and
  [the second war](../period/the-second-world-war-in-allen-county.yml). What it reports and what it
  does not is set out in
  [a weekly reports events, not states](../../decisions/a-weekly-reports-events-not-states.yml).

  [open] Who has edited or owned it in a hundred and fifty-one years. The directory names a
  publishing company and no person, and no source held here names one.
