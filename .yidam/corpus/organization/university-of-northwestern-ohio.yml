class: organization
label: University of Northwestern Ohio
description: |
  A private not-for-profit university on North Cable Road, in
  [American Township](../place/american-township.yml) rather than in the city its post town names —
  2,606 students in autumn 2023 and 3,200 over the twelve months — the county's second largest, its largest residential institution, and
  the one that awards the most. [verified] —
  [IPEDS](../../catalog/ipeds.md), 2023-24 collection.

  **It awards more credentials than any other institution here and almost all of them are in one
  field.** 1,104 awards in 2022-23, of which **694 are in mechanic and repair technologies** — 24.2
  per cent of everything awarded in Allen County, and every single one of that field's awards in
  the county. Then business and management at 133 and agriculture at 93. [verified] — same source,
  completions, first majors.

  **Two thirds of its entering students come from outside Ohio.** Of 877 first-time students in
  autumn 2023, 295 were Ohio residents and 582 were not: 101 from Michigan, 83 from Indiana, 48
  from Pennsylvania, 31 from New York. [verified] — same source, residence of first-time students.
  The county's other two institutions that report the question draw 99.1 and 97.0 per cent of
  their entering students from Ohio.

  So the largest single thing the county's colleges do is train people from other states to repair
  vehicles, and reading that as a measure of Allen County's workforce would be a mistake. [inference]
  — see [located here is not of here](../../decisions/located-here-is-not-of-here.yml).

  **It has 1,684 beds, more than twice the county's other residential campus**, and had 1,536 in
  2020. [verified] — same source, institutional characteristics. Bluffton University's are 780 and
  692; no other institution in the county has any.

  Its students are almost all full-time — 2,434 of 2,606, a full-time equivalent of 2,501 against
  a headcount of 2,606 — which is the opposite shape to
  [Rhodes State](james-a-rhodes-state-college.yml)'s. [verified] — same source. Tuition and fees
  are $11,352, the same for residents and non-residents.

  **The Ohio State Beauty Academy is in its system.** IPEDS records the academy's parent as this
  university, and the Census Bureau puts the academy's address in the same block as this
  university's. [verified] — same source and
  [the Census geocoder](../../catalog/census-tiger-landmarks.md); see
  [the academy](ohio-state-beauty-academy.yml).

  **Its enrolment has fallen by more than a third since 2010**, 5,050 to 3,200 on the twelve-month
  count, and 1,892 of that loss is since 2016. [verified] —
  [the enrolment series](../measure/allen-county-college-enrollment-2010-2023.yml).

  **Its address is a Lima one and its ground is not in Lima.** The Census Bureau puts 1441 North
  Cable Road in unincorporated American Township, inside no municipality at all, while two of the
  blocks holding its student housing are in Lima city — so the campus crosses the line. [verified] —
  [the Census geocoder](../../catalog/census-tiger-landmarks.md) and
  [the group quarters](../measure/allen-county-group-quarters-2020.yml); see
  [a postal address is not a municipality](../../decisions/a-postal-address-is-not-a-municipality.yml).

  [open] When it was founded, and whether the beds have ever been full. A campus with 1,684 beds
  and 2,434 full-time students is a large residential operation for a county this size, and
  nothing held here says when it was built or what it has held.
