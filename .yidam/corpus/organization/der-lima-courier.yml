class: organization
label: Der Lima Courier
description: |
  A German-language weekly published in Lima from 1877, and one of two German papers this county is
  recorded as having had. [verified] —
  [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md).

  **Jahrgang 1, Nummer 1 is dated 30 August 1877.** The record gives no last issue, no publisher and
  no price — the imprint is "Lima, Ohio : [s.n.]" — and its subject heading is
  "Germans--Ohio--Lima--Newspapers". [verified] — same source, the item record read in full.

  **No library anywhere reports holding a copy.** Its `holding_data` is an empty list, one of the
  forty-three in the county's ninety-nine that no institution has claimed. [verified] — same source.
  So the corpus can say this paper existed and can say nothing that was in it.

  **A German press is what a German township implies and this is the first evidence of one.** The
  county had a township named German until
  [1918](../event/renaming-of-german-township-1918.yml), and until now the corpus held the renaming
  without holding anything the community itself produced. [inference] — the two facts joined; the
  directory does not connect them and the paper was printed in Lima, not in the township.

  [open] When it stopped, who printed it, and whether the *Delphos Kleeblatt* — German, December
  1889 to 3 August 1905, one reported holding — was related to it. Neither record cross-references
  the other. [verified] — same source, both records read.
