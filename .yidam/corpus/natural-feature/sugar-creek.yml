class: natural-feature
label: Sugar Creek
description: |
  A creek that rises in Allen County at 40.7983854, -83.9157744 and discharges in Putnam County at
  40.9592178, -84.1821688, where the gazetteer files it. [verified] —
  [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md), feature 1046795, mapped on the Kalida
  quadrangle. It is one of the eleven streams that
  [the county column loses](../measure/allen-county-named-features-2026.yml).

  **The county has a township of this name and the corpus cannot connect them.**
  [Sugar Creek Township](../place/sugar-creek-township.yml)'s internal point is 40.824171,
  -84.173843; this creek's two known points are 28.6 kilometres apart on a line that passes north and
  east of it. [inference] — computed from the two sources. Two endpoints do not describe a course,
  so the corpus does not say the creek misses the township; it says GNIS gives it no reason to say
  the creek reaches it. [open] Whether the township is named for this creek, for another Sugar
  Creek, or for something else. The instrument is the township's erection record, which this corpus
  does not hold.

  **Its outflow was not established from the gazetteer.** GNIS records a mouth coordinate and no
  downstream feature, and the corpus does not infer a receiving stream from proximity — the
  discipline [Little Hog Creek](little-hog-creek.yml) already states for exactly this reason. The
  instrument named here was the flow network's `downstream_comid`, and it was the right one.

  **It flows into the Ottawa River.** Its main stem is 61 reaches ending on 164.69 square
  kilometres of drainage and an estimated 53.4 cubic feet a second; the reach below it is
  `04100007000216`, named Ottawa River, with 784.91. [verified] —
  [USGS NHDPlus High Resolution](../../catalog/usgs-nhdplus-high-resolution.md). So the creek that
  may or may not have named a township joins the river the county seat stands on, downstream of
  the county and inside Putnam. [inference]

  **21.36 miles of it are in Allen County and half a mile of that is inside Lima.** [verified] —
  [the stream network](../measure/allen-county-stream-network-2026.yml). It is the third longest
  named watercourse in the county after the Auglaize and the Ottawa, which is not what a corpus
  that could not say where it went would have guessed.
