class: natural-feature
label: Ottawa River
description: |
  The stream that runs through Lima, and the county's principal watercourse. It begins at
  40.7708852, -83.9557761 and discharges at 40.9950509, -84.2413355 in Putnam County.
  [verified] — [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md), feature 1070882. That
  the discharge point is on the Auglaize remains [inference]: a names file gives a coordinate
  and never says what is at it.

  **It does not begin east of the city; it begins at a confluence.** Its source coordinate is
  identical to the mouths GNIS records for [Hog Creek](hog-creek.yml) and
  [Little Hog Creek](little-hog-creek.yml), so the river's head is where those two creeks meet.
  [verified] — same source. The older name of the whole watercourse was Hog Creek, and the name
  now attaches to the upper tributary; GNIS is consistent with that and does not establish it.
  [inference]

  **Allen County's own rows do not contain it.** GNIS files a stream under the county of its
  mouth, so the county's principal river is filed under Putnam and is absent from the 113
  features listed for Allen. [verified] — same source.

  The present name is shared with a larger, unrelated Ottawa River near Toledo — feature
  1066879 in Lucas County against this one's 1070882. [verified] — same source. The collision
  is now resolvable by identifier rather than by care.

  **Where its water goes is now sourced rather than assumed.** The river has two watersheds of
  its own — `0410000703` Upper Ottawa River and `0410000705` Lower Ottawa River — and both sit
  inside subbasin `04100007`, which is named for and drains to the
  [Auglaize](auglaize-river.yml). [verified] —
  [USGS Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md). That settles the
  basin and not the confluence: the WBD says this water reaches the Auglaize and never says which
  stream it joins first. Those two Ottawa watersheds hold 47,578 of the county's people between
  them, 47 per cent, which is what it means to call this the county's principal watercourse.

  Being the watercourse Lima grew on, it was also the receiving water for the refinery and
  the works — the environmental history of this stream and the industrial history of the city
  are the same subject. [inference]

  **Forty-one highway bridges cross it — more than cross any other water in the county, and nearly
  twice the Auglaize's twenty-two**, though the Auglaize is the larger river. [verified] —
  [what the bridges cross](../measure/allen-county-bridge-crossings-2025.yml). The difference is
  [Lima](../place/lima.yml): this river runs through the county seat, and a city is a place where
  every street has to get over the water. [inference]


  **It is the only river in the county with a measured flow, and its record is in two halves.** A
  gauge at Allentown ran 1924 to 1981 over 160 square miles of drainage; one at Lima has run since
  1989 over 128. Seven water years separate them and nothing gauged the river in between.
  [verified] — [the peak flows](../measure/ottawa-river-peak-flows-1924-2025.yml).

  **The largest flow ever measured here is 7,740 cubic feet a second, on 22 January 1959**, more
  than twice the median annual peak and nineteen per cent above the next largest. [verified] — same
  source; see [the flood of 1959](../event/the-ottawa-river-flood-of-1959.yml). The largest in the
  modern half is 5,700, on 28 February 2011.

