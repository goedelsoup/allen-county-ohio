class: natural-feature
label: Ottawa River
description: |
  The stream that runs through Lima, and the county's principal watercourse. It rises east of
  the city, passes through it, and flows west and north to join the Auglaize River. [inference]

  It was known historically as Hog Creek, and the older name survives in local usage and in
  the name of the Hog Creek marsh country the early county records describe. [inference] The
  present name is shared with a larger Ottawa River on the Ohio–Michigan line near Toledo,
  which is a genuine source of confusion in the record. [inference]

  Being the watercourse Lima grew on, it was also the receiving water for the refinery and
  the works — the environmental history of this stream and the industrial history of the city
  are the same subject. [inference]
properties:
  feature_type: river
  mouth: Joins the Auglaize River northwest of Lima. [inference]
