class: natural-feature
label: Auglaize River
description: |
  The river that collects Allen County's drainage and carries it north to the Maumee at
  Defiance. [inference] It rises at 40.6669957, -83.8938286 and discharges at 41.2875489,
  -84.3557802 in Defiance County. [verified] —
  [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md), feature 1065901. It gives its name to
  Auglaize Township in the county's south — one of the twelve
  townships recorded in the [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).
  [verified]

  Its significance to this corpus is directional. Allen County drains north to Lake Erie
  rather than south to the Ohio, and the Auglaize is the channel by which it does so. That
  single fact organizes a great deal: the county's swamp history, its canal, and the basin
  its water quality is accounted for in are all consequences of being on the Lake Erie side
  of the divide. [inference]

  **It carried freight in 1813 and cannot now.** [Fort Amanda](../site/fort-amanda.yml) stood on
  its west bank and shipped flour downstream in barrels: Green Clay's letter of 20 June 1813 from
  Camp Meigs records a consignment received from the fort through Ensign Gray, and the garrison had
  spent the previous winter building flat boats on this water. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans. The 1921
  history calls that "a thing that would be an utter impossibility on the Auglaize today" and gives
  the reason — the timber gone and the country drained, so the water runs off instead of standing.
  [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).
  A navigable stream became an unnavigable one by clearing and tiling the ground around it.
  [inference]

  **It rises in this county**, at 40.6669957, -83.8938286 in Auglaize township — the township
  named after it. [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md),
  point-in-polygon. So Allen County is not merely drained by the Auglaize; it is the ground the
  river starts on. See
  [where the Auglaize rises](../question/where-the-auglaize-rises.yml). Its whole subbasin,
  `04100007`, is one of the seven that make up the Maumee's drainage; the four blocks of that
  township on [the Scioto side](scioto-river-basin.yml) drain the opposite way, so the divide
  and this river's source are in the same township. [verified] —
  [USGS Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md).

  **Twenty-two highway bridges cross it in Allen County, and the oldest bridge in the county is one
  of them.** The Hay Road structure in [Auglaize Township](../place/auglaize-township.yml) was built
  in 1909 and is still carrying traffic. [verified] —
  [what the bridges cross](../measure/allen-county-bridge-crossings-2025.yml) and
  [the Hay Road bridge](../site/hay-road-bridge.yml).


  **It is the larger river and the ungauged one.** The USGS site near Spencerville drains 219 square
  miles against 160 for the Ottawa at Allentown, and neither it nor the Kossuth site at 201 square
  miles has an annual peak record; the Ottawa has two. [verified] —
  [the monitoring sites](../measure/allen-county-water-gauges-2026.yml). Everything this corpus can
  say about how much water moves through Allen County is about the smaller river, because the
  smaller river runs through the city. [inference]


  **It joins the Maumee, and the corpus no longer has to assume it.** The Auglaize's main stem is
  188 reaches and 181.6 kilometres, ending on 6,359.42 square kilometres of drainage and an
  estimated 2,087 cubic feet a second; the reach below it is `04100009001411`, named Maumee River,
  with 14,119.40. [verified] —
  [USGS NHDPlus High Resolution](../../catalog/usgs-nhdplus-high-resolution.md). The `flows-into`
  edge below has been `[inference]` since genesis and the mouth property said "Joins the Maumee
  River. [inference]"; both are now read from the receiving reach. See
  [a level path is not a river](../../decisions/a-level-path-is-not-a-river.yml), which is the rule
  that stopped this being answered *Saint Joseph River*.

  **It takes 269.37 miles of Allen County's channel directly and 461.45 by way of two other
  rivers.** [The Ottawa](ottawa-river.yml) delivers 383.06 miles of it and
  [the Blanchard](blanchard-river.yml) 78.39, and 3.66 miles of the county never reach this river
  at all. [verified] — [the stream network](../measure/allen-county-stream-network-2026.yml).

  **It rises in Allen County in the flow network too, and within 220 metres of where GNIS puts
  it.** The uppermost reach the file names Auglaize River begins at 40.66875, −83.89299, carrying
  3.61 square kilometres; the gazetteer's source coordinate is 40.6669957, −83.8938286. [verified]
  — the same source against [GNIS](../../catalog/gnis-domestic-names-ohio.md). It leaves the county
  on 636.04 square kilometres and an estimated 213.9 cubic feet a second.

  **Lima drinks from it, and it is the river with no flow record.** Two of the city's ten surface
  intakes are on the Auglaize. [verified] —
  [the water systems](../measure/allen-county-water-systems-2026.yml). So the county's largest water
  system draws on 219 square miles of drainage for which not one annual peak has ever been recorded,
  while the smaller Ottawa has two gauges and seventy-nine water years. [inference]

