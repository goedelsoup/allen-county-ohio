class: natural-feature
label: Auglaize River
description: |
  The river that collects Allen County's drainage and carries it north to the Maumee at
  Defiance. [inference] It rises at 40.6669957, -83.8938286 and discharges at 41.2875489,
  -84.3557802 in Defiance County. [verified] —
  [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md), feature 1065901. It gives its name to
  Auglaize Township in the county's south — one of the twelve
  townships recorded in the [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).
  [verified]

  Its significance to this corpus is directional. Allen County drains north to Lake Erie
  rather than south to the Ohio, and the Auglaize is the channel by which it does so. That
  single fact organizes a great deal: the county's swamp history, its canal, and the basin
  its water quality is accounted for in are all consequences of being on the Lake Erie side
  of the divide. [inference]

  **It carried freight in 1813 and cannot now.** [Fort Amanda](../site/fort-amanda.yml) stood on
  its west bank and shipped flour downstream in barrels: Green Clay's letter of 20 June 1813 from
  Camp Meigs records a consignment received from the fort through Ensign Gray, and the garrison had
  spent the previous winter building flat boats on this water. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans. The 1921
  history calls that "a thing that would be an utter impossibility on the Auglaize today" and gives
  the reason — the timber gone and the country drained, so the water runs off instead of standing.
  [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).
  A navigable stream became an unnavigable one by clearing and tiling the ground around it.
  [inference]

  **It rises in this county**, at 40.6669957, -83.8938286 in Auglaize township — the township
  named after it. [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md),
  point-in-polygon. So Allen County is not merely drained by the Auglaize; it is the ground the
  river starts on. See
  [where the Auglaize rises](../question/where-the-auglaize-rises.yml). Its whole subbasin,
  `04100007`, is one of the seven that make up the Maumee's drainage; the four blocks of that
  township on [the Scioto side](scioto-river-basin.yml) drain the opposite way, so the divide
  and this river's source are in the same township. [verified] —
  [USGS Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md).
