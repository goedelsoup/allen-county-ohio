class: natural-feature
label: Maumee River
description: |
  The river Allen County's water reaches last before Lake Erie. It rises at 41.0828261,
  -85.1321928 — the confluence of the St. Joseph and St. Marys at Fort Wayne, Indiana — and
  discharges at 41.6994922, -83.4599325 at Toledo. [verified] —
  [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md), feature 1084017.

  This node exists because the corpus was routing a river into a watershed. The
  [Auglaize](auglaize-river.yml) used to carry `flows-into`
  [the Maumee River Basin](maumee-river-basin.yml), which is a category error: a river
  discharges into another river, and it *lies within* a basin. The basin node was standing in
  for a river node that did not exist, and GNIS supplied the missing one.

  The discharge coordinate is what makes the corpus's Lake Erie claim more than an assertion.
  Allen County's water leaves the county by the Auglaize, and the river the Auglaize joins
  ends at Toledo on Lake Erie rather than anywhere on the Ohio. [inference] — the coordinate is
  verified; that the Auglaize joins *this* river at Defiance is not established by a names file.

  **The Auglaize does join this river at Defiance, and the flow network says so.** The Auglaize's
  last reach carries 6,359.42 square kilometres and the reach below it is `04100009001411`, named
  Maumee River, with 14,119.40. [verified] —
  [USGS NHDPlus High Resolution](../../catalog/usgs-nhdplus-high-resolution.md). The paragraph above
  says a names file cannot establish that. A flow network can, and `dnhydroseq` is the field.

  **The main stem this river lies on is mostly named for another river.** Of its 1,008 reaches,
  323 are named Saint Joseph River and 300 Maumee River, because the network traces the larger
  tributary upstream at every fork. [verified] — the same source. Reading that ranking instead of
  the receiving reach would have had Allen County's water joining a river in Indiana; see
  [a level path is not a river](../../decisions/a-level-path-is-not-a-river.yml).

  **And the county's water does not stop at Toledo.** Every Allen County reach on this side of the
  divide terminates on one level path — 398 reaches named Saint Lawrence River and Niagara River —
  ending on 774,375 square kilometres of drainage in the Gulf of Saint Lawrence. [verified] — the
  same source; see [how far the water is from the sea](../measure/allen-county-distance-to-the-sea-2026.yml).

properties:
