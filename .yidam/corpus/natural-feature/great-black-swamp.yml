class: natural-feature
label: Great Black Swamp
description: |
  The glacially-formed wetland that covered much of northwest Ohio until it was drained in
  the second half of the nineteenth century. Allen County lies at its southern margin, and
  its northern townships were within it. [inference]

  It belongs in this corpus because it is the negative space in the county's settlement
  history: the swamp is why this part of Ohio was settled late relative to the south of the
  state, why the drainage tile and ditch systems are as extensive as they are, and why the
  land is as productive as it is now that they exist. [inference] It is also a feature that
  no longer exists as such, which is a thing this class must be able to hold — a
  natural-feature node is not required to describe present ground.

  **It has no GNIS record.** No feature named "Great Black Swamp" appears anywhere in the
  17,921 rows of the Ohio file. [verified] —
  [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md). That is not because the gazetteer
  omits vanished features: it carries 56 `Swamp` features in Ohio and marks the drained ones
  "(historical)" in the name itself. The likelier reason is that GNIS names features with a
  locatable point, and a wetland that covered much of northwest Ohio across a dozen counties
  does not have one. [inference] So this node keeps no identifier, and the absence is a fact
  about how gazetteers work rather than a gap in the retrieval.

  **The county's hydric soils are 35.3 per cent of it, and that is the nearest thing to an answer
  the corpus can hold.** 91,953 acres of 260,340 are rated hydric — ground that formed under
  standing water — and 74.7 per cent of the county is poorly drained or worse. [verified] —
  [the soil survey](../../catalog/usda-ssurgo-soil-survey.md); see
  [the soils](../measure/allen-county-soils-2026.yml).

      hydric soil, per cent of each township
      Marion            58.0     Amanda            34.1     Shawnee           26.2
      Sugar Creek       48.0     Richland          33.8     Jackson           23.4
      Spencer           45.2     Auglaize          32.0     Bath              21.1
      Monroe            44.3     American          30.0     — Lima            13.4
      Perry             34.9

  **The direction this node guessed at is right and the compass point is not.** The four townships
  whose centres lie north of 40.80° — Marion, Sugar Creek, Monroe and Richland — average 46.0 per
  cent hydric against 30.9 for the other eight, but Spencer in the far south-west is 45.2 and
  Richland in the north-east is 33.8. [verified] — the same survey, clipped to
  [TIGERweb](../../catalog/tigerweb-census2020.md) township polygons. The wet ground runs north and
  west; the sentence above said north. [inference]

  **The driest ground in the county is the ground the county seat is on.** Lima is 13.4 per cent
  hydric and 33.2 per cent poorly drained or worse, against 74.7 for the county. [verified] — the
  same computation. Bath, the township the city grew into, is the driest of the twelve at 21.1.

  [open] Where the swamp's boundary actually ran. Hydric soil is a proxy and not a map: it records
  where water stood long enough to make the soil, which is a wider thing than the wooded wetland the
  name refers to and a narrower thing than the poorly drained county. Closing this needs a mapped
  historic extent — Kaatz's 1955 historical geography or a state original-vegetation layer — and
  neither has been obtained. See
  [a proxy must outlast what it proxies](../../decisions/a-proxy-must-outlast-what-it-proxies.yml).
