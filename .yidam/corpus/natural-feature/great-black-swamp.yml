class: natural-feature
label: Great Black Swamp
description: |
  The glacially-formed wetland that covered much of northwest Ohio until it was drained in
  the second half of the nineteenth century. Allen County lies at its southern margin, where what
  the name refers to is nineteen scattered bodies of swamp forest covering 8.6 per cent of the
  county rather than a continuous wetland across its northern townships. [verified] —
  [the original vegetation map](../../catalog/odnr-original-vegetation.md); see
  [what grew here](../measure/allen-county-original-vegetation.yml). The sentence this node opened
  with from genesis — that its northern townships were within it — is corrected below rather than
  removed, because the correction is the finding.

  It belongs in this corpus because it is the negative space in the county's settlement
  history: the swamp is why this part of Ohio was settled late relative to the south of the
  state, why the drainage tile and ditch systems are as extensive as they are, and why the
  land is as productive as it is now that they exist. [inference] It is also a feature that
  no longer exists as such, which is a thing this class must be able to hold — a
  natural-feature node is not required to describe present ground.

  **It has no GNIS record.** No feature named "Great Black Swamp" appears anywhere in the
  17,921 rows of the Ohio file. [verified] —
  [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md). That is not because the gazetteer
  omits vanished features: it carries 56 `Swamp` features in Ohio and marks the drained ones
  "(historical)" in the name itself. The likelier reason is that GNIS names features with a
  locatable point, and a wetland that covered much of northwest Ohio across a dozen counties
  does not have one. [inference] So this node keeps no identifier, and the absence is a fact
  about how gazetteers work rather than a gap in the retrieval.

  **The county's hydric soils are 35.3 per cent of it, and that is the nearest thing to an answer
  the corpus can hold.** 91,953 acres of 260,340 are rated hydric — ground that formed under
  standing water — and 74.7 per cent of the county is poorly drained or worse. [verified] —
  [the soil survey](../../catalog/usda-ssurgo-soil-survey.md); see
  [the soils](../measure/allen-county-soils-2026.yml).

      hydric soil, per cent of each township
      Marion            58.0     Amanda            34.1     Shawnee           26.2
      Sugar Creek       48.0     Richland          33.8     Jackson           23.4
      Spencer           45.2     Auglaize          32.0     Bath              21.1
      Monroe            44.3     American          30.0     — Lima            13.4
      Perry             34.9

  **The direction this node guessed at is right and the compass point is not.** The four townships
  whose centres lie north of 40.80° — Marion, Sugar Creek, Monroe and Richland — average 46.0 per
  cent hydric against 30.9 for the other eight, but Spencer in the far south-west is 45.2 and
  Richland in the north-east is 33.8. [verified] — the same survey, clipped to
  [TIGERweb](../../catalog/tigerweb-census2020.md) township polygons. The wet ground runs north and
  west; the sentence above said north. [inference]

  **The driest ground in the county is the ground the county seat is on.** Lima is 13.4 per cent
  hydric and 33.2 per cent poorly drained or worse, against 74.7 for the county. [verified] —
  [the same survey](../../catalog/usda-ssurgo-soil-survey.md), clipped the same way. Bath, the
  township the city grew into, is the driest of the twelve at 21.1.

  **Where the swamp's boundary ran, from a map instead of a proxy.** Gordon's *Natural Vegetation of
  Ohio at the Time of the Earliest Land Surveys*, digitized by the state, puts **22,433.9 acres** of
  elm-ash swamp forest in this county — **8.6 per cent** of it, against 91.4 per cent beech forest
  and nothing else. [verified] —
  [the original vegetation map](../../catalog/odnr-original-vegetation.md), clipped here. This
  question is closed and the proxy it was opened against was wrong by a factor of 4.1: the hydric
  acres above are 91,953 and the mapped swamp is 24.4 per cent of them.

  **The proxy's order was roughly right and its geography was not.** Across the twelve townships the
  two measures correlate at a Spearman 0.685, and Perry Township — fifth of twelve on hydric soil at
  34.9 per cent — carries no swamp forest at all, as do Jackson, Bath and the city. [inference] —
  [the same map](../../catalog/odnr-original-vegetation.md) against the soil survey, computed here.
  The northern lead this node claimed survives at 12.4 per cent against 7.9 where the soil said 46.0
  against 30.9, and it is one township wide. See
  [a proxy must outlast what it proxies](../../decisions/a-proxy-must-outlast-what-it-proxies.yml).

  **A fourth federal file draws the swamp today and it draws forty-two acres.** The hydrography
  file maps 57 swamp-or-marsh polygons in Allen County totalling 42.0 acres — one acre for every
  534 of the 22,433.9 the vegetation map puts here at the earliest land surveys. [verified] —
  [USGS NHDPlus High Resolution](../../catalog/usgs-nhdplus-high-resolution.md); see
  [the standing water](../measure/allen-county-standing-water-2026.yml). The county holds 2,026.8
  acres of standing water of every kind, eight tenths of one per cent of itself, and most of it is
  farm ponds under an acre.

  [open] Whether the nineteen bodies were one wetland before the ditching. Gordon mapped forest
  types and not hydrology, and a single swamp can carry two forest covers; the original survey field
  notes rather than the map drawn from them would settle it.
  **What is left of it, on the federal wetland map, is four hundred and twenty-six acres.** The
  National Wetlands Inventory draws 7,361 acres of wetland in this county — 2.83 per cent of it —
  of which 425.9 acres, 0.16 per cent, are emergent wetland, the class that means standing
  herbaceous marsh. Two fifths of the rest is excavated, diked or ditched. [verified] —
  [the wetlands inventory](../measure/allen-county-wetlands-2026.yml). Against the 22,433.9 acres
  of elm-ash swamp forest the first surveyors walked, the marsh is one acre in fifty-three.
  [inference] — computed from the two figures.

  **The water it left is under the ground and one well measures it.** Allen County's ninety
  groundwater wells hold 904 readings, all but seventy-one of them from before 1999; the well that
  is still read has fallen eleven and a half feet since 2010, faster than any well in the six
  counties around it. [verified] —
  [the water levels](../measure/allen-county-groundwater-1962-2026.yml). Whether the drainage that
  ended the swamp has anything to do with that is not a question this corpus can reach: the fall
  begins in 2010 and the ditching was finished by 1900. [inference]

