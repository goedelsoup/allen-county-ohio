class: natural-feature
label: Scioto River Basin
description: |
  The drainage basin of the Scioto River, which discharges to the Ohio River at Portsmouth and
  through it to the Gulf of Mexico. **Ninety-nine people in Allen County live in it.** [verified]
  — [USGS Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md).

  Four census blocks in [Auglaize Township](../place/auglaize-township.yml), at the county's
  south-east corner between 40.6487 and 40.7104 north, fall in hydrologic unit `05060001` — the
  Upper Scioto subbasin of the Ohio Region. Every other block in the county, 3,548 of 3,552, is in
  the Great Lakes Region and drains to
  [the Maumee basin](maumee-river-basin.yml). [verified] — same source, by block composition;
  all 3,552 blocks land in exactly one subbasin and their populations sum to the county's own
  enumeration of 102,206.

  **This node exists because the corpus asserted otherwise from genesis.** The Maumee basin node
  said the county lies within it and marked the southern townships unchecked. They were worth
  checking: the answer is 0.1 per cent of the county's population, 43 housing units, and a
  different ocean.

  The subwatershed those four blocks sit in is `050600010101`, **Cottonwood Ditch** — a headwater
  of the Scioto rising in Auglaize Township. [verified] — same source. It is the only named
  feature on the Ohio River side of the divide in this county.

  **Where the divide runs on the ground.** The boundary between the two hydrologic regions crosses
  **9.196 miles** of Allen County, entirely inside Auglaize Township, entering at the county's
  southern line at 40.644643, −83.902735 and leaving at its eastern line at 40.721021, −83.879880.
  [verified] — [the WBDLine layer](../../catalog/usgs-watershed-boundary.md) at `hudigit` 2, clipped
  and measured; see [the elevation node](../measure/allen-county-elevation-2026.yml). The open
  question this node carried named that layer and it was the right instrument.

  **The corner it cuts off is 2,303.0 acres, and it is nine times more of the county's ground than
  of its people.** 3.5984 square miles, 0.885 per cent of the county, against the 0.10 per cent of
  its population counted above. [verified] — the same source's region polygons, clipped to the
  county. Four blocks are a population and 2,303 acres are a place.

  **The divide is nine miles long and 74.6 feet tall.** Ninety-eight elevations spaced 500 feet
  along it run from 991.3 to 1,065.9 feet on a standard deviation of 20.2, and its high end is
  within 200 metres of the highest ground in Allen County. [verified] —
  [USGS 3DEP](../../catalog/usgs-3dep-elevation.md). Nothing on the ground marks it.

  **In channel miles the far side is 3.66 of the county's 735.22 — half of one per cent.** Three
  unnamed order-1 intermittent reaches, 4.490, 8.381 and 2.963 kilometres long, each rising inside
  Allen County and leaving it eastward. [verified] —
  [USGS NHDPlus High Resolution](../../catalog/usgs-nhdplus-high-resolution.md); see
  [the stream network](../measure/allen-county-stream-network-2026.yml). The subwatershed is named
  Cottonwood Ditch and not one of the three channels in it carries a name.

  **The divide costs 752 miles.** The uppermost reach of [the Auglaize](auglaize-river.yml) begins
  858 metres from the nearest of those three, and the flow network puts the Auglaize headwater
  1,069.1 miles of channel from the sea and the ditch 1,820.9. [verified] — the same source's
  `PathLength`; see
  [how far the water is from the sea](../measure/allen-county-distance-to-the-sea-2026.yml). Two
  furrows within earshot of each other, and one of them is seven hundred and fifty miles further
  from salt water than the other.

  **No instrument stands on this side of the divide.** All 184 USGS water monitoring sites in Allen
  County are in Maumee hydrologic units — 168 in the Auglaize, 14 in the Blanchard, two in others —
  and none in an Ohio River unit. [verified] —
  [the monitoring sites](../measure/allen-county-water-gauges-2026.yml). That is an absence of
  gauges and not evidence against the four blocks above: ninety-nine people and a headwater ditch do
  not get a gauge, and the instrument network was never asked the question this node answers.
  [inference]

