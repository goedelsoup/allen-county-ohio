class: natural-feature
label: Maumee River Basin
description: |
  The drainage basin that **almost all** of Allen County lies within — the largest watershed
  draining to the Great Lakes, discharging to Lake Erie at Toledo. 3,548 of the county's 3,552
  census blocks and 102,107 of its 102,206 people are in the Great Lakes Region, across three
  subbasins: Auglaize `04100007` holds 3,200 blocks and Blanchard `04100008` holds 348.
  [verified] — [USGS Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md), by
  block composition.

  This node is the outlet the county's whole surface-water system resolves to, and it is the
  terminating node of any [watershed-trace](../../skills/watershed-trace.md) run from a
  feature in this corpus. It is included at genesis for that reason: without it the trace
  from the Ottawa River runs to the Auglaize and stops in mid-air, and the corpus cannot say
  where its water goes.

  **This basin is not a hydrologic unit, which is why no code is recorded here.** The Maumee's
  drainage is seven subbasins — `04100003` St. Joseph through `04100009` Lower Maumee — and the
  next unit up that contains them, `041000` Western Lake Erie, also contains six that are nothing
  to do with the Maumee: Raisin, Sandusky, Huron and three more. [verified] —
  [USGS Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md). So the honest
  answer to this node's genesis question about its own HUC is that it does not have one, and
  writing `0410` here would have named a basin four times too large.

  **Its other genesis question is answered against it.** Part of Allen County does drain to the Ohio
  River: four blocks in [Auglaize Township](../place/auglaize-township.yml), 99 people, sit in
  [the Scioto basin](scioto-river-basin.yml). [verified] — same source. The corpus asserted the
  Lake Erie side for the whole county from genesis and flagged the southern townships as
  unchecked; checking them cost one query and moved 99 people to the Gulf of Mexico.

  What settled it was the Watershed Boundary Dataset rather than the National Hydrography
  Dataset this node proposed. The WBD gives drainage areas, which is what a basin question needs;
  NHD gives the flow network, which is what the `flows-into` edges still partly need.
properties:
  feature_type: watershed
