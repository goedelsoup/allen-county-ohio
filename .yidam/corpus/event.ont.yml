class: event
label: Event
foundational_type:
  ontology: ufo
  type: event
description: |
  A bounded happening at a stated time — a treaty signing, an act of erection, a strike, a
  fire, a plant closing, an election. It is irreducible because a happening has
  participants and a date, and because the corpus's temporal spine is built from things
  that occurred rather than from dates attached to things that persist.
edge_policy: characteristic
# `max_lines` is this class's p90 description length, rounded up to five, measured
# 2026-09-06 over all 38 instances. The estimator is the decision and is recorded in
# `.yidam/decisions/node-length-limits.yml`; recompute it from the corpus, never raise it
# because a node exceeded it.
max_lines: 60
properties:
  - name: occurred
    type: date
    required: true
    description: When it happened, at whatever precision is known. An event without a date is not one.
  - name: occurred_through
    type: date
    description: For a happening with duration, when it ended.
  - name: event_type
    type: string
    description: What kind of happening — cession, erection, incorporation, annexation, discovery, closure, election, disaster.
  - name: location_description
    type: text
    prose: true
    description: Where it happened, as the record states it, when no place or site node captures it.
  - name: track
    type: string
    description: |
      The ground a moving happening covered, as "latitude, longitude" points in the order it
      passed them, separated by semicolons: `40.80, -84.20; 40.87, -83.87`. Decimal degrees,
      ASCII hyphen for a negative — the prose writes a Unicode minus and nothing can parse it.

      Only where a source states the positions. Two points is a beginning and an end and not a
      claim about the path between them; a source that gives more may write more.

      **There is deliberately no `coordinates` here.** An event that happened at one spot already
      reaches it through `occurred-at` or `occurred-in`, and a second copy on the event is a copy
      that can disagree with the first. The two happenings in this corpus that state their own
      geometry state a *track* — and the midpoint of a seventeen-mile tornado is the invented
      centroid `a-derived-placement-is-a-claim` refuses, not a position anybody recorded.

      Claim-tagged in the prose that states it, the way `place.centroid` and `site.coordinates`
      are, so the value stays parseable.
  - name: reported_positions
    type: string
    description: |
      The positions a source states for a happening that did not move along a line, as
      "latitude, longitude" points separated by semicolons, in the source's own order and
      asserting nothing by it: `40.87, -83.88; 40.90, -83.88; 40.92, -83.95`. Same format as
      `track` and deliberately a different field, because `track` says "in the order it passed
      them" and this says only "here is where the source put its marks".

      **It is not an extent, and the name says so on purpose.** These are the places reports came
      from. In this county's storm record the six events carrying more than two positions spread
      between 0.64 and 30.71 kilometres apart, and a convex hull over them would range from 0.13
      to 377.54 square kilometres — a factor of two thousand nine hundred between events of the
      same type, from four reports each. That is a fact about who telephoned a forecast office,
      not about how much ground was under water. See
      `positions-bound-the-reports-not-the-water`.

      **So no area, centroid, hull or bounding box may be derived from it**, and a figure drawing
      it draws marks and no connector. `a-derived-placement-is-a-claim` refuses the invented
      middle; this refuses the invented edge.

      Claim-tagged in the prose that states it, like `track`.
edges:
  - relationship: occurred-in
    target: place
    direction: out
    description: The named place where it happened.
  - relationship: occurred-at
    target: site
    direction: out
    description: The built work where it happened.
  - relationship: involved
    target: person
    direction: out
    description: An individual who took part.
  - relationship: involved
    target: organization
    direction: out
    description: A collective actor that took part.
  - relationship: situated-in
    target: period
    direction: out
    description: The named span this happening belongs to.
