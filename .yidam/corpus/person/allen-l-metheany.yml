class: person
label: Allen L. Metheany
description: |
  Mayor of Lima in March 1944, and dead before the end of that August. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md); see
  [the mayors named inside the gap](../measure/lima-mayors-1939-1956.yml).

  **The one act of his mayoralty this corpus holds is a fire budget.** "Two 20-year-old pieces of
  fire apparatus will be replaced as soon as new equipment can be obtained, Mayor A. L. Metheany of
  Lima announced after City Council appropriated $10,000 for that purpose. One fire station has been
  closed." [verified] — same source, 2 March 1944.

  **The evidence that he died in office is a probate inventory.** "Allen L. Metheany, late mayor of
  Lima, left an estate worth $42,797.51, according to the inventory and appraisement filed in the
  Allen county probate court by Mrs. Emma H. Metheany, administratrix" — $900 in personal property,
  $23,019.67 in stocks and bonds, $15,377.84 in accounts and debts receivable. [verified] — same
  source, 31 August 1944. The three parts sum to $39,297.51, which is $3,500 short of the total the
  paper prints, so one component of the inventory is not in the story. [inference] — computed here.

  **A man of the same surname was mayor of the same town seventy years earlier.** See
  [Richard Metheany](richard-metheany.yml), mayor of Lima 1870 to 1873, whose node already carries
  an open question about a second Metheany in Lima's government. Whether the three are one family is
  not established by a shared surname. [open]

  [open] His dates, when he took office, whether he was elected in November 1943 or arrived some
  other way, and who finished his term. The corpus holds a mayor in March and a widow in August.
