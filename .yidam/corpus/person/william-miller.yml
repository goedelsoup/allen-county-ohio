class: person
label: William Miller
description: |
  Sheriff of Allen County, 1873–1877. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **He came from Germany at fifteen, learned to butcher in Cincinnati, and was elected sheriff
  from behind the counter of his own shop.** Born 27 March 1831 in Germany, son of Charles G. and
  Mary E. (Hofferbert) Miller; one of six of their eleven children to reach America; came with his
  brothers Michael and Jacob at fifteen; reached Lima in 1848, went to Cincinnati for the trade,
  and returned to Lima in 1860. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical
  half, read in both scans.

  **The sketch names the office and the roster's years.** "He was elected councilman, serving
  three terms, and in 1873 was elected sheriff, which office he filled four years" — against a
  roster line of 1873 to 1877. [verified] — the same source. In a county history full of Millers
  that sentence is the whole of the identification; see
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  **He is the only holder of this office the corpus can place outside the United States.**
  [inference] — computed against the three other sheriffs whose birthplaces are recorded here,
  born in Auglaize County, in Belmont County and at Spencerville. Thirty-four of the thirty-eight
  are unplaced, so this is one sheriff and not a pattern.

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge
  to Allen County is a legal inference rather than a fact the roster states. [inference]
properties:
