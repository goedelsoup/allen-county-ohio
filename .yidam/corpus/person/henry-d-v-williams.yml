class: person
label: Henry D. V. Williams
description: |
  The first mayor of Lima, elected when the town organized on 29 March 1842. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), whose chapter summary
  names "Henry D. V. Williams, the First Mayor", and
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md); see
  [the organization](../event/organization-of-the-town-of-lima-1842.yml).

  **The corpus recorded his initial as V before it could say why.**
  [The corporation](../jurisdiction/city-of-lima.yml) has read V since the settlements phase, from a
  book whose two scans disagree with themselves about it: scan A gives "H. D. Y. Williams" where the
  town is organized and "H. D. V. Williams" elsewhere, and scan B does the reverse. The two-scan
  rule has nothing to decide between. What settles it is the 1906 history, a different author
  through a different pipeline, which gives **V** and gives the first name. [verified] See
  [three witnesses and three dates](../../decisions/three-witnesses-and-three-dates.yml).

  **He kept a diary and a later historian had it.** The 1906 book quotes an entry of 10 January
  1843 describing a neighbour's wedding, and calls him "our first mayor and a royal gentleman of the
  old school". [verified] — same source. It is the only voice of a Lima officeholder this corpus
  holds from before the twentieth century.

  [open] His dates, his origins and everything he did in the office. The corpus holds a name, a
  year, one diary entry and an epithet.

  Ohio requires an elected municipal officer to be an elector of the municipality, so a
  `resided-in` edge to Lima is a legal inference rather than a fact either source states.
  [inference]

  **He was born at Pompey in New York on 13 September 1804 and graduated from Williams College with
  first honours.** He married Cornelia Estelle Hill of Hillsdale, New York, on 12 October 1825, came
  to Ohio in 1834, joined General Blackburn in the United States Land Office at Wapakoneta the next
  year, and came to Lima in June of that year when the office moved here. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), its biographical
  half, read in both scans.

  **He was county auditor before he was mayor, and a colonel of militia.** Elected auditor in 1838
  and serving to 1841; at one time a justice of the peace; commissioned colonel of the first militia
  regiment. [verified] — the same source. The 1885 book has him elected the town's first mayor on
  29 March 1842; see [the line of mayors](../measure/lima-mayors-1842-1886.yml).

  **The 1906 book dates his family's arrival to a year he was not in Ohio, and both scans agree on
  it.** "In 1826 he was joined by his family, which consisted of his wife and daughter, Henrietta
  C., who came to Toledo by boat and from there to Lima by wagon, through the Black Swamp." He
  married in 1825 and reached Ohio in 1834. [verified] — the same source, both scans. Two scans
  agreeing means the print says it, which is all a second scan was ever meant to buy; the corpus
  takes the birthday from this paragraph and not the arrival. [inference] — see
  [two scans of one book](../../decisions/two-scans-of-one-book.yml).

