class: person
label: Christopher Wood
description: |
  The man who located Allen County's seat of justice and platted the town on it. Born 1769, died
  at Lima in 1856. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans agreeing on
  both years.

  A Kentuckian, a scout in the American service from 1790 to 1794 and a soldier of the War of
  1812-15, he came into this county in 1824 with his sons Joseph and Albert G. and his son-in-law
  Benjamin Dolph — seven years before there was a county government to come into. [verified] —
  same source.

  **He holds three of the county's first offices and each is a different kind of first.** In 1829
  the legislature named him, with Justin Hamilton of Mercer and Adam Barber of Putnam, to a board
  of commissioners to locate the seat of justice for each of their counties; that board's work is
  what [the organization of 1831](../question/when-allen-county-was-organized.yml) followed from.
  In 1831 he was appointed an associate judge of common pleas, and director of the town of
  [Lima](../place/lima.yml) for the sale of lots. [verified] — same source. He was also a justice
  of [Bath Township](../place/bath-township.yml) when it "had civil jurisdiction over nearly all
  Allen County". [verified] — same source.

  **He is in this corpus because of what the `person` class had become.** Of its forty-two people,
  thirty-eight come from a single sheriff's roster retrieved in one phase, and the other three are
  a locomotive inventor, an oil man and a contested namesake. Nine names in ten being one office's
  holders is a class shaped by which list happened to be machine-readable, not by who mattered
  here. The man who chose where the county seat would go was not in it. See [the corpus had a federal bias](../../decisions/the-corpus-had-a-federal-bias.yml)
  for the same failure in a different class.

  [open] His arrival year is given as 1824 in the pioneer list and his first office in 1829, but
  nothing here says where in the county he lived before Lima existed, and the book's biography
  chapter for him has not been read against the pioneer list.
