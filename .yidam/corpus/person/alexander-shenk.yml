class: person
label: Alexander Shenk
description: |
  County commissioner from 1884 to 1886, and the only man in seventy-five years of that roster whose
  arrival the book stops to explain.

  **He entered in place of Charles C. Marshall.** The 1906 history's board for 1884 reads "Joseph A.
  States, Alexander Shenk (vice Marshall) and Abraham Crider" — the parenthesis is the book's, and
  it is the only one in the whole seventy-five-year list. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md); see
  [the tenure](../tenure/commissioner-1884-alexander-shenk.yml).

  **His name is second in that row and it should not be.** In every other year with a new
  commissioner the new man is written first, fifty times out of fifty-two; the two exceptions are
  this row and the row after the book's missing year. He was not elected that autumn, so the column
  that names the year's incoming commissioner had nobody to name. [inference] —
  [the board of 1831–1920](../measure/allen-county-commissioners-1831-1920.yml).

  **He was born in Prussia and came to Delphos at eleven.** Born at Heckingen in Hohenzollern,
  Prussia, on 19 July 1842; his father Martin Shenk, a merchant tailor there, brought the family to
  this country in 1852 and settled at Delphos on 8 October 1853. He went into the drug business
  with J. W. Hunt, bought a drug business of his own at nineteen, and left it for flour milling.
  [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical
  half, read in both scans.

  **The sketch names this office, which is how it comes to be on this node.** It heads him
  `ALEXANDER SHENK, commissioner of Allen County, Delphos` and lists the rest — member of the city
  council, treasurer and clerk of Marion Township — in the same sentence. [verified] — the same
  source. See
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  **It is dated 1885 and gives him the county office, which the 1906 roster puts at 1884 to 1886.**
  The sketch was written while he held it. [inference] — the two sources compared.

  **The 1921 history calls him Albert.** Its undated roster of commissioners has "Albert Shenk"
  between C. C. Marshall and John Ackerman — the same position in the same sequence, and a different
  given name. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). The corpus
  takes the 1906 form, which is the dated one and the one that gives him three separate years.
  [inference]

  [open] Which given name is right, and when he died. The 1885 book gives his birth and the
  county histories give no death for a man who was forty-three when the first of them was printed;
  a third witness on the county's commissioners has not been found.
