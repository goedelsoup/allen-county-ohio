class: person
label: Benjamin C. Faurot
description: |
  The Lima businessman whose drilling produced the 1885 strike that opened the Lima oil field.
  [inference] He was drilling for natural gas, on the pattern of the Findlay gas boom to the
  north, and struck oil instead. [inference]

  He is in the corpus as the individual the county's industrial history most directly turns
  on, and as a caution: the single-figure account of a discovery is the form local history
  most reliably takes and least reliably supports. What is defensible is that a well he
  financed produced the strike. Whether he is best described as its discoverer is a stronger
  claim and is not made here.

  **His other business interests are now on record, and they are most of industrial Lima.**
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), printed the year of the strike and therefore describing him entirely as he
  was before it:

      Lima Paper-Mills Company    organized 1870 with four others; Faurot later bought
                                  the whole of it, in straw-board paper
      Globe Machine Works         organized early 1882, $50,000 capital, Faurot president;
                                  stationary and portable engines, at Main and Elm
      Lima National Bank          president, at the election of January 1885
      Faurot's Opera House        conceived 1879, begun 2 May 1881, at Main and High;
                                  plans by Oscar Cobb of Chicago; 1,400 seats

  A biography of another man calls him, in passing, "a banker and proprietor of the opera house".
  He was Lima's principal capitalist a year before the oil, and the book lists his opera house among
  the city's six principal buildings — beside the courthouse and four churches — on that basis
  alone.

  **The paper mill matters to the received account.** A straw-board works is a fuel-hungry industry;
  his daughter Carrie married the secretary of the Lima Gaslight Company on January 7, 1885; and the
  same volume records gas shows across the county as an undeveloped prospect. [verified] — same
  source. That is the setting the drilling story requires, established independently of the story.

  **The family is fifty years older than the oil.** Silas Faurot was a Jackson Township settler by
  1832 and a justice of the peace solemnizing marriages through the 1830s. [verified] — same source.
  [open] His relation to B. C. Faurot is not stated.

  **The well is now on record and so is why he drilled it.** It was completed May 9, 1885 on the
  grounds of his own Lima Straw Board Works, by the contractors Brownyear and Martin, for a double
  purpose: better process water, and the natural gas that Findlay and Bowling Green had just found.
  [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). The corpus's `[inference]` that he was drilling for gas is verified, and gains a
  first motive nobody retells — he wanted water.

  A second historian adds that he had "acquired the ownership of the city's first street railway —
  then a horse-car line — and secured the exclusive control of the Lima Strawboard Company", and was
  president of the Strawboard Association of the United States. [verified] — same source. And of the
  strike itself: "It was not a great success in itself but it was the pioneer stake in an industry
  that has produced millions for Allen County." [verified] — same source. The well that carries his
  name broke; [the second one](../event/lima-oil-strike.yml) made the field.

  **He was building a railroad two years after the well.** The Columbus, Lima & Milwaukee Railway
  was commenced in 1887 by Faurot; by 1906, after "various stages of litigation and contest", it was
  operating as the Columbus & Lake Michigan between Lima and Defiance, through Ottawa, German and
  Sugar Creek townships, with its main offices in Lima. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md); see
  [the network](../measure/allen-county-railroads-1883-1921.yml). The 1906 book calls him "the
  late" and the road unfinished, so both the man and the line outran their own beginnings.
  [inference]

  **He held office in Lima eighteen years before the well.** Benjamin C. Faurot was elected a
  village trustee in 1867, alongside James H. Corns, Uriah Pangle, J. R. Hughes and C. D. Robbins,
  under Mayor John Collett. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md); see
  [the line of mayors](../measure/lima-mayors-1842-1886.yml), which prints the council beside the
  mayor for every year from 1842. It is the earliest dated fact this corpus holds about him.
  [inference]

  [open] His dates.

  **He was leasing ground in the county four months after the strike.** An oil lease over part of
  the north-west quarter of section 17 in Bath Township ran to "B. C. Faurot et al", dated
  29 September 1885 and recorded 30 April 1886; it was later released. [verified] —
  [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md), volume 0028A
  page 164. It is the only record this corpus holds of him acting outside the city, and the only
  one of his dealings it has from a land record rather than from a county history.

