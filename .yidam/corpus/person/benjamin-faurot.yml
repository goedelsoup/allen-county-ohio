class: person
label: Benjamin C. Faurot
description: |
  The Lima businessman whose drilling produced the 1885 strike that opened the Lima oil field.
  [inference] He was drilling for natural gas, on the pattern of the Findlay gas boom to the
  north, and struck oil instead. [inference]

  He is in the corpus as the individual the county's industrial history most directly turns
  on, and as a caution: the single-figure account of a discovery is the form local history
  most reliably takes and least reliably supports. What is defensible is that a well he
  financed produced the strike. Whether he is best described as its discoverer is a stronger
  claim and is not made here.

  **His other business interests are now on record, and they are most of industrial Lima.**
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), printed the year of the strike and therefore describing him entirely as he
  was before it:

      Lima Paper-Mills Company    organized 1870 with four others; Faurot later bought
                                  the whole of it, in straw-board paper
      Globe Machine Works         organized early 1882, $50,000 capital, Faurot president;
                                  stationary and portable engines, at Main and Elm
      Lima National Bank          president, at the election of January 1885
      Faurot's Opera House        conceived 1879, begun 2 May 1881, at Main and High;
                                  plans by Oscar Cobb of Chicago; 1,400 seats

  A biography of another man calls him, in passing, "a banker and proprietor of the opera house".
  He was Lima's principal capitalist a year before the oil, and the book lists his opera house among
  the city's six principal buildings — beside the courthouse and four churches — on that basis
  alone.

  **The paper mill matters to the received account.** A straw-board works is a fuel-hungry industry;
  his daughter Carrie married the secretary of the Lima Gaslight Company on January 7, 1885; and the
  same volume records gas shows across the county as an undeveloped prospect. [verified] — same
  source. That is the setting the drilling story requires, established independently of the story.

  **The family is fifty years older than the oil.** Silas Faurot was a Jackson Township settler by
  1832 and a justice of the peace solemnizing marriages through the 1830s. [verified] — same source.
  [open] His relation to B. C. Faurot is not stated.

  [open] His dates, and the precise date and location of the well.
