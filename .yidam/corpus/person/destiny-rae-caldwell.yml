  Prosecuting Attorney of Allen County, holding a term that began 2025-01-06. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  The prosecutor's own site gives the name as "Destiny R. Caldwell"; the elections roster gives
  "Destiny Rae Caldwell".

  **Admitted to the practice of law in Ohio by examination on 17 November 2008, registration number
  83779.** [verified] —
  [the attorney directory](../../catalog/ohio-attorney-directory.md), which returns exactly one
  Destiny Caldwell in the state, with an Allen County address of record and an active status. The
  office is one the corpus holds a statutory qualification for; this is the first holder of it
  whose qualification is dated. [inference]

  The elections roster gives a name, a party and two dates, so this node carries no date of birth,
  no biography and no prior office. Ohio requires an elected county officer to be an elector of the
  county, so the `resided-in` edge below is a legal inference rather than a fact any source states.
  [inference]
