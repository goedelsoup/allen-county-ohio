class: person
label: Dr. Samuel A. Baxter
description: |
  The surgeon of the 18th Ohio, president of the First National Bank, mayor of Lima in 1896, and
  one of the two men whose names are on the county's 1906 history. He is the third son of
  [Samuel A. Baxter](samuel-a-baxter.yml), and for most of this corpus's life he and his father
  were one node.

  **The 1885 history describes him inside his father's sketch, which is how these books work.** "S.
  A. Baxter, the third son, began the study of medicine under Dr. William H. Harper, of Lima, which
  he completed with Dr. J. Dawson of Columbus, Ohio. He graduated at Cincinnati College, and began
  the practice of his profession in the army, in 1863, in the Eighteenth Ohio Volunteer Infantry,
  where he remained until the close of the war. He then returned to Lima and after practicing for
  five years, retired from the profession to become the president of the First National Bank, a
  position he still fills." [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical half,
  read in both scans. His father's sketch is headed and his is not, because his father was dead and
  he was the subscriber. [inference] — see
  [what a paid sketch may be quoted for](../../decisions/what-a-paid-sketch-may-be-quoted-for.yml).

  **The county's war roster line is his.** "Baxter, S. A. Surgeon 18th O. V. I., March 13, 1863,
  Nov. 11, 1865" — two years and eight months, and one of four surgeons the roster of field officers
  names. [verified] — the same source, its military chapter; see
  [what the county sent](../measure/allen-county-civil-war-service.yml). The 1885 sketch's "in 1863"
  and the roster's 13 March 1863 are the same enlistment. [inference] — the two passages compared.

  **He was mayor of Lima from April 1896 to April 1898.** [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), its list of mayors,
  which prints him as "Dr. Samuel A. Baxter" and his father forty-five years earlier as "Samuel A.
  Baxter, Sr."; see [the line of mayors](../measure/lima-mayors-1886-1922.yml).

  **He is a co-author of one of this corpus's three county histories.** The 1906 title page gives
  Charles C. Miller and Dr. Samuel A. Baxter, "both of Lima", and the 1921 history says Baxter
  "contributed a number of reminiscent chapters". [verified] — the 1906 history and
  [the 1921 history](../../catalog/rusler-allen-county-1921.md). The consequence the corpus has
  leaned on holds and now stands on a date: **the geology chapter's technical account of the first
  oil well was written by men who were in the town when it was drilled**, and this one was a
  practising physician in it from about 1870 and its mayor eleven years after the well. [inference]
  — computed from the dates above; see [the oil strike](../event/lima-oil-strike.yml).

  **He also organised Lima's police force.** The 1906 book, describing the department, credits "Dr.
  Samuel A. Baxter, who first organized and systematized the force". [verified] — the same source.

  **This node exists because a birth date arrived.** Until it did, one node carried a mayor of 1851,
  a surgeon of 1863 and an author of 1906 as one man, with an `[open]` block saying a birth year
  for either would settle it. The 1885 book gave the father's — 26 September 1807 — and a man who
  was dead before 1885 was not writing in 1906. [inference] — see
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  [open] When he was born and when he died. The 1885 sketch gives his marriage in 1866 to Deborah,
  daughter of W. P. Ellison of Chicago, and three sons — Frank, Don and Clem — and no date for him
  at all. He is the case the subscription books cannot answer: he bought the page, and a man
  writing about himself gave his father's birthday and not his own.
properties:
  occupation: physician, banker, mayor of Lima, historian
  also_known_as: |
    S. A. Baxter, in the 1885 history and in the county's Civil War roster. [verified]
