class: person
label: Samuel Forrer
description: |
  The engineer who located the Miami and Erie Canal, and who spent the last forty years of his life
  in the county it runs through. Died at [Delphos](../place/delphos.yml) in 1874. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  He surveyed the Shelby Canal in 1824, was connected with the canal surveys from July 1825 to 1831
  and **located the Miami & Erie**, was appointed canal commissioner in 1832, and was elected to
  the newly organized Board of Public Works in 1835. In 1871, at seventy-eight, he still held the
  post of consulting engineer for the canal he had laid out. [verified] — same source.

  **He is also a pioneer of [Marion Township](../place/marion-township.yml)**, which the 1885
  compiler says of him plainly: he purchased land on Sections 20 and 18 in 1834 and ultimately
  settled there, making Delphos his home. [verified] — same source. The man who chose where the
  canal would run then lived on it.

  **His board is the county's other canal name.** The State Board of Public Works he joined in 1835
  is the body Col. Spencer sat on in 1848 — the man
  [Spencer Township](../place/spencer-township.yml) and, at one remove,
  [Spencerville](../place/spencerville.yml) are named for. [verified] — same source. Two of the
  four things in this county named or placed by the canal trace to one board.

  [open] His birth date and birthplace, his part in the canal's construction as against its
  location, and whether the Delphos years were active or retired. The book treats him as a figure
  already known to its readers and gives him no biography of his own.
