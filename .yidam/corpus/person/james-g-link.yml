label: James G. Link
description: |
  Clerk of the lima municipal court, seated in 2026. [verified] — [the elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  He is a Republican, and one of only three holders on any Lima-seated ballot who carries a party
  letter — the other two are the court's two judges. The city's own eleven offices carry none.
  [verified]

  The roster gives a name, a term and nothing else. This node carries no date of birth, no
  biography and no earlier office. [open]

  Ohio requires an elected officer of a municipal court to be an elector of its territory, so the `resided-in` edge below is a legal inference rather than a fact any source read
  here states. [inference]
