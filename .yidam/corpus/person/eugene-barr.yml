class: person
label: Eugene Barr
description: |
  Sheriff of Allen County, 1902–1906. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **He was a physician for fifteen years before he was sheriff, and a bottler and a lumberman
  while he was.** Born in Auglaize County, Ohio, on 21 September 1857, son of Dr. Tobias and
  Margaret (Weaver) Barr; schooled in Clark County and at Lebanon; a schoolteacher through Clark
  and Champaign counties; graduated from the Medical College of Ohio at Cincinnati on 3 March
  1880; settled in Allen County in 1885 and practised until 1895, when he went into oil and
  timber. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), its biographical
  half, read in both scans.

  **The sketch names the office, which is why it is on this node.** It has him "efficiently
  serving his second term as sheriff of Allen County", elected to the first in 1901 against
  William McComb and re-elected in 1903 — a year earlier at each end than the roster's 1902 to
  1906, which is the distance between a November election and a term beginning in January.
  [verified] — the same source. See
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  **The book has him managing a soft-drink works while holding the office.** In the same paragraph
  as his second term it gives him the management of the Consolidated Bottling Company of Lima,
  manufacturers of soft drinks, and an office in the Ohio Hardwood Lumber Company. [verified] —
  the same source, the same sketch. Nothing held here says whether that was remarked on at the
  time. [inference]

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge
  to Allen County is a legal inference rather than a fact the roster states. [inference]
properties:
