  died: "1898-12-15"
  birthplace: |
    Denmark, Ohio; the family removed to Columbus Grove in Putnam County in 1848. [verified]
  occupation: railroad promoter, lawyer, United States Senator
  also_known_as: Calvin Stewart Brice, in the 1906 history. [verified]
