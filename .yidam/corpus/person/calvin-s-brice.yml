class: person
label: Calvin S. Brice
description: |
  The only United States Senator this county has sent to Washington, and the reason a railroad
  already in this corpus leaves it at Bluffton.

  **He served one term, 7 December 1891 to 3 March 1897, as a Democrat.** [verified] —
  [the congress-legislators file](../../catalog/congress-legislators.md), which gives his birthday as
  17 September 1845. The 1906 county history gives the same date and the town, "born at Denmark,
  Ohio, on September 17, 1845" — an independent agreement between a federal record and a county
  book, which this corpus has not had before on any person. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **He came to Lima out of the war and worked in the county auditor's office.** Graduated from
  Miami University in June 1863; taught in the Lima public schools; captain of Company E, 180th Ohio
  Volunteer Infantry from July 1864; law at Michigan; admitted in 1866 and in partnership with James
  Irvine at Lima. [verified] — same source. See [the county auditor](../office/allen-county-auditor.yml).

  **His first railroad was the one this county voted bonds for.** "His first railroad connection was
  with the legal department of the old Lake Erie & Louisville road. He became a stockholder in that
  road (now known as the Lake Erie & Western) ... next undertaking the great 'Nickel Plate'
  enterprise". [verified] — same source. The Lake Erie & Louisville is one of the two lines Lima and
  Ottawa Township approved $100,000 of bonds for at the special election of 25 May 1872, with eight
  votes against. See [the county's railroads](../measure/allen-county-railroads-1883-1921.yml).

  **He bought the Northern Ohio because it ran past the farm he grew up on.** The road from Delphos
  to Akron "was bought by Senator Calvin S. Brice largely for its future possibilities, but more
  directly from the fact that the road passes through his boyhood home, the old farm near Columbus
  Grove". [verified] — same source. At his death he had "quite fully matured plans for a seaboard
  out-let for the Lake Erie & Western Railroad, diverging at Bluffton over the Northern Ohio, via
  Akron and Youngstown to the East". [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), which tells
  the same story in the same words. Delphos still had a terminal on the Northern Ohio in 1921.

  **The federal building in Lima is his.** The post office completed in 1895 at a cost of $40,000
  "was secured for Lima at the expense of the national government through the efforts of Senator
  Calvin S. Brice". [verified] — the 1906 history. It is the only act of his in Congress either book
  attributes to him.

  [open] When he died. The 1906 book calls him "the late", prints a plate captioned "Scene at the
  funeral of Hon. Calvin S. Brice", and gives no date; the federal file carries no date of death for
  anyone. His Senate term ended in March 1897 and the book was printed in 1906, and nothing held here
  narrows it further.
properties:
  born: "1845-09-17"
  birthplace: |
    Denmark, Ohio; the family removed to Columbus Grove in Putnam County in 1848. [verified]
  occupation: railroad promoter, lawyer, United States Senator
