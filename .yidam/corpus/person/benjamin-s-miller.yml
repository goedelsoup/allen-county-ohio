class: person
label: Benjamin S. Miller
description: |
  Sheriff of Allen County, 1929–1931. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **Neither county history can reach him and both were searched anyway.** He took office in 1929,
  eight years after the last of the three narrative histories in this corpus. The 1885 book's
  `B. MILLER` is John B. Miller, a Bath Township farmer born in Rockingham County, Virginia, in
  1818; the 1906 book's is L. B. Miller of the Harrod Creamery, born in York County, Pennsylvania,
  in 1864. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), both scans of each.
  Neither is this man and neither could be; see
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  The roster gives a name and a year range and nothing else, so this node carries no dates of birth
  or death and no biography.

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge
  to Allen County is a legal inference rather than a fact the roster states. [inference]
