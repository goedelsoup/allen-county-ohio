class: person
label: William Akerman
description: |
  The longest-serving Allen County commissioner of the county's first seventy-five years, and he did
  it in two goes nineteen years apart.

  **He is in twelve of the seventy-five printed boards — 1847 to 1852, and 1871 to 1876.** No other
  man in that list is in more than seven. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), counted row by row; see
  [the board of 1831–1920](../measure/allen-county-commissioners-1831-1920.yml).

  **Both spells are regular and that is what makes them readable.** Each is six consecutive rows and
  each begins with his name in first place, which in that roster means the commissioner elected that
  year. Nothing about either entry or either exit breaks the list's shape, so neither is a tenure
  node under
  [a table is the line and a tenure is the turn](../../decisions/a-table-is-the-line-and-a-tenure-is-the-turn.yml).
  [inference]

  **He was president of the board four times.** The first column also names the presiding
  commissioner in years when the board did not change, and it fell to him in 1850, 1874 — and to his
  entering self in 1847 and 1871. [inference] — the same series; see the roster's two conventions.

  **A John Akerman is on the same board forty years later**, in 1887, 1888 and 1890 to 1892, and the
  1921 history spells both men Ackerman. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). The corpus
  holds no relation between them.

  [open] His dates of birth and death, and whether the nineteen-year gap is one man returning or two
  men of one name. Twelve rows across thirty years is a long career for a nineteenth-century county
  office and the roster gives no other identifier than the name.
  **He was born in Cumberland County, Pennsylvania, on 17 April 1810, and he has no sketch of his
  own.** His life is inside one headed `JOHN AKERMAN, farmer, P. O. Herring` — his son's. He came
  to Perry County, Ohio, with his parents at five, moved on to Morgan County at his majority, came
  to this county in 1834 and entered 120 acres of wild land, added to it, and owned 254 acres when
  he died on 9 October 1878. He married Kezia Carroll on 9 May 1833 and they had thirteen children.
  [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical half,
  read in both scans.

  **The sketch names the office and counts it the way this corpus counts it.** "He held several
  offices of trust in the township and filled the office of county commissioner four full terms."
  [verified] — the same source. Four terms of three years is twelve of the seventy-five printed
  boards, which is what the 1906 roster gives him. [inference] — the two sources compared; see
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  **He is the corpus's clearest case of the subscription book's shape.** He is dead, so the sketch
  gives him a death date; he is dead, so the sketch is not his. The living son bought the page and
  the father is on it because of the relation. [inference] — see
  [what a paid sketch may be quoted for](../../decisions/what-a-paid-sketch-may-be-quoted-for.yml).

  **The two scans put his marriage five years apart and neither reading changes anything else.**
  Scan B marries him in May 1833 and scan A in May 1838, in the same typeface that turns 1835 into
  1885 elsewhere in the book. [verified] — the two scans. The corpus records neither, because the
  marriage answers no question it is asking.

