class: person
label: William Akerman
description: |
  The longest-serving Allen County commissioner of the county's first seventy-five years, and he did
  it in two goes nineteen years apart.

  **He is in twelve of the seventy-five printed boards — 1847 to 1852, and 1871 to 1876.** No other
  man in that list is in more than seven. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), counted row by row; see
  [the board of 1831–1920](../measure/allen-county-commissioners-1831-1920.yml).

  **Both spells are regular and that is what makes them readable.** Each is six consecutive rows and
  each begins with his name in first place, which in that roster means the commissioner elected that
  year. Nothing about either entry or either exit breaks the list's shape, so neither is a tenure
  node under
  [a table is the line and a tenure is the turn](../../decisions/a-table-is-the-line-and-a-tenure-is-the-turn.yml).
  [inference]

  **He was president of the board four times.** The first column also names the presiding
  commissioner in years when the board did not change, and it fell to him in 1850, 1874 — and to his
  entering self in 1847 and 1871. [inference] — the same series; see the roster's two conventions.

  **A John Akerman is on the same board forty years later**, in 1887, 1888 and 1890 to 1892, and the
  1921 history spells both men Ackerman. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). The corpus
  holds no relation between them.

  [open] His dates of birth and death, and whether the nineteen-year gap is one man returning or two
  men of one name. Twelve rows across thirty years is a long career for a nineteenth-century county
  office and the roster gives no other identifier than the name.
