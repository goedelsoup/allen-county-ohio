class: person
label: William L. Ferguson
description: |
  Mayor of Lima in May, July, August and September of 1945. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md); see
  [the mayors named inside the gap](../measure/lima-mayors-1939-1956.yml). The paper renders him
  William L., W. L. and W. I. Ferguson in three different issues.

  He holds the office after [Allen L. Metheany](allen-l-metheany.yml) died in it, and the corpus
  does not know by what route: no source here says he was elected to it, appointed to it, or
  succeeded to it. [open]

  **His own fire bureau shut the room his council meets in.** He established a fire prevention
  bureau early in 1945, after the Milner Hotel fire that killed two people. Its chief then served an
  order of the mayor's "banning public meetings on the third floor of City Mall until certain
  conditions are corrected. City Council chambers are on that floor." [verified] — same source,
  19 July 1945, under the headline "Fire Prevention Order Backfires At Lima".

  **He stood for re-election in a non-partisan primary and drew the county's outgoing sheriff.**
  "W. L. Ferguson, incumbent, and William V. Daley will be the candidates for mayor of Lima ... Only
  6,160 voters went to the polls." [verified] — same source, 9 August 1945. A
  [William V. Daley](william-v-daley.yml) was Sheriff of Allen County until that same year; whether
  the candidate and the sheriff are one man is a match on a name and nothing else. [open]

  **He is the reason this corpus knows what happens when Lima's mayor is away.** "Emil Kempf,
  former Bluffton boy is mayor of Lima this week. As president of the Lima council he becomes head
  of that city's government during the absence of Mayor William Ferguson who is away on a week's
  vacation." [verified] — same source, 13 September 1945.

  [open] Whether he won in November 1945, when he took office after Metheany's death, and by what
  route. His dates and everything about him but four days in 1945.
