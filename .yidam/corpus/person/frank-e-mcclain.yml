class: person
label: Frank E. McClain
description: |
  Mayor of Lima, in office from November 1939 and still in office in November 1943. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md); see
  [the mayors named inside the gap](../measure/lima-mayors-1939-1956.yml). He is the first holder of
  [that office](../office/mayor-of-lima.yml) this corpus can name between 1922 and 2021.

  **He arrived cutting.** "Mayor Frank McClain of Lima last week swung the economy ax 48 hours
  after taking office, when he chopped 12 street department workers from the city pay roll."
  [verified] — same source, 23 November 1939.

  **He ran the police chief's appointment through the charter rather than around it.** In February
  1940 he called the city civil service commission to hold a competitive promotional examination
  for a post then held by an acting chief, "under provisions of the City Charter and Ohio civil
  service laws", citing an informal opinion of the Attorney General that the chief's post is in the
  classified service. [verified] — same source. Three years later he appointed a chief outright,
  after the sitting one resigned and was restored to his former rank of sergeant. [verified] —
  same source, 4 November 1943. The corpus does not reconcile the two and does not hold the charter.
  [open]

  **His re-election in 1941 is the only Lima election this corpus can price.** He filed election
  expenses of $306.40 with the Allen County board of elections; Bluffton's mayor filed $6.39 for
  his. [verified] — same source, 20 November 1941. The paper printed the two side by side because
  the difference was the story.

  **He left the office and stayed in politics.** By October 1948 he was advertising in this same
  paper as "Former Mayor of Lima, Ohio, Republican Candidate For County Commissioner". [verified] —
  same source. Lima's mayoralty was non-partisan by 1945 and the county commission was not.

  [open] When he took office to the day, when he left it, whether he served two terms or three, and
  whether he won the commissioner's seat in 1948. His dates, his occupation before the mayoralty
  and everything else about him. This node is built from six mentions in a weekly published in
  another town.
