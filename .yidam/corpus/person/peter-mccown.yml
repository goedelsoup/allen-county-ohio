class: person
label: Peter McCown
description: |
  A retired United States Army captain living in Lima, and the only Black resident of Allen County
  any source in this corpus names before the present century. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **He was at San Juan Hill.** "Capt. Peter McCown is a retired army officer. As a soldier in the
  standing army, Captain McCown was at San Juan Hill with Theodore Roosevelt and his Roughriders in
  the Spanish-American war." [verified] — same source. The corpus holds a Spanish-American War
  company raised in Lima and does not know whether he was in it. [open]

  **He was offered the American ministership to Liberia and refused it.** "When the post of United
  States minister to Liberia was tendered him in reward for his political zeal, Captain McCown"
  declined "with thanks, preferring the quiet life vouchsafed to him in Lima as a ward of the United
  States Government." [verified] — same source, which does not say by which administration or in
  which year. [open]

  **The book gives him the last word in its account of the county's Black community.** "In reviewing
  the history of the race, Captain McCown said that in the sixty years the negro had enjoyed his
  freedom, he had made rapid advancement in civilization. While some trust wholly in the Lord,
  others are inclined to take care of themselves and to work out their own destiny." [verified] —
  same source, quoted as printed. Sixty years from 1921 is 1861, so his reckoning starts with the
  war and not with the Proclamation or the Thirteenth Amendment. [inference]

  [open] His dates of birth and death, his regiment, and whether "a ward of the United States
  Government" means a pension, a disability, or something the book expected its readers to
  understand without explanation.
