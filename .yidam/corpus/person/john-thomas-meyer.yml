class: person
label: John Thomas Meyer
description: |
  Coroner of Allen County, holding a term that began 2025-01-06. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  A physician, styled "DO DC" by the county — an osteopathic physician and a chiropractor.
  [verified] — [the county's site](../../catalog/allen-county-official-site.md). Ohio requires a county coroner to be a licensed physician in good standing, so
  the first of those credentials is a qualification for the office and the second is not.
  [verified] — [Ohio Revised Code §313.02](../../catalog/ohio-revised-code.md).

  The elections roster gives a name, a party and two dates, so this node carries no date of birth,
  no biography and no prior office. Ohio requires an elected county officer to be an elector of the
  county, so the `resided-in` edge below is a legal inference rather than a fact any source states.
  [inference]
