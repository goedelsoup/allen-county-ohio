class: person
label: James A. Hover
description: |
  The Shawnee Township farmer who paid $5,000 of his own money so that the refinery would be built
  in Allen County. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  In 1886 Standard Oil's siting committee — Frank Rockefeller, F. B. Squiers and Solar's attorney
  Keith — chose 151 acres of his farm, lying between the C. & E. and the L. E. & W. railroads, over
  Findlay and Toledo. He contracted to sell for $17,500. The Trenton Rock Oil Company, holding a
  drilling lease he had granted the year before, then demanded $10,000 to release it, and Rockefeller
  said he would not see Hover held up and would go to Findlay or Toledo instead. Hover's answer, as
  the book gives it:

      I have watched Lima grow from a village of less than a dozen houses until it is now a
      city with a big future; this is the greatest thing that ever was offered us, and if I
      can prevent it it shall not get away from us; it is a great loss to me, but you shall
      have the land you require.

  He settled with the leaseholders for $5,000. Months later Rockefeller sent him a personal cheque
  for $2,500 — "you are the squarest farmer I ever did business with... I will take one-half your
  loss while you are standing the other half". [verified] — same source.

  **He is in the corpus because of what he explains.** This corpus established by coordinate, two
  phases before it had any history, that [the refinery](../site/lima-refinery.yml) stands on
  unincorporated ground in [Shawnee Township](../place/shawnee-township.yml) with a Lima postal
  address — and recorded that as a fact about tax base and authority without being able to say why.
  This is why: it was a farm, chosen in 1886 for its position between two railroads, and nothing has
  annexed it since. [inference]

  **What kind of claim this is.** The account is a story told to William Rusler by Hover's son, about
  events thirty-five years earlier, printed in quotation marks as testimony. It is the strongest
  evidence the corpus has and it is not a record: the sums are round, the dialogue is remembered, and
  the teller is the subject's child. The book cannot hold the spelling steady either, giving "Hoover"
  in one line and "Hover" in the next. See
  [a single witness read once](../../decisions/a-single-witness-read-once.yml).

  [open] His dates, whether a deed confirms the $17,500 and the 151 acres, and his relation — if any
  — to the Hovers of Shawnee Township, in whose log house
  [the township organized in 1834](../place/shawnee-township.yml).
  **He was born near Warren in Trumbull County on 1 April 1828 and came to Shawnee Township at
  five.** Son of Joseph and Caroline (Adgate) Hover, married in 1809, natives of Pennsylvania;
  Joseph settled in Trumbull County in 1802 and came here in 1833, to the farm his son was still
  on in 1885. His grandfather Manuel Hover was a captain in the Revolution. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical half,
  read in both scans.

  **He went to California in 1849 and mined for two years.** Apart from that and two years milling
  at Lima, he lived on the same farm from 1833. [verified] — the same source. That makes him the
  only person this corpus names who was in the gold rush. [inference] — computed against the
  ninety-eight people the class holds.

