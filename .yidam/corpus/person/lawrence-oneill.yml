class: person
label: Lawrence O’Neill
description: |
  Sheriff of Allen County, 1889–1893. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **A sketch fits him and does not prove he is the man.** The 1885 history carries a Lawrence
  O'Neill of Lima born 14 November 1848, son of an Irish immigrant who married Bridget Nolan in
  1845 and came to America four years later; educated at Lima; married in July 1874 to Laura,
  daughter of William Mumaugh, "an old settler of the county"; a blacksmith who learned the trade
  in the Dayton & Michigan Railroad shops; and elected marshal of the city in 1882, "which office
  he still holds". [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical
  half, read in both scans.

  **What it does not do is name this office**, because the book was printed four years before the
  county elected him. A city marshal of Lima who becomes sheriff of the county seven years later
  is an ordinary career and not a demonstrated identity, so the birth date on this node is an
  inference from a name, a town and a decade, not a fact the sketch attaches to the sheriff.
  [inference] — see
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge
  to Allen County is a legal inference rather than a fact the roster states. [inference]
properties:
  born: "1848-11-14"
  occupation: blacksmith, city marshal, then sheriff
