description: |
  Director of law of lima, seated in 2026. [verified] — [the elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  He holds the city's legal office where the county's is held by an elected prosecuting attorney;
  the two are separate offices with separate electorates and this corpus has not established which
  prosecutes what. [inference]

  **Admitted to the practice of law in Ohio by examination on 1 November 1983, registration number
  6150.** [verified] —
  [the attorney directory](../../catalog/ohio-attorney-directory.md), which returns exactly one
  Anthony Layton Geiger, with an Allen County address of record and an active status.

  The roster gives a name, a term and nothing else. This node carries no date of birth, no
  biography and no earlier office. [open]

  Ohio requires an elected municipal officer to be an elector of the municipality, so the `resided-in` edge below is a legal inference rather than a fact any source read
  here states. [inference]
