class: person
label: Matthew C. Huffman
description: |
  Member of the Ohio House of Representatives, 78th District, holding a term that began 2025-01-01. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  This officer is chosen by the electors of a district that includes Allen County. [verified] — same source.

  The roster gives a name, a party and two dates, so this node carries no date of birth, no
  biography and no prior office beyond what is noted on the tenure. [open] Nor does it establish
  where this person lives: unlike a county officer, who must be an elector of the county, a
  district officer need only be an elector of the district.

  **A second source was read for that question and it cannot answer it either.** The Supreme Court
  of Ohio's register of attorneys can be searched by county, and its own disclaimer says what that
  county is: "The directory lists an attorney's business address. An attorney's residence address
  is displayed only if the attorney has not provided a valid business address." A result does not
  say which of the two it returned. [verified] —
  [the attorney directory](../../catalog/ohio-attorney-directory.md); see
  [an address of record is not a residence](../../decisions/an-address-of-record-is-not-a-residence.yml).

  It returns a Matthew Carl Huffman, admitted by examination on 4 November 1985 and holding
  registration number 29473, with an Allen County address of record. [verified] — same source. Six
  Huffmans appear in that county's register and two of them are named Matthew, so the join to this
  member is a middle initial and a county, and the county is a mailing address. [inference]

  That absence has a structural consequence worth naming: this node carries no outgoing edge but
  `instance-of`. Every other person in this corpus reaches the county through a `resided-in` edge,
  and a district officer reaches it only through the office and the term. [inference]
  **The returns record five earlier elections for a candidate of this name in this county.** Matt
  Huffman won Ohio House district 4 here in 2006, 2008 and 2012 and the 12th senate district in 2016
  and 2020. The 2008 and 2016 wins were unopposed. [verified] —
  [the General Assembly returns](../measure/allen-county-in-the-general-assembly-2000-2020.yml).
  That the ballot's *Matt Huffman* and this roster's *Matthew C. Huffman* are one person is an
  inference from party, county and an unbroken run of offices. [inference]

