class: person
label: Samuel Collins
description: |
  Sheriff of Allen County, 1861–1865. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **He bought a sketch in 1885 and another in 1906, and the two are the corpus's clearest case of
  what a paid sketch is and is not.** Both give him a birth in Belmont County, Ohio, in March 1824
  — the later one adds the day, the 6th — parents John and Rachel (Cunningham) Collins, a move to
  Lima in 1852, a grocery on the ground where he built the Collins Block in 1874, a marriage in
  1847 to Mary Brinser, and three children. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), the biographical
  half of each, read in both scans of both.

  **Both name the office, and they agree with the roster to the year.** "In 1861 he was elected
  sheriff, and served until 1865" in the first; "In 1861 he was elected sheriff of Allen County and
  served with great efficiency until 1865" in the second. [verified] — the same two sources. See
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  **They contradict each other about his parents, and nobody had a motive to lie.** The 1885 sketch
  has John and Rachel Collins settling in Belmont County "where they passed the remainder of their
  days"; the 1906 sketch has them leaving Belmont County in 1834 for Logan County, "where they
  lived the remainder of their lives". [verified] — the same two sources. Both were, by the
  publishers' own account, sent to their subject for correction before printing. Twenty-one years
  apart, the same man let both stand. See
  [what a paid sketch may be quoted for](../../decisions/what-a-paid-sketch-may-be-quoted-for.yml).

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge
  to Allen County is a legal inference rather than a fact the roster states. [inference]
properties:
  born: "1824-03-06"
  birthplace: Belmont County, Ohio. [verified]
  occupation: grocer, then sheriff
