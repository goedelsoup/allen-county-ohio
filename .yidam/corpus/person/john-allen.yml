class: person
label: John Allen
description: |
  A Kentucky colonel killed at the River Raisin in the War of 1812, and the person Allen
  County is most often said to be named for. [inference]

  This node is written with the naming claim deliberately *not* asserted from it. The corpus
  records the dispute as [a question](../question/namesake-of-allen-county.yml) rather than
  resolving it by writing a `named-for` edge it cannot defend.

  **The other candidate is now much weaker than it was.** The earliest source the corpus holds,
  Howe's *Historical Collections of Ohio* of 1847, gives the county as "named in honor of a
  colonel of that name in the war of 1812", which is a description Ethan Allen — dead in 1789 —
  cannot fit. [verified] —
  [Howe, 1847](../../catalog/howe-historical-collections-of-ohio.md). The Ethan Allen attribution
  is traceable to the 1921 county history, which reached it by inference and hedged it twice.
  [inference] — see [the question](../question/namesake-of-allen-county.yml).

  **What is still missing is this man's name in a source, and the gap has a shape.** Howe
  describes two of the fourteen counties of 1820 by rank and war without naming the officer, and
  they are Allen and Wood. [verified] —
  [the counties of 1820](../measure/ohio-counties-of-1820-and-their-names.yml). A Kentucky colonel
  named Allen who fell at the River Raisin in January 1813 fits the description; that he is the
  man is this corpus's reading and no source it holds says so. [inference]

  That absence is the point. A `named-for` edge from
  [Allen County](../place/allen-county.yml) to this node would be well-formed, would resolve,
  would pass every check this repository runs, and would settle by structure a matter the
  prose says is open.

  [open] Whether this is the right John Allen, and whether the county is named for any John
  Allen at all, is exactly what is unresolved.
