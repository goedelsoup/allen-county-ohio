class: person
label: James D. Jordan
description: |
  Representative in Congress, Ohio's 4th District, holding a term that began 2025-01-03. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  This officer is chosen by the electors of a district that includes Allen County. [verified] — same source.

  The roster gives a name, a party and two dates, so this node carries no date of birth, no
  biography and no prior office beyond what is noted on the tenure. [open] Nor does it establish
  where this person lives: unlike a county officer, who must be an elector of the county, a
  district officer need only be an elector of the district.

  **A second source was read for that question and it cannot answer it either.** The Supreme Court
  of Ohio's register of attorneys can be searched by county, and its own disclaimer says what that
  county is: "The directory lists an attorney's business address. An attorney's residence address
  is displayed only if the attorney has not provided a valid business address." A result does not
  say which of the two it returned. [verified] —
  [the attorney directory](../../catalog/ohio-attorney-directory.md); see
  [an address of record is not a residence](../../decisions/an-address-of-record-is-not-a-residence.yml).

  It does not reach this member either. One James Jordan is registered in Ohio, admitted in 1966,
  and carries a different middle name from the one this roster prints. [verified] — same source,
  searched statewide. Joining them would be a guess about a person, and the register offers nothing
  to guess with.

  **The returns close half of the open question about prior office.** A candidate named Jim Jordan
  won Ohio's 4th congressional district in this county at six consecutive general elections from
  2006 to 2020, and a candidate of that name won the county's 12th state senate district in 2000.
  [verified] — [the congressional returns](../measure/allen-county-in-congress-2000-2020.yml) and
  [the General Assembly returns](../measure/allen-county-in-the-general-assembly-2000-2020.yml).
  That the returns and this roster name one person is an inference from an unbroken Republican
  succession in one district, and from nothing in either file. [inference]

  That absence had a structural consequence worth naming: until the returns arrived this node
  carried no outgoing edge but `instance-of`. Every other person in this corpus reaches the county
  through a `resided-in` edge, and a district officer reaches it only through the office, the term,
  and now a table of votes. [inference]
