class: person
label: William V. Daley
description: |
  Sheriff of Allen County, 1937–1945. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  Distinct from William R. Dailey, who held the office immediately afterwards, 1945–1953. [verified] The two spellings are one letter apart in adjacent terms and were recorded as two people because the roster listed them as two entries.

  **They are two men, and the county's own newspaper puts them on one ballot against each other.**
  The Allen County canvass of November 1944 prints, under For Sheriff, "W. R. Dailey, R. 18,038"
  and "W. V. Daley, 14,798". [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 9 November 1944; see
  [the ballot of those years](../measure/allen-county-presidential-vote-1944-1956.yml). A sitting
  sheriff was beaten by 3,240 votes by a man whose name differs from his by one letter, and the
  roster's two entries are two people. The question is closed.

  **A William V. Daley stood for mayor of Lima in the year this sheriff's term ended.** The
  non-partisan city primary of August 1945 sent two candidates to the ballot: the incumbent mayor
  and "William V. Daley". [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md); see
  [the mayors named inside the gap](../measure/lima-mayors-1939-1956.yml) and
  [William L. Ferguson](william-l-ferguson.yml). Whether the candidate and the sheriff are the same
  man is a match on a full name and a year, and neither source carries anything that would settle
  it. [open] It is recorded because a sheriff leaving office in 1945 and a mayoral candidate of the
  same name in 1945 is the kind of coincidence that later work should either close or dismiss on
  purpose.

  The roster gives a name and a year range and nothing else, so this node carries no dates
  of birth or death and no biography. Ohio requires an elected county officer to be an
  elector of the county, so a `resided-in` edge to Allen County is a legal inference rather
  than a fact the roster states. [inference]
