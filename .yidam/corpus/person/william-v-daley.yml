class: person
label: William V. Daley
description: |
  Sheriff of Allen County, 1937–1945. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  Distinct from William R. Dailey, who held the office immediately afterwards, 1945–1953. [verified] The two spellings are one letter apart in adjacent terms and are recorded as two people because the roster lists them as two entries; whether that is right is not something the roster can settle. [open]

  The roster gives a name and a year range and nothing else, so this node carries no dates
  of birth or death and no biography. Ohio requires an elected county officer to be an
  elector of the county, so a `resided-in` edge to Allen County is a legal inference rather
  than a fact the roster states. [inference]
properties:
