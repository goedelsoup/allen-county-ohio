class: person
label: Samuel S. Yoder
description: |
  Bluffton's physician, the county's probate judge, its congressman for two terms, and the only
  person in this corpus with a village named after his family.

  **He sat in the United States House for Ohio's Fourth District from 5 December 1887 to 3 March
  1891, a Democrat in both Congresses**, and was born on 16 August 1841. [verified] —
  [the congress-legislators file](../../catalog/congress-legislators.md).

  **He was a doctor before he was a judge.** The county medical society admitted "S. S. Yoder and
  F. Hermann, of Bluffton" among its early members. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). "At Bluffton Dr. S. S.
  Yoder was once 'the most beloved physician'". [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). See
  [Bluffton](../place/bluffton.yml).

  **He became probate judge in 1881**, between George W. Overmeyer and John F. Lindeman, and both
  county histories print him there. [verified] — the two rosters; see
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml) and
  [the probate division](../office/judge-of-the-common-pleas-probate-division.yml).

  **An oil town in Perry Township carried his family's name.** "The oil industry is quite promising
  about Yoder a little town near the center of the township which sprang up after the discovery of
  oil and was named for the family of Congressman S. S. Yoder. At one time there was a promising
  grange in the township which met at Yoder in a hall specially built for that purpose but at present
  the grange has been discontinued." [verified] — the 1906 history; see
  [the oil strike](../event/lima-oil-strike.yml).

  **He is the third of the county's three congressmen the 1906 book could name**, after
  [Mathias H. Nichols](mathias-h-nichols.yml) and [Charles N. Lamison](charles-n-lamison.yml), and
  the third of the three to hold a county office before a federal one. [verified] —
  [the county in Congress](../measure/allen-county-in-congress-1831-1933.yml).

  [open] When he died, and whether the physician, the probate judge and the congressman are one man
  or two of that name in one small village. Three sources give the same initials and the same town
  across thirty years and none of them says so in a sentence. [inference] — the corpus treats them as
  one.
  **He was born at Berlin in Holmes County on 16 August 1841, and two sources thirty-six years and
  six hundred kilometres apart say so to the day.** The 1885 county history's sketch of him as
  probate judge gives the date and the town; the *Evening Star* of Washington gives it again in his
  obituary of 11 May 1921. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical half
  read in both scans, and [Chronicling America](../../catalog/chronicling-america.md). Neither had
  the other. See
  [what a paid sketch may be quoted for](../../decisions/what-a-paid-sketch-may-be-quoted-for.yml).

  **He died on the morning of 11 May 1921 at his house on Maryland Avenue north-east in
  Washington**, having been in poor health for several years, "prominently identified with various
  fraternal organizations and a member of the Association of Oldest Inhabitants of the District of
  Columbia". [verified] — the same paper, the same page. He had left Congress thirty years earlier
  and did not come home.

  **Four of his brothers went to the war and he was the fourth of them to go.** Noah W. helped
  organise Company G of the 51st Ohio, took seven wounds and lost a leg at Stone River, and was
  drowned afterwards on his way to a patient; Moses F. was mortally wounded at Kenesaw Mountain;
  Jacob T. died at Milliken's Bend on the Red River expedition. Samuel S. Yoder served in Company
  G of Hoffman's Independent Battalion, which became part of the 128th Ohio, and was commissioned
  second lieutenant. [verified] — the 1885 history, the same sketch.

  **The two sources disagree about his father's name.** The 1885 sketch makes him a son of Yost and
  Nancy (Hostetter) Yoder; the 1921 obituary makes him a son of "the late Jocelyn and Nancy Yoder",
  and the 1885 sketch's own list of children includes a brother Joslyn. [verified] — the same two
  sources. Nothing here chooses. [inference]

