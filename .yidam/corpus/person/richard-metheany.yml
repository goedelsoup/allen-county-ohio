class: person
label: Richard Metheany
description: |
  Twenty-six years in the government of Lima, across five different offices, ending in four
  consecutive years as mayor — a run matched in the town's first forty-four years only by John B.
  Townsend. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

      1848  village trustee
      1850  recorder
      1853  village trustee
      1854  village trustee
      1865  treasurer
      1870  mayor, re-elected 1871, continuing 1872, and named as mayor for 1873

  [verified] — same source, the year-by-year municipal record; see
  [the line of mayors](../measure/lima-mayors-1842-1886.yml).

  **He served on the county's war committee.** R. Metheany sat on the executive committee of the
  Auxiliary Aid Society organized at Lima on 23 April 1862, and the Military Committee of Allen
  County. [verified] — same source, Chapter IX; see
  [what the county sent](../measure/allen-county-civil-war-service.yml). He was treasurer of the
  village three years later.

  The record shows him in office in four decades — a trustee of a village of a few hundred in
  1848, mayor of a town that had had two railroads for a dozen years by 1870. [inference] —
  computed here from the dates above.

  **A third Metheany was mayor of the same town seventy years later.**
  [Allen L. Metheany](allen-l-metheany.yml) held this office in 1944 and died in it. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md). That makes three Metheanys in Lima's
  government across ninety-six years, and the corpus has a relation established between none of
  them. [inference]

  [open] Whether the C. A. Metheany elected councilman in 1878 is a relation, and whether either is
  a relation of the mayor of 1944. The book gives no first name for either man beyond an initial.

  **He was born on 16 June 1805 and died on 22 June 1879, and what the 1906 history knows about him
  it takes from the address at his funeral.** The book prints T. E. Cunningham's tribute, delivered
  on Wednesday 25 June 1879, nearly whole. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), its biographical half,
  read in both scans.

  **He came to Lima in March 1844 from a farm three miles north of Wapakoneta, which was then inside
  this county.** He was appointed clerk of the courts in place of John Alexander, who had just died,
  and held the office until 1852, "when his office was terminated by the operation of the new
  constitution of the State" — and then went to the Ohio & Indiana Railroad as Judge Hanna of Fort
  Wayne's right-hand man. [verified] — the same source, the same tribute. He was less than forty
  when he was made clerk, which puts the appointment before his thirty-ninth birthday. [inference] —
  computed from the birth date above.

  **A funeral address is not a subscription sketch and this is why it has a death date.** The men in
  these books who have both dates are the men who were already dead; the living ones bought a
  birthday. [inference] — see
  [what a paid sketch may be quoted for](../../decisions/what-a-paid-sketch-may-be-quoted-for.yml).

