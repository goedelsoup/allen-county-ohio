class: person
label: William H. Harter
description: |
  Sheriff of Allen County, 1881–1885. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **He was born in Spencerville, went to sea in the war, and came home to be marshal, constable,
  councilman and then sheriff.** Born 19 August 1848 at Spencerville in this county, son of
  Bennett D. Harter, a dry goods merchant, and Sarah J. (Jones) Harter, natives of Pennsylvania
  and Kentucky; educated in the county schools; married Marretta Morton in September 1871.
  [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical
  half, read in both scans.

  **He served two years in the navy in the Civil War**, under Capt. Howard. [verified] — the same
  source. He is the only holder of this office the corpus knows to have served at sea, and the
  county's own Civil War roster is an army roster. [inference] — see
  [what the county sent](../measure/allen-county-civil-war-service.yml).

  **The sketch names the office and dates it.** "In 1881 was elected sheriff of the county, and is
  now occupying his office in the new court house" — printed in 1885, against a roster line
  beginning in 1881, from a man who was in the building. [verified] — the same source. See
  [the courthouse](../site/allen-county-courthouse.yml).

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge
  to Allen County is a legal inference rather than a fact the roster states. [inference]
properties:
  born: "1848-08-19"
  birthplace: Spencerville, Allen County, Ohio. [verified]
  occupation: sheriff
