class: person
label: Sherman E. Eley
description: |
  Sheriff of Allen County, 1914–1918. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  The roster gives a name and a year range and nothing else, so this node carries no dates
  of birth or death and no biography. Ohio requires an elected county officer to be an
  elector of the county, so a `resided-in` edge to Allen County is a legal inference rather
  than a fact the roster states. [inference]
  **A mob put a rope round his neck on 30 August 1916 and he would not give up his prisoner.** He
  had hidden a Black man, Charles Daniels, whom the crowd had come to the county jail to take, and
  when he would not say where, "a rope was fastened about his neck and the frenzied mob was about
  suspending him from a lamppost when there was friendly intervention". He was hospitalised and was
  later given a medal. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the mob of 1916](../event/the-mob-at-the-allen-county-jail-1916.yml).

