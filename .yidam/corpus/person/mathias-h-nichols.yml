class: person
label: Mathias H. Nichols
description: |
  Newspaper founder, prosecuting attorney, three-term congressman and Civil War officer — and the
  first person this corpus holds who did all four in Allen County.

  **He founded the county's second newspaper by selling his waistcoat.** "The story of Mathias H.
  Nichols, who divested himself of his vest — his only garment with market value — in order that he
  might buy white stock paper for the first issue of his newspaper — The Argus." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). See
  [The Lima Argus](../organization/the-lima-argus.yml), which the Library of Congress records as
  running from 1843 to November 1854.

  **He was elected prosecuting attorney in 1851 and resigned in 1852 to enter Congress.**
  [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md),
  "Roster of County Officials"; see
  [the tenure](../tenure/prosecutor-1851-mathias-h-nichols.yml) and
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml).

  **He served three terms in Congress.** "M. N. Nichols, who was three times congressman, and who
  served with distinction as an officer in the Civil war." [verified] — the 1921 history, which
  spells his initials three different ways in one volume — Mathias H. Nichols in its list of
  prosecutors, Mathias H. Nicholas in its list of congressmen, and M. N. Nichols in its account of
  the bar. The corpus uses the 1906 book's form. [inference]

  **The 1906 book calls him a "Brilliant Lawyer, Scholar and Statesman"** in its chapter of legal
  biographies, and the militia company raised at Lima in 1861 was called "Nichols' Guards".
  [verified] — the 1906 history, its table of contents.

  **The district was Ohio's Fourth, and the three terms were the 33rd, 34th and 35th Congresses —
  5 December 1853 to 3 March 1859.** He was born on 3 October 1824. [verified] —
  [the congress-legislators file](../../catalog/congress-legislators.md); the 1906 history names him
  in the same place, "Mathias H. Nichols, of Allen County, 1853-58". [verified] — the 1906 history,
  "Congressmen"; see [the county in Congress](../measure/allen-county-in-congress-1831-1933.yml).

  **He resigned a county office more than a year before the seat existed.** The prosecutor's roster
  says he resigned in 1852 to enter Congress; the federal record seats him on 5 December 1853.
  [verified] — the two sources compared.

  **He held that one seat under three party labels in six years** — Democrat, then "Ind.
  Republican-Democrat", then Republican. [verified] —
  [the congress-legislators file](../../catalog/congress-legislators.md), the `party` field of each
  of his three terms. Neither county history gives his party at all.

  [open] His date of death, and which war service the 1921 book means — the company named for him
  was raised in 1861 and the book does not say he commanded it. The federal file carries no date of
  death for anyone.
properties:
  also_known_as: |
    Mathias H. Nicholas and M. N. Nichols, both in the 1921 history. [verified]
