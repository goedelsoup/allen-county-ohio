class: person
label: Mathias Ridenour
description: |
  Sheriff of Allen County, 1853–1855. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **A sketch of an M. Ridenour was found and rejected.** The 1885 history's Sugar Creek section
  carries `M. RIDENOUR (deceased) was born in Fairfield County, Ohio, March 6, 1826`, a farmer who
  married Eleanor P. Lipsett on 31 December 1848 and died on 13 December 1873. Two later passages in
  the same book name him in full: George M. Ridenour. He held no office in the sketch and was
  eighteen years old when this man's term of 1853 began under a different given name. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans. Nothing
  from it is on this node; see
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  The roster gives a name and a year range and nothing else, so this node carries no dates of birth
  or death and no biography.

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge
  to Allen County is a legal inference rather than a fact the roster states. [inference]
