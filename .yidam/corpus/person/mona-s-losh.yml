class: person
label: Mona S. Losh
description: |
  Recorder of Allen County, holding a term that began 2025-01-06. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  Serving since January 2005. [verified] —
  [the county recorder's site](../../catalog/allen-county-official-site.md). [open] Whether that
  makes her the county's longest-serving present officer is not established: the elections roster
  gives current terms only, so for six of the nine officers the corpus does not know when service
  began.

  The elections roster gives a name, a party and two dates, so this node carries no date of birth,
  no biography and no prior office. Ohio requires an elected county officer to be an elector of the
  county, so the `resided-in` edge below is a legal inference rather than a fact any source states.
  [inference]
  **Her certificate is on every tract page this corpus has read.** Each of the four sheets of the
  Recorder's abstract for the north-west quarter of section 17 is headed *"I hereby certify on this
  day, Aug 11, 2011, this abstract page was correctly transcribed and proofed by two deputies"*
  over her signature as Recorder. [verified] —
  [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md), volume 0028A
  pages 165 and 166.

  The certificate dates the transcription and not the record: the sheets carry conveyances from
  1834 to 2003 and were typed in 2011. It is also the reason those pages are readable at all —
  the county re-typed its abstracts, where the deed books and grantee indices behind them are
  handwriting. [inference]

