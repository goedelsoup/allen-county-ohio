class: person
label: John Franks
description: |
  Sheriff of Allen County, 1877–1881. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **A second, unrelated record puts him in the office in 1881.** The county's building committee for
  the new courthouse, formed after the vote of April 4, 1881, comprised the probate judge, the clerk
  of the common pleas, an appointee of the common pleas judge, the commissioners — and "John Franks,
  Sheriff". [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). The roster's terminal year and the book's committee agree, from
  sources with nothing in common. This is the only sheriff in the corpus's line of thirty-eight whose
  tenure is corroborated outside the roster. See
  [the courthouse](../site/allen-county-courthouse.yml).

  The roster gives a name and a year range and nothing else, so this node carries no dates
  of birth or death and no biography. Ohio requires an elected county officer to be an
  elector of the county, so a `resided-in` edge to Allen County is a legal inference rather
  than a fact the roster states. [inference]
