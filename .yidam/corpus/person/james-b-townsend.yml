class: person
label: James B. Townsend
description: |
  Mayor of Lima from 1876, and the man this corpus called John for two hundred commits.

  **His own book gets his name wrong once and right three times.** The 1885 history's list of
  mayors prints "John B. Townsend" in both digitizations; the same volume prints James B. Townsend
  in its election returns, in its index, and in a biographical sketch of him. Both later county
  histories print James. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md),
  [1906](../../catalog/miller-allen-county-1906.md) and
  [1921](../../catalog/rusler-allen-county-1921.md); see
  [the line of mayors](../measure/lima-mayors-1842-1886.yml).

  **He paid for his legal education by touring with a company of singers.** Born in Allen County in
  1851, son of a commission merchant who came from New York in 1850, went back, and returned in
  1859 by way of Bluffton; educated in the Lima schools; and from 1868 to 1874 he studied law
  "while traveling through the country with a first-class company of vocalists, giving concerts and
  lecturing in the interest of the Townsend medicines" — his father's patent remedies, "so
  extensively advertised throughout the world". [verified] — the 1885 history. He was admitted to
  the bar by the Supreme Court at Columbus in 1874, elected justice of the peace in Lima, and then
  mayor. [verified] — same source.

  **At twenty-five he is the youngest mayor in the line the corpus holds**, taking the office in
  1876 two years after admission to the bar. [inference] — computed here against
  [the line](../measure/lima-mayors-1842-1886.yml).

  **The same book cannot agree with itself about how long he served.** Its list gives 1876 to 1880,
  four years; its sketch of him says "he was elected mayor of Lima for five years", and puts three
  years as justice of the peace after an 1874 admission, which would begin the mayoralty in 1877.
  [verified] — same source. Neither reading is preferred here: the list is the record of an office
  and the sketch is a life told once, and the corpus has no third witness for either the length or
  the start.

  **What the office was for, in his telling.** "It was during his administration and through his
  personal diligence that the fair city was purged of the tramp nuisance, and other evils."
  [verified] — same source. Lima in those four years was a town of about seven thousand with three
  railroads crossing it, which is what produces a tramp nuisance and what a mayor of that decade
  was expected to answer for. [inference] — see
  [the railroads](../measure/allen-county-railroads-1883-1921.yml).

  [open] Whether he served four years or five, and whether he took office in 1876 or 1877.
  **He was born in Allen County in 1851 and read law on the road, selling his father's medicines.**
  Son of Charles M. and Catherine (Barry) Townsend, of New York and Ireland; his father was the
  proprietor of "the celebrated Townsend medicines, which are so extensively advertised throughout
  the world". From 1868 to 1874 he travelled the country with a company of vocalists, giving
  concerts and lecturing in the medicines' interest and studying law as he went, and was admitted by
  the Supreme Court at Columbus in 1874. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical half,
  read in both scans.

  **The sketch names three offices and one of them is why this node exists.** Justice of the peace
  for three years, mayor of Lima for five, and prosecuting attorney from 1881 — "an office he still
  holds", printed in 1885. [verified] — the same source; see
  [attach a biography by its office](../../decisions/attach-a-biography-by-its-office.yml).

  **He laid out a village while he was prosecutor.** He is given as proprietor of "the newly (1883)
  laid out village of Harrod on this railroad, which bids fair to become a lively town", and as a
  director of the Lima & Columbus Railroad it stood on. [verified] — the same source; see
  [Harrod](../place/harrod.yml).

