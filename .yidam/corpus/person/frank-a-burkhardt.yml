class: person
label: Frank A. Burkhardt
description: |
  The last mayor of Lima, and one of the editors of the book that records it.

  **His term ended the office.** The commission form of government came into effect on 1 January
  1922, "at the end of the term of Mayor Burkhardt", after eighty years in which Lima had been
  "ruled by a mayor". [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the commission government](../event/lima-adopts-commission-government-1922.yml) and
  [the mayors of 1886 to 1922](../measure/lima-mayors-1886-1922.yml).

  **He is inside the source as well as in it.** He sits on the 1921 history's advisory board of
  editors, listed as "Mayor Frank Burkhardt" beside Senator Stephen D. Crites of
  [Elida](../place/elida.yml); and he wrote a paper for it, "Trails, Traces and ...", which the
  book quotes and folds into its chapters on the county's roads. [verified] — same source.

  **That is a thing to hold onto when reading the book's account of the charter.** The volume's
  pages on the commission government are enthusiastic about a change that ended the office its own
  advisory editor held, and they were written while he held it. The corpus records the enthusiasm
  as the book's and not as the county's. [inference] — see
  [read a word in its source register](../../decisions/read-a-word-in-its-source-register.yml).

  [open] Everything else about him. The 1921 history names him four times and describes him once,
  as the author of a paper; his volume two, which would carry a biographical sketch, is not on
  archive.org and is not held here. The corpus does not know when he was born, what he did before
  1920, or what he did after the office stopped existing.
