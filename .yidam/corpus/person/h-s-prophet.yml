class: person
label: H. S. Prophet
description: |
  Mayor of Lima from 1882 to 1884, and the only holder of that office in
  [the line](../measure/lima-mayors-1842-1886.yml) whom a later history describes as a soldier.
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) for the
  office and [the 1921 history](../../catalog/rusler-allen-county-1921.md) for the rest.

  **The 1921 book calls him a colonel and says why.** "Col. H. S. Prophett, a Civil war veteran,
  wounded in battle, and honorably mentioned by his commanding general for 'conspicuous gallantry
  and efficiency in battle,'" and it spells the surname with two t's where the 1885 book uses one.
  [verified] — the 1921 history.

  **The 1885 roster carries two Prophets among the captains, and they are probably one man.**
  "Prophet, H. S., 15th O. V. I., April, 1861, Aug., 1861" — a three-month enlistment in the first
  call — and "Prophet, Hinchman, 43d O. V. I., Sept. 1, 1861, resigned June, 1863". [verified] —
  the 1885 history, both digitizations, which agree on both entries and disagree only on the second
  resignation year, where the cleaner scan reads 1803 and the other 1863.

  Three months in a ninety-day regiment followed by a commission in a three-year one is the
  ordinary sequence for an Ohio officer of 1861, the initials fit a man christened Hinchman S., and
  the roster prints the two entries adjacent because it is alphabetical. [inference] — computed
  here. It is a reading and not a finding: the book names them separately and this corpus cannot
  show they are the same.

  [open] Whether the wound and the commendation the 1921 book reports belong to the 43rd Ohio or
  to some later service. That book gives neither a date nor an engagement, and the 1885 roster
  gives no wound at all.

  **He was mayor twice, sixteen years apart, and the corpus knew only the first.** April 1882 to
  April 1884, and again April 1898 to April 1900. [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md); see
  [the mayors of 1886 to 1922](../measure/lima-mayors-1886-1922.yml).

  **A third list confirms the 1921 book's prose about him exactly.** That book says he "served as
  city solicitor for four years"; the 1906 history's separate list of city solicitors gives "H. S.
  Prophet, April, 1874, to April, 1878" — four years, from a table the 1921 book was not reading.
  [verified] — the 1906 and 1921 histories. It is a small check and it is the only one in this line
  that two independent lineages both pass. [inference]

  **He was born at Evesham in Burlington County, New Jersey, on 26 January 1836, to English
  parents.** John and Catherine (Roberts) Prophet came to America about 1829 and settled at
  Philadelphia, then New York, then Evesham, then Columbiana County in Ohio about 1838 and finally
  Morrow County; he was the only one of their eight children to live in Allen County. He was
  educated at Cardington, read law under Ross Burns and Judge J. A. Beebe, and was admitted by the
  Supreme Court of Ohio on 2 February 1860. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical
  half, read in both scans.

  **He enlisted twice in 1861 because the first quota was full.** Elected second lieutenant in a
  company that could not be taken, he re-enlisted as a private in Company C of the 15th Ohio, served
  three months, was mustered out, and then helped organise Company B of the 43rd Ohio, in which he
  was second lieutenant, first lieutenant and captain. He was wounded at the second battle of
  Corinth in 1862 and resigned in the summer of 1863 in poor health. [verified] — the same source;
  see [what the county sent](../measure/allen-county-civil-war-service.yml).

  **The two scans disagree about his given name and the corpus takes neither as a fact.** Scan B of
  the 1885 book heads the sketch `HINCHMAN S. PROPHET` and scan A `HENCHMAN S. PROPHET`; the 1906
  book prints `HINCHMAN`. [verified] — the three readings; see
  [two scans of one book](../../decisions/two-scans-of-one-book.yml). Two of three is not the rule
  this corpus uses on a name, so both forms are recorded.

properties:
  born: "1836-01-26"
  birthplace: Evesham, Burlington County, New Jersey. [verified]
  occupation: lawyer, soldier and mayor
  also_known_as: |
