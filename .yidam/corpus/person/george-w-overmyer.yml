class: person
label: George W. Overmyer
description: |
  The only man in Lima's first forty-four years to become mayor without an election, and later a
  probate judge who helped decide what the county's courthouse would look like. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **The council made him mayor in September 1869**, in place of Thomas M. Robb, who had resigned.
  Every other mayor in [the line](../measure/lima-mayors-1842-1886.yml) was chosen at an election.
  [verified] — same source.

  **He organized the county's war relief before that and captained a company during it.** He was
  secretary of the Auxiliary Aid Society organized at Lima on 23 April 1862, and the roster of
  commissioned officers gives "Overmyer, Geo. W., 81st O. V. I., Aug. 9, 1862, Nov. 23, 1864"
  among the captains. [verified] — same source, Chapter IX; see
  [what the county sent](../measure/allen-county-civil-war-service.yml).

  That roster entry is in one digitization only — the other recovers 90.9 per cent of the roster
  and not this line — so the dates rest on a single reading of a single book. [inference] — see
  [a printed list is a dataset](../../decisions/a-printed-list-is-a-dataset.yml).

  **He was Probate Judge of Allen County in 1881**, and in that office sat with the sheriff, the
  clerk of courts and the county commissioners on the committee that chose the plans for
  [the present courthouse](../site/allen-county-courthouse.yml). [verified] — same source. The
  corpus already held that committee and knew one of its members by name.

  He also stood for county office as a Democrat, and the 1885 book prints his votes in the county's
  election returns. [verified] — same source.

  [open] Which offices he stood for and when. The returns name him more than once and this corpus
  has not read that chapter, which runs election by election from 1831 to 1884.
