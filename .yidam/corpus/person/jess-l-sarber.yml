class: person
label: Jess L. Sarber
description: |
  Sheriff of Allen County from 1931 until he was killed in the county jail at Lima on the night of
  12 October 1933, shot by three men who had come to free the prisoner John Dillinger. [verified] —
  [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md) and
  [Chronicling America](../../catalog/chronicling-america.md); see
  [the raid on the Allen County jail](../event/allen-county-jail-raid-1933.yml).

  He was succeeded by his son, [Donald F. Sarber](donald-f-sarber.yml). [verified] — same archive,
  *Evening Star*, 4 March 1934, which describes the accused as held "for trial on charges of
  first-degree murder in the slaying of the sheriff's father".

  His wife was in the jail office with him and was locked in Dillinger's cell after the shooting.
  The newspaper record read here names her only as Mrs. Sarber. [verified] — same archive, United
  Press dispatch of 13 October 1933.

  **His signature is in the county's land records, on the ground the tank plant stands on now.**
  Two sheriff's deeds executed by "Sheriff Jess L Sarber" convey parts of the north-west quarter of
  section 14, T4S R6E, out of a foreclosure: one dated 26 April 1933 and recorded the next day, one
  dated 5 May 1933 and **recorded on 7 December 1933**, eight weeks after he was killed. [verified]
  — [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md), volume 0034A
  page 90, at volume 222 pages 609 and 652.

  It is the only record this corpus holds of him doing the ordinary work of the office, and it is
  the second time the corpus has met him from a direction it was not looking: first from a wire
  dispatch about his death, now from a Depression foreclosure on a farm that became a defence
  plant. [inference]

  The roster gives a name and a year range; the newspapers give a death. This node still carries no
  date of birth and no biography before 1931. [open]

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge to
  Allen County is a legal inference rather than a fact either source states. [inference]
properties:
