class: person
label: Samuel A. Baxter
description: |
  Mayor of Lima in 1851 and 1854, a surgeon in the war, and — on a reading this corpus has since
  had to weaken — the physician who wrote part of the county's 1906 history. [inference]

  **He was elected mayor in 1851 and again in 1854, and appointed to the office in between.** In
  January 1854 the council appointed him in place of Thomas Milligan, who had resigned; later that
  year he was elected in his own right, and re-elected in 1855. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md); see
  [the line of mayors](../measure/lima-mayors-1842-1886.yml). He is one of three men in that line
  who served two separate terms — the others are Thomas Delzell and Thomas Milligan — and with four
  years in the office he is among its longest-serving. [inference] — computed here.

  **He went to the war as a surgeon.** "Baxter, S. A. Surgeon 18th O. V. I., March 13, 1863, Nov.
  11, 1865" — two years and eight months, and he is one of four surgeons the county's roster of
  field officers names. [verified] — same source, both digitizations; see
  [what the county sent](../measure/allen-county-civil-war-service.yml).

  **He may be the Dr. Samuel A. Baxter of the 1906 county history, and that book's own list argues
  against it.** That book is by
  Charles C. Miller and Dr. Samuel A. Baxter, "both of Lima", and the 1921 history says Baxter
  "contributed a number of reminiscent chapters". [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md) and
  [the 1921 history](../../catalog/rusler-allen-county-1921.md).

  A physician who was mayor in 1851 would have been born around 1825 and been past eighty in 1906,
  which is old but not impossible, and reminiscent chapters are exactly what a man of that age
  contributes. [inference] That was the whole of the argument, and it is an argument from age
  against a printed "Sr." — see below. The county carried more than one Baxter in any case: Capt.
  George M. Baxter raised a company for the 32nd Ohio in 1861, and the city treasurer in 1906 was
  Clem S. Baxter. [verified] — the 1885 and 1906 histories.

  **The book he helped write drops one of his terms and calls the first mayor "Senior".** The 1906
  history's list of mayors gives "Samuel A. Baxter, Sr., April, 1851, to April, 1853" and, forty-five
  years later, "Dr. Samuel A. Baxter, April, 1896, to April, 1898" — and it has no Baxter at all in
  1854, where the 1885 book puts him. [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md).

  **The missing 1854 term is a defect in that list and not a correction of this one.** Deleting it
  makes the two names after it slide two years earlier and leaves April 1857 to April 1858 with no
  mayor at all. [inference] — see
  [where a list loses a name](../../decisions/where-a-list-loses-a-name.yml).

  **The "Sr." is a different matter and it weakens the identification above.** A list that calls the
  1851 mayor Senior is distinguishing him from someone, and the someone it then prints is a doctor
  of the same name serving in 1896. Two men — a father in 1851 and 1854, a son in 1896 who was still
  writing in 1906 — fit the printed evidence better than one man of eighty-one, and this corpus had
  reached the opposite reading from age alone. [inference] The identification is downgraded from
  probable to unresolved, and the mayor of 1896 is not asserted here to be this man.

  [open] Whether Samuel A. Baxter, Sr., mayor in 1851 and 1854, and Dr. Samuel A. Baxter, mayor in
  1896 and co-author of the 1906 history, are father and son or one man. A birth year for either
  would settle it, and the 1906 book's biographical volume is where it would be.

