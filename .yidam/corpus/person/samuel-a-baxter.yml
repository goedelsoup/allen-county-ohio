class: person
label: Samuel A. Baxter
description: |
  Hatter, furrier, lawyer, and mayor of Lima in 1851 and 1854. Born in Washington County, Maryland,
  on 26 September 1807 and dead before 1885. He is the elder of two men of this name in this
  county, and until this phase the corpus held them as one.

  **The book that settled it is the one it had already read four times.** The 1885 history's
  biographical half heads a sketch `SAMUEL A. BAXTER (deceased), was born in Washington County,
  Md., September 26, 1807; son of Samuel A. Baxter, of English descent`. He was a hatter and
  furrier by trade, was offered charge of a hat store at Lancaster, Ohio, by a man who met him East
  buying goods, and set out with another young man and one horse which they rode alternately. He
  ran that business and eventually bought it; read law at Lancaster under ex-Governor William
  Medill; removed to Lima in 1838 and opened a hat store; spent a winter at the law school in
  Cincinnati and was admitted to the bar in 1847. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical half,
  read in both scans. The 1906 history prints the same birthday and calls him "the late Samuel A.
  Baxter". [verified] — [the 1906 history](../../catalog/miller-allen-county-1906.md), its
  biographical half.

  **He was elected mayor in 1851 and again in 1854, and appointed to the office in between.** In
  January 1854 the council appointed him in place of Thomas Milligan, who had resigned; later that
  year he was elected in his own right, and re-elected in 1855. [verified] — the 1885 history; see
  [the line of mayors](../measure/lima-mayors-1842-1886.yml). He is one of three men in that line
  who served two separate terms — the others are Thomas Delzell and Thomas Milligan — and with four
  years in the office he is among its longest-serving. [inference] — computed here. He was
  forty-three at the first election. [inference] — computed from the birth date.

  **The surgeon of the 18th Ohio was his son, and this corpus had it on the wrong man.** The 1885
  sketch runs straight on from the father into "S. A. Baxter, the third son", who read medicine
  under Dr. William H. Harper of Lima, finished with Dr. J. Dawson at Columbus, graduated at
  Cincinnati College, and "began the practice of his profession in the army, in 1863, in the
  Eighteenth Ohio Volunteer Infantry, where he remained until the close of the war". [verified] —
  the same sketch, both scans. The county's roster of field officers has "Baxter, S. A. Surgeon
  18th O. V. I., March 13, 1863, Nov. 11, 1865", and it is the son's line. [verified] — the same
  source, its military chapter; see
  [what the county sent](../measure/allen-county-civil-war-service.yml) and
  [Dr. Samuel A. Baxter](dr-samuel-a-baxter.yml).

  **A man dead before 1885 did not write reminiscent chapters for a book of 1906.** The
  identification this corpus once held as probable and then downgraded to unresolved is now
  resolved against it: the co-author of the 1906 history is the son. What made the difference was a
  date of birth, which is what that node's own unanswered block said it would take. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), its biographical
  half; see
  [an unused property is an unasked question](../../decisions/an-unused-property-is-an-unasked-question.yml).

  **The 1906 book calls him "Sr." in its list of mayors and that was the corpus's clue.** "Samuel A.
  Baxter, Sr., April, 1851, to April, 1853" and, forty-five years later, "Dr. Samuel A. Baxter,
  April, 1896, to April, 1898". [verified] — [the 1906 history](../../catalog/miller-allen-county-1906.md).
  A list that calls a man Senior is distinguishing him from someone; the someone is on the same page.

  **The missing 1854 term is still a defect in that list and not a correction of this one.**
  Deleting it makes the two names after it slide two years earlier and leaves April 1857 to April
  1858 with no mayor at all. [inference] — see
  [where a list loses a name](../../decisions/where-a-list-loses-a-name.yml).

  **There is a third Baxter of this family and he is not a node here.** George M. Baxter, born at
  Lancaster in Fairfield County on 3 December 1834 and dead before 1885, son of Samuel A. and Nancy
  M. (Mason) Baxter, raised a company for the 32nd Ohio in 1861. [verified] — the 1885 history,
  the sketch after this one; scan A dates his birth 8 December and scan B the 3rd, in the typeface
  that confuses those two digits throughout the book. He answers no question this corpus is asking,
  and is recorded here so that the next phase to meet the name knows there were three. [inference]
  — see [node worthiness is a property of the member](../../decisions/node-worthiness-is-a-property-of-the-member.yml).

  [open] When he died. The 1885 book calls him deceased and gives no year; his first wife Nancy died
  in 1862 and he married again, so the range is 1862 to 1885 and nothing here narrows it.
