class: person
label: Isaiah S. Pillars
description: |
  Colonel, prosecuting attorney, state representative and Attorney General of Ohio — and the one man
  in the county's undated legislative roster whose year this corpus can name.

  **He was born in Jefferson County, Ohio, on 17 March 1833 and died in 1895.** He began teaching
  school at sixteen, read at the Seneca County Academy and finished at Heidelberg University in
  Tiffin, and began practising law in Lima in 1855. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), its chapter of legal
  biographies.

  **Governor Tod appointed him commander of Camp Lima with the rank of colonel**, "and under
  him the 99th, 118th and 81st regiments were organized". [verified] — same source; see
  [Camp Lima](../site/camp-lima.yml). The 81st is the regiment
  [Charles N. Lamison](charles-n-lamison.yml) went out with as a captain.

  **"In 1871 he was elected Representative, but declined a second term."** [verified] — same source.
  He stands twenty-fifth in the same book's roster of the county's members of the Ohio House, which
  prints thirty-five names and not one year; his is the only one of the thirty-five that another
  chapter dates. [verified] —
  [the county in the General Assembly](../measure/allen-county-general-assembly-1833-1906.yml).

  **What he did there was resist a railroad tax and argue against hanging.** "Mr. Pillars resisted
  the proposed measure for levying taxes for the purpose of railroad construction, the wisdom of
  which course was sustained by supreme court decision. He was also author of a minority report in
  favor of the abolition of capital punishment." [verified] — same source. The county had voted
  $100,000 of railroad bonds the year before he was elected. [inference] — see
  [the county's railroads](../measure/allen-county-railroads-1883-1921.yml).

  **He was elected Attorney General of Ohio "by the Democracy" in 1877** — the highest state office
  anyone in this corpus has held. [verified] — same source, corroborated by
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md): he
  "represented Allen County in the Ohio Assembly and ... was attorney-general of Ohio".

  **The book contradicts itself about when he was prosecutor by a year.** Its "Roster of County
  Officials" gives "Isaiah S. Pillars, 1865"; its biography of him says "In 1866 Mr. Pillars was
  elected prosecuting attorney". [verified] — the 1906 history, both passages; see
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml).

  **The 1885 book has a fuller sketch of him, and one of its two scans moves his birth five years.**
  Scan B gives "born in Jefferson County, Ohio, March 17, 1833"; scan A gives 1838. The sketch
  settles it against itself: he began teaching at sixteen, was "admitted to the bar when not quite
  twenty-one years old", and was practising at Lima in 1855, none of which a man born in 1838 could
  do. The 1906 book, a different printing entirely, gives 1833. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans, and
  [the 1906 history](../../catalog/miller-allen-county-1906.md); see
  [two scans of one book](../../decisions/two-scans-of-one-book.yml).

  **His father was a carpenter and his mother died when he was eight.** Samuel Pillars, of
  Pennsylvania and German extraction, "never rich in this world's goods", and Charlotte (Potts) of
  Virginia, who died at the village of Risden — now part of Fostoria — leaving a boy of eight whose
  life from then on "was that of a poor boy thrown among comparative strangers". He read law in his
  brother James's office. [verified] — the 1885 history, the same sketch. It is unusual among these
  sketches in saying so: the form is written to flatter, and this one opens by saying its subject
  had nothing. [inference] — see
  [what a paid sketch may be quoted for](../../decisions/what-a-paid-sketch-may-be-quoted-for.yml).

  **The two books put his appointment to Camp Lima in different years, and the earlier paragraph
  above no longer names one.** The 1885 sketch says 1862 and the 1906 chapter says 1861. [verified]
  — the two sources. The catalog entry for the 1906 book already records that its 1861 is impossible
  on the passage it has just quoted, which makes 1862 the better reading and neither a settled one.
  [inference]

  [open] Whether the roster year is when he took office and the biography's when he was chosen. The
  same one-year gap would explain both and nothing held here establishes it.

  [open] The day he died. Both books that carry him were printed before or long after it; the 1906
  history gives "The death of Mr. Pillars occurred in 1895" and no month, and a newspaper search of
  1894 to 1897 for his name returns nothing, because "pillars" is a word.
