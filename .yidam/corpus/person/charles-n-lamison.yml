class: person
label: Charles N. Lamison
description: |
  Prosecuting attorney twice, major of the 81st Ohio Volunteers, and congressman for two terms — and
  the man the county's later history left out of its own roster.

  **He was elected prosecuting attorney in 1852 to fill the seat Mathias H. Nichols resigned, and
  again in 1857.** [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), "Roster of County
  Officials"; see [the tenure](../tenure/prosecutor-1852-charles-n-lamison.yml).

  **The 1921 history's roster does not contain him and the same book says he held the office.** Its
  list of prosecutors runs straight from Nichols in 1851 to Gutridge in 1859; its account of the bar
  says "he served as prosecuting attorney two terms, and was later elected for two terms as
  congressman from this district". [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), both
  passages; see
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml).

  **He went to war as a captain and came back a major.** "Charles N. Lamison was also a Civil war
  veteran. He went out as captain and was afterward major of the Eighty-first Ohio Volunteers."
  [verified] — the 1921 history. The 1906 book's chapter of legal biographies calls him "Brilliant
  Lawyer, Statesman, Soldier and Jurist, and Orator of the Old School", and names a militia company
  of 1861 "Captain Lamison's Company". [verified] — the 1906 history, its table of contents.

  **In Congress he sat for the old Fifth Ohio District under Grant.** "Away back in the '70s, when
  U. S. Grant was President, Col. C. N. Lamison of Lima was representative in Congress from the old
  Fifth Ohio District. It was during his term that a large increase in salary was passed."
  [verified] — the 1921 history, which promotes him from major to colonel in the telling and does
  not say when. [inference]

  **The two terms were the 42nd and 43rd Congresses, 4 March 1871 to 3 March 1875, for Ohio's Fifth
  District, as a Democrat in both.** [verified] —
  [the congress-legislators file](../../catalog/congress-legislators.md); the 1906 history has him in
  the same place, "Charles N. Lamison, of Allen County, 1871-74". [verified] — the 1906 history,
  "Congressmen". The 1921 book's "away back in the '70s, when U. S. Grant was President" is right in
  every particular: Grant's second term began in the middle of Lamison's. [inference] — see
  [the county in Congress](../measure/allen-county-in-congress-1831-1933.yml).

  **He was born in Columbia County, Pennsylvania, in 1826, and the book that says so had been in
  this catalog for a year.** "Charles Nelson Lamison was born in Columbia County, Pennsylvania, in
  1826. His remote ancestors were of French and Welsh nationality; his immediate ancestors were
  Dutch and Scotch. When 10 years of age he came with his father to Dalton, Wayne County, Ohio."
  He read law from seventeen, was admitted at Wooster in 1848, partnered a congressman at Dalton,
  married Elizabeth Moyer of Wooster in 1850 and left for the California gold fields within the
  year, and came back in 1852 meaning to settle at Logansport in Indiana — he passed through Lima
  on the way and stayed. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), its biographical
  half, read in both scans. He is the one member of the county's six for whom the federal record
  has no birthday, and this is not a federal source.

  **He died on 25 April 1896, at Topeka in Kansas.** "DEATH OF EX-CONGRESSMAN LAMISON. Lima, Ohio,
  April 25.—A telegram from Topeka announces the death of ex-Congressman [Lamison]." [verified] —
  [Chronicling America](../../catalog/chronicling-america.md), the *New-York Tribune* of 26 April
  1896. Nine months before he died he was at Willard's Hotel in Washington telling a reporter whom
  the Ohio Democracy should run for governor. [verified] — the same archive, the *Evening Star* of
  12 July 1895.

  **The same book disagrees with its own roster about when he was first elected prosecutor.** Its
  biographical half has him elected in 1853, defeated in 1855 and elected again in 1857; its
  "Roster of County Officials" has him elected in 1852 to fill the seat Mathias H. Nichols
  resigned, and again in 1857. [verified] — the same source, its two halves; see
  [the tenure](../tenure/prosecutor-1852-charles-n-lamison.yml). The corpus keeps the roster's
  reading, which is the dated list, and records that the book contradicts it. [inference]

  [open] His rank. The corpus holds four descriptions of it across two books — captain, major,
  colonel and "Col." — and settles none of them.
