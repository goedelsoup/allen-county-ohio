class: person
label: Tammie K. Hursh
description: |
  Judge of the Lima Municipal Court, holding a six-year term that began 2022-01-01. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  The elections roster gives a name, a party and two dates, so this node carries no date of birth,
  no biography and no prior office. Ohio requires an elected county officer to be an elector of the
  county, so the `resided-in` edge below is a legal inference rather than a fact any source states.
  [inference]

  **Admitted to the practice of law in Ohio by examination on 13 November 1995, registration number
  65323.** [verified] —
  [the attorney directory](../../catalog/ohio-attorney-directory.md), which returns a
  Tammie Kay Hursh of that number, an Allen County address of record and an active status. That the
  registrant and the judge are the same person is a match on a name and a county, not an identifier
  either source carries. [inference]

  That address does not corroborate the `resided-in` edge below. The directory lists a business
  address and shows a residence only when no valid business address is on file, so an Allen County
  entry for a judge who sits in Lima is what it would return either way. [verified] — same source,
  its own disclaimer; see
  [an address of record is not a residence](../../decisions/an-address-of-record-is-not-a-residence.yml).
