class: person
label: Benjamin F. Welty
description: |
  The county's prosecuting attorney when the 1906 history was printed, its congressman eleven years
  later, and the reason a Lima post office was nearly rebuilt.

  **He was born on 9 August 1870 and sat in the United States House for Ohio's Fourth District from
  2 April 1917 to 3 March 1921, a Democrat in both Congresses.** [verified] —
  [the congress-legislators file](../../catalog/congress-legislators.md).

  **He took the county's prosecuting attorney's office in 1905 and the 1906 book lists him as its
  present holder.** [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), "Roster of County
  Officials" and "Present County Officers"; see
  [the prosecuting attorney](../office/allen-county-prosecuting-attorney.yml) and
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml).

  **He attacked a federal judge for drawing two salaries and the county remembered him for it.**
  "Interpreters of the law quite frequently become lawmakers, as has been demonstrated in Allen
  County, one solon achieving much notoriety because of his attack on a Federal judge who was drawing
  two salaries — Congressman B. F. Welty criticising Judge Kennesaw Mountain Landis of Chicago."
  [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **He tried and failed to get Lima a new federal building.** "Since 1916, every effort has been made
  by Postmaster J. E. Sullivan and Congressman B. F. Welty to secure an appropriation for a
  much-needed new federal building and site; in the Sixty-sixth Congress an omnibus bill was
  recommended for passage ... however, the bill failed of passage." [verified] — same source. The
  building he was trying to replace is the one [Calvin S. Brice](calvin-s-brice.yml) had secured in
  1895, twenty-one years earlier.

  **The same book records what else he was known for.** It says the county's foreign population "has
  not materially increased in several years, and Congressman B. F. Welty has actively opposed
  indiscriminate immigration from Europe", in a passage that goes on to ask "how long this country
  is to maintain its identity". [verified] — same source, quoted as printed. The same passage says
  the Historical Society had no papers on file showing the county's foreign population.

  **The count existed, and the government he sat in had taken it the year before.** Allen County had
  2,753 foreign-born white residents in 1920 — 627 of them German, 312 Italian, 309 Irish — and
  11,274 people, one in six, who were immigrants or the children of immigrants. [verified] —
  [the 1920 foreign-born count](../measure/allen-county-foreign-born-1920.yml). In Lima, where he
  practised, it was better than one in six: 7,490 of 41,326. [inference] — computed there.

  **He is one of the six the 1921 book claims for the county in Congress, and the federal record
  confirms all six.** [verified] —
  [the county in Congress](../measure/allen-county-in-congress-1831-1933.yml).

  [open] When he died, and whether he was born in the county. Neither history says and the federal
  file records no death.
