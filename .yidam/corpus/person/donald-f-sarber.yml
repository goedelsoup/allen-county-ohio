class: person
label: Donald F. Sarber
description: |
  Sheriff of Allen County, 1933–1935. He took the office after his father,
  [Jess L. Sarber](jess-l-sarber.yml), was shot dead in the county jail on 12 October 1933.
  [verified] — [Allen County Sheriff's Office past-sheriffs roster](../../catalog/acso-past-sheriffs.md)
  and [Chronicling America](../../catalog/chronicling-america.md), whose Lima dispatch of 4 March
  1934 calls the dead man "the elder Sarber, who preceded his son as sheriff".

  He held the jail through the three murder trials that followed, under a National Guard detachment
  and a prosecutor's standing order to shoot the prisoners if Dillinger came back for them.
  [verified] — same dispatch. It is the only thing this corpus knows about how he did the job.

  The roster gives a name and a year range, so this node carries no dates of birth or death and no
  biography outside those two years. [open]

  Ohio requires an elected county officer to be an elector of the county, so a `resided-in` edge to
  Allen County is a legal inference rather than a fact either source states. [inference]
