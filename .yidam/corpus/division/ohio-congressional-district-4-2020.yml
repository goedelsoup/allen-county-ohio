class: division
label: Ohio's 4th congressional district (2020 geography)
description: |
  The United States congressional district covering Allen County at the 2020 census. All 3,552
  of the county's census blocks fall in it. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md). It runs
  to 4,665.374 square miles of land with an internal point at 40.387175, -83.935703.
  [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md).

  **This is the map in force through the 2022 election, and it was superseded on 31 October 2025.**
  Ohio redistricted after the 2020 census and again in 2025; the Census Bureau published no Block
  Assignment File for any later year — `baf2022`, `baf2024`, `baf2025` and `baf2026` all return 404 —
  so the relationship this node rests on could not be recomputed from the same source. It was
  recomputed from a different one: the commission that drew the current map publishes its own block
  assignment file, and it puts the same 3,552 blocks in the same district. See
  [the 2025 map](ohio-congressional-district-4-2025.yml) and
  [the question](../question/allen-county-current-congressional-district.yml).
