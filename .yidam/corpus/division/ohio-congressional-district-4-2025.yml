class: division
label: Ohio's 4th congressional district (2025 map)
description: |
  **The congressional district Allen County is in now.** Under the plan the Ohio Redistricting
  Commission adopted on 31 October 2025, all **3,552** of the county's census blocks are assigned to
  district 4 — the whole county, unsplit. [verified] —
  [the commission's file](../../catalog/ohio-redistricting-commission.md), adopted plan 430, block
  assignment file, aggregated here.

  **It is fourteen counties, eleven of them whole.** Allen, Auglaize, Champaign, Hardin, Logan,
  Marion, Mercer, Morrow, Shelby, Union and Van Wert entire; parts of Clark, Delaware and Richland.
  [verified] — the same file, by county FIPS against
  [the Census county codes](https://www2.census.gov/geo/docs/reference/codes2020/national_county2020.txt).
  Its population is 786,630, exactly the state quota, at a deviation of zero. [verified] — the plan's
  statistics page.

  **Allen County's district did not change, and that is a finding rather than an assumption.** The
  2020 map put all 3,552 blocks in district 4 and this one does the same, so the county's
  twenty-five-year run in the 4th is unbroken. [verified] — this file against
  [the 2020 geography](ohio-congressional-district-4-2020.yml). The corpus could not have known that
  without reading the plan: three of the district's fourteen counties *are* split, and the map was
  redrawn around this one rather than over it. [inference]
