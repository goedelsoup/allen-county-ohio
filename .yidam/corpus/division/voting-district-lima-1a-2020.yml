class: division
label: Lima 1A voting district (2020 geography)
description: |
  A precinct of 1.548 square miles in northern Lima holding 3,240 people and 756 housing units,
  internal point 40.778293, -84.105936. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md), layer 58.

  **It is where three sources disagree with each other in a way that means something.** Its 908
  registered voters are 0.28 per resident, the lowest of the county's 88 precincts against a
  median of 0.68 and a next-lowest of 0.54. [verified] —
  [OpenElections](../../catalog/openelections-ohio.md) against TIGERweb block population. One of
  its 43 blocks holds 1,360 people in **zero** housing units, and set those aside and the ratio is
  0.48 — low, and inside the range the rest of the county occupies.

  So three independent products — a census count, a housing count and a board of elections'
  registration roll — agreed that about 1,400 of this precinct's residents are present without
  households and without registering, and none of them said who they are.

  The county's state correctional institutions stand in this precinct. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md), address points projected and
  tested against the precinct polygon.

  **They are now named, and they are the whole of it.** The block holding 1,360 is
  [Allen Correctional Institution](../site/allen-correctional-institution.yml) and a second block
  in this precinct holds 153 at [Oakwood](../site/oakwood-correctional-facility.yml) — 1,513
  people between them, every one counted in adult correctional facilities, and every person the
  2020 census counted in a correctional facility anywhere in Allen County. [verified] —
  [the group quarters](../measure/allen-county-group-quarters-2020.yml); see
  [the question this closed](../question/who-lives-in-the-county-without-housing.yml).

  **So the precinct's registration ratio is a prison and not a puzzle.** Take both institutions
  out and 908 registrations stand against 1,727 residents — a ratio of **0.53**, which is inside
  the band the rest of the county occupies and above the earlier estimate of 0.48 made with only
  one of the two blocks known. [inference] — computed here. The lowest registration ratio of
  eighty-eight precincts turns out to be an artefact of where the state put two institutions, and
  nothing on the face of the map says so.

  It voted 287 to 234 for Trump over Biden on a 58.4 per cent turnout — nearly the county's most
  balanced precinct in a county that went 69 to 29. [verified] — OpenElections.
