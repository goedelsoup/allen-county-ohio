class: division
label: Ohio Senate District 12 (2023 map)
description: |
  The Ohio Senate district Allen County votes in under the map now in force, adopted 29 September
  2023. [verified] —
  [All About Redistricting — Ohio](../../catalog/all-about-redistricting-ohio.md) and
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **Its number did not change and that is not evidence its ground did not.** The county was in
  [Senate District 12](ohio-senate-district-12-2020.yml) under the map in force at the 2020 census
  and is in a district of the same number now, across a redistricting that renumbered its House
  district from the 4th to [the 78th](ohio-house-district-78-2023.yml). A number surviving a new map
  says the legislature reused it, not that it kept its lines. [inference] This node is separate from
  the 2020 one for that reason, and either may turn out to describe ground the other does not.

  **The county is not split**, on the same reasoning as the House district: the roster names one
  state senator for Allen County. [inference]

  [open] This node has no boundary and no county list. The 2020 node could say Allen County was
  about a seventh of the district by land area; this one cannot say even that.
