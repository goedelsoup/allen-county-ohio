class: division
label: Ohio Senate District 12 (2020 geography)
description: |
  The Ohio Senate district covering Allen County under the map in force at the 2020 census. All
  3,552 of the county's census blocks fall in it, so the county is not split. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md).

  Unlike [House District 4](ohio-house-district-4-2020.yml), it is much larger than the county:
  2,659.11 square miles of land against the county's 402.545, with an internal point at
  40.416995, -84.191133 that lies well south of Allen County's. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md). Allen County is roughly a
  seventh of it by land area. [inference]

  The pair is worth reading together: the same county, entire, inside two nested state
  districts of very different scale, one of which happens to equal it exactly.
