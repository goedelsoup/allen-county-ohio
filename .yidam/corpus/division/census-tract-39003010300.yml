class: division
label: Census Tract 39003010300
description: |
  A 2020 census tract in north-central Allen County: 28.896 square miles of land, internal
  point 40.8240378, -84.1599836. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), national tract file.
  Allen County holds 35 tracts in the 2020 geography. [verified] — same source.

  This node is here to make the division/place distinction concrete rather than theoretical.
  Its internal point lies roughly three quarters of a mile from that of
  [Sugar Creek Township](../place/sugar-creek-township.yml) — 40.824171, -84.173843 — and its
  land area is about 4.8 square miles larger than the township's 24.094. [inference] — both
  figures are verified; the comparison between them is this corpus's, computed from the two
  internal points and areas.

  So the tract and the township very nearly coincide and are certainly not the same ground.
  Any figure published for this tract that is read as a figure for Sugar Creek Township is
  wrong by whatever lies in that 4.8 square miles, and nothing in the shape of the data
  announces the difference.

  [open] Which townships this tract actually covers has not been established. Comparing two
  internal points bounds the answer loosely and does not give it — that needs a boundary file,
  which is what the `nhd`-adjacent TIGER/Line geometry would supply.
