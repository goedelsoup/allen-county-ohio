class: division
label: Census Tract 39003010300
description: |
  A 2020 census tract in north-central Allen County: 28.896 square miles of land, internal
  point 40.8240378, -84.1599836. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), national tract file.
  Allen County holds 35 tracts in the 2020 geography. [verified] — same source.

  **It is 98.5% of Sugar Creek Township plus a fifth of American Township.** Of its 107 blocks,
  90 fall in [Sugar Creek](../place/sugar-creek-township.yml) — 82.1% of the tract's land, 1,192
  people — and 17 in [American](../place/american-township.yml) — 17.9%, 408 people. [verified]
  — [TIGERweb](../../catalog/tigerweb-census2020.md), block composition; the block areas sum to
  the tract's own `AREALAND` exactly, which is the check that they are all of it.

  It holds all but 0.372 square miles of Sugar Creek and adds 5.175 of American, so a figure
  published for this tract and read as Sugar Creek Township's **overstates it by about a
  quarter** — 408 of 1,600 residents live in the other township. [inference]

  Before a boundary source existed the corpus could only compare internal points three quarters
  of a mile apart and infer the tract was "about 4.8 square miles larger". The arithmetic was
  right and the reading was wrong: that phrasing suggests Sugar Creek Township with a margin,
  and a fifth of a second township is in it.
