class: question
label: When was Allen County's government organized?
description: |
  [The county was laid out in 1820](../event/erection-of-allen-county.yml), but under Ohio
  practice a county could exist on paper for years before it had its own courts and officers,
  being attached to a neighbouring county in the meantime. [inference] The corpus places the
  organization about a decade later without a source. [inference]

  The distinction is not pedantic here, because it decides what a date attached to
  [the county government](../jurisdiction/allen-county-government.yml) means. `erected: 1820`
  currently records the laying-out, and if the government did not exist until the 1830s then
  every inference about the county's first decade — who governed it, where its records were
  kept, which court heard its cases — runs through a different county.

  **Corroborating evidence has since arrived, and does not close this.** The Allen County
  Sheriff's Office's own roster records Henry Lippencott as sheriff from 1831 — the earliest
  dated act of county government anywhere in this corpus. [verified] —
  [past-sheriffs roster](../../catalog/acso-past-sheriffs.md). A county with an elected sheriff
  is a county with a functioning government, so 1831 is now a firm *upper* bound on the
  organization date and strong support for the decade the corpus had guessed. [inference]

  It is not a close, and the distinction is worth being exact about. The bar this node set is
  the organizing act or the county's first record volume, and a sheriff's roster is neither: it
  establishes that the government existed by 1831, not that it was organized in 1831 rather
  than in 1829. The question is narrowed, not answered.

  [open] The organization date itself, and the county Allen was attached to before it.
properties:
  claim_tag: open
  opened: 2026-08-28
  would_close_this: |
    The Ohio General Assembly act organizing the county, or the first volume of the Allen
    County commissioners' or common pleas records, whose opening date bounds the answer
    directly.
