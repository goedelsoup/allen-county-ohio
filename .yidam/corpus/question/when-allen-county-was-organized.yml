class: question
label: When was Allen County's government organized?
description: |
  **Answered: 1831, and the commissioners' first recorded sitting was June 6 of that year.**
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), whose
  sixth chapter resumes the commissioners' record meeting by meeting. James Daniels, John G. Wood
  and Samuel Stewart sat with William G. Wood as secretary, granted the petition to organize
  [Jackson Township](../place/jackson-township.yml), authorized a township of Sciota, allowed the
  assessor $11, and ordered a road to the county seat.

  **The gap between 1820 and 1831 was an attachment, and the corpus now knows to which counties.**
  The organic act of 1820 divided the Maumee cession into fourteen counties and provided that
  Allen "be attached to Shelby County for judicial purposes"; Allen was subsequently attached to
  **Mercer** until the organization of 1831. [verified] — same source. That is the exact shape the
  corpus had reasoned to from general Ohio practice and could not name — see
  [the erection of the county](../event/erection-of-allen-county.yml).

  **Its first township was erected by another county's board.** [Amanda](../place/amanda-township.yml)
  was organized in 1830 under authority granted by the commissioners of Mercer County — a year
  before Allen had commissioners of its own. [verified] — same source. A county government's
  prehistory is not empty; it is somebody else's minutes.

  **Two independent sources agree, and on a name as well as a year.** The Allen County Sheriff's
  Office's roster records Henry Lippencott as sheriff from 1831. [verified] —
  [past-sheriffs roster](../../catalog/acso-past-sheriffs.md). The 1885 book, working from the
  commissioners' book, has the board appointing Henry Lippincott in October 1831 to prepare plans
  for confining Uri Martin. Two records kept by different offices for different purposes put the
  same man in the same county in the same year. [inference]

  **A second historian, working thirty-six years later, gives the same date.** "This was effected in
  advance of the formal local organization of Allen County June 6, 1831, from which time official
  business was all transacted within the bounds of the county." [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). It adds that Lima
  became the seat of government on **March 3, 1831** — three months before the board first sat, so
  the county had a county seat before it had a government — and that the first court proceedings on
  June 6 were held in James Daniels Sr.'s cabin on the bank of the Ottawa River, Daniels being one
  of the three commissioners who sat that day. [verified] — same source.

  **What is answered and what is not.** This node asked when the government was organized, and 1831
  is now supported by a resume of the commissioners' record, a chapter heading that dates the
  county's politics from it, and a sheriff's roster. The bar it originally set — the organizing act
  itself, or the first record volume — is still not met, and one thing genuinely remains: the
  book gives a year for the organization and a date only for the board's first meeting.

  **That residual is now closed too, and the answer is yes.** "Allen County was erected by act of
  February 12, 1820, and was **organized by act of February 9, 1831**." [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), both scans
  identical. So there are three dates and they are three different things: the county was created in
  1820, organized by statute on February 9, 1831, and its commissioners first sat on June 6, 1831 —
  four months after the act and three months after Lima became the seat of government on March 3.
  The corpus asked whether an act named an earlier date in 1831. It did.
properties:
  claim_tag: verified
  opened: 2026-08-28
  closed: "2026-08-29"
  resolution: |
    1831. The Allen County commissioners first sat on June 6, 1831; before that the county was
    attached to Shelby and then to Mercer for judicial purposes, and its first township was
    organized by Mercer's board in 1830. Closed on a secondary source that resumes the
    commissioners' record, corroborated on a named person by the sheriff's roster. The residual
    question — the exact organizing act — is recorded in the description rather than left as a
    standing question, because it is a refinement of an answer and not the absence of one.
  would_close_this: |
    The Ohio General Assembly act organizing the county, or the first volume of the Allen
    County commissioners' or common pleas records, whose opening date bounds the answer
    directly.
