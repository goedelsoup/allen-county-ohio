class: question
label: When Lima's first congregation was organized
description: |
  Two county histories name two denominations as first in Lima and give three dates between them,
  and no source held here settles it.

  **The 1921 book says the Methodists.** "It would seem that the Methodists were first in Lima. The
  cornerstone at Trinity indicates as much; the whole story is told in imperishable stone; in 1829
  there was a mission; in 1832 there was a church organization." And then, on the same page, "there
  are divergent accounts of the organization of Trinity, one writer saying that in 1833 John
  Alexander and James Finney, missionaries from St. Marys, visited the community and established the
  church. It seems that Patrick G. Goode had organized a Sunday school two years earlier."
  [verified] — [the 1921 history](../../catalog/rusler-allen-county-1921.md). So the same page
  offers 1832 from a stone and 1833 from a writer, and a Sunday school in 1831 that was not a
  church.

  **The two books also disagree about the Presbyterians' day.** 1 August 1833 with nine people
  named, against 24 August 1833 with fourteen charter members. [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md) and
  [the 1921 history](../../catalog/rusler-allen-county-1921.md); see
  [the Market Street church](../organization/market-street-presbyterian-church.yml).

  **What the disagreement is not.** It is not a conflict about which century or which decade: every
  account puts a first congregation in Lima between 1829 and 1833, in a town that had no government
  until 1842 and in a county organized in 1831. The corpus can say the county seat had organized
  religion before it had a corporation. [inference] It cannot say which body had it first.

  **The 1921 book also disqualifies the earliest candidate itself.** "While the Fort Amanda church
  effort was prehistoric as far as the Allen County of today is concerned" — a reference to the
  mission activity around [Fort Amanda](../site/fort-amanda.yml), which the book sets aside rather
  than counts. [verified] — same source.
properties:
  claim_tag: open
  opened: "2026-09-01"
  would_close_this: |
    The session records of the Market Street Presbyterian Church, or Trinity's own church register,
    or the minutes of the Ohio Conference of the Methodist Episcopal Church for 1829–1833. Failing
    those, a Lima newspaper of the period — but the earliest title the county is recorded as having
    printed is 1843, ten years after the fact, so no contemporary local press exists to consult.
    See [the county's newspapers](../measure/allen-county-newspapers-1843-2026.yml).
