class: question
label: When did Allen County stop being nine-tenths farmland?
description: |
  Allen County held 240,472 acres in farms in 1910, 92.5 per cent of its land, and 178,921 acres in
  2022, 69.4 per cent of it. [verified] —
  [Abstract of the Thirteenth Census](../../catalog/census-1910-abstract-supplement-ohio.md) and
  [the Census of Agriculture](../../catalog/usda-census-of-agriculture.md); see
  [the 1910 farms](../measure/allen-county-farms-1900-1910.yml) and
  [the modern series](../measure/allen-county-farms-2002-2022.yml).

  **Nine-tenths of that loss is inside a window this corpus cannot see.** By 2002, the first year of
  the modern series, the county was already down to 188,150 acres. So 52,322 of the 61,551 acres
  went between 1910 and 2002, and 9,229 in the twenty years since. [inference] — computed here.

  The same window swallows every other change the two ends disagree about. The horses were 14,676 in
  1910 and 618 in 2002. The sheep were 41,240 and 835. Oats took 30,156 acres and then 194. Soybeans
  were not a crop in this county in 1909 and were its largest in 2002. Every one of those turned
  somewhere in ninety-two unmeasured years. [verified] — same two sources.

  **It did not leave at a steady rate, and the sharpest stretch is four years long.** Two printed
  census volumes now reach into the window, each carrying the census before it, so the corpus holds
  1950, 1954, 1982 and 1987 at county grain. [verified] —
  [the historical volumes](../../catalog/census-of-agriculture-historical.md); see
  [the bridge](../measure/allen-county-farms-1949-1987.yml).

      1910   240,472 acres   92.5 per cent of the county
      1950   227,944
      1954   215,018         81.9 per cent
      1982   197,256
      1987   201,190         77.7 per cent
      2002   188,150
      2022   178,921         69.4 per cent

  **Twenty-one per cent of the century's loss is in the four years 1950 to 1954** — 12,926 acres, at
  3,232 a year against 313 a year for the forty years before. [inference] — computed from the seven
  figures above. Ohio lost 4.66 per cent of its land in farms over the same four years and this
  county 5.67, so it is a national turn falling harder here. [verified] — the 1954 volume's state
  column.

  **Two of the four candidate explanations survive and two do not.** Drainage failure and the oil
  field are both nineteenth- and early-twentieth-century, and the loss to 1950 is the flattest
  stretch in the record — 313 acres a year across the whole of that period. What the four-year
  collapse coincides with is the postwar reorganisation of farming itself: the county lost 18.1 per
  cent of its farms in those four years against 11.2 for Ohio, and its mean farm rose from 89.0
  acres to 102.5. [inference] Lima's annexations and the interstate are still on the table and this
  corpus has not tested either against these years. [open]

  **What the crops did, the question can now date.** Soybeans passed oats between 1949 and 1954:
  26,213 acres of oats against 17,393 of soybeans in 1949, and 22,498 against 22,991 five years
  later. [verified] — the 1954 volume, County Table 9. Oats were still a major crop in 1954 and were
  down to 194 acres by 2002, so their collapse is entirely after this window.

  **What the sheep did, it can half-date.** 41,240 in 1910, 16,150 in 1950, 17,194 in 1954, 835 in
  2002 — 62 per cent of the fall before the window opens and the rest after it closes. [verified] —
  the three sources.

  **Closed. Eighteen census years, no gap wider than fifteen, and the answer is that it did not
  go once.** Nine of the seventeen intervals in the completed record are rises: 87,824 acres left
  the county's farms and 26,273 came back, three returned for every ten lost. [verified] —
  [the historical archive](../../catalog/agcensus-archive-1925-1978.md); see
  [the whole series](../measure/allen-county-farmland-1910-2022.yml).

  **The question asked when, and the answer has four dates rather than one.** The county's farmland
  peak is 1920, not 1910. The largest single loss in the record is the 13,239 acres between 1920 and
  1925 — larger than the 12,926 of 1950 to 1954 that this question published as the sharpest stretch
  of the century, and invisible to it. Two more losses of about ten thousand acres each follow, 1935
  to 1940 and 1969 to 1978. [verified] — same series.

  **The finding this question was built on survives, on the measure it was made on.** 1950 to 1954
  is four years and 1920 to 1925 is five, so 3,232 acres a year against 2,648 leaves 1950–54 the
  fastest loss in the record. It is no longer the only one of its size. [inference] — computed
  there.

  **The forty years this question called the flattest stretch are the least flat.** They net 313
  acres a year and contain 23,400 acres of loss and 10,872 of recovery, including the largest single
  fall of the century and the largest single rise. The farm count peaks in 1935 at 3,016, above
  1910's 2,939, and the farmland rises with it. [inference] — same series.

  **What this leaves for the two candidates the question kept.** Lima's annexations and the
  interstate are neither tested nor ruled out here, and what the filled years add is a constraint on
  any explanation of them: the county's farmland **grew** by 9,815 acres across the 1959, 1964 and
  1969 censuses, which share a farm definition. Whatever took the land, it gave some back in the
  middle. [inference] — same series.

  [open] Nothing about the shape of the loss. What is not established is any cause for any of the
  four falls, and this corpus holds no source that would carry one.
properties:
  claim_tag: verified
  opened: "2026-08-30"
  closed: "2026-09-02"
  resolution: |
    Allen County's land in farms is on record for eighteen census years from 1910 to 2022 with no
    gap wider than fifteen, and the question's premise — that the farmland went, at some datable
    moment — is half wrong. It went four times and came back nine, losing 87,824 acres gross and
    recovering 26,273. Its peak is 1920 and not 1910; its largest single loss is 1920 to 1925 and
    not 1950 to 1954, though 1950 to 1954 remains the fastest per year; and the forty years called
    the flattest stretch in the record contain both the largest fall and the largest rise.
  would_close_this: |
    One agricultural census at county grain between 1910 and 2002, and preferably three. The census
    was taken in 1920, 1925 and then every five years to 1954, every four or five to 1978, and every
    five to 1997; the Census Bureau conducted it through 1992 and NASS from 1997. Each printed
    volume carries an Ohio county table of farms, land in farms, crop acreage and livestock — the
    same rows this question is short of.

    NASS's own online publication begins at 2002 and does not reach back: the bulk Quick Stats
    extracts stop there, `qs.census1997.txt.gz` does not exist, and the Cornell historical archive
    that used to hold the scans now redirects into nass.usda.gov without them. So the volumes are
    the shelf and the route to them is not NASS. This names a shelf and not an answer, which is
    what [asking the volume just after the gap](../../decisions/ask-the-volume-just-after-the-gap.yml)
    says to do when the obvious source has been tried.

    Four of them were read from archive.org, which holds the Ohio volumes for 1954 and 1987 as page
    scans, and each volume prints the census before it — so two books gave 1950, 1954, 1982 and
    1987. Eleven more were named as needed and recorded as not found.

    **The paragraph above was wrong about the shelf, in the sentence that mattered.** It said the
    Cornell historical archive "now redirects into nass.usda.gov without them". It redirects into
    nass.usda.gov **with** them: the whole archive is mirrored at `/AgCensus/archive/`, twenty-eight
    census years, a page per state part and a separate PDF for every table in it. Nine Ohio volumes
    read there closed the question outright. The lesson is the one this repository keeps relearning
    — a redirect was tested for where it went and not for what was at the end of it.
