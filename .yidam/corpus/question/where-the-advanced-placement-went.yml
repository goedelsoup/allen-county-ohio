class: question
label: Why did Allen County's high schools stop offering Advanced Placement?
description: |
  **Six of this county's ten high schools offered an Advanced Placement course in 2013 and two do
  now.** The Advanced Placement enrolment fell from 270 pupils to 132 on a high-school roll that
  barely moved, from 4,917 to 4,836. [verified] —
  [the Civil Rights Data Collection](../../catalog/crdc-civil-rights-data-collection.md), read in
  [the course offerings](../measure/allen-county-course-offerings-2013-2021.yml) and
  [the coursework](../measure/allen-county-advanced-coursework-2021.yml).

  [open] Why any of the four stopped.

  **The four that changed did not change together.** Lima Senior answered yes in 2013, no in 2015
  and 2017, yes in 2020 and no in 2021. Spencerville answered yes once, in 2013. Bath and Allen East
  answered yes four times and no in 2021. Shawnee and Elida answered yes in all five collections;
  Apollo, Bluffton, Perry and West Central answered no in all five. [verified] — the same source,
  its 2013, 2015, 2017, 2020 and 2021 collections of the offerings file.

  **Lima Senior is most of the fall and all of the racial part of it.** It enrolled 67 pupils in 2013,
  thirteen of them Black, and those thirteen were nearly half of every Black Advanced Placement pupil
  in the county that year; the county's Black AP enrolment has run 29, 6, 4, 3 since. [verified] — the same source,
  its 2013 rows for that school, read in
  [the coursework](../measure/allen-county-advanced-coursework-2021.yml).

  **What would answer it, and what this corpus holds instead.** A board minute, a course catalogue,
  a College Board school report, or a district's own audit of who sat the examinations — none of
  which is federal and none of which this corpus has read. What it has is a yes-or-no answer to a
  federal questionnaire every second year, with no date inside the year and no reason beside it.
  [inference]

  **Three explanations fit the file equally well and it separates none of them.** A district may
  have moved its advanced pupils into College Credit Plus, which grants a real college credit at the
  state's expense and which this county uses more than Ohio does; it may have lost the certified
  teachers the courses need, which the same collection stopped measuring after 2017; or it may have
  had too few pupils electing them to run a section. [inference] — the reading is this corpus's,
  against [the dual enrolment](../measure/allen-county-dual-enrollment-2017-2021.yml) and
  [the staffing](../measure/allen-county-school-staffing-1992-2024.yml).

  **The substitution story is the strongest of the three and it does not close the question.** The
  county's College Credit Plus enrolment rose from 458 to 492 while its AP enrolment fell 138 — so
  the substitution, if that is what it is, replaced fewer than a quarter of the lost seats. And at
  Lima Senior, where most of the loss sits, College Credit Plus went from 49 to 48. [verified] — the same source,
  its dual-enrolment files, read in
  [the dual enrolment](../measure/allen-county-dual-enrollment-2017-2021.yml).

  **The one thing the file rules out is that the pupils left.** The county's high-school roll fell by
  81 of 4,917 between 2013 and 2021, 1.6 per cent, against an Advanced Placement enrolment that fell
  by 51.1 per cent and a Black Advanced Placement enrolment that fell by 89.7. [verified] — the same
  source's enrolment files for the two years.

  **This corpus does not infer that any district decided against the courses.** A programme can end
  because nobody renewed it. What the file records is that the answer changed, not that anyone
  changed it.

  [open] Why Lima Senior High School's answer went no, no, yes, no across four collections. Either
  it ran an Advanced Placement course in 2020–21 and in no year around it, or one of the four
  answers is wrong, and the file gives no way to tell which.

properties:
  claim_tag: open
  opened: "2026-09-05"
  would_close_this: |
    A district's own record of the decision. Lima City Schools' board minutes for the 2013–14 and
    2014–15 school years, and Bath's and Allen East's for 2020–21, would carry a vote or a budget
    line where the federal file carries only a changed answer. A course catalogue or programme of
    studies for any of those years would show what was on offer and what replaced it. The College
    Board publishes a school-level participation report to each district and not to the public.
    None of the four is federal, none is in this corpus, and all four exist.

    Failing those: Ohio's own report-card file carries an advanced-coursework measure by district
    for years this corpus has not read, which would date the change inside the year and would say
    whether the 2020 yes at Lima Senior is real.
