class: question
label: "? Fifteen of the twenty wettest days in the county's record have no event"
description: |
  **The Lima station has 45,273 days carrying a precipitation reading, from 1 April 1901 to
  26 August 2026. Sorted, its twenty largest days hold five events this corpus has written and
  fifteen it has not.** [verified] —
  [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551, the whole file ranked here
  and matched against every `event` node's `occurred` span within two days.

      rank  date          inches  event
         1  2007-08-21      5.08  the flood of 22 August 2007
         2  2015-06-16      4.93  the flood of 16 June 2015
         3  2021-09-22      4.40  —
         4  1981-06-14      4.38  —
         5  1915-07-16      4.02  the flood of 16 July 1915
         6  1937-09-05      3.86  —
         7  2017-07-11      3.66  —
         8  1969-09-17      3.65  —
         9  1904-04-01      3.40  —
        10  1913-03-25      3.35  —
        11  1935-07-13      3.35  —
        12  1933-08-10      3.33  —
        13  2019-04-26      3.26  the flood at Bluffton, 26 April 2019
        14  2005-08-31      3.25  —
        15  1922-07-08      3.22  —
        16  2022-07-18      3.20  —
        17  1912-07-16      3.15  —
        18  1933-09-27      3.10  —
        19  1959-09-02      3.04  the cloudburst of 1 September 1959
        20  1995-10-05      3.03  —

  **This is a question and not a defect list.** A wet day is not a flood — the twentieth entry
  here is [the cloudburst of 1 September 1959](../event/the-cloudburst-of-1-september-1959.yml),
  which put 77.2 mm on this gauge and raised the Ottawa by 168 cubic feet a second, and the
  county's largest measured flow came from the same 77.2 mm falling on frozen ground seven months
  earlier. [verified] Some of these fifteen days will have flooded nothing. What the corpus cannot
  presently say is *which*, and that is the question.

  **Three of the fifteen are already accounted for and their entries here are still worth
  reading.** 1 April 1904 and 25 March 1913 are the floods this corpus has repeatedly said lie
  outside every instrument record it can reach; ranks nine and ten say that they are inside *this*
  one, and that the reach that is missing is a witness, not a measurement. [verified] — see
  [the Bluffton News and the archives that cannot reach 1913](../../catalog/chronicling-america.md).
  14 June 1981 is one of the five flood-insurance clusters the county's federal storm record has no
  row for. [verified] —
  [the storm record](../measure/allen-county-storm-events-1950-2026.yml); see
  [a flood needs two records](../../decisions/a-flood-needs-two-records.yml). The gauge is the
  third record and it agrees with the claims file against the storm file.

  **And rank three is the sharpest of them.** 22 September 2021 is the third wettest day in a
  hundred and twenty-five years of this station, and the county's federal storm record holds no
  flood of any kind after 9 July 2020. [verified] — the same two sources. Either nothing happened
  on the wettest day of the last decade, or the file that is supposed to hold it stopped being
  filled; nothing here settles which.

  **Five of the fifteen are now settled, four stand as a flow nothing answers, and six cannot be
  settled at all — and the split is not where this node expected it.** Carried to the county's own
  gauges, one was a flood and four were not. Of the six that remain, four predate every gauge on
  these rivers and two fall in holes in them. [verified] —
  [the twenty days read against the rivers](../measure/the-twenty-wettest-days-against-the-river.yml).

  **The sharpest of them is answered and the answer is the dull one.** 22 September 2021 raised the
  Ottawa at Lima from 4 cubic feet a second to 704 — fourteenth of its own water year — and drew no
  insurance claim within three days. The storm record's silence is correct. It also was not asleep:
  it holds nine Allen County rows for 2021, one of them a tornado. [verified] — the same node. The
  paragraph above offered two readings and the second, that the file had stopped being filled, is
  refuted.

  **And the largest thing this node was pointing at was not on its list.** 13–14 June 1981 is the
  second-largest daily mean ever measured on the Ottawa at Allentown and drew the third-largest
  cluster of insurance claims in the county's record, and the corpus had no event for it. [verified]
  — [the flood of 13–14 June 1981](../event/the-flood-of-13-14-june-1981.yml).

  [open] What the six unsettleable days did, and whether the four high flows reached anything.
  27 September 1933 took its water year's peak at Allentown and has no second record of any kind —
  the insurance file opens in 1978 and the storm file in 1950 — so it is a flow and not yet a flood,
  per [a flood needs two records](../../decisions/a-flood-needs-two-records.yml).
properties:
  claim_tag: open
  opened: 2026-09-08
  would_close_this: |
    The six days no gauge can reach, carried to a witness. Four — 1904, 1912, 1913 and 1922 — are
    older than the gauges, which begin on 1 October 1923; two fall in holes, 1937 in the hiatus that
    stopped both rivers from 1 January 1936 and 2005 in the nine-and-a-half-year gap at Lima.
    **All six are an acquisition and not a query**, and this corpus has now said so five times: no
    digitized Lima paper survives after 1 March 1912, and the archives that hold the rest are on
    microfilm at the Allen County Museum and Bluffton University.

    **Two of the seven already have half a witness.** The county's own flood insurance study names
    an Ottawa River flood in **April 1904**, and 1 April 1904 is the wettest day of that spring
    under the wettest prior month of any day on this list — 8.02 inches in the preceding thirty.
    [verified] — [the study](../../catalog/fema-flood-insurance-study.md) and
    [GHCN-Daily](../../catalog/ghcn-daily-lima.md). It names **January 1937** and not September, so
    the 1937 day on this list is not that flood.

    **For the two settled by gauge alone**, a second record: a Delphos, Lima or Bluffton newspaper
    of September 1933, or a USGS water-supply paper for the 1933 water year, which describes floods
    in prose beside the tables this corpus reads as numbers.
