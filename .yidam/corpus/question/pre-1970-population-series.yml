class: question
label: What was Allen County's population before 1970, and when did Lima peak?
description: |
  Allen County's population is on record at 111,144 in 1970 and 100,866 in 2024, and Lima's
  at 40,307 in 2000. [verified] —
  [1970–1979 county estimates](../../catalog/census-county-estimates-1970s.md),
  [Vintage 2024 estimates](../../catalog/census-popest-2024.md) and
  [2000–2010 intercensal estimates](../../catalog/census-intercensal-2000-2010.md). No source
  reaching earlier than those has been retrieved, so the corpus's county series begins at 1970
  and its Lima series at 2000 — see
  [the 1970 census count](../measure/allen-county-population-1970.yml).

  Two specific things were unknown when this was opened, and they mattered differently. Both are
  answered now; the two paragraphs that follow are the question as it was posed, kept because the
  answers are only legible against them. [inference]

  **The county's 1900–1960 series** would show whether 1970 was the peak or merely a late
  point on a plateau. The corpus asserted a decline *from* 1970 because 1970 was the earliest
  figure it had, which was a fact about the sources retrieved and not about the county. If the
  county was already falling before 1970, or still rising, the
  [depopulation](../period/depopulation.yml) node's start date was wrong. It was
  wrong, in the third of the three ways: the county was still rising. [inference]

  **Lima's own peak** is the sharper gap. Every claim in this corpus that Lima's decline was
  steeper than the county's rested on figures from 2000 onward, and the city's industrial
  employment fell well before that. The corpus held no Lima figure earlier than 2000 and could not
  locate the city's largest year, though it named a period beginning in 1970 partly on that basis.
  [inference]

  This is the gap most likely to be filled by mistake rather than by research: a plausible
  peak figure for Lima is easy to find in secondary sources and easy to write down, and it
  would be the first unsourced number in a corpus whose population figures are otherwise all
  primary.

  **Answered for the county, and the answer corrects this corpus.** The series is complete from 1830
  except for 1930: 73,303 (1940), 88,183 (1950), 103,691 (1960), 111,144 (1970), **112,241 (1980)**,
  109,755 (1990). [verified] — [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md), Table 3; see
  [the 1940–1990 series](../measure/allen-county-population-1940-1990.yml). **The peak is 1980.**
  This node was opened to ask whether 1970 was a peak or a late point on a plateau, and it was
  neither: the county went on growing for a decade after the date the corpus had named for the start
  of its decline.

  **Answered for Lima to 1970, and the earlier conclusion here was wrong.** The city was 53,734 in
  1970 against 40,307 in 2000. [verified] — [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md); see
  [Lima 1970–1990](../measure/lima-population-1970-1990.yml). One phase ago this node reasoned from
  41,306 in 1920 and 40,307 in 2000 that eighty years netted to nothing and the peak was unlocatable.
  Two points that happen to be level are not a plateau, and the corpus had drawn a chord across a
  rise and a fall. Lima 1930–1960 was still missing when that was written, and it no longer is.

  **Both halves have moved, and the second one has moved the most.**

  For the county, the series now runs 578 (1830) through 47,976 (1900) and 68,223 (1920) to the
  111,144 of 1970 the corpus already held. [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md) and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the county series](../measure/allen-county-population-1830-1900.yml). **Every decade rises.** So
  the county's 1970 peak is no longer an artefact of where the corpus's data began — it is a peak
  with ninety years of ascent behind it and no earlier candidate. What remains missing for the
  county is 1930 to 1960, four counts, and nothing in the shape so far suggests a reversal inside
  them. [inference] (Three of the four arrived the phase after that was written, and there *was* a
  reversal — just later, in the 1970s. One count is missing now: 1930.)

  For Lima the answer runs the other way and is sharper than the question expected.
  [The city](../measure/lima-population-1880-1920.yml) was 7,567 in 1880, 21,723 in 1900 and
  **41,306 in 1920** — against 40,307 in 2000. **Lima was already at about its 2000 size in 1920.**
  (Both halves of that sentence are wrong: the figure is 41,326 and the city was thirty per cent
  below its peak.)
  [inference] The gap this node called "the sharper gap" is not a gap in a rising line; it is eighty
  years that net to roughly nothing, inside which the peak sits somewhere the corpus still cannot
  see. The city's decline is real and its starting point is now known to be earlier than 1970 or
  later than 1970 but certainly not derivable from 1970.

  That paragraph is superseded twice over: the 1920 figure is 41,326 rather than 41,306, and the city
  was not close to its 2000 size in 1920 — it was thirty per cent below its own peak. The reasoning
  stands as a record of how a chord across a rise and a fall gets described as a level.

  **A nineteenth-century series has arrived, and it makes the problem worse before it makes it
  better.** The county totalled 578 in 1830 and 9,079, 12,116, 19,185, 23,623 and 31,314 at the
  five censuses from 1840 to 1880. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), statistics chapter,
  both scans agreeing. But the same table footnotes eight of its townships as having gone to
  Auglaize County, and the county gained Sugar Creek, Monroe, Richland and Spencer in the same
  act. [verified] — same source. **The 1830 and 1840 figures count a different county**, and no
  amount of later data repairs that — see
  [the reorganization of 1848](../event/reorganization-of-1848.yml). The 1900–1960 stretch this
  node actually asks about is still unretrieved, and now sits between two series that are not
  each other's continuation.

  **Closed. Both halves answered, and the second one on the last try.** The 1960 Census volume's
  Table 5 gives Lima twelve decennial counts from 757 in 1850 to 51,037 in 1960 — 42,287 in 1930,
  44,711 in 1940, 50,246 in 1950 — every one of them rising and every one below the 53,734 of 1970.
  [verified] —
  [1960 Census, Number of Inhabitants, Ohio](../../catalog/census-1960-number-of-inhabitants-ohio.md);
  see [the federal series](../measure/lima-population-1850-1960.yml). **Lima peaked at the 1970
  census.** The county's peak is 1980. Both dates are now argued from complete decennial series
  rather than placed at the edge of a retrieval.

  **What this node feared did not happen, and is worth saying so.** It was opened warning that this
  was "the gap most likely to be filled by mistake rather than by research: a plausible peak figure
  for Lima is easy to find in secondary sources and easy to write down, and it would be the first
  unsourced number in a corpus whose population figures are otherwise all primary." Four phases and
  three federal publications later, every figure in both series is a Census count with a table and a
  page behind it. [verified] The warning did its job by being written down where the temptation
  would be felt.

  [open] Allen County in 1930 — one count, between the 1921 history's 68,203 for 1920 and the
  73,303 of 1940. It is recorded here as a residual of an answer rather than left standing as a
  question, because the series' shape across it is not in doubt: every decade from 1830 to 1980
  rises, and 1930 sits between two of them.
properties:
  claim_tag: verified
  opened: "2026-08-28"
  closed: "2026-08-29"
  resolution: |
    Allen County's decennial population is on record from 1830, complete but for 1930, and its peak
    is 1980. Lima's is on record from 1850, complete, and its peak is the 1970 census — every count
    before it rises and every count after falls. The question asked when Lima peaked and whether
    1970 was a peak or a late point on a plateau; it was neither for the county, which went on
    growing to 1980, and it was the peak for the city.
  would_close_this: |
    For the county, the Census publication "Population of States and Counties of the United
    States: 1790–1990" (a 14.9MB PDF located but not read), or the 1900 Ohio bulletin
    "Population of Ohio by Counties and Minor Civil Divisions" for the nineteenth-century
    series. For Lima, a place-level decennial series — the 1970 and 1980 Census of Population
    volumes for Ohio, which the county-level file used here does not cover.

    What actually closed it was the right family and the wrong decade: the **1960** volume, not the
    1970 or 1980 ones. Each decennial "Number of Inhabitants" volume carries a table reaching back
    to each place's earliest census, so the volume to ask is the last one before the gap closes,
    not the first one after it. Worth remembering the next time this field is filled in.
