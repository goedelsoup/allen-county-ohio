class: question
label: What became of German and Ottawa townships?
description: |
  **Both answered.** In 1885 Allen County had thirteen townships. One was renamed and one was
  eaten by a city, and the county's twelve are what is left.

  **German became American on August 16, 1918.** The citizens petitioned and the Allen County
  commissioners acted — the same instrument that erected every township here and incorporated every
  village. Article II of the petition says only "that good cause is shown why the name of said
  township should be changed", and stipulates that the change "shall in no wise affect the right of
  property, or the internal concerns of said township". [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), which reads
  the language for what it is: "'good cause' means patriotism." School books were being reset and
  businesses were dropping the word; the township "were caught in the wave of popular sentiment".
  The corpus had declined to assert the obvious motive. It was the obvious motive, and the same page
  records that it was contested — residents "who a little later on would not have voted for the
  change, because of sacred associations in early history". See
  [American Township](../place/american-township.yml).

  **Ottawa was not abolished. Lima grew until it was the same ground.** It was erected in May 1857
  because "Lima was spreading out into so many townships that Ottawa was created in order to shelter
  it" — 1,600 acres from [Bath](../place/bath-township.yml), 1,040 from German, 560 from
  [Perry](../place/perry-township.yml) and a quarter section from
  [Shawnee](../place/shawnee-township.yml), which is the same composition the 1885 book gives, acre
  for acre, thirty-six years earlier. [verified] — same source and
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  By 1921 it was a shell: "today it is not recognized only in the election of a justice of the peace,
  constables and by the county infirmary board of directors... the township a nonentity and Lima the
  unit of the tax duplicates. **The City of Lima is coextensive with it.**" [verified] — same source.
  So the answer is not an act of abolition but sixty years of annexation, ending in a township whose
  boundary and whose city's boundary were the same line. [inference]

  **A township made to hold a city was consumed by it, which is what it was for.** Ottawa existed
  only because Lima was outgrowing Bath, and the 1857 commissioners called 3,360 acres a "liberal
  allowance for the future growth of the seat of justice". Lima passed it. [inference]

  **It may never have formally ceased, and the corpus was looking for the wrong kind of event.** The
  Census Bureau's Ohio user note says: "the Census Bureau, in agreement with the State of Ohio, does
  not recognize an Ohio township that is coextensive with a village or a city, and treats such places
  as independent of any MCD." [verified] — [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md). So Ottawa's absence from every present-day federal
  source this corpus holds is explained by a **reporting rule**, not by an act of abolition — and the
  rule's condition is exactly the state the 1921 historian described, the city being coextensive with
  the township. [inference]

  **The Census Bureau called it nonexistent, in 1952, in a footnote.** "Lima city in Bath, Perry,
  and Shawnee townships returned in 1940 as coextensive with nonexistent Ottawa township."
  [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Table 6, Allen County footnote. That is thirty years earlier than the reporting rule this node
  already quotes and much blunter, and it is the word "nonexistent" that has to be read carefully:
  it is a statement about what the Bureau would recognize as a minor civil division for the 1950
  tabulation, not a finding of Ohio law. [inference] The 1885 and 1921 histories both describe
  Ottawa's erection in May 1857 with its acreage, so it existed; what the Bureau is saying is that
  by 1940 it should not have been used, and that the 1940 return which did use it was wrong.

  **And the 1950 volume puts Lima back into exactly the four townships Ottawa was carved out of.**
  Its Table 6 splits the city across [American](../place/american-township.yml) (19,270),
  [Bath](../place/bath-township.yml) (17,469), [Perry](../place/perry-township.yml) (10,895) and
  [Shawnee](../place/shawnee-township.yml) (2,612), summing to Lima's own 50,246. [verified] — same
  source. Ottawa was made in 1857 from 1,600 acres of Bath, 1,040 of German — which is American —
  560 of Perry and a quarter section of Shawnee. The same four, ninety-three years apart. [verified]
  — same sources as above. The city had long since outgrown Ottawa's 3,360 acres, so this is not the
  original carve reappearing; it is evidence that Lima grew outward from Ottawa without ever
  crossing into a fifth township. [inference]

  **And Ottawa is measured, by name, in a federal table — with its own count, not the city's.** The
  1910 supplement lists "Ottawa township, coextensive with Lima city" at 30,508, 21,723 and 15,987
  for 1910, 1900 and 1890, and Lima city on the line beneath at 30,508, 21,723 and **15,981**.
  [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the 1890–1910 divisions](../measure/allen-county-townships-1890-1910.yml).

  **Six people, and they date the coextension.** The difference at 1890 is not a misprint: without
  it the county's 1890 column does not sum to 40,644, and it does with it. [verified] — arithmetic
  on the printed figures. So Ottawa Township held six residents outside Lima city in 1890 and none
  at either census after. **The township and the city became exactly the same ground between the
  1890 and 1900 censuses** — thirty-three years after Ottawa was erected to make room for a city
  that then filled it entirely. [inference] The 1921 historian's "the City of Lima is coextensive
  with it" was already true in 1900 and had a date to within a decade.

  [open] Whether Ottawa Township still legally exists. The Census's "nonexistent" is about
  tabulation and this node will not read it as an answer about the statute. The corpus no longer has a reason to assume it
  was abolished, and no evidence that it was not. `jurisdiction.abolished` is declared and still unused — see
  [an unused property is an unasked question](../../decisions/an-unused-property-is-an-unasked-question.yml).
properties:
  claim_tag: verified
  opened: "2026-08-29"
  closed: "2026-08-29"
  resolution: |
    German Township was renamed American on August 16, 1918, by the county commissioners on the
    citizens' petition, in the anti-German sentiment of the war. Ottawa Township was never
    abolished within the reach of any source held here; Lima annexed until the two were coextensive
    and the township survived in 1921 only to elect a justice of the peace and constables. The
    residual — the date it formally ended — is recorded in the description rather than left
    standing, because it is a detail of an answer and not the absence of one.
  would_close_this: |
    The Allen County commissioners' journal after 1885 for both, or the Ohio Secretary of State's
    record of township name changes. For Ottawa specifically, Lima's annexation record.
