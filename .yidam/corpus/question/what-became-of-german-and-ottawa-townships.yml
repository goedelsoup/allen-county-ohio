class: question
label: What became of German and Ottawa townships?
description: |
  **In 1885 Allen County had thirteen townships. It has twelve, and one of the twelve is under a
  different name.** The 1885 history devotes a chapter to each of German Township and Ottawa
  Township. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). Neither name appears
  in any source this corpus holds for the present day: not the
  [2020 Gazetteer's](../../catalog/census-gazetteer-2020.md) county subdivisions, not
  [GNIS](../../catalog/gnis-domestic-names-ohio.md), whose twenty-three Allen County civil features
  include twelve townships and no German or Ottawa, and not
  [the county's own townships page](../../catalog/allen-county-official-site.md). [verified]

  **German is [American Township](../place/american-township.yml) renamed.** The two occupy the
  same ground on the book's own description — the centre of the county, the Ottawa River entering
  from Shawnee at Section 33, [Elida](../place/elida.yml) inside it. [inference] What is missing is
  the act: no source here says when the name changed or by what authority. The corpus is not
  asserting the obvious motive either. [open]

  **Ottawa Township is harder, because it was young.** It was formed in May 1857 out of
  [Bath](../place/bath-township.yml), German, [Shawnee](../place/shawnee-township.yml) and
  [Perry](../place/perry-township.yml) — 3,360 acres, about five and a quarter square miles, the
  ring of ground around [Lima](../place/lima.yml) — and organized on May 27 with Thomas K. Jacobs,
  Thomas Clayton and Slemans Lisle as trustees. [verified] — same source, whose chapter pairs it
  with Lima city. A township created to hold the county seat, and then no township. [open] Whether
  Lima annexed it out of existence, whether it was dissolved back into its four parents, and on
  what date.

  This matters past curiosity. The corpus reads today's twelve subdivisions as the county's civil
  geography and has done since genesis. They are the current state of something that has changed
  at least four times — in 1848, in 1857, and twice more since 1885 — and any claim that runs a
  township's figures back before 1885 runs them through a different map. See
  [the reorganization of 1848](../event/reorganization-of-1848.yml).
properties:
  claim_tag: open
  opened: "2026-08-29"
  would_close_this: |
    The Allen County commissioners' journal after 1885 for both, or the Ohio Secretary of State's
    record of township name changes. For Ottawa specifically, Lima's annexation record: a township
    of 3,360 acres wrapped around a growing city is the shape of something a city absorbs, and the
    annexation ordinances would date it.
