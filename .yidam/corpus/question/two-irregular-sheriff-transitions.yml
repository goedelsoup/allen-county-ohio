class: question
label: What happened at the two irregular sheriff transitions?
description: |
  The [past-sheriffs roster](../../catalog/acso-past-sheriffs.md) is continuous from 1831 to
  the present with no gaps and no overlaps. [verified] Two of its thirty-nine entries are
  nonetheless irregular in a way the source does not explain, and both have an obvious reading
  the corpus declines to write down.

  **1931–1933 Jess L. Sarber, then 1933–1935 Donald F. Sarber.** A two-year term ending
  mid-decade, followed immediately by a holder of the same surname. [verified] The reading
  that suggests itself is that the first died or left office and a relative succeeded him. The
  roster says neither, and a `how_ended` of "died in office" written on that basis would be an
  inference wearing the costume of a record — the field would look exactly like the ones
  supported by evidence. [open]

  **2017–2017 James K. Everett.** The only entry whose range begins and ends in the same year,
  sitting between an eight-year holder and the current one. [verified] The obvious reading is
  an appointment to fill a vacancy, which is how Ohio fills a county office between elections.
  The roster does not say that either. [open]

  Both are recorded here rather than in the tenure nodes because a tenure node's fields are
  read by [succession-audit](../../skills/succession-audit.md), and a plausible `how_ended`
  would be consumed by it as fact. An open question is read by people.
properties:
  claim_tag: open
  opened: "2026-08-28"
  would_close_this: |
    Allen County commissioners' journals or common pleas records for 1933 and 2017, which
    record a vacancy and its filling; or contemporary Lima newspaper coverage, which would
    date and explain both. For the 2017 case, the county's own record of the appointment.
