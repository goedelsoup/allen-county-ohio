class: question
label: Why are Allen County's village seats filled by appointment where its township seats are not?
description: |
  Twenty-five of the forty-seven seated village officers in this county were appointed to the seat
  rather than elected to it, and five village seats stand empty. Across all forty-eight township
  seats there is one appointment and no vacancy. [verified] —
  [the seat count](../measure/allen-county-elected-seats-2026.yml). For ten days the corpus did not
  know why and would not guess. **It is now read from the ballots themselves — nobody stood** — and
  the paragraphs below are kept in the order they were written, the reasoning that failed before the
  answer that came.

  **It is not size.** The two forms sit on the same ground and are staffed opposite ways.
  [Spencer Township](../jurisdiction/spencer-township.yml) elected all four of its officers while
  [Spencerville](../jurisdiction/village-of-spencerville.yml) inside it, holding most of its people,
  appointed four of seven. [Monroe Township](../jurisdiction/monroe-township.yml) elected four while
  [Cairo](../jurisdiction/village-of-cairo.yml) seated five appointees and left a seat empty.
  [Jackson Township](../jurisdiction/jackson-township.yml) and
  [Lafayette](../jurisdiction/village-of-lafayette.yml) do it out of the same building. [verified] —
  same source.

  **Nor is it simply the smallest places failing.** Beaverdam is the smallest village in the county
  and appointed two of seven; Bluffton is the largest and appointed one — the two extremes of size
  are the two lightest users of it. The heaviest are Cairo and Harrod, third and fourth smallest of
  the seven. So the emptiest government is not the smallest one and the ranking does not run with
  population. [verified] — same source and
  [the estimates](../../catalog/census-popest-2024.md).

  **One structural difference is on the table and is not an answer.** A village fills seven
  elective seats — a mayor and six council — where a township fills four, and Harrod fills ten. So
  the village form asks more people of a smaller population, and a place of four hundred is asked
  for ten officers. [inference] That is arithmetic about the form, not evidence about why a
  particular seat went unfilled, and this corpus has read no candidate filing, no canvass and no
  village minute book.

  **The city is the other end of the same scale, and it does not fit the arithmetic either.** Lima
  fills eleven elective seats on a population of 35,579 and appointed one of them; the seven villages
  fill fifty-two on 12,000 people between them and appointed twenty-five. [verified] —
  [the city's government](../measure/lima-city-government-2026.yml) and
  [the seat count](../measure/allen-county-elected-seats-2026.yml). Per thousand residents Lima asks
  for 0.31 seats and the villages for about 4.3, which is the structural difference stated at the
  county's largest scale — and it still says nothing about why a particular village seat went
  unfilled. [inference]

  **A second observation that may belong to the same answer.** The roster lists a fiscal officer
  for every one of the twelve townships and for no village at all, though it lists village mayors,
  councils and one board of public affairs. [verified] Whether that office is absent, filled some
  other way, or simply outside what this file carries is not established. [open]

  **The ballots answer half of that too, and it is not a gap in the roster.** Across both
  elections the only offices printed under a `VILLAGE OF` heading anywhere in this county are mayor,
  member of council, and Harrod's board of trustees of public affairs; every township's fiscal
  officer is printed under its own heading. [verified] —
  [the ballot display](../../catalog/allen-county-ballot-display.md), 228 precinct ballots. So a
  village fiscal officer is **not an elected office here**, and the roster is silent because there
  is nothing to list. Whether the villages have one by appointment is still unestablished. [open]

  **Nobody stood.** Across the two municipal elections that seated these officers, this county's
  villages put 52 seats on the ballot and 24 people sought them — 21 printed and three written in;
  its townships put 55 and 71 people sought those. **Twenty-three of the 52 village seats were
  filled by election and twenty-nine were not.** In November 2025 not one of the seven villages fielded a full council: 28 council
  seats, nine candidates, and Cairo and Spencerville drew nobody at all. [verified] —
  [who stood](../measure/who-stood-for-the-village-seats-2023-2025.yml), from
  [the ballot display](../../catalog/allen-county-ballot-display.md). The printed ballot states it
  in words rather than by arithmetic: under each such office it carries the line **"No Valid
  Petition Filed"**, once for every seat nobody sought.

  **The ranking this node could not explain is the same ranking, seen from the other end.** It
  observed that Bluffton and Beaverdam use appointment least and Cairo and Harrod most, and that
  this does not run with population. It does run with candidacy: Bluffton draws 0.86 candidates per
  seat and Beaverdam 0.71, against Cairo's 0.14 and Harrod's 0.20. [verified] — the same measure
  against [the seat count](../measure/allen-county-elected-seats-2026.yml). A village appoints in
  proportion to how few of its residents will stand.

  **Bluffton is the exception and it took the canvass to see it.** Its printed ballot drew nothing
  for council in 2023 and two names in 2025, but both of its 2023 seats were won by write-in —
  Jospeh Sehlhorst on 161 votes and Benjamin Stahl on 134 — and a third in 2025 by Thomas Downey on
  99. [verified] — [the official canvass](../../catalog/allen-county-ballot-display.md), both
  summaries. So the village that appoints least does not put its people on the ballot either; it
  writes them in, which is a form of standing no printed ballot records. **The correspondence above
  holds for six of the seven villages and Bluffton is the one it does not explain.**

  **And it is the council, not the village.** All seven mayoralties on the 2023 ballot drew a
  candidate but Harrod's, and Elida's drew two; the 42 council seats across both years drew 17, and
  Harrod's three seats on the board of public affairs drew none. [verified] — the same measure. So
  the question's own framing was one word too wide: the office of mayor is sought and the
  legislature is not.

  **What the law then does is not discretionary.** A village council vacancy "shall be filled by
  election by the legislative authority for the unexpired term", and if the council fails within
  thirty days "the mayor shall fill it by appointment". [verified] —
  [Ohio Revised Code](../../catalog/ohio-revised-code.md) §731.43(A)(1); an incumbent meanwhile
  "shall continue therein until his successor is elected or appointed and qualified", §3.01. **So a
  council that no one runs for appoints itself**, and the twenty-five appointees this node opened on
  are that statute working exactly as written on an electorate that did not file.
properties:
  claim_tag: verified
  opened: "2026-08-30"
  closed: "2026-09-09"
  resolution: |
    Because nobody stands for them. Over the elections of November 2023 and November 2025 the
    county's villages offered 52 seats and drew 24 candidates, against 55 seats and 71 candidates in
    its townships — 0.46 per seat against 1.29. Seven village contests and four township ones drew
    no one at all, and the printed ballot says so in words: "No Valid Petition Filed".

    The mechanism is then statutory rather than chosen, and it is two statutes and not one. Under
    ORC 731.43 a village council fills its own vacancies **for the unexpired term**, and the mayor
    fills them if the council does not within thirty days. Under ORC 503.24 a township appointee
    serves only **until a successor is elected**, and the seat returns to the next general election.
    That is why the 2025 ballot carried five unexpired-term contests and every one was a township's:
    an unsought township seat is offered again in two years and an unsought village seat is not
    offered again for four.

    Two refinements the question had not anticipated. It is the **council** and not the village
    form: every mayoralty but Harrod's drew a candidate. And **townships are not immune** — four of
    their contests drew nobody either, and most draw exactly one candidate for one seat. A township
    is not more contested than a village; it is more filled.
  would_close_this: |
    Closed. What remains open is narrower: the ballots establish that a village fiscal officer is
    not an *elected* office in this county, which is why no roster carries one; whether the villages
    appoint one is unestablished, and a village's own council minutes or its annual financial report
    to the Auditor of State would name whoever signs for it.

    The write-in gap this node first left open is now closed against the canvass, and it mattered:
    Bluffton filled three council seats by write-in across the two elections, which no printed
    ballot shows. Where the ballot reads "No Valid Petition Filed" the canvass records **zero votes
    cast**, so those seats were empty in fact — seven village contests, including 1,080 unused votes
    at Spencerville and 216 at Cairo.

    The reconciliation by name is now done and it closes without remainder. Twenty-two of the
    forty-seven seated village officers won their seats at one of the two elections and twenty-five
    were appointed; **no appointee in any village or township here sits in a seat somebody won.**
    One winner is left over — James G. Pinks, who took every vote cast for a Harrod council seat in
    2023 and is on no page of the roster. [verified] —
    [the join](../measure/who-won-and-who-sits.yml). Why he does not sit is the one thing the two
    records together cannot say. [open]
