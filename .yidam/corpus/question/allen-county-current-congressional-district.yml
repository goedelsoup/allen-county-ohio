class: question
label: Which congressional district is Allen County in now?
description: |
  At the 2020 census, all 3,552 of Allen County's census blocks fell in
  [Ohio's 4th congressional district](../division/ohio-congressional-district-4-2020.yml).
  [verified] — [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md).

  Ohio redistricted after the 2020 census, so that describes the map in force through the 2022
  election and says nothing about the map in force now. [inference] The corpus does not know
  the county's current district and does not guess it. [open]

  **Why the obvious routes do not close it.** The Census Bureau publishes a 2023 gazetteer for
  the 118th Congress districts, and it was retrieved — but a gazetteer gives a district's area
  and internal point and never the counties inside it. The county-to-district relationship
  comes from the Block Assignment Files, and there is no Block Assignment File for any year
  after 2020: `baf2022`, `baf2024`, `baf2025` and `baf2026` all return 404. The Ohio Secretary
  of State, which is the authority for the map, blocks automated clients.

  So this is a question about a fact that is neither obscure nor contested — any resident knows
  who represents them — and the corpus still declines to write it down, because the sources it
  can actually reach do not contain it and a remembered answer is not a sourced one. That is
  the same standard [the county's namesake](namesake-of-allen-county.yml) is held to, applied
  to something far more ordinary.

  **Half of it is now answered, and the half that is answered is not the half that was asked.**
  Allen County's sitting member of Congress is
  [James D. Jordan](../person/james-d-jordan.yml) of Ohio's 4th District, serving 3 January 2025 to
  2 January 2027. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md), an
  elections roster that names officeholders by county and was reachable where the geography files
  were not.

  **He was elected under a map that has since been replaced.** The November 2024 election ran on
  Ohio's congressional plan of March 2022; a new plan was adopted 31 October 2025 and is valid for
  the rest of the decade. [verified] —
  [All About Redistricting — Ohio](../../catalog/all-about-redistricting-ohio.md). So the roster
  establishes *who represents this county* and not *which district this county is in*, and those
  came apart ten months ago. The question stays open on the second, narrowed to it, and the four
  routes below are still the routes. [open]

  **The county's state legislative districts did close**, because the legislative map adopted
  29 September 2023 is the map still in force and is the one the same election ran on. The county is
  in [House District 78](../division/ohio-house-district-78-2023.yml) and
  [Senate District 12](../division/ohio-senate-district-12-2023.yml). [verified] — the same two
  sources. One roster, one election, two vintages, and the difference decided which half of this
  question could close.
  **What the returns add is the other twenty years.** This county voted in Ohio's 4th district at
  every general election from 2000 to 2020, and in 2018 all 88 of its precincts were in it — so the
  district it is in now is the only part of the twenty-five-year record still missing. [verified] —
  [the congressional returns](../measure/allen-county-in-congress-2000-2020.yml).

properties:
  claim_tag: open
  opened: "2026-08-28"
  would_close_this: |
    A county-to-congressional-district relationship file from the Census Bureau reflecting the plan
    adopted 31 October 2025, if one is published under a path this corpus has not found; the Ohio
    Secretary of State's district map, retrieved by hand rather than by an automated client; or the
    enacted plan itself, which names its constituent counties. An elections roster will not do it,
    and now the corpus knows why: a roster names the sitting member, and a sitting member is
    evidence about the map that elected him.
