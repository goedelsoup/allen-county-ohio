class: question
label: Where are the children who live in these districts and are not enrolled in them?
description: |
  Twenty thousand four hundred and forty-four children aged 5 to 17 live in the twelve school
  districts holding ground in Allen County. Sixteen thousand one hundred and thirteen are enrolled
  in them. [verified] —
  [child poverty](../measure/allen-county-school-district-poverty-2023.yml) and
  [enrolment](../measure/allen-county-school-enrolment-2010-2023.yml). The corpus does not know
  where the other 4,331 are. [open]

  **The two numbers do not measure quite the same thing, and that accounts for some of it.** The
  first is a modelled resident population aged 5 to 17; the second is fall membership, which
  includes a district's eighteen-year-old seniors and excludes five-year-olds who have not started.
  [inference] Neither is a count, and the gap of 21.2 per cent is a difference between two
  instruments before it is a difference about children.

  **What the gap plausibly contains, in no order and with no measurement here.** Private and
  parochial schools — Lima and Delphos both have Catholic systems this corpus has never recorded.
  Community schools. Home instruction. State scholarship programmes that move a pupil's funding to
  a nonpublic school. And open enrolment across district lines, which nets to nothing across the
  twelve only if every transfer stays inside them. [open]

  **It matters because of what the corpus has just published.** A district's spending per pupil is
  computed on its enrolment, and a district's child poverty rate on its resident children. If the
  two populations differ by a fifth, and differ by more in one district than another, then the two
  measures are not describing the same set of families — and this corpus has set them side by side
  in twelve nodes. [inference] Nothing here says the difference is uneven. Nothing says it is not.

  This is the first question in this corpus that arises from putting two of its own sources
  together rather than from either one being incomplete.

  **Between a third and a half of them now have a school.** Two federal files were read against
  this question. Ten private schools stand in Allen County, all of them in Lima, holding 1,108
  children in 2021–22; two community schools stand here holding 313. Add the two schools the
  private-school file stopped listing but the county still has — Delphos St John's at 603 and
  Temple Christian at 237 — and the named total runs from **1,421 to 2,261, which is 32.8 to 52.2
  per cent of the 4,331**. [inference] — computed here from
  [the private and community schools](../measure/allen-county-private-schools-2013-2021.yml).

  **Four Catholic schools hold four fifths of the county's private enrolment**, and the two systems
  this question said the corpus had never recorded are recorded now: Lima's, in four schools, and
  Delphos St John's, which is the largest private school in the county's whole record. [verified] —
  [the Private School Universe Survey](../../catalog/nces-private-school-universe.md).

  **What is left is three categories and no measurement of any of them.** Statewide online
  community schools, which enrol children from every county and are recorded at an office in
  another one — Ohio Virtual Academy alone holds 14,334. Home instruction, which is registered with
  the resident district and appears in no school's roll. And open enrolment across district lines,
  which nets to nothing across the twelve only if every transfer stays inside them. [open]

  **A caution about the arithmetic above.** The 4,331 is a gap in twelve *districts*; the 1,421 is
  a count in one *county*. The districts run past the county line and the county holds ground in no
  district it does not fully contain, so the two are not the same population. Delphos St John's is
  the clearest case: it serves the Delphos district, part of which is in Van Wert County, and the
  file put it in Allen County for four editions and in neither for the fifth. [inference]
properties:
  claim_tag: open
  opened: "2026-08-30"
  would_close_this: |
    Two of the four things named here have been read and the question is narrowed rather than
    closed. The private schools are named and counted, from the federal survey rather than Ohio's
    reports; the community schools located in the county are named and counted, and that count has
    been shown to be the wrong shape, because Ohio's largest community schools are statewide online
    schools recorded at an office elsewhere.

    What remains would close it. Ohio's enrolment by district of residence for the statewide online
    community schools, which is the one figure that would turn the largest remaining category into
    a number. The state's home-instruction notifications, filed with the resident district. And
    open-enrolment and scholarship counts by district, which the state publishes for the funding
    formula. Ohio's own nonpublic directory would also settle whether two schools missing from the
    federal file are open, which is a smaller question this phase opened.

    A figure on any one of those three turns a share of the remaining 2,070 to 2,910 into a number;
    all three would close it.
