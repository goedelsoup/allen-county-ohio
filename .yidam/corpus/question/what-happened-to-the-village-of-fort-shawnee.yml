class: question
label: What happened to the Village of Fort Shawnee?
description: |
  [Fort Shawnee](../place/fort-shawnee.yml) is listed by the Census Bureau as
  `Fort Shawnee village` with a population of 3,866 in 2000 and 3,726 in 2010, as
  `Fort Shawnee CDP` in the 2020 Gazetteer, and not at all in the Vintage 2024 sub-county
  file. [verified] — [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md) and
  [Census Intercensal Estimates, 2000–2010](../../catalog/census-intercensal-2000-2010.md).

  A village is an incorporated municipality; a CDP is a statistical construct with no
  government at all. So something changed between the 2010 and 2020 geographies.

  Two readings fit that evidence and they are not close to equivalent. Either the
  municipal corporation **dissolved** — which is a governance event with a date, a petition
  and probably an election, and which would mean Shawnee Township absorbed its functions — or
  the Census Bureau **reclassified** it for reasons of its own, leaving the corporation intact
  and only the tabulation changed. The first is a fact about Allen County. The second is a
  fact about a federal statistical program.

  **A source that counts governments rather than polygons now separates them.** The 2012 Census of
  Governments lists `VILLAGE OF FORT SHAWNEE`, census ID `36200250100000`, presiding officer
  *Mayor*, 2050 W Breese Rd, Lima OH 45806. The 2017 list does not carry it, and neither does
  2022; `TOWNSHIP OF SHAWNEE` is in all three. [verified] —
  [the government unit lists](../../catalog/census-of-governments-unit-lists.md).

  That is not a geography product. Its unit of observation is the government, so an absent row is
  evidence about the corporation and not about the tabulation, and the first reading is the one
  the evidence points at. [inference] — the reasoning is this corpus's.

  **And the change is datable to a year.** The Bureau's gazetteer carries Fort Shawnee with legal
  code 47, village, and 7.155 square miles of land in the 2012 vintage, and with code 57, census
  designated place, and 9.508 square miles in the 2013 vintage — the largest single-year area
  change of any place in the county in thirteen years, and not an annexation. [verified] —
  [the gazetteer](../../catalog/census-gazetteer-2020.md), Ohio place files for 2012 and 2013.

  So the roster that still lists it and the map that has already stopped are the same year apart:
  the corporation was surveyed as existing in 2012 and drawn as not existing in 2013. [inference]

  For as long as this node was open the corpus wrote no `jurisdiction` node for a Village of Fort
  Shawnee, and the reason changed twice rather than going away. It stopped being that the corpus
  could not tell a dissolution from a reclassification; it became that a jurisdiction node would
  have to carry an `abolished` date and the evidence supported only a year inferred from the gap
  between two federal products. That was the same restraint as
  [the county's namesake](namesake-of-allen-county.yml) — a well-formed node that answers an open
  question is worse than no node. The restraint is lifted at the foot of this node and not before
  it; the paragraphs between here and there are the case as it stood.

  **A fourth federal file names the corporation and does not narrow the year.** "Fort Shawnee,
  Village of" is a registered applicant for federal disaster aid and was paid $34,799 on two
  projects for the winter storms of 2004–05, both obligated 24 June 2005. [verified] —
  [OpenFEMA assistance programs](../../catalog/openfema-assistance-programs.md). That is seven years
  before the gap the gazetteer and the government lists place the change in, so it adds a witness to
  the corporation's existence and nothing to its end. [inference]

  **A county taxing authority puts the change in the same year, and it is not a federal product.**
  The Auditor's tax rate summary for tax year 2012 carries tax set L36, *Fort Shawnee Corp.*, levying
  2.150 mills of village tax, and charging its residents 10.200 mills of township tax where the rest
  of Shawnee Township pays 15.600. The tax year 2013 summary has no such set. In 2014 and 2015 the
  set reappears with no village millage and a township rate of 15.600 — identical to the township's
  own set in every one of its columns and to the third decimal — and from tax year 2016 it is gone.
  [verified] —
  [the Auditor's tax rate summaries](../../catalog/allen-county-auditor-tax-rates.md), tax sets L35
  and L36; see [the rates](../measure/allen-county-property-tax-rates-2012-2025.yml).

  **That is a second witness to the year and a first witness that is local.** The gazetteer draws
  Fort Shawnee as a village in 2012 and as a census designated place in 2013; the office that sets
  this county's tax rates has it levying in 2012 and not in 2013. Two instruments with nothing in
  common — a federal geography file and a county taxing authority — put the end of the corporation
  in the same twelve months. [inference] — the reasoning is this corpus's.

  **The tax set outliving the levy is the sharper detail.** A village that had merely stopped
  levying would keep a lower township rate, because a village's residents are outside some township
  levies; L36's township rate rises to the full 15.600 in the same move. The set that survives into
  2014 and 2015 is a label on rows identical to the township's, which is what an administrative
  record looks like after the thing it names has gone. [inference]

  **A third federal file draws the same change in the same year, and it is not a third witness.**
  The Census Bureau's TIGER/Line place file carries Fort Shawnee in 2011 and 2012 with legal code
  47, class C1 and feature class G4110 — an incorporated place — and in 2013 and 2014 with code 57,
  class U1 and G4210, a census designated place. Its land area goes from 18,530,879 square metres to
  24,626,518 across that boundary. [verified] —
  [the Census Bureau's TIGER/Line files](../../catalog/census-tiger-roads.md), Ohio place, 2011 to
  2014.

  **Those are the gazetteer's own figures to three decimals, which is what says the two are one
  witness.** 18,530,879 square metres is 7.155 square miles and 24,626,518 is 9.508 — the two
  numbers the gazetteer already gave this node, exactly. A boundary file and a gazetteer published
  by one bureau off one geography are not independent, and the agreement between them is evidence
  about the pipeline rather than about Fort Shawnee. [inference] — see
  [an exact match is a question](../../decisions/an-exact-match-is-a-question.yml). What it does
  establish is that the change was made once, in the geography, and propagated: the same act reaches
  a map, a gazetteer and an area table without drift.

  **The instrument, the date and the vote.** On 6 November 2012 the electors of Fort Shawnee were
  asked "Shall the Village known as Fort Shawnee surrender its corporate power?" and answered
  **1,058 to 858**. [verified] —
  [the Secretary of State's report of miscellaneous questions](../../catalog/ohio-sos-local-issue-reports.md)
  for that election, under ALLEN COUNTY. That is the source this node named as the one that would
  close it, and it closes it: the instrument is a surrender of corporate powers on a petition rather
  than a merger with the township, the day is the general election of 2012, and the vote is the
  village's own by 55.2 per cent.

  **It falls where the two witnesses already pointed, five weeks before the first of them.** The
  Auditor's tax set L36 levies village millage in tax year 2012 and none in 2013; the gazetteer
  draws a village in the 2012 vintage and a census designated place in the 2013. The ballot sits
  between them. [inference] — the same two records this node already carried, against the return.

  **The corpus now writes the jurisdiction node it had declined to write.** The reason for declining
  was that such a node would have to carry an `abolished` date and the evidence supported only a
  year; it now supports a day, and the day is a decision by the people governed rather than an
  inference from a gap between two federal products. See
  [the Village of Fort Shawnee](../jurisdiction/village-of-fort-shawnee.yml). What is still not held
  is the certification that followed the vote, so that node says the date is the electors' and not
  the corporation's last day of record.

  **What the village's books looked like when it decided, and when the state stopped auditing it.**
  The Auditor of State declared a fiscal emergency at Fort Shawnee on 16 September 2010, at the
  mayor's request, on an unprovided aggregate deficit of $50,761; the electors voted twenty-five
  months later; and the final report on the corporation is a closing engagement covering to 15 June
  2013. [verified] —
  [the Auditor of State's audit search](../../catalog/ohio-auditor-of-state-audit-search.md); see
  [the declaration](../event/fort-shawnee-declared-in-fiscal-emergency-2010.yml). That supplies the
  corporation's last day of record, which this node said it did not hold, and a financial condition
  running up to the ballot that this node had no view of at all.

  Whether the one led to the other is not established. Nothing read here connects the analysis to
  the petition: no council resolution, no campaign, no argument from either side. [open]

  [open] When it was incorporated. Closing the end of this village has opened its beginning: the
  corpus holds the county's incorporations to 1904 and Fort Shawnee is not among them.
properties:
  claim_tag: verified
  opened: "2026-08-28"
  closed: "2026-09-04"
  resolution: |
    The Village of Fort Shawnee was ended by its own electors on 6 November 2012, on a petition, by
    1,058 votes to 858 — a surrender of corporate powers under Chapter 703 rather than a merger with
    Shawnee Township under Chapter 709. The Ohio Secretary of State's report of miscellaneous
    questions for that election carries the ballot language and the return under ALLEN COUNTY. The
    two records that had narrowed the change to twelve months, the county Auditor's tax sets and the
    Census Bureau's gazetteer, both fall on the far side of that date.

    What remains unheld is the certification that followed, so the corpus dates the decision and not
    the corporation's last day of record.
  would_close_this: |
    Allen County commissioners' journal or the Ohio Secretary of State's record for 2012 or 2013,
    either of which would carry the petition and the certification. The Census Bureau's Boundary and
    Annexation Survey was named here as the likely answer and is not: Ohio's files hold fifty-seven
    Allen County records between 1990 and 2024 and every one of them is an annexation, with no row
    for Fort Shawnee at any date. The county Auditor's tax rate summaries have since narrowed the
    window and cannot close it: they record that the village stopped levying, not the instrument
    that stopped it.
