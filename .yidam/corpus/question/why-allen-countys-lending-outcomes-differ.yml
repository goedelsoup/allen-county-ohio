class: question
label: Why do Allen County's mortgage outcomes differ by race and by purpose?
description: |
  Two differences in one year's register, neither of them explained here. [open]

  **By race.** Pooled across 2018–2024, applications from Black applicants were denied at 32.4 per
  cent and from white applicants at 17.8, in all seven years and inside all twenty-three strata of
  the four controls the file carries. [verified] —
  [seven years of the gap](../measure/allen-county-lending-denial-gap-2018-2024.yml).

  **By purpose.** Borrowing against a house already owned in Lima's tracts is denied at 37.7 per
  cent against 21.5 elsewhere; buying one is 13.3 against 10.8. [verified] —
  [seven years of the register](../measure/allen-county-home-lending-2018-2024.yml).

  The corpus does not know why either. A denial rate is an outcome and the file holds no credit
  score, no assets and no appraisal; see
  [a denial rate is not an underwriting file](../../decisions/a-denial-rate-is-not-an-underwriting-file.yml).

  **Half of what this question asked for has been done, and it narrowed the question rather than
  closing it.** Both routes it named — the register's unread columns and six more years — were
  taken. The years turned 174 applications into 1,334 and the gap did not move. The columns turned
  a raw comparison into a controlled one: within 311 cells of purpose, income, debt-to-income and
  loan-to-value, 955 applications from Black applicants drew 223 denials against 132.5 expected at
  the white rate in the same cells. [verified] — same source. Composition explains fifteen per cent
  of the gap.

  **What is left is one variable and it is the biggest one.** There is no credit score in any
  column of this register, and no public file has one. [verified] Everything this corpus can do
  from the outside has now been done, and the question stays open on a fact that is not published
  anywhere. [open]

  **The purpose gap still has a candidate in the file.** Twenty-one per cent of denials in Lima's
  tracts cite collateral against 13 per cent elsewhere, and collateral is the house: a loan against
  a $95,900 house built in 1953 is a different proposition from the same loan against a $210,200
  house built in 1973. [inference] The register's property-value column would test that and has not
  been read.
properties:
  claim_tag: open
  opened: "2026-08-30"
  would_close_this: |
    Both routes this question named are spent. Loan-to-value, debt-to-income and the years 2018-2024
    were read and the gap survived all of them; property value and rate spread remain, and would
    test the collateral hypothesis rather than the race one. What is left for the race gap is an
    underwriting record, a matched-pair test, or a supervisory examination, and none of the three is
    public. This question may not be closeable from outside a lender.
