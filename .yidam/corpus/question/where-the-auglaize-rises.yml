class: question
label: Does the Auglaize River rise in Allen County?
description: |
  **Yes, and in the township named after it.** The river's source coordinate, 40.6669957,
  -83.8938286, falls inside Allen County, Ohio — GEOID `39003` — and inside Auglaize township,
  GEOID `3900302988`, in census tract 115. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md), point-in-polygon against the 2020 county and
  county-subdivision layers. The source coordinate is [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md)
  feature 1065901. [verified]

  So Allen County is not merely drained by the Auglaize. It is the ground the river starts on,
  and the township that carries the river's name is the one it rises in — which is the ordinary
  direction for a name to travel and is worth having checked rather than assumed. [inference]

  **What it took, and what the corpus had been doing instead.** This was opened one phase ago
  with the best answer then available: the source lies inside the box bounded by the 109
  features GNIS files in the county, 0.73 miles west of the easternmost. That box is 471 square
  miles around a county of 402.545, so it left roughly 68 square miles of doubt and could not
  be narrowed by any amount of care with the same kind of data. One query against a boundary
  layer closed it. The lesson is recorded in
  [the-boundary-gap](../../decisions/the-boundary-gap.yml): a gazetteer answers "where is this,
  roughly" and only geometry answers "what is inside what".
properties:
  claim_tag: verified
