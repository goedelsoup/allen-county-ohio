  closed: "2026-08-28"
  resolution: |
    Point-in-polygon against TIGERweb's 2020 county and county-subdivision layers. The source
    is in Allen County, Ohio, in Auglaize township — the township named for the river.
  would_close_this: |
    A county boundary polygon checked against the source coordinate. Closed by exactly that.
