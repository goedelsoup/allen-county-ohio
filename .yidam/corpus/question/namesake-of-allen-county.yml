class: question
label: Who is Allen County named for?
description: |
  The county's name is not securely attributed. The two candidates usually offered are
  [John Allen](../person/john-allen.yml), a Kentucky colonel killed at the River Raisin in
  1813, and Ethan Allen of Vermont. [inference]

  This is the corpus's worked example of a claim that structure could settle by accident. A
  `named-for` edge from [Allen County](../place/allen-county.yml) to a person node would be
  well-formed, would resolve, would satisfy the class contract, and would pass every check
  this repository runs — while asserting exactly the thing this node says is unresolved.
  `place` declares the `named-for` relationship precisely so it is available; no instance
  uses it, and that is the finding rather than an omission.

  **The source this node named as insufficient has arrived, and it is more interesting than
  expected: it does not make the claim at all.** The 1885 county history's chapter on Ohio's
  counties opens by telling the reader that "Adams County was named in honor of John Adams, second
  President of the United States", and gives namesakes freely down the list. Its entry for the
  county the whole book is about reads, entire: "Allen County was formed from the Indian Territory
  April 1, 1820. Lima is its county seat." [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans identical.

  A subscription history written for the county's own subscribers, which names namesakes for its
  neighbours, declines to name one here. That is not proof of anything, but it is evidence of a
  kind the node did not anticipate: the standard local history — the genre this node said was "the
  origin of both candidates" — did not carry the attribution in 1885. [inference] Whatever produced
  the John Allen and Ethan Allen stories may be later than the book usually blamed for them.

  [open] Which man, if either, the 1820 legislature had in mind is unknown to this corpus.
properties:
  claim_tag: open
  opened: 2026-08-28
  would_close_this: |
    The text of the 1820 act erecting the county, or contemporaneous legislative journals from
    the Ohio General Assembly session that passed it. A county history asserting the
    attribution is not sufficient on its own: local histories are the origin of both
    candidates and repeat each other.
