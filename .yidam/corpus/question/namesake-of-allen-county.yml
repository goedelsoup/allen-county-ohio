class: question
label: Who is Allen County named for?
description: |
  The county's name is not securely attributed. The two candidates usually offered are
  [John Allen](../person/john-allen.yml), a Kentucky colonel killed at the River Raisin in
  1813, and Ethan Allen of Vermont. [inference]

  This is the corpus's worked example of a claim that structure could settle by accident. A
  `named-for` edge from [Allen County](../place/allen-county.yml) to a person node would be
  well-formed, would resolve, would satisfy the class contract, and would pass every check
  this repository runs — while asserting exactly the thing this node says is unresolved.
  `place` declares the `named-for` relationship precisely so it is available; no instance
  uses it, and that is the finding rather than an omission.

  **The earliest source held here makes the attribution, and it rules out one of the two
  candidates.** Howe's *Historical Collections of Ohio*, 1847: "Allen was formed April 1st, 1820,
  from Indian territory, and named in honor of a colonel of that name in the war of 1812: it was
  temporarily attached to Mercer county for judicial purposes." [verified] —
  [Howe, 1847](../../catalog/howe-historical-collections-of-ohio.md). Ethan Allen died in 1789 and
  held no commission in a war fought twenty-three years afterwards. [inference]

  **What Howe has is a rank and a war rather than a man, and forty years did not supply one.** The
  revised edition he finished in the 1880s reads "named in honor of a Col. Allen, of the war of
  1812". [verified] —
  [the revised edition](../../catalog/howe-historical-collections-of-ohio.md), Volume I. Of the
  fourteen counties the 1820 act laid out, Allen and Wood are the only two he attributes to a man
  whose name he withholds, and he describes both the same way — an officer of that war. [verified]
  — see [the counties of 1820](../measure/ohio-counties-of-1820-and-their-names.yml).

  **A claim this node made about the 1885 history is withdrawn.** It said the book "gives
  namesakes freely down the list" and declines to give one here. It gives them anything but
  freely: the chapter on Ohio's counties runs to seventy-nine entries and carries exactly one
  namesake, its first — "Adams County was named in honor of John Adams, second President of the
  United States". [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), the chapter searched
  entire on a whitespace-normalised text. None of the fourteen counties of 1820 is attributed
  there, and neither is any of Allen's six neighbours. The book's silence here is the book's habit
  and is evidence about the book. [inference]

  **The Ethan Allen attribution has a source, a date, and an author who marked it as a guess.**
  The 1921 county history dates the act — "By an Act of the Ohio Assembly, February 12, 1820" —
  and then reasons from the company the name keeps: the assembly "evidently had in mind a number
  of Revolutionary patriots ... when selecting names for these newly created counties", after
  which it turns to "the life and character of the patriot seemingly honored in the name of Allen
  County" and spends a page and a half on Ethan Allen. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), page 169.
  Both hedges are the book's own. It reached Ethan Allen by inference from a list, and said so
  twice. [inference]

  **The same volume tells the other story sixty-five pages earlier and never joins them.** Its War
  of 1812 narrative has "Col. William Lewis was first dispatched with 550 men on January 17th. A
  few hours later Col. John Allen followed with 110 men", into the action at Frenchtown that became
  the River Raisin. [verified] — same source, page 104. A colonel named Allen, of that war, killed
  on that field, stands in the book that attributes the county to a Revolutionary general.
  [inference]

  **The 1885 and 1906 histories make no naming claim of any kind.** [verified] — both texts
  searched entire for every phrasing of attribution the 1885 chapter itself uses.

  [open] The man's given name. Every source held here that attributes the county at all attributes
  it to a colonel of the War of 1812, and not one of them names him. Identifying that colonel with
  Kentucky's John Allen is this corpus's reading of Howe's description, and is made by no source it
  holds.
properties:
  claim_tag: open
  opened: 2026-08-28
  would_close_this: |
    A source that names the colonel. The 1820 act and the journals of the eighteenth General
    Assembly are still the first place to look, and they were not found: archive.org's run of Ohio
    session laws is 121 volumes and none of them is that session. Failing those, any printed
    source earlier than Howe — an Ohio gazetteer of the 1820s, a Columbus or Cincinnati newspaper
    of February 1820, or the state's early county files. The 1833 Ohio Gazetteer has been checked
    and gives Allen County's boundaries, streams, area and county seat with no namesake at all.
