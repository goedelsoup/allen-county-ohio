class: tenure
label: Tenure
foundational_type:
  ontology: ufo
  type: relator
description: |
  One person's holding of one office over one interval. It is a Relator in the strict sense
  — a first-class node mediating a relationship and carrying its own identity, dates and
  terms — and it exists as a class because "who held this office in 1893" is otherwise
  encodable only as prose on a person or as a date-qualified edge, and is unqueryable in
  both forms.
edge_policy: characteristic
# Raised from 25, for the reason `.yidam/corpus/measure.ont.yml` records for its own budget. A
# tenure's fixed structure is now 18 lines before a word of prose: three of frontmatter, three of
# properties and eleven of links, because every edge carries a `claim_tag` and — where verified — a
# `source`. That left seven lines for prose, and a present-day tenure has to say more than seven
# lines' worth: that the node is a term and not a career, that `ended` is absent because the holder
# is serving rather than because the end is unknown, and on what reasoning `how_began` was set. All
# three are the difference between a date and a checkable date. `node-too-long` counts whole files,
# so a corpus that makes its edges auditable is charged for it against a budget written to stop
# prose sprawling. Raising it is the local fix; the finding is recorded in
# `.yidam/decisions/upstream-findings.yml`.
max_lines: 35
properties:
  - name: began
    type: date
    description: When this holder took the office, at whatever precision is known.
  - name: ended
    type: date
    description: When they left it; absent means still serving or not yet established.
  - name: how_began
    type: string
    description: elected | appointed | succeeded | acting
  - name: how_ended
    type: string
    description: term expired | resigned | died in office | removed | defeated | office abolished
  - name: term_number
    type: string
    description: Which of this holder's terms this is, where they served more than one.
edges:
  - relationship: held-by
    target: person
    direction: out
    description: The individual who held the office over this interval.
  - relationship: of-office
    target: office
    direction: out
    description: The office held.
