class: site
label: Camp Lima
description: |
  The Civil War camp of rendezvous for Ohio's Eighth Military District, on the Shawnee road across
  the Ottawa River from [Lima](../place/lima.yml). [verified] —
  [the 1921 history](../../catalog/rusler-allen-county-1921.md), which also carries a picture of it.

  **In August 1862 there were about 1,600 men camped there.** [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). Lima had 1,989 people
  at the census two years earlier. [verified] —
  [the city's series](../measure/lima-population-1850-1960.yml).

  For a few weeks the camp was very nearly a second Lima, and the larger half of it was from
  somewhere else: the Eighth District was more than one county, and Allen County's whole
  contribution to the war was 1,920 men over four years. [inference] — computed here against
  [what the county sent](../measure/allen-county-civil-war-service.yml).

  **Two regiments were ordered mustered here** — the 99th Ohio Volunteer Infantry, which opened the
  camp on August 11, 1862 and was full that day, and the 118th, ordered formed about the same time.
  [verified] — the 1885 history. Neither is the regiment this county filled most; that was the 81st,
  which was organised in September 1861, before there was a camp.

  **The station is a year older than the camp, and the later books collapse the two.** Lima was
  selected as a military station in August 1861, with Isaiah S. Pillars as commandant; the Eighth
  Military District was organised with its rendezvous here in July 1862; the camp opened in August
  1862. [verified] — the 1885 history. The 1906 and 1921 histories both compress this into a single
  sentence: that Pillars was appointed commander of Camp Lima in 1861, by Governor Tod, and that the
  81st, 99th and 118th were organised under him. [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md) and the 1921 history.

  There was no Camp Lima in 1861 to command, and the 81st was raised before there was. [inference] —
  the 1885 history's own dates, read against the later two. What the later books have done is take a
  designation of 1861 and a camp of 1862 and give them one date, which is the same failure this
  corpus found twice more in the same two volumes; see
  [what the county sent](../measure/allen-county-civil-war-service.yml).

  **The commandant now has a life around the commission.** [Isaiah S. Pillars](../person/isaiah-pillars.yml)
  was born in 1833, was practising law in Lima from 1855, held this command with the rank of colonel,
  was the county's prosecuting attorney, sat one term in the Ohio House and was elected Attorney
  General of Ohio in 1877, and died in 1895. [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md), its chapter of legal biographies —
  which is a different chapter from the one this node has been quoting, and gives the same 1861
  appointment in the same words. So the compression noted above is the book repeating itself, not two
  independent witnesses agreeing. [inference]

  [open] Whether Governor Tod appointed him, and in which year. The corpus holds no list of Ohio's
  governors, so it cannot check the attribution against the term, and it will not settle a
  commission from memory.

  [open] Where exactly it stood, and what is there now. "The Shawnee road across the Ottawa River"
  is a direction and not a location; the camp is not in the gazetteer, and no source here gives a
  survey line, an owner or an acreage.

  [open] When it closed. Every source says what came to the camp and none says when it stopped
  being one.
