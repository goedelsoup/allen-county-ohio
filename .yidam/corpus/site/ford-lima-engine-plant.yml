class: site
label: Ford Lima Engine Plant
description: |
  An engine plant at 1155 Bible Road, operated by [Ford Motor Company](../organization/ford-motor-company.yml).
  [verified] — [EPA TRI](../../catalog/epa-tri.md), which names the facility
  `FORD MOTOR CO LIMA ENGINE PLANT` with Ford Motor Co as its parent and the plant itself as its
  mailing address.

  **It has a Lima address and is not in Lima.** The county's address file records it at 1155 Bible
  Road with `USPS_CITY` LIMA and `MUNI` **blank**, at 40.774253, -84.084246; TIGERweb, asked that
  point, puts it in [Bath Township](../place/bath-township.yml) and in no incorporated place.
  [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md) and
  [TIGERweb](../../catalog/tigerweb-census2020.md).

  That is the fifth instance of
  [a postal address is not a municipality](../../decisions/a-postal-address-is-not-a-municipality.yml)
  and the second asked in advance of the claim rather than after it.

  **So all three of the county's large industrial installations stand outside every municipality.**
  This plant in Bath Township, [the refinery](lima-refinery.yml) and
  [the tank plant](lima-army-tank-plant.yml) in [Shawnee](../place/shawnee-township.yml).
  [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md), point-in-polygon on all three
  against the 2020 county-subdivision and incorporated-place layers.

  Three townships' ground and no city's, which is a fact about who may levy on them before it is a
  fact about geography. [inference]

  **It is one of six Allen County facilities that have reported to the EPA in every one of the
  inventory's thirty-eight years.** The others are [the refinery](lima-refinery.yml), Dana
  Driveshaft Manufacturing, INEOS Nitriles, FXI at Spencerville, and Chemtrade's sulphur works at
  Cairo. [verified] — [the reporters](../measure/allen-county-tri-reporters-1987-2024.yml). Six of
  forty-eight, in a register where twenty-eight facilities have stopped filing.

  **It stands on T3S R7E section 17**, which the Recorder abstracts in **Section Ground volume
  28A**. [verified] — [Allen County GIS REST](../../catalog/allen-county-gis-rest.md) layer 55,
  cross-checked against the parcel number on the same point, and
  [the Recorder's book list](../../catalog/allen-county-recorder-section-ground.md).

  That matters more here than anywhere else in the corpus, because this node's open question has
  no newspaper route at all — no paper in the national archive reaches 1957 for it — and a tract
  page records a conveyance whether or not anyone reported it. [inference]

  **When Ford took this ground: 24 August 1955.** The Recorder's tract abstract for the NW quarter
  of section 17 records DTI Enterprises Inc conveying to Ford Motor Company by warranty deed dated
  24 August 1955 and recorded 27 September 1955, at volume 332 page 529 — with a second parcel
  from the same grantor a fortnight later at 332/531, one from two individuals on 17 January 1956
  at 350/184, and two more from DTI on 17 August 1956 at 357/577 and 357/579. [verified] —
  [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md), volume 0028A
  pages 163–166.

  **It was assembled for Ford, and not by Ford.** DTI Enterprises Inc bought this ground from the
  National Lime & Stone Company on 2 June 1955 and from a private owner on 24 December 1955, and
  conveyed to Ford four times between August 1955 and August 1956. [verified] — same pages. A
  company buying up adjacent parcels over eighteen months and passing them to one manufacturer is
  the ordinary shape of a site assembly, in which an assembler exists so that the buyer's name
  does not appear and the price does not move. [inference]

  **And it was building by September 1957.** A mechanic's lien for **$91,546.07** was filed
  against Ford Motor Company by Carlson Manufacturing Inc on 30 September 1957, released 17
  October 1962. [verified] — same pages, mortgage side. A mechanic's lien is a claim for work done
  on the ground, so it dates construction the way no directory or aerial photograph the corpus
  holds could. [inference]

  **The liens keep coming for forty years**, and they are the closest thing this corpus has to a
  record of the plant's growth: Vicon Supply in 1967; Strunk Maintenance four times and Durako
  Paint and Skyline Industrial in 1972–73; Chas A Strand in 1976; Tilton and E C Ernst/Jansen
  Electric in 1978; Penn Ventilator and Midwest Steel Erection in 1980; a General Electric supply
  division and All Phase Electric in 1984; Rent All Mart in 1990; and six notices of commencement
  from Tuttle Construction, Tilton and Rudolph Libbe across 1994 and 1995. [verified] — same
  pages.

  **The ground was a quarry before it was a factory.** The chain behind DTI Enterprises runs
  National Lime & Stone Company, which took it from the National Quarries Company in January 1944;
  National Quarries had it from 1917. [verified] — same pages. A ten-year lease to the Hercules
  Powder Company in 1922 is consistent with that and is what the record says rather than an
  inference from the name. [inference]

  **This is one quarter of the plant's ground and not all of it.** The plant's parcel runs the
  entire west half of section 17 and crosses the line between the NW and SW quarters, so a tract
  index organized by quarter cuts through it. [verified] —
  [the survey sections](../measure/allen-county-survey-sections.yml) and county parcel geometry.

  Everything above is the NW quarter's record. The SW quarter has its own sheets and they have not
  been read. [open]

  **What it makes and how many people work in it.** The plant files an annual injury summary with
  OSHA under NAICS **333618** and describes its own industry as *engine manufacture*. Its annual
  average employment runs **1,365 in 2016**, 1,442, 1,413, 1,386, 1,497, 1,460, **1,550 in 2022** —
  the highest of the nine — and 1,500 in each of 2023 and 2024. [verified] —
  [the injury summaries](../../catalog/osha-injury-tracking-application.md), calendar 2016 through
  2024. The question this node has carried since genesis is closed by a safety filing, which is not
  where anyone would look for a headcount.

  **Its people worked 22,432,575 hours in those nine years and 429 of them were hurt badly enough to
  record** — a rate of 3.82 per 100 full-time workers, against 3.69 for the county's reporting
  establishments as a whole and 2.87 for its manufacturing. [verified] —
  [the county's injury record](../measure/allen-county-workplace-injuries-2016-2024.yml). The
  plant's own year-to-year rate runs 2.53 in 2018 to 5.17 in 2023, which is the ordinary spread of a
  count near fifty and not a trend. [inference]

  **The company that sold this ground is still quarrying a mile and a half away.** The National Lime
  & Stone Company, which took the site from the National Quarries Company in January 1944 and
  conveyed it to DTI in 1955, operates a working limestone quarry at 40.750833, -84.086111 — **1.62
  miles south of this plant and in the same township**. [verified] —
  [the quarry](national-lime-and-stone-lima-quarry.yml), out of
  [the MSHA mine master](../../catalog/msha-mine-data.md). The ground was a quarry before it was a
  factory, and the quarry company never left Bath Township. [inference]

  **One person died here in 2021.** The plant's summary for that year records a single work-related
  death, one of three in the county across the nine years. [verified] — the same summaries. Neither
  the file nor this corpus says anything further about it, and nothing here names the person.

  **It is almost certainly the largest building in Allen County.** The county's biggest footprint is
  1,865,159 square feet — 42.8 acres under one roof — classed *Industrial / Light* and carrying no
  name. This node's coordinate lies 104 metres from it, and the only other buildings within 150
  metres of that point are 2,129 and 609 square feet. [verified] —
  [the buildings](../measure/allen-county-buildings-2019.yml). Nothing else of any size stands near
  the point, so the identification is the corpus's rather than the file's. [inference]

