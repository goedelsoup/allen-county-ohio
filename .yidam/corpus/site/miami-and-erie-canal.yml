class: site
label: Miami and Erie Canal
description: |
  The state canal running between the Ohio River at Cincinnati and Lake Erie at Toledo,
  passing through the western edge of Allen County by way of
  [Delphos](../place/delphos.yml) and Spencerville. [inference]

  It is a site rather than a natural feature because it was dug, and it is a site with an
  extent rather than a point — which is the case this class is defined to cover. Its
  significance here is that it gave the western townships a transport connection decades
  before the railways arrived, and it is why Delphos and Spencerville exist where they do
  rather than at any point the land would have chosen. [inference]

  The canal was superseded by rail and abandoned as a commercial route in the early twentieth
  century. [inference] Lima, notably, is not on it — the county's later industrial centre grew
  around a railway junction instead, which is part of why the canal towns and the county seat
  have such different nineteenth-century trajectories. [inference]

  [open] The dates of construction through this county, and the date of abandonment, are not
  verified here.
properties:
  site_type: canal
  status: abandoned
links:
