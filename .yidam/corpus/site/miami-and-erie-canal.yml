class: site
label: Miami and Erie Canal
description: |
  The state canal running between the Ohio River at Cincinnati and Lake Erie at Toledo,
  passing through the western edge of Allen County by way of
  [Delphos](../place/delphos.yml) and Spencerville. [inference]

  It is a site rather than a natural feature because it was dug, and it is a site with an
  extent rather than a point — which is the case this class is defined to cover. Its
  significance here is that it gave the western townships a transport connection decades
  before the railways arrived. **Spencerville is verified to be one of its towns**: the county
  records it as founded in 1844 on the banks of this canal. [verified] —
  [Allen County](../../catalog/allen-county-official-site.md), cities and villages page. Delphos is not — the same page describes it as
  four towns merging in 1851 and does not mention the canal — so the claim that the canal is why
  *both* towns stand where they do is halved: verified for one, still an inference for the other.
  [inference]

  **The supersession is now sourced and the sequence is named.** "Under railroad competition the
  canal was leased, and after a few years it went out of commercial use entirely; while the canal
  once meant much to western Allen County it is now a thing of the past in community history."
  [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md),
  which also says the innovation of the waterway was supplanted "in less than a generation" by the
  first railroad in the county. The competitor is dated: a road through Lima and Delphos in 1854 and
  a second through the county by 1858. [verified] —
  [the first railroad](../event/the-first-railroad-reaches-allen-county.yml).

  The canal carried the first railroad's own locomotive. The engine used to build that line arrived
  in 1854 by canal from Toledo, as freight to Delphos, and was named the *Lima*. [verified] — same
  source.

  Lima, notably, is not on the canal — the county's industrial centre grew at the crossing of two
  railroads instead, and by 1879 all three of the roads then serving it kept repair shops there.
  [verified] — [the network](../measure/allen-county-railroads-1883-1921.yml). That is part of why
  the canal towns and the county seat have such different nineteenth-century trajectories.
  [inference]

  **GNIS names it and this node declines its coordinate.** The canal is feature 1057843, filed
  under Henry County with a primary coordinate at 41.3269935, -84.1943905 and a source of
  `0.0, 0.0`. [verified] — [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md). That
  primary point is about 34 miles north of Delphos [inference], because a names file gives one
  coordinate per feature and this feature is a 250-mile canal. Writing it into `coordinates`
  would put the Delphos reach in Henry County, and writing the source into anything would put
  a canal in the Gulf of Guinea. The identifier is worth keeping; the coordinate is not.

  **It was located by a man who then lived and died in this county.** Samuel Forrer was connected
  with the canal surveys from July 1825 to 1831 and located the Miami & Erie; he was appointed canal
  commissioner in 1832 and elected to the Board of Public Works in 1835, and was still its
  consulting engineer in 1871 at seventy-eight. He settled in
  [Marion Township](../place/marion-township.yml) and made [Delphos](../place/delphos.yml) his home
  until his death in 1874. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). See
  [Samuel Forrer](../person/samuel-forrer.yml).

  **The chronology through this county.** The route was surveyed in 1824 and Congress made a land
  grant to Ohio to aid construction in 1828. The Wabash & Erie opened for navigation in **July
  1843**, and the Miami extension — this canal's northern reach, the one that passes through Allen
  County — was formally opened in **June 1845**. [verified] — same source. Locally the water came
  a little earlier than the formal opening: Dr. Campbell's reminiscence has "the canal was opened
  for traffic in 1844", which is the year [Spencerville](../place/spencerville.yml) was laid out at
  its upper lock. [verified] — same source.

  **Delphos is verified as a canal town after all**, on the same source that halves nothing: it sits
  "on the Miami and Erie Canal, above the confluence of that waterway with the Wabash and Erie Canal
  system", and the canal opened there in 1845. [verified] — same source. Its `located-in` edge is
  no longer an inference.

  [open] The date of abandonment. The 1885 book was printed while the canal was still working and
  cannot see its end — see [the canal era](../period/canal-era.yml), whose closing bound is
  argued from the railways instead.
