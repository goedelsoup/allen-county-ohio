class: site
label: Fort Amanda
description: |
  A stockaded supply post of the War of 1812 on the west bank of
  [the Auglaize River](../natural-feature/auglaize-river.yml), built in September 1812 by the
  command of Col. Thomas Poague and named for the colonel's wife. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), which both scans
  carry identically. Gen. William Henry Harrison had been made commander-in-chief of the
  Northwestern Army on 17 September 1812 and massed troops at Wooster, Urbana, St. Marys and
  Defiance; the posts on the Auglaize appear first in the report of military affairs that
  followed. [verified] — same source.

  **It is not in Allen County and this corpus is the first thing here to say so.** The federal
  gazetteer lists `Fort Amanda (historical)`, feature class Military, feature id `1071210`, in
  **Auglaize County**, at 40.6830556, -84.27, on the Spencerville quadrangle. [verified] —
  [USGS Geographic Names](../../catalog/gnis-domestic-names-ohio.md). Put that point to Allen
  County's own map service and it falls off the edge of it: no township, no survey section, no
  parcel — three layers, three empty answers, where the control point returns `AMANDA TOWNSHIP`
  from the first of them. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-rest.md), point-in-polygon against layers 50,
  55 and 51.

  **It misses by a fifth of a mile.** Walking the same meridian north from the fort until the
  county's map begins to answer puts the line at latitude 40.685776, which is 0.188 statute miles
  — about 990 feet — north of the fort. [inference] — binary search on the service above,
  performed here, at one part in a million of latitude.

  **It was in Allen County until 1848**, and the county's own historian says so with feeling:
  "In 1848 Allen lost Logan, Deuchoquette, Union and Wayne townships to Auglaize County. It was a
  rude fate that removed Fort Amanda with its historic traditions from the bounds of Allen
  County." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). See
  [the reorganization](../event/reorganization-of-1848.yml) that did it, and
  [of here is not located here](../../decisions/of-here-is-not-located-here.yml).

  ## What stood there

  **A rectangle of an acre and a half.** Pickets eleven feet above ground and set four feet into
  it, a blockhouse at each of the four corners with its second storey projecting three or four
  feet over the palisade, the largest at the south-east corner for officers' quarters, and a
  storehouse in the middle of the quadrangle. [verified] — [the 1885 history](../../catalog/leeson-allen-county-1885.md)
  for the pickets, the four blockhouses and the storehouse, both scans; the acre and a half and
  the depth of the posts from [the 1921 history](../../catalog/rusler-allen-county-1921.md).

  **The storehouse became a hospital in 1813**, an upper storey added to it for the purpose, and
  "most of those who now rest in the military cemetery at Fort Amanda died in this upper room
  hospital". The paymaster's office was in the same building. [verified] — the 1921 history.

  **There was never a battle here.** "While there was never a military engagement at Fort Amanda,
  it was a place of refuge from the Indians." [verified] — same source, which says elsewhere that
  the din of battle was never heard on Allen County soil at all. The one death it records is
  Capt. Enoch Dawson, killed from ambush in October 1812 while eating grapes at the water's edge,
  and buried on a detached knoll across the ravine. [verified] — same source, single witness.

  ## The one document

  Everything above is a history written seventy years after the fact. **One contemporary paper is
  quoted**: a letter of Green Clay, dated Camp Meigs, 20 June 1813, to Gen. Harrison, recording
  that a large consignment of flour in barrels had been received from Fort Amanda through Ensign
  Gray. [verified] — [the 1885 history](../../catalog/leeson-allen-county-1885.md), both scans,
  and quoted again in 1921. The garrison's own records were destroyed: they "fell into the hands
  of the British", which is also why the graves have no names. [verified] — same source.

  ## The monument, and its historian

  A grey granite obelisk of nearly fifty feet, its base carved to suggest the stockade, unveiled
  **5 July 1915** before five thousand people on two and a half acres bought from Clarence
  Lathrop. The Ohio Assembly appropriated $5,000 in April 1913 and Gov. James M. Cox named the
  commission. [verified] — [the 1921 history](../../catalog/rusler-allen-county-1921.md).

  Its bronze tablet reads: "Fort Amanda, erected by order of Gen. William Henry Harrison in
  **October, 1812**, and became an important deposit of army stores during the war." [verified] —
  same source, quoting the tablet. The 1885 history says **September**. A book and a bronze tablet
  disagree by a month and neither cites the other. [inference]

  **The man who wrote the only account of the monument built it.** William Rusler called the
  meeting of 4 February 1913 that began the movement, was secretary of the Fort Amanda Memorial
  Association, was named by the governor to the state commission and served as its secretary, and
  then wrote the 1921 county history this corpus is reading. [verified] — the 1921 history, which
  names him in all four roles without remarking on it.
