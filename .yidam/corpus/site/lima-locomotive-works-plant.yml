class: site
label: Lima Locomotive Works (plant)
description: |
  The locomotive erecting shops at Lima, where the Shay geared locomotives and later the
  mainline steam locomotives were built. [inference]

  The plant has a node distinct from
  [the company](../organization/lima-locomotive-works.yml) because the two ended differently:
  the corporate identity was merged away in the mid-twentieth century while the physical works
  continued under other ownership building other products. Collapsing them would make the
  company's disappearance look like the site's, which is not what happened. [inference]

  **It built tanks, and the corpus can now date that.** In February 1941 the works had "under
  construction a new $290,000 factory building", which the local press read as confirmation that it
  was switching part of its activity to defense production; by that August medium tank production
  was scheduled to begin "this fall". [verified] —
  [Chronicling America](../../catalog/chronicling-america.md), *The Bluffton News*, 20 February
  1941, page 3, and *Evening Star*, 24 August 1941, page 4.

  A rumour at the time put the order at "at least 300 medium tanks at a cost of several millions of
  dollars", and inquiries to the British purchasing departments in Washington and London met with
  "no comment is advisable at this time". The corpus records the rumour as a rumour and asserts no
  number. [open] — same page.

  That makes this plant, and not [the tank plant](lima-army-tank-plant.yml), the first place in
  Allen County where tanks were built. [inference] The two are separate undertakings two years
  apart; so is [the Lima Tank Depot](lima-tank-depot.yml).

  [open] What now stands on the site, and whether any of the original erecting shops survive,
  has not been established. Neither has where the $290,000 building of 1941 stood, or whether it
  was on this ground.
