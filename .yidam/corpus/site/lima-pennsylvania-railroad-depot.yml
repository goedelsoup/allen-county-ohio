class: site
label: Lima Pennsylvania Railroad Passenger Depot
description: |
  The passenger station of the Pennsylvania Railroad at 424 North Central Avenue in Lima, on the
  National Register since 21 August 2003 as reference `03000805`. [verified] —
  [the NPS spatial dataset](../../catalog/nrhp-national-register.md). It stands in survey section
  30 of T3S R7E, half a mile north-east of the courthouse. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-rest.md), point-in-polygon against the section
  layer.

  **It is the only building in this county the federal register holds for the thing the county was
  built on.** Twenty-nine listings and not one of them is a factory, a refinery or a shop; this is
  a waiting room. [verified] —
  [the county's list](../measure/allen-county-national-register.yml).

  **The road it belonged to is the county's first.** The Ohio & Indiana reached Lima in 1854 on the
  Crestline-to-Fort Wayne line that later became the Pennsylvania, and by 1883 ten fast passenger
  trains a day passed through Lima on the Chicago & Erie alone, besides the mails and the limited
  express. [verified] —
  [the railway network](../measure/allen-county-railroads-1883-1921.yml).

  **No passenger train calls in this county now.** Five railroads still cross Allen County at 201
  open crossings and not one of them sees a passenger train. [verified] —
  [the crossings](../measure/allen-county-railroads-2026.yml). The depot was listed in 2003, which
  is a statement about a building and not about a service. [inference]

  [open] When passenger service ended here, and what the building is used for. The register's own
  `IS_EXTANT` field reads `Unknown` for every Allen County listing, this one included, because the
  points were batch-processed from an older system and never confirmed one at a time. [verified] —
  [the NPS dataset](../../catalog/nrhp-national-register.md).
