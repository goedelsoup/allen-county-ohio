class: site
label: Lima Refinery
description: |
  The petroleum refinery at Lima, built to process the crude of the Lima field after the 1885
  strike and still operating. [inference] It is the longest-running industrial installation in
  the county and has outlived every corporate arrangement that has owned it.

  The refinery is the clearest case in this corpus for why [site](../site.ont.yml) is a class
  apart from [organization](../organization.ont.yml): the works are one continuous thing while
  the operator has changed repeatedly, and a corpus that modeled the refinery as a property of
  its owner would have to create a new refinery every time the company changed.

  **It has a Lima address and is not in Lima.** The county's address file records it at
  1150 S Metcalf Street with `USPS_CITY` "LIMA" and `MUNI` **blank**, at 40.7221100,
  -84.1134691. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md). The Census Bureau, asked the
  same point independently, puts it in [Shawnee Township](../place/shawnee-township.yml) and in
  no incorporated place. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md). The `located-in` edge named Lima from
  genesis until both authorities were asked.

  **It is here because a farmer paid $5,000 to keep it here, in 1886.** Standard Oil resolved to
  build a refinery in north-west Ohio with Findlay and Toledo leading for the site. Its location
  committee — **Frank Rockefeller**, the director F. B. Squiers, and Keith, attorney for
  [the Solar Refining Company](../organization/solar-refining-company.yml) — inspected the
  candidates and settled on 151 acres of
  [James A. Hover's](../person/james-a-hover.yml) farm in
  [Shawnee Township](../place/shawnee-township.yml), lying between the C. & E. and the L. E. & W.
  railroads. Hover contracted to sell for $17,500; the Trenton Rock Oil Company, holding a drilling
  lease he had granted in 1885, demanded $10,000 to release it; Rockefeller refused to see him "held
  up" and threatened Findlay or Toledo. Hover bought the lease out of his own pocket for $5,000, and
  Rockefeller later sent him a personal cheque for $2,500 to split the loss. [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md),
  which has the story from Hover's son and prints it as testimony rather than record.

  **So the works were built by the Solar Refining Company, a Standard Oil subsidiary, from 1886.**
  [verified] — same source. That is the beginning of the ownership chain this node has asked for
  since genesis, and it explains what the corpus had already established by coordinate and could
  not explain: **the refinery sits outside every municipality because it was sited on a farm.**
  Standard picked 151 acres of open ground between two railroads in 1886, and no annexation has
  taken it since. [inference]

  [open] The rest of the ownership chain — Solar Refining to the present operator — and the present
  crude throughput. The corpus now has the first link and not the others.
