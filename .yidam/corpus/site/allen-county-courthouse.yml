class: site
label: Allen County Courthouse
description: |
  The seat of county government at Lima — the building the
  [county government](../jurisdiction/allen-county-government.yml) occupies and the physical
  expression of Lima's status as county seat. [inference]

  It is in the corpus as the worked example of a site whose operator is a jurisdiction rather
  than an organization, which is why [site](../site.ont.yml) declares `operated-by` against
  both classes.

  It stands at 301 N Main Street, 40.7430708, -84.1051751, and the county records its `MUNI` as
  Lima. [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md). The Census
  Bureau puts the same point in Lima city, GEOID `3943554`. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md). This is the one site of the three checked
  whose `located-in` edge was right all along, and it was checked anyway — a corpus that only
  tests the claims it doubts learns nothing about the ones it trusts.

  [open] The present courthouse's construction date, its architect, and whether it is the
  county's first or a successor to an earlier building are all unverified. Ohio county
  courthouses are commonly the third or fourth on their site, and assuming this one is
  original would be exactly the sort of plausible error this corpus is built to avoid.
properties:
  site_type: courthouse
  status: in operation
  address: 301 N Main Street, Lima OH 45801
  coordinates: "40.7430708, -84.1051751"
