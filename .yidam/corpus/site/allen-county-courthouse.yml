class: site
label: Allen County Courthouse
description: |
  The seat of county government at Lima — the building the
  [county government](../jurisdiction/allen-county-government.yml) occupies and the physical
  expression of Lima's status as county seat. [inference]

  It is in the corpus as the worked example of a site whose operator is a jurisdiction rather
  than an organization, which is why [site](../site.ont.yml) declares `operated-by` against
  both classes.

  It stands at 301 N Main Street, 40.7430708, -84.1051751, and the county records its `MUNI` as
  Lima. [verified] — [Allen County GIS](../../catalog/allen-county-gis-downloads.md). The Census
  Bureau puts the same point in Lima city, GEOID `3943554`. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md). This is the one site of the three checked
  whose `located-in` edge was right all along, and it was checked anyway — a corpus that only
  tests the claims it doubts learns nothing about the ones it trusts.

  **It is the county's third courthouse, and the caution written into this node was right.** The
  node refused to assume the building was original, on the general ground that Ohio courthouses are
  usually the third or fourth on their site. It is the third. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

      pioneer  contracted 27 Aug 1831 with Josiah Crawford for $175; first used by the
               commissioners 4 Mar 1833; sold at auction with the jail, July 1841
      old      built by Boughton of Wayne County for $13,325; dedicated 1842 and formally
               opened 7 Dec 1842, at West Market Street and the Square
      present  approved by county vote 4 Apr 1881, corner-stone 4 Jul 1882, opened fall 1884

  **The architect was G. H. Maetzel of Columbus**, whose plans were adopted September 20 and who
  was appointed October 27, 1881. The county issued $142,500 in bonds, let eleven contracts on
  November 10, 1881 — $39,000 of Berea cut stone, $35,600 of iron work — and the total came to
  about $160,000 with $10,000 of stained cherry furniture. [verified] — same source. The
  corner-stone was placed on the Fourth of July "without ceremony".

  **The vote that authorised it is also a census of the county's civil geography in 1881**, returned
  in fifteen units: twelve townships by name — German and Ottawa among them — Lima City with its
  four wards itemised, and [Richland](../place/richland-township.yml) appearing not by name but as
  its two precincts, Bluffton and Beaver Dam. Thirteen townships, fifteen returns. [verified] —
  same source. See
  [what became of German and Ottawa townships](../question/what-became-of-german-and-ottawa-townships.yml).

  **The canvass adds up, and that is the point of transcribing it.** The fifteen returns sum to
  exactly the 1,014 dissenting and 3,333 consenting the book states, for its stated majority of
  2,319, and Lima's four wards sum to exactly its city total of 31 and 1,250. [verified] — computed
  from the printed figures. A compiler inventing a canvass does not make it balance to the vote.

  **The building committee corroborates a sheriff.** It included "John Franks, Sheriff" in 1881, and
  [the roster](../person/john-franks.yml) kept by the sheriff's own office gives his term as
  1877-1881. Two records with no common source agree on the man and the year. [verified] — same
  source and [past-sheriffs roster](../../catalog/acso-past-sheriffs.md).

  **The 1842 courthouse's site is now known, and a commercial block took it.** The second courthouse
  stood where the Cincinnati Block later stood, and it was still the county's building in April
  1861, when a flag was strung on a wire between Ashton Hall and it and Lima's congregations
  gathered under it to hear that Fort Sumter had been fired on. [verified] —
  [the 1921 history](../../catalog/rusler-allen-county-1921.md); see
  [the first company](../event/the-first-lima-company-1861.yml).

  [open] Whether the 1884 building has been altered or extended since, and when the 1842 one came
  down. Its site is known now and the year it stopped being a courthouse is not — the present one
  opened in 1884 and no source here dates the demolition.
