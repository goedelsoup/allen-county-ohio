class: site
label: Lima State Hospital
description: |
  Ohio's hospital for the criminally insane, north of [Lima](../place/lima.yml), authorised by an
  act of the Ohio Assembly on **25 April 1904** and opened for patients on **1 July 1915**.
  [verified] — [the 1921 history](../../catalog/rusler-allen-county-1921.md).

  **It was won rather than assigned.** Governor Myron T. Herrick appointed a committee to choose
  the site, a number of other communities offered ground, and the Hon. Walter B. Ritchie sat on the
  committee and used his influence for Lima while the Lima Club worked to secure it. The same club
  is credited with bringing the Ohio Steel Works. [verified] — same source. A county that had
  spent thirty years competing for railways and refineries competed for this the same way.
  [inference]

  **In December 1920 it held 789 men and 165 women.** [verified] — same source. That is 954 people
  in a county of 68,223, and it makes the hospital at that moment more populous than every
  incorporated place in Allen County except four. The same book lists them: Lima 41,306, Delphos
  3,169 in the Allen part, Bluffton 1,950, Spencerville 1,543, then Elida 509, Beaver Dam 394,
  Harrod 389, Lafayette 383 and West Cairo 380. [verified] — same source; the comparison computed
  here. [inference]

  **It was a farm as much as a hospital, and the patients worked it.** 576 acres, all but about
  thirty of natural forest cleared and cultivated, in Bath Township north from Lima, bought by the
  state for $63,622 and "said to be the poorest land in Allen County". [verified] — same source.
  In 1920 it produced 433,280 pounds of milk, 9,084 pounds of butter, 762 dozen eggs, 19,405 pounds
  of pork, 7,299 of lard, 4,148 of beef and 1,850 of veal; the crop valuation was $9,362.33 and the
  whole production $14,520, none of it sold. The property inventory came to $1,833,639.83 and the
  equipment to $82,929.30, and the state's maintenance pro rata was $21,977.84.

  **The 1940 census carries the institution's signature in the township's race lines.** Bath
  Township held 3,438 people that year, 2,256 of them men; its 260 Black residents ran 204 men to
  56, and its 303 foreign-born white residents 259 men to 44. [verified] —
  [the state population volumes, 1930–1960](../../catalog/census-population-volumes-1930-1960-ohio.md),
  Table 28. Three of every four Black residents of Allen County outside Lima were in this township
  in 1940, and those ratios describe a committed population rather than a settled one. [inference] —
  see [the county by race, 1930–1960](../measure/allen-county-population-by-race-1930-1960.yml).

  **The 1918 influenza reached it and the book counts the cases.** 244 cases of flu, of which 8 per
  cent died — about twenty people. [verified] — same source. It is the only figure this corpus
  holds for the pandemic in Allen County.

  Its superintendent was Dr. Charles H. Clark, allowed three assistant physicians, of whom two were
  in post; visitors were admitted on Tuesdays and Thursdays; and twice a year the superintendent
  entertained the Allen County Medical Society at a clinic. [verified] — same source. Of the
  patients the book writes that "all must return to the penal institution from which they were
  committed for their final freedom", which is the sentence that says what kind of institution it
  was. [verified] — same source.

  **The ground it stood on is almost certainly the ground the state still confines people on.**
  The three correctional landmarks the Census Bureau carries in this county —
  [Allen Correctional Institution](allen-correctional-institution.yml),
  [Oakwood](oakwood-correctional-facility.yml) and the Western Ohio Regional Treatment and
  Rehabilitation Center — all stand north of Lima within a mile of one another and come to about
  450 acres together, against this farm's 576. [inference] —
  [TIGER/Line landmarks](../../catalog/census-tiger-landmarks.md), computed here. No source held
  here carries the conveyance, the renaming, or the division of the tract.

  **What was Bath Township in 1921 is Lima city now.** The 1921 history places the farm in Bath
  Township; the Census Bureau puts all three institutions in Lima city, census tract 112. [verified]
  — the 1921 history and
  [the 2020 redistricting file](../../catalog/census-2020-redistricting-file.md). Lima's boundary
  moved north over the ground at some point in the century between, which is one more datum for an
  annexation record this corpus barely has. [inference]

  [open] What became of it, and when. The corpus has the institution in 1915 and 1920 and nothing
  after; it does not hold the year it was renamed, the year part of the tract became a prison, or
  whether the hospital and the present psychiatric facility are one body under two names.

  [open] The deed. The Recorder's tract books abstract this county's conveyances by piece of
  ground from the federal patents forward, and a purchase of 576 acres by the State of Ohio for
  $63,622 between 1904 and 1915 would be in them.
