class: site
label: Allen County Memorial Hall
description: |
  The county's soldiers' memorial building in Lima, at West Elm and South Elizabeth Streets, on
  the National Register since 7 May 1979 as reference `79001779`. [verified] —
  [the NPS spatial dataset](../../catalog/nrhp-national-register.md).

  **It is the county's memory, kept in one room.** The Allen County Historical and Archaeological
  Society was organised in Lima across three meetings — December 1908, 4 January 1909 and
  15 January 1909 — and "the story of the organization of the historical society and of the
  building of the Allen County Memorial Hall are closely linked together. When it was nearing
  completion it offered permanent shelter for the society." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). The county
  provided the cases; James Pillars, a former county surveyor, was its curator by acclamation and
  his widow succeeded him. So the building was near enough to finished to house a museum by about
  1909. [inference] — the corpus has no construction date for it.

  **This corpus has been reading a book written in this building's collection.** The society's rule
  was that "all papers read before the society become its property, and thus there is a complete
  Allen County history on file in the archives", and the 1921 history is the work of a man who
  moved in those rooms. [verified] — same source.

  **One event this corpus already holds happened here.** The movement that produced the Fort Amanda
  monument began at a meeting called by William Rusler on 4 February 1913 "in Memorial Hall".
  [verified] — same source, which names the building without the county's name in front of it. That
  it is this hall and not another is an inference: the same book indexes `Allen County Memorial
  Hall` and `Memorial Hall` to the same volume and puts the county museum in it, and the only other
  memorial hall it names is a Salvation Army building not yet built in 1913. [inference] — see
  [the fort](fort-amanda.yml).

  **Men were sworn into the World War in it.** "Memorial Hall was a busy center in wartime; the
  soldiers inducted into the service there represented a radius many miles in every direction from
  Lima; they did not all live in Allen County ... all Allen County boys lined up there and
  luncheons were served to everybody entering the service." [verified] — same source. A building
  put up to remember one war became the room the next one's men left from; see
  [the period](../period/the-world-war-in-allen-county.yml). It is also part of why the county's
  own count of who served is uncertain — the hall drew men from beyond the county line and the
  roster had to be sifted afterwards. [inference] — see
  [the service roster](../measure/allen-county-world-war-service.yml).

  **The first courthouse bell stands in front of it, cracked.** "The bell now resting in front of
  Memorial Hall is the first Allen County courthouse bell, and therefore it was the first fire bell
  in Lima ... there is a crack — an injury to the bell." [verified] — same source. That is the bell
  of [the pioneer courthouse](allen-county-courthouse.yml) contracted for $175 in 1831 and sold at
  auction in 1841, standing outside a building put up seventy years later. [inference]
