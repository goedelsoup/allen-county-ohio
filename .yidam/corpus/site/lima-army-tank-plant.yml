class: site
label: Joint Systems Manufacturing Center (Lima Army Tank Plant)
description: |
  The government-owned tank plant south of Lima — the only facility in the United States that
  builds main battle tanks, producing and rebuilding the M1 Abrams under contractor operation.
  [inference] It stands at 40.6994478, -84.137903 and is registered as
  `United States Army Joint Systems Manufacturing Center Lima`, feature class Military.
  [verified] — [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md), feature 2512481.

  **It is not in Lima.** The plant stands in [Shawnee Township](../place/shawnee-township.yml),
  GEOID `3900371955`, and no incorporated place and no census designated place contains it — not
  Lima, and not the [Fort Shawnee](../place/fort-shawnee.yml) CDP a mile and a half away.
  [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md), point-in-polygon against the
  2020 county-subdivision, incorporated-place and CDP layers. The `located-in` edge points at
  the township accordingly; it named Lima from genesis until this was checked.

  The county says so too, from its own data and by a different route: its address file records
  the plant at 1151 Buckeye Road with `USPS_CITY` "LIMA" and `MUNI` **blank**. [verified] —
  [Allen County GIS](../../catalog/allen-county-gis-downloads.md). Two agencies, two geometries,
  one answer.

  Two claims here were wrong in the same direction. This node said the plant is on Lima's
  **northern** edge and it is 2.84 miles south of Lima's internal point, in another township
  entirely; and [American Township](../place/american-township.yml) said the plant stands on or
  near *its* boundary with Lima, which wraps Lima's west and north. The plant is south of the
  city and on neither. [verified] — same source.

  It is government-owned and contractor-operated, which is why its `operated-by` edges point
  at both a jurisdiction and a company in principle; only the ownership side is asserted here,
  because the operating contractor is a corporate relationship this corpus has not sourced and
  which has changed hands. [inference]

  Its presence makes Allen County's industrial base unusual in a specific way: the plant's
  workload is set by federal procurement rather than by any regional market, so the county has
  a major employer whose fortunes are decoupled from the deindustrialization that shaped the
  rest of its economy. [inference]

  **One contractor name is attached to this plant now, for seven years thirty years ago.** The
  Toxics Release Inventory holds two records at this address: `U.S. ARMY JSMC GENERAL DYNAMICS LAND
  SYSTEMS`, parent General Dynamics Corp, filing from 1987 to 1993; and `U S ARMY JOINT SYSTEMS
  MANUFACTURING CENTER`, parent US Department of Defense, filing from 1994 to 2024. Same street,
  same coordinates. [verified] — [EPA TRI](../../catalog/epa-tri.md); see
  [the reporters](../measure/allen-county-tri-reporters-1987-2024.yml).

  What changed in 1994 is who filed and not who operated. General Dynamics has been the
  contractor-operator of this installation continuously since March 1982, when Chrysler sold
  Chrysler Defense to it for $348.5 million. [verified] —
  [the historic properties report](../../catalog/dtic-lima-army-tank-plant-reports.md), *M-1 Tank
  Era*. The reporting entity at a government-owned plant is a compliance arrangement rather than a
  contract award, and the two moved independently.

  **The contract awards are now here, and they name the same company across eighteen years.**
  General Dynamics Land Systems Inc. holds **$453,692,926** of federal contract work whose place of
  performance is Allen County between federal years 2008 and 2025 — the largest of any performer in
  the county, and 41.7 per cent of all federal contract dollars performed on this county's ground.
  [verified] — [USAspending](../../catalog/usaspending.md), place of performance, by recipient; see
  [the contracts](../measure/federal-contracts-in-allen-county-2008-2025.yml).

  **One award says what the plant makes and for whom.** $71,709,279, 30 December 2010 to 2 July
  2012, Department of the Army, for "(42) MATERIAL SETS FOR THE CONVERSION OF M1A2 TANKS TO M1A2S
  CONFIGURATION FOR THE KINGDOM OF SAUDI ARABIA". [verified] — same source, the award endpoint. The
  Toxics Release Inventory had the company at this address from 1987 to 1993 and the corpus could
  not say whether it was still here; a contract performed here in 2012 says it was. [inference]

  **And a second company's contract says the plant is still a plant.** Siemens Government
  Technologies holds $127,157,950 for "ENERGY CONSERVATION MEASURES AT JSMC LIMA, OH", running
  30 December 2016 to 31 May 2038 — a twenty-two-year period of performance on this installation's
  utilities, and the longest in the county's contract record. [verified] — same source. A government
  buying two decades of boiler-house work is not closing the building. [inference]

  **It operates it, and the document that says so is the Army's.** General Dynamics took over M-1
  production at Lima and at Detroit in March 1982 as contractor-operator, succeeding the Chrysler
  Corporation and then Chrysler Defense, which had begun production of M-1s at Lima in May 1979 and
  delivered the first two production tanks in February 1980. [verified] — the same source. The
  question this node carried for eighteen years of contract awards is answered by a forty-two-year-old
  report on its buildings.

  **The county's tank work began at the Locomotive Works, and it began in 1941.** Medium tank
  production was scheduled to start "this fall" at the Lima Locomotive Works, which had joined
  Chrysler, American Locomotive, Baldwin, Pullman Standard and Pressed Steel Car in the medium tank
  programme. [verified] — [Chronicling America](../../catalog/chronicling-america.md),
  *Evening Star*, 24 August 1941, page 4, and *Automotive News*, 14 April 1941, page 10. That is a
  private company retooling its own plant, and it is not this installation.

  **This installation is the other one, and it is the Lima Tank Depot.** Construction began here in
  May 1942; the Ordnance Corps turned it from a gun-tube plant into a depot for modifying and
  processing combat vehicles before it was finished; United Motors Service, a General Motors
  subsidiary, took it over under contract in November 1942; and more than a hundred thousand
  vehicles passed through before the war ended. [verified] —
  [the historic properties report](../../catalog/dtic-lima-army-tank-plant-reports.md), *World War
  II to 1950*; see [the Army's first shovel](../event/the-army-builds-at-lima-1942.yml). Every one
  of those facts was already in this corpus, attached to a node the corpus had argued was somewhere
  else.

  **The Depot's own record was newspaper and it was right.** Vehicles arrived "in a 'raw' state of
  completion to Lima from the tank arsenals throughout the United States", were given a final run on
  the Depot's proving ground, sealed, and put on a road train for a shipping port; the officer in
  charge called it "the central supply base for combat vehicles". Its employees came from within
  fifty miles across thirteen counties, and it was still operating and named in February 1950.
  [verified] — [Chronicling America](../../catalog/chronicling-america.md), *The Bluffton News*,
  3 August 1944 page 2 and 9 February 1950, and *Automotive News*, 21 February 1944, page 28.

  **The names are a chronology.** Lima Tank Depot through the war; Lima Ordnance Depot from late
  1945, holding mothballed vehicles; Lima Army Modification Center through the 1970s, when it
  received and processed 12,400 new M880 trucks; and Lima Army Tank Plant on the M-1 award.
  [verified] —
  [the historic properties report](../../catalog/dtic-lima-army-tank-plant-reports.md). The 1972
  sewer easement running from "(Lima Army Modification Center) Sec'y of the Army" that this corpus
  found in the Recorder's books is the third of those names in use, and it is the same place.
  [inference]

  **The ground now has a name and a book.** The plant stands on **T4S R6E section 14**, and the
  Recorder abstracts that section in **Section Ground volume 34A**. [verified] —
  [Allen County GIS REST](../../catalog/allen-county-gis-rest.md) layer 55, cross-checked against
  the parcel number on the same point, and
  [the Recorder's book list](../../catalog/allen-county-recorder-section-ground.md); see
  [the survey sections](../measure/allen-county-survey-sections.yml).

  That is not an answer. It is the first time this corpus can say *where to look* for one: a tract
  index runs from the federal patent forward and records who conveyed this ground to whom and
  when, which is the shape of the question this node has been asking since genesis. [inference]

  **The United States bought this ground in June 1951, and that is a different war.** Five warranty
  deeds from five private owners, dated 20, 20, 21, 27 and 28 June 1951 and recorded the same day
  or the next, conveyed parts of this quarter section to the United States of America — 60.24
  acres, 5 acres, 40 acres of the west half of the east half, and two more described only as "Pt".
  [verified] — [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md),
  volume 0034A pages 89–92, at volumes 320 pages 573, 574 and 577 and 321 pages 245 and 246.

  Five conveyances closing inside nine days, most recorded on the day of signature, is what a
  government buying under deadline looks like rather than a farm changing hands. [inference]

  **So this ground was in private hands throughout the Second World War.** The same abstract shows
  it mortgaged to Home Bank in 1940 and 1941 and to a Home Savings & Loan in 1941 and 1944, leased
  to the Protective Association of Lima and the Allen County Fishing & Game club in April 1940, and
  crossed by pipeline rights of way granted by its private owners in 1939, 1940 and 1949.
  [verified] — same pages. Whatever the Army was doing at Lima during that war, it was not doing it
  here.

  **That was read here as settling an identity question, and it settled nothing.** This node and the
  Lima Tank Depot were held as separate nodes with the identity question written on both; the corpus
  then took these deeds as proof that they were different places, on the reasoning that two
  installations cannot occupy one piece of ground eight years apart with a farm in between. The
  quarter section is 60 acres of a 458-acre installation and it was bought in 1951 to expand one
  built in 1942. [verified] —
  [the historic properties report](../../catalog/dtic-lima-army-tank-plant-reports.md), *Korean War
  to 1975*. They are the same ground, the obvious reading was the right one, and the argument
  against it was a parcel doing the work of a boundary; see
  [a parcel is not an installation](../../decisions/a-parcel-is-not-an-installation.yml). [inference]

  **It was called the Lima Army Modification Center in 1972.** A sewer easement to the Allen County
  commissioners that January runs from "(Lima Army Modification Center) Sec'y of the Army".
  [verified] — same pages, volume 519 page 538. It is the only name this corpus holds for the
  installation between its acquisition and the present one.

  **General Dynamics was here in 1988 and still had an interest in 2003.** A mechanic's lien for
  $37,367.96 was filed by Orbit Movers & Erectors Inc against "General Dynamics Corp United States
  of America" on 30 September 1988; General Dynamics Land Systems granted a financing statement to
  General Electric Capital Corp recorded 13 January 2003. [verified] — same pages.

  That bears directly on what changed in 1994. The Toxics Release Inventory shows General Dynamics
  filing to 1993 and the Department of Defense from 1994, and this node could not say whether the
  operator changed with the filer. A contractor still granting a financing statement on this ground
  ten years later is evidence that it did not. [inference]

  **The installation's size is a chronology of its use.** 170 acres in May 1942; 163 after a
  seven-acre sale in 1943 and unchanged for eight years; 458 by June 1951, when the Army added 295
  contiguous acres to the south-east for a tank test track; and 373 by the mid-1970s, after land was
  released to an Army Reserve training centre and to Johnny Appleseed Park. [verified] —
  [the historic properties report](../../catalog/dtic-lima-army-tank-plant-reports.md). It was
  nearly idle from 1954 to 1975, through the whole of the Vietnam War, and parts of it were leased
  out for commercial use.

  **It was chosen for the M-1 in August 1976 and rebuilt for it.** A $40 million project put a
  1.5-mile tank test track on the 1951 ground and a 250,000 square foot addition on Building 147,
  whose original single-pane curtain wall was replaced with insulated metal panels, for a production
  rate of thirty tanks a month. [verified] — the same source. That is why a plant whose core
  buildings date from 1942 does not look like a wartime plant.

  **No archeologist has ever looked at this ground.** The Army's companion overview reports the lack
  of any known archeological site on the installation and states that no archeological investigation
  has ever been conducted on its land, recommending a reconnaissance survey of a 53-acre parcel then
  scheduled for construction. [verified] —
  [the archeological overview](../../catalog/dtic-lima-army-tank-plant-reports.md); see
  [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml). An absence of sites in a file
  that records no survey is an absence of looking. [inference]

  **This corpus cannot say what the plant has been since 1984.** The Army's report ends with the
  M-1 line running at thirty tanks a month and a contractor two years into its tenure; what the
  corpus holds after that is a contract ledger, a pollutant filing and a payroll count, and none of
  those describes a building or a mission.

  [open] What became of the 99-acre storage site three miles away. The Army bought it immediately
  after the war, parked vehicles on 210 circular concrete pads under cylindrical containers meant
  for gasoline, and divested itself of the land in the late 1950s or early 1960s; the corpus has no
  location for it and has not looked for the pads. [verified] —
  [the historic properties report](../../catalog/dtic-lima-army-tank-plant-reports.md).

  **No building stands within a hundred and fifty metres of this node's coordinate.** The nearest
  large footprint is 993,868 square feet — 22.8 acres, classed *Government / Non-Civilian
  Structures*, the third largest in the county — and it lies 632 metres away. [verified] —
  [USA Structures](../../catalog/fema-usa-structures.md), queried by point; see
  [the buildings](../measure/allen-county-buildings-2019.yml). A coordinate of
  record for a plant of this size names the installation and not a roof on it; see
  [a photograph is not a register](../../decisions/a-photograph-is-not-a-register.yml).

  **Seventy people here are on the federal payroll.** Allen County has one federal establishment
  classified under national security, employing 70 at $87,612 a year in 2023. [verified] —
  [the wage file](../../catalog/bls-qcew.md), NAICS 928110; see
  [the government payroll](../measure/allen-county-government-employment-2014-2024.yml). This is the plant's federal cadre and not its workforce: a government-owned,
  contractor-operated plant pays the people who build vehicles through the operating contractor, and
  they are private employment counted under manufacturing. [inference]

