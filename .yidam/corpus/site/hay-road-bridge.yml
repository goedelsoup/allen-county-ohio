class: site
label: The Hay Road bridge over the Auglaize River
description: |
  **The oldest bridge in Allen County, built in 1909, and the only one of the county's 364 that the
  federal inventory marks as eligible for the National Register.** [verified] —
  [the National Bridge Inventory](../../catalog/national-bridge-inventory.md), 2025 Ohio file, item
  37 coded 2 for this structure and 5 — not applicable — for every other bridge in the county.

  **Eligible and not listed.** None of the county's twenty-nine National Register entries is a
  bridge. [verified] — [the register](../measure/allen-county-national-register.yml). Eligibility is
  a determination made in the course of federal review and is not a nomination; a bridge can carry
  it for decades without anyone filing. [inference] — see
  [a register records nominations](../../decisions/a-register-records-nominations.yml).

  **It is a small structure on a small road.** 14.6 metres long, one span of the county's median
  length or less, owned and maintained by the county, carrying Hay Road over
  [the Auglaize River](../natural-feature/auglaize-river.yml) in the county's south-east. [verified]
  — the inventory.

  **It stands in [Auglaize Township](../place/auglaize-township.yml)**, at 40.674411, -83.918481.
  [verified] — the inventory for the coordinates and
  [the Census geocoder](../../catalog/census-tiger-landmarks.md) for the township, which returns
  Allen County, Auglaize township and Census Tract 115 for that point. The corpus places it rather
  than assuming it, because the point is four miles from a county line. [inference]

  **What the file will not tell you is what it is called.** The inventory carries the road and the
  water and no name, and gives it the structure number 0234753. It is a hundred and seventeen years
  old, it is the oldest thing in this county that people still drive over, and the corpus knows it
  only as a row. [inference]

  **It is a concrete deck arch, one of five in the county and the oldest of them.** Item 43 codes it
  as concrete of type *arch — deck*; the other four carry the Lincoln Highway over the Auglaize
  (1926), Bluffton's Main Street over Riley Creek (1925), Treatment Plant Road over the Ottawa
  (1930) and North Street over the Ottawa (2004). [verified] —
  [the inventory](../../catalog/national-bridge-inventory.md), 2025 Ohio file. [inference] — the
  five counted here, out of 364 structures of which 175 are multiple box beams and 21 are through
  trusses.

  **Its condition is the best it has been recorded at, and nothing was done to it.** The deck, the
  superstructure and the substructure were rated 5, 6 and 5 in the 1992 edition, 5, 5 and 4 in 2010,
  6, 5 and 5 in 2022, and **7, 7 and 7 in 2025** — with the reconstruction year blank in every one
  of the twelve editions read. [verified] —
  [the inventory](../../catalog/national-bridge-inventory.md), the twelve Ohio files; see
  [the condition series](../measure/allen-county-bridge-condition-1992-2025.yml).

  A hundred-and-sixteen-year-old arch does not gain three points on its substructure by standing
  still, and this is the clearest single case of the change that ran through the county's 2023
  inspection round. [inference]

  **It carries about a hundred and seventy-five vehicles a day**, counted in 2016. [verified] —
  same source.

  [open] Whether anyone has ever proposed it for the Register. That is not in any source held here.
