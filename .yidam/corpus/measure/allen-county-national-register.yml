class: measure
label: Allen County on the National Register, 1966–2004
description: |
  **Twenty-nine listings, and seventeen of them are one year.** Everything in Allen County on the
  National Register of Historic Places, with the day the Keeper signed each one. [verified] —
  [the NPS spatial dataset](../../catalog/nrhp-national-register.md), points and polygons queried
  together on `State='OHIO' AND County='Allen'`.

      1966-10-15   Miami and Erie Canal, Deep Cut          structure   Spencer Twp   NHL
      1974-07-24   Allen County Courthouse                 building    Lima
      1976-12-12   Neely-Sieber House                      building    Lima
      1978-09-20   MacDonell House                         building    Lima
      1979-05-07   Lima Memorial Hall                      building    Lima
      1979-11-29   Metropolitan Block                      building    Lima
      1980-01-03   St. John Catholic Church                building    Delphos
      1982-04-01   Marks-Family House                      building    Delphos
      1982-10-07   sixteen buildings, Lima MRA             building    Lima
      1983-01-11   Breese, Griffith, Farm                  building    Shawnee Twp
      1986-05-15   Barr Hotel                              building    Lima
      2002-03-21   Lima Stadium                            structure   Lima
      2003-08-21   Lima Pennsylvania Railroad Depot        building    Lima
      2004-10-27   West Market Street Boulevard HD         district    Lima

  Written out: **twenty-nine listings between 15 October 1966 and 27 October 2004 — twenty-six
  buildings, two structures and one historic district — of which sixteen were signed on a single
  day, 7 October 1982, under the Lima Multiple Resource Area submission.** [verified] — same
  source. Seven listings precede 1982 and five follow it.

  **The sixteen are a document, not a decade.** More than half of what this county has on the
  federal register arrived in one nomination, and the corpus reads that the way it read
  [its own sheriff roster](../../decisions/eighty-eight-rows-are-not-eighty-eight-nodes.yml): a
  list can look long and be one act. Between the Barr Hotel in May 1986 and Lima Stadium in March
  2002 nothing at all was added, and nothing has been added in the twenty-one years since the last.
  [inference] — computed here from the certification dates.

  ## Where they are

  Every one of the twenty-nine falls inside the county's own map, checked a point at a time.
  [verified] — [Allen County GIS](../../catalog/allen-county-gis-rest.md), point-in-polygon against
  the township and survey-section layers.

      Lima                25        section T3S R7E 31    20
      Delphos              2        T3S R6E 36             3
      Shawnee Township     1        T2S R5E 30             2
      Spencer Township     1        four other sections    4

  **Twenty of the twenty-nine stand in one square mile.** Survey section 31 of T3S R7E — downtown
  Lima — holds the courthouse, the theatre, the stadium and every block building of the 1982
  submission. [verified] — same join. **Ten of the county's twelve townships hold nothing**, and
  neither does any village but Delphos: Bluffton, Elida, Cairo, Harrod, Lafayette, Beaverdam,
  Spencerville and Fort Shawnee have no listing of any kind. [verified] — same source against
  [the county's places](../place/allen-county.yml).

  **Two listings name a town they do not stand in**, and the file says so in a field of its own.
  The Deep Cut is filed under Spencerville and lies in Spencer Township; the Griffith Breese Farm
  is filed under Lima, at 2875 Fort Amanda Rd, and lies in Shawnee Township. Both carry
  `Vicinity: True`. [verified] — same source. The federal register keeps a column for exactly the
  distinction this corpus had to argue for from a refinery — see
  [an address is not a municipality](../site/lima-refinery.yml).

  ## The one Landmark is a ditch

  **Allen County has a single National Historic Landmark and it is the Deep Cut**, a canal
  excavation two miles south of Spencerville, listed 15 October 1966 — the day the National
  Register began, when the existing Landmarks were entered into it as a body. [verified] —
  [the NPS dataset](../../catalog/nrhp-national-register.md), `Is_NHL` set on one of twenty-nine.
  It is also the county's oldest listing by eight years and the only one that is not a building or
  a district. See [the canal](../site/miami-and-erie-canal.yml).

  ## What is not on it

  **No industry.** Not the [locomotive works](../site/lima-locomotive-works-plant.yml), which built
  Shays and Berkshires and gave the county its name in the trade; not
  [the refinery](../site/lima-refinery.yml), running since 1886; not
  [the tank plant](../site/lima-army-tank-plant.yml) or
  [the Ford engine plant](../site/ford-lima-engine-plant.yml). [verified] — the county's whole list
  above. A county whose nineteenth and twentieth centuries were made of iron, oil and rolling stock
  has twenty-six commercial and domestic buildings and a stadium on the federal register, and
  nothing it made anything in. [inference] — observed here; see
  [a register records nominations](../../decisions/a-register-records-nominations.yml).

  [open] Whether anything in this county has ever been removed from the Register. The dataset
  carries `STATUS: Listed` on all twenty-nine and would simply omit a delisted property, so it
  cannot answer its own question.
properties:
  parameter: properties listed on the National Register of Historic Places
  value: "29"
  unit: listings
  as_of: "2026-08-31"
  method: |
    Layers 0 and 1 of the NPS `nrhp_locations` map service queried on `State='OHIO' AND
    County='Allen'` and unioned — 26 points and 3 polygons, no property in both. Polygon centroids
    computed here from the returned rings. Each of the 29 resulting coordinates put to the Allen
    County GIS township and section layers. Certification dates are the file's two-digit years read
    as 19xx above 30 and 20xx below. [verified]
