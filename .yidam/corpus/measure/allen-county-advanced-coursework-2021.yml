class: measure
label: Who takes the advanced courses in Allen County, 2021
description: |
  **One hundred and thirty-two of Allen County's 4,836 high-school pupils are enrolled in an
  Advanced Placement course, and three of them are Black.** [verified] —
  [the Civil Rights Data Collection](../../catalog/crdc-civil-rights-data-collection.md), its 2021
  Advanced Placement and enrolment files for the county's ten high schools. Black pupils are 713 of
  the roll, one in seven, and 2.3 per cent of the AP seats.

      2021-22, Allen County's ten high schools     all    White   Black   Hispanic   two or more
      enrolment                                  4,836    3,469     713        210            392
      Advanced Placement                           132      111       3          6              6
      gifted programme                             155      143       3          4              5
      College Credit Plus                          492      432      25         14             17
      calculus                                     139      110      13          3             10
      chemistry                                    825      651      68         36             57
      physics                                      911      606     149         48             95
      geometry                                   1,068      746     166         51             99
      algebra II                                   856      610     142         27             69
      biology                                    1,441    1,056     191         62            114

  **The courses the state requires are taken evenly and the ones a pupil elects are not.** Black
  pupils in this county take physics at 20.9 per cent of their number against white pupils' 17.5,
  geometry at 23.3 against 21.5 and algebra II at 19.9 against 17.6 — level or ahead in each. They
  take chemistry at 9.5 per cent against 18.8, calculus at 1.8 against 3.2, College Credit Plus at
  3.5 against 12.5 and Advanced Placement at 0.4 against 3.2. [verified] — the same source, the 2021
  coursework files divided by its own enrolment.

  **The gap opens exactly where the choosing starts.** Every course on which the two groups are level
  is one a pupil is carried into by the graduation requirement; every course on which they are not is
  one a pupil, a parent or a counsellor has to ask for. [inference] — the reading is this corpus's,
  from the pattern above. Nothing in the file records who asked, who was told, or who decided.

  **Part of it is which building a child is in, and the larger part is not.** 424 of the county's 713
  Black high-school pupils attend Lima Senior, which offers no AP course, so the two groups are not
  looking at the same menu. Apply each school's *own* white rate to its *own* Black enrolment, which
  removes the menu difference entirely, and the county would expect just under twelve Black pupils
  in an Advanced Placement course and has 3; 66.7 in College Credit Plus and has 25; 27.2 in
  calculus and has 13; and 88.9 in chemistry and has 68. [inference] — computed here from the same
  files. Restricting the AP comparison to the two schools that offer it leaves white pupils at 11.8
  per cent and Black pupils at 2.5, a ratio of 4.6 where the county-wide ratio is 7.6, so the part
  that is between schools multiplies the gap by about 1.6 and the part inside them by about 4.6. See
  [a gap between schools is not a gap inside one](../../decisions/a-gap-between-schools-is-not-a-gap-inside-one.yml).

  **Inside Lima Senior the ratio is five to one.** Its 343 white pupils hold 33 of its 48 College
  Credit Plus places and its 424 Black pupils hold 8 — 9.6 per cent against 1.9. In calculus it is
  17 against 11 on the same two enrolments. [verified] — the same source, that school's rows.

  **Advanced Placement in this county has fallen by half and among its Black pupils by nine tenths.**
  270 pupils were enrolled in an AP course in 2013 and 132 in 2021, on a high-school roll that moved
  from 4,917 to 4,836; the Black count runs 29, 6, 4, 3. [verified] — the same source, its 2013,
  2015, 2017 and 2021 files. The white rate divided by the Black rate was 1.43 in 2013 and is 7.60
  now.

      Advanced Placement, Allen County high schools
      year   pupils   White   Black   White rate   Black rate
      2013      270     198      29        5.37%        3.76%
      2015      149     116       6        3.10%        0.72%
      2017      132     111       4        3.19%        0.50%
      2021      132     111       3        3.20%        0.42%

  **Lima Senior enrolled 67 pupils in Advanced Placement in 2013, thirteen of them Black, and it is
  the school that stopped.** Those thirteen were nearly half of every Black AP pupil in the county
  that year. [verified] — the same file, that school's 2013 rows. What the county lost between 2013
  and 2015 is very largely one school's programme, and what its Black pupils lost is almost all of
  it. [inference]

  **The 2017 and 2021 totals are both 132 and that is a coincidence.** In 2017 four schools
  contributed 99, 16, 10 and 7; in 2021 two contributed 95 and 37. [verified] — the same source, by
  school. The white subtotal is 111 in both years too, from 80 + 14 + 10 + 7 and from 80 + 31.

  **The county takes more science than Ohio and a quarter of the Advanced Placement.** Against the
  state's high schools it runs 18.8 per cent in physics to Ohio's 12.4, 17.1 in chemistry to 12.3,
  20.0 in advanced mathematics to 13.9 and 29.8 in biology to 25.8 — and 2.7 per cent in Advanced
  Placement to Ohio's 10.5, 3.2 in a gifted programme to 9.9, and 2.9 in calculus to 3.8.
  [verified] — the same source, over every Ohio school with a twelfth grade.

  **A course enrolment is not a course passed and this file counts only the first.** [inference] The
  collection asks how many pupils were enrolled, not how many finished, sat an examination or earned
  a credit. The Advanced Placement examination counts were collected through 2017 and dropped
  afterwards, so for the year this node describes there is no score anywhere in it.

  **This node does not establish that any child was refused a course.** The file records what each
  school offered and how many pupils of each group were enrolled, and nothing between those two
  facts. See
  [a course that is not offered is not a course refused](../../decisions/a-course-that-is-not-offered-is-not-a-course-refused.yml).

  [open] Whether the county's Black pupils are advised out of these courses, priced out of them,
  or absent from the buildings that hold them. The three would need a counselling record, a fee
  schedule and a transfer file, and none of the three is federal.

properties:
  parameter: pupils enrolled in an Advanced Placement course
  value: "132"
  unit: of 4,836 high-school pupils, Allen County, 2021–22
  as_of: "2021"
  method: |
    Rates use the collection's own enrolment rather than the district files', because a numerator
    from one collection over a denominator from another is wrong before anything is measured; the
    two differ by 1.9 per cent across these ten schools. [verified] The race dimension carries its
    own total at code 99, so the county figure is that row and not a sum over the race codes.
    [verified] Reserved codes are excluded from both numerator and denominator: a school whose AP
    enrolment reads `-2` has answered that it offers no such course, and neither its pupils nor its
    zero enter an AP rate. [verified] The standardisation applies each school's white rate to that
    school's Black enrolment and sums, which is a direct standardisation on the school and removes
    the difference in which buildings the two groups attend. [verified] Ohio comparisons run over
    every school in the state with a twelfth grade and a positive enrolment, on the same rules.
    [verified]
