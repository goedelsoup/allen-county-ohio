  as_of: "2026-08-28"
  method: |
    The whole national CSV, filtered on `State` equal to Ohio and `County` equal to Allen exactly.
    A substring match on the county name alone returns Allen Parish in Louisiana and Allen County
    in Indiana and Kansas; within Ohio the string matches nothing else. [verified] `as_of` is the
    file's own `Data Last Updated` line, which is the first line of the CSV and not its header.
    Storage is `Max Storage (Acre-Ft)`, not normal storage, and the two differ by a fifth across
    these twelve. Purposes are the file's own semicolon-joined vocabulary, unaltered. The low-head
    dams are counted from a different source and are deliberately not added to the twelve: they
    are not in this file, and a total mixing an inventory with a map of points of interest would
    be a number from nowhere. [inference]
