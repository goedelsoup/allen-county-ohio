class: measure
label: Lima land area, 2020
description: |
  Land area of Lima city in the 2020 geography. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio place file.

  This figure is the one in this corpus most exposed to the boundary problem, and it is seeded
  partly to make that visible. A municipality's land area changes by annexation, so comparing
  it to a figure from another year without checking the annexations between them compares two
  different pieces of ground. That check is
  [boundary-comparability](../../skills/boundary-comparability.md), and the corpus now holds
  the annexations: fifty-seven of them for the county between 1990 and 2024, eleven of them
  Lima's, totalling 622 acres. [verified] —
  [the Boundary and Annexation Survey](../../catalog/census-bas-boundary-changes-ohio.md), as read
  in [the annexation record](allen-county-annexations-1990-2024.yml). The comparison the caveat was
  waiting for still cannot be made, for a different reason than the one written here: the land-area
  column mixes annexation with remeasurement and the county's own land area fell 1,235 acres in a
  decade it gained ground. See
  [the control is the figure that cannot move](../../decisions/the-control-is-the-figure-that-cannot-move.yml).
  This figure describes the **corporation's territory**, not the settlement in the ordinary
  sense: the Census Bureau tabulates Lima at the corporate boundary of the date, so what the
  number counts is whatever ground the [City of Lima](../jurisdiction/city-of-lima.yml) had
  annexed by then. [inference] The node therefore carries a `describes` edge to the
  jurisdiction as well as to the place. Both are true and they are not the same claim — the
  place is what the name denotes, and the jurisdiction is what the boundary encloses.
properties:
  parameter: land area
  value: "13.617"
  unit: square miles
  as_of: "2020"
  method: |
    Computed by the Census Bureau from the 2020 TIGER geography, reflecting the corporate
    boundary as of that geography. [verified]
