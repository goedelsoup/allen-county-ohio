class: measure
label: Lima land area, 2020
description: |
  Land area of Lima city in the 2020 geography. [verified] —
  [2020 Census Gazetteer](../../catalog/census-gazetteer-2020.md), Ohio place file.

  This figure is the one in this corpus most exposed to the boundary problem, and it is seeded
  partly to make that visible. A municipality's land area changes by annexation, so comparing
  it to a figure from another year without checking the annexations between them compares two
  different pieces of ground. That check is
  [boundary-comparability](../../skills/boundary-comparability.md), and the corpus holds no
  annexation events yet for it to read.
properties:
  parameter: land area
  value: "13.617"
  unit: square miles
  as_of: 2020
  method: |
    Computed by the Census Bureau from the 2020 TIGER geography, reflecting the corporate
    boundary as of that geography. [verified]
