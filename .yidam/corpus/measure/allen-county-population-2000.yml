class: measure
label: Allen County population, 2000 estimates base
description: |
  The April 1, 2000 estimates base for Allen County. [verified] —
  [Census Intercensal Estimates, 2000–2010](../../catalog/census-intercensal-2000-2010.md),
  county file, field `ESTIMATESBASE2000`.

  An intercensal series is fitted between two known censuses rather than projected from one,
  so this figure is the 2000 enumeration as revised with the 2010 count in hand. [verified]
properties:
  parameter: total resident population
  value: "108464"
  unit: persons
  as_of: "2000-04-01"
  method: |
    Decennial enumeration as revised for the intercensal series. [verified]
links:
  - target: ../place/allen-county.yml
    relationship: describes
    claim_tag: verified
    source: ../../catalog/census-intercensal-2000-2010.md
  - target: allen-county-population-1970.yml
    relationship: comparable-to
    claim_tag: inference
    because: >-
      Thirty years, two publications, and one boundary change that can be bounded by a figure which
      did not move. Between the 1990 and 2000 censuses Allen County gained territory from Putnam,
      by way of Marion Township taking ground from Jennings — the only movement of the county line
      on record since 1848, and it falls inside this pair. Its size is readable off the county's
      own total area, which is 406.88 square miles in the 2000 volume, 406.85 in the 2010 one and
      406.851 in the 2020 gazetteer: **three hundredths of a square mile across twenty years and
      that boundary change**, which at this county's density is single figures of people against a
      fall of 2,680. The gain also pushes the later figure up, so the fall is a floor. See
      [a bound is not a break](../../decisions/a-bound-is-not-a-break.yml) and
      [the control is the figure that cannot move](../../decisions/the-control-is-the-figure-that-cannot-move.yml).
  - target: ../measure.ont.yml
    relationship: instance-of
