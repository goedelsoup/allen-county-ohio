    1996-07-18 0 0 NA NA yes 1 no
    1997-02-27 7 43151 3470 99.9 yes 3 new
    1997-03-01 0 0 934 97.1 yes 1 no
    1997-05-25 0 0 NA NA yes 1 no
    2003-08-02 0 0 NA NA yes 1 no
    2004-09-03 0 0 NA NA yes 1 no
    2008-02-06 8 345988 NA NA no 1 no
    2009-03-08 4 11229 NA NA no 1 no
    2011-05-11 0 0 NA NA yes 1 no
    2011-05-14 0 0 NA NA yes 1 no
    2013-07-08 3 92672 602 94.5 no 1 no
    2019-05-17 11 185317 5000 100.0 no 2 new
    2020-07-09 0 0 NA NA yes 1 no
