class: measure
label: Allen County foreclosures and evictions, 2007–2017
description: |
  The two ways a household loses its home, counted by the two courts that hear them, for the eleven
  years the state's detailed report covers. [verified] —
  [the Ohio Courts Statistical Report](../../catalog/ohio-courts-statistical-report.md).

      year   foreclosures filed   evictions filed   evictions per foreclosure
      2007                  715               798                       1.12
      2008                  996               982                       0.99
      2009                  690               877                       1.27
      2010                  682               902                       1.32
      2011                  472               922                       1.95
      2012                  462               817                       1.77
      2013                  377               872                       2.31
      2014                  308               863                       2.80
      2015                  289               874                       3.02
      2016                  279               913                       3.27
      2017                  264               802                       3.04

  Foreclosures are new filings in the general division of the common pleas court; evictions are new
  forcible entry and detainer filings at the Lima Municipal Court, which serves the whole county.
  [verified] — the same reports.

  **One of these collapsed and the other did not move.** Foreclosure filings peaked at 996 in 2008
  and stand at 264, down **73.5 per cent**; eviction filings run 798 to 982 across the same eleven
  years with a mean of 874.7 and a standard deviation of 55. Their coefficients of variation are
  0.47 and 0.063 — the first series moves seven times as much as the second. [verified] — the same
  reports, the arithmetic here; and see
  [a flat series is a claim](../../decisions/a-flat-series-is-a-claim.yml).

  **In 2008 the county lost about as many owners as renters, and by 2016 it lost three renters for
  every owner.** 996 against 982 in the first year; 279 against 913 in the last full swing.
  [verified] — the same reports. What changed is the owner side. [inference]

  **The court's own eviction counts and the Eviction Lab's are the same numbers.** 982 in 2008, 922
  in 2011 and 863 in 2014 appear in both to the unit; 2017 differs by four, 802 here against 806
  there. [verified] — the same reports and
  [the eviction series](allen-county-evictions-2001-2018.yml). Both chains begin at the same court's
  docket, so this establishes that neither pipeline mangles the count and not that the count is
  independently confirmed; see
  [an exact match is a question](../../decisions/an-exact-match-is-a-question.yml).

  **The eviction docket never clears and the court says so.** Cases pending at year end run 154 to
  373, and the number pending beyond the Supreme Court's own time guideline runs from 0 in 2011 to
  134 in 2015 and stands at 51. The clearance rate reaches 116 per cent in 2011 and 90 in 2017.
  [verified] — the same reports. A clearance rate above 100 means a court closed more cases than
  arrived, which is a fact about a backlog rather than about demand. [inference]

  **5,534 foreclosures and 9,622 evictions were filed here in eleven years.** [verified] — the same
  reports, summed here.

  This corpus cannot say how many of these filings ended with somebody leaving. A foreclosure
  complaint is not a sale and an eviction filing is not a removal, and neither court publishes what
  happened to the household. [open]
properties:
  parameter: new forcible entry and detainer filings, Lima Municipal Court
  value: "802"
  unit: cases
  as_of: "2017"
  method: |
    Foreclosures from the `Foreclosures Overall Caseloads` table of the general division, evictions
    from the `Forcible Entry and Detainer Overall Caseloads` table of the municipal courts, in each
    annual report. New filings is the second numeric column in both; the first is cases pending on
    1 January, which chains to the previous year's closing balance in all ten transitions.
    [verified]
