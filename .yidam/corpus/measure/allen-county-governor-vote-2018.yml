class: measure
label: Allen County vote for governor, 2018
description: |
  Of 35,961 votes for governor, **24,200 for DeWine and 10,825 for Cordray** — 67.3 per cent
  against 30.1, with 605 for Irvine and 331 for Gadell-Newton. [verified] —
  [OpenElections](../../catalog/openelections-ohio.md), summed over the county's 88 precincts.

  It sits between the two presidential elections in this corpus at 66.5 and 69.0 per cent
  Republican, which is the useful thing about it: the county's partisan balance barely moved
  between a presidential year and a midterm, while **the number of people voting fell by a fifth**
  — 45,815 in 2016 to 35,961 here, and back to 47,993 in 2020. [verified] — same source, and
  [2016](allen-county-presidential-vote-2016.yml) and
  [2020](allen-county-presidential-vote-2020.yml).

  **That was published as "who turns out changes far more here than how they vote", and it is
  wrong.** It was drawn from three consecutive elections — 2016, 2018 and 2020 — and five earlier
  ones were sitting in the same repository. Across the five elections for governor this corpus now
  holds, the Republican share of the two-party vote runs from 48.8 per cent to 73.4, and in 2006
  this county voted for the Democrat. [verified] —
  [the series](allen-county-governor-vote-2002-2018.yml). What survives is the narrower claim the
  three elections actually support: between 2016 and 2018 the balance moved little and the
  electorate shrank by a fifth. [inference] — see
  [a sample is not a series](../../decisions/a-sample-is-not-a-series.yml).

  **Turnout for this election cannot be computed and for the two midterms before it can.** The 2018
  file has no ballots-cast column; the Secretary of State's own 2006 and 2010 files do, and put
  this county at 54.7 and 48.4 per cent against 71.8 in 2020. [verified] —
  [the 2006 ballot](allen-county-ballot-2006.yml) and
  [turnout](allen-county-turnout-2020.yml).

  [open] Whether the midterm drop is even across the county or concentrated. Without a ballots-cast
  column for 2018 the drop can only be measured in votes for the top office.
properties:
  parameter: votes cast for governor
  value: "35961"
  unit: votes
  as_of: 2018-11-06
  method: |
    Summed by candidate over the county's 88 precincts, from a volunteer transcription of the
    certified returns. [verified]
