class: measure
label: Fort Amanda's two seventy-fives
description: |
  Everything the county's histories count at [Fort Amanda](../site/fort-amanda.yml) comes out at
  seventy-five, and it is counted twice for two different things.

      graves   1885   "Seventy-five mounds mark the burial places of so many
                       soldiers of the war of 1812"
               1906   "It has some 75 graves and is still kept in order by
                       the pioneers"
               1915   "accounts vary as to the number of graves, the estimates
                       ranging close to seventy-five, only about forty are
                       supplied with the simple military markers today"
      boats    1915   "seventy-five flat boats were constructed, and part of
                       them were used to carry troops to Fort Meigs in 1813"

  **Seventy-five graves.** [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), which both scans
  carry identically, with a national cemetery established there in 1812-14 "which has been
  continued by the settlers". The 1906 history gives some 75 graves and adds that the ground was
  "formerly cared for by the government as a national cemetery". [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **Forty markers.** By the monument's unveiling in 1915 the same seventy-five is called an
  estimate and only about forty graves carry a military marker. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), quoting
  the souvenir programme, which gives the reason: the identities were lost when the British burned
  the Capitol and the garrison's records with it.

  **Seventy-five flat boats.** [verified] — the same programme, quoted on the facing subject a few
  pages earlier in the same book. The corpus records the coincidence without explaining it: two
  counts of two unrelated things, made a century apart from records that no longer exist, agreeing
  on a number. [inference] — observed here.

  **Why this is one node and not four figures on the site.** The 1906 history is not a third
  witness. Its Fort Amanda chapter reproduces the 1885 text sentence for sentence — the same
  Harrison date, the same eleven-foot pickets, the same south-east blockhouse, the same Ensign
  Gray — which is the transmission pattern this corpus found in the war rosters and recorded in
  [a printed list is a dataset](../../decisions/a-printed-list-is-a-dataset.yml). [verified] —
  the two books read against each other. So the graves count has two independent sources and not
  three: an 1885 book and a 1915 programme, and the programme is already calling 1885's figure an
  estimate.

  **The claim nobody will drop.** One of the scows built here is said to have been used by
  Commodore Perry to buoy his ships over the shallows at Put-in-Bay. The 1885 history offers it
  "with some degree of authenticity"; the 1921 history calls it "a pleasing story". [verified] —
  both books. Two historians, thirty-six years apart, both repeat it and neither will stand behind
  it, which is as close to a source note as either of them comes. [inference]

  [open] Whether any burial register, quartermaster return or boat manifest survives. The corpus
  has one contemporary document for this post — Green Clay's letter of 20 June 1813 — and it
  counts barrels of flour, not graves or hulls.
properties:
  parameter: graves in the military cemetery at Fort Amanda
  value: "75"
  unit: graves
  as_of: "1885"
  method: |
    Counted on the ground by the compiler of the 1885 county history as seventy-five mounds,
    repeated as "some 75" in 1906 by a book that reprints the 1885 text, and reported in 1915 as
    an estimate against about forty surviving markers. No register exists: the garrison's records
    were destroyed. [verified]
