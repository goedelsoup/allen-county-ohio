class: measure
label: Federally subsidized housing in Allen County, 2005–2025
description: |
  Every home in the county whose rent the federal government pays part of, counted once a year for
  twenty-one years. [verified] —
  [A Picture of Subsidized Households](../../catalog/hud-picture-of-subsidized-households.md),
  county, place and housing authority files, 2004 to 2025 editions.

      31 December 2025                     units   occupied   people
      Housing choice vouchers              1,005        845    2,040
      Project-based Section 8                970        908    1,452
      Public housing                         243        215      694
      811/PRAC                                33         32       33
      Mod Rehab                                0          —        —
      ---------------------------------------------------------------
      Summary of all HUD programs          2,251      1,999    4,266

  **One renter household in six in this county has a federal subsidy attached to it.** 2,251
  subsidized units against 12,968 renter-occupied households — 17.4 per cent. [inference] —
  computed here against table B25003 of the
  [American Community Survey](../../catalog/census-acs-summary-file.md), 2023 five-year estimates,
  which gives Allen County 40,928 occupied units of which 27,960 are owner-occupied.

  **Eighty-six per cent of it is in Lima.** The city holds 1,938 of the 2,251, in a county where it
  holds a third of the people. [verified] — the 2025 place file.

      place                             units
      Lima city                         1,938
      Bluffton village                     43
      Spencerville village                 38
      Fort Shawnee CDP                      7
      Elida village                         2
      ------------------------------------------
      five places wholly in the county  2,028
      Allen County                      2,251

  The remaining 223 are in unincorporated township ground and on this county's side of Delphos,
  which straddles the Van Wert line and is published as one place. [inference] — same file.

  **Inside Lima it is one renter household in four; outside Lima it is one in seventeen.** 1,938
  subsidized units against Lima's 7,500 renter households is 25.8 per cent; 313 against the other
  5,468 is 5.7 per cent. [inference] — the place file against table B25003, which gives Lima 13,985
  occupied units of which 6,485 are owner-occupied.

  **Allen County holds more subsidized housing than the five counties around it put together.**
  2,251 units against 1,733, on less than half their people. [verified] —
  [the county file](../../catalog/hud-picture-of-subsidized-households.md), 2025 edition.

      county          units       people   per 1,000
      Allen           2,251      100,866        22.3
      Hancock         1,080       75,016        14.4
      Hardin            291       30,402         9.6
      Auglaize          196       45,922         4.3
      Van Wert           80       28,887         2.8
      Putnam             86       34,206         2.5

  Population is the Vintage 2024 estimate. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md).

  **And the comparison is about the city, not the county.** Allen's 22.3 per thousand is eighteenth
  of Ohio's eighty-eight counties. Lima's own rate is 55.9 — higher than any county in the state,
  Cuyahoga's 31.4 included — and the rest of Allen County's is 4.7, which would place it
  seventy-eighth, between Union and Geauga and beside the rural neighbours it looks like.
  [inference] — computed here from the same two files. The range inside this one county, 51.1, is
  larger than the range across the whole state, 30.5. See
  [a county rate can describe nowhere](../../decisions/a-county-rate-can-describe-nowhere.yml).

  **The count has barely moved in seventeen years and the number of people in it has fallen by an
  eighth.** [verified] — the county files, 2009 to 2025.

      year   units   people   per unit   hh income   tenant rent   subsidy   under 30% AMI   62+
      2009   2,401    4,801        2.2      $9,726          $229      $434            76%    25%
      2010   2,244    4,755        2.2      $9,881          $228      $445            76%    23%
      2011   2,239    4,858        2.2     $10,308          $234      $452            76%    24%
      2012   2,210    4,623        2.1     $10,013          $230      $463            76%    24%
      2013   2,179    4,559        2.1     $10,304          $238      $462            73%    23%
      2014   2,222    4,678        2.1     $10,446          $254      $484            71%    22%
      2015   2,225    4,584        2.1     $10,720          $252      $479            69%    23%
      2016   2,188    4,718        2.1     $10,754          $253      $492            71%    21%
      2017   2,173    4,514        2.1     $11,216          $264      $474            69%    24%
      2018   2,184    4,594        2.1     $11,455          $269      $482            73%    24%
      2019   2,200    4,453        2.1     $11,404          $267      $493            76%    25%
      2020   2,225    4,449        2.0     $11,711          $278      $510            77%    28%
      2021   2,226    4,207        2.0     $11,416          $274      $532            76%    29%
      2022   2,293    4,412        2.0     $12,142          $277      $571            77%    29%
      2023   2,244    4,358        2.0     $13,163          $297      $607            76%    29%
      2024   2,244    4,214        2.0     $13,687          $317      $613            79%    32%
      2025   2,251    4,266        2.0     $14,640          $351      $701            80%    32%

  Units fell 6.2 per cent across the seventeen years and never left the band 2,173 to 2,401. People
  fell 11.1 per cent, from 4,801 to 4,266. [inference] — arithmetic this corpus's, on the table
  above. **The same number of subsidized homes now hold five hundred and thirty-five fewer people.**

  **The households in them are older and have fewer children.** The share aged 62 or over was 21 per
  cent in 2016 and is 32 now; the share that is a woman with children fell from 47 per cent in 2008
  to 36. [verified] — the same files. That is where the missing five hundred are: an elderly
  household is smaller than a family, and the stock did not shrink, its occupants changed.

  **Their incomes rose by half in dollars and fell against the county around them.** Average
  household income among the county's assisted households went from $9,726 in 2009 to $14,640 in
  2025, up 50.5 per cent; over the same span the share below 30 per cent of area median income went
  from 76 per cent to 80. [verified] — the same files. Both numbers are true of the same households.
  [inference]

  **What the tenant pays rose by half and what the government pays rose by more.** Average tenant
  rent $229 to $351, average HUD spending per unit-month $434 to $701. [verified] — the same files.

  **Twenty-one project-based properties, and most of their doors are not for families.** Of the
  1,021 units under contract at those properties, 627 are in properties HUD designates wholly or
  partly for elderly households, 295 in properties for individual families, 87 in properties for
  people with developmental disabilities or mental illness, and 12 unclassified. Nineteen are in
  Lima, one in Bluffton and one in Spencerville. [verified] —
  [HUD's multifamily layer](../../catalog/hud-open-data-housing-layers.md), retrieved 2 September
  2026. The layer carries no vintage, so this is a composition and not a count for a year; the dated
  file puts the project-based total at 1,003 units on 31 December 2025.

  **Nineteen of the twenty-one have a physical inspection score and they run from 59 to 99.** The
  lowest belongs to an 85-unit property for elderly households in Lima, inspected 23 December 2025;
  the two without a score are the two newest and have never been inspected. [verified] — the same
  layer, whose scores carry their own inspection dates and span 10 March 2022 to 31 March 2026.

  **Public housing here is 243 units in 194 buildings**, 186 of which hold a single dwelling. See
  [the authority that owns them](../organization/allen-metropolitan-housing-authority.yml).

  **What the other five renter households in six pay is now in the corpus, and it does not fit
  beside this.** 35.7 per cent of the county's renters pay more than thirty per cent of their
  income and 17.4 per cent pay more than half; see
  [housing cost burden](allen-county-housing-cost-burden-2006-2022.yml). Those rates are computed
  over a population that includes the households counted here, and the survey behind them does not
  ask whether a household has a subsidy — which is why HUD's own count of assisted households below
  30 per cent of area median has no room in the survey's tables. See
  [why HUD and the survey count different assisted renters](../question/why-hud-and-the-survey-count-different-assisted-renters.yml)
  and [a programme is invisible inside a survey](../../decisions/a-programme-is-invisible-inside-a-survey.yml).
  [inference]

  **The average wait of the households who did get in more than doubled.** `months_waiting` runs 10
  in 2018, 13, 20, 20, 25, 18 and 29 in 2024. [verified] — the same files. Seven readings on a
  measure this noisy are a direction and not a trend, and the measure is still not the length of
  the list.

  [open] What the waiting list is. The files publish `months_waiting`, which is the average wait of
  households who *moved in*, so an authority that admits almost nobody reports a short one. Nothing
  here counts the households waiting, and a rising average wait is consistent both with a longer
  queue and with an authority that has begun admitting from further down an unchanged one.

  [open] Why occupancy fell to 89 per cent in 2025, the lowest in the seventeen-year record against
  a band of 92 to 98 in every other year. The count of occupied units is published for the first
  time in that same file, so a change in the world and a change in the column cannot be told apart
  from the file alone.
properties:
  parameter: federally subsidized housing units
  value: "2251"
  unit: housing units
  as_of: "2025"
  method: |
    HUD's county, place and housing authority files, Allen County code 39003, Lima place code
    3943554, authority OH044, `Summary of All HUD Programs` rows unless a programme is named. Every
    row is stamped `31DEC2025`. The five programme rows sum to 2,251 units exactly; their occupied
    counts sum to 2,000 against a published 1,999 and their people counts to 4,219 against a
    published 4,266, and the file explains neither residual. [verified] The 2005–2008 editions
    report `hh_income` in thousands and are converted here; their `total_units` is suppressed, which
    is why the unit series begins in 2009. Rates per thousand use the Vintage 2024 population
    estimate for every county and for Lima, so that no comparison mixes denominators. Figures taken
    from HUD's undated map layers are described as retrieved and are not carried into `value` or
    `as_of`.
