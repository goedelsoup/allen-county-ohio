  unit: persons
  as_of: "1970"
  method: |
    Read from Table 10 of a bitonal scan with no text layer, by rendering the page with
    `mise run read-scan` and reading the block off the image. Allen County is on the first page of
    the table because the counties run alphabetically. The key combines the township with the place
    inside it, because `Lima-city-part` appears four times and is not a key on its own;
    `boundary_change` records whether the row carries the footnote marker, and is not a figure from
    the table but a reading of its typography. Fort Shawnee's 1960 cells are absent in the source,
    printed as the three dots this volume uses for not-applicable. The `value` above is the county
    total. [verified]
