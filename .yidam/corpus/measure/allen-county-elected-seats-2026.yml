class: measure
label: Allen County elective seats and how their holders arrived, 2026
description: |
  Every elective seat whose constituency lies inside Allen County, with the seat filled or vacant
  and — where filled — whether the roster marks its holder as appointed to it. [verified] —
  [the elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md), read across all
  eighty-eight precincts.

      class of government          offices  seats  held  vacant  appointed
      townships                         24     48    48       0          1
      villages                          15     52    47       5         25
      cities (Lima, Delphos)            13     21    21       0          6
      school boards and the ESC         10     50    50       0          7
      county offices and courts         21     22    22       0          0
      state and federal                 18     25    23       2          1
      ---------------------------------------------------------------------
      total                            101    218   211       7         40

  **This counts the ballot and not the register, and the roster answers both ways.** The same
  lookup queried by district type returns twelve boards of education for this county, not nine: the
  three districts centred in Putnam and Auglaize counties have boards here and no Allen precinct
  votes on them. Their fifteen seats are outside the table above because the table is of seats an
  Allen County elector fills. [verified] — same source, both views; see
  [the school boards](allen-county-school-boards-2026.yml).

  **Twenty-three per cent of this county's local government arrived by appointment.** Of the 166
  seated township, village, city and school officers, 39 hold seats they were appointed to fill.
  [verified] — same source. Every one of the twenty-two county offices and judgeships is filled,
  and every one of them by election. [verified]

  **The village form is where it concentrates, and size is not what separates it from the township
  form.** Twenty-five of the forty-seven seated village officers were appointed and five village
  seats stand empty, against one appointment and no vacancy across all forty-eight township seats.
  [verified] — same source. [Spencer Township](../jurisdiction/spencer-township.yml) holds 3,024
  people and [Spencerville](../jurisdiction/village-of-spencerville.yml) inside it holds 2,164, so
  most of the township's people are the village's people and both govern them. [verified] —
  [the race table](allen-county-race-2023.yml) and
  [the estimates](../../catalog/census-popest-2024.md), a year apart in vintage. The township fills
  four seats and elected all four; the village fills seven and appointed four of them. [verified]

  **Two villages cannot fill their governments at all.** [Cairo](../jurisdiction/village-of-cairo.yml)'s
  six-member council is five appointees and one vacant seat: no elected member sits on it.
  [Harrod](../jurisdiction/village-of-harrod.yml)'s board of public affairs is three seats and all
  three are empty; of its ten village seats, four are vacant, five are held by appointees and one —
  a single council member — was elected. [verified] — same source.

  **The returns since established that these seats go unfilled because nobody stands for them**, and
  that the two records join without remainder: every one of the 25 appointed village officers sits in
  a seat that drew no candidate, and no appointee anywhere in the villages or the townships sits in a
  seat somebody won. [verified] —
  [the seat-by-seat join](who-won-and-who-sits.yml). The sentence this paragraph replaced said the
  roster could not show it and the corpus had not read
  [the returns](../../catalog/openelections-ohio.md); it has now read the county's own canvass
  instead.

  **This table is a reading of 30 August and one seat has moved since.** A re-read on 9 September
  gives 210 held, 8 vacant and 39 appointed: the educational service centre's fifth seat, held then
  by an appointee, is now empty. The figures above are left as the date says. [verified] —
  [the roster](../../catalog/ohio-boe-elected-officials-allen.md), both readings.
properties:
  parameter: seated holders of elective office, and seats vacant, by class of government
  value: "211"
  unit: seated officeholders across 218 seats
  as_of: "2026-08-30"
  method: |
    Union of the eighty-eight precinct pages of the boards of elections roster, deduplicated on the
    office name and the page's own `hid_office` code. Vacancies are counted from its `N Vacant
    Seat(s)` rows and appointments from its `*Appointed*` marker; the class column is this corpus's
    grouping and the roster totals nothing. [verified] **It is a county's roster, so a ward seat of
    a city that crosses the county line does not appear.** Delphos contributes ten seats here and
    3,182 of its people live in Van Wert County, so its council is undercounted by an unknown
    number of ward seats. [inference] No other government here is affected: Bluffton also crosses a
    line and elects its council at large.
