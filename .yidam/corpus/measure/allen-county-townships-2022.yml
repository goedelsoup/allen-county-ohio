  method: |
    The twelve are every unit the survey's directory file places in Allen County, Ohio with a
    township type code. [verified] Amounts in the file are thousands of dollars and are written out
    here. [verified] `direct_spending` sums the `E`, `F`, `G` and `I` codes and excludes the `L` and
    `M` intergovernmental payments, which is the survey's own expenditure definition and is why the
    twelve sum to the $15,818,000 the companion node publishes rather than to $16,341,000.
    [verified] `intergovernmental` is those excluded payments, shown so that a township that buys a
    service does not read as a township that goes without one. `administration` is financial
    administration, central staff and general public buildings. `revenue` adds the `C` and `D`
    codes back, as every revenue figure in this corpus does; see
    [the catalog](../../catalog/census-government-finances.md). Ohio comparisons repeat the
    identical read over all 1,303 Ohio townships in the same file. [verified] `cells` is how many
    item codes the file carries for that township and `imputed_cells` how many of them are flagged
    `I`; a township with no row for an item is shown as zero here and the file does not distinguish
    a reported nothing from an unasked question. [inference]
