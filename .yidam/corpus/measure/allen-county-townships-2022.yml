class: measure
label: What Allen County's twelve townships spend it on, 2022
description: |
  **A township here is a fire department with a road crew attached.** Of the twelve townships'
  $15,818,000 of direct spending in fiscal 2022, **fire protection is $5,405,000** — 34 per cent —
  and police another $2,588,000, so **half of everything a township in this county spends is public
  safety**. Roads are 17 per cent and running the township itself 13. [verified] —
  [the government finance survey](../../catalog/census-government-finances.md), the 2022 individual
  unit file, item codes `E24`/`F24`, `E62`/`F62`, `E44`/`F44`/`E45` and `E23`/`E29`/`E31`, summed
  here. See [what the forty-six raise and spend](allen-county-local-government-finance-2022.yml),
  whose township total this reproduces to the dollar.

  **Eleven of the twelve pay for fire themselves. The twelfth pays somebody else.** Sugar Creek is
  the only township with no fire line at all, and it is one of two that send money to another local
  government — $29,000 from Sugar Creek and $295,000 from Marion, which carries a $123,000 fire line
  besides. [verified] — the same file, item `M89`. **The file records the payment and never names
  the government at the other end**, so that Sugar Creek buys its fire protection is the reading and
  not the record. [inference] Those transfers are outside the survey's expenditure definition
  altogether, which is why a township that buys a service reads exactly like one that goes without;
  see [a direct column cannot see a contract](../../decisions/a-direct-column-cannot-see-a-contract.yml).

  **Police is the exception in Ohio and it is not the exception here.** Only **162 of Ohio's 1,303
  townships** spend anything on police at all — 12 per cent — and five of Allen County's twelve do.
  [verified] — the same file, every Ohio township read. Three of the five are forces: Shawnee at
  $1,510,000, American at $791,000 and Bath at $217,000. Two are a line item: Perry $46,000 and
  Marion $24,000.

  **Shawnee Township is a city that never incorporated.** Its 12,105 residents are more than the
  county's seven villages put together, it runs its own police and its own fire, and the two are
  **$4,320,000 of its $6,435,000 of direct spending — 67 per cent**. It spent $1,708,000 more than
  it raised. [verified] — the same file. Its fire costs $232 a resident against a median of $50
  among the 711 Ohio townships of a thousand people or more that have a fire line at all.

  **Perry Township levies no property tax.** The file gives it no property-tax line, and its whole
  $216,000 of revenue is the motor fuels tax ($127,000), local intergovernmental money ($51,000),
  the motor vehicle licence ($27,000), the alcohol tax and $2,000 of fines. Against that it spends
  $402,000 — nearly twice as much — including $176,000 on fire and $46,000 on
  [the police department](../jurisdiction/perry-township.yml) this corpus places at 2501 E Breese
  Road. **All ten of its cells are reported rather than imputed**, so the absence is the township's
  own answer and not a model's. [verified] — the same file. It is one of 63 Ohio townships out of
  1,303 with no property-tax line, and **one of only 19 of the 472 that have three thousand
  residents or more**.

  **A third of these figures are the Bureau's arithmetic.** Sixty-six of the twelve townships' 191
  cells are imputed, and **four townships — Monroe, Spencer, Richland and Jackson — have not one
  reported figure between them**. [verified] — the same file, flag column; see
  [a flag column is part of the figure](../../decisions/a-flag-column-is-part-of-the-figure.yml).
  Every figure below that names one of those four is a model, and the table says which.

  **And the denominator is not the one a reader expects.** The twelve townships' 65,540 residents
  plus Lima's 36,440 are the county's 101,980 exactly, which means **every municipality but Lima is
  counted inside its township**. [verified] — the same file's directory. So Richland Township's
  $67,000 of fire is divided by 6,059 residents of whom 4,030 are Bluffton's, and Bluffton runs its
  own fire department on $695,000. [verified] — the same file, by unit. **A township's fire spending
  per resident is not what a resident of it pays for fire protection**, anywhere a village stands
  inside the township. [inference]

  [open] Which government Sugar Creek and Marion pay, and what Amanda Township's $199,000 to the
  State of Ohio buys. Items `M89` and `L89` record a transfer and no counterparty. The townships'
  own annual financial reports, filed with the Auditor of State, name the payee; this corpus holds
  none of them.
