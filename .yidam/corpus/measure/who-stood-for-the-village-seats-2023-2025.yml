class: measure
label: Who stood for the county's village and township seats, 2023 and 2025
description: |
  **Across the two municipal elections that seated this county's present village and township
  officers, 52 village seats drew 25 candidates and 55 township seats drew 71.** Villages field
  0.48 candidates per seat and townships 1.29 — a difference of 2.7 times between two forms of
  government sitting on the same ground, printed on the same ballot paper, on the same days.
  [verified] — [the ballot display](../../catalog/allen-county-ballot-display.md), every precinct
  ballot of 7 November 2023 and 4 November 2025, counted here.

  **The ballot says it in words, not by arithmetic.** Where nobody files, the printed ballot carries
  the line **"No Valid Petition Filed"** under the office, once for each seat nobody sought. Seven
  village contests carry it and four township ones. Harrod's ballot of November 2023 is the extreme:
  under `VILLAGE OF HARROD` it reads *For Mayor — No Valid Petition Filed*, *For Member of Council —
  James G. Pinks, No Valid Petition Filed*, *For Member of Board of Trustees of Public Affairs — No
  Valid Petition Filed*. Four seats, one name. [verified] — the same source, precinct ballots.

  **In November 2025 not one of the seven villages fielded a full council.** Twenty-eight council
  seats stood across the county and nine people sought them; Cairo and Spencerville drew nobody at
  all, Harrod and Lafayette one each. In the same election every township's regular trustee contest
  was filled or oversubscribed, Shawnee's by three to one. [verified] — the same source.

  **It is the council and not the office of mayor.** All seven mayoralties on the 2023 ballot drew
  seven candidates between them — one apiece but for Harrod, which drew none, and Elida, which drew
  two. The 42 council seats across both years drew 18. [verified] — the same source. So the village
  form is not uniformly unwanted; its **legislature** is.

  **The ranking of who stands is the inverse of the ranking of who is appointed, village by
  village.** Bluffton at 0.86 candidates per seat and Beaverdam at 0.71 are the two lightest users
  of appointment; Cairo at 0.14 and Harrod at 0.20 are the heaviest. [verified] — this file against
  [the seat count](allen-county-elected-seats-2026.yml). The corpus had the second ranking for a
  year and could not explain it; it is the first ranking seen from the other end.

  **Townships are not immune and the difference is one of degree.** Four township contests drew
  nobody — Auglaize's trustee in 2023 and its unexpired trustee in 2025, Monroe's trustee and
  Perry's fiscal officer in 2023 — and most township races draw exactly one candidate for one seat.
  A township is not more contested than a village; it is more **filled**. [verified] — the table.
properties:
  parameter: >-
    Seats on the ballot and candidates filed for them, by jurisdiction and office, at the general
    elections of 7 November 2023 and 4 November 2025
  value: >-
    Village 52 seats and 25 candidates, 0.48 per seat; township 55 seats and 71 candidates, 1.29
    per seat
  as_of: "2025-11-04"
  unit: seats, candidates
  method: |
    Every precinct ballot for both elections — 114 each — fetched as PDF from the county board of
    elections' ballot display and read for text. A contest is counted only where its heading is
    `VILLAGE OF x` or `TOWNSHIP OF x`, and only for offices belonging to that body: mayor, council
    and board of trustees of public affairs for a village; trustee and fiscal officer for a
    township. School, library and educational-service-centre contests appear on the same paper and
    are a different jurisdiction; they are excluded, and the exclusion matters — the service centre's
    heading is printed on two lines and a reader keying on the previous heading assigns its
    contests to the township above it.

    `seats` is the ballot's own "(Vote for not more than N)". `candidates` counts printed names and
    excludes the line "No Valid Petition Filed", which appears once per seat nobody sought. The same
    contest appears on every precinct ballot within the jurisdiction; each is taken once, at its
    fullest reading. Write-in candidates are not on the printed ballot and are not counted here.
