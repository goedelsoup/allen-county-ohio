class: measure
label: Who stood for the county's village and township seats, 2023 and 2025
description: |
  **Across the two municipal elections that seated this county's present officers, 52 village seats
  drew 24 candidates and 23 of those seats were filled. The other twenty-nine were not.** Twenty-one
  of the candidates were printed on the ballot and three were write-ins. The county's 55 township
  seats drew 71 candidates over the same two days. [verified] —
  [the ballot display and the official canvass](../../catalog/allen-county-ballot-display.md),
  7 November 2023 and 4 November 2025.

  **This node first read the ballots alone and got two things wrong, both at Bluffton.** A printed
  ballot carries a blank line reading `Write-in` wherever a write-in candidate has filed a
  declaration of intent, and that line was counted here as a candidate — so Bluffton's council was
  published as drawing two candidates in 2023 and three in 2025 when the printed names were **none**
  and **two**. The county total fell from 25 to 21 printed. [verified] — the precinct ballots,
  re-read.

  **And the canvass then supplies what no ballot can.** Bluffton's council was filled by write-in in
  both years — Jospeh Sehlhorst on 161 votes and Benjamin Stahl on 134 took both seats in 2023, and
  Thomas Downey on 99 took a third seat in 2025 beside two printed names. [verified] — the official
  summary, both elections. So the village that appeared to stand least in fact stands by a route the
  printed paper cannot show, and this node's original ranking of it was wrong twice over.

  **Where the ballot says nobody stood, the canvass agrees and adds the voters.** Seven village
  contests recorded **zero votes cast**: Cairo's and Elida's councils and Harrod's mayoralty and
  board of public affairs in 2023, Cairo's and Spencerville's councils and Harrod's board in 2025.
  Behind those zeros are 1,080 unused votes at Spencerville and 216 at Cairo. [verified] — the same
  summaries. People went, took a ballot, and found the office empty.

  **Two ballot states mean two different things and this node conflated them.** `No Valid Petition
  Filed` means nobody filed at all, not even a write-in; a blank `Write-in` line means somebody did.
  Cairo's council in 2023 carries the first, twice, and drew no votes; Bluffton's carries the second,
  twice, and elected two people. [verified] — the ballots and the canvass together.

  **It is the council and not the office of mayor.** The seven mayoralties on the 2023 ballot drew
  seven candidates between them — one apiece but for Harrod, which drew none, and Elida, which drew
  two. The 45 council and public-affairs seats across both years drew 17. [verified] — the table.

  **Townships remain the comparison and are not affected by the correction.** No township contest in
  either election carried a write-in line at all, so the 71 candidates for 55 seats stand as first
  published. Four township contests drew nobody. A township is not more contested than a village; it
  is more **filled**. [verified] — the precinct ballots.

properties:
  parameter: >-
    Seats on the ballot and candidates filed for them, by jurisdiction and office, at the general
    elections of 7 November 2023 and 4 November 2025
  value: >-
    Village 52 seats, 21 printed candidates and 3 write-ins, and 23 seats filled; township 55
    seats and 71 candidates
  as_of: "2025-11-04"
  unit: seats, candidates
  method: |
    Two sources, and the second corrects the first. Every precinct ballot for both elections — 114
    each — fetched as PDF and read for text; then the board's official summary of votes cast for the
    same two elections, which is the only record that names a write-in candidate.

    A contest is counted only for offices belonging to the body itself: mayor, council and board of
    trustees of public affairs for a village; trustee and fiscal officer for a township. School,
    library and educational-service-centre contests appear on the same paper and are excluded.

    **`printed` counts names printed on the ballot. It excludes the line "No Valid Petition Filed",
    which appears once per seat nobody sought, and it excludes the blank line reading "Write-in",
    which is not a candidate but the mark of a seat where a write-in candidate has filed** — the
    error this node was first published with. `write_in` counts write-in candidates the canvass names
    with a vote total, excluding its "Write-In Totals", "Not Assigned" and invalid rows. `filled`
    counts seats won by anyone, printed or written in, capped at the seats available.

    Village rows are from the canvass, which carries both kinds of candidate. Township rows are from
    the ballots: no township contest in either election carried a write-in line, so no township
    figure is affected.
