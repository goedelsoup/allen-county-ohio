class: measure
label: What a mortgage costs in Allen County, 2018-2024
description: |
  **The register that records who was refused a loan also records what the loan cost, and the price
  runs with the size of the borrowing.** [verified] —
  [the HMDA register](../../catalog/hmda-loan-application-register.md), seven years of it. The
  figures below are the 14,703 first-lien originations on site-built owner-occupied houses, which
  is the comparable book: second liens, investment property and manufactured homes are priced
  differently and are held apart.

      loan band       n    median loan   closing costs   as a share   priced high
      under $50k    1,474      $35,000          $1,571        4.09%         23.3%
      $50-100k      3,569       75,000           2,406         3.14         11.3
      $100-150k     4,134      125,000           2,935         2.40          7.0
      $150-200k     2,584      175,000           3,383         1.97          5.9
      $200-300k     2,130      235,000           3,392         1.42          3.5
      $300k and up    812      355,000           3,843         1.03          2.4

  **In figures: a borrower of $35,000 in this county pays a median $1,571 to close and a borrower
  of $355,000 pays $3,843 — the loan is 10.14 times larger and the fee 2.45 times larger.**
  [verified] — the same source. Most of the falling share is that division and not anybody's
  conduct; what is left over is a fee schedule that scales at about a quarter of the rate the loan
  does. See
  [a fixed cost makes its own gradient](../../decisions/a-fixed-cost-makes-its-own-gradient.yml).

  **The last column is not a ratio and does not fall for arithmetic reasons.** A loan is
  higher-priced when its annual percentage rate is more than 1.5 points above the average prime
  offer rate for a comparable transaction — a federal threshold that triggers an escrow and an
  appraisal requirement, not a description. 1,217 of this county's 13,991 priced originations
  cross it, 8.7 per cent. [verified] — the same source. The spread is already net of the rate
  cycle, so seven years of it may be added; a raw interest rate may not.

  **The gradient is there inside a single year, so it is not the interest-rate cycle in disguise.**
  In 2023 the median spread ran 0.984, 0.695, 0.569 and 0.462 points down four size bands; in 2024,
  0.710, 0.673, 0.480 and 0.330. [verified] — the same source, by year.

  **It is not an Allen County phenomenon either. It is how Ohio prices.** Across the state's 88
  counties in 2023, the correlation between the logarithm of a county's median loan and its
  higher-priced share is -0.579. Delaware County has the state's largest median loan at $385,000
  and its lowest higher-priced share at 3.2 per cent; Meigs County is at $125,000 and 21.3.
  [verified] — [the same register, statewide](../../catalog/hmda-loan-application-register.md),
  227,191 originations. Allen County sits at $145,000 and 9.2 per cent, 37th of 88, against a state
  figure of 7.61 — about where a county of its loan sizes should be. [verified] — the same file.

  **Where the price gap is not explained by size is by race.** 15.9 per cent of loans to Black
  borrowers here were higher-priced against 9.7 per cent of loans to white borrowers, and the gap
  holds inside every band: 38.8 against 21.9 under $50,000, 15.4 against 11.1 to $100,000, 8.4
  against 6.4 to $150,000, and 6.6 against 4.3 above it. [verified] — the same source. Size is the
  strongest thing in this file and it does not account for this.

  **This node does not establish that anyone was treated differently.** The register carries no
  credit score, no assets, no employment record and no appraisal, and a price arrived at without
  them is an outcome and not a judgement about how it was reached. See
  [a denial rate is not an underwriting file](../../decisions/a-denial-rate-is-not-an-underwriting-file.yml).

  **Six hundred and seventy-six of the county's loans have no price in the file at all.** Their
  price columns read `Exempt`, which is the partial exemption open to small filers, and 474 of the
  676 are one bank's. [verified] — the same source; the lender is named in
  [the catalog entry](../../catalog/hmda-loan-application-register.md).

  **Eleven loans in seven years crossed the statutory high-cost line**, which is a much higher bar
  than the higher-priced one and brings its own body of law. Three carried interest rates of 12.25,
  12.25 and 14.22 per cent. [verified] — the same source, its `hoepa_status` column.

  [open] What the 2,898-dollar median closing cost in this county is made of. The register totals
  the charges and itemises only origination charges, discount points and lender credits, so the
  title work, the appraisal and the recording fees are inside one number.
properties:
  parameter: first-lien home loans priced above the federal higher-priced mortgage threshold
  value: "8.7"
  unit: per cent of 13,991 originations on site-built owner-occupied houses, 2018-2024
  as_of: "2024"
  method: |
    Originations only — action taken 1 — restricted to first liens on site-built principal
    residences, which is 14,703 of the 19,070 the county recorded. [verified] Higher-priced is a
    rate spread above 1.5 for a first lien; 712 of the 14,703 report no spread and are out of the
    denominator. [verified] Loan amounts are published at the midpoint of a $10,000 band, so a
    median loan is a median of midpoints and the bands above are bands of midpoints. [verified]
    Shares of the loan are medians of each loan's own ratio, not a ratio of medians. [verified] The
    `n` column counts the band; the closing-cost columns are medians over the 11,777 loans that
    report a cost, 368 of which report zero and are kept. [verified] The
    statewide comparison uses 2023 alone, on the same restriction, over the 88 counties with at
    least fifty priced originations — which is all of them. [verified]
