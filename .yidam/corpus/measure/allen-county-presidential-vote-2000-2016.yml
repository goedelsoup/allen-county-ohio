class: measure
label: Allen County presidential vote, 2000–2016
description: |
  Five elections, from compilations of the state's certified canvass rather than from the canvass.
  [verified] — [MIT Election Data and Science Lab](../../catalog/medsl-county-returns.md) for all
  five, [OpenElections](../../catalog/openelections-ohio.md) for 2000, 2008 and 2012, and
  [the Census Bureau's county compendium](../../catalog/census-usa-counties.md) for 2000, 2004 and
  2008; where they differ the divergence is below rather than averaged away.

      year  Republican          Democrat            others   total    R%     D%    margin
      2000  Bush      28,647   Gore      13,996    1,152  43,795   65.4   32.0   R+14,651
      2004  Bush      32,585   Kerry     16,483      206  49,274   66.1   33.5   R+16,102
      2008  McCain    29,940   Obama     19,522      801  50,263   59.6   38.8   R+10,418
      2012  Romney    29,502   Obama     17,914      820  48,236   61.2   37.1   R+11,588
      2016  Trump     30,487   Clinton   13,294    2,034  45,815   66.5   29.0   R+17,193

  [verified] — same two sources; shares and margins computed here. The 2016 row is the figure
  [this corpus already held](allen-county-presidential-vote-2016.yml) from a precinct sum, not a
  new reading. Every row's three vote columns add to its total.

  **2008 is the modern high-water mark, and it is high on both sides.** It is the largest total
  vote of the six modern elections at 50,263, the largest Democratic vote at 19,522, and the
  Republicans' worst share at 59.6 per cent — their only showing under sixty in the whole modern
  run. [inference] — computed from the table above and
  [the 2020 return](allen-county-presidential-vote-2020.yml).

  **The Democratic column lost a third of itself in eight years, and it lost more than turnout
  did.** From 2008 to 2016 the Democratic vote fell 6,228 — 31.9 per cent — while the total vote
  fell 4,448. The Republican vote *rose* by 547 across the same eight years. So the whole of the
  turnout decline and more came out of one column. [inference] — computed from the table above.

  **The county's Republican share is not a straight line and 2008 is the dip, not the start.** It
  runs 65.4, 66.1, 59.6, 61.2, 66.5 and 69.0 across the six modern elections: two above
  sixty-five, a two-election trough, and then a climb past where it began. [inference] — the table
  above with [2020](allen-county-presidential-vote-2020.yml).

  **The largest margin in this corpus's record of this county is 1984, not 2020, and the largest
  the other way is 1,354.** R+21,330 under Reagan against R+18,967 under Trump, and Bryan's
  D+1,354 in 1908 at the other end. Allen County gave Bryan 55.2 per cent in 1896 and Biden 29.5
  per cent in 2020. [inference] — computed against
  [the six elections to 1908](allen-county-presidential-vote-1888-1908.yml) and
  [the five from 1980](allen-county-presidential-vote-1980-1996.yml). This paragraph said 2020 was
  the record for as long as the corpus's returns stopped at 1920 and restarted at 2000.

  **In figures, the Republican share: 65.4 per cent in 2000, 66.1 in 2004, 59.6 in 2008, 61.2 in
  2012, 66.5 in 2016 and 69.0 in 2020.** [inference] — computed from the table above and the 2020
  node.

  **Two compilations of one canvass disagree twice in five elections, each time by one vote.** For
  2008 the lab gives McCain 29,941 and Obama 19,521 where OpenElections gives 29,940 and 19,522 —
  one vote each way, so both files total 50,263 and no arithmetic in either can catch it. For 2012
  the lab gives Obama 17,913 against OpenElections' 17,914, and there the totals differ too.
  [verified] — [the lab's file](../../catalog/medsl-county-returns.md) and
  [OpenElections'](../../catalog/openelections-ohio.md), compared here.

  **The 2012 disagreement is settled and the lab is wrong.** The Ohio Secretary of State's own
  final-results workbook, which OpenElections ships beside its transcription, gives Allen County
  Obama 17,914, Romney 29,502 and a presidential total of 48,236 — the transcription exactly.
  [verified] — [the workbook](../../catalog/openelections-ohio.md). The table above takes the
  workbook's figures for 2012 and OpenElections' for 2008; see
  [a compiler is not the canvass](../../decisions/a-compiler-is-not-the-canvass.yml).

  **On 2008 a third compilation now agrees with OpenElections to the vote, and the question stays
  open.** The Census Bureau's compendium gives McCain 29,940 and Obama 19,522, which is the figure
  this node already published and leaves the lab one vote out in each column. [verified] —
  [USA Counties](../../catalog/census-usa-counties.md). Two of three is a tally, and a tally of
  compilers is not a canvass: no county board's certificate is held here for 2008 and none of the
  three compilers is the publisher of record. The block above stays open for that reason and not
  for want of evidence. [inference] — the reasoning is this corpus's; see
  [the same decision](../../decisions/a-compiler-is-not-the-canvass.yml).

  **On 2000 all three agree to the vote.** Bush 28,647, Gore 13,996, others 1,152, total 43,795 —
  three compilations from three unrelated lineages, and not a digit between them. [verified] —
  [the compendium](../../catalog/census-usa-counties.md) against the two files already read. That
  is what the 2004 and 2008 rows are being measured against: the same three sources can agree
  perfectly, so where two of them differ the difference is somebody's error and not the format's.

  [open] Which of the two 2008 figures is right. No certified return for that year is held here,
  the divergence is one vote in each major column and cancels in the total, and nothing inside
  either file can decide it. A third compilation has since sided with one of them and did not close
  it; the next paragraph says what it is and why two of three is not an answer.

  **2004 rested on one witness and now rests on two that disagree.** OpenElections has no Ohio
  general-election file for 2004 at all. [verified] —
  [the repository's own listing](../../catalog/openelections-ohio.md). The Census Bureau's county
  compendium, which carries a commercial compilation of the vote for 1980 through 2008, gives Allen
  County Bush 32,580 and Kerry 16,470 against the lab's 32,585 and 16,483 — eighteen votes apart on
  a total of about forty-nine thousand, with each file adding up. [verified] —
  [USA Counties](../../catalog/census-usa-counties.md). The table above keeps the lab's figures and
  the disagreement is published rather than averaged; see
  [a compiler is not the canvass](../../decisions/a-compiler-is-not-the-canvass.yml).

  **The residue is where the two compilations really part.** For 2016 both give Trump 30,487 and
  Clinton 13,294 and then differ by 79 on everything else, 2,034 against 2,113. That is a
  disagreement about which write-ins count rather than a transcription error, and it is not read
  here as one side being wrong. [inference] — the two files, compared here.

  **This closes half the run and leaves the other half in one piece.** With these five the corpus
  holds 21 of the 42 presidential elections from 1856 to 2020. The 21 it does not hold are 1912
  and 1916, and then every election from 1924 to 1996 without a break — a nineteen-election block
  with 1920 sitting inside it as the only year read. [inference] — counted here against
  [1856–1884](allen-county-presidential-vote-1856-1884.yml),
  [1888–1908](allen-county-presidential-vote-1888-1908.yml),
  [1920](allen-county-presidential-vote-1920.yml),
  [2016](allen-county-presidential-vote-2016.yml) and
  [2020](allen-county-presidential-vote-2020.yml).

  [open] When this county turned Republican. It voted Democratic eleven times in twelve from 1856
  to 1900, Republican by 2,320 in 1920, Republican with 65.5 per cent in 1960 and 65.8 in 1980, and
  Republican by never less than 10,418 from 2000. **The window has narrowed from nineteen elections
  to eleven**: nothing after 1956 can be the turn, so it lies in 1912, 1916, 1924, 1928, 1932,
  1936, 1940, 1944, 1948, 1952 or 1956. The 1920 return sits inside that span and is Republican
  already, which is why the span cannot be cut further from the near end — a county can turn and
  turn back. See [1960 and 1964](allen-county-presidential-vote-1960-1964.yml). No source reachable
  from here carries an Ohio county's presidential vote for any of the eleven: the Secretary of
  State's own series is digitized to 1920 and no further, the federal compendia that carry the vote
  begin at 1960, and the two editions that would hold 1968 and 1976 are not digitized at all.

  **The county's money is more Republican than its vote, and was much more so.** Against the shares
  in the table above, Republican committees took 75.5 per cent of the labelled federal contributions
  from this county in 2000, 85.2 in 2004, 89.0 in 2008, 84.5 in 2012 and 84.0 in 2016 — running
  ahead of the two-party Republican vote by between 8.3 and 28.4 points, and by the most in the year
  the Republicans polled worst. [verified] —
  [the contributions](allen-county-federal-contributions-1980-2024.yml). By 2020 the gap is 6.9
  points and closing from both ends. [inference]
properties:
  parameter: presidential votes cast, Allen County
  value: "45815"
  unit: votes
  as_of: "2016"
  method: |
    The lab's public GitHub mirror was read rather than its Dataverse deposit, whose data file is
    behind a guestbook — a form for a person to fill in, not a request this corpus makes on its
    behalf. That mirror stops at 2016, which is why 2020 here is the figure already held from
    OpenElections and why 2024 is absent altogether. The OpenElections files are county-level
    for 2000 and 2012 and a combined general file for 2008; the 2012 arbiter is
    `2012/FinalResults.xlsx` in the same repository, read from its XML parts because no
    spreadsheet library is installed. Ohio's own site was probed again and refuses every client.
    [verified]
