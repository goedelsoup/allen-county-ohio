class: measure
label: Every stream gauge whose basin holds Allen County ground, and how much of the county each sees
description: |
  **This county has never been ungauged. Two gauges downstream of it have measured its water every
  day since 1915 and 1921, and this corpus had cited neither.** The Auglaize River near Defiance
  drains 403 of the county's 406 square miles — every one of its nine settlements stands inside that
  basin — and has 40,518 days of daily discharge. The Auglaize near Fort Jennings drains 134 square
  miles of it, a third of the county, and has 36,624. [verified] —
  [USGS](../../catalog/usgs-nwis.md), the network-linked basin service against
  [the county boundary](../place/allen-county.yml).

  **The corpus had said the opposite, in a rule, twice.** It held that the county's gauge record
  "covers three of the county's twenty-nine stream sites, has two multi-year holes, and carries no
  flood stage", and it filled a column with `NA` for 1986, 2003, 2004, 2008 and 2009 on the ground
  that no county gauge was in service. Each of those days is in both long records above.
  [verified] — [the four files](the-four-files-that-can-see-a-flood.yml), corrected with this node.

  **The test that excludes the Blanchard at Findlay is the test that admits these.**
  [A neighbour's gauge](../../decisions/a-neighbours-gauge-is-not-this-countys-record.yml) says a
  gauge speaks for the ground above it. Measured rather than argued, the Findlay gauge's basin holds
  **0.0 square miles** of Allen County and contains none of its nine settlements — the rule was
  right. The same computation over every gauge in the four basins around this county finds eleven
  that do hold its ground, and the corpus was reading two of them. [verified] — the table.

  **A gauge is not one witness at every distance.** The three that see 99 per cent of the county see
  it as 6 to 17 per cent of their own basin, so they register a county-wide flood and cannot see a
  creek. The Ottawa near Kalida is the inverse — 61 per cent of its basin is this county — and it
  began recording in 2014. **Only one gauge is both large in the county and long in the record**,
  and it is Fort Jennings at 40 per cent and 105 years. [verified] — the table.

  **The county's settlements are partitioned by the two rivers and the corpus can now say which.**
  Lima, Elida, Cairo and Lafayette stand in the Ottawa's basin; Delphos, Spencerville and Harrod in
  the Auglaize's above Fort Jennings; Bluffton and Beaverdam in Riley Creek's, which reaches the
  Blanchard **below** Findlay and not above it. [verified] — the basin polygons against each place.
  So a claim paid at Bluffton and a crest at Lima are not the same water, and neither is a claim at
  Delphos and a crest on the Ottawa.

  **What this does not give the county.** A flood stage. None of these gauges has one for Allen
  County ground, and a discharge in the 99th percentile is a statement about the gauge's own record
  and not about anybody's floor. [verified] —
  [the National Water Prediction Service](../../catalog/noaa-nwps-gauges.md). The rule that a flood
  needs [two records](../../decisions/a-flood-needs-two-records.yml) is unchanged by this node; what
  changes is that the river is now a record that exists on days the corpus had written off.
properties:
  parameter: >-
    Drainage basin of each USGS stream gauge in and around Allen County, intersected with the county
    boundary, with the period of daily discharge record
  value: >-
    Eleven gauges hold county ground; three drain 99 per cent of it and have run since 1898, 1915
    and 1924
  unit: square miles of Allen County drained
  as_of: "2026-09-09"
  method: |
    Each gauge's basin polygon from the USGS network-linked data index
    (`nldi/linked-data/nwissite/USGS-<site>/basin`), intersected with this county's TIGER boundary.
    Areas are computed in a sinusoidal projection about each polygon's own centroid, which
    reproduces the published drainage areas to within two per cent on the four largest and within
    five on the smallest — 350 against 350 at Kalida, 332 against 332 at Fort Jennings, 2,316
    against 2,318 at Defiance. That agreement is the check that the polygons are the right ones.

    `settlements` counts how many of the county's nine incorporated places fall inside the basin,
    tested as points: Lima, Delphos, Spencerville, Bluffton, Elida, Cairo, Beaverdam, Harrod,
    Lafayette. It is a coarser test than the area and it is the one a reader wants.

    Candidate gauges are every site with a daily discharge series in hydrologic units 04100006
    through 04100009 — the Auglaize, the Blanchard, the Tiffin and the lower Maumee — filtered to
    those whose basin intersects the county at all. `first`, `last` and `days` are the series
    catalogue's own, and `days` is a count of days recorded rather than the span: the Blanchard near
    Dupont spans ninety-eight years and holds 7,199 days.
