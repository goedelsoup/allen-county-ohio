class: measure
label: Allen County's Army dead and missing, 1941–1946
description: |
  **One hundred and seventy-one men from Allen County died or were still missing in the Army of the
  United States between 27 May 1941 and 31 January 1946.** [verified] —
  [the War Department's Honor List for Ohio](../../catalog/ww2-honor-list-ohio.md), tabulation by
  counties and types of casualties.

      KIA  killed in action                                     87
      DOW  died of wounds                                       13
      DOI  died of injuries                                      0
      DNB  died, non-battle                                     56
      FOD  finding of death                                     14
      M    missing at the cut-off                                1
      ---------------------------------------------------------------
      total                                                    171

  **The six categories run 87 killed in action, 13 dead of wounds, 0 dead of injuries, 56 dead
  non-battle, 14 declared dead under Public Law 490 and 1 still missing.** [verified] — same source,
  transcribed from its tabulation and checked to sum.

  **One in three of them did not die in battle.** Fifty-six of the 171 are DNB — the source's own
  category for sickness, homicide, suicide or accident outside combat areas, "including training and
  maneuver deaths". [verified] — same source, its definitions page. Against 87 killed in action and
  13 dead of wounds, that is 56 of 171, or 32.7 per cent. [inference] — computed here.

  **Fourteen were declared dead rather than found dead**, under Public Law 490, which the source
  says requires "conclusive proof that the person is dead or equally overwhelming evidence" and is
  made "only after review and after a lapse of at least one year from the time of disappearance".
  [verified] — same source. One man was still carried as missing when the list closed. [verified]

  **The roll is printed and an independent count of it reaches the printed total exactly.** The
  names run over two pages, 139 on the first and 32 on the second, and 139 plus 32 is 171.
  [inference] — counted here from the page images; the 171 is
  [the tabulation's own](../../catalog/ww2-honor-list-ohio.md). Where the corpus's Civil War roster
  recovered 97.8 per cent of its printed total by an independent parse, this one recovers all of it.

  **Against the county's 73,303 people in 1940 that is one death for every 429.** [inference] —
  computed against [the 1940 census](allen-county-population-1940-1990.yml). The corpus states the
  rate and not a comparison with its other two wars, because it does not hold the same quantity for
  any of the three: the Civil War and the World War are counted here by
  [men who served](allen-county-civil-war-service.yml), and this war by men who died. A ratio of
  service to service and a ratio of deaths to population are different numbers about different
  things. [inference] — see
  [the second world war](../period/the-second-world-war-in-allen-county.yml).

  **It is more than twice any neighbouring county's toll and it is not out of line.** Hancock 94,
  Hardin 77, Shelby 74, Auglaize 72, Van Wert 71, Mercer 70, Logan 52 and Putnam 50, against Allen's
  171. [verified] — same tabulation. Allen was the most populous of the nine in 1940. [inference]

  **The county here is the county of an address given at enlistment, not of a home and not of a
  grave.** Where no home address was given the man is filed under the county of his next of kin or
  emergency addressee, and failing that under the county of his draft board. Ohio's tabulation
  carries a "State at Large" row of 89 for the cases none of the rules reaches. [verified] —
  [the Honor List](../../catalog/ww2-honor-list-ohio.md), its foreword, which sets the rule out in
  five numbered clauses; see
  [the administrative key is not the thing](../../decisions/the-administrative-key-is-not-the-thing.yml).

  **Three things this number is not.** It is not the county's war dead: the Army published this list
  and the Navy, Marine Corps and Coast Guard are not in it. It is not final: the War Department
  calls it preliminary and says names would be added. And it is not a count of deaths in combat, as
  the DNB column shows. [verified] — the source's foreword, all three.

  [open] The county's Navy, Marine Corps and Coast Guard dead, and how many of its people served at
  all. The corpus holds a service roster for each of the county's two earlier wars and none for this
  one.
properties:
  parameter: Army dead and missing credited to Allen County
  value: "171"
  unit: persons
  as_of: 1946-01-31
  method: |
    Read from the page images of the Ohio volume: the tabulation page for the six category counts
    and the two county pages for the roll. The 171 and its six components are the tabulation's own
    figures, transcribed and checked to sum. The count of names was made from the same images —
    69 in the first column, 70 in the second, 32 on the following page — and is reported as a check
    on the printed total rather than as a substitute for it. No name is transcribed here: this
    corpus counts war rolls and does not copy them, as it did for
    [1861](allen-county-civil-war-service.yml) and
    [1917](allen-county-world-war-service.yml). [verified]
