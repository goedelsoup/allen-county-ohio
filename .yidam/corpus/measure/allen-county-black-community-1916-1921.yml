class: measure
label: Allen County's Black community, 1916–1921
description: |
  The one description any source in this corpus gives of the county's Black population before the
  census tables of the present century, written by a white historian in 1921 in the language of his
  time. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), the section
  its index heads "Negroes of Allen County".

  **Two thousand five hundred people, and nearly all of them in Lima.** "It is estimated that there
  are 2,500 negroes in Allen County. ... The Allen County negroes are nearly all in Lima. A few
  families live in Delphos, and a few live in the country." [verified] — same source. Against a
  county of 68,203 in 1920 that is 3.7 per cent. [inference] — computed against
  [the 1910–1940 series](allen-county-population-1940-1990.yml).

  **Two voter counts, four years apart, and the second one includes women.** "In 1916, there were
  552 negro voters in Lima; there has been an exodus of negroes to Allen County within the last four
  years, and in 1920, counting the women, there were almost 1,000 negro voters." [verified] — same
  source. The book's own explanation joins two causes it does not separate — migration into the
  county, and the Nineteenth Amendment doubling every electorate in it. [inference]

  **Four congregations and five fraternal orders.** "There are two African Methodist Episcopal and
  two Baptist churches; the secret orders are: Samuel W. Clark Lodge Free and Accepted Masons,
  Morning Star Knights of Pythias, Siroc Chapter Royal Arch, Hamilton Commandery Knight Templars,
  and Lone Star Court Calanthes." [verified] — same source. A century later the same denominational
  families report seventeen congregations in this county and 5,365 adherents. [verified] —
  [the congregations of 2020](allen-county-congregations-2020.yml).

  **The book says where they came from and gets the instrument wrong.** "Those who came early were
  Randolph slaves liberated under the Emancipation proclamation, and their descendents are still in
  the community." [verified] — same source, quoted as printed. A manumission by a Virginian named
  Randolph and the Emancipation Proclamation of 1863 are different acts thirty years apart, and this
  corpus holds no source that dates either or connects them to this county. [open]

  **It says they had land and lost it.** "In the beginning the negroes had farms, but the whites
  soon acquired them and they flocked to the industrial centers; the same thing is true in
  surrounding counties." [verified] — same source, which offers no dates, no acreages and no
  mechanism. By 1920 the county had 2,909 farms and the book counts three of them: "There are three
  negroes operating Allen County farms; the others are white men." [verified] — same source.

  **On segregation the book contradicts itself in a page.** "While most of the negroes live in
  certain localities, there is no segregation." Then: "It is said the negroes do not live north of
  the Pennsylvania railway tracks in Lima," and "Once in a while the color line is drawn, and the
  negroes remain south of the railway tracks for safety." [verified] — same source, all three
  statements. The corpus records the contradiction and does not resolve it. [inference]

  **Two dated violences.** A riot at the spring election of 1888, beginning in the Del Flora saloon,
  in which an Irish bystander named Pat Hughes was stabbed and died. [verified] — same source. And
  in 1916 a mob came to the county jail for a Black prisoner and nearly hanged the sheriff who hid
  him. [verified] — [the mob of 1916](../event/the-mob-at-the-allen-county-jail-1916.yml).

  **About two hundred soldiers in the World War, and one retired captain.** [verified] — same
  source; see [Peter McCown](../person/peter-mccown.yml). Against the county's own war service count
  the book gives no basis for its two hundred. [open] —
  [the county's war service](allen-county-world-war-service.yml).

  [open] Any figure from the census. The corpus holds the county's race composition for 2020 and
  2023 and nothing between 1921 and 2000, and the decennial censuses of 1920 through 1990 counted
  this population every ten years in volumes this corpus has already used for other tables.
properties:
  parameter: Black residents of Allen County, as estimated
  value: "2500"
  unit: people
  as_of: "1921"
  method: |
    Read from the full text of the 1921 county history on archive.org. Every figure is the book's
    estimate and the book says so — "it is estimated", "almost", "about" — and none is a count. The
    quotations are transcribed as printed, including the period's terminology, because paraphrase
    would silently improve a source this corpus is also reporting the limits of. The 1920 population
    against which the share is computed is the census figure the corpus already holds, not the
    book's. [verified]
