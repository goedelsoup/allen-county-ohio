class: measure
label: Allen County's federal disaster declarations, 1965–2020
description: |
  **Ten declarations in fifty-five years, for eight distinct incidents.** [verified] —
  [OpenFEMA](../../catalog/fema-disaster-declarations.md), disaster declarations summaries, Ohio
  county 003.

      declared     type  incident                                    IA PA HM
      1965-04-14   DR    tornadoes & severe storms                    y  y  -
      1978-01-26   EM    blizzards & snowstorms                       -  y  -
      2004-09-19   DR    severe storms and flooding                   -  -  y
      2005-02-15   DR    severe winter storms, flooding, mudslides    -  y  y
      2005-09-13   EM    Hurricane Katrina evacuation                 -  y  -
      2007-08-27   DR    severe storms, flooding, and tornadoes       y  y  y
      2012-06-30   EM    severe storms                                -  y  -
      2012-08-20   DR    severe storms and straight-line winds        -  y  y
      2020-03-13   EM    COVID-19                                     -  y  -
      2020-03-31   DR    COVID-19 pandemic                            -  y  y

  **Counting declarations is not counting disasters.** The June 2012 storm produced an emergency
  declaration on 30 June and a major disaster declaration on 20 August, seven weeks apart, for the
  same four-day incident window; COVID-19 produced two in eighteen days. Ten rows, eight incidents.
  [inference] — computed here from the incident windows.

  **Nine of the ten carried Public Assistance**, which is aid to governments for debris and public
  works — every declaration but the hazard-mitigation-only one of September 2004. [verified] — same
  source. **What a federal disaster usually means in this county is a bill to the county, not a
  cheque to a family.** [inference]

  **Three of the ten brought money to households, and this node said two.** Individual Assistance,
  the flag `iaProgramDeclared`, was designated in 1965 and 2007 and in no other year — that part
  stands. But the file carries a fourth flag this node had not read, `ihProgramDeclared`, the
  Individuals and Households Program, and it is true for 2007 **and for the COVID-19 major disaster
  declaration of 31 March 2020**, under which $3,595,938 reached 507 households here. [verified] —
  same source; see
  [the household aid](allen-county-household-disaster-aid-2007-2020.yml). The earlier count was of
  three flags where the file prints four.

  **A county nine hundred miles from the Gulf has a hurricane declaration.** EM-3250-OH, 13
  September 2005, "Hurricane Katrina evacuation" — Public Assistance for a county that took in
  people. [verified] — same source; see
  [the Katrina declaration](../event/allen-county-declared-for-hurricane-katrina-2005.yml).

  **The rate looks like it rose tenfold and almost certainly did not.** Two declarations in the
  thirty-nine years to 2004 and eight in the sixteen after. A programme that changed its coverage,
  its designation threshold and its politics is a likelier cause than weather changing by a factor
  of ten, and nothing in this file separates them. [inference] The corpus records the count and
  refuses the trend.

  **The longest incident in the file is 1,207 days.** COVID-19 ran from 20 January 2020 to 11 May
  2023 on both its rows; the longest of the other eight is forty-one days. [verified] — same source,
  computed here.

  **Six of these ten are for weather, and five of the six now have a storm with a date.** Matched
  against the county's severe weather record: the 2004 declaration has a flash flood inside its
  window, the 2005 pair of winter declarations has a winter storm on the first day of the window and
  an ice storm inside it, 2007 has a flash flood, and the June 2012 storm has four thunderstorm-wind
  reports on the exact day the incident window opens. 1965 has a tornado three days before a window
  one day long. [verified] —
  [the storm record](allen-county-storm-events-1950-2026.yml) and
  [the Storm Events Database](../../catalog/noaa-storm-events.md).

  **The sixth is the blizzard of January 1978 and the weather file does not contain it.** There is
  no Allen County row for 1978 at all, and no row of any kind within thirty days of that
  declaration, because the first blizzard this county's weather record admits is in 2007. **The
  administrative file holds the storm the observational file cannot see.** [verified] — same source;
  see [a category has a birthday](../../decisions/a-category-has-a-birthday.yml).

  **What they cost is now held, and four of the ten account for all of it.** $10,608,108 of federal
  public assistance on 95 projects, of which $8,940,505 — eighty-four per cent — is the 2020
  pandemic declaration and $1,667,603 is fifteen years of weather. [verified] —
  [the assistance](allen-county-disaster-assistance-2005-2025.yml). Three hazard mitigation projects
  and $4,237,572 to households sit beside it. [verified] —
  [the mitigation](allen-county-hazard-mitigation-2003-2026.yml) and
  [the household aid](allen-county-household-disaster-aid-2007-2020.yml).

  [open] What the state and local shares came to, and what a parent-owned hospital in this county
  was paid. The public assistance ledger is keyed to the applicant's county, so money spent in Lima
  by a company registered in Cincinnati is counted in Hamilton County. See
  [a grant file counts offices, not ground](../../decisions/a-grant-file-counts-offices-not-ground.yml).

  **These cannot be crossed with the river's flow record, and finding that out was the point.** The
  Ottawa River gauge at Lima is missing water years 2000 to 2009 exactly, and the declarations for
  storms and flooding fall in 2004, 2005 and 2007. Exactly one non-pandemic declaration here lies
  inside the gauge's record — June 2012, titled for straight-line winds, in a water year whose peak
  ranked sixteenth of twenty-seven. [verified] —
  [the peak flows](ottawa-river-peak-flows-1924-2025.yml); see
  [the intersection, not the union](../../decisions/the-intersection-not-the-union.yml).

properties:
  parameter: federal disaster and emergency declarations naming Allen County
  value: "10"
  unit: declarations
  as_of: "2020"
  method: |
    Fetched from the OpenFEMA v2 API filtered to `fipsStateCode` 39 and `fipsCountyCode` 003, and
    counted here. The `as_of` is the last declaration and not the query date: this file grows, and
    the figure is a count of what had happened by then. Distinct incidents are counted by grouping
    rows on the incident window, which merges 2012's pair and 2020's and separates the two of 2004
    and 2005. Incident dates before 2004 are not usable — the 1965 and 1978 rows give an incident
    beginning and ending on the day the declaration was signed. [inference]
