  as_of: 2018-02-28
  method: |
    Every row of Ohio's BAS boundary-change files whose entity FIPS place code is 21602, read from
    the same sixteen files and two record layouts as
    [the county's record](allen-county-annexations-1990-2024.yml). The layout that arrives partway
    through the series abbreviates the instrument to `O` and `R`; both are expanded here to
    `Ordinance` and `Resolution`, which is the vocabulary the earlier layout spells out and the
    readme's own account of the change. Everything else is the file's, unrounded: `acres` is the
    survey's estimated area of the change and is absent where the file leaves it so. [verified]
