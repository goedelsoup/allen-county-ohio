class: measure
label: Delphos annexations, 1990–2018
description: |
  **Twenty-six acts and 784.4 acres — the largest annexation record in Allen County, and half as
  many acres again as [Lima's](lima-annexations-1990-2017.yml) on more than twice the number of
  acts.** [verified] —
  [the Boundary and Annexation Survey](../../catalog/census-bas-boundary-changes-ohio.md); see
  [the county's fifty-seven](allen-county-annexations-1990-2024.yml), which counts these among
  them.

  Written out: **Delphos reported twenty-six boundary changes between 22 May 1990 and 28 February
  2018, totalling 784.4 acres on the twenty-four that state one.** [verified] — same files. The
  largest is ordinance 1996-51, 240.0 acres effective 11 November 1996; the smallest the file
  states is 2010-16 at three tenths of an acre.

  **Every one of the twenty-six is an ordinance**, which is what distinguishes this record from
  the rest of the county's. Ten of the county's fifty-seven acts are resolutions and none of them
  is Delphos's. [verified] — the same files, counted here. [inference] — under the two-instrument
  reading an Ohio annexation begins with a resolution of the county commissioners and ends with an
  ordinance of the city, so this is a record of completed acts and not of started ones.

  **The table is keyed by instrument and not by date, because two pairs share a date.** Ordinances
  2003-18 and 2003-21 both took effect on 8 April 2003, and 2007-32 and 2007-33 both on 24 July
  2007 — and the 2007 pair are two of the five records in the whole county that state no acreage.
  [verified] — same files.

  **How much of this ground is in Allen County is not knowable from the file.** Delphos is a city
  on the Allen–Van Wert line, and no record in this series carries a county column before the 2019
  survey year; the one Delphos record that falls after it does not either. So 784.4 acres is what
  the city reported annexing, not what it added inside this county, and the corpus does not divide
  it. [verified] — the record layout. The class already carries the caution in another form: a
  `(pt.)` figure is a county portion, and Bluffton and Delphos are the two municipalities it is
  written for. [open] The split.
