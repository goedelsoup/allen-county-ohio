class: measure
label: Allen County's named features, counted two ways
description: |
  **The federal gazetteer files 109 named features in Allen County and 120 of them stand on Allen
  County ground.** [verified] — [USGS GNIS](../../catalog/gnis-domestic-names-ohio.md), Ohio
  domestic names, read twice: once on the `county_name` column and once by testing every Ohio
  feature's coordinates against
  [the county's own polygon](../../catalog/tigerweb-census2020.md).

      feature class      by the county column   by coordinate
      Populated Place              39                38
      Stream                       21                33
      Civil                        23                23
      Reservoir                    13                13
      Canal                         7                 7
      Census                        3                 3
      Lake                          1                 1
      Channel                       1                 1
      Military                      1                 1
      ------------------------------------------------------
      total                       109               120

  **By coordinate the nine classes run 38 populated places, 33 streams, 23 civil divisions, 13
  reservoirs, 7 canals, 3 census areas, 1 lake, 1 channel and 1 military installation.**
  [verified] — same source, counted here.

  **Every one of the eleven the column misses is a stream that rises here and ends somewhere
  else.** Nine discharge into Putnam County — Big Run, Cranberry Creek, Cranberry Run, Flat Fork,
  Jennings Creek, [the Ottawa River](../natural-feature/ottawa-river.yml), Plum Creek, Rattlesnake
  Creek and [Sugar Creek](../natural-feature/sugar-creek.yml) — one into Hardin as Little Riley
  Creek, and one, [the Auglaize](../natural-feature/auglaize-river.yml), all the way to Defiance.
  [verified] — same source, source coordinates tested against the polygon. The county's principal
  watercourse runs through the middle of Lima and is filed under a county it merely reaches.

  **The twelfth is the mirror case and it breaks the rule the catalog states.** Wrestle Creek's
  mouth is 426 metres inside Allen County and GNIS files it under Auglaize. [verified] — same
  source; the distance computed here. "A stream is filed under the county of its mouth" is
  therefore a tendency and not a rule, and within half a kilometre of a county line the file and
  the ground disagree. [inference]

  **Reading by coordinate loses exactly one feature, and it is the one this corpus already knew
  was split.** Delphos is filed under Allen County and its GNIS point, 40.8433831, -84.341618,
  falls in Van Wert. [verified] — same source. That is a third independent witness to
  [the straddle](../place/delphos.yml), after the Census Bureau's `(pt.)` rows and an attorney
  register's self-reported county.

  **Three names in the county are used twice.** Two entries named Little Riley Creek, two named
  Marsh Run, and two named Spencerville Reservoir 761 metres apart under feature ids 1058037 and
  1078531. [verified] — same source, distance computed here. A name is not an identifier in this
  county even within one gazetteer. [inference]

  **Fourteen still waters are named and none of them is natural.** Thirteen are classed Reservoir
  and one, Mirror Lake, is classed Lake. [verified] — same source. The corpus's own reading of the
  county's water calls this a county with no natural lakes, which makes the one Lake a name rather
  than a classification. [inference] — see
  [the water systems](allen-county-water-systems-2026.yml).

  **The gazetteer and the city do not agree about Lima's reservoirs.** The city's six are Ferguson,
  Bresler, Metzger, Williams, Twin Lakes and Lost Creek; GNIS carries Ferguson, Metzger, Twin Lake
  and Lost Creek and has no Bresler anywhere in Ohio and no Williams here. It adds eight the city
  does not name, among them Lima Reservoir and Refinery Reservoir. [verified] — same source, read
  against [the water systems](allen-county-water-systems-2026.yml). Neither list is wrong; they are
  a name authority and an operator's inventory, and a reader who takes either for the other will
  count the county's reservoirs wrong. [inference]

  **Seven features are classed Canal and every one of them is a field ditch** — Cotner, Crosley,
  Huber, Leatherwood, May, McBride and Swalley. [verified] — same source. The county's actual canal,
  [the Miami and Erie](../site/miami-and-erie-canal.yml), is not among them; what the file carries
  of it is Deep Cut, classed Channel. [verified] — same source.

  [open] What the other 103 features are for. This node counts and classifies them and writes nodes
  for two; the corpus holds six natural features out of the thirty-three streams named here, and
  none of the fourteen still waters.
properties:
  parameter: named features standing on Allen County ground
  value: "120"
  unit: features
  as_of: 2026-09-01
  method: |
    The Ohio domestic names file, 17,921 rows, filtered two ways. First on `county_name == "Allen"`
    and `state_numeric == 39`, which is the filter the catalog entry already documents and which
    returns 109. Second by ray-casting every Ohio row's primary and source coordinates against the
    Census Bureau's 2020 county polygon for GEOID 39003, 1,243 vertices, counting a feature if
    either coordinate falls inside; that returns 120. Distances to the boundary are computed on a
    local flat-earth approximation and are quoted only to the nearest metre, which is well inside
    what that approximation supports at this latitude. [verified]
