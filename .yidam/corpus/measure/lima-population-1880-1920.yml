class: measure
label: Lima population, 1880–1920
description: |
  The city's counts across the oil boom and the forty years after it. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) for 1880,
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md) for 1900, and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md) for 1920.

      1880      7,567     Lima village, in Ottawa Township's 7,669          confirmed
      1900     21,723     "Ottawa (coextensive with city of Lima)"          confirmed
      1920     41,306     "the 1920 Ottawa Township census report ..."      superseded by 41,326

  Written out, because a table is not prose and this corpus publishes prose: these three histories
  put **7,567 people in 1880, 21,723 in 1900 and 41,306 in 1920** in Lima. [verified] — the three
  sources above, one figure each. **The Census Bureau confirms the first two to the person and
  contradicts the third**, giving 41,326 for 1920. [verified] —
  [1960 Census, Number of Inhabitants, Ohio](../../catalog/census-1960-number-of-inhabitants-ohio.md),
  Table 5; see [the federal series](lima-population-1850-1960.yml), which supersedes this node as a
  measure and leaves it standing as the record of what the histories printed.

  **The corpus believed the wrong one of the two, and had already said which it would be.** The 1920
  figure was marked here as [a single witness read once](../../decisions/a-single-witness-read-once.yml)
  — Rusler's is the only scan of that book the corpus holds, and no second source could be brought
  against it. The Census table settles it not by being federal but by showing its work: each count is
  printed beside its increase over the preceding census, and 30,508 + 10,818 = 41,326 while
  41,326 + 961 = 42,287. Rusler's 41,306 fails both, and the same passage of Rusler subtracts its own
  list of incorporated places from the county total and lands a thousand out. [verified] — same
  sources. No third witness was consulted, and none is needed for arithmetic. [inference]

  **These are the corpus's first Lima figures earlier than 2000.** Lima nearly tripled between 1880
  and 1900 and nearly doubled again by 1920 — **a fivefold rise in forty years**, which is the
  demographic shape of [the oil strike](../event/lima-oil-strike.yml). [inference]

  **A correction, made one phase after the mistake.** When this node held only 1920 and 2000 —
  41,306 and 40,307 — the corpus concluded that "eighty years net to roughly nothing" and that Lima's
  peak was somewhere it could not see. The 1990 Census volume then supplied
  [53,734 in 1970](lima-population-1970-1990.yml). Two points that happen to be level are not a
  plateau: between them the city grew by thirty per cent and lost it again, and the corpus had drawn
  a chord across a rise and a fall and described the chord. See
  [the pre-1970 series](../question/pre-1970-population-series.yml).

  **The 1900 and 1920 figures are township figures and that is not an error here.**
  [Ottawa Township](../question/what-became-of-german-and-ottawa-townships.yml) was coextensive with
  the city — the 1906 table says so in the row label, twenty-one years before the 1921 volume says it
  in prose. [verified] — same sources. So the township count is the city count, and the corpus can
  now date that coextension to 1900 or earlier rather than to 1921.

  **All three are compilations, not census publications**, and this node asked for the thing that
  would test them: "a place-level decennial series from the Census Bureau would replace all three."
  It arrived, and it replaced one. Two of the three compilations were right to the person across
  eighty years, which is a better result for county histories than this corpus expected and is worth
  recording as such. [inference] The 1880 figure comes from a table whose county total the corpus
  has already found to disagree with the 1906 volume by sixteen people at 1850 — see
  [the county series](allen-county-population-1830-1900.yml), where the same question is open and
  no federal series has yet reached it.
properties:
  parameter: total resident population, decennial, as three county histories printed it
  value: "41306"
  unit: persons
  as_of: "1920"
  method: |
    Three county histories' compilations of published census returns, one figure from each. The
    1900 and 1920 figures are for Ottawa Township, which both sources state was coextensive with
    the city. [verified] The value above is **superseded**: the Census gives 41,326 for the same
    date and this node keeps 41,306 because its subject is what the histories printed. For Lima's
    1920 population, cite [the federal series](lima-population-1850-1960.yml). [verified]
