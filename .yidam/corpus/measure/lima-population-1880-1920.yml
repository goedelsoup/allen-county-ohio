class: measure
label: Lima population, 1880–1920
description: |
  The city's counts across the oil boom and the forty years after it. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) for 1880,
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md) for 1900, and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md) for 1920.

      1880      7,567     Lima village, in Ottawa Township's 7,669
      1900     21,723     "Ottawa (coextensive with city of Lima)"
      1920     41,306     "the 1920 Ottawa Township census report including Lima"

  Written out, because a table is not prose and this corpus publishes prose: the city held
  **7,567 people in 1880, 21,723 in 1900 and 41,306 in 1920**. [verified] — the three sources above,
  one figure each.

  **These are the corpus's first Lima figures earlier than 2000.** Lima nearly tripled between 1880
  and 1900 and nearly doubled again by 1920 — **a fivefold rise in forty years**, which is the
  demographic shape of [the oil strike](../event/lima-oil-strike.yml). [inference]

  **A correction, made one phase after the mistake.** When this node held only 1920 and 2000 —
  41,306 and 40,307 — the corpus concluded that "eighty years net to roughly nothing" and that Lima's
  peak was somewhere it could not see. The 1990 Census volume then supplied
  [53,734 in 1970](lima-population-1970-1990.yml). Two points that happen to be level are not a
  plateau: between them the city grew by thirty per cent and lost it again, and the corpus had drawn
  a chord across a rise and a fall and described the chord. See
  [the pre-1970 series](../question/pre-1970-population-series.yml).

  **The 1900 and 1920 figures are township figures and that is not an error here.**
  [Ottawa Township](../question/what-became-of-german-and-ottawa-townships.yml) was coextensive with
  the city — the 1906 table says so in the row label, twenty-one years before the 1921 volume says it
  in prose. [verified] — same sources. So the township count is the city count, and the corpus can
  now date that coextension to 1900 or earlier rather than to 1921.

  **All three are compilations, not census publications**, and the 1920 figure is
  [a single witness read once](../../decisions/a-single-witness-read-once.yml). The 1880 figure comes
  from a table whose county total the corpus has already found to disagree with the 1906 volume by
  sixteen people at 1850 — see
  [the county series](allen-county-population-1830-1900.yml). [open] A place-level decennial series
  from the Census Bureau would replace all three.
