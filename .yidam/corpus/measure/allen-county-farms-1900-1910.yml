class: measure
label: Allen County farms and farm property, 1900–1910
description: |
  What the county was made of, on the ground, at the height of the oil boom. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md),
  statistics of agriculture, Tables 1 and 2.

      farms            1910  2,939     land in farms       1910  240,472 acres
                       1900  2,858                         1900  245,283 acres
      farm property    1910  $25,992,184   improved land   1910  203,222 acres
                       1900  $13,752,968                   1900  196,465 acres
      land per acre    1910  $76.28    of all farm property in 1910: land $18,343,284
                       1900  $38.39    buildings $4,412,075 · implements $611,579
                                       animals, poultry and bees $2,625,246

  **Nine-tenths of Allen County was farmland in 1910 — 240,472 acres of 259,840, or 92.5 per cent.**
  [verified] — same source, which prints the percentage and the land area beside it. Of that,
  203,222 acres were improved, 32,316 were woodland in farms and 4,934 were otherwise unimproved.
  The average farm was 81.8 acres; the commonest was between 50 and 99 acres, and 1,138 of the 2,939
  were that size. One farm in the county exceeded 500 acres and none reached 1,000.

  **The county had 2,939 farms in 1910 and 2,858 in 1900, on 240,472 acres against 245,283.**
  [verified] — same source. Farms rose by 81 and farmland fell by 4,811 acres, about 2 per cent,
  while improved acreage *rose* by 6,757. Twenty-five years after
  [the strike](../event/lima-oil-strike.yml), whatever the boom did to this county, it had not taken
  the farms out of it. See [Lima manufactures](lima-manufactures-1899-1909.yml) for the other side
  of the same volume, and [what the county was](../period/lima-oil-boom.yml).

  **What did change is what an acre cost.** Land per acre went from $38.39 to $76.28 — up 98.7 per
  cent — and all farm property rose 89.0 per cent against 58.7 per cent for Ohio. [verified] — same
  source, which prints both percentages. [inference] Almost all of the county's farm-property growth
  is price rather than extent, because the extent fell. That oil money is what raised the price is
  the obvious reading and is not established here. [open]

  **The farms that multiplied were rented ones.** Owner-operated farms fell from 2,089 to 2,046
  while tenanted farms rose from 730 to 871, and tenancy went from 25.5 to 29.6 per cent of all
  farms. [verified] — same source, Table 2. Of the 871 tenants, 509 paid shares and 275 paid cash.
  Of 2,046 owners, 655 carried mortgage debt and 1,378 were free of it.

  **Of 2,939 farmers, 127 were foreign-born and 3 were Negro or other nonwhite.** [verified] — same
  source. [open] Nothing here counts the people who *worked* the farms — only the operators. The
  corpus has no farm-labour headcount for any year.

  **The other end of the century is measured now.** 178,921 acres in 2022, 69.4 per cent of the
  county, with 94,325 of those acres rented from somebody else. [verified] —
  [the Census of Agriculture](../../catalog/usda-census-of-agriculture.md); see
  [the modern series](allen-county-farms-2002-2022.yml). The 2,939 farms of 1910 and the 897 of 2022
  are not subtracted here: the two censuses use different definitions of a farm, and the difference
  between the thresholds is not a quantity anything in this corpus can supply. See
  [a farm count is a definition](../../decisions/a-farm-count-is-a-definition.yml).
properties:
  parameter: farms, farm acreage and value of farm property, Allen County
  value: "2939"
  unit: farms
  as_of: "1910-04-15"
  method: |
    Thirteenth Census of Agriculture, enumerated April 15, 1910, with 1900 comparatives printed in
    italics. Read from rendered images of a 400-dpi scan. Checked by arithmetic self-closure: the
    three tenure classes of Table 2 sum to Table 1's farm count, acreage, improved acreage and
    land-and-buildings value independently; the ten size classes sum to 2,939; improved plus
    woodland plus other unimproved sums to land in farms; the four property components sum to the
    total in both years; and all six printed averages and percentages recompute. [verified]
