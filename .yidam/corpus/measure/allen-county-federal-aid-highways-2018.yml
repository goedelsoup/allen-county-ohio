class: measure
label: The federal-aid highways of Allen County, 2018
description: |
  **One file names the owner of a road in this county, and it covers a sixth of the network.**
  359.2 miles of the county's 2,225.6, in 87 routes and 2,035 sections. [verified] —
  [the HPMS public release](../../catalog/fhwa-hpms-public-release.md), against
  [the county's road linework](allen-county-roads-2010-2024.yml).

  **Half of it belongs to the state and the state carries seventy-two per cent of the traffic.**
  The state highway agency owns 182.1 of the 359.2 miles, the county 117.0, the municipalities
  39.3 and the townships 20.8; the state's share of the daily vehicle-miles is 72.0 per cent
  against the county's 16.7, the municipalities' 8.3 and the townships' 3.0. [verified] — the
  same source, computed here.

      owner                   miles   share   daily VMT   VMT share   mean AADT
      state highway agency    182.1   50.7%   1,847,909      72.0%       10,150
      county highway agency   117.0   32.6%     427,151      16.7%        3,649
      city or municipal        39.3   10.9%     212,811       8.3%        5,409
      town or township         20.8    5.8%      77,452       3.0%        3,726
      all four                359.2  100.0%   2,565,324     100.0%

  **Interstate 75 is 1.04 per cent of the county's road and a third of the traffic on everything
  this file measures.** 23.12 miles carrying 835,274 vehicle-miles a day — 32.6 per cent of the
  federal-aid total — with a daily count that runs from 29,733 at the county line to 43,120
  through Lima. [verified] — same source, by route.

  **Two federal routes cross this county and there are no others.** I-75 and US 30, 47.2 miles
  between them; fourteen state routes add 134.9, fifty-one county roads add 150.0 and sixteen
  township roads add 25.8. [verified] — same source, by route identifier.

      route                     miles   mean AADT
      State Route 81            28.98       4,438
      State Route 117           28.39       6,535
      US 30                     24.06      11,648
      Interstate 75             23.12      36,126
      County Road 88            21.93       1,186
      State Route 309           21.83       9,324
      State Route 65            18.58       5,479
      County Road 222           14.54         777

  **The longest road in Allen County is a state route and it is not a federal one.** State Route
  81 runs 28.98 miles across the county, half a mile longer than State Route 117 and nearly six
  longer than the interstate. [verified] — the same source.

  **23 of the 87 routes change owner along their length, and every change is into a
  municipality.** 19 county roads become city or municipal and 4 township roads do; not one route
  in the county changes between state and county, or between county and township. The only
  ownership boundary this file records is a corporation line. [verified] — same source, by route.

  **Two hundred and seventy of these miles are two lanes wide.** 270.3 miles of two-lane against
  87.9 of four, for 895.9 lane-miles over 359.2 centerline miles — an average of 2.49 lanes.
  [verified] — the same source.

  **Its pavement rating is a rating of state pavement.** Roughness is reported on 109.5 of the
  359.2 miles, and of those 57.2 per cent are good, 30.1 fair and 12.7 poor at a median index of
  88. But the state's share of its own mileage that is rated is 46.7 per cent against 14.9 for
  the county, 13.1 for the townships and 10.9 for the municipalities, so a county-wide condition
  figure computed from this file is mostly a figure about roads the state owns. [verified] — same
  source, by owner; see
  [a source is also a filter](../../decisions/a-source-is-also-a-filter.yml).

  **Its sections tile its routes exactly.** The sum of 2,035 section lengths and the union of the
  intervals they cover are both 359.2 miles: no overlap and no gap. [verified] — the same source,
  computed here; see
  [arithmetic that closes is about the compiler](../../decisions/arithmetic-that-closes-is-about-the-compiler.yml).

  **This corpus cannot say who is responsible for the other 1,866 miles.** The federal-aid system
  is the part of the network the federal government helps pay for, and it is defined by function
  rather than by ownership: a township road carrying enough traffic is in it and a city street
  carrying little is not. What this file leaves out is not a class of owner but the low end of
  every owner's holdings. [verified] — the coverage rule the publisher states, and the ownership
  table above.

  [open] What this looked like in any other year. The publisher serves 2018 alone under this
  naming and every other year from 2011 to 2025 answers *Service not found*, so nothing here can
  be differenced.

properties:
  parameter: federal-aid highway centerline in Allen County
  value: "359.2"
  unit: miles
  as_of: "2018"
  method: |
    The Ohio 2018 HPMS public release feature layer, queried on `county_code=3` and paged at 2,000
    rows. Section length is `end_point` minus `begin_point`, which the file states in miles along
    the route; the sections were checked for overlap by taking the union of the intervals per route
    before any mileage was summed. Vehicle-miles are `aadt` times section length, summed. Route
    class is characters five and six of `route_id`. These are route miles and not centerline miles:
    the same interstate is 46.31 miles in the Census Bureau's linework, and the difference is the
    subject of
    [a centerline is not a road](../../decisions/a-centerline-is-not-a-road.yml). [verified]
