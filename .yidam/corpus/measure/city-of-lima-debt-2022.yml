class: measure
label: What the City of Lima owes, and what it built, 2022
description: |
  **Lima's debt is its water and sewer system.** Of the $143,291,818 the city owed in bonds and
  loans at the end of 2022, **$129,409,690 — ninety per cent — is nineteen loans from the Ohio Water
  Development Authority**, and every one of them is named in the city's own schedule for the work it
  paid for. [verified] — [the city's audit](../../catalog/ohio-auditor-of-state-audit-search.md),
  City of Lima, year ended 31 December 2022, Note 14. See
  [what the county's governments owe](allen-county-local-government-debt-2017-2022.yml), whose
  federal figure for this city is $146,750,000.

  **The largest single debt the city carries is a storage basin: $38,179,516, at 1.48 per cent.**
  That one loan is nearly five times the city's entire general obligation bonded debt of $7,720,359,
  and seven times the $5,148,635 of it that the general fund repays. [verified] — the same note,
  computed here.

  **The city's whole general-obligation debt is two bond issues, and both are unvoted.** A 2012 and
  a 2018 issue, each titled "various purpose", between them $4,976,250 of principal outstanding in
  the governmental funds. The note breaks both down and most of what they did was refinance:
  of the 2012 issue's $6.81 million, $1,380,000 was new governmental improvement and $3,065,000
  refunded 2004 bonds for wastewater. [verified] — the same note, sections A and B.

  **Two of the corpus's dams are on this schedule.** $1,294,000 of the 2018 bonds went to
  Schoonover Lake and Dam improvements — the 1890 dam this corpus records as low-hazard and in
  satisfactory condition. And the **Bresler Termination Agreement was fully repaid in 2022**: in 2003
  the city agreed to repay the State's share of the 1970 construction of Bresler Reservoir,
  $2,841,646 over twenty years at zero per cent interest, in exchange for the State's claim on the
  water. [verified] — the same note. **The county's largest reservoir finished being paid for
  fifty-two years after it was built**, and it is the only obligation on this schedule that went to
  zero in 2022. [inference] — computed from the two dates; see
  [the dams](allen-county-dams-2026.yml).

  **The legal debt limit can see $4,866,651 of it.** Ohio's constitution caps voted debt at 10.5 per
  cent of assessed valuation and unvoted at 5.5; on Lima's valuation those are $45,260,146 and
  $23,707,696. Against them the city's *net debt applicable to the limit* is **$4,866,651**, leaving
  89.25 per cent of the limit unused. [verified] — the same audit, statistical section, legal debt
  margin. The city owes thirty times what the limit is measuring.

  **Two exclusions do it, and only one of them is an exemption.** Gross indebtedness for the limit is
  $13,407,160 — general obligation bonds, revenue bonds and special assessments, which reconciles to
  the dollar and **contains no OWDA loan at all**; from that, water and sewer bonds and revenue bonds
  are then subtracted as exempt categories. [verified] — the same table, recomputed here from Note
  14. So $129 million never enters the calculation and a further $8 million is taken out of it. See
  [a debt limit is a list of exemptions](../../decisions/a-debt-limit-is-a-list-of-exemptions.yml).

  **The clearest evidence is a year the city borrowed nothing.** Gross indebtedness fell from
  $39,152,810 at the end of 2020 to $15,037,650 at the end of 2021 — sixty-two per cent — across a
  year whose principal event was refunding the 2014 sewer revenue bonds into an OWDA loan.
  [verified] — the same table and Note 14B. Moving a debt from a bond to a state loan removes it
  from the measure without repaying it. [inference]

  [open] What the other forty-five governments borrowed for. This node reads one city's schedule
  because it is half the county's debt; Elida Local Schools at $45,709,000, Delphos at $23,359,000
  and Bath Local Schools at $21,455,000 have audits in the same search and have not been opened.
