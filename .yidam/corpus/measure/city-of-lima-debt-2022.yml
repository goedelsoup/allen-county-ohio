  method: |
    Read from Note 14, Long-Term Obligations, of the city's audited statements for the year ended
    31 December 2022. [verified] The table gives principal outstanding at 31 December 2022 and omits
    unamortized premiums and discounts, which is why it sums to $142,761,778 against the note's
    $143,291,818; `rate_pct` is the low end where the note gives a range. Pension liabilities,
    OPEB liabilities, compensated absences and leases are **not** here: they are liabilities and not
    debt, which is the distinction
    [the county's debt node](allen-county-local-government-debt-2017-2022.yml) already draws.
    [verified] The Bresler Termination Agreement is omitted because its balance went to zero in 2022,
    which is how the note's $129,409,690 of direct borrowings is exactly the nineteen OWDA loans.
    [verified]

    **The federal survey and the audit do not agree, and the gap is not explained here.** Item `49U`
    gives $146,750,000 against the note's $143,291,818 — $3,458,182 apart, which is close to but not
    equal to the city's $3,393,256 of compensated absences. [verified] Which figure a reader should
    use depends on whether compensated absences are debt, and this node asserts nothing about that.
