class: measure
label: Allen County population, 2020 estimates base
description: |
  The Census Bureau's April 1, 2020 estimates base for Allen County. [verified] —
  [Census Population Estimates, Vintage 2024](../../catalog/census-popest-2024.md), county
  file, field `ESTIMATESBASE2020`.

  This is the 2020 enumeration as subsequently revised, not a modeled estimate — which is why
  it is the right figure to anchor a series on and the wrong one to describe as "the 2020
  census count" without qualification. That caution is now measured:
  [the enumeration itself](allen-county-population-2020-census.yml) is 102,206, eleven fewer.
  [verified] — [TIGERweb](../../catalog/tigerweb-census2020.md), summed over the county's 3,552
  blocks.
properties:
  parameter: total resident population
  value: "102217"
  unit: persons
  as_of: 2020-04-01
  method: |
    Decennial enumeration as revised for the Vintage 2024 estimates base. A later vintage may
    revise it again. [verified]
links:
  - target: ../place/allen-county.yml
    relationship: describes
    claim_tag: verified
    source: ../../catalog/census-popest-2024.md
  - target: allen-county-population-2020-census.yml
    relationship: not-comparable-to
    claim_tag: inference
    because: >-
      One enumeration of one date, read out of two files: 102,206 as the redistricting file
      published it and 102,217 as the Vintage 2024 base revised it. Eleven people, and they are
      not a change in the county between two dates — there is only one date. A series may carry
      either figure and never both.
  - target: allen-county-population-2010.yml
    relationship: comparable-to
    claim_tag: inference
    because: >-
      A revised base against a census count, across ten years, on ground that did not move. The
      seam between the two instruments is measured at the one date where both exist: 102,206
      enumerated and 102,217 as the Vintage 2024 base revised it, **eleven people**, against a fall
      of 4,114 here. Three orders of magnitude, and the same file's base and count for one date
      stay not comparable for the reason this pair is: there, eleven people is the entire
      difference. See [a bound is not a break](../../decisions/a-bound-is-not-a-break.yml).
  - target: ../measure.ont.yml
    relationship: instance-of
