class: measure
label: Allen County population, 2020 estimates base
description: |
  The Census Bureau's April 1, 2020 estimates base for Allen County. [verified] —
  [Census Population Estimates, Vintage 2024](../../catalog/census-popest-2024.md), county
  file, field `ESTIMATESBASE2020`.

  This is the 2020 enumeration as subsequently revised, not a modeled estimate — which is why
  it is the right figure to anchor a series on and the wrong one to describe as "the 2020
  census count" without qualification.
