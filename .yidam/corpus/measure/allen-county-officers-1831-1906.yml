class: measure
label: Allen County's officers, 1831–1906
description: |
  The county's roster of every elected officer from its organization to the year the book was
  printed — nine offices, seventy-five years, and until now the corpus held one holder of each.
  [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md),
  "Roster of County Officials".

  **Before this the corpus knew who had been sheriff and, for every other county office, only who
  holds it today.** Thirty-nine of its eighty tenure nodes are sheriffs; the auditor, treasurer,
  recorder, clerk of courts, prosecuting attorney, coroner and engineer had exactly one each.
  [verified] — the corpus's own tenure class, counted.

      office                        first holder, 1831        holders to 1906
      Treasurer                     Adam White                             27
      Prosecuting Attorney          Aaron M. Miller                        22
      Sheriff                       Henry Lippincott                       21
      Recorder                      Nathan Daniels                         20
      Coroner                       H. Clippenger (from 1844)              20
      Auditor                       William G. Woods                       19
      Surveyor                      John Jackson                           14
      Clerk of Common Pleas         John Ward                              14
      Probate Judge                 William S. Rose (from 1851)            12

  **In order, the nine counts are 27 treasurers, 22 prosecuting attorneys, 21 sheriffs, 20
  recorders, 20 coroners, 19 auditors, 14 surveyors, 14 clerks of the common pleas and 12 probate
  judges — 169 named holdings in seventy-five years.** [verified] — same source, counted entry by
  entry.

  **The county went thirteen years without a coroner in the record.** Every other office begins in
  1831 with the county's organization; the coroners' list opens in 1844. [verified] — same source.
  And the list has a hole it prints as a hole: the entry for 1862 is a year with a dash and no name
  against it.

  **The office now called County Engineer was the County Surveyor for its first seventy-three
  years.** John Jackson, 1831, through Charles E. Craig, 1904, under that title. [verified] — same
  source; see [the county engineer](../office/allen-county-engineer.yml).

  **Three men held the treasury three times and one of them consecutively.** Thomas K. Jacobs in
  1841, by appointment in 1847 and by election in 1849; William Armstrong in 1853 and again in
  1857; Amos Young in 1892 and again in 1894, with Aaron J. Osman between them for a single year.
  [verified] — same source. John B. Wamsley was recorder in 1844, again in 1847 and again in 1854.

  **The prosecutor's chair changed hands mid-term twice in the 1850s and the two county histories
  disagree about the whole decade.** The 1906 roster: Mathias H. Nichols 1851, "resigned in 1852 to
  enter Congress"; Charles N. Lamison "elected vice Nichols resigned" 1852; Jasper N. Gutridge 1855;
  Lamison again 1857; Gutridge again 1859. [verified] — same source. The 1921 roster runs "Mathias
  H. Nichols, 1851 (who resigned in 1852 to enter Congress); Jasper N. Guthridge, 1859" — dropping
  three holders and seven years. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The 1921 book contradicts its own roster forty pages later.** Its account of the bar says of
  Lamison that "he served as prosecuting attorney two terms, and was later elected for two terms as
  congressman from this district". [verified] — same source. The corpus takes the 1906 list, which
  is the fuller one and is corroborated by the later book's prose against the later book's table.
  [inference]

  **The sheriffs are the check on all of it, and the book loses two years to the printer.** The
  1906 roster and
  [the sheriff's own modern roster](../../catalog/acso-past-sheriffs.md) name the same twenty-one
  men in the same order from 1831 to 1905. They differ on two dates and both are the book's:
  Charles H. Williams is given 1843, the same year as John Keller before him, against the roster's
  1845; and Mathias Ridenour is given 1833, which is impossible, against the roster's 1853.
  [verified] — the two lists compared entry by entry.

  **A third witness settles both of them against the 1906 book.** The 1921 history prints the same
  succession under "County Sheriff" and gives Charles H. Williams 1845 and Mathias Ridenour 1853 —
  agreeing with the modern roster on both, and against the 1906 book on both. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). It also
  puts Van Gunten's start at 1906 rather than 1905, again with the modern roster. On the sheriffs,
  the later book is the better one — which is the reverse of what it is on the prosecutors.
  [inference]

  [open] Two spellings also differ — Lippincott against Lippencott, Van Gunten against Van Gunter —
  and nothing held here settles either.

  **Six of the county's members of Congress came out of these lists.** "Allen County has been
  represented in the U. S. Congress by Senator Calvin S. Brice, Mathias H. Nicholas, Charles N.
  Lamison, S. S. Yoder, B. F. Welty and John L. Cable." [verified] — the 1921 history. Three of the
  six are on the 1906 roster: Nichols and Lamison as prosecuting attorney, Yoder as probate judge in
  1881, and Welty as prosecuting attorney in 1905. [verified] — the 1906 roster. That is four of the
  six holding county office first, not three. [inference] — counted here.

  **All six of that claim have since been checked against the federal record and all six hold.**
  Brice in the Senate 1891–97, Nichols in the House 1853–59, Lamison 1871–75, Yoder 1887–91, Welty
  1917–21 and Cable 1921–25 and again 1929–33. [verified] —
  [the congress-legislators file](../../catalog/congress-legislators.md); see
  [the county in Congress](allen-county-in-congress-1831-1933.yml). A fifth of the six turns out to
  have held a county post as well: Calvin S. Brice "was employed in the auditor's office of Allen
  County" in 1863, before the war took him back. [verified] — the 1906 history's biography of him.
  Only Cable went to Washington without working in this courthouse first. [inference]

  **The county commissioners are now read, and the rule they needed was not the one this node asked
  for.** The board is printed year by year from June 1831 — seventy-five rows, fifty-three men — and
  the rule is internal to the list: every row is the one before it shifted a place right, and the
  man in third place is the one who goes. [verified] —
  [the board of 1831–1920](allen-county-commissioners-1831-1920.yml). The September overlap the book
  warns about is real and is not what makes the list readable; the shift is. [inference] — see
  [the shape of a list is evidence](../../decisions/the-shape-of-a-list-is-evidence.yml).

  [open] What "really four names should be shown" costs in practice. The book warns that a December
  snapshot understates the board once the term began in September, and never says from which year,
  so the rows affected go unmarked.
properties:
  parameter: elected county officers named, 1831–1906
  value: "169"
  unit: named holdings
  as_of: "1906"
  method: |
    Read from the full text of the 1906 county history on archive.org, the section headed "Roster of
    County Officials", transcribed by hand rather than parsed: the scan carries OCR damage in the
    years — 1S41 for 1841, 1833 where 1853 is meant — and a parser that trusted the digits would
    have produced a false succession. Each name-and-year pair is the book's; where a year is
    impossible it is reported as the book's and corrected only against an independent list, never
    inferred. The count of 169 is the nine offices summed and excludes the associate judges before
    1851 and the commissioners. [verified]
