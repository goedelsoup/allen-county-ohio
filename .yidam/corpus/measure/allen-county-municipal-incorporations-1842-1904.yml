class: measure
label: When Allen County's municipalities were incorporated, 1842–1904
description: |
  **Eight of the county's nine municipal corporations have a founding date, and every one of them
  was in a book this corpus already held.** [verified] —
  [1885](../../catalog/leeson-allen-county-1885.md),
  [1906](../../catalog/miller-allen-county-1906.md) and
  [1921](../../catalog/rusler-allen-county-1921.md).

      corporation      authorised           first election / first mayor        witnesses
      Lima             1842-03-29           H. D. V. Williams                   1885
      Delphos          1851-02-07           1851-03-03 or -08, Lester Bliss     1885
      Bluffton         1861-08-17 (ballot)  J. S. Powell                        1906, 1921
      Spencerville     1867                 1867, J. C. Campbell                1906, 1921
      Lafayette        1867-09-03           1868-03-13, M. C. Murnagh           1885
      Cairo            1875-04-12           1875, Dr. J. S. Clippinger          1885, 1906, 1921
      Elida            1878                 B. B. Murray                        1885, 1921
      Beaverdam        1878-05-13           Joseph Shull                        1885
      Harrod           —                    —                                   —

  **"Incorporated" is three different legal acts here and the corpus's one field flattens them.**
  Lima, Lafayette, Cairo and Beaverdam were organized on the county commissioners' authority, on a
  petition; Delphos and Spencerville by an act of incorporation; Bluffton by a ballot on 17 August
  1861 that decided both the incorporation and the name. [verified] — same sources. **The field
  `erected` records the earliest of these, and the corpus says which kind it was in each node.**
  [inference] — see [a file has more than one date](../../decisions/a-file-has-more-than-one-date.yml).

  **Authorisation and first election are not the same year twice over.** Lafayette was authorised
  3 September 1867 and elected on 13 March 1868; Lima was petitioned for in 1841 and organized on
  29 March 1842. The county's own website prints one date for each village, and for Lafayette it is
  the later one. [verified] —
  [the county's site](../../catalog/allen-county-official-site.md).

  **Every one of the eight has a named first mayor in a nineteenth- or early-twentieth-century
  book, and this corpus holds a node for exactly one of them.** [verified] — same sources; the
  exception is [H. D. V. Williams](../person/henry-d-v-williams.yml).

  **The four the corpus was missing were in books it had read for other things.** Delphos, Bluffton
  and Cairo were retrieved from the 1885, 1906 and 1921 histories in this phase; Lima's date had
  been held since the settlements phase and sat in prose without ever reaching the corporation's
  own field. [inference] — see
  [a count of absences is not an agenda](../../decisions/a-count-of-absences-is-not-an-agenda.yml).

  **The gap that is left is one village and it is bounded.** Harrod's incorporation is in none of
  the three histories: the 1885 book names it as one of Auglaize Township's four post offices and
  gives no corporation; the 1910 census returns *Harrod village* at 269 people in 1890; the 1906
  book prints a tax valuation for "Harrod corporation" in 1904. So the corporation existed by
  1 June 1890 and not, on the 1885 book's silence, before that book went to press. [inference] —
  [the 1910 supplement](allen-county-townships-1890-1910.yml) and the histories above. The county's
  own site says 1884, which sits inside that window and is not corroborated here. [verified] —
  [the county's site](../../catalog/allen-county-official-site.md).

  [open] Harrod's instrument and date. The Allen County commissioners' journal for 1884 to 1890
  would carry it, and this corpus has never opened one.
properties:
  parameter: municipal corporations in Allen County with a recorded founding date
  value: "8"
  unit: municipal corporations
  as_of: "1878-05-13"
  method: |
    Read from the full text of three county histories on archive.org, the 1885 book in two
    independent scans, and checked against the county's own cities-and-villages page. `as_of` is
    the latest founding date the corpus can state and not the query date, because the count is of
    corporations founded by then. Where two dates exist the table prints both and the `erected`
    property on each corporation carries the authorising one. Dates given only as a year are
    printed as a year; nothing here is promoted to a day. [inference]
