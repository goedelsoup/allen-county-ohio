class: measure
label: Allen County employment by sector, 1986 and 2022
description: |
  What the county's private workforce did, at the two ends of the only span this corpus can measure
  it over. [verified] —
  [County Business Patterns](../../catalog/census-county-business-patterns.md).

      1986, SIC divisions                    2022, NAICS sectors
      manufacturing            15,762        health care & social assistance   9,151
      services                 11,733        manufacturing                     8,573
      retail trade              9,135        retail trade                      5,496
      wholesale trade           3,258        accommodation & food              4,408
      finance/ins/real estate   1,934        admin & waste services            2,462
      construction              1,930        wholesale trade                   2,188
      transport/utilities       1,706        other services                    1,917
      unclassified                254        construction                      1,772
      agricultural services       136        transport & warehousing           1,444
      mining                       69        professional & technical          1,217
      ---------------------------------      educational services              1,186
      total                    45,917        and eight sectors below 900
                                             ---------------------------------
                                             total                            42,814

  **Health care is the county's largest private employer sector, and manufacturing is second.**
  [verified] — same source. In 1986 manufacturing employed more people than the next two divisions
  together.

  **The two schemes are not comparable line by line and the top line is the point.** SIC "services"
  in 1986 is a division that NAICS breaks across health care, accommodation, professional services
  and more, so the 1986 column cannot be subtracted from the 2022 one sector by sector. [verified] —
  the break is a change of definition. What survives the break is the rank of manufacturing: first in
  1986, second in 2022. [inference]

  **Health care did not simply rise past manufacturing, and this node had the shape of its fall
  wrong.** Sector 62 peaked at **12,431 in 2013** — not at the 11,744 of 2010 this node used to call
  its high — and stood above 11,744 again in 2016, before falling to 9,151 in 2022. [verified] —
  same source, read every year rather than every fifth; see
  [the annual series](allen-county-health-care-employment-2010-2022.yml) and
  [a sample is not a series](../../decisions/a-sample-is-not-a-series.yml). Against 2010 the
  county's largest sector still lost 2,593 while
  [manufacturing gained 1,446](allen-county-manufacturing-employment-1986-2022.yml). [inference]

  **What contracted is now established, even though why is not.** Of the 2,593 lost since 2010,
  hospitals are 1,866, nursing and residential care 549, social assistance 170, and ambulatory care
  8. [verified] — same source, read annually. The county's five hospitals are named, and their own reported
  full-time equivalents fell across the same span. See
  [hospital employment](allen-county-hospital-employment-2011-2023.yml).

  [open] Why any of it fell. The corpus can now name the subsector and the five hospitals inside it
  and holds nothing that explains the fall, and 2020 is a pandemic year whose effect on the 2022
  reading is not separated.
properties:
  parameter: private employment by industry sector, Allen County
  value: "42814"
  unit: employees, all private sectors
  as_of: "2022"
  method: |
    County Business Patterns county files for 1986 and 2022, with sector 62 traced across 2000,
    2005, 2010, 2015 and 2020. Both endpoint years close exactly: the ten 1986 SIC divisions sum
    to 45,917 and the twenty 2022 NAICS sectors to 42,814, each equal to its file's own total row.
    Government, the self-employed and farms are excluded. [verified]
