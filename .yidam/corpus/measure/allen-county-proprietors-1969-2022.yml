class: measure
label: Allen County proprietors and payroll employment, 1969–2022
description: |
  **Nearly one job in five in Allen County belongs to somebody working for themselves, and that has
  never been true before in fifty-four years of record.** 11,964 proprietors against 52,274 wage and
  salary jobs in 2022 — 18.6 per cent of all employment, the highest figure in the series.
  [verified] — [BEA Regional Economic Accounts](../../catalog/bea-county-employment.md), CAEMP25S
  for 1969–2000 and CAEMP25N for 2001–2022, lines 10, 20, 40, 50 and 60.

