class: measure
label: What Allen County was asked on the ballot, 2003–2012
description: |
  **A hundred and twelve questions on sixteen election days, and this county said yes to
  eighty-eight of them.** [verified] —
  [the Secretary of State's issue reports](../../catalog/ohio-sos-local-issue-reports.md), ninety of
  them, read here. Everything below the candidates: levies, bonds, income taxes, a charter, a zoning
  referendum, an electric contract and the surrender of a village.

      question                     asked  passed
      tax levy                        71      63
      school income tax               12       7
      bond issue                       8       3
      electric aggregation             8       7
      municipal income tax             5       1
      charter amendment                3       3
      ordinance or referendum          2       2
      zoning referendum                1       1
      disincorporation                 1       1
      combined bond and levy           1       0
      all                            112      88

  **The county renews and it does not add.** Of the eighty tax and bond questions, 45 asked to renew
  a levy and 44 passed; 13 asked to replace one and 13 passed; 17 asked for an additional levy and 6
  passed. That is 57 of 58 against 6 of 17 — a gap of 62 points between asking for the same money
  again and asking for more. [verified] — the same reports, classified here on the word the ballot
  itself uses.

      tax levies and bond issues        asked  passed  mean yes
      renewal                              45      44     64.9%
      replacement                          13      13     64.3%
      additional                           17       6     47.0%
      not stated in those words             5       3     49.4%

  **The one renewal that failed was not a renewal.** Bath Local School District, 2 March 2004:
  "9.56 mills (renewal), and increase of 1.74 mills". It lost 1,369 to 1,894 — 42.0 per cent, the
  worst result any renewal got in ten years and eight points below the worst additional levy that
  passed. [verified] — the same source. A renewal with an increase attached is read by this
  electorate as an increase. [inference]

  **A replacement is not a renewal either, and this county treats it as one.** Thirteen replacement
  levies were put and thirteen passed, at a mean yes share of 64.3 per cent against the renewals'
  64.9 — the two are indistinguishable in this record. [verified] — the same reports; the shares are
  computed here. What separates the words is what the tax collects; see
  [the rates](allen-county-property-tax-rates-2012-2025.yml). [inference]

  **New borrowing is the hardest thing to ask for.** Three of eight bond issues passed. Elida Local
  School District was refused twice, in May 2007 at 42.9 per cent and in November 2006 at 41.0;
  Columbus Grove twice; Bath Local School District once, in May 2011 at 45.5 per cent, six months
  before the same district renewed a levy at 62.3. [verified] — the same source.

  **And a municipal income tax is refused four times in five.** Lima put a rise from 1.5 to 1.9 per
  cent on 2 March 2004 and lost 2,335 to 4,447 — 34.4 per cent, the lowest yes share of any question
  in the decade that was not a village dissolving. Beaverdam asked three times for one per cent, in
  2006, 2007 and 2009, and was refused each time; the 2007 return is **57 yes and 57 no**, and a
  question that does not carry a majority does not pass. [verified] — the same reports. Bluffton's
  quarter-per-cent levy for a village building, on an initiative petition in 2005, is the one that
  carried. [verified]

  **Everything that was not about money passed.** Three Lima charter amendments, a Bath Township
  zoning referendum at 78.8 per cent, two ordinances by petition, and seven of eight electric
  aggregations. [verified] — the same source. The single aggregation that failed is
  [Elida's](../place/elida.yml), and its published figure cannot be right.

  **Fort Shawnee refused to tax itself twice and then abolished itself.** An additional four-mill
  levy lost 435 to 796 in November 2011 and a 3.25-mill levy lost 592 to 1,323 in November 2012 —
  30.9 per cent, the lowest of the decade. On the same 2012 ballot the village's electors were asked
  whether it should surrender its corporate power and answered 1,058 to 858. [verified] — the same
  reports; see [the village](../jurisdiction/village-of-fort-shawnee.yml).

  **Lima's schools were told no twice and then yes.** A bond passed at 61.0 per cent in May 2003 and
  a renewal at 55.0 in March 2004; additional levies failed in August 2005 at 47.9 per cent and in
  November 2007 at 39.0; an additional 5.99-mill levy carried in November 2012 at 55.4. [verified] —
  the same reports; see [the school buildings](allen-county-school-buildings-1986-2024.yml), whose
  rebuilt schools the 2003 bond paid the local share of. [inference]

  **The busiest ballot in the decade was an odd-numbered year.** Nineteen questions on 8 November
  2011 and eighteen of them passed; sixteen on 7 November 2006 and twelve passed. The two
  presidential years carried nine and twelve. [verified] — the same source.

      election day    questions  passed
      2003-05-06              5       5
      2004-03-02              9       6
      2004-08-03              1       0
      2004-11-02              2       2
      2005-05-03              4       4
      2005-08-02              1       0
      2005-11-08              4       3
      2006-11-07             16      12
      2007-05-08              8       5
      2007-08-07              1       0
      2007-11-06             10       8
      2009-05-05              8       7
      2010-11-02              7       6
      2011-05-03              5       4
      2011-11-08             19      18
      2012-11-06             12       8

  **Thirteen of the hundred and twelve are not printed under this county at all.** Columbus Grove's
  bonds and income tax are filed under Putnam, Waynesfield-Goshen's levies and Pandora-Gilboa's
  income tax under Putnam or Auglaize, because Allen is the smaller partner in each district.
  [verified] — the same reports, read across all eighty-eight counties. Thirty-seven of the
  hundred and twelve are multi-county in one direction or the other.

  **This corpus cannot say how Allen County voted on any question that crossed its own line.** The
  reports give one figure per question and it is the whole subdivision's; a district straddling two
  counties has one number and no split. [verified] — the reports' own convention, `* denotes most
  populous county`; see
  [a return filed under a county is not that county's vote](../../decisions/a-return-filed-under-a-county-is-not-that-countys-vote.yml).

  [open] The years on either side. The Secretary's own summary table says Allen County had nine
  issues at the May 2013 primary — one bond-and-tax combination, six tax levies of which three were
  schools', and two miscellaneous — and the detail reports for that election are not archived, so
  the corpus has the count and not the votes. Before May 2003 and after November 2012 there is
  nothing on this server at all.
properties:
  parameter: local ballot questions put to Allen County voters
  value: "112"
  unit: ballot questions
  as_of: "2003-05-06/2012-11-06"
  method: |
    Ninety category reports — tax, bond, misc, combined, school issues, income tax — for sixteen
    election days, parsed here. Two layouts: through 2004 the millage and purpose come first with
    the votes on the first line and the subdivision named after; from 2005 the subdivision comes
    first with the votes beside it. Both are handled and the boundary was found by inspection.
    [verified]

    Questions are de-duplicated on election date and vote totals, because a ballot question that
    combines a bond and a levy is printed in both category reports with identical figures; the
    Secretary's own summary tables count those as two or three issues and this node counts the
    question. [verified] Everything filed under any of the other eighty-seven counties whose
    subdivision names Allen in its parenthetical is included. [verified]

    Levy type is the word the ballot uses — renewal, replacement, additional — taken from the
    description, and is absent for five questions whose wording gives no such word. [inference]
    Passage is a simple majority of the votes reported, which is the rule the reports print at the
    head of every page; the 57-to-57 return is counted as a failure on that rule. [inference]

    Every figure here is a count of questions or a share of votes within one question. No vote
    totals are summed across questions or attributed to this county. [verified]
