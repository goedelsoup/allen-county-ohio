class: measure
label: Housing cost burden in Allen County, 2006–2022
description: |
  What housing costs the households living in it — by tenure, by income measured against the area
  median, and by the share of that income the rent or the mortgage takes. [verified] —
  [HUD's affordability tables](../../catalog/hud-chas.md), county and place files for four American
  Community Survey windows.

      2018–2022, Allen County        households    pays >30%    pays >50%
      owner-occupied                     27,495        3,905        1,445
      renter-occupied                    13,240        4,725        2,300

  **A renter in this county is two and a half times as likely as an owner to be paying more than
  thirty per cent of income for housing**, 35.7 per cent against 14.2, and more than three times as
  likely to be paying more than half, 17.4 per cent against 5.3. [verified] — the same file,
  Table 8, and the shares are computed here.

      2018–2022, by household income      renters    pays >50%     owners    pays >50%
      at or below 30% of area median        2,540        1,600      1,520          915
      30 to 50%                             2,845          650      2,525          315
      50 to 80%                             3,100           40      4,510          170
      80 to 100%                            1,565            0      3,370           30
      above the area median                 3,195           10     15,570           15

  **The burden is almost entirely at the bottom of the income scale**, and above the area median it
  is close to absent. Of the 4,060 households living on less than 30 per cent of area median income,
  2,515 pay more than half of it for housing — 61.9 per cent. Of the 23,700 households above 80 per
  cent of the area median, 680 pay more than 30 per cent of income, which is 2.9 per cent of them.
  [verified] — the same table; the two shares are computed here. Cheap housing is not the same thing
  as affordable housing, and this county's figures separate the two about as cleanly as a county's
  can.

  **The poorest renters carry it worst.** 1,600 of the county's 2,540 renter households below 30 per
  cent of area median income pay more than half of that income for shelter, which is 63.0 per cent
  of them; among owners in the same income band it is 915 of 1,520, or 60.2. [verified] — the same
  table.

  **A Black renter household is 1.7 times as likely to be paying more than half its income.** Of
  9,310 white non-Hispanic renter households 1,450 do, 15.6 per cent; of 2,435 Black non-Hispanic
  renter households 645 do, 26.5. On the 30 per cent threshold the gap is 32.5 per cent against
  43.5. [verified] — the same file, Table 9.

  **The county rate describes both of its halves, which is the opposite of what subsidy does here.**
  Lima holds 7,355 of the county's 13,240 renter households and 1,665 of its 2,540 poorest, and its
  renter burden rate is 39.2 per cent ± 5.4 against 31.3 ± 11.1 for the twelve townships and five
  villages outside it. The gap is 8.0 points on a combined margin of 12.4. [verified] — the same
  tables, county and place files, with the margins the source publishes.

  This corpus cannot say whether Lima's renters are more often cost-burdened than the rest of the
  county's. [inference] — the test is the one
  [a county rate can describe nowhere](../../decisions/a-county-rate-can-describe-nowhere.yml)
  requires before a county figure is published, and this is the first time it has been run and the
  county figure has survived it: on subsidized housing the two halves are 51 points apart, and on
  cost burden they are not separable at all.

      renters paying >30% of income      Allen    Ohio      US
      2006–2010                           44.2    43.8    45.0
      2011–2015                           45.9    43.2    45.8
      2015–2019                           40.5    39.7    43.9
      2018–2022                           35.7    39.2    44.4

  **Against the country, this county has moved and the country has not.** The county's four windows
  read 44.2, 45.9, 40.5 and 35.7 per cent and the nation's read 45.0, 45.8, 43.9 and 44.4. In the
  two earliest windows Allen County's renters were as likely to be cost-burdened as the nation's;
  in the most recent they are 8.7 points less likely, and the county's own margin on that rate is
  3.7 points. [verified] — the same table read for every county in the file; the state and national
  figures are this corpus's own sums over the 3,222 county rows, and the margin is computed from
  the file's own. The fall from 45.9 to 35.7 is 10.2 points against a combined margin of 5.2.

  **Two pandemic years are inside the newest window and they are not what moved it.** The 2015–2019
  window ends before the pandemic and already stands 5.4 points below 2011–2015; from there to
  2018–2022 the further fall of 4.8 points is inside a combined margin of 5.1. [inference] — the
  measurable movement happened in a window with no emergency income in it, which is the check
  [the intersection not the union](../../decisions/the-intersection-not-the-union.yml) asks for in
  a different form: a change is only the newest window's if the older windows do not already have
  it.

  **For a hundred of the county's poorest renter households there are eighty-one homes they could
  afford and thirty-nine they could move into.** 2,050 rental units in the county rent at or below
  what a household at 30 per cent of area median could pay — 1,945 occupied and 105 standing empty
  and for rent — against 2,540 such households; but 1,065 of the occupied ones house a household
  with a higher income, leaving 985. The ratios are 80.7 ± 6.2 and 38.8 ± 8.4 per hundred.
  [verified] — the same source, Tables 14B and 15C. The national figure computed the same way is
  31.5, which is inside this county's margin.

  **HUD's own rent for a two-bedroom here is above what the county's median renter pays.** The fair
  market rent for the Lima metropolitan area in fiscal 2025 is $1,040 for two bedrooms, $793 for
  one and $1,262 for three; the county's median gross rent across all sizes was $898. [verified] —
  [HUD's fair market rents](../../catalog/hud-fair-market-rents.md), FY2025 county file, against
  [the housing stock](allen-county-housing-stock-2023.yml).

  **A federal programme file and a federal survey do not agree about who is being helped.** HUD's
  own count of assisted households below 30 per cent of area median runs about 1,640 in this county
  over the same window, while the survey finds only 745 renter households in that band paying an
  affordable share of income. See
  [why HUD and the survey count different assisted renters](../question/why-hud-and-the-survey-count-different-assisted-renters.yml).
  [inference] Every rate on this page is a rate over a population that includes those households,
  and [a programme is invisible inside a survey](../../decisions/a-programme-is-invisible-inside-a-survey.yml)
  is the rule this corpus wrote for that.
  **The other end of it is a courthouse, and this node could not reach one.** Eviction cases are
  filed against about one renter household in fifteen in this county every year — 865 filings a
  year on average across 2002 to 2018, against 11,590 renter households at the start of that run
  and 14,412 at the end. [verified] —
  [the Eviction Lab](../../catalog/eviction-lab-county-data.md); see
  [the filings](allen-county-evictions-2001-2018.yml). The two series do not overlap cleanly — one
  ends in 2018 and the burden windows run to 2022 — and nothing here links a burdened household to
  a filed case. [inference]

properties:
  parameter: households paying more than 30 per cent of income for housing
  value: "8630"
  unit: households
  as_of: "2022"
  method: |
    HUD CHAS county files for 2006–2010, 2011–2015, 2015–2019 and 2018–2022, Ohio state code 39 and
    county code 003, plus the 2018–2022 place file for Lima. Burden counts are the sum of the five
    income bands' `greater than 30%` and `greater than 50%` cells in Table 8 — for renters the
    columns based at `T8_est69`, for owners at `T8_est3` — and the denominators are the file's own
    published tenure totals, which differ from the sum of its rounded parts by a handful of
    households. [verified] Margins are the root of the sum of squares of the file's own `moe`
    columns, and a share's margin uses the Census proportion formula. The state and national rates
    are sums over every county row in the same file. The affordability ratios add Table 14B's
    vacant-for-rent units to Table 15C's occupied ones, which is how the shortage is normally
    measured. `value` is the county's owner and renter burdened households added, 3,905 and 4,725,
    for the 2018–2022 window only.
