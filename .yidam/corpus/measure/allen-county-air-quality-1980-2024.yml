class: measure
label: What the monitors measured over Allen County, 1980–2024
description: |
  **Forty-five unbroken years of measured air quality, and four of the last six in which no day
  reached unhealthy even for sensitive groups.** [verified] —
  [EPA AirData's annual county files](../../catalog/epa-airdata-aqi.md), 1980 through 2024, the
  Allen County row of each.

      year  monitored   good  moderate  USG or worse   share   90th pct   pollutants monitored
      1980         31     31         0             0    0.0%         24   ozone
      1981        139    118        15             6    4.3%         67   ozone
      1982        289    260        16            13    4.5%         54   ozone
      1983        311    229        47            35   11.3%        105   ozone
      1984        299    256        33            10    3.3%         64   ozone
      1985        302    233        54            15    5.0%         87   ozone
      1986        272    243        26             3    1.1%         51   ozone
      1987        212    139        41            32   15.1%        112   ozone
      1988        203    143        33            27   13.3%        112   ozone
      1989        211    136        56            19    9.0%         93   ozone
      1990        208    150        40            18    8.7%        100   ozone
      1991        200    109        60            31   15.5%        119   ozone
      1992        217    160        40            17    7.8%         87   ozone, PM10
      1993        237    154        59            24   10.1%        101   ozone, PM10
      1994        238    140        59            39   16.4%        119   ozone, PM10
      1995        232    151        48            33   14.2%        112   ozone, PM10
      1996        231    148        51            32   13.9%        108   ozone, PM10
      1997        235    166        47            22    9.4%        100   ozone, PM10
      1998        237    129        67            41   17.3%        119   ozone, PM10
      1999        234    150        48            36   15.4%        119   ozone, PM10
      2000        235    183        45             7    3.0%         74   ozone, PM10
      2001        231    164        55            12    5.2%         80   ozone, PM10
      2002        232    149        48            35   15.1%        122   ozone, PM10
      2003        225    153        57            15    6.7%         90   ozone, PM10
      2004        235    185        45             5    2.1%         74   ozone, PM10
      2005        238    147        68            23    9.7%        100   ozone, PM10
      2006        240    176        55             9    3.8%         80   ozone, PM10
      2007        237    158        61            18    7.6%         97   ozone, PM10
      2008        239    196        42             1    0.4%         67   ozone, PM10
      2009        232    189        39             4    1.7%         67   ozone, PM10
      2010        365    194       159            12    3.3%         83   ozone, PM2.5, PM10
      2011        364    246       109             9    2.5%         74   ozone, PM2.5
      2012        366    239       104            23    6.3%         90   ozone, PM2.5
      2013        362    268        92             2    0.6%         61   ozone, PM2.5
      2014        362    261       100             1    0.3%         61   ozone, PM2.5
      2015        365    288        76             1    0.3%         58   ozone, PM2.5
      2016        366    297        66             3    0.8%         58   ozone, PM2.5
      2017        365    298        66             1    0.3%         57   ozone, PM2.5
      2018        356    260        91             5    1.4%         61   ozone, PM2.5
      2019        332    229       103             0    0.0%         61   ozone, PM2.5
      2020        360    289        70             1    0.3%         57   ozone, PM2.5
      2021        365    260       105             0    0.0%         61   ozone, PM2.5
      2022        365    272        93             0    0.0%         59   ozone, PM2.5
      2023        365    252       105             8    2.2%         67   ozone, PM2.5
      2024        359    275        84             0    0.0%         58   ozone, PM2.5

  **USG or worse** counts days in the four categories at or above unhealthy for sensitive groups;
  **share** is those days as a fraction of the days monitored, which is the only column in the table
  comparable across its whole length. [verified] — same file, computed here from its day columns.

  **The count of monitored days is not the year and does not stay still.** 31 days in 1980, around
  210 through the 1980s and 1990s, 365 from 2010. The step at 2010 is a fine-particle monitor
  arriving and reporting year-round where ozone is watched in season. Good days go from 189 to 194
  across that line while the denominator grows by half, which is a share falling from 81.5 per cent
  to 53.2 and no air getting worse. [verified] — same source, `Days Ozone` and `Days PM2.5`. See
  [a category has a birthday](../../decisions/a-category-has-a-birthday.yml).

  **The improvement is large and it is in the tail, not the middle.** The median day was AQI 44 in
  1987 and 42 in 2024, which is barely a change. The 90th percentile went from 112 to 58, and days
  at unhealthy for sensitive groups or worse from 32 to none. What ended was the bad day.
  [verified] — same file, `Median AQI` and `90th Percentile AQI`.

  **Nineteen ninety-eight was the worst year in the record and 41 of its days were unhealthy for
  somebody.** 17.3 per cent of the days monitored — against 15.5 per cent in 1991, 16.4 in 1994 and
  15.1 in both 1987 and 2002. No year since 2012 has passed 2.5 per cent. [verified] — same source,
  the share column above.

  **Ohio does not measure most of itself.** 37 of the state's 88 counties have a row in the 2024
  file and 46 did in 2000; this county has one in all forty-five years. [verified] — same file,
  Ohio rows counted here.

  **Against the counties that are measured, this one is unexceptional and was not always.** Its
  90th-percentile AQI ranks 27th of 37 in 2024 and 34th of 46 in 2000, counting from the worst; it
  ranked 12th of 41 in 1990 and 13th of 40 in 2019. The county left the bad end of Ohio's
  distribution and the rank moves several places on differences of two or three index points.
  [inference] — computed here from the same annual files, all Ohio rows.

  **In figures, the 90th-percentile AQI at five points in the record: 100 in 1990, 74 in 2000, 83
  in 2010, 61 in 2019 and 58 in 2024.** [verified] — read from the table above, same file.

  **Two thousand and twenty-three interrupts the floor.** Eight days at unhealthy for sensitive
  groups or worse and a maximum of 194, the highest reading since 2002, in a decade whose other
  years run at zero or one. [verified] — same source. This corpus does not know what happened that
  year; the file records the index and not the cause.

  [open] Whether the 2023 excursion is smoke carried in from outside the county. The pattern —
  isolated, late in a clean decade, high maximum — is consistent with it, and nothing in this file
  or any other this corpus holds names a source for those eight days.
properties:
  parameter: days at unhealthy for sensitive groups or worse, as a share of days monitored
  value: "0"
  unit: days
  as_of: "2024"
  method: |
    The EPA AirData annual AQI-by-county file for each year 1980–2024, unzipped, filtered to the
    row where `State` is Ohio and `County` is Allen. Shares are computed against `Days with AQI`
    rather than against 365. The six severity columns sum to `Days with AQI` in all forty-five
    rows and so do the per-pollutant columns, which is how the partition was confirmed. Ranks are
    over Ohio rows present in that year's file and are ranks among the monitored. [verified]
