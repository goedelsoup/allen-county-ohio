  parameter: share of Allen County whose land cover class never changed
  value: "88.62"
  unit: per cent of 260,382 acres, 1985 through 2023
  as_of: "2023"
  method: |
    Both summaries are fetched from the coverage service in EPSG:5070 on the county's envelope and
    clipped by rasterising the 2020 TIGERweb county polygon onto the coverage's own grid, which
    burns 1,170,809 pixels — 260,381.9 acres, the Census Bureau's own land-plus-water figure for
    this county to the acre. [verified] Acreage is 900 square metres a pixel. [verified] The change
    index and the change count are different rasters and the shares above do not have to agree with
    the count's 88.62 to the hundredth: the index resolves each pixel to one dominant category and
    the count to a number of transitions. [verified] Class labels come from the map service's own
    style endpoint, because these products have no legend page. [verified]
