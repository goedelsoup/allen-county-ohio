class: measure
label: Allen County in the Ohio General Assembly, 1833–1906
description: |
  The county's two legislative rosters as the 1906 history prints them — seventy names, in order,
  and not one date. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), "Members of the
  General Assembly".

  **Thirty-five representatives and thirty-five senate entries, and the senate list is a list of
  terms rather than of men.** John E. Hunt, Thomas J. Godfrey and Robert Mehaffey each appear twice
  with another name between, so the thirty-five senate entries are thirty-two people; the
  thirty-five representatives are all distinct. [verified] — same source, counted entry by entry.

  **Charles C. Marshall is the only name that appears in both chambers.** [verified] — the two lists
  compared, name by name.

  **Neither list carries a year, and the book's own datings show they cannot be read as one name per
  assembly.** The House list "begins with the 36th General Assembly which began its session on
  December 4, 1837"; the Senate list from "the 32nd General Assembly which began its session on
  December 2, 1833". The same book cites the Ohio Hundred Year Book as published "in 1901 by the
  authority of the 74th General Assembly", and was printed in 1906. [verified] — same source, three
  passages. So thirty-five representatives cover at least thirty-nine assemblies and thirty-five
  senate entries at least forty-three, and nothing in either list says which name goes with which
  year. [inference] — arithmetic on the book's own numbers.

  **What that costs is not hypothetical.** This corpus already holds "the Boesel railroad bill",
  passed by the Legislature in April 1872, which put $100,000 of bonds to a vote in Lima and Ottawa
  Township and carried with eight votes against. A Charles Boesel stands sixteenth in this senate
  roster. The corpus cannot say they are the same man, because the list that would say so has no
  years in it. [inference] — see
  [the county's railroads](allen-county-railroads-1883-1921.yml) and
  [an order is not a chronology](../../decisions/an-order-is-not-a-chronology.yml).

  **The county's seat in the upper house has never been its own.** From the 50th General Assembly,
  seated 5 January 1852, the book names the district the 32nd Senatorial District and gives its
  counties as Allen, Mercer, Auglaize, Van Wert, Paulding, Defiance and Williams — seven of them —
  and it ends with two sitting senators, Thomas M. Berry and W. M. Denman. [verified] — same source.
  That is the same shape [the present seat](../office/member-of-the-ohio-senate-for-district-12.yml)
  has and could not name its partners in either.

  **Two of the seventy names are held elsewhere in this corpus and neither list says so.** Isaiah
  Pillars, twenty-fifth in the House roster, is the man the corpus already holds as commandant of
  [Camp Lima](../site/camp-lima.yml) in 1861; the 1921 history says he "represented Allen County in
  the Ohio Assembly and ... was attorney-general of Ohio". [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [Isaiah Pillars](../person/isaiah-pillars.yml). Alfred P. Edgerton, sixth in the Senate roster, is
  the Defiance County congressman the same book's next list gives for 1851–52. [verified] — the 1906
  history, both lists; see [the county in Congress](allen-county-in-congress-1831-1933.yml).

  **The county waited for both seats.** It was organized in 1831; the Senate list opens in 1833 and
  the House list in 1837. [verified] — the book's two datings against
  [the county](../place/allen-county.yml). The book does not say whether the county had no member
  before those years or whether the compiler simply began there. [open]

  [open] Which years any of these seventy served. This is the corpus's largest block of named people
  with no date attached to any of them, and no second source held here carries an Ohio legislative
  roster at all.
properties:
  parameter: names in the county's two General Assembly rosters
  value: "70"
  unit: entries
  as_of: "1906"
  method: |
    Both lists transcribed by hand from the full text on archive.org. They are printed as running
    prose separated by commas, not as tables, and the scan has damage in the names — "Cr.ites" for
    Crites, "William Ruler" where a Rusler may be meant — so the entries are given as printed and no
    spelling is corrected against anything. The count of 70 is entries, not persons: three senate
    names occur twice and one name occurs in both chambers, so the seventy entries are sixty-six
    people. The assembly counts are inclusive of both endpoints and are floors, since the book
    postdates the 74th. [verified]
