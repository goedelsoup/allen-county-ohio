class: measure
label: Allen County's Jewish community, 1850–1921
description: |
  Seventy years of a community that never lived anywhere in this county but its county seat.
  [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), the section
  it heads "The Jew in Allen County".

  **"Levi Jacobs was the first Jew to take up his residence in Lima. It was about 1850, the Jacobs
  clothing store was opened, and the Jews have never located in any other town in Allen County."**
  [verified] — same source. It is the only statement in this corpus of where any of the county's
  communities did and did not settle, made as a flat negative about eight municipalities.

  **A dozen families in 1878 and about a hundred in 1921.** "Nathan L. Michael, who has been
  identified with the Lima business community since 1878, relates that the Jewish colony when he
  came comprised about one dozen families. There are now perhaps 100 families." [verified] — same
  source, which puts the population at "perhaps 350 Jews in all" and adds that they are "less than
  1 per cent of the citizenship of Lima" against "about 2 per cent of the population of the United
  States". [verified] — same source.

  **Against Lima's 41,326 in 1920, 350 people is 0.8 per cent, and the book's own comparison holds.**
  [inference] — computed against [the 1880–1920 series](lima-population-1880-1920.yml).

  **Both branches were here.** "There are both Reformed and Orthodox Jews in the community."
  [verified] — same source. Its synagogue,
  [Temple Beth Israel](../organization/temple-beth-israel.yml), had been built seven years before
  the book was printed.

  **Three families are named and two of them married.** Levi Jacobs, in clothing; Joseph Simon, in
  the hotel business; and Joseph Goldsmith, "who later married his daughter" and who "still owns the
  Lima House although a non-resident today". [verified] — same source.

  **The book's point about counting is a methodological one and it is right.** "Because the Jews are
  in business, the average citizen is greatly mistaken in estimating the Jewish population. They
  always seem more numerous than they are." [verified] — same source. A population visible on a main
  street is over-counted by everyone who walks down it, which is the same error in the opposite
  direction from a population that appears in no file at all. [inference]

  [open] Whether any of this is checkable. No census this corpus holds counts religion, the 2020
  religion census reports no Jewish body in this county, and the corpus has one dated fact about the
  synagogue and no membership figure for it in any year. See
  [the congregations of 2020](allen-county-congregations-2020.yml).
properties:
  parameter: Jewish residents of Lima, as estimated
  value: "350"
  unit: people
  as_of: "1921"
  method: |
    Read from the full text of the 1921 county history on archive.org. Every figure is the book's
    and every one is hedged in the book — "perhaps", "about", "less than". The share of Lima is
    computed against the census count the corpus already holds and not against any figure in the
    book. [verified]
