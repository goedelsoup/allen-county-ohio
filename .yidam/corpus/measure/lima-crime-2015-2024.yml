class: measure
label: Crime reported in Lima, 2015–2024
description: |
  **Lima's violent crime rate has been between two and three times Ohio's in every one of ten
  years.** [verified] —
  [the FBI Crime Data Explorer](../../catalog/fbi-crime-data-explorer.md), Lima Police Department.

      year  violent  rate/100k   Ohio    US    property  rate/100k   cleared
      2015      269      705.1  296.3  384.6      2,164     5,671.8    24.2%
      2018      240      649.5  314.1  384.8      1,683     4,555.1    15.8%
      2021      249      687.2  340.8  361.2      1,202     3,317.4    20.9%
      2024      266      769.9  311.9  363.6      1,182     3,420.9    30.5%

  The agency rates are computed here from counts and the agency's own population; the Ohio and
  United States rates are the file's, being the sum of its twelve monthly values. [verified] — same
  source.

  **Violent crime here has no trend and property crime fell by forty per cent.** The violent count
  averaged 280 a year over 2015–2019 and 265 over 2020–2024; the property rate went from 5,672 per
  hundred thousand to 3,421, a fall of 39.7 per cent. [verified] — same source, computed here. The
  two measures move independently, which is worth stating because they are usually reported as one
  number. [inference]

  **The clearance rate more than doubled.** 14.6 per cent of violent offenses cleared in 2016 and
  12.3 per cent in 2020, against 30.5 per cent in each of 2023 and 2024. [verified] — same source.
  Whether that is better police work, fewer and different offenses, or the incident-based reporting
  the department adopted in January 2021 counting differently, this source cannot say. [inference] —
  see [the agencies](allen-county-law-enforcement-agencies-2026.yml).

  **The ratio to Ohio is the stable thing.** 2.38, 2.97, 2.36, 2.07, 2.23, 2.05, 2.02, 2.72, 2.27,
  2.47 — no year outside 2.0 to 3.0, across a decade in which Ohio's own rate rose and fell.
  [verified] — same source, computed here. A city whose absolute rate wanders and whose ratio to
  its state does not is being moved by whatever moves the state. [inference]

  [open] What the rate is for the rest of the county. Eight of the ten agencies were not fetched,
  and the two that were cover 58 per cent of the population.
properties:
  parameter: violent crime rate, Lima Police Department jurisdiction
  value: "769.9"
  unit: offenses per 100,000 people
  as_of: "2024"
  method: |
    Monthly offense and clearance counts summed to calendar years and divided by the agency's own
    population as the file gives it for June of each year. That population is not the census's — the
    file puts Lima at 36,452 in 2020 against a census count of 35,579 — so this rate is comparable
    with the Ohio and United States rates in the same file and not with anything computed from a
    census denominator. [verified] The department began incident-based reporting on 1 January 2021,
    so the years before and after that line are not strictly one series. [inference]
