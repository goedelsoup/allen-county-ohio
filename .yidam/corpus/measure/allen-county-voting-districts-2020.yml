class: measure
label: Allen County voting districts, 2020
description: |
  The 88 voting districts into which Allen County's 3,552 census blocks are divided in the 2020
  geography, named. [verified] —
  [2020 Census Block Assignment Files](../../catalog/census-block-assignment-2020.md) for the
  assignment and [TIGERweb](../../catalog/tigerweb-census2020.md), layer 58, for the names,
  populations, housing units and areas.

  **This node twice said the names were unreachable without the Secretary of State.** They were in
  a layer of a service the corpus was already querying, and the returns are transcribed on GitHub.

  **The precinct grid nests inside the civil geography exactly.** Not one of the 88 crosses a
  county-subdivision line. [verified] — the assignment files crossed with TIGERweb block
  geography, block by block — the sharp contrast with
  [the school districts](../jurisdiction/), which cross county and township lines freely.
  [Lima](../place/lima.yml) holds 23 and
  [Sugar Creek Township](../place/sugar-creek-township.yml) holds
  [one](../division/voting-district-sugar-creek-2020.yml); their populations sum to 102,206, which
  is [the county's own enumeration](allen-county-population-2020-census.yml).

  **A second, unrelated pipeline confirms the names.** The 88 the county board of elections used
  on its certified returns are identical, string for string, to the 88 the Census Bureau
  publishes. [verified] — [OpenElections](../../catalog/openelections-ohio.md) against TIGERweb.
  That joins [turnout](allen-county-turnout-2020.yml) and
  [the vote](allen-county-presidential-vote-2020.yml) to census geography with no crosswalk, and
  those show the 88 are far from interchangeable.
properties:
  parameter: voting districts
  value: "88"
  unit: districts
  as_of: "2020"
  method: |
    Distinct values in the VTD assignment file over the 3,552 blocks whose GEOID begins 39003,
    cross-checked against the 88 features TIGERweb returns for the county. [verified]
