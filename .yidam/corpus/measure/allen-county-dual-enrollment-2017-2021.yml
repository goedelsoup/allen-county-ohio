class: measure
label: College Credit Plus in Allen County, 2017 and 2021
description: |
  **Four hundred and ninety-two of Allen County's high-school pupils sat a college course in
  2021–22, against a hundred and thirty-two in an Advanced Placement one.** [verified] —
  [the Civil Rights Data Collection](../../catalog/crdc-civil-rights-data-collection.md), its 2021
  dual-enrolment and Advanced Placement files for the county's ten high schools. That is 10.2 per
  cent of the roll where Ohio's high schools run 9.6, and it is the one advanced route on which this
  county is ahead of the state.

  **The two routes are not paid for by the same person.** Chapter 3365 of the Revised Code makes the
  pupil's own school pay for the textbooks and requires the college to waive every other fee, so a
  family pays nothing; the Advanced Placement credit is granted by an examination with a fee.
  [verified] — [the Revised Code](../../catalog/ohio-revised-code.md), section 3365.07. Which of the
  two a district offers is therefore also a question about who is asked for money. [inference]

      2021-22                       enrolment   College Credit Plus   share   AP
      Spencerville High School            252                   121   48.0%   —
      Allen East High School              326                    93   28.5%   —
      Apollo Career Center                834                    74    8.9%   —
      Bluffton High School                358                    32    8.9%   —
      Elida High School                   591                    51    8.6%   37
      Shawnee High School                 660                    51    7.7%   95
      Perry High School                   289                    22    7.6%   —
      Lima Senior High School             984                    48    4.9%   —
      Bath High School                    448                     0    0.0%   —
      West Central Learning Academy        94              no offer       —   —
      Allen County                      4,836                   492   10.2%  132

  **Nearly half of Spencerville High School is enrolled in a college course.** 121 of its 252 pupils,
  the highest share of any high school in this county and nearly ten times the share at Lima
  Senior. [verified] — the same file. Allen East follows at 28.5 per cent; the other seven that
  offer it run between 4.9 and 8.9.

  **The county's largest high school uses it least.** Lima Senior enrols 48 of 984, and it is the
  one school here that offers neither this nor Advanced Placement at any scale: 4.9 per cent of its
  pupils are in a college course and none is in an AP one. [verified] — the same source, its 2021
  offerings and enrolment files.

  **Where the county grew, it grew unevenly.** The county total moved from 458 in 2017 to 492 in
  2021, a rise of 7.4 per cent, and inside it Elida went from 5 to 51 and Shawnee from 18 to 51
  while Bath went from 199 to 0. [verified] — the same source, its 2017 and 2021 files. Bath's row
  says the school offers the programme and enrols nobody in it, which is a zero the file is
  asserting rather than a gap; see [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml).

  **White pupils here are three and a half times as likely to be in it as Black pupils.** 432 of the
  county's 3,469 white high-school pupils are enrolled, 12.5 per cent, against 25 of 713 Black
  pupils, 3.5 per cent. [verified] — the same source, by race. Inside Lima Senior alone the two rates
  are 9.6 and 1.9 on 343 and 424 pupils, so the gap is not only a question of which school a child
  attends. [verified] — the same file, that school's rows.

  **This is the county's substitute for Advanced Placement and it does not reach the same children.**
  The county is ahead of Ohio on College Credit Plus and at a quarter of Ohio on AP, and both of its
  advanced routes are taken by white pupils at three to eight times the Black rate. [inference] —
  computed from the two files above; see
  [the coursework](allen-county-advanced-coursework-2021.yml).

  **A pupil enrolled is not a pupil who earned the credit.** [inference] The collection counts
  enrolment on one date and carries no completion, no grade and no transcript, and a college course
  taken in the eleventh grade may be failed, withdrawn from or not transferred.

  **This node does not assert that College Credit Plus is the better of the two routes.** One grants
  actual college credit at public expense and the other grants it on an examination score that a
  receiving institution may or may not accept, and nothing in these files compares what a pupil ends
  up holding.

  [open] How many of the county's College Credit Plus pupils sat their courses on a campus —
  [Rhodes State College](../organization/james-a-rhodes-state-college.yml) stands in Lima — and how
  many sat them in their own school building, taught by their own teacher under a
  college's name. The Revised Code provides for both and prices them differently, and the federal
  file distinguishes neither.

properties:
  parameter: high-school pupils enrolled in a dual-enrolment college course
  value: "492"
  unit: of 4,836 high-school pupils, Allen County, 2021–22
  as_of: "2021"
  method: |
    Rates divide by the collection's own enrolment, not the district files'. [verified] The ten
    schools are the buildings in Allen County with a twelfth grade and a positive enrolment, matched
    by the school identifier rather than the district's. [verified] West Central Learning Academy is
    excluded from the county rate's numerator and denominator because it reports that it offers no
    dual enrolment, which the file records as a reserved code rather than as a zero; Bath is
    included, because its row says it offers the programme and enrols none. [verified] The 2017
    figure omits Apollo Career Center and Perry, whose 2017 rows carry a reserved code, so the
    458-to-492 comparison is between two totals over slightly different sets of schools and is not
    a like-for-like change. [verified]
