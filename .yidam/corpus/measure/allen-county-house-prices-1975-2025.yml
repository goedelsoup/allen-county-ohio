class: measure
label: House prices in Allen County, 1975–2025
description: |
  Fifty-one unbroken years of what a house in this county is worth relative to what it was worth.
  [verified] — [the FHFA House Price Index](../../catalog/fhfa-house-price-index.md), annual
  county file, 1975 through 2025.

      year   index   in 1975 dollars        year   index   in 1975 dollars
      1975   100.00      100.0              2005   292.50       80.6
      1979   139.59      103.4              2006   294.66       78.6
      1982   128.37       71.6              2013   266.33       61.5
      1986   150.06       73.7              2014   267.39       60.8
      2000   249.38       77.9              2020   335.49       69.7
      2001   260.44       79.1              2024   474.98       81.5
      2003   267.99       78.4              2025   511.78       85.5

  **Nominally a house here is worth 5.12 times its 1975 level and the price level is 5.98 times
  its 1975 level, so in real terms it is worth 14.5 per cent less than it was fifty years ago.**
  The index reads 511.78 against 100 and the consumer price index 321.943 against 53.8.
  [verified] — the same source and [the CPI](../../catalog/bls-cpi.md), deflated here as
  [a deflator is a choice](../../decisions/a-deflator-is-a-choice.yml) requires.

  **The peak was 1979.** In 1975 dollars the index reaches 103.4 that year and has never been
  there since. It fell 30.8 per cent in the three years to 1982, to 71.6, and the forty-three
  years after that are a long trough and a recent climb that has reached 85.5 — still 17.3 per
  cent below the 1979 reading. [verified] — the same file, deflated as above. Nothing in this
  series is a recovery to a previous level, because there has not been one.

  **The floor is 2014, not 2011.** The real index falls in 20 of the 35 years from 1980, bottoms at
  60.8 in 2014 — 41.3 per cent below the 1979 peak — and has risen in all 11 years since. Nominally the fall is far smaller and later: 294.66 in 2006 to 266.33 in 2013, 9.6 per
  cent. [verified] — the same file. Read in dollars this county barely had a housing bust; read in
  what those dollars bought, it had a thirty-five-year one.

  **The nation's houses gained what this county's lost.** On the same estimator and the same base
  year, the United States index stands at 191.1 in 1975 dollars in 2025 against Allen County's
  85.5 — a ratio of 2.23. The country's houses are worth 91.1 per cent more in real terms than in
  1975 and this county's are worth 14.5 per cent less. [verified] — the same source, its national
  quarterly series, averaged over its four quarters and deflated here.

  **Forty-four counties in America are worth less in real terms than in 1975, and eight of them
  are in Ohio.** 419 counties have an index in both 1975 and 2025; their median stands at 146.6 in
  1975 dollars, Allen County ranks 15th from the bottom of them at 85.5, and no state contributes
  more of the 44 than Ohio. Within Ohio's 29 measured counties only Marion at 69.6 and Lucas at
  75.1 are lower. [verified] — the same file, ranked here. A county entering the file later
  is not in this comparison at all, so the denominator is stated: 419 of 2,795. [inference]

  **The three years the price collapsed are the three years the factories emptied.** Manufacturing
  employment in this county was 18,389 in 1979 and 14,349 in 1982 — 4,040 jobs, 22.0 per cent —
  and the real index fell 30.8 per cent across the same three years. [verified] —
  [the employment series](allen-county-manufacturing-employment-1969-2022.yml) and
  [the index](../../catalog/fhfa-house-price-index.md) above.

  **Then the jobs came back and the prices did not.** Manufacturing recovered to 17,163 by 1986,
  19.6 per cent above its 1982 floor, while the real index moved from 71.6 to 73.7 — 2.9 per cent.
  Over the twenty-three years after that manufacturing lost 55 per cent of what was left and the
  real index moved 2.5 per cent, downward. [inference] — computed here from the same two series.
  The market repriced once, at the first shock, and the larger losses that followed moved it
  hardly at all.

  **The recent climb is the fastest in the file and it is a climb from the floor.** The index rose
  52.5 per cent between 2020 and 2025, more in those five years than in the twenty to 2020, which
  gave it 34.5 per cent — and it arrives 14.5 per cent below where it started in 1975. [verified] — the same source, computed
  here. [inference]

  **What that is in dollars, from somewhere else.** A typical Allen County home was worth $83,202
  in January 2000 and $194,196 in July 2026. [verified] —
  [the Zillow index](../../catalog/zillow-home-value-index.md), which models a level and not a
  change. Its December 2023 reading of $168,156 sits 6.2 per cent above the American Community
  Survey's owner-reported median of $158,400 for the same year. [verified] — the same file and
  [the survey](../../catalog/census-acs-summary-file.md); see
  [the housing stock](allen-county-housing-stock-2023.yml).

  **The tax base trails the market, and the gap is large enough to matter to a levy.**
  Residential assessed valuation in the county's audited reports rose 33.7 per cent between the
  2014 and 2023 reports, from $1,149.3 million to $1,537.1 million. Those reports rest on January
  values of 2013 and 2022, across which the index rose 59.6 per cent. [inference] — computed here
  from [the audited reports](allen-county-assessed-valuation-2010-2023.yml) and the index above.
  The base moves in steps at reappraisal and includes new houses the index excludes, so it should
  outrun the market and instead runs at half its pace.

  **This corpus cannot say what a house in Allen County sold for in 1975.** The federal series is
  a ratio with no dollars in it, the modelled dollar series begins in 2000, and the earliest
  owner-reported median this corpus holds is a census figure two generations later. A ratio and a
  level are different measurements and no arithmetic here converts one into the other.

  [open] Whether the middle of the distribution moved with its ends. Every figure above is one
  number for a whole county in a year, and this county has a $114,300 gap between the median value
  in Shawnee Township and the median value in Lima. The index has a tract file and it does not
  reach the poorest seven tracts; see
  [the tract series](allen-county-house-prices-by-tract-1986-2025.yml).
properties:
  parameter: house price index, all transactions, and its value in 1975 dollars
  value: "511.78"
  unit: index, 1975 = 100 for this county
  as_of: "2025"
  method: |
    The annual county file, read for FIPS 39003, using the first-recorded-base column so that 1975
    is 100. [verified] Real values divide the index by the ratio of the national CPI-U annual
    average for the year to its 1975 average of 53.8, and are labelled *in 1975 dollars* rather
    than as any statement about what a house costs. [verified] The national line is the agency's
    quarterly all-transactions series for the United States, averaged over four quarters, deflated
    the same way, and read at 2025, the last year with four quarters in it. [verified] The
    national and Ohio rankings use only the 419 counties with an index in both endpoint years, and
    the count of counties below their 1975 level is over that same 419. [verified]
