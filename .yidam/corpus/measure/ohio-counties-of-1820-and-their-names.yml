class: measure
label: The Ohio counties of 1820 and the names Howe gives them
description: |
  The fourteen counties the act of 12 February 1820 laid out of the cession, set beside what the
  earliest general account of Ohio's counties says each was named from. [verified] —
  [Howe's Historical Collections of Ohio, 1847](../../catalog/howe-historical-collections-of-ohio.md),
  the formation sentence of each county's entry.

      county       Howe 1847 gives the name as
      Hancock      John Hancock, first president of the revolutionary congress
      Henry        Patrick Henry, the celebrated Virginian orator in the revolutionary era
      Marion       Gen. Francis Marion, of South Carolina, a partisan officer of the revolution
      Mercer       Gen. Hugh Mercer, a Virginia officer who fell at Princeton, Jan. 3d, 1777
      Paulding     John Paulding, of Peekskill, one of the three militia men who captured Major Andre
      Putnam       Gen. Israel Putnam, born at Salem, Mass., 1718, died at Brooklyn, Conn., 1790
      Van Wert     Isaac Van Wart, one of the three captors of Maj. Andre, died 1828, aged 68
      Williams     David Williams, of Tarrytown, one of the three captors of Maj. Andre
      Seneca       the tribe who had a reservation within its limits
      -----------------------------------------------------------------------------------------
      Allen        "a colonel of that name in the war of 1812"
      Wood         "the brave and chivalrous Col. Wood, a distinguished officer of engineers
                    in the war of 1812"
      -----------------------------------------------------------------------------------------
      Crawford     no namesake given
      Hardin       no namesake given
      Sandusky     no namesake given

  [verified] — same source, entry by entry.

  **Eleven of the fourteen carry an attribution and three carry none.** Ten of the eleven are to a
  person and one is to a tribe. [verified] — same source, counted. [inference]

  **Eight of the ten persons Howe names in full, and two he identifies by rank and war alone.**
  The two are Allen and Wood, and the description he gives each is the same: an officer of the war
  of 1812. [verified] —
  [Howe, 1847](../../catalog/howe-historical-collections-of-ohio.md). Every man he names in full
  belongs to the Revolution. [inference] — read off the table above.

  **In figures: 14 counties, 11 attributions, 8 named in full and 2 given only a rank and a war.**
  [verified] —
  [Howe's Historical Collections of Ohio, 1847](../../catalog/howe-historical-collections-of-ohio.md).

  **The gap did not close in forty years.** The revised edition Howe finished in the 1880s
  rewrites the sentence and keeps the same hole: "Allen County was formed April 1, 1820, from
  Indian Territory, and named in honor of a Col. Allen, of the war of 1812." [verified] —
  [the revised edition](../../catalog/howe-historical-collections-of-ohio.md), Volume I. In the
  same volume Crawford, which the 1847 edition left blank, gains a full paragraph: "This county
  derived its name from Col. William Crawford, who was born in Virginia in 1732, the same year
  with Washington." [verified] — same volume. The book learned a name it had lacked and did not
  learn this one. [inference]

  **Three of the fourteen commemorate one event.** Paulding, Van Wert and Williams are the three
  militiamen who took Major André in 1780, given a county each and adjoining ground in the
  north-west of the state. [verified] —
  [Howe, 1847](../../catalog/howe-historical-collections-of-ohio.md). Whoever drew this list was
  working from a settled stock of patriotic names rather than from local association: none of the
  eleven had any connection to the ground being divided. [inference] — see
  [the shape of a list is evidence](../../decisions/the-shape-of-a-list-is-evidence.yml).

  [open] The act's own text. The fourteen names above are Howe's list of counties formed on
  1 April 1820; the statute that named them has not been retrieved, and neither have the House and
  Senate journals of the session that passed it.
properties:
  parameter: counties erected from the cession by the act of 12 February 1820
  value: "14"
  unit: counties
  as_of: "1820"
  method: |
    Read from the whitespace-normalised full text of both Howe editions on archive.org, entry by
    entry rather than by search, because the formation sentence is the only place an attribution
    appears and a keyword search for "named in honor" returns two of the eleven. The 1847 edition
    gives "formed ... April 1st, 1820" for thirteen of the fourteen and gives Marion only an
    organization date of 1824; the fourteenth name is taken from
    [the 1921 county history](../../catalog/rusler-allen-county-1921.md), which lists the group the
    act provided for and includes Union, a county erected by a different act five weeks earlier.
    The discrepancy is reported rather than resolved. [verified]
