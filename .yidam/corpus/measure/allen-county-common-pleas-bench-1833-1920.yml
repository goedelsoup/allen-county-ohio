class: measure
label: The Allen County common pleas bench, 1833–1920
description: |
  Thirty-four named judges from 1831 to 1920, three redrawings of the district they sat in, and a term
  boundary the county's bench still turns on. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), "Common Pleas Judges",
  and [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The first court sat in a cabin.** "George B. Holt, of Montgomery County, held the first court of
  Common Pleas for Allen County in James S. Daniels' cabin at the east end of Market street in May,
  1833" — two years after the county was organized — assisted by associate judges Watt, Crazier and
  Wood, whom the Ohio Hundred Year Book records as elected in 1831. [verified] — the 1906 history,
  quoting the Hundred Year Book "published in 1901 by the authority of the 74th General Assembly of
  Ohio". See [the county](../place/allen-county.yml).

  **The associate judges have a line of their own and the 1921 book prints it.** "Christopher Wood,
  James Crozier and William Watt; their term of service beginning in 1831, with the organization of
  the county; they served until 1837; Charles Levering, Joseph Hover and John Jamieson till 1841;
  John Elliott and George B. Shriner until 1845; Charles W. Adgate and John B. Fay until 1851, when
  under the new constitution there was a change in arrangements." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). Ten men in
  twenty years, and the last two groups name only two apiece where the bench held three — so either
  a man carried over or the list is short. [open] See
  [Christopher Wood](../person/christopher-wood.yml), who located the county seat before he sat on
  its bench.

  **For its first forty-eight years the county's bench belonged to other counties.** Holt of
  Montgomery, then William L. Helfenstein of Montgomery elected 1836, Emory D. Potter of Lucas 1839,
  Myron H. Tilden of Lucas 1844, Patrick G. Goode of Shelby 1845. "Charles M. Hughes was the first
  judge born in Allen County", and he took the bench in February 1879. [verified] — the 1906 history
  for the succession, the 1921 history for Hughes.

  **Two of those five outsiders are on the county's congressional list as well.** Potter of Lucas
  County sat for the Fifth District in 1843–44 and again in 1849–50; Goode of Shelby County for the
  Third in 1837–42, three years before he was elected to this bench. [verified] — the 1906 history,
  its two lists; see [the county in Congress](allen-county-in-congress-1831-1933.yml).

  **The district was redrawn three times and never twice the same.** In 1851 it became District
  No. 3, Sub-Division No. 1 — Allen, Hardin, Shelby, Auglaize, Marion, Union and Logan. In 1858 it
  was reorganized as Allen, Auglaize, Mercer, Van Wert and Putnam. In 1879 Shelby was added and
  Putnam dropped, "and so it remains today". [verified] — the 1906 history. Seven counties, then
  five, then five others.

  **The book presents two benches as one sequence and its own dates give it away.** It runs Benjamin
  F. Metcalf February 1852 to February 1857, William Lawrence of Logan February 1857 to October
  1864, Jacob S. Conklin of Shelby to February 1872 — and then, after the paragraph on the 1858
  reorganization, Metcalf again from November 1858 until his death in March 1865. Six years of
  Lawrence and Conklin overlap six years of Metcalf. [verified] — the 1906 history, the two passages
  compared. The 1858 reorganization made a second seat and the book never says so. [inference]

  **The 1921 book resolves it in one sentence and misspells him doing it.** Metcalf "was elected in
  1851, and was serving his third term in 1865, when death overtook him" — one career, three terms,
  across a reorganization that moved him from one bench to another. [verified] — the 1921 history,
  which calls him Benjamin T. Metcalf there and B. F. Metcalf three pages earlier. The 1906 book has
  Benjamin F.

  **Four Allen County men held it before 1906 and the book names their counties for everyone but
  three.** O. W. Rose of Lima for eight months in 1865, then Hughes 1879–1889, John E. Richie
  1889–1899 and W. H. Cunningham from 1899. Metcalf, James Mackenzie and Hugh T. Mathers are given
  no county at all; the 1921 book puts the first two at the Allen County bar. [verified] — both
  histories.

  **The bench's odd term dates are at least a hundred and eighteen years old.** In 1906 the three
  sitting judges' terms expired on the second Monday in January 1909, on 8 February 1909 and on
  8 February 1910, and Mathers had filled Mooney's unexpired term "until February 9, 1905".
  [verified] — the 1906 history. One of the county's two general-division seats runs today from
  9 February 2023 to 8 February 2029, and the other from 1 January. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md). The
  same two calendar dates, and a January seat beside a February one, in both years. [inference] —
  the two sources compared; see
  [the general division](../office/judge-of-the-common-pleas-general-division.yml).

  **The line continues past 1906 and the prosecutor's office is where two of them came from.**
  Cunningham died in November 1906; Governor Harris appointed George H. Quail to the vacancy until
  1908, when M. L. Becker was elected to finish the term. William Klinger "started in official life
  as prosecuting attorney of Allen County, serving two terms from 1899 to 1905", was elected to the
  bench in 1908 and re-elected, "thus serving Allen County twelve years". Fred C. Becker, elected in
  1920, was M. L. Becker's son and had come from the probate bench. [verified] — the 1921 history;
  see [the prosecuting attorney](../office/allen-county-prosecuting-attorney.yml).

  [open] Why W. T. Mooney's resignation in February 1901 was followed by an appointment lasting
  "until the next election, in November, 1903". The book prints both and two and a half years is not
  one election cycle.
properties:
  parameter: named holders of the common pleas bench serving Allen County, 1831–1920
  value: "34"
  unit: persons
  as_of: "1920"
  method: |
    Transcribed by hand from the full text of both histories on archive.org. The count of 34 is the
    ten associate judges the 1921 book names between 1831 and 1851, the twenty presidents and judges
    the 1906 book names in sequence, and the four the 1921 book adds after 1906; Metcalf is counted
    once although the 1906 book gives him two spans. The three associate judges of 1831 are counted
    in the ten, not twice. It is a count of persons named as sitting, not of terms, and it is not a count of
    Allen County's own judges: for most of this period the seat was a multi-county one and the books
    name the holder's home county where they know it. Dates are given as printed, including the
    scan's "1S80" for James H. Day's start, which is reported here as 1880 and flagged nowhere else
    because the surrounding sentence dates his resignation to 1892. [verified]
