class: measure
label: Every village and township seat in the county, and how the person in it arrived
description: |
  **The county's hundred village and township seats reconcile exactly against the two elections
  that filled them, and the join leaves one person over.** Of the 52 village seats, 22 are held by
  someone who won them at an election, 25 by an appointee and 5 by nobody. Of the 48 township
  seats, 47 are held by an election winner and one by an appointee. **Nowhere in either set does an
  appointee sit in a seat that somebody won.** [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md), all eighty-eight
  precinct pages re-read on 9 September 2026, joined name by name to
  [the official canvasses](../../catalog/allen-county-ballot-display.md) of 7 November 2023 and
  4 November 2025.

  **The person left over is James G. Pinks.** He was the only candidate for two Harrod council seats
  in November 2023 and took 103 votes — every vote cast in that contest — for a term running to 31
  December 2027. He appears on no page of the roster. One of Harrod's two council seats of that term
  is held by an appointee and one is vacant; the roster does not distinguish seats within an office,
  so it cannot say the vacant one is his. [verified] — both sources. Why he does not sit is in
  neither. [open]

  **A second winner also left, and the township form put his seat back on a ballot.** Josh Luke won
  Bath Township's fiscal officership in 2023 with 2,362 votes and does not sit; Berlin Carroll won
  the unexpired remainder in November 2025 with 1,188. [verified] — both sources. **That difference
  is statutory and it is the mechanism the villages question was missing.** A village council fills
  its own vacancy *"for the unexpired term"*, and the statute stops there; a township appointee
  serves *"for the unexpired term or until a successor is elected"*, and a successor is chosen at the
  next general election unless the term ends within a year of it. [verified] —
  [ORC 731.43 and 503.24](../../catalog/ohio-revised-code.md). So an unfilled township seat is
  offered to the voters again in two years and an unfilled village seat is not offered again for
  four. **The 2025 ballot carried five unexpired-term contests and every one of them was a
  township's.** [verified] — the canvass.

  **And the second offer works.** Two township seats drew nobody in 2023 and were filled at the next
  election: Monroe's trustee seat, which nobody would stand for, was contested in 2025 by two people
  and won by Jon E. Basinger 172 to 152; Perry's fiscal officership went to Christina Stombaugh on
  443. [verified] — the canvass. The one township seat that drew nobody twice, Auglaize's trustee
  seat, is the county's only appointed township officer. **One seat in forty-eight, against
  twenty-five in fifty-two.**

  **`Commences: n/a` is not the data defect this corpus recorded it as.** Four township holders carry
  it, and they are exactly the four who won an unexpired term in 2025 — Brad J. Core, Berlin Carroll,
  Jon E. Basinger, Christina Stombaugh — with no fifth of either kind. [verified] — the roster and
  the canvass, both directions. The field means the seat's term began before its holder did, and the
  roster has no column for when a partial term was taken up. See
  [the rule that came of it](../../decisions/a-blank-field-may-be-a-value.yml).

  **Brad J. Core won the same seat twice.** He took Amanda Township's trustee seat in 2023 on 684
  votes for a term to 31 December 2027, and in 2025 he won the unexpired remainder of that same term
  on 316. A seat only returns to the ballot that way if it fell vacant. [verified] — the canvass and
  the roster, which records him with no commencement date. What happened between is in neither.
  [open]

  **What this does not cover.** The county's other 66 elective seats — Lima and Delphos, the school
  boards and the educational service centre, the county offices and the courts — are not joined here.
  Their holders were elected across four cycles rather than two, and several of the school districts
  cross the county line, so the canvass of this county's votes is not the whole record of how they
  were filled. [verified] — [the seat count](allen-county-elected-seats-2026.yml).
properties:
  parameter: >-
    Village and township seats in Allen County, with the sitting holder and whether that holder won
    the seat at an election, was appointed to it, or the seat is empty
  value: >-
    100 seats: 69 held by an election winner, 26 by an appointee, 5 empty
  unit: elective seats
  as_of: "2026-09-09"
  method: |
    The roster's eighty-eight precinct pages fetched and parsed into 101 offices, 218 seats and 210
    seated holders, of which the 15 village offices and 24 township offices are taken here. A row
    reading `N Vacant Seats` is expanded into N seats. A holder is *appointed* if the roster prints
    `*Appointed*` beside the name and elected otherwise; that is the roster's mark and not this
    corpus's judgement.

    Winners come from the two official canvasses: the candidates of a contest ordered by votes, the
    top *N* taken where *N* is its `Vote For` number, and any with zero votes dropped. Write-in
    winners count exactly as printed ones do. A winner is matched to a seat only where the body, the
    place, the office **and the term's expiry date** agree, and then on surname plus a compatible
    given name — the canvass prints `Rick Keller`, `Kathy Keller`, `Joe Recker` and once `Jospeh
    Sehlhorst`, where the roster has Ricky W, Kathleen Ann, Arthur Joseph and Joseph W. Every one of
    the 74 winners and 100 seats was resolved; the four winners with no seat are named in the prose
    above or held terms that expired on 31 December 2025.

    **The `seat` key numbers seats within a term cohort and means nothing.** The roster lists an
    office's holders together and does not say which seat is which, so where a cohort holds both an
    appointee and a vacancy — Harrod's council, Cairo's — the pairing of person to number is this
    corpus's ordering and not a fact.
