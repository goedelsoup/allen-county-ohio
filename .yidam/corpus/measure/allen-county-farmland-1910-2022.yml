class: measure
label: Land in farms, Allen County, 1910–2022
description: |
  Eighteen census years with no gap wider than fifteen, where this corpus lately held four inside a
  span of ninety-two. [verified] —
  [the historical archive](../../catalog/agcensus-archive-1925-1978.md) for nine of them,
  [the 1954 and 1987 volumes](../../catalog/census-of-agriculture-historical.md) for four,
  [the Thirteenth Census](../../catalog/census-1910-abstract-supplement-ohio.md) for 1910 and
  [Quick Stats](../../catalog/usda-census-of-agriculture.md) for the modern five.

      year     acres in farms    farms      change per year
      1910            240,472    2,939
      1920            241,488    2,909            +102
      1925            228,249    2,722          -2,648
      1930            230,424    2,684            +435
      1935            235,791    3,016          +1,073
      1940            225,630    2,574          -2,032
      1945            227,038    2,511            +282
      1950            227,944    2,560            +181
      1954            215,018    2,097          -3,232
      1959            206,047    1,755          -1,794
      1964            211,196    1,659          +1,030
      1969            215,862    1,611            +933
      1974            205,706    1,354          -2,031
      1978            195,604    1,244          -2,526
      1982            197,256    1,202            +413
      1987            201,190    1,148            +787
      2002            188,150      968            -869
      2022            178,921      897            -461

  [verified] — the four sources above; the last column is this corpus's arithmetic. [inference]

  **The farmland did not drain. It sawtoothed.** Nine of the seventeen intervals are rises. Across
  the whole record 87,824 acres left the county's farms and 26,273 came back, for a net loss of
  61,551 — **three acres returned for every ten lost**. [inference] — computed from the table above.

  **In figures: 240,472 acres in 1910, 241,488 in 1920, 235,791 in 1935, 215,018 in 1954, 206,047 in
  1959, 215,862 in 1969, 195,604 in 1978 and 178,921 in 2022.** [verified] —
  [the historical archive](../../catalog/agcensus-archive-1925-1978.md) and the three sources named
  above, eight of the eighteen rows of the table.

  **The county's farmland peak is 1920, not 1910.** 241,488 acres, a thousand above the 1910 figure
  this corpus has treated as the top of the series since it first held one. [verified] —
  [the 1925 volume](../../catalog/agcensus-archive-1925-1978.md), County Table 1.

  **The largest single loss in the record is one nobody here had seen.** Allen County lost 13,239
  acres of farmland between 1920 and 1925 — more than the 12,926 it lost between 1950 and 1954,
  which this corpus had published as the sharpest stretch of the century. [verified] — same volume.

  **And that published finding survives anyway, on the measure it was made on.** 1950 to 1954 is
  four years and 1920 to 1925 is five, so the rate is 3,232 acres a year against 2,648, and 1950–54
  is still the fastest loss in the record. What changes is that it is no longer the only one of its
  size. [inference] — computed here; see
  [the four census years that found it](allen-county-farms-1949-1987.yml).

  **The forty years this corpus called the flattest stretch in the record are the least flat.** They
  net 313 acres a year, and inside them 23,400 acres left and 10,872 returned — a rise of 1,016, a
  fall of 13,239, a recovery of 7,542, a fall of 10,161 and a recovery of 2,314, in that order. An
  average taken across two endpoints described none of it. [inference] — computed from the table above.

  **The farm count peaks in the Depression.** 3,016 farms in 1935 against 2,939 in 1910 and 2,684 in
  1930 — and the farmland with them, 5,367 acres more in 1935 than five years before. Ohio moves the
  same way, 219,296 farms to 255,146. [verified] —
  [the 1940 volume](../../catalog/agcensus-archive-1925-1978.md), County Table 1, rows 1–3 and 6–8.

  **The nineteen-sixties gained farmland, inside one definition.** 206,047 acres in 1959 and 215,862
  in 1969, a rise of 9,815 or 4.8 per cent, across three censuses that share a farm definition.
  [verified] — [the 1959, 1964 and 1969 volumes](../../catalog/agcensus-archive-1925-1978.md). The
  1959 census cost the county 75 farms by redefinition alone, a figure its own table prints.
  [verified] — same archive, the 1959 volume, row 3.

  **Ten of the eighteen years are printed twice and agree.** Every volume in this archive carries
  the census before it, so 1910, 1930, 1935, 1940, 1954, 1959, 1969, 1974, 1978 and 1982 each appear
  in two different books; all agree to the acre except 1964, where the 1964 volume prints 211,196
  and the 1969 volume 211,195. [verified] — see
  [a reprint is not a second witness](../../decisions/a-reprint-is-not-a-second-witness.yml).
properties:
  parameter: land in farms, Allen County
  value: "178921"
  unit: acres
  as_of: "2022"
  method: |
    Every figure between 1920 and 1978 read from a 300-dpi render of the page, never from the text
    layer, which mangles digits in these typefaces — it gives Ohio's 1920 land in farms as
    23,615,888 where the page prints 23,515,888 and its 1910 farm count as 272,046 against a printed
    272,045. Land area, and so the percentage in farms, is not constant across the run: the volumes
    give the county 259,840 acres in 1925, 262,400 in 1940, 1945, 1959 and 1964, and 262,405 in
    1969, so acreage rather than share is what this node compares. Farm counts are not comparable
    across the definition changes of 1959, 1974 and 1978; see
    [a farm count is a definition](../../decisions/a-farm-count-is-a-definition.yml). [verified]
