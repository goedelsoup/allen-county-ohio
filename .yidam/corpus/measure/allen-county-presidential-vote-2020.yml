class: measure
label: Allen County presidential vote, 2020
description: |
  Of 47,993 presidential votes cast in the county, **33,116 for Trump and Pence and 14,149 for
  Biden and Harris** — 69.0 per cent against 29.5, with 590 for Jorgensen and Cohen and 138 for
  Hawkins and Walker. [verified] — [OpenElections](../../catalog/openelections-ohio.md).

  **Eleven of the county's 88 precincts went to Biden, and ten of them are in Lima.** The
  eleventh is `AMERICAN D`, in the township wrapped around the city's west and north. Every
  other precinct in the county — all twelve townships' rural ground, both cities' outer wards,
  every village — went the other way. [verified] — same source. The most Republican precinct is
  `MONROE E` at 90.6 per cent; the most Democratic is `LIMA 6C` at 87.9. A county that votes
  69–29 contains precincts ninety points apart.

  **It is the third of three, and the county is drifting.** Republican share of the top-of-ticket
  vote ran 66.5 per cent in [2016](allen-county-presidential-vote-2016.yml), 67.3 in
  [2018](allen-county-governor-vote-2018.yml) and 69.0 here — a move of 2.5 points across two
  presidential elections, against a median precinct move of 1.5. [verified] — same source.

  **Every precinct Clinton won in 2016 moved toward the Republicans**, all thirteen of them, by a
  mean of 4.5 points; `LIMA 1A` and `LIMA 1C` crossed over entirely. Across the 88 the correlation
  between 2016 Republican share and the 2016–2020 swing is **−0.39**: the more Democratic a
  precinct was, the harder it moved. [verified] — computed here from the three
  [OpenElections](../../catalog/openelections-ohio.md) files.

  **The county has not always voted this way, and this corpus can now say when it did not.** The
  Democratic candidate carried Allen County at seven of the eight presidential elections its own
  1885 history records, from Buchanan in 1856 to Cleveland in 1884; in 1884 Lima was the Republican
  end of the county and the townships the Democratic end, the exact reverse of the arrangement above.
  [verified] — [the eight elections to 1884](allen-county-presidential-vote-1856-1884.yml) and
  [the 1884 count by township and ward](allen-county-presidential-vote-1884-by-township.yml). By
  1920 the county was Republican by 2,320 votes. [verified] —
  [the 1920 return](allen-county-presidential-vote-1920.yml).

  Down-ballot in 2020, Jim Jordan took 33,201 to 13,080, Matt Huffman 34,303 to 12,645, and Bob
  Cupp ran unopposed with 38,882. [verified] — same source.
properties:
  parameter: presidential votes cast
