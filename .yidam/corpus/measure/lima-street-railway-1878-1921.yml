class: measure
label: Lima's street railway under four names, 1878–1921
description: |
  Four company names carried Lima's street railway across forty-three years. Three transfers lie
  between them and the corpus can date exactly one.

      June 1878    Lima Street Railroad Company            horse cars, five cents
      by 1902      The Lima Electric Railway & Light Company
      1 July 1905  The Lima & Toledo Traction Company      leased the property
      by 1921      The Ohio Electric Company               fifteen miles of track in the city

  **The first is described down to the streets it ran on.** "Lima Street Railroad Company. — This
  company was organized in June, 1878, with George Jameson president and Frederick Agerter
  secretary. The company's lines run from the Fort Wayne depot west on Wayne to Main, south on Main
  to Market, and west on Market to the stables beyond the city limits. In winter, sleighs take the
  place of street cars. The fare is 5 cents, and the trips from 7 A. M. to 10 P. M., regular."
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **[Benjamin Faurot](../person/benjamin-faurot.yml) owned it and lost it.** He "acquired the
  ownership of the city's first street railway — then a horse-car line", and it is named among the
  things that slipped through his fingers with the strawboard money: "the Lima street railway
  system, the Lima Electric Light Company, the Faurot Block and the land about the city."
  [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **The one dated transfer is a lease, and the book puts it in a biography rather than in its
  transportation chapter.** "On July 1, 1905, The Lima Electric Railway & Light Company was
  succeeded by the Lima & Toledo Traction Company, which has leased the property and has powers
  almost unlimited." [verified] — same source. That chapter, describing the Lima & Toledo as a road
  still being graded, does not mention that it had by then taken over the city's cars. [inference]

  **The system between the horses and the lease was rebuilt from nothing.** The manager who came to
  Lima in 1902 for the Lima Electric Railway & Light Company "built an entire new system, power
  house, etc.", having earlier turned a horse-car line into an electric railway in Kansas.
  [verified] — same source.

  **The last name is a company that is not from here.** By 1921 the fifteen miles of electric
  railway in the city are operated by [the Ohio Electric](../organization/ohio-electric-railway.yml).
  [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **What is not on record is every transfer but one.** No source here states when or how the Lima
  Street Railroad Company became the Lima Electric Railway & Light Company, nor when the Ohio
  Electric took over from the Lima & Toledo. The corpus treats the four as one railway because each
  book describes the same streets, and not because any of them says so. [inference]

  **The railway has an end now, and it is 1938.** Motor buses began replacing Lima's electric street
  cars in that year, "cars that had served the city for over fifty years". [verified] —
  [History of Lima, Ohio](../../catalog/hackman-history-of-lima-1951.md); see
  [the buses](../event/the-buses-replace-the-streetcars-1938.yml). Sixty years from the horse cars
  of June 1878 and about fifty from the electrification, which is what the booklet counts from.
  [inference]

  **A fifth name may belong on the list and the corpus is not adding it.** The same booklet counts
  five interurban lines running out of Lima in the 1920s and names them, and none of those five is a
  city street railway. [verified] — the same book. A company that runs cars between towns is not the
  company that runs them along Main Street, and the booklet does not say who ran the city's.
  [inference]

  [open] Whether the Lima & Toledo Traction Company ever built the road it was named for. It is
  absent under that name from the 1917 federal directory of operating electric railway companies.
  [verified] — [Census of Electrical Industries, 1917](../../catalog/census-electrical-industries-1917.md).
properties:
  parameter: company names under which Lima's street railway was operated
  value: "4"
  unit: companies
  as_of: "1921"
  method: |
    Counted from three county histories, each naming the operator of its own day, plus the 1917
    federal directory for the absence of the third name. Names, not companies: no source states that
    any one of these bodies became the next, and the corpus counts what was printed. [verified]
