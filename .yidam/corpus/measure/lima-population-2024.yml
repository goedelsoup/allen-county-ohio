class: measure
label: Lima population, July 2024 estimate
description: |
  The Vintage 2024 estimate for Lima city. [verified] —
  [Census Population Estimates, Vintage 2024](../../catalog/census-popest-2024.md),
  sub-county file.

  Against the [2020 base](lima-population-2020.yml) of 35,531 this is a fall of 841, or about
  2.4%. [inference] — arithmetic this corpus's; both figures verified.

  The longer window is the one that carries weight. Against the
  [2000 base](lima-population-2000.yml) of 40,307, Lima has lost 5,617 people or 13.9% over 24
  years, while the county lost 7.0% over the same span. [inference] When this node was written
  the corpus held only a four-year window and said so; the 2000 and 2010 figures have since
  been extracted and [depopulation](../period/depopulation.yml) now rests on
  them rather than on this comparison.
  This figure describes the **corporation's territory**, not the settlement in the ordinary
  sense: the Census Bureau tabulates Lima at the corporate boundary of the date, so what the
  number counts is whatever ground the [City of Lima](../jurisdiction/city-of-lima.yml) had
  annexed by then. [inference] The node therefore carries a `describes` edge to the
  jurisdiction as well as to the place. Both are true and they are not the same claim — the
  place is what the name denotes, and the jurisdiction is what the boundary encloses.
properties:
  parameter: total resident population
  value: "34690"
  unit: persons
  as_of: 2024-07-01
  method: |
    Modeled postcensal estimate. [verified]
