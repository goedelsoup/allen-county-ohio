class: measure
label: Allen County in Congress, 1831–1933
description: |
  Every member of the United States House the county has been represented by, as the 1906 history
  prints them, checked entry by entry against the federal record. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), "Congressmen", and
  [the congress-legislators file](../../catalog/congress-legislators.md).

  **Twenty entries, eighteen men, ten home counties, and three of the eighteen from Allen.** The
  book lists the members by congressional district, giving each man's home county and his years:
  Joseph H. Crane of Montgomery through Harvey C. Garber of Darke. Emory D. Potter and Benjamin
  Le Fevre each appear twice. [verified] — same source, counted entry by entry.

  **The county changed congressional districts four times in seventy-five years and never held the
  same number twice running.** Third to 1842, Fifth 1843–1852, Fourth 1853–1862, Fifth 1863–1882,
  Fourth from 1883. [verified] — the book's own five headings. So the number in the label of
  [the present seat](../office/representative-in-congress-for-ohios-4th-district.yml) has been this
  county's before, twice, over ground it no longer describes.

  **Nineteen of the twenty entries survive the check and one does not.** Laid against the federal
  record Congress by Congress, every name, district and span in the book is confirmed except
  1891–1896: the book files Fernando C. Layton of Auglaize under the Fourth for that whole span, and
  Layton sat for the Fifth in the 52nd Congress and the Fourth in the 53rd and 54th. The Fourth's
  member in 1891–93 was Martin K. Gantz of Darke, whom the book never names. [verified] — the two
  lists compared; see [the file](../../catalog/congress-legislators.md).

  Either the county was in the Fifth for those two years and the book's heading is wrong, or it was
  in the Fourth and the book dropped a member. [open] Nothing held here chooses between them, and
  the book gives Layton's first name as Fred.

  **The book's method fails at exactly one kind of place: where a map moved under a sitting
  member.** It breaks Le Fevre in two, once under each heading, when the county changed districts in
  1883 and he stayed its member. It does not break Layton. [inference] — the same two lists; a
  roster written by person can only record a change of district by naming a man twice.

  **The county's first congressman of its own resigned a county office more than a year before his
  seat existed.** Mathias H. Nichols resigned as prosecuting attorney in 1852 "to enter Congress" and
  was seated on 5 December 1853. [verified] — the 1906 roster for the resignation, the federal record
  for the seating; see [the officers of 1831–1906](allen-county-officers-1831-1906.yml).

  **He then held one seat under three party labels in six years.** The federal record gives Nichols
  as a Democrat in the 33rd Congress, an "Ind. Republican-Democrat" in the 34th and a Republican in
  the 35th — the same man, the same district, three descriptions. [verified] —
  [the file](../../catalog/congress-legislators.md). The county history names him once and gives no
  party at all.

  **Six men, and four of them held county office first.** The 1921 history's claim — "Allen County
  has been represented in the U. S. Congress by Senator Calvin S. Brice, Mathias H. Nicholas,
  Charles N. Lamison, S. S. Yoder, B. F. Welty and John L. Cable" — is confirmed in every particular
  by the federal record, and it reaches past both books:

      Calvin S. Brice       U.S. Senate       1891-12-07 – 1897-03-03
      Mathias H. Nichols    House, Ohio 4th   1853-12-05 – 1859-03-03
      Charles N. Lamison    House, Ohio 5th   1871-03-04 – 1875-03-03
      Samuel S. Yoder       House, Ohio 4th   1887-12-05 – 1891-03-03
      Benjamin F. Welty     House, Ohio 4th   1917-04-02 – 1921-03-03
      John L. Cable         House, Ohio 4th   1921-04-11 – 1925-03-03
                                              1929-04-15 – 1933-03-03

  [verified] — [the file](../../catalog/congress-legislators.md), the six records read in full.
  Cable is the sitting first-termer in the 1921 book and came back for two more terms after it, at
  the end of a gap of four years. Every one of the six but Cable was first elected a Democrat, and
  Nichols alone ended a Republican. [verified] — same source, the `party` field of every term.

  **The 1906 book could not have named three of the six and is not wrong to omit them.** Brice sat
  in the Senate, which the book's list does not cover; Welty was its own county's prosecuting
  attorney in 1905 and went to Washington eleven years after it was printed; Cable was twenty-two
  when it appeared and thirty-six when he was seated. [inference] — the dates above and the
  birthdays in the file, against the book's date.

  [open] Where the county actually sat between 1891 and 1893, and which district it is in for the
  election of 2026. The corpus now has the same unanswered question at both ends of the record.
properties:
  parameter: members of the U.S. House named as representing the county, 1831–1906
  value: "18"
  unit: persons
  as_of: "1906"
  method: |
    The 1906 book's list transcribed by hand — the scan runs the district headings into the prose and
    an automatic reading would lose them, which is where its only error is. The federal record was
    queried for Ohio districts 3, 4 and 5 for every Congress from 1831 to 1907 and matched to the
    book by surname within the book's own spans; the two spelling differences the match threw up
    (Emery for Emory, Le Blond for LeBlond) are the transcriber's and not the record's. The count of
    eighteen is persons, not entries: Potter and Le Fevre each appear twice under different headings.
    The federal file is authority for who sat for a district and is not authority for which district
    this county was in, so no claim here derives the second from the first. [verified]
