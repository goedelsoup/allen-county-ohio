class: measure
label: Allen County population by race, 1970–2020
description: |
  The six censuses between the county's 1960 composition and the present, read from the state
  volume of each and, for 2020, from the redistricting file. [verified] —
  [the general characteristics volumes, 1970–2010](../../catalog/census-general-population-characteristics-1970-2010.md)
  and [the 2020 redistricting file](../../catalog/census-2020-redistricting-file.md).

      census   county pop     Black   share      Lima pop    Lima Black   Lima's share
      1960        103,691     7,322    7.06%       51,037             -              -
      1970        111,144     9,234    8.31%       53,734         8,003         86.7%
      1980        112,241    10,975    9.78%       47,381         9,670         88.1%
      1990        109,755    12,313   11.22%       45,549        10,949         88.9%
      2000        108,473    13,225   12.19%       40,081        10,614         80.3%
      2010        106,331    12,639   11.89%       38,771        10,253         81.1%
      2020        102,206    12,573   12.30%       35,579         9,908         78.8%
      ------------------------------------------------------------------------------
      2020, counted as before 2000    15,636   15.30%                11,932

  The label is each census's own — "Negro" through 1970, "Black" from 1980, "Black or African
  American alone" from 2000 — and is not modernised. [verified] — the volumes above.

  **The county's Black population grew at every census from 1920 to 2000.** 1,385 · 1,686 · 1,916 ·
  4,391 · 7,322 · 9,234 · 10,975 · 12,313 · 13,225, across eighty years and nine counts with no
  reversal in any of them. [verified] —
  [the general characteristics volumes](../../catalog/census-general-population-characteristics-1970-2010.md)
  for the last four and [the earlier volumes](allen-county-population-by-race-1930-1960.yml) for
  the rest.

  **In figures: 9234 in 1970, 10975 in 1980, 12313 in 1990, 13225 in 2000, 12639 in 2010 and 12573
  in 2020.** [verified] —
  [the general characteristics volumes](../../catalog/census-general-population-characteristics-1970-2010.md)
  and [the redistricting file](../../catalog/census-2020-redistricting-file.md).

  **Two of those decades are decades in which the county was emptying.** Allen County peaked at
  112,241 in 1980 and has fallen at every census since; between 1980 and 2000 it lost 3,768 people
  and gained 2,250 Black residents. [inference] — computed here against
  [the county's totals](allen-county-population-1940-1990.yml). The county's Black share doubled
  between 1950 and 1980 and rose again by half between 1980 and 2000, and the whole of the second
  rise happened inside a decline.

  **Then it stops — and 2000 is also where the question changes.** 13,225 · 12,639 · 12,573 reads
  as a plateau, and the census that begins it is the first at which a person could be counted as
  more than one race. The county's two-or-more-races count over the same three censuses is 1,577,
  2,796 and 6,237. [verified] —
  [the 2000 and 2010 volumes](../../catalog/census-general-population-characteristics-1970-2010.md)
  and [the redistricting file](../../catalog/census-2020-redistricting-file.md), table P1.

  **Counted the way every census before 2000 counted, the county's Black population in 2020 is
  15,636.** That is Black alone plus every multiple-race combination that names Black — thirty-two
  of table P1's seventy-one cells — and it is 3,063 above the alone figure and 18 per cent above
  the 2000 peak the alone series shows. [verified] — the redistricting file, with the thirty-two
  cells identified from the data dictionary in
  [the national technical documentation](../../catalog/census-2020-redistricting-file.md), chapter
  6. The plateau is a category splitting, not a population that stopped growing. [inference] — see
  [two volumes are not one series](../../decisions/two-volumes-are-not-one-series.yml).

  **Lima's share of the county's Black residents did not fall in every decade, and this corpus has
  said that it did.** It fell from 89.7 per cent in 1920 to 74.7 in 1950 — and then rose, to 86.7 in
  1970, 88.1 in 1980 and **88.9 in 1990**, which is where it stood in 1920. Only after that does it
  fall again: 80.3, 81.1, 78.8. [verified] — the volumes above and
  [the earlier censuses](allen-county-population-by-race-1930-1960.yml). The dispersal the corpus
  read out of 1920 to 1950 reversed completely and the one it reads in the present is forty years
  old, not a hundred. [inference] — computed here.

  **The reversal has a boundary in it.** Lima annexed from Shawnee Township in 1944 and again
  through the 1950s and 1960s, so part of the 1950-to-1970 rise in the city's share is ground
  moving across the city line rather than people moving across it. [inference] — see
  [the annexation record](allen-county-annexations-1990-2024.yml) and
  [the city](../jurisdiction/city-of-lima.yml). How much of it is boundary is not established here.

  **By 2020 three subdivisions hold nineteen in twenty of the county's Black residents.** Lima
  9,908, American Township 1,476 and Shawnee Township 517 make 11,901 of 12,573, or 94.7 per cent;
  six of the twelve townships have fewer than twenty-five. [verified] — the redistricting file, in
  which the thirteen subdivisions sum to the county exactly in every column read.

      2020                     total    Black alone   alone or in combination
      Lima city               35,579          9,908                    11,932
      American township       14,538          1,476                     1,808
      Shawnee township        12,482            517                       755
      Bath township            9,399            258                       404
      Perry township           3,382            192                       263
      Richland township        5,871            103                       152
      the other seven         20,955            119                       322
      -----------------------------------------------------------------------
      Allen County           102,206         12,573                    15,636

  [verified] — same file; the seven remaining townships are Amanda, Auglaize, Jackson, Marion,
  Monroe, Spencer and Sugar Creek.

  **The census and the survey disagree by 1,768 people on a figure this corpus publishes.** The 2020
  census counted 12,573 Black-alone residents of Allen County; the American Community Survey's
  2019–2023 five-year estimate is 10,805 ± 658. The interval does not reach the count — the gap is
  2.7 times the margin — and the two instruments disagree in opposite directions on White alone as
  well, 80,753 counted against 82,251 ± 428 estimated. They agree almost exactly on the multiple-race
  total: 6,237 counted, 6,255 ± 762 estimated. [verified] —
  [the redistricting file](../../catalog/census-2020-redistricting-file.md) and
  [the American Community Survey](../../catalog/census-acs-summary-file.md), table B02001. This
  corpus does not establish why they differ. It is not sampling error at that size, and it is not
  disclosure avoidance, which moves county race cells by tens. [inference] — see
  [a survey is not a count](../../decisions/a-survey-is-not-a-count.yml).

  [open] Which of the two is nearer the county's people. Both are published, both are the Census
  Bureau's, and this corpus quotes the survey on
  [its 2023 page](allen-county-race-2023.yml) and the count here.
properties:
  parameter: population enumerated as Negro, Black, or Black or African American alone, Allen County
  value: "12,573"
  unit: persons
  as_of: "2020"
  method: |
    1970 and 1980 read from page images rendered at 300 dpi, because neither volume has a text
    layer; 1990, 2000 and 2010 from `pdftotext -layout` on volumes that extract exactly; 2020
    computed from the pipe-delimited redistricting file. Each census was checked against something
    it did not have to agree with: 1970's race and sex rows both sum to its printed county total
    and its five named other races to their printed subtotal; the thirteen county subdivisions sum
    to the county in every printed column in 1980, 1990 and 2020; the 2000 and 2010 race categories
    sum to their printed county totals; and the 2020 file's own hierarchy closes at every level —
    six single races to the one-race line, fifteen pairs to the two-race line, the four multiple
    lines to the two-or-more line, and that to the total. The county totals 111,144, 112,241,
    109,755, 108,473, 106,331 and 102,206 are the figures this corpus already held from unrelated
    products. [verified]
