class: measure
label: School buildings in Allen County's twelve districts, 1986–2024
description: |
  **Thirty-nine consecutive years, all twelve districts reporting in every one of them.** This is
  the one column of the federal district directory with no hole in it: the staffing columns
  beside it are empty before 1992, absent for 2014 and short two districts in 2022, and the count
  of schools is complete from 1986. [verified] —
  [the Common Core of Data](../../catalog/nces-common-core-of-data.md), the district directory.

      1986  51    1996  48    2006  46    2016  42
      1988  50    1998  49    2008  46    2018  43
      1990  50    2000  49    2010  45    2020  42
      1992  50    2002  47    2012  45    2022  44
      1994  50    2004  47    2014  41    2024  43

  **This county reports eight fewer school buildings than it did in 1986, and seven of the
  difference is Lima City.** The county held 51 in 1986 and holds 43; Lima went from 16 to 9,
  Elida and Spencerville lost one each, Bath gained one, and the remaining eight districts end
  where they began — so nine buildings left the count and one entered it. [verified] — the same
  source, its district directory, by district.

      district              1986   2024   change
      **Lima**                16      9     -7
      Elida                    4      3     -1
      Spencerville             4      3     -1
      Bath                     3      4     +1
      Allen East               3      3      0
      Bluffton                 3      3      0
      Columbus Grove           3      3      0
      Delphos                  4      4      0
      Pandora-Gilboa           3      3      0
      Perry                    2      2      0
      Shawnee                  4      4      0
      Waynesfield-Goshen       2      2      0
      all twelve              51     43     -8

  **Five of the twelve have reported the same number every year since 1986.** Columbus Grove and
  Pandora-Gilboa 3, Shawnee 4, Perry and Waynesfield-Goshen 2 — one distinct value each across
  all 39 years. Six more move by exactly one building and back, and Lima's count runs from 16
  down to 9. [verified] — same source, computed here.

  **The two halves of the county lost nearly the same number of children and answered
  differently.** Lima went from 6,969 pupils in 1988 to 3,370, a loss of 3,599, and closed seven
  buildings. The other eleven districts lost 3,311 between them and closed one. [verified] — same
  file, against [the enrolment series](allen-county-school-enrolment-1988-2024.yml).

  **They arrive at the same building.** Lima held 435.6 pupils per school in 1988 and holds
  374.4; the other eleven held 464.4 and hold 367.1. Two opposite policies over thirty-six years
  converge within eight pupils of each other. [verified] — the same two files, computed here. The
  corpus does not read that as either district aiming at a number, because nothing in these files
  is a decision and a school's capacity is fixed by the building rather than chosen each year.
  [inference]

  **This is a count of schools a district reported open, not a record of construction.** Lima
  reads 14 in 2003, 12 in 2004, 10 in 2005 and 12 again in 2006, and a building count that rises
  cannot be a demolition record; the years either side of a closure are where the count is least
  reliable. The corpus therefore reads the ends of the run and not the steps in the middle.
  [verified] — the same source, and see
  [a column can empty into its neighbour](../../decisions/a-column-can-empty-into-its-neighbour.yml).

  **This corpus cannot say which buildings closed.** The federal file counts schools and does not
  name the one that stopped being counted, and it carries no address, no year built and no
  account of what the ground became. Seven Lima schoolhouses left this series and the corpus does
  not know where any of them stood. [verified] — the columns this directory has.

  **The net of seven is a turnover of nineteen.** The school-level directory, read at fourteen dates
  between 1986 and 2024, shows thirteen of Lima's sixteen buildings leaving the count and six
  entering it. Only three identifiers run the whole way: North, South and West junior highs, now
  North Middle, South Science-Technology Magnet K-8 and West Middle. [verified] —
  [the same collection](../../catalog/nces-common-core-of-data.md), its school directory, differenced
  here.

      gone                              last reported     arrived              first reported
      Jefferson Elementary                       1995     Unity Elementary               2002
      Roosevelt Elementary                       1995     Freedom Elementary             2002
      Edison Elementary                          2002     Heritage Elementary            2002
      Horace Mann Elementary                     2002     Independence Elementary        2003
      Washington McKinley Elementary             2002     Liberty Elementary             2003
      Westwood Elementary                        2002     Lima Senior High School        2010
      Whittier Elementary                        2002
      Emerson Elementary                         2004
      Irving Elementary                          2004
      Faurot Elementary                          2005
      Lowell Elementary                          2005
      Lima High School                           2005
      Lincoln Elementary                       (below)

  **Ten of the thirteen left in four years.** Between 2002 and 2005 Lima closed nine elementary
  schools and its high school and opened five elementary schools, so a district that had reported
  sixteen buildings in 1986 and seventeen in 2002 reported twelve in 2005. [verified] — the same
  file. What the count of buildings shows as a slow decline was, on the ground, a rebuild
  compressed into four years.

  **The schools that closed are named for people and the schools that replaced them are named for
  ideas.** Edison, Emerson, Faurot, Horace Mann, Irving, Jefferson, Lincoln, Lowell, Roosevelt,
  Washington McKinley, Westwood and Whittier gave way to Freedom, Heritage, Independence, Liberty
  and Unity. [verified] — the same file. Nothing retrieved here says who chose the names.

  **One identifier changed schools underneath the count.** The record numbered `390442201155` is
  Lincoln Elementary in 1986 and Lima Alternative by 1995, and it runs to 2013 — so a reader
  tracking that number across the series is tracking two schools. [verified] — the same file;
  see [a total is checked against one it did not come from](../../decisions/a-total-is-checked-against-one-it-did-not-come-from.yml).

  **The high school was split into four and put back together.** Lima High School last reports in
  2005; by 2010 the district reports a High School of Multiple Intelligences, a Performance Based
  School, a Progressive Academy and Lima Alternative; by 2015 there is one Lima Senior High School
  again, carrying the identifier the first of those four was given. [verified] — the same file.

  [open] What is in the twelve closed buildings now, and whether any of them still stands. The
  directory says when a school stopped reporting and nothing about the fabric.

properties:
  parameter: school buildings in the county's twelve districts
  value: "43"
  unit: schools
  as_of: "2024"
  method: |
    The `number_of_schools` column of the Common Core of Data district directory for Ohio, one
    request per year from 1986 to 2024, filtered here to the same twelve NCES agency identifiers
    the enrolment and staffing series use. All twelve districts report the column in all thirty-nine
    years and no value is imputed. Pupils per building is this file's own enrolment over its own
    school count in the same year, and 1988 is used rather than 1986 because enrolment is absent in
    1986. [verified]
