class: measure
label: The mayors of Lima, 1886–1922
description: |
  [The line](lima-mayors-1842-1886.yml) stopped where the 1885 book stopped. Two later histories
  carry it to the day the office was abolished.

      1884-90  William McComb, Jr.       1904-06  Theodore D. Robb
      1890-92  Ira R. Longsworth         1906-08  Theodore D. Robb
      1892-94  William McComb, Jr.       1908-10  Fred C. Becker
      1894-96  James V. Smiley           1910-12  George Dyer
      1896-98  Dr. Samuel A. Baxter      1912-14  C. N. Shook
      1898-00  H. S. Prophet             1914-16  Theodore D. Robb, who died in office
      1900-02  William McComb, Jr.       1916-18  B. H. Simpson
      1902-04  L. H. Rogers              1918-20  B. H. Simpson
                                         1920-22  F. A. Burkhardt

  **Everything to 1904 is dated by its source.** [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), which prints "Mayors
  of Lima" from April 1842 to "Theo. D. Robb, April, 1904 — " in thirty-four entries.

  **Everything after 1904 is dated here, and the dating closes.** The 1921 history gives the
  succession in order and gives no dates at all, but it states the term — "the mayor and members of
  City Council have hitherto served two years" — and it dates the end: the commission form of
  government "comes into effect January 1, 1922, at the end of the term of Mayor Burkhardt".
  [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).
  Nine entries follow L. H. Rogers in that list. Nine two-year terms are eighteen years, and April
  1904 plus eighteen years is April 1922. [inference] — computed here. The quarter-year residue is
  the calendar moving: the same 1906 book's list of city solicitors turns on January 1906, where
  every earlier boundary in it is April.

  **The book checks itself once and passes.** Theodore D. Robb appears three times in the list, and
  a biographical passage elsewhere in the same volume calls him "three times mayor of Lima".
  [verified] — same source. He died in the third, and the list says the term "was finished by
  Miles Standish", who is named nowhere else in it.

  **The lists cannot be counted as terms, and they say so themselves.** Two men are printed twice
  running — Theodore D. Robb, and B. H. Simpson — so a consecutive re-election sometimes gets its
  own entry; but William McComb, Jr.'s six years from 1884 get one entry, and at a two-year term
  that is three. [verified] — the 1906 and 1921 histories. So the figure below counts entries as
  printed and not terms served, which are not the same thing anywhere in this line. [inference]

  **McComb is the man the city returned to most.** Three separate spells over sixteen years, and
  H. S. Prophet twice, sixteen years apart. [verified] — the 1906 history.

  **The line ends rather than continues.** F. A. Burkhardt was the last mayor of Lima under the
  aldermanic form, and he was also an advisory editor of the book that records it and the author of
  a chapter in it. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the commission government](../event/lima-adopts-commission-government-1922.yml) and
  [F. A. Burkhardt](../person/frank-a-burkhardt.yml).

  [open] What happened to the office between 1 January 1922 and 2021. The city's own site names
  only its sitting mayor, and no source here holds a list of Lima's mayors under or after the
  commission charter.

  **A "Corbin Shook, former Lima mayor" turns up in 1950.** [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 16 November 1950, naming him in his
  sister's obituary; see [the mayors named inside the gap](lima-mayors-1939-1956.yml).

  **The corpus will not place him in this line.** It carries C. N. Shook for 1912–14 and a first
  name behind that initial would be worth having, but the same phase that found the obituary also
  found that Lima had mayors in the 1920s and 1930s this corpus cannot name, and a former mayor
  mentioned in 1950 fits either stretch. [open]
properties:
  parameter: entries in the printed lists of Lima's mayors beginning after April 1886
  value: "16"
  unit: entries
  as_of: "1922"
  method: |
    Read from the 1906 history's dated list of mayors and the 1921 history's undated ordered list,
    which are very likely one lineage rather than two witnesses: the 1921 book says it is following
    "the most recent report in Lima", which "enumerates the mayors from the beginning". Dates to
    1904 are the 1906 book's. Dates after 1904 are computed here from that book's last dated entry,
    the 1921 book's statement of the two-year term, and the 1 January 1922 abolition, and are
    reported as an inference that closes rather than as a source's dating. The count is of entries
    as printed. It is not a count of terms and not a count of men: the lists give a consecutive
    re-election its own entry twice and fold three terms into one entry once. [inference]
