class: measure
label: Peak flows on the Ottawa River, 1924–2025
description: |
  **The Ottawa River has been gauged for seventy-nine water years and the record is in two halves
  that cannot be joined.** (The county has a third river gauge, on the Auglaize since 2017, and it
  is not on this river.) [verified] —
  [USGS peak streamflow](../../catalog/usgs-nwis.md).

      gauge                          water years   n    drainage    largest peak
      04187500 at Allentown          1924-1981     52   160 sq mi   7,740 cfs  1959-01-22
      04187100 at Lima               1989-2025     27   128 sq mi   5,700 cfs  2011-02-28

  **They are different places, different periods, and seven water years apart.** Allentown is
  downstream of Lima and drains a quarter more ground; nothing gauged the river between water year
  1982 and water year 1988. [verified] — same source. The median annual peak is 3,240 cubic feet a
  second at Allentown and 3,210 at Lima — almost identical from a basin a quarter smaller — and the
  corpus does not read that as a change in the river, because the two figures are from different
  decades and either urbanisation or the weather of two eras would explain it. [inference]

  **Each half has holes and the holes have shapes.** Allentown is missing water years 1936 to 1938
  and 1940 to 1942 — one continuous outage from 31 December 1935 to 1 September 1943, seen through
  the water-year convention as two, and its second and third largest peaks fall inside it and are
  published as reconstructed historic peaks rather than readings. Lima is missing **2000 to 2009
  exactly**, ten consecutive years. [verified] — same source, computed here.

  **That ten-year hole swallowed three of the county's four flood declarations** — 2004, 2005 and
  2007 — and the gauge was not running in any of them. [verified] — same source and
  [the declarations](allen-county-disaster-declarations-1965-2020.yml).

  **And the largest measured flood in the modern record brought no federal declaration at all.**
  5,700 cubic feet a second on 28 February 2011 is the highest of the Lima gauge's 27 water years,
  and 2011 is not a declaration year; nor is 2015, the second highest. [verified] —
  [USGS peak streamflow](../../catalog/usgs-nwis.md) and
  [OpenFEMA](../../catalog/fema-disaster-declarations.md).
  This is not evidence that the aid was misdirected. It is evidence that a declaration is an
  administrative act, which the declarations node had to reason its way to and this measures.
  [inference]

  **The county now has a rainfall record where this one is silent, and it agrees where they meet.**
  August 2007 — inside the ten-year hole, in one of the three declaration years this gauge missed —
  is the wettest August of a hundred and thirty-one years, at 10.54 inches against an August mean of
  3.18. January 2005, another of the three, is the fourth wettest January. And this gauge's own
  highest peak sits in the fourth wettest February of the record and the wettest calendar year of
  it. [verified] — [the county's precipitation](allen-county-precipitation-1895-2025.yml).

  **The two records overlap on one weather declaration in sixty years.** The gauge covers water
  years 1989-1999 and 2010-2025; the only non-pandemic declaration inside that window is the storm
  of June 2012, and that water year's peak — 3,170 cfs on 30 November 2011, sixteenth of
  twenty-seven — was not in that storm, which the declaration titles as straight-line winds.
  [verified] — [USGS](../../catalog/usgs-nwis.md) and
  [OpenFEMA](../../catalog/fema-disaster-declarations.md), computed here; see
  [the intersection, not the union](../../decisions/the-intersection-not-the-union.yml).

  **A third file covers the gauge's ten-year hole and does not fill it.** The county's severe
  weather record has ninety-five events in the 2000s, including flash floods in 2003, 2004 and 2007
  — but a flash flood report is a road under water, not a discharge, and no arithmetic joins the
  two. [inference] — [the storm record](allen-county-storm-events-1950-2026.yml); see
  [the intersection, not the union](../../decisions/the-intersection-not-the-union.yml).

  **And the largest flow ever measured here is in none of the three files but this one.** January
  1959 brought no federal declaration, and the weather record did not begin counting floods until
  1996. [verified] — [the declarations](allen-county-disaster-declarations-1965-2020.yml) and
  [the storm record](allen-county-storm-events-1950-2026.yml).

  **All twenty-nine stream sites have now been checked, and the answer is that nothing was
  running.** Six carry an annual-peak record, not the two this node had — the four it lacked are the
  Auglaize near Kossuth, from March 2017, and three crest-stage gauges on basins of half a square
  mile to one and a half, which covered 1966 to 1987. Three sites have ever carried a daily
  discharge record: Allentown to March 1982, Lima from September 1988, Kossuth from March 2017.
  **No gauge in Allen County recorded a value on any day of 2000 to 2009.** [verified] —
  [USGS](../../catalog/usgs-nwis.md), the site service with `seriesCatalogOutput` and the
  daily-values service, queried here; see
  [the monitoring sites](allen-county-water-gauges-2026.yml), which this corrects.

  **The hole is sharper than a water year**: the Lima gauge's daily record has exactly one gap,
  22 November 1999 to 1 July 2009, 3,509 days, and it came back too late to yield water year 2009 a
  peak. [verified] — the same source, computed here.

  **What the river did is answered by a gauge six miles outside the county, and this node twice said
  it was not recorded anywhere.** The Auglaize River at Ft. Jennings, in Putnam County, ran unbroken
  through the whole decade, and the National Weather Service's impact statement at its 13-foot minor
  flood stage begins "Minor flooding begins in the northwest Ohio counties of northwest Allen,
  northeast Van Wert, and southwest Putnam." [verified] —
  [the National Water Prediction Service](../../catalog/noaa-nwps-gauges.md), gauge FTJO1. **In seven
  of those ten water years its annual peak reached that stage, and twice it reached moderate** —
  17.13 feet in January 2005 and 19.41 in February 2008, the second highest crest in the gauge's
  hundred years. [verified] — [USGS peak streamflow](../../catalog/usgs-nwis.md), site 04186500,
  classified here against those thresholds. The decade was not quiet; it was unwatched from inside,
  and the corpus had been reading its own county line as the edge of the evidence. [inference]

  **The Ottawa at Lima has no flood stage at all.** It is the only National Weather Service gauge
  inside Allen County, and its four flood categories, its impact list and its inundation mapping are
  all empty. [verified] — [the National Water Prediction Service](../../catalog/noaa-nwps-gauges.md),
  gauge ORLO1. **Nothing federal converts a discharge here into a flood**, which is why this node
  has been able to rank the river's flows for a year and never say one of them flooded anything.
  [inference]

  [open] What the river did in 2000-2009 *at Lima*. Fort Jennings is on the Auglaize below the
  Ottawa's mouth and answers for the county's north-west corner by name, not for the city.
properties:
  parameter: highest recorded peak flow on the Ottawa River
  value: "7740"
  unit: cubic feet per second
  as_of: "1959-01-22"
  method: |
    Fetched from the USGS peak-streamflow service for site 04187500 and 04187100 and counted here by
    water year, which runs 1 October to 30 September and is named for the year it ends in. The two
    gauges are not combined into one series and no figure here is computed across both. The `value`
    is the largest peak either gauge recorded and the `as_of` is the day it happened, which is not
    the same as the largest flow the river has ever carried: the record covers 79 of the 102 years
    between 1924 and 2025, and none before. [inference]
