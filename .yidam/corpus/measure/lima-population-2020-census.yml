  - target: lima-population-2010.yml
    relationship: comparable-to
    claim_tag: inference
    because: >-
      Two decennial enumerations of the same corporation, ten years apart, each tabulated at the
      city's line of its own date. One boundary change falls between them — resolution 408-17 of
      29 June 2017, the only Lima record in thirty-five years that states no acreage — so the
      ground grew by an amount the survey does not give. The direction is what makes the pair
      usable anyway: annexation adds people to the later figure, so the fall of 3,192 is a floor
      on the loss inside the 2010 line, and no size of annexation turns it into a rise. See
      [a bound is not a break](../../decisions/a-bound-is-not-a-break.yml).
  - target: ../measure.ont.yml
    relationship: instance-of
