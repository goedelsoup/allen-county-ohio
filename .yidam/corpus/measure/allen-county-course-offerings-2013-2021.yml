class: measure
label: What Allen County's high schools offer, 2013–2021
description: |
  **Two of the ten high schools standing in Allen County offer an Advanced Placement course.** Elida
  and Shawnee do; Lima Senior, Apollo Career Center, Bath, Bluffton, Allen East, Perry, Spencerville
  and West Central Learning Academy do not. [verified] —
  [the Civil Rights Data Collection](../../catalog/crdc-civil-rights-data-collection.md), the 2021
  course-offering file, which is the 2021–22 school year.

      Allen County high schools, 2021-22        enrolment   AP   gifted   dual   calculus   physics
      Lima Senior High School                         984   no       no    yes        yes       yes
      Apollo Career Center                            834   no       no    yes         no       yes
      Shawnee High School                             660  yes       no    yes        yes       yes
      Elida High School                               591  yes      yes    yes        yes       yes
      Bath High School                                448   no       no    yes        yes       yes
      Bluffton High School                            358   no      yes    yes        yes       yes
      Allen East High School                          326   no       no    yes        yes       yes
      Perry High School                               289   no      yes    yes         no        no
      Spencerville High School                        252   no      yes    yes        yes       yes
      West Central Learning Academy II                 94   no       no     no         no       yes

  **Half of Ohio's high schools offer Advanced Placement and a fifth of this county's do.** 498 of
  the state's 1,009 high schools with a twelfth grade report an AP course, and among those holding
  five hundred pupils or more it is 322 of 419. Allen County has four of that size and two of them
  offer it. [verified] — the same file, over every Ohio school with a twelfth grade.

  **Lima Senior High School is the nineteenth largest of the five hundred and three Ohio high
  schools that offer none.** The eighteen above it are online academies, career centres and the
  large-city high schools of Lorain, Euclid, Dayton and Columbus. [verified] — the same file, ranked
  on the district files' enrolment.

  **The number of this county's high schools offering it has been six, four, four, five and two.**
  The collection asked in 2013, 2015, 2017, 2020 and 2021. Shawnee and Elida answered yes every
  time; Apollo, Bluffton, Perry and West Central answered no every time; Lima, Bath, Allen East and
  Spencerville each changed their answer at least once. [verified] — the same source, its five
  collections that carry the question.

      high schools offering an AP course, of ten
      2013   2015   2017   2020   2021
         6      4      4      5      2

  **Perry High School held six physics classes and a calculus class in 2017 and none of either in
  2021.** It is the only high school in the county that offers no physics, in a state where 807 of
  1,009 do. [verified] — the same source's 2017 and 2021 files. Calculus is the thinner offer
  everywhere: 594 of Ohio's high schools have it and seven of this county's ten.

  **The county is better supplied than Ohio on everything except the course with a fee attached.**
  Ten of ten offer chemistry against 82.2 per cent of Ohio's, ten of ten advanced mathematics
  against 85.4, nine of ten physics against 80.0, seven of ten calculus against 58.9 — and two of
  ten Advanced Placement against 49.4. [verified] — the same file for both.

  **The exception is the one course whose credit is granted somewhere other than the school.** Every
  subject a district staffs and examines itself stands at or above Ohio's rate here; the Advanced
  Placement course, whose credit comes from an examination a family pays a fee to sit, stands at two
  fifths of it. [inference] — computed from the figures above. Nothing in this file carries a reason,
  and the county has a second route to college credit that the state pays for.

  **Four of the ten report a gifted programme and none of them is one of the two largest.** Bluffton,
  Elida, Perry and Spencerville say yes; Lima Senior, Apollo, Shawnee, Bath, Allen East and West
  Central say no, and Shawnee Local reports none at any of its four buildings. [verified] — the same
  file. Ohio identifies gifted children by statute and this question asks about a programme, so a
  district may identify without answering yes. [inference]

  **In 2017 this county taught its mathematics and science slightly better staffed than Ohio did.**
  459 of the 528 classes its high schools held in the eight subjects the collection asks about were
  taught by a teacher certified in that subject, 86.9 per cent against the state's 85.4. [verified] —
  the same source, its last collection to ask. Six of the ten schools were at 94 per cent or above
  and one was at half: Allen East taught 29 of 58, including its only calculus class and five of its
  seven algebra I classes, without a teacher certified in the subject. [verified] — the same file.

      2017, classes taught by a teacher certified in the subject
      Bath 28/28 · Spencerville 34/34 · West Central 10/10 · Perry 26/27
      Elida 60/63 · Shawnee 80/85 · Lima Senior 123/132 · Bluffton 34/39
      Apollo 35/52 · Allen East 29/58

  **The question was retired after 2017 and there is no later answer.** The 2020 and 2021 collections
  return a reserved code in all eight columns for every school in the country, so whether Allen East
  still teaches calculus without a certified teacher is not in any federal file. [verified] — the
  same source, the 2017 and 2021 files compared column by column.

  **A course list is not a timetable and this node does not know what any child was taught.** [inference]
  The collection asks a district a yes-or-no question about its offerings and a count of classes,
  and a school that offers calculus to a class of four and a school that offers it to forty give the
  same answer. What was taken rather than offered is
  [a different count](allen-county-advanced-coursework-2021.yml).

  **This node does not assert that a school without Advanced Placement teaches less.** Ohio's
  College Credit Plus puts a pupil in an actual college course at the state's expense, and this
  county uses it more than Ohio does; see
  [the dual enrolment](allen-county-dual-enrollment-2017-2021.yml).

  [open] Why Lima Senior High School stopped. It offered five AP courses in 2013 and answered no in
  2015, 2017 and 2021, with a yes in 2020 between them. Nothing in the federal file carries a reason,
  a date within the year, or a district decision; see
  [where the Advanced Placement went](../question/where-the-advanced-placement-went.yml).

properties:
  parameter: high schools offering an Advanced Placement course
  value: "2"
  unit: of ten high schools in Allen County, 2021–22
  as_of: "2021"
  method: |
    The ten schools are the buildings inside Allen County whose highest grade offered is 12 and
    whose enrolment is above zero, taken from the district directory for 2021–22 and matched to the
    collection by the school's own identifier rather than the district's, which is blank in the
    2020 vintage. [verified] The Ohio comparison uses the same two rules over every school in the
    state, which gives 1,009 high schools of which 1,001 answer the AP question. [verified] A school
    counts as offering a subject when it reports one class of it or more; the class counts are read
    only from 2017 onward, because the question changed between 2015 and 2017 and every high school
    in this county jumps at that boundary. [verified] The certified-teacher share is the sum of
    classes taught by a certified teacher over the sum of classes held, across algebra I, algebra II,
    geometry, advanced mathematics, calculus, biology, chemistry and physics, skipping subjects a
    school does not hold. [verified]
