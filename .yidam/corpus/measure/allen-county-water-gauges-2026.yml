class: measure
label: Allen County's water monitoring sites, 2026
description: |
  **The county holds 184 water monitoring sites and two usable stream records.** [verified] —
  [USGS NWIS](../../catalog/usgs-nwis.md), site service, county 39003, all statuses.

      90  groundwater wells        19  agricultural
      31  lake or reservoir        13  atmospheric
      29  stream                    2  soil / other

  **Twenty-nine stream sites and two annual peak records between them.** The rest are levels,
  samples or one-off measurements; three of the county's larger stream gauges answer the peak-flow
  service with a 200 and no rows. A county can be thick with instruments and thin with
  measurements. [inference] — computed here; see
  [the peak flows](ottawa-river-peak-flows-1924-2025.yml).

  **The drainage areas put the county's rivers in order.** [verified] — same source.

      219 sq mi  Auglaize River near Spencerville      128  Ottawa River at Lima
      201        Auglaize River near Kossuth           124  Ottawa River at the D.T.&I. bridge
      160        Ottawa River at Allentown             64.4 Riley Creek near Bluffton

  The Auglaize is the larger river and the Ottawa is the gauged one, which is
  [the same asymmetry the bridges show](allen-county-bridge-crossings-2025.yml): forty-one crossings
  of the Ottawa against twenty-two of the Auglaize. Both follow from the same fact, which is that
  [Lima](../place/lima.yml) sits on the Ottawa. [inference]

  **Every one of the 184 sites drains to Lake Erie.** 168 are in the Auglaize subbasin `04100007`,
  14 in the Blanchard `04100008`, and two in other Maumee units; none is in an Ohio River unit.
  [verified] — same source. **That is an absence of instruments and not evidence about the divide**:
  the corpus has already established that four census blocks in
  [Auglaize Township](../place/auglaize-township.yml), holding ninety-nine people, drain to
  [the Scioto](../natural-feature/scioto-river-basin.yml), and ninety-nine people do not get a
  gauge. [inference] — see
  [silence from a source that would have spoken](../../decisions/silence-from-a-source-that-would-have-spoken.yml),
  which this is not an instance of.

  **A second federal file names two of these gauges on the reaches they stand on, and agrees.**
  The flow network attaches site 04187100 to an Ottawa River reach carrying 335.11 square
  kilometres — 129.4 square miles — and site 04187500 to one carrying 414.82, or 160.2. [verified]
  — [USGS NHDPlus High Resolution](../../catalog/usgs-nhdplus-high-resolution.md). This node has
  128 and 160 from the site service. Two files built for different purposes put the same two
  instruments on the same two drainages within a square mile. [inference]

  **It also puts an estimate of mean annual flow on 1,150 reaches in a county with two peak
  records.** The Ottawa leaves Allen County at an estimated 190.6 cubic feet a second and the
  Auglaize at 213.9. [verified] — the same source. Those are modelled from runoff and are not
  measurements; the corpus keeps them out of any table with a gauge in it. See
  [the catalog entry](../../catalog/usgs-nhdplus-high-resolution.md).

  **Eighty-seven of the ninety groundwater wells do have a water-level record, and it is the
  opposite shape to the stream record above.** 904 readings, 1962 to 2026 — but 803 of them are
  from 1998 and every one taken since is from a single well. Where the stream sites are many
  instruments and two long series, the wells are many instruments and one campaign. [verified] —
  [USGS NWIS](../../catalog/usgs-nwis.md), its field-measurements collection; see
  [the water levels](allen-county-groundwater-1962-2026.yml).

  **The endpoint that would have answered it had been dead for seven months when this node opened
  the question.** The `gwlevels` service was frozen on 1 November 2025 and has redirected to a blog
  post since 1 February 2026; the two services this node does use both answered, so nothing here
  noticed. [verified] — the same source's own decommissioning notice; see
  [a live url is not a live file](../../decisions/a-live-url-is-not-a-live-file.yml).

  **The site count in this node is now one short.** The replacement service gives 185 sites where
  the legacy one gave 184, in the same seven classes. [verified] — the same source, both services.
  Neither figure is wrong and the file gained a site.

  **The thirty-one lake and reservoir stations are the drinking water.** Allen County has no natural
  lakes; Lima's water system owns six named reservoirs, each with an intake, and Delphos a seventh.
  [verified] — [the water systems](allen-county-water-systems-2026.yml). A monitoring network
  concentrated on standing water in a county with none of it is a network watching a city's supply.
  [inference]

properties:
  parameter: USGS water monitoring sites in Allen County
  value: "184"
  unit: sites
  as_of: "2026"
  method: |
    Fetched from the USGS site service with `siteStatus=all`, which is required or discontinued
    gauges are omitted — and the discontinued ones carry most of the county's long record. Site
    types are the service's own two-letter codes, collapsed here to their first letter group. The
    count is of sites the service lists for this county whatever their status or period of record,
    and is not a count of instruments now running. [verified]
