class: measure
label: Educational attainment in Allen County, 2005–2009 and 2019–2023
description: |
  **This corpus has counted the county's schools for four phases and never once counted what its
  adults finished.** It holds enrolment, buildings, districts, report cards, six post-secondary
  institutions and their degrees conferred, and had no figure for how far the people who live here
  actually got. [verified] — [the enrolment](allen-county-school-enrolment-by-race-1988-2024.yml)
  and [higher education](allen-county-higher-education-2023.yml).

  **19.9 per cent of Allen County's adults hold a bachelor's degree or more, against 30.9 per cent
  of Ohio's and 35.0 of the nation's.** [verified] —
  [the American Community Survey](../../catalog/census-acs-summary-file.md), table B15002, 2019–2023
  five-year estimates. The county is 11.0 points below the state and 15.1 below the nation, and both
  gaps clear their combined margins several times over.

      per cent of the population 25 and over, 2019–2023
                              25 and over   <9th   9–12   HS   college   assoc.   bach.   grad.
      United States           228,434,661    4.7    5.9  26.2     19.4      8.8    21.3    13.7
      Ohio                      8,123,344    2.6    5.7  32.3     19.4      9.0    19.0    11.9
      Allen County                 68,410    1.7    5.9  40.7     21.3     10.5    12.4     7.5

  **The deficit is not in the schooling. It is entirely at the far end.** 40.7 per cent of the
  county's adults hold a high school diploma and nothing further, against 32.3 per cent for Ohio and
  26.2 for the nation — 8.4 points above the state on a combined margin of 1.3. Below the diploma
  the county is unremarkable or better: 1.7 per cent never reached ninth grade where Ohio has 2.6
  and the nation 4.7. [verified] — the same table. What is rare here is not finishing school. It is
  carrying on afterwards.

  **This corpus cannot say whether Allen County's adults finish high school at a different rate from
  Ohio's.** The county reads 92.4 per cent with a diploma or more and the state 91.6, a difference
  of 0.8 against a combined margin of 2.2 — an interval that contains zero comfortably. The county
  is above the national 89.4 by 3.0 points against a margin of 2.2, which is a finding and a narrow
  one. [verified] — the same table; see [a survey is not a count](../../decisions/a-survey-is-not-a-count.yml).

  **Inside the county the range is four to one.** [verified] — the same table, by county subdivision.

      per cent of the population 25 and over, 2019–2023
                              25 and over   diploma or more   bachelor's or more
      Richland Township             3,835              97.1                 39.2
      Shawnee Township              8,847              96.8                 33.7
      Marion Township               4,511              90.8                 25.2
      Sugar Creek Township            833              98.9                 22.7
      Amanda Township               1,268              99.2                 22.6
      Bath Township                 6,059              94.3                 22.5
      American Township            10,148              95.1                 20.5
      Perry Township                2,383              95.3                 16.0
      Jackson Township              2,005              95.8                 14.3
      Monroe Township               1,497              94.7                 13.0
      Spencer Township              1,973              86.4                 12.9
      Auglaize Township             2,021              91.1                 12.5
      **Lima**                     23,030              87.8                 11.8

  Richland Township at 39.2 per cent is above the national rate and the only part of this county
  that is; it is also where [Bluffton University](../organization/bluffton-university.yml) stands,
  and the university's own students are mostly under 25 and outside this table's universe, so what
  is being counted there is the people who work at it and live near it. [inference] — the same
  source against [the age structure](allen-county-age-structure-2023.yml).

  **Fourteen years apart, with no year in common, the county gained and the state gained faster.**
  The 2005–2009 five-year file and the 2019–2023 file share no sample year at all. Between them
  Allen County's bachelor's-or-more share rose 4.1 points and Ohio's rose 7.4, so a gap of 7.8
  points became one of 11.0. [verified] —
  [the 2009 summary file](../../catalog/census-acs-summary-file-2009.md) against
  [the 2023 one](../../catalog/census-acs-summary-file.md), table B15002 in both; see
  [an overlap names what changed](../../decisions/an-overlap-names-what-changed.yml) for why those
  two vintages and not the ones between.

      bachelor's degree or more, per cent of the population 25 and over
                              2005–2009   2019–2023   change   margin
      Ohio                         23.6        30.9     +7.4      0.2
      Allen County                 15.8        19.9     +4.1      1.4
      **Lima**                      9.9        11.8     +1.9      2.1   —
      Amanda Township              15.5        22.6     +7.1     15.7   —
      American Township            19.9        20.5     +0.6      3.7   —
      Auglaize Township            17.5        12.5     −5.1      9.6   —
      Bath Township                13.6        22.5     +8.9      5.4
      Jackson Township             13.2        14.3     +1.1     10.9   —
      Marion Township              15.9        25.2     +9.4      7.4
      Monroe Township              13.0        13.0     −0.0     19.7   —
      Perry Township                6.4        16.0     +9.6     10.6   —
      Richland Township            30.7        39.2     +8.5      7.7
      Shawnee Township             28.0        33.7     +5.7      4.3
      Spencer Township              9.4        12.9     +3.5     11.2   —
      Sugar Creek Township         10.0        22.7    +12.7     26.0   —

  A dash marks a change smaller than its own margin. Nine of the thirteen subdivisions are dashed,
  which is what a five-year survey of two thousand people buys.

  **The county did not fall behind by standing still.** Its population aged 25 and over was 68,304
  in the earlier window and 68,410 in the later, a change of 106 people, while Ohio's grew 5.9 per
  cent — so the widening gap is not newcomers arriving somewhere else and diluting a share.
  [verified] — the same file in two vintages. The county's adults are the same number of people, better
  educated than they were, and further behind the state than they were.

  **Four townships moved and the city did not.** Bath, Marion, Richland and Shawnee each gained more
  than their own margin; Lima gained 1.9 points against a margin of 2.1 and is the one subdivision
  large enough for the test to mean much. [verified] — the same file in two vintages.

  **Lima has not measurably moved at either end.** Its bachelor's-or-more share went 9.9 to 11.8 on
  a margin of 2.1, and the share whose schooling ended at a diploma went 44.6 to 45.4 on a margin of
  3.3. Two tests fourteen years apart on 23,000 adults, and neither clears. [verified] — the same
  file in two vintages. The county's own diploma-only share fell 42.2 to 40.7 on a margin of 1.7 and does not
  clear either.

  [open] What the county looked like before 2005. Educational attainment was asked at every
  decennial census from 1940 and published for counties in the printed volumes, and this corpus
  reads such volumes routinely; none of the four it would need has been retrieved. Sixty-five years
  of this measure sit one archive fetch away.
properties:
  parameter: population 25 and over with a bachelor's degree or more, Allen County
  value: "19.9"
  unit: per cent
  as_of: "2023"
  method: |
    Table B15002, *Sex by Educational Attainment for the Population 25 Years and Over*, from the
    2019–2023 and 2005–2009 five-year American Community Survey summary files. The two vintages
    carry the same thirty-five lines in the same order, so male and female cells are summed pairwise
    and grouped identically in both. [verified]

    The 2023 file is table-based and self-describing. The 2009 file is sequence-based: table B15002
    is thirty-five cells beginning at position 90 of sequence 40, the geography is joined on a
    seven-character logical record number at column 14 of a separate fixed-width file, and neither
    file names a variable. [verified]

    Shares are ratio estimates and their margins are computed as the Census Bureau directs, with the
    denominator's variance subtracted where the result stays positive and added where it does not.
    A difference is called only where it exceeds the root sum of squares of the two margins, at the
    90 per cent level the Bureau publishes. [verified] The national row is 2023 only; the 2009 state
    file holds Ohio and its subdivisions and nothing above them. [verified]

    B15003, which the modern file also carries, splits the grades below ninth more finely and has no
    2009 counterpart. It was read and agrees with B15002 on every figure quoted here. [verified]
