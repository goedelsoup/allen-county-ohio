class: measure
label: Allen County manufacturing employment, 1986–2023
description: |
  The measurement this corpus named a period after and did not have. [verified] —
  [County Business Patterns](../../catalog/census-county-business-patterns.md), private employers.

      1986  15,762   1996   9,679   2006   9,298   2016   7,882
      1987  15,145   1997   9,713   2007   8,042   2017   8,420
      1988  14,838   1998   9,886   2008   8,373   2018   8,543
      1989  14,924   1999  10,330   2009   7,211   2019   8,749
      1990  13,134   2000  11,272   2010   7,127   2020   8,917
      1991  11,994   2001  10,106   2011   7,595   2021   8,798
      1992  11,957   2002   8,829   2012   7,253   2022   8,573
      1993  12,196   2003   9,219   2013   7,051   2023   9,133
      1994  11,288   2004   9,058   2014   7,274
      1995  10,919   2005   9,654   2015   7,767

      1986–1997 are SIC (division 20--), 1998 onward NAICS (31----). The break is real.

  **Manufacturing employment in Allen County fell by 55 per cent between 1986 and 2010, from 15,762
  to 7,127.** [verified] — same source. That is [deindustrialization](../period/deindustrialization.yml)
  measured for the first time in this corpus, in the period named for it.

  **And then it stopped, and reversed — three years later than this node used to say.** The trough
  is 2013 at 7,051, not 2010 at 7,127, and the reason for the error is that 2013 was never read:
  this node carried one year in five. From that trough manufacturing rose in eight of the next ten
  years to 9,133 in 2023, its highest since 2005 and 29.5 per cent above the bottom. [verified] —
  the same source, now read for every year. The county's named mechanism of decline stopped
  operating in the early 2010s and the county kept shrinking. [inference] This is the second time
  [a sample is not a series](../../decisions/a-sample-is-not-a-series.yml) has moved a turning point
  in a County Business Patterns node; the first was
  [health care](allen-county-health-care-employment-2010-2022.yml), whose peak was also in a year
  nobody had looked at.

  **Total private employment peaked in 2005, not in 1986.** It rose from 45,917 to 52,699 while
  manufacturing was losing six thousand jobs, then fell to 42,814 by 2022. [verified] — same source.
  So the county replaced its manufacturing losses for twenty years and stopped being able to.
  [inference]

  **After 2010 the losses were not in manufacturing.** Private employment fell 3,709 between 2010
  and 2022 while manufacturing *rose* 1,446, so everything else fell by 5,155. [inference] —
  computed here. Where it fell is now visible: retail trade lost 2,364 employees between 1998 and
  2023, more than manufacturing lost across the same years. See
  [the private employers](allen-county-private-employers-1986-2023.yml).

  **The sentence that stood here was wrong and is the reason this node is no longer the corpus's
  main employment series.** It said County Business Patterns "begins in 1986 with manufacturing
  already at 15,762 and already falling", and called this "the second half of a fall". A BEA series
  reaching back to 1969 shows 1986 as a recovery year — manufacturing bottomed at 14,349 in 1982 and
  had climbed four years running by 1986 — and shows the peak at 18,400 in 1973. [verified] —
  [the long series](allen-county-manufacturing-employment-1969-2022.yml). Nor was it the second half:
  93 per cent of the fall from peak to trough happened after 1986. [inference] See
  [naming a gap is not leaving it empty](../../decisions/naming-a-gap-is-not-leaving-it-empty.yml).

  This node stands because it is a second witness with a different frame — private establishment
  employees rather than jobs — and the two agree on shape where they overlap.
properties:
  parameter: manufacturing employment, Allen County, private employers
  value: "9133"
  unit: employees
  as_of: "2023"
  method: |
    County Business Patterns county files, every year from 1986 to 2023 — the nine-year sample this
    node was built on has been replaced by the full annual run, and none of the nine figures moved.
    Checked by arithmetic
    self-closure: in 1986 the ten SIC divisions sum to the printed county total exactly, and in 2022
    the twenty NAICS sectors do the same. Years between leave residuals of 2 to 239, each year
    carrying at least one sector with suppressed employment. Corroborated at the recent end by
    [the QCEW](../../catalog/bls-qcew.md), which gives 8,661 for 2023 against 8,573 for 2022.
    Government, the self-employed and farms are excluded throughout. [verified]
