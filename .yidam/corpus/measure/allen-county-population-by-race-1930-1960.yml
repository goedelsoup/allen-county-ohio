class: measure
label: Allen County population by race, 1930–1960
description: |
  The four censuses between the county's 1920 composition and its modern counts, read from the
  state population volume of each. [verified] —
  [the state population volumes, 1930–1960](../../catalog/census-population-volumes-1930-1960-ohio.md).

      census   county pop     Negro   share      white*   foreign-born white
      1920         68,223     1,385   2.03%      66,817                2,753
      1930         69,419     1,686   2.43%      67,712                2,219
      1940         73,303     1,916   2.61%      71,372                1,682
      1950         88,183     4,391   4.98%      83,780                1,485
      1960        103,691     7,322   7.06%      96,318                    -
      ---------------------------------------------------------------------
      2023        101,685    10,805  10.6%           -                    -

  \* white of every nativity; the 1960 table stopped splitting it. The four race lines of each
  census sum to that census's printed county total. [verified] — same volumes, and
  [the 1920 compendium](../../catalog/census-1920-state-compendium-ohio.md) for the first row and
  [the 2023 estimates](allen-county-race-2023.yml) for the last.

  **The county's Black population grew by 531 people in the twenty years to 1940 and by 2,475 in
  the ten years after.** 1,385 in 1920, 1,686 in 1930, 1,916 in 1940, then 4,391 in 1950 and 7,322
  in 1960. [verified] —
  [the state population volumes](../../catalog/census-population-volumes-1930-1960-ohio.md). The
  gain of a single decade is four and a half times the gain of the two decades before it put
  together. [inference] — computed here.

  **In figures: 1385 in 1920, 1686 in 1930, 1916 in 1940, 4391 in 1950 and 7322 in 1960.**
  [verified] —
  [the state population volumes](../../catalog/census-population-volumes-1930-1960-ohio.md).

  **The migration that reached most northern industrial cities between 1916 and 1930 did not reach
  this one.** The decades in which Detroit, Cleveland and Youngstown were transformed added 301
  people and then 230 to Allen County. The decade that transformed Allen County is the one after
  1940, when Lima was building locomotives and tanks. [inference] — the census series read against
  [the county's war work](allen-county-world-war-service.yml); the corpus holds no employment
  record by race for those years, so the wartime industry is a reading of the timing and not a
  measured cause.

  **The industry behind that decade is now counted, and the race of the people in it still is not.**
  The county's factories held 6,164 wage earners in 1939 and 14,709 employees in 1947, so the
  workforce more than doubled across exactly the years this migration arrived in. [verified] —
  [the county at 1939 to 1967](allen-county-manufactures-1939-1967.yml). The census of manufactures
  does not tabulate by race and this corpus holds no employment record that does, so the timing is
  now measured on both sides and what joins them is not. [inference]

  **The two curves cross in the 1930s.** In 1920 the county held twice as many foreign-born white
  residents as Black ones, 2,753 against 1,385; in 1940 it held 1,682 against 1,916. Immigration
  had been shut by federal statute in 1924 and internal migration had not yet opened. [verified] —
  the volumes above; see [the foreign-born, 1930–1950](allen-county-foreign-born-1930-1950.yml).

  **Lima's share of the county's Black residents fell across every decade this node can measure.**
  1,243 of 1,385 in 1920, or 89.7 per cent; 1,561 of 1,916 in 1940, or 81.5; 3,278 of 4,391 in
  1950, or 74.7. [verified] —
  [the state population volumes](../../catalog/census-population-volumes-1930-1960-ohio.md) for
  1940 and 1950 and [the 1920 count](allen-county-population-by-race-1920.yml) for the first.
  **It did not keep falling.** By 1970 the share was 86.7 per cent and by 1990 it was 88.9, which is
  where it stood in 1920; the fall the corpus reads in the present begins after that. [verified] —
  [the censuses after this one](allen-county-population-by-race-1970-2020.yml). This node said the
  share fell in every decade it could be measured, and the sentence was true of the three decades in
  it and false of the century. [inference]

      Lima            total     Negro    share    foreign-born white
      1920           41,326     1,243     3.01%                1,917
      1940           44,711     1,561     3.49%                1,091
      1950           50,246     3,278     6.52%                  922

  [verified] — the 1940 and 1950 volumes for the last two rows, the 1920 compendium and abstract
  for the first; each row's race lines sum to the printed city total.

  **In 1940 three of every four Black residents of the county outside Lima were in Bath Township.**
  The county held 1,916 and Lima 1,561, leaving 355; Bath Township held 260 of them, in a rural
  township of 3,438 people. [verified] —
  [the 1940 volume](../../catalog/census-population-volumes-1930-1960-ohio.md), Table 28.

  **Bath Township's figures are the shape of an institution, not a settlement.** Its 1940 population
  runs 2,256 men to 1,182 women; its 260 Black residents run 204 men to 56; its 303 foreign-born
  white residents run 259 men to 44. [verified] — same table.
  [Lima State Hospital](../site/lima-state-hospital.yml) stood on 576 acres in Bath Township and
  held 789 men and 165 women in December 1920. A committed population is what those ratios describe.
  [inference] — the census read against the hospital's own returns.

  **By 1960 the county's Black population is in four townships and almost nowhere else.** Perry
  4,154, Bath 1,614, American 1,060 and Shawnee 478; the other eight townships hold sixteen people
  between them, and the twelve sum to 7,322. [verified] —
  [the 1960 volume](../../catalog/census-population-volumes-1930-1960-ohio.md), Table 25.

  **Those four are the four townships Lima had grown into, and that is why the figure looks the way
  it does.** The 1960 township counts include the parts of the city inside them, as the 1950 ones
  do and the 1930 and 1940 ones do not. [verified] —
  [the townships, 1930–1950](allen-county-townships-1930-1950.yml). Setting Perry's 27.6 per cent
  in 1960 beside Perry's 5.2 per cent in 2023 would be setting a township that contained half of
  south Lima beside a township that does not. [inference] — see
  [two volumes are not one series](../../decisions/two-volumes-are-not-one-series.yml).

  **1970 through 2020 is closed.** Six more censuses now follow this one: 9,234 · 10,975 · 12,313 ·
  13,225 · 12,639 · 12,573, the last of which is not comparable with the first five. [verified] —
  [the censuses after this one](allen-county-population-by-race-1970-2020.yml). The county has a
  Black population at every decennial census from 1920 to 2020 with no gap, and the growth this node
  found in the 1940s continues without a reversal for another sixty years.
properties:
  parameter: population enumerated as Negro, Allen County
  value: "7,322"
  unit: persons
  as_of: "1960"
  method: |
    Read from page images rendered at 250 to 300 dpi, because three of the four volumes have no
    text layer and the fourth's is OCR that garbles every digit. Each census was taken from the
    table that prints race by sex, and each column was added before it was written down: the four
    or seven race lines sum to the printed county total in every year, the twelve townships sum to
    the county in 1940 and 1960, and the four county totals — 69,419, 73,303, 88,183 and 103,691 —
    match the figures this corpus already held from a different volume. The label is the census's
    own for each year and is not modernised. [verified]
