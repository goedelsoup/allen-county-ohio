class: measure
label: What Allen County's twelve school districts employ, 1992–2024
description: |
  **The corpus knew how many children were in these districts and how much was spent on them, and
  not who was in the building with them.** Thirty-three years of staffing sit in the same federal
  file as the enrolment series, one column beside the other. [verified] —
  [the Common Core of Data](../../catalog/nces-common-core-of-data.md), the district directory,
  1992 to 2024.

      year  pupils  teachers  per teacher  aides  counsellors  librarians  library  administration
      1992  22,137      1240        17.85     52           44          24       36             277
      1993  21,987      1210        18.17    55*           48          24      27*            308*
      1994  21,931      1204        18.22     58           48          22       35             339
      1995  21,743      1183        18.38     58           44          18       31             324
      1996  21,616      1203        17.97     57           43          17       32             329
      1997  21,369      1199        17.82     58           45          18       32             342
      1998  21,370      1193        17.91     55           38          18       31             332
      1999  20,994      1188        17.67     66           38          18       31             329
      2000  20,705      1216        17.03     62           39          18       31             345
      2001  19,980      1255        15.92     65           38          18       41             362
      2002  20,016      1266        15.81     77           42          19       43             348
      2003  19,728      1205        16.37     76           40          18       35             348
      2004  19,557      1172        16.69     69           35          17       34             313
      2005  19,609      1197        16.38     71           36          15       33             312
      2006  19,319      1124        17.19    81*           38          13       22             274
      2007  19,158      1138        16.83     96           39          13       21             300
      2008  18,952      1148        16.51     83           36           9       25             293
      2009  17,985      1144        15.72     92           38           8       26             285
      2010  17,830      1160        15.37     87           38           7       28             268
      2011  17,766      1096        16.21     85           36           4       26             267
      2012  17,565      1056        16.63     85           36           3       22             262
      2013  17,634      1050        16.79     87           36           2       20             269
      2014  17,656         -            -      -            -           -        -               -
      2015  17,518       991        17.68     85           36           2       18             258
      2016  17,333      1032        16.80    100           39           2       20             275
      2017  17,107       999        17.12     99           39           2       22             288
      2018  16,921      1030        16.43    107           41           1       20             269
      2019  16,774      1034        16.22    127           39           2       22             274
      2020  16,124      1063        15.17    128           39           2       21             278
      2021  16,127      1004        16.06    121           37           2       16             277
      2022  16,113      680*            -    69*          30*          1*      10*            174*
      2023  15,995      1021        15.67    158           40           3       17             293
      2024  15,850      1003        15.80    155           43           4       15             290

  Every figure is a full-time equivalent for the same twelve districts the enrolment series uses,
  and an asterisk marks a year in which fewer than twelve of them reported the column. Librarians
  are the certified specialist; library is the specialist plus the library's support staff;
  administration is the four columns the form separates — district officers, district office
  support, building principals, and building office support. [verified] — the same directory.

  **The children fell by 28.40 per cent and the teachers by 19.11.** 22,137 pupils and 1,240
  teachers in 1992 against 15,850 and 1,003 now, so the class got smaller: 17.85 pupils to a
  teacher then and 15.80 now. [verified] — the same file, computed here, against
  [the enrolment series](allen-county-school-enrolment-1988-2024.yml).

  **Every other kind of adult in these buildings is more common per child than it was, and one is
  very much less.** [verified] — the same directory, computed here.

      per 1,000 pupils          1992    2024   change
      teachers and aides       58.36   73.06   +25.2%
      administration           12.51   18.30   +46.2%
      guidance counsellors      1.99    2.71   +36.5%
      library staff             1.63    0.95   -41.8%
      certified librarians      1.08    0.25   -76.7%

  **Instructional aides went from 52 to 155.** One aide for every 425.7 children in 1992 and one for
  every 102.3 now; there were 23.85 teachers to an aide and there are 6.47. [verified] — the same
  file. The corpus does not read that as a change in what teaching is, because the same period
  carries a federal special-education mandate and a change in what a district must count as an aide,
  and this file separates neither. [inference]

  **Eleven of the twelve districts employ no certified school librarian.** Twenty-four of them
  worked here in 1992, one in each of the smallest districts and five in Lima. In 2020 the whole
  county reported two, one in Lima and one in Perry; the four it reports in 2024 are all in Lima.
  [verified] — the same directory, by district.

      certified librarians   1992  1996  2000  2005  2010  2015  2020  2024
      Lima                      5     2     3     3     1     1     1     4
      Elida                     3     1     1     1     1     0     0     0
      Shawnee                   3     1     1     1     0     0     0     0
      Bath                      2     2     2     1     1     0     0     0
      Bluffton                  2     2     2     1     0     0     0     0
      Delphos                   2     2     2     2     0     0     0     0
      Perry                     2     2     2     1     1     1     1     0
      Allen East                1     1     1     1     1     0     0     0
      Columbus Grove            1     1     1     1     1     0     0     0
      Pandora-Gilboa            1     1     1     0     0     0     0     0
      Spencerville              1     1     1     2     1     0     0     0
      Waynesfield-Goshen        1     1     1     1     0     0     0     0

  **That fall is a fall and not a reclassification, and the check is on the same form.** The column
  next to it holds library support staff, which is where a certified librarian's work would land if
  a district replaced the post with an assistant: it reads 12 in 1992 and 11 in 2024, and the two
  columns together fall from 36 to 15. In 1992 this county had two certified librarians for every
  library assistant and it now has one for every three. [verified] — same source, both columns.

  **The administrators are the same test run the other way, and it comes out the other way.**
  District officers fall from 76 full-time equivalents in 2005 to 25 in 2006, a drop of 67.11 per
  cent in one year, and eleven of the twelve districts land on two or fewer and stay there.
  Building principals rise from 42 to 55 in the same year. Read as four columns the county sacked
  two administrators in three; read as the group the form defines, administration went from 15.91
  per thousand pupils to 14.18, a fall of 10.87 per cent, and it is higher now than in any year
  before 2001. [verified] — the same directory, computed here. See
  [a column can empty into its neighbour](../../decisions/a-column-can-empty-into-its-neighbour.yml).

  **Two of the thirty-three years are holes, and one of them is the shape of a collapse.** In 2014
  every staffing column is `-1` for all twelve districts: a sentinel and not a zero, the whole
  year's staffing absent from the middle of the run. In 2022 Bath and Lima report no staff at all,
  and the county's teacher total reads 680 against 1,004 the year before — a fall of 32.27 per cent
  that is the two silent districts, which hold 31.56 per cent of the county's children. [verified] —
  the same file, by district. See [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml).

  **The county's school psychologists work for the service center, not the districts.** The column
  opens in 2019 and the twelve districts report 7.0 full-time equivalents between them in 2023,
  nine of them reporting none. In the same file and the same year the
  [Allen County Educational Service Center](../jurisdiction/allen-county-educational-service-center.yml)
  reports 14.45 — twice the twelve districts put together, against an enrolment of zero. [verified] —
  the same directory, the service center's own row.

  **More than a third of the people in these schools are in a column called other.** The file totals
  2,938 full-time equivalents across the twelve districts in 2024 and puts 1,114 of them — 37.92 per
  cent — in other support staff, which is more than teachers, aides, counsellors, librarians and
  every grade of administrator have in common. The bus drivers, cooks, custodians, secretaries,
  nurses and aides who are not instructional are one cell. [verified] — the same directory. That
  total column begins in 2015, so the corpus cannot say how many people worked in these schools in
  1992. [verified] — the same file.

  **This corpus cannot say who teaches in Allen County.** A full-time equivalent is a position and
  not a person: a district reporting 56 teachers may employ fifty-six of them or sixty, and this
  file does not know which. It carries no salary, no years of service, no certification and no
  name, and nothing in it says whether a teacher stayed. [verified] — the columns this directory
  has, listed above.

  [open] Whether the certified librarians left the payroll or moved to another line on it. A
  librarian recertified as a classroom teacher would appear in the teacher column, which is large
  enough to hide twenty full-time equivalents without moving. The state's own certification file
  would answer it and this corpus has not fetched one.
properties:
  parameter: certified school librarians in the county's twelve districts
  value: "4"
  unit: full-time equivalents
  as_of: "2024"
  method: |
    One request per year to the Common Core of Data district directory for Ohio, 1986 to 2024,
    filtered here to the same twelve NCES agency identifiers the enrolment series uses. Values of
    `-1` and `-2` are treated as missing and never summed; a year is marked complete only when all
    twelve districts report the column, and the pupils-per-teacher ratio is left blank in any year
    they do not. Staffing columns are empty before 1992 and the series therefore starts there,
    seven years after the enrolment it is read against. The `year` is the autumn the count was
    taken, so 2024 is the 2024–25 school year. [verified]
