class: measure
label: Allen County households and household type, 1970–2023
description: |
  **Allen County gained 6,969 households between 1970 and 2020 and lost 8,938 people.** The county
  counted 33,966 households at the 1970 census and 40,935 at the 2020 census, a rise of 20.5 per
  cent, over the same fifty years in which its population fell from 111,144 to 102,206 and the
  people living in those households fell from 108,679 to 98,684. [verified] —
  [USA Counties](../../catalog/census-usa-counties.md), table `HSD`, for 1970 through 2010, and
  [the 2020 characteristics file](../../catalog/census-2020-dhc.md), table P16, for 2020.

      year   population   households   persons in hh   per household
      1970      111,144       33,966         108,679            3.20
      1980      112,241       39,168         109,901            2.81
      1990      109,755       39,408         104,723            2.66
      2000      108,464       40,646         102,360            2.52
      2010      106,331       40,619         100,397            2.47
      2020      102,206       40,935          98,684            2.41

  **Ten thousand of this county's occupied houses exist because household size fell.** The 98,684
  people who lived in Allen County households in 2020, arranged as households were arranged in
  1970, would have filled **30,842** of them; the county has 40,935 and a housing stock of 44,563
  units. [inference] — computed here from the series above. Persons per household fell from 3.20 to
  2.41, a quarter, monotonically at every census, and the fall is larger than the population change
  it would be used to interpret. See
  [a head count is not a door count](../../decisions/a-head-count-is-not-a-door-count.yml).

  **Almost all of the growth is one decade.** The county added 5,202 households in the 1970s, 240 in
  the 1980s, 1,238 in the 1990s, *lost* 27 in the 2000s and added 316 in the 2010s — 15.3 per cent
  in the first of those decades and 4.5 per cent across the four that followed.
  [verified] — the same compendium, which publishes the decade change as its own item, against the
  2020 file.

  **Married-couple households peaked in 1980 and have fallen at every census since.** 24,720 in
  1970, 25,067 in 1980, then 23,226, 21,562, 19,494 and 17,911 in 2020 — down 28.5 per cent from
  the peak, on a county whose household total rose 4.5 per cent over the same forty years.
  [verified] — the same two sources, item `HSD130170D` and its siblings against P16.

  **One-person households more than doubled.** 5,802 in 1970 against 12,373 in 2020, a rise of
  113.3 per cent, from 17.1 per cent of all households to 30.2. [verified] — the same two sources,
  item `HSD210170D` and its siblings against P16.

      household type, share of all households
      year   married couple   one person   nonfamily
      1970            72.8%        17.1%           —
      1980            64.0%        21.8%       24.5%
      1990            58.9%        23.6%       26.5%
      2000            53.0%        26.3%       30.6%
      2010            48.0%        27.8%       33.6%
      2020            43.8%        30.2%       36.5%

  **The two lines crossed nothing and closed almost everything.** In 1970 Allen County held 4.26
  married-couple households for every household of one person; in 2020 it held 1.45. [inference] —
  computed from the counts above. Nonfamily households, which the 1970 table does not publish, rose
  from 9,578 in 1980 to 14,927 in 2020.

  **The compendium publishes 1970's family households in thousands and every other cell as a
  count.** Allen County's 1970 family households read `27.5` and mean 27,500, rounded to the
  hundred; the item's unit code is `THO` where the rest of the table is `ABS`. [verified] — the
  compendium's own unit reference, read against the cell. It is the one figure in this series that
  is not exact, and it is not used for any share here.

  **Three printed volumes check the compendium and two of the decades survive it.** Allen County's
  2000 households, family households, married-couple families and one-person households — 40,646,
  28,213, 21,562 and 10,696 — are the four printed in Table 7 of the 2000 Ohio general
  characteristics volume, digit for digit, and the 2010 set matches Table 7 of the 2010 volume; the
  1990 volume prints shares and they agree to the tenth. [verified] —
  [the decennial Ohio volumes](../../catalog/census-general-population-characteristics-1970-2010.md).
  The 1970 row has no second witness anywhere this corpus can reach; see
  [a single witness read once](../../decisions/a-single-witness-read-once.yml).

  **The 2020 household total is the occupied housing unit count this corpus already held.** P16's
  40,935 is exactly H1's occupied units, from two tables of the same file, and the thirteen county
  subdivisions sum to it with no residual. [verified] —
  [the 2020 characteristics file](../../catalog/census-2020-dhc.md), segment 13 against segment 1.
  Every figure in that column except the county's total housing units is protected rather than
  enumerated; see
  [the total is enumerated and the split is not](../../decisions/the-total-is-enumerated-and-the-split-is-not.yml).

  **The survey does not extend this series and says something different from the census.** The
  2019–2023 American Community Survey puts Allen County at 40,928 households, 17,101 of them
  married couples and 13,809 of them one person — 1,436 more people living alone than the census
  found fifteen months earlier, against a survey margin of ±741 on that cell. [verified] —
  [the survey](../../catalog/census-acs-summary-file.md), table B11001. Around 2010 the two
  instruments were within 0.65 per cent of each other on the same quantity: the 2005–2009 survey put
  one-person households at 11,356 and the 2010 census at 11,283. [verified] — the compendium's
  survey items against its census items.

  **The direction is the censuses' and the size of the recent gap is not attributable here.** Every
  census step from 1970 raised the one-person share and lowered the married-couple share, and the
  survey continues both directions; what the survey cannot be used for is the magnitude of the last
  step, because a 11.6 per cent disagreement in fifteen months is not a rate of change. [inference]
  — the two instruments read against each other. The corpus reports the census series as the series
  and the survey as a separate, later instrument.

  [open] Why the survey and the census agreed about this county's one-person households in 2010 and
  disagree by a ninth in 2020. The candidates — the 2020 census's noise infusion, the pandemic's
  effect on survey collection, a change in either instrument's residence rules — are not separable
  from anything in either file. Closing this needs the Bureau's own accuracy metrics for the
  characteristics file, which are published and were not read here.

  **A household is not a family and this file does not say who is related to whom.** [inference] The
  categories here are the householder's relationship to the other people in the dwelling on one
  night, which is a fact about an address rather than about a marriage, a lease or a life. A person
  counted as living alone may have a spouse in a nursing home; two people counted as a
  married-couple household may be the last two of a family of six.

  This series **does not establish** that the county needed the houses it built.

properties:
  parameter: households, household type and household size
  value: "40935"
  unit: households, 2020, against 33,966 in 1970
  as_of: "2020"
  method: |
    The 1970 to 2010 rows come from the compendium's complete-count items, not its sample items:
    the same census years appear twice in that table, from the short form and the long form, and
    they differ by up to 105 households in this county. [verified] The 2020 row is read from the
    characteristics file by logical record number, taking the county's summary-level 050 record
    with geographic component 00. [verified] Persons per household is the file's own item for 1970
    to 2010 and is computed for 2020 as persons in households over households, which reproduces the
    published figure to three decimals at every year where both exist. [verified] The counterfactual
    household count divides 2020's persons in households by 1970's persons per household, using the
    unrounded 3.1996 rather than the published 3.20. [verified]
