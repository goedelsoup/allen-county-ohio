class: measure
label: Poverty in Allen County, 1989–2024
description: |
  **Thirty-one years of how many people in this county are below the poverty line, and the first
  poverty series this corpus has held at all.** The rate runs from 10.6 per cent in 2000 to 20.1 in
  2012 and stands at 14.8 in 2024, on 14,364 people. [verified] —
  [the Small Area Income and Poverty Estimates](../../catalog/census-saipe-county.md), the
  state-and-county files for every produced year.

  **Not one year in the series separates from the year before it.** The file publishes a ninety per
  cent interval on every figure and the interval is about 4.4 points wide, against a range of 9.5
  points across the whole series. Thirty adjacent pairs were tested and none of them clears: the
  four-point rise of 2009 has intervals touching exactly at 16.7, and the four-point fall of 2013
  has intervals overlapping by two tenths. [verified] — the same source, its published bounds. See
  [a series that cannot see a year](../../decisions/a-series-that-cannot-see-a-year.yml).

  **What does separate is spans.** 103 of the 465 possible pairs clear, the shortest gap being two
  years — 2007 against 2009 — and the county's 2000s separate from its 2010s in every direction
  anyone would ask. [verified] — the same source. The endpoints do not: 11.8 per cent in 1989 and
  14.8 in 2024 cannot be told apart by this file, though everything between them says the county
  got poorer and stayed poorer.

  **The county was indistinguishable from the nation until 2008 and distinguishably poorer seven
  times since.** In no year from 1989 to 2008 does Allen County's interval clear the national one.
  In 2009, 2010, 2011, 2012, 2014, 2021 and 2024 it does. [verified] — the same source, the county
  row against the national row. On the point estimates the county is below the nation in every year
  to 2004 and above it in every year from 2007.

  **In figures: the county's rate was 0.922 times the nation's in 1989, 1.264 in 2012 and 1.223 in
  2024.** [verified] — the same source. The 1989 ratio and the 2012 ratio separate; the 1989 and
  2024 ratios do not, which is the difference between a county that got poorer than the country and
  one that can be shown to have. See
  [a rank is an estimate](../../decisions/a-rank-is-an-estimate.yml).

  **Child poverty ran higher than the county's rate in every one of the thirty-one years, and
  reached 30.0 per cent in 2010.** [verified] — the same source, its under-18 estimates. Nearly one
  child in three, in the year after the county's largest single-year rise.

  **This node does not establish that poverty rose in Allen County between 1989 and 2024.** The
  first and last estimates overlap, and a series may not be read from its ends when the file says
  its ends are the same. What it establishes is a level shift between the decades and a county that
  has been measurably poorer than the country in seven years and never measurably richer.

  **The survey and the model disagree by a point and their intervals overlap.** The five-year
  American Community Survey puts the county at 13.1 per cent for 2023 ± 1.2 and this file at 14.1
  with bounds of 11.8 and 16.4. [verified] —
  [the survey](allen-county-income-and-poverty-2023.yml) and the same source. Neither is a check on
  the other, because the model reads the survey as one of its inputs.

  [open] Where in the county the poor are, across the series. This file stops at the county line
  and the survey's tract detail begins in the 2010s, so the 1989 and 1993 estimates have no
  geography inside them at all.
