  method: |
    Every produced year of the state-and-county file was taken: 1989, 1993, 1995, 1997, 1998 and
    then annually from 1999, which the programme's directory listing establishes as the whole set
    apart from 1996. [verified] 1996 exists and its every path answers HTTP 520; it is missing here
    for that reason and not because it was not produced. [verified] Separation is tested by whether
    two ninety per cent intervals overlap, which is conservative and needs nothing the file does not
    carry. [verified] `ohio` and `usa` are the same file's state and national rows, whose intervals
    are far narrower because their samples are far larger. [verified]
