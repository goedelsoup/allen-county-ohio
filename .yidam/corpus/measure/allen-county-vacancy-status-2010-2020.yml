class: measure
label: Why Allen County's housing was empty, 2010 and 2020
description: |
  The table this corpus named as the one it had not fetched. [verified] —
  [the 2020 characteristics file](../../catalog/census-2020-dhc.md), table H5, which closes the open
  question left on [the occupancy count](allen-county-occupancy-2020.yml): the redistricting file
  says how many units were empty and this one says what they were empty *for*.

      Allen County, 1 April 2020            units    of vacant    of all housing
      other vacant                          1,312       36.2%          2.94%
      for rent                              1,265       34.9%          2.84%
      for sale only                           402       11.1%          0.90%
      sold, not occupied                      217        6.0%          0.49%
      seasonal, recreational or occasional     256        7.1%          0.57%
      rented, not occupied                    176        4.9%          0.39%
      for migrant workers                       0        0.0%          0.00%
      all vacant                            3,628      100.0%          8.14%

  **The largest kind of empty house in this county is the kind that is not for sale and not for
  rent.** 1,312 units, more than the 1,265 offered to a tenant and more than three times the 402
  offered to a buyer. [verified] — the same table; the shares are computed here.

  **The file defines that class by exclusion and gives two examples rather than a list.** "If a
  vacant unit does not fall into any of the categories specified above, it is classified as 'Other
  vacant.' For example, this category includes units held for occupancy by a caretaker or janitor
  and units held for personal reasons of the owner." [verified] —
  [the technical documentation](../../catalog/census-2020-dhc.md), definitions appendix. It is the
  remainder term, and in this county it is the biggest number in the column.

  **On any given day 402 houses in Allen County were for sale.** Nine tenths of one per cent of the
  county's 44,563 units, against 1,265 for rent. [verified] — the same table, against
  [the housing units](allen-county-housing-units-2020.yml). A market that thin is what the price
  series has been describing from the other end. [inference] — see
  [the price index](allen-county-house-prices-1975-2025.yml).

  **The two vacancy rates the Bureau publishes leave the largest class out of both of them.** The
  homeowner rate is for-sale-only over owner-occupied plus for-sale plus sold-not-occupied; the
  rental rate is for-rent over renter-occupied plus for-rent plus rented-not-occupied. Seasonal
  units, migrant-worker units and other-vacant units appear on neither side of either line.
  [verified] — [the same appendix](../../catalog/census-2020-dhc.md), B-21.

      Allen County                 2010     2020
      rental vacancy rate         10.2%     8.4%
      homeowner vacancy rate       2.2%     1.4%
      available housing vacancy    4.8%     3.9%
      units outside all three     2,050    1,568

  **So 1,568 of the county's housing units — 3.5 per cent of the stock — are empty and invisible to
  every vacancy rate the census publishes.** [inference] — the Bureau's own three formulas, applied
  here to its own eight rows. Both rates fell over the decade and the residual fell faster, which
  is a fact about the county the rates do not carry.

  **Every category of empty fell except the three that mean a transaction is in progress.** [verified]
  — the same table against
  [the 2010 summary file](../../catalog/census-2010-sf1.md), table H5.

      Allen County                          2010     2020    change
      other vacant                         1,818    1,312     -27.8%
      for sale only                          650      402     -38.2%
      for rent                             1,426    1,265     -11.3%
      seasonal or occasional                 229      256     +11.8%
      sold, not occupied                     178      217     +21.9%
      rented, not occupied                    76      176    +131.6%
      for migrant workers                      3        0          —
      all vacant                           4,380    3,628     -17.2%

  **The county ended the decade with 752 fewer empty houses and 436 fewer houses.** 44,999 units in
  2010 and 44,563 in 2020, while occupied units rose from 40,619 to 40,935. [verified] — the two
  files. The stock did not merely stop growing; it fell, and the fall is larger than the rise in
  occupancy.

  **1,025 dwellings were authorised in the same ten years, so something took away about fifteen
  hundred.** 587 of them houses and 252 of them in buildings of five units or more. [verified] —
  [the Building Permits Survey](../../catalog/census-building-permits.md), 2010 through 2019 county
  files, which sum to the same 1,025 at place grain. If every permit became a unit — an upper bound,
  since a permit is not a house and some are never built — then 1,461 units left this county's
  housing stock in a decade, about 146 a year. [inference] — computed here; see
  [the permits](allen-county-building-permits-1990-2025.yml), whose own caution this uses rather
  than sets aside.

  **Three quarters of the loss is Lima's and it is not a boundary.** The city held 16,784 units in
  2010 and 16,028 in 2020, a fall of 756, while the other twelve subdivisions gained 320 between
  them. Lima annexed once in the decade, in June 2017. [verified] — the two census files and
  [the annexation record](allen-county-annexations-1990-2024.yml). The city was authorised 338
  dwellings over the same years, 23 of them houses, so its own removals are of the order of eleven
  hundred. [inference] — the place files of the same survey, computed here.

      subdivision       2010     2020   change   authorised
      Lima            16,784   16,028     -756          338
      American         6,468    6,648     +180           77
      Shawnee          5,194    5,300     +106          140
      Bath             4,111    4,081      -30           55
      Marion           2,791    2,837      +46          155
      Richland         2,303    2,287      -16           24
      Perry            1,561    1,546      -15           11
      Jackson          1,241    1,286      +45            0
      Spencer          1,230    1,235       +5            7
      Auglaize         1,109    1,136      +27            3
      Monroe             883      862      -21            0
      Amanda             789      802      +13           47
      Sugar Creek        535      515      -20            0
      county          44,999   44,563     -436        1,025

  **At subdivision grain the two sources do not track each other and this node does not pretend
  they do.** Jackson Township authorised nothing in ten years and gained 45 units; American
  Township authorised 77 and gained 180; Marion authorised 155 and gained 46. [verified] — the same
  two sources, read together here. A township's boundary is what is left when the cities are taken
  out of it, a permit is not a completion, and the permit years are calendar years against a census
  taken on 1 April. The county row is where the two can be read against each other. [inference]

  **Where the empty houses are, and how finely the corpus may say it.** The county's 1,312
  other-vacant units are spread over 35 tracts and the five worst hold 400 of them, 30.5 per cent.
  Tract 013800 has 1,265 housing units, 192 of them vacant and 116 of those other-vacant.
  [verified] — [the same file](../../catalog/census-2020-dhc.md), tract records.

  **138 blocks in this county hold housing units and report nobody in any of them.** 530 units, the
  largest such block holding 22, four holding ten or more. [verified] — the same file, block
  records. That figure is stated once and not built on: the housing-unit count on a block is
  enumerated and the occupancy of it is not, so the corpus can say exactly how many units stand
  there and not that they are empty. See
  [the total is enumerated and the split is not](../../decisions/the-total-is-enumerated-and-the-split-is-not.yml).

  **Against Ohio's other eighty-seven counties this one is exactly ordinary.** Its 8.14 per cent
  vacancy rate is 46th of 88, its other-vacant share of stock 48th. Ottawa County on Lake Erie is
  37.94 per cent vacant and Warren County outside Cincinnati is 4.49. [verified] — the same file,
  all 88 county records read here. The middle of the state's range is where the county sits and its
  own interior does not: Lima is 11.2 per cent vacant and Amanda Township 4.5.

  **This corpus cannot say why any particular house in Allen County is empty.** The census asked an
  enumerator to classify a vacant unit and published seven reasons and a remainder; the remainder is
  the largest of the eight, and nothing in this file or any other this corpus holds distinguishes a
  house being renovated from a house nobody wants. [verified] — the definitions appendix of
  [the same documentation](../../catalog/census-2020-dhc.md).

  [open] Whether the county's removals are demolitions. The 436-unit fall and the 1,025 permits
  bound the removals from below and neither says what happened to a building. Lima runs a demolition
  programme and its orders are public records held at the city rather than in any federal file; the
  county auditor's improvement records would also carry it. Neither has been reached.
properties:
  parameter: vacant housing units, Allen County
  value: "3628"
  unit: vacant housing units
  as_of: 2020-04-01
  method: |
    Table H5 of the 2020 Demographic and Housing Characteristics File, Ohio state file, segment 1,
    data fields 101 to 108, joined to the geographic header on LOGRECNO and read at summary levels
    040 state, 050 county, 060 county subdivision, 140 tract and 100 block. The 2010 figures are
    table H5 of Summary File 1, segment 44, data fields 8 to 15, from a fixed-width geographic
    header. [verified] The thirteen subdivisions sum to the county exactly in every column read, and
    the county's 3,552 block records sum to its own row. [verified]

    The three vacancy rates are the Bureau's own formulas from the definitions appendix and not
    ratios of this corpus's choosing; "units outside all three" is the count of seasonal,
    migrant-worker and other-vacant units, which appear in no numerator and no denominator of any of
    them. [inference]

    Permit figures are the sum of the 1-unit, 2-unit, 3-4-unit and 5-or-more-unit columns of the
    annual county file for 1990 onward, taken here for 2010 through 2019, and cross-checked against
    the sum of the twenty-two Allen County rows of the Midwest place file for the same years: 1,025
    both ways. [verified] The census is taken on 1 April and the permit years are calendar years, so
    the two windows differ by a quarter at each end. [inference]
