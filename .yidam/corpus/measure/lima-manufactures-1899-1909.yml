class: measure
label: Lima manufactures, 1899–1909
description: |
  The first measurement of work this corpus has ever held. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md),
  statistics of manufactures.

      average number of wage earners      1899   1,980     value of      1899   $6,222,432
                                          1904   2,733     products      1904   $4,827,556
                                          1909   3,607                   1909   $7,753,877

      1909 in detail    85 establishments · 3,899 persons engaged in industry
                        79 proprietors and firm members · 67 salaried officers · 146 clerks
                        3,607 wage earners on average: 2,474 male, 1,082 female, 51 under 16
                        3,946 wage earners on December 15 · 3,264 primary horsepower

  Written out: **Lima had 85 manufacturing establishments in 1909 employing 3,607 wage earners on
  average, against 2,733 in 1904 and 1,980 in 1899.** [verified] — same source, the comparative city
  table and the detail table for cities of 10,000 to 50,000 inhabitants, which agree on 3,607.

  **The city's workforce grew 82 per cent in a decade and its output grew 25.** [inference] —
  computed here. Value per wage earner fell from $3,143 in 1899 to $1,766 in 1904 and recovered only
  to $2,150 by 1909. Something in Lima's industry became much less productive per head between 1899
  and 1904 and had not recovered by 1909.

  **Between 1899 and 1904 the workforce grew 38 per cent while the value of products fell 22.**
  [verified] — same source, which names Lima as one of five Ohio cities out of thirty-seven whose
  product value fell across that period. [inference] The corpus's own account of
  [the oil boom](../period/lima-oil-boom.yml) puts the field's exhaustion in these years, and a
  collapse in refined value against a rising headcount is the shape that would leave. It is not
  established that the two are connected. [open]

  **Thirty per cent of the wage earners were women** — 1,082 of 3,607 — and 51 were under sixteen.
  [verified] — same source. The two industries the volume names as Lima's leading ones are
  **"tobacco manufactures and locomotives"**, which is a workforce of cigar makers and a workforce
  of machinists in one city. [verified] — same source. See
  [the locomotive works](../site/lima-locomotive-works-plant.yml).

  **Lima was in the group of Ohio cities with products valued between $5,000,000 and $10,000,000**,
  of thirty-seven cities over 10,000 people. [verified] — same source.

  **These figures count only what was inside the city line.** The volume marks Lima's row with a
  footnote: "Figures do not agree with those published in 1904, because it was necessary to revise
  the totals in order to include data only for those establishments located within the corporate
  limits of the city." [verified] — same source. [open] Whether
  [the Solar refinery](../site/lima-refinery.yml), which is outside every municipality today, was
  outside the corporate limits in 1909 is not established here — Lima annexed from
  [Shawnee](../place/shawnee-township.yml) in 1944 and between 1980 and 1990, so its line has moved
  since. If the refinery was outside then too, the county's largest industrial installation is
  absent from every figure above.

  [open] Any measurement of manufacturing employment after 1909. This node covers three years, all
  of them before [deindustrialization](../period/deindustrialization.yml) begins.
properties:
  parameter: manufacturing wage earners and value of products, city of Lima
  value: "3607"
  unit: wage earners
  as_of: "1909"
  method: |
    Census of Manufactures, taken for the calendar years 1909, 1904 and 1899. Read from rendered
    images of a 400-dpi scan and checked two ways: the two tables in the volume that report Lima
    independently agree on 3,607, and the 1909 detail row's components sum to its stated totals
    both for persons engaged and for wage earners on December 15. Establishments inside the
    corporate limits only. [verified]
