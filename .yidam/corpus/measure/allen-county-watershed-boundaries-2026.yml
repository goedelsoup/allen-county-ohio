class: measure
label: Allen County's watershed boundaries, 2026
description: |
  **Thirty-two subwatersheds cover this county and every one of them is flagged as having had its
  boundary moved by a road.** [verified] —
  [the Watershed Boundary Dataset](../../catalog/usgs-watershed-boundary.md), layer 6, clipped to
  the county polygon in EPSG:3734. The `HUMod` codes and the ground they cover:

      code  units   acres     share   what it means            in the polygon domain?
      TF       32   260,359  100.00%  Transportation Feature   no — it is a line code
      RS        5    56,246   21.60%  Reservoir                yes
      LE        4    55,138   21.18%  Levee                    no — it is a line code
      DD        2    23,011    8.84%  Drainage Ditch           no — retired into AW
      IT        2    17,842    6.85%  Interbasin Transfer      no — retired into AW
      MA        2    16,476    6.33%  Mining Activity          yes

  **Four of the six codes are not in the domain the federal standard gives this field.** The
  standard defines `HUMod` twice: on the boundary *line* it is what *"alters the location of the
  hydrologic unit boundary"*, and `TF` and `LE` are in that list; on the 12-digit *polygon* it is
  what *"alters the natural delineation"* of the unit, and the stated domain is
  `AW, GF, GL, IF, KA, LA, MA, NC, NM, OC, OF, PD, RC, RS, UA, WD`. `DD` and `IT` are in neither —
  both were folded into `AW Artificial Waterway`, whose definition names them as superseded.
  [verified] — [the standard](../../catalog/usgs-wbd-federal-standard.md), §6.3.7.4 and §6.4.2.3.
  **Twenty-five of the 32 units carry no in-domain code at all**, and the standard's own advice for
  this case is to check the metadata or ask the state steward. [inference]

  **So the four `LE` units are not four levees.** The code is defined as *"an artificial bank to
  confine a stream channel or limit adjacent areas subject to flooding; alters the natural boundary
  location"* — a statement about where a cartographer put a line. FEMA's National Flood Hazard
  Layer returns no levee for this county, the effective flood insurance study's levee table reads
  "[Not Applicable to this Flood Risk Project]", and
  [the National Levee Database](../../catalog/national-levee-database.md) holds no feature of any
  kind here or in nine counties around it. [verified] — the three sources, queried here. The four
  units are Dug Run-Ottawa River, Lima Reservoir-Ottawa River, Lost Creek and Honey Run, and each
  also carries `RS`: they are the ring in which Lima's upground reservoirs stand, whose embankments
  are 38 to 53 feet of earth. [inference] — see [the dams](allen-county-dams-2026.yml).

  **And `TF` on all thirty-two is a flag, not a share.** Measured against the county's roads and
  railroads, of the boundary's 261.28 miles inside the county:

      within        of a road       of a railroad    of either
      25 ft         19.52 mi  7.5%    2.88 mi  1.1%   22.31 mi   8.5%
      50 ft         32.37    12.4%    5.00     1.9%   37.02     14.2%
      100 ft        54.10    20.7%    6.50     2.5%   58.73     22.5%
      250 ft        99.54    38.1%   10.25     3.9%  104.63     40.0%

  [verified] — [TIGER/Line roads](../../catalog/census-tiger-roads.md) and rails, 2024, computed
  twice by different routes that agree to a tenth of a per cent. The median distance from this
  boundary to the nearest road is **394 feet**.

  **There is a real effect and it is a fiftieth of the size the flag reads as.** Against three
  controls sampled the same way — every fiftieth foot — the share of a line lying within 25 feet of
  a road is **7.5 per cent for this boundary, 4.2 per cent for random points in the county, 4.1 per
  cent for the petitioned ditches and 1.9 per cent for the mapped stream network**. [inference] —
  computed here. So a watershed boundary here does seek roads, at about 1.8 times chance, and **a
  stream avoids them**: water goes under a road at a bridge, and a line drawn on a map runs along
  one. See [a presence flag is not an extent](../../decisions/a-presence-flag-is-not-an-extent.yml).

  **No elevation model touched these lines.** Every one of the 64 boundary segments inside the
  county carries `LineSource` `DRG24` — *"delineated from 1:24,000-scale Digital Raster Graphics"*,
  which is a scanned paper topographic quadrangle — and 39.1 per cent of the mileage adds
  `ORTHO40`, a 1:40,000 aerial photograph. **`NED`, `DEM` and `LIDAR` appear nowhere in this
  county**; across a nine-county box they appear on 32 of 2,000 segments. [verified] — the
  `WBDLine` layer. This is the standard's own baseline and not a defect: §4.1 sets 1:24,000 as the
  floor and §4.2.1 makes the DRG the preferred base.

  **The county's other watershed map was made from LiDAR.** The engineer's 175 ditch watersheds are
  named `#1321-Lidarws` and the rest; the federal 32 were traced off paper. Two delineations of one
  county, one instrument each, and the corpus holds both. [verified] —
  [the ditch maintenance service](../../catalog/allen-county-ditch-maintenance.md); see
  [the petitioned ditches](allen-county-petitioned-ditches-2026.yml).

  **One unit has more than one outlet.** `041000070204` Sixmile Creek-Auglaize River is `HUType`
  `M`, Multiple Outlet, against `S` Standard on the other 31, and 17,733 of its 19,126 acres are in
  this county. [verified] — the same layer, whose `HUType` field *does* publish its coded-value
  domain where `HUMod` does not.

  **The county drains to four subbasins and this corpus has said three.** Auglaize `04100007` holds
  222,481.72 acres of it, Blanchard `04100008` 35,466.98, Upper Scioto `05060001` 2,301.75 and
  **St. Marys `04100004` 108.80** — the four summing to the county's area exactly. [verified] —
  layer 4, clipped here; the Scioto figure is within 1.25 acres of
  [the elevation node's](allen-county-elevation-2026.yml) independently computed 2,303.0. The
  St. Marys ground is a single block of **108.68 acres in Spencer Township** on the county's
  western line, plus 0.12 acres of sliver, in unit `041000040205` Prairie Creek-Saint Marys River.
  Its water reaches the Maumee at Fort Wayne rather than by way of the Auglaize.

  **It holds no census block, which is why nothing here had seen it.** Every statement this corpus
  has made about which basin the county lies in was made by block composition, and a method that
  counts blocks cannot see ground that has none. See
  [the basin](../natural-feature/maumee-river-basin.yml), whose opening sentence said three
  subbasins and could name two.
properties:
  parameter: 12-digit hydrologic units covering Allen County
  value: "32"
  unit: subwatersheds
  as_of: "2024-08-15"
  method: |
    Layers 6 (12-digit units), 4 (subbasins) and 0 (`WBDLine`) of the Watershed Boundary Dataset
    service, taken as GeoJSON in EPSG:3734 and clipped to the Census 2020 county polygon requested
    from TIGERweb in the same projection. [verified] `as_of` is the layer's own `LoadDate`,
    1723704945000 milliseconds, and not the date of the survey the lines were traced from, which
    the file does not carry. Forty of the 12-digit units intersect the query envelope and 32 have
    area inside the county; 85 boundary segments intersect it and 64 have length inside.
    Road coincidence is computed two ways and both are reported only because they agree: once by
    buffering the road union and intersecting the boundary, once by sampling the boundary every
    fifty feet and taking the distance to the nearest road with a spatial index. The controls use
    the second method with the same spacing, and the random control is 27,629 points — the same
    count as the boundary's samples — drawn in the county polygon under a fixed seed. [inference]
    Every share here moves with its tolerance and none is reported without one.
