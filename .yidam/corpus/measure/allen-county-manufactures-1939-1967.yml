class: measure
label: Allen County manufactures, 1939–1967
description: |
  Five more censuses of the county's factories, taken from the state chapter of each volume.
  [verified] —
  [Census of Manufactures, Ohio area statistics, 1939–1967](../../catalog/census-of-manufactures-area-statistics-1939-1967.md).

      census   establishments   employees   production workers   value added
      1929                108       6,588*                    -   $18,544,201
      1939                 92       6,164*                    -   $16,455,649
      1947                  -       14,709                    -   $73,143,000
      1954                136       14,691               10,577   $99,158,000
      1958                155       13,526                9,763  $140,299,000
      1963                151       14,897               11,015  $213,827,000
      1967                153       16,400               12,200  $244,600,000

  \* wage earners, average for the year — not the same column as the four below it. The 1929 and
  1939 volumes count wage earners; from 1947 the tables count all employees and report production
  workers separately. [verified] — same source, the column headings, and
  [the 1929 volume](../../catalog/census-of-manufactures-1919-1929.md) for the first row.

  **In figures: 6588 in 1929, 6164 in 1939, 14709 in 1947, 14691 in 1954, 13526 in 1958, 14897 in
  1963 and 16400 in 1967.** [verified] — same volumes.

  **The forty years this corpus could not see are measured, and the county's industrial peak is not
  in them.** The highest figure any census inside the gap returns is 16,400 in 1967, and the federal
  employment series that begins two years later opens at 17,623 and peaks at 18,400 in 1973.
  [verified] — the five volumes and
  [the long series](allen-county-manufacturing-employment-1969-2022.yml). The guess this corpus
  recorded at 1929 — that the peak sat somewhere inside the unmeasured forty — was wrong, and the
  series rises into the modern one without a break. [inference] — computed here.

  **What the Depression cost this county was a fifth of what it cost Ohio.** Allen County's wage
  earners fell from 6,588 in 1929 to 6,164 in 1939, a loss of 424 and of 6.4 per cent. Ohio's fell
  from 712,616 to 598,397, a loss of 16.0 per cent. [verified] —
  [the 1939 volume](../../catalog/census-of-manufactures-area-statistics-1939-1967.md), Tables 1
  and 2, against
  [the 1929 volume](../../catalog/census-of-manufactures-1919-1929.md), Table 2. The county held
  two and a half times better than the state it is in. [inference] — computed here.

  **The war is the discontinuity, and no census measures it.** No census of manufactures was taken
  for any year between 1939 and 1947. The county comes out of that hole with 14,709 employees
  against 6,164 wage earners going in — and even setting the two instruments against each other at
  the 1954 ratio of production workers to all employees, 1947 holds about 10,590 production workers
  against 1939's 6,164, a rise of 72 per cent. [inference] — computed here; see
  [two volumes are not one series](../../decisions/two-volumes-are-not-one-series.yml).

  [open] What the county's factories did between 1940 and 1946. Every installation this corpus
  associates with the war — [the tank plant](../site/lima-army-tank-plant.yml),
  [the tank depot](../site/lima-tank-depot.yml), the medium tank programme at
  [the Locomotive Works](../site/lima-locomotive-works-plant.yml) — is inside a window in which the
  census was not taken.

  **Then twenty years in which the count barely moves and the money triples.** Employment stands at
  14,709 in 1947, 14,691 in 1954, 13,526 in 1958, 14,897 in 1963 and 16,400 in 1967 — a range of
  2,874 across twenty years. Value added over the same span goes from $73,143,000 to $244,600,000.
  [verified] —
  [the five volumes](../../catalog/census-of-manufactures-area-statistics-1939-1967.md). Most of
  that is not the price level: the county's payroll per employee rose from $3,937 in 1954 to $7,268
  in 1967 while value added per employee rose from $6,749 to $14,915, so output per head grew about
  as fast as pay. [inference] — computed here. This corpus holds no price index and cannot separate
  the two. [open]

  **A third of the county's factory workforce built vehicles.** The 1967 volume's industry table
  gives Allen County 5,400 employees in transportation equipment, in nine establishments of which
  eight had twenty or more people — against 2,600 in machinery except electrical, 800 in food and
  500 in chemicals. [verified] —
  [the 1967 volume](../../catalog/census-of-manufactures-area-statistics-1939-1967.md), Table 6.
  The same group held 3,480 employees in 1958 and 4,500 in 1963, so it grew by 55 per cent in nine
  years while the county grew by 21. [inference] — computed here from the 1958 and 1967 volumes.

  **And it took seven of every ten dollars of new plant.** Transportation equipment accounted for
  $23.0 million of the county's $32.8 million of new capital expenditure in 1967, and for $67.8
  million of its $244.6 million of value added. [verified] — same table. [inference] — the two
  ratios computed here.

  **Petroleum refining never appears in either industry table, and its absence is a disclosure
  rule.** The tables show separately every industry group above a size threshold "except those that
  would disclose figures for individual companies", and Allen County has one refinery. [verified] —
  the headnote to Table 6 in
  [the 1958 volume](../../catalog/census-of-manufactures-area-statistics-1939-1967.md). In 1967 the
  four groups shown hold 9,300 of the county's 16,400 employees, so 7,100 stand in groups the
  volume will not name — [the refinery](../site/lima-refinery.yml) among them. [inference]
properties:
  parameter: manufacturing employees, Allen County
  value: "16400"
  unit: employees
  as_of: "1967"
  method: |
    Census of Manufactures, taken for the calendar years 1939, 1947, 1954, 1958, 1963 and 1967 and
    read from page images of five archive.org scans; none of the five has a usable text layer for
    tables. Establishments are those inside the county, on a $5,000 minimum through 1939 and on the
    Bureau's later size rules afterwards. Four population columns printed beside the manufacturing
    figures — 73,303 and 44,711 for 1940, 88,183 and 50,246 for 1950 — reproduce census counts this
    corpus already holds, and were checked before any figure here was written down. The 1967
    volume's Lima area row equals the sum of Allen, Putnam and Van Wert in eleven of twelve columns
    exactly. [verified]

    The 1958 figure is printed three times and not identically: 13,526 in the 1958 volume, 13,534 in
    the 1963 volume's retrospective column, and 13,543 in that volume's row for the same area under
    its other name. This node takes the 1958 volume's own. The spread is seventeen people.
    [verified]
