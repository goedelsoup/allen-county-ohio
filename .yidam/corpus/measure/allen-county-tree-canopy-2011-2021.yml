  method: |
    Canopy is published as per-cent cover per pixel; the acreage is the sum of those percentages
    over the county divided by a hundred, which is the only reading that makes the figure additive
    — the same convention this corpus uses for impervious surface. [verified] Values above 100 are
    fill; one pixel of this county carries 254 in 2021 and none does in any other year, and it is
    excluded from that year's mean and from the pixel-by-pixel difference. [verified] The county
    mask is the 1,170,809 pixels used by
    [the annual summary](allen-county-land-cover-change-1985-2023.yml). [verified] `acres_ge10` and
    `acres_ge50` count ground, not canopy: they are the acreage of pixels at or above that per cent
    cover. [verified]
