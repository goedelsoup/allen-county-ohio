class: measure
label: Allen County's stream network, 2026
description: |
  **Allen County holds 735.22 miles of mapped channel.** 1,150 flowlines of the federal flow
  network touch the county; clipped to its boundary they run 735.22 miles, against 2,225.6 miles
  of driveable road. [verified] —
  [USGS NHDPlus High Resolution](../../catalog/usgs-nhdplus-high-resolution.md), clipped in
  EPSG:26916, and [the roads](allen-county-roads-2010-2024.yml). Three miles of road to a mile of
  water, and 1.83 miles of channel to the square mile of land.

  **Two miles in three of it are dry part of the year.**

      intermittent stream       468.57 mi   558 reaches
      perennial stream          174.17      249
      artificial path            79.90      318
      canal or ditch              9.82        8
      connector                   2.74       17

  [verified] — the same source, by the `FCode` labels the service publishes on its own renderer.
  The artificial paths are lines drawn through standing water so the network joins up; the county's
  eight canal-or-ditch reaches are one feature, and it is
  [the canal](miami-and-erie-canal-in-allen-county-2026.yml).

  **461.80 miles of it carry no name at all — 62.8 per cent.** Thirty-six named streams account
  for the other 273.42. [verified] — same source.

  **Naming tracks permanence and nothing else.** Of the 468.57 intermittent miles, 407.27 are
  unnamed — 86.9 per cent. Of the 174.17 perennial miles, 140.58 are named — 80.7 per cent.
  [verified] — same source. A channel that runs all year got a name and a channel that runs after
  rain did not, which is a fact about the people who named them.

  **The county is headwater country.** 412.50 miles are Strahler order 1 and 33.11 are order 5,
  the highest here; 367 reaches are flagged as headwaters and they carry 356.35 miles, 48.5 per
  cent of the network. [verified] — same source. Nothing large rises here because nothing large
  can: the county is 407 square miles at the top of two basins.

  **Where it all goes, in four answers.** 383.06 miles reach [the Ottawa River](../natural-feature/ottawa-river.yml)
  first, 269.37 reach [the Auglaize](../natural-feature/auglaize-river.yml) without passing through
  it, 78.39 reach [the Blanchard](../natural-feature/blanchard-river.yml), and 3.66 miles in
  [Auglaize Township](../place/auglaize-township.yml) reach the Mississippi. [verified] — same
  source, by walking each reach's main stem downstream to the first named trunk. One reach of 0.73
  miles in American Township reaches nothing: it ends at a mapped sink.

  **By township, and Lima is the driest place in the county.**

      Amanda      80.82   Marion    68.64   Shawnee      53.18
      Jackson     80.77   Richland  60.81   Spencer      46.74
      Perry       76.55   Bath      59.97   American     33.23
      Auglaize    71.73   Monroe    56.09   Sugar Creek  32.04
                                            Lima         14.67

  [verified] — same source, clipped to the 2024 county subdivisions. Lima holds 3.38 per cent of
  the county's land, 12.61 per cent of its road and 2.00 per cent of its water. [inference] —
  computed here against [the roads](allen-county-roads-2010-2024.yml).

  **This file cannot say which of these channels somebody dug.** Allen County's ground is prime
  farmland because it was drained, and a drained county's watercourses are largely ditches; the
  network classes 9.82 miles as canal or ditch and 468.57 as intermittent stream, and offers no
  field that would separate a straightened creek from a cut one. [inference] — see
  [what the soils say](allen-county-soils-2026.yml).
properties:
  parameter: mapped stream channel in Allen County
  value: "735.22"
  unit: miles
  as_of: "2026"
  method: |
    NetworkNHDFlowline features intersecting the envelope −84.42,40.62 to −83.86,40.94, taken as
    GeoJSON in two pages of a thousand and clipped to the 2024 TIGER county polygon in EPSG:26916.
    1,792 flowlines intersect the envelope and 1,150 have length inside the county. Every mile
    here is clipped length, not the reach's own `LengthKm`. [verified] Class counts are of reaches
    with any length inside the county, so a reach crossing the line is counted once in its class
    and contributes only its inside miles. [verified] The trunk assignment walks `levelpathi` and
    `dnhydroseq` downstream from each reach to the first level path whose reaches are named for a
    trunk, and is read from reaches rather than paths. [verified] — see
    [a level path is not a river](../../decisions/a-level-path-is-not-a-river.yml).
