class: measure
label: Local option liquor elections in Allen County, 2003–2012
description: |
  **Thirty liquor questions in eight elections, precinct by precinct, and this county passed
  twenty-five of them.** [verified] —
  [the Secretary of State's local option reports](../../catalog/ohio-sos-local-issue-reports.md),
  sixteen of them read here. 5,528 votes yes and 3,599 no across ten years: the smallest electorate
  and the most particular question on any ballot in Ohio.

  **A local option is put in one precinct and often about one business, and the report names it.**
  Twelve of the thirty carry the establishment: a Kroger and a Wine Sellers in American Township, a
  Duke & Duchess BP on the Harding Highway in Bath, a Pony Keg in Shawnee, Killbilly's in
  Spencerville, an Iguana Grill and a Loyalty Club in Lima, a D & G Mini Mart in Auglaize Township,
  Luke's Bar & Grill in Bluffton, an Olive Garden and a Red Lobster in Perry Township. [verified] —
  the same source. The other eighteen give the precinct alone.

      where                questions
      Lima                         6
      American Township            5
      Bluffton                     4
      Bath Township                3
      Spencerville                 3
      Perry Township               3
      Delphos                      2
      Auglaize Township            1
      Shawnee Township             1
      Lafayette                    1
      Cairo                        1

  **Two restaurants in one precinct were refused on one day, by six votes and by five.** Perry
  Township precinct N, 8 November 2005: the Olive Garden 119 to 125 and the Red Lobster 119 to 124.
  The same precinct refused a third question in November 2010, 139 to 151, and has passed none in
  this record. [verified] — the same source.

  **The narrowest thing this county has ever approved is a filling station.** The Duke & Duchess BP
  on the Harding Highway in Bath Township precinct D carried 136 to 134 on 2 November 2004 — a
  two-vote margin out of 270. [verified] — the same source.

  **One precinct answered two questions oppositely on the same day.** Spencerville precinct B, 8
  November 2005: form 5-R1 carried 104 to 71 and form 5-R2 lost 81 to 96. Whatever separates the two
  forms, this electorate distinguished them by 32 points in one visit to the booth. [verified] — the
  same source.

  **And the separation holds across the county.** Eight questions on form 5-R1 were put in these ten
  years and eight passed, at a mean yes share of 65.3 per cent; twenty-two were put on form 5-R2 and
  seventeen passed, at 58.0. All five refusals are R2. [verified] — the same source; the shares are
  computed here. **No copy of any report this corpus holds says what R1 and R2 are.** The 2004
  reports print the lettered question texts — off-premise sale, on-premise sale, spirituous liquor by
  the glass, Sunday sale — and the columns that carry the returns are labelled by form and number
  instead, with no key. [verified] — the same source, all sixteen of them.

  **Bluffton is not dry and this record is where the corpus finds it out.** Four questions in
  Bluffton's precincts A, D and E between 2006 and 2011, all four carried, the largest at 130 to 41.
  [verified] — the same source; see [the village](../place/bluffton.yml).

  **Two questions in the record have no answer in it.** Spencerville precincts B and C were
  certified to the ballot of 4 November 2003 for the Bowersock Brother Post 6772 and American Legion
  Post 191, and that year's report is the list of questions and not the return. [verified] — the
  November 2003 local option report, which carries no vote column at all.

  **One of the reports is filed under another election's name.** The local option report in the March
  2004 primary directory is titled for the general election of 7 November 2000, and its two Allen
  County rows — the Kroger and the Iguana Grill — are the two the Secretary's own summary table
  counts for 2 March 2004. [verified] —
  [the report and that election's total table](../../catalog/ohio-sos-local-issue-reports.md).

  **This corpus cannot say whether any of these questions changed what a shop sold.** A local option
  authorises a permit class in a precinct; whether the permit was then issued, and to whom, is in the
  Division of Liquor Control's records and not in an election return. [inference] — the reports carry
  a question, a precinct and two numbers, and nothing after the election.

  [open] What forms 5-R1 and 5-R2 ask. The Ohio Revised Code numbers the local option questions and
  the Secretary of State prints the numbers; the form itself would say. Neither is held here.
properties:
  parameter: local option liquor questions decided in Allen County
  value: "30"
  unit: ballot questions
  as_of: "2004-03-02/2012-11-06"
  method: |
    Sixteen local option reports, 2003 through 2012, parsed here. Their layout is not the layout of
    the other issue reports: a county name on the first row of its block and blank thereafter, then
    the precinct or establishment, then the form code, then the yes and no columns. Rows are
    attributed to Allen County by carrying the last county name seen. [verified]

    Thirty questions carry returns and two do not; the two are November 2003, whose report is a list
    of certified questions rather than a result. [verified] The March 2004 report's own title names
    the wrong election and its contents are confirmed against the Secretary's summary table for that
    date. [verified]

    Establishments are named because the source names them and they are businesses and veterans'
    posts rather than people. [inference] Passage is a simple majority of the votes reported.
    [inference]
