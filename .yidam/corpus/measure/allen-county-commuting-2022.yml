class: measure
label: Who comes and goes to work in Allen County, 2022
description: |
  Half the jobs in this county are held by people who do not live in it. [verified] —
  [LEHD Origin-Destination Employment Statistics](../../catalog/lehd-lodes.md), LODES8, all jobs,
  2022.

      jobs located in Allen County                     48,730
        held by people who live in the county          24,461   50.2%
        held by people who commute in                  24,269   49.8%
      jobs held by Allen County residents              42,835
        in the county                                  24,461   57.1%
        outside it                                     18,374   42.9%
      net                                              +5,895

  **The three flows, in one line.** 24,461 people both live and work in Allen County, 24,269 commute
  into it, and 18,374 residents leave it for work — on 48,730 jobs located here and 42,835 held by
  people who live here. [verified] — same source.

  **The county draws 5,895 more workers than it sends**, and 42,643 people cross its line in one
  direction or the other on a working day. [inference] — computed here from the rows above.

  **Where they come from and where they go are not the same counties.** The largest sources of
  in-commuters are Auglaize with 3,298, Putnam 2,986, Van Wert 2,016, Hardin 1,453 and Hancock
  1,007 — the ring of rural counties around this one. The largest destinations for residents who
  leave are Auglaize 1,988, **Franklin 1,723**, Hancock 1,458, Putnam 1,371 and Shelby 1,118.
  [verified] — same source.

  **Franklin County is a hundred miles away and this corpus does not read it as a commute.** The
  1,723 are spread across many Columbus tracts, the largest holding 79, so it is not one employer's
  administrative address; it is what a file that has passed disclosure avoidance looks like at small
  grain. [inference] See
  [the flow is real and the cell is not](../../decisions/the-flow-is-real-and-the-cell-is-not.yml).

  **Lima holds 46.1 per cent of the county's jobs and 37.2 per cent of its employed residents.**
  22,460 jobs in the sixteen tracts whose internal point falls inside the city, against 15,950
  residents with jobs. [inference] — computed here, on the same sixteen tracts used for
  [life expectancy](allen-county-life-expectancy-2010-2015.yml). The city is a net importer of
  workers inside a county that is a net importer of workers.

  **What the net flow is worth, from a source that counts dollars instead of jobs.** The Bureau of
  Economic Analysis subtracts an adjustment for residence from earnings where they are earned to
  reach earnings where the earner lives, and for Allen County that adjustment is
  **−$516,666,000** in 2024 — 12.0 per cent of the $4,310,695,000 earned inside the county line.
  [verified] — [BEA's county personal income tables](../../catalog/bea-county-personal-income.md);
  see [personal income](allen-county-personal-income-1969-2024.yml). It has been negative in every
  one of the fifty-six years the series covers, deepest at −16.0 per cent in 1990.

  **Twelve per cent of the earnings against 13.8 per cent of the jobs.** The 48,730 jobs located
  here are 13.8 per cent more than the 42,835 held by residents, and the dollar figure is 1.8
  points below that. [inference] — computed here from the rows above and the same BEA file. The two
  are close and they are not two independent witnesses: BEA estimates its residence adjustment from
  journey-to-work data of the same census family this file descends from. A small disagreement
  between measurements that share an ancestor is what
  [an exact match is a question](../../decisions/an-exact-match-is-a-question.yml) says to expect
  and to record.

  **The three flows are alike in what they pay.** Of jobs held by residents working in the county,
  47.1 per cent are in the file's top earnings band, above $3,333 a month; of in-commuters' jobs,
  50.8 per cent; of out-commuters', 49.4. [verified] — same source. The corpus expected the
  in-commuters to hold the better-paid work and they do not measurably.

  **Two independent counts of the county's jobs agree within two per cent.** 48,730 here for 2022
  against 49,690 covered jobs in 2024. [inference] —
  [the wage file](allen-county-wages-2024.yml). They are different years, different programmes and
  different definitions of a job, and they land 960 apart.

  **A third pair of programmes says the same thing for eleven years running.** The county's jobs are
  counted where they are by the employer's insurance filings and its working residents are counted
  where they live by a household estimate, and in every year both have covered, the first number is
  larger than the second. [verified] — the jobs column from
  [QCEW](../../catalog/bls-qcew.md) annual county files, the residents column from
  [Local Area Unemployment Statistics](../../catalog/bls-laus.md).

      year  jobs in the county  employed residents  difference
      2014          49,814              45,682       +4,132
      2015          50,014              45,670       +4,344
      2016          50,406              46,514       +3,892
      2017          50,931              46,866       +4,065
      2018          50,828              46,379       +4,449
      2019          50,165              46,684       +3,481
      2020          47,761              44,088       +3,673
      2021          48,379              45,017       +3,362
      2022          49,136              45,336       +3,800
      2023          49,577              45,682       +3,895
      2024          49,690              45,720       +3,970

  **Eleven years, every difference positive, none smaller than 3,362 and none larger than 4,449.**
  [inference] — counted here from the table above, on the same dataset pair.

  **In figures, the eleven differences: 4,132 in 2014, then 4,344, 3,892, 4,065, 4,449, 3,481,
  3,673, 3,362, 3,800, 3,895 and 3,970 in 2024.** [inference] — read from the table above. There is
  no trend in them; the largest is 2018 and the smallest 2021, and the series ends where it began.

  **The three programmes agree on the sign and not on the size, and the reason is definitional.**
  For 2022 the pair above puts the net at +3,800 where the table at the head of this node puts it at
  +5,895. The household estimate counts a resident who works for herself; the insurance filings do
  not count the job she made. So the resident column is the larger of the two definitions and the
  net it produces is the smaller. [inference] — computed here; neither figure is corrected toward
  the other.

  **The net is small and the gross is enormous, and only the gross is a fact about commuting.**
  Somewhere between 3,800 and 5,895 more people work here than live-and-work here, on 42,643
  crossings of the county line in a working day. A county could post that net with a tenth of that
  traffic. [inference] — computed here from the rows above.
properties:
  parameter: jobs located in the county, and where their holders live
  value: "48730"
  unit: jobs
  as_of: "2022"
  method: |
    LODES8 origin-destination files for Ohio, `JT00` — all jobs — for 2022, filtered to
    origin-destination pairs with a block in Allen County on either end, plus the auxiliary file for
    workers living outside Ohio. Counties are read from the first five digits of a block identifier
    and "Lima" from the tract whose internal point falls inside the city's 2020 boundary, which is a
    statement about where a tract's centre is. Earnings bands are the file's own `SE01`, `SE02` and
    `SE03`. Every total here is a sum over thousands of cells; no cell is quoted. [verified]
