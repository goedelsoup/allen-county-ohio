class: measure
label: Municipal elections in Bluffton and Beaverdam as their paper reported them, 1939–1959
description: |
  **The village's weekly reported its own elections office by office and vote by vote, and that is
  the control on what the same paper knows about [Lima](lima-mayors-1939-1956.yml).** [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), the election-week issue of each year
  below read in full.

  **1939 — the whole government in one story.** W. A. Howe (R) was elected mayor 713 to 322 over
  A. D. Wells (D) in "one of the heaviest off year balloting in the history of the town". James West
  (R) took the clerk's office 733 to 289; Samuel Bixel (D) was re-elected treasurer 544 to 413; Lee
  Coon (D) was returned as marshal for a third term 779 to 248. Council came out three and three —
  Munson Bixel, Armin Hauenstein and Cleon Triplett against Menno Badertscher, Evan Basinger and
  R. A. Patterson. [verified] — same source, 9 November 1939.

  **And the same story records how the seat had been filled the year before.** Howe was the sitting
  mayor, and had become mayor in 1938 as president of the town council, "filling the vacancy caused
  by the resignation of J. Norman King who was elected to that office two years ago". [verified] —
  same source. It is the earliest account this corpus holds of a municipal vacancy in this county
  being filled, and the rule it shows — the president of council steps up — is the same one
  [Lima used in 1945](lima-mayors-1939-1956.yml) when its mayor took a week's holiday. [inference]

  **1943 — unopposed, and most of the village stayed home.** Howe was re-elected for a third
  consecutive term with no opponent. 468 votes were cast out of an eligible vote the paper
  estimated at over 1,200, and 330 of them were for mayor. [verified] — same source,
  4 November 1943.

  **1945 — a write-in beat a man who had no opponent.** Charles Aukerman (R) was elected mayor over
  W. A. Howe (R) by 225 to 208, in "one of the biggest upsets in the history of Bluffton politics".
  Howe was on the ticket seeking a fourth term and had drawn no Democratic opposition; the paper
  attributed the result to "local Republican factional differences". 619 ballots were cast in the
  village's four precincts and only 433 of them were marked for mayor. [verified] — same source,
  8 November 1945.

  **186 electors who voted did not vote for mayor**, which is what an uncontested office does to a
  ballot and is the reason a write-in needed only 225 votes to carry it. [inference] — computed
  from the two figures in the line above.

  **1947 — the losing side tried the same weapon.** "Interest in local politics was stimulated
  during the week before election by a write-in campaign to reelect W. A. Howe for mayor", and
  roughly 900 ballots were cast, which the paper put at 75 per cent of the village and "more than
  double the usual off-year vote". [verified] — same source, 6 November 1947. The result of the
  mayor's race is not legible on the page that carries it.

  **1955 — and a custom stated outright.** David L. Risser (D) was elected mayor over Joseph L.
  Urich (R) by 354 votes, with council split three and three. "The new president of council and vice
  mayor will probably be Democrat Francis Reichenbach. According to custom council selects the
  councilman with the highest number of votes for that position." [verified] — same source,
  10 November 1955.

  **1957 — "Mayor Risser Only Democrat To Survive Republican Sweep Of Municipal Offices", and the
  village elected its first councilwoman**, Mrs. Stella Lauriat. [verified] — same source,
  7 November 1957.

  **1959 — a councilman moved up and the second woman arrived.** Wilbur B. Amstutz (R) defeated
  Harold F. Klingler (D) 425 to 366, and the Republicans took four of the six council seats. Miss
  Lois Basinger polled 460 votes to become "the second woman to municipal office in the town's
  history". [verified] — same source, 5 November 1959. Two women in twenty-one years of this run,
  and both in the last three of them. [inference] — computed from the two reports.

  **Beaverdam is in it too, and it is smaller by an order of magnitude.** Donald E. Barber beat
  Walter B. Beck for mayor 116 to 43 in 1957, in the village's only contested race that year; in
  1959 Robert Snodgrass (R) beat Richard Kizer (D) 119 to 40, with every other office also
  contested and the whole ticket printed with its vote. [verified] — same source, 7 November 1957
  and 5 November 1959. Bluffton's mayoral vote in the same two elections ran in the hundreds on
  each side.

  **The paper reaches further back than its own run, through a nostalgia column.** "From News
  Grandfather Read" reprints its issue of November 1917 — M. M. Murray (R) elected mayor of
  Bluffton over A. C. Spangler (D) by 109 votes, the village voting 274 to 203 for woman suffrage
  and 318 to 166 dry — and "News Our Father's Read" reprints November 1927, where Fred Triblehorn
  (R) beat A. D. Gratz 450 to 415. [verified] — same source, 7 November 1957, which carries both.
  Those two are the only Allen County election returns this corpus holds from before 1939.
  [inference]

  **The line does not close, and the paper is why.** W. A. Howe is named as mayor of Bluffton in
  May 1942, April 1944, May 1946, April 1951 and September 1952 — that is, both before the 1945
  election he is reported to have lost and for years after it. [verified] — same source, five
  further issues.

  **Two readings fit and nothing in this source chooses between them.** Either Aukerman's write-in
  term was brief, or Howe returned in 1947 and the 1946 mention is an ordinance republished over
  the signature of the mayor who first signed it. [open]

  [open] Which of those two readings is right, the 1947 count, and the villages' own records of any
  of it. The instrument is the Bluffton and Beaverdam council minutes, which this corpus does not
  hold.
properties:
  parameter: municipal elections in Allen County villages reported with returns
  value: "8"
  unit: elections
  as_of: "1959"
  method: |
    The election-week issue of each odd year from 1939 to 1959 that the archive holds, read page by
    page from the ALTO OCR: 1939, 1943, 1945, 1947, 1955, 1957 and 1959. 1941, 1949, 1951 and 1953
    have no issue in the week after the election and are absent for that reason and not because
    nothing was printed. Six of the seven read carry a Bluffton mayoral result and two carry
    Beaverdam's, which is the eight counted below; 1947 carries the campaign and not the count.
    Vote totals are as printed, including the ones the paper itself labels unofficial. [verified]
