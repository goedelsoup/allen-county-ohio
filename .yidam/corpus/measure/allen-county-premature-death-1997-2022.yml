class: measure
label: Premature death in Allen County, 1997–2022
description: |
  Years of potential life lost before age 75, per 100,000 and age-adjusted, in twenty-four
  overlapping three-year windows — the corpus's first measurement of how long people here actually
  live, as against how long a model says they can expect to. [verified] —
  [County Health Rankings](../../catalog/county-health-rankings.md), trends file, measure 1.

      window       Allen     Ohio       US   deaths under 75
      1997-1999     7,162    7,678    7,705       1305
      1998-2000     7,308    7,660    7,615       1310
      1999-2001     7,506    7,653    7,569       1311
      2000-2002     7,599    7,643    7,535       1327
      2001-2003     7,928    7,637    7,499       1349
      2002-2004     7,920    7,617    7,411       1310
      2003-2005     7,819    7,625    7,345       1264
      2004-2006     7,319    7,590    7,275       1205
      2005-2007     7,427    7,580    7,209       1228
      2006-2008     7,428    7,512    7,090       1229
      2007-2009     7,373    7,495    6,959       1266
      2008-2010     7,003    7,457    6,811       1255
      2009-2011     6,759    7,449    6,704          —
      2010-2012     6,849    7,466    6,622       1282
      2011-2013     6,843    7,534    6,605       1306
      2012-2014     7,142    7,566    6,601       1363
      2013-2015     7,435    7,734    6,658       1413
      2014-2016     8,473    8,048    6,783       1488
      2015-2017     9,033    8,492    6,901       1515
      2016-2018     9,037    8,606    6,940       1497
      2017-2019     8,211    8,545    6,907       1494
      2018-2020     8,518    8,713    7,282       1604
      2019-2021     9,338    9,394    7,972       1787
      2020-2022    10,482    9,740    8,352       1908

  [verified] — same dataset; Allen County, Ohio and the United States rows. The last column is the
  count of deaths before seventy-five in the three years, and the file has none for 2009–2011.

  **The county has gone from healthier than America to a quarter worse than it, and the crossing is
  early.** Allen County is below the national rate in the first three windows only — 7,162 against
  7,705 in 1997–1999 — and above it in the twenty-one since, ending 25.5 per cent above.
  [verified] — same dataset. [inference] — the comparison is this corpus's.

  **It is not that the county got worse first. America got better and the county did not.** The
  national rate falls at every one of the first fourteen steps, from 7,705 to 6,605; Allen County's
  in the same span goes 7,162, up to 7,928, back to 6,843 — it ends within 320 of where it started
  while the nation improves by 1,100. [inference] — computed here.

  **In figures, taking every third window: the county's rate runs 7,162, 7,599, 7,819, 7,428, 6,759,
  7,142, 9,033, 8,518 and 10,482, against a national 7,705, 7,535, 7,345, 7,090, 6,704, 6,601,
  6,901, 7,282 and 8,352.** [verified] — same dataset, rounded to whole years lost per 100,000.

  **Then both rise, and the county rises further.** From its low of 6,759 in 2009–2011 the rate is
  up **55.1 per cent** to 10,482. The national rate over the same span is up 24.6 per cent.
  [inference] — computed here.

  **The count says the same thing without a denominator in it, which matters here.** Deaths before
  seventy-five in Allen County were 1,306 in the three years 2011–2013 and **1,908** in 2020–2022, a
  rise of **46.1 per cent**, while the county's under-75 population in the same two windows fell 4.0
  per cent, from 293,386 to 281,611 person-years. [verified] — same dataset, numerator and
  denominator columns. That comparison is worth stating separately because the publisher flags two
  breaks in this series, at 2004–2006 and 2019–2021, and both are changes to how the population
  denominator was estimated. [verified] — [the trends codebook](../../catalog/county-health-rankings.md).

  **Against Ohio the county is usually the better of the two, and in the last window it is not.**
  Allen sits below the state rate in seventeen of the twenty-four windows, by as much as 9.3 per
  cent in 2009–2011; in 2020–2022 it is 7.6 per cent above, its worst standing against the state in
  the series. [inference] — computed here.

  **Nothing here says why.** The measure counts deaths and not their causes. [inference] — computed
  here. This corpus does not infer a cause from a curve; see
  [what the county dies of](allen-county-early-deaths-by-cause-2020-2022.yml) and
  [the overdose series](allen-county-drug-overdose-deaths-2020-2025.yml), which are counts of their
  own and not an explanation of this one.

  [open] Whether the rise is concentrated in Lima. This file has no grain below the county, and the
  only sub-county mortality the corpus holds is
  [a tract life table for 2010–2015](allen-county-life-expectancy-2010-2015.yml), which ends before
  most of the rise.
properties:
  parameter: years of potential life lost before age 75 per 100,000, age-adjusted, Allen County
  value: "10482"
  unit: years per 100,000
  as_of: "2022"
  method: |
    Read from the publisher's trends CSV, which carries a `yearspan` rather than a release year, so
    the series is one measure across twenty-four windows rather than twenty-four releases of a
    measure. Windows overlap by two years and consecutive values are not independent. The rate is
    age-adjusted to the 2000 US standard population; the numerator column is the count of deaths
    before seventy-five, which is not what the publisher's codebook says it is and was established
    by matching the national column against CDC WONDER exactly. See
    [the catalog entry](../../catalog/county-health-rankings.md). [verified]
