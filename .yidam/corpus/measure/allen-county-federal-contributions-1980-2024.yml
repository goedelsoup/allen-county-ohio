class: measure
label: Federal campaign contributions from Allen County, 1980–2024
description: |
  **This corpus has counted how Allen County votes for eleven phases and never counted what its
  politics costs.** Presidential returns to 1856, turnout, precincts, registration, poll workers and
  ballot issues, and not one dollar. [verified] —
  [the presidential vote](allen-county-presidential-vote-2000-2016.yml) and
  [the turnout](allen-county-turnout-2004-2024.yml).

  **In the 2023–24 cycle 1,331 people with an Allen County address gave $611,489 to federal
  campaigns, parties and political committees.** Twelve presidential cycles, in dollars weighted to
  the county's share of each ZIP code's population. [verified] —
  [the Commission's bulk files](../../catalog/fec-bulk-individual-contributions.md), deduplicated
  and netted of refunds here; see
  [weight a crosswalk by what it carries](../../decisions/weight-a-crosswalk-by-what-it-carries.yml).

      cycle   donors     given   in 2024 $   per head   median   largest   top ten
      1980       61    35,606     135,549       1.21      860     1,000     47.7%
      1984        6     2,884       8,707       0.08      500     1,000    100.0%
      1988       45    34,128      90,494       0.82      500     1,000     40.9%
      1992      135    62,625     140,021       1.28      500     5,000     21.8%
      1996      200    99,056     198,042       1.82      300     5,000     27.4%
      2000      239    98,562     179,545       1.66      300     3,500     23.0%
      2004      357   146,027     242,493       2.26      300     4,000     20.5%
      2008      433   310,452     452,318       4.24      500    25,000     27.1%
      2012      424   320,455     437,831       4.13      500    12,500     20.4%
      2016      809   366,332     478,795       4.62       35    15,000     20.9%
      2020    1,279   629,417     762,877       7.46       25    15,000     37.0%
      2024    1,331   611,489     611,489       6.06       24    50,000     24.3%

  **Real giving per resident is five times what it was in 1980 and the number of givers is
  twenty-two times.** $1.21 a head to $6.06, with a peak of $7.46 in 2020; 61 people to 1,331.
  [verified] — the same file, deflated by
  [the consumer price index](../../catalog/bls-cpi.md). The county lost 11,375 residents over the
  same forty-four years. [verified] — [the population](allen-county-population-2024.yml).

  **The median itemized gift fell from $860 to $24.** In 2024 dollars the 1980 median is $3,274 and
  the 2024 median is $24, a fall of a hundred and thirty-six times, while the largest single
  contribution rose from $1,000 — the legal maximum then — to $50,000. [verified] — the same source,
  deflated the same way. Both tails grew at once: the top ten givers were 20.4 per cent of the
  county's money in 2012 and 37.0 in 2020.

  **The 1984 row is the file and not the county.** Six donors and $2,884, against sixty-one and
  $35,606 four years earlier — and the Commission's 1983–84 archive is smaller than its 1979–80 one,
  nationally, at 6.8 megabytes against 8.1. [verified] — the same file, its archive size and its rows.
  Nothing is read from that row.

  **In thirty-three years of these records the county's itemized donors included no factory worker
  and one welder. In the three cycles since 2016 there are 939 contributions from factory workers
  and 353 from welders.** The distinct occupations recorded rose from 336 to 739. [verified] — the
  same file, occupation strings as filed. Whether working people in Allen County began giving or
  merely began being written down is not something this file can separate: a contribution is
  itemized once it aggregates above $200 at one committee, and money routed through a conduit
  aggregates at the conduit, which is far easier to cross. [inference]

  **Who receives it has changed twice.** [verified] — the same file, weighted, by committee.

      1980–1996                                        2000–2012                              2016–2024
      Ohio Republican Finance Cttee   29,580           Jim Jordan for Congress    167,879     Republican National Cttee  110,783
      Oxley for Congress              26,761           John McCain 2008            62,430     Buckeye Values PAC         100,000
      Friends of Voinovich            23,091           Citizens for Josh Mandel    50,008     Jim Jordan for Congress     91,902
      Ohio Republican Party           14,819           Romney Victory              38,545     Friends of Sherrod Brown    78,120
      NRCC Contributions              14,216           Romney for President        36,317     NRSC                        60,645
      Ohio Rep. State Central Cttee    9,310           Voinovich for Senate        34,015     Portman for Senate          58,093
      National Cable Television PAC    7,814           Obama for America           28,100     Trump National Cttee JFC    54,774
      Friends of Mike DeWine           7,559           McCain-Palin Victory Ohio   27,500     Trump MAGA Cttee            50,196

  **The county's own congressman is the largest single recipient of its money in the middle era.**
  $167,879 to Jim Jordan for Congress across 2000 to 2012, more than twice the next committee.
  [verified] — the same source. In the most recent three cycles the two largest are a national party
  committee and a super PAC that received one contribution of $50,000, the largest gift any Allen
  County resident has made in this record. [verified] — the same file.

  **The share of this money that the Commission's own files can assign to a party has fallen from
  98.9 per cent to 52.1.** Joint fundraising committees and conduits carry no party in the committee
  master and no candidate to borrow one from, and they went from nothing to half the money.
  [verified] — the same source against
  [the committee and candidate masters](../../catalog/fec-bulk-individual-contributions.md).

      cycle   Democratic   Republican   unlabelled   labelled   R share   R vote    gap
      1980           791       34,408          406      98.9%     97.8%       —       —
      1988         3,655       27,618        2,855      91.6%     88.3%       —       —
      1992         9,176       40,141       13,309      78.7%     81.4%       —       —
      1996         9,298       73,194       16,565      83.3%     88.7%       —       —
      2000        18,228       56,084       24,249      75.4%     75.5%   67.2%   +8.3
      2004        16,896       97,632       31,498      78.4%     85.2%   66.4%  +18.8
      2008        29,781      239,807       40,864      86.8%     89.0%   60.5%  +28.4
      2012        39,716      216,330       64,409      79.9%     84.5%   62.2%  +22.3
      2016        38,035      200,059      128,238      65.0%     84.0%   69.6%  +14.4
      2020        97,900      327,836      203,680      67.6%     77.0%   70.1%   +6.9
      2024       140,192      178,204      293,093      52.1%     56.0%       —       —

  **Where both can be measured, the money is more Republican than the vote, and the gap has closed
  from twenty-eight points to seven.** In 2008 the county gave McCain 60.5 per cent of its two-party
  vote and Republican committees 89.0 per cent of its labelled money; in 2020 it gave Trump 70.1 per
  cent and Republican committees 77.0. [verified] — the same source against
  [the presidential vote](allen-county-presidential-vote-2000-2016.yml) and
  [the 2020 return](allen-county-presidential-vote-2020.yml).

  **This corpus cannot say whether Allen County's political money has become less Republican.** The
  labelled Republican share falls from 89.0 per cent in 2008 to 56.0 in 2024, and over the same
  years the labelled share of the money falls from 86.8 per cent to 52.1 — and the unlabelled half
  is joint fundraising committees named for candidates of both parties, among them the largest
  Republican ones. The two movements cannot be separated inside this file. [verified] — the same
  source.

  **Read without care the 2024 file says this county gave $1,528,070.** Every record is in the
  archive twice from 2012 on, because the zip holds `itcont.txt` and a `by_date/` partition of the
  same rows; and a contribution made through a conduit is filed again by the committee that banks
  it. Deduplicating on the record identifier halves the figure and deduplicating the conduits takes
  another fifth off it. The naive reading is two and a half times the $611,489 above. [verified] —
  the same file, read three ways.

  **The rule for turning a ZIP code into a county is worth a factor of two.** The 2024 total is
  $454,593 under the eight postal codes that lie wholly in Allen County, $650,446 under the thirteen
  with a majority of their people here, and $959,382 under every code that touches the county at
  all. This node publishes $611,489, weighted by population, and prints the others because a reader
  comparing it with a figure from elsewhere has no other way to know the rules differed. [verified] —
  the same file against [the crosswalk](allen-county-zip-codes-2020.yml).

  [open] The midterm cycles. Twelve presidential cycles were taken and the eleven between them were
  not; a Senate race in Ohio falls in both kinds of year and a House race in every one, so the
  series above is a sample of the county's giving and not the whole of it. The files are the same
  size and the same shape and nothing but time stands in the way.
properties:
  parameter: itemized federal contributions from Allen County residents, 2023–24 cycle
  value: "611489"
  unit: US dollars, nominal
  as_of: "2024"
  method: |
    The Commission's `indiv` bulk file for each of twelve presidential cycles, streamed and filtered
    on the fly to records whose state is OH and whose ZIP begins 458, then reduced to Allen County
    three ways. [verified]

    *Deduplicated.* From 2012 the archive holds `itcont.txt` and a `by_date/` partition of the same
    records, so every `SUB_ID` appears exactly twice; and a conduit files the money it passes on as
    a `24T` while the committee that receives it files the same contributor, date and amount as a
    `15E`, a `15` or a `10`. Reading the 2024 archive without either step gives $1,528,070 against
    $611,489 — two and a half times the figure. A `24T` is kept only where no other row carries the
    same contributor, date and amount. [verified]

    *Netted.* Refunds to contributors, transaction type `22Y`, carry positive amounts in this file
    and are subtracted. [verified]

    *Weighted.* Each record is multiplied by the share of its ZIP code tabulation area's population
    that lives in Allen County, from [the crosswalk](allen-county-zip-codes-2020.yml). Under the
    three alternative rules the 2024 total is $454,593 for the eight wholly-inside codes, $650,446
    for the thirteen majority-Allen codes and $959,382 for every code that touches the county at
    all. [verified]

    A conduit's pass-through is attributed to the committee named in `OTHER_ID` rather than to the
    conduit, because WinRed writes no memo text where ActBlue writes a parseable one and both
    populate that field. Party comes from the committee master where it is filled and from the
    candidate master through the committee's candidate where it is not; committees with neither are
    reported as unlabelled rather than guessed at. [verified]

    Donors are distinct contributor names within a ZIP within a cycle, which merges two people of
    the same name at the same post office and separates one person who moved. [inference] No
    individual contributor is named anywhere in this corpus; employers and occupations are recorded
    because they are properties of firms and of work.
