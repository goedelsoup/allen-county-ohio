class: measure
label: Mayors of Lima named inside the gap, 1939–1956
description: |
  **[The office](../office/mayor-of-lima.yml) said no source here spanned the ninety-nine years
  from 1922 to 2021. One did not span them; it sampled them.** A weekly newspaper published in
  Bluffton, twelve miles up the road, names four different mayors of Lima between 1939 and 1956 and
  a fifth as a former one. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), `sn87076554`.

      1939-11-23  Frank McClain      "swung the economy ax 48 hours after taking office"
      1940-02-08  Frank E. McClain   called a civil service examination for chief of police
      1941-11-20  Frank McClain      re-elected; election expenses of $306.40
      1942-06-04  Frank McClain      48 more parking meters, bringing the city to 365
      1943-11-04  Frank E. McClain   appointed Kermit L. Westbay chief of police
      1944-03-02  A. L. Metheany     council appropriated $10,000 for fire apparatus
      1944-08-31  Allen L. Metheany  "late mayor of Lima"; estate inventoried at $42,797.51
      1945-05-10  William L. Ferguson  welcomed the manager of the Lima Reds
      1945-07-19  W. I. Ferguson     his fire bureau closed City Hall's third floor to meetings
      1945-08-09  W. L. Ferguson     incumbent; one of two candidates in a non-partisan primary
      1945-09-13  William Ferguson   on vacation; the president of council acted in his place
      1948-10-28  Frank E. McClain   "Former Mayor of Lima, Ohio", running for county commissioner
      1950-11-16  Corbin Shook       "former Lima mayor", named in his sister's obituary
      1956-09-06  Clyde L. Welty     proclaimed a "Symphony Day"

  **Not one of those fourteen mentions is an election report.** Every name above arrived inside a
  story about something else — a police appointment, parking meters, a baseball opener, a probate
  inventory, a symphony, an obituary. [verified] — same source, all fourteen pages read. The one
  row that reports a Lima election, 20 November 1941, reports it as the *cost* of one: an expense
  account filed with the county board of elections, printed beside Bluffton's because the
  comparison was the story. So this table dates people to days and establishes no term, no
  beginning and no end for any of them. This corpus cannot say who was mayor of Lima on any day but
  the fourteen printed above. [inference]

  **What it does establish is that Lima had a mayor, and a council, and a charter.** The office
  [the 1921 history said was abolished](../event/lima-adopts-commission-government-1922.yml)
  effective 1 January 1922 was being held, filled by election and exercising appointment power by
  November 1939, under "provisions of the City Charter and Ohio civil service laws". [verified] —
  same source, 8 February 1940. The ninety-nine-year gap is therefore two gaps with a lit stretch
  between them: 1922 to 1939, and 1956 to 2021. [inference] — computed from the dates above.

  **One mayor died in office and the estate is the evidence.** A. L. Metheany was mayor in March
  1944; by 31 August the paper called him the late mayor and reported the inventory his
  administratrix filed in the Allen County probate court — $900 in personal property, $23,019.67 in
  stocks and bonds, $15,377.84 in accounts and debts receivable, $42,797.51 in all. [verified] —
  same source. See [Allen L. Metheany](../person/allen-l-metheany.yml), and
  [Richard Metheany](../person/richard-metheany.yml), mayor of the same town seventy years earlier.

  **The mayoralty was non-partisan by 1945 and the county offices were not.** "The results of the
  light vote in the non-partisan city primary election were tabulated. Only 6,160 voters went to
  the polls." Three years later the same man who had been mayor ran for county commissioner on a
  ticket headed REPUBLICAN. [verified] — same source, 9 August 1945 and 28 October 1948.

  **A president of council stood in for an absent mayor, and the paper explained it because he was
  a local boy.** "Emil Kempf, former Bluffton boy is mayor of Lima this week. As president of the
  Lima council he becomes head of that city's government during the absence of Mayor William
  Ferguson who is away on a week's vacation." [verified] — same source, 13 September 1945. It is
  the only account this corpus holds of how Lima's seat is filled when the holder is not in it.

  **One of that year's candidates did not live to the primary.** Edward P. Milbaugh, 27, "Lima
  mayoralty candidate and hotel proprietor", was shot dead on 22 July 1945, and in November a
  Putnam County Common Pleas jury convicted a sixty-eight-year-old retired carpenter of Ottoville of
  second-degree murder after three and a half hours; the prosecution said the two had argued over
  the merits of a fraternal order. [verified] — same source, 8 November 1945. The corpus names the
  candidate, who was a public one, and not the man convicted, whose name reaches it only through
  optical character recognition of a neighbouring county's court news. The killing was outside this
  county and is recorded here because the office it touched is inside it.

  [open] Who was elected mayor of Lima in November 1945, and every holder between 1956 and 2021.
  Also the seventeen years from 1922 to 1939: this establishes that the office existed again by
  1939 and says nothing about when it came back. The instrument for all three is a Lima newspaper,
  and no Lima newspaper is digitized in this archive.
properties:
  parameter: mayors of Lima named in a contemporaneous source, 1939–1956
  value: "5"
  unit: named holders
  as_of: "1956"
  method: |
    Four full-text searches of one newspaper title, and the ALTO OCR of every hit page read in
    full. "Mayor of Lima" and "Lima mayor" return 22 hits across 21 issues and supply ten of the
    rows above; "Mayor McClain" supplies two, "Metheany" one, and one more came out of an
    election-week issue read for another purpose. Nothing here is a term: each row is the date the
    paper printed the words, not a date the person took or left office, and no row is used to date
    another. Corbin Shook is counted among the five as a former mayor and is not placed in time.
    [verified]
