class: measure
label: Allen County's interurban railways, 1901–1921
description: |
  Two interurbans served Lima in 1921, three were named in 1905, a fourth ran through the county's
  north-east villages under a name the transportation chapter never uses, and the county chapter
  counts four directions rather than any companies at all.

  **The 1905 transportation chapter names three.**
  [The Western Ohio](../organization/western-ohio-railway.yml), completed spring 1901 and called the
  pioneer traction line of Northwestern Ohio;
  [the Fort Wayne, Van Wert & Lima](../organization/fort-wayne-van-wert-and-lima-traction-company.yml),
  "a close second in importance"; and the Lima & Toledo, "being projected and financed by the same
  gentlemen who own and control our excellent city traction system", with "a great deal of grading
  done". [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  **The township chapters of the same book name a fourth.** "The Lake Erie & Western Railroad and
  the Lima & Findlay traction line pass through [Richland township](../place/richland-township.yml)
  in a southwesterly direction", and through the village of [Beaverdam](../place/beaverdam.yml);
  at [Bluffton](../place/bluffton.yml), "an electric railway passes directly through Main street,
  starting from Toledo and ending in Cincinnati". [verified] — same source.

  **A road can be running at Bluffton and unbuilt at Lima at the same time, and that resolves it.**
  The transportation chapter counts trains *landing passengers in Lima*; a line graded south from
  Findlay would appear in the township chapters as running and in the Lima count as absent.
  [inference] So the corpus records the north-eastern corridor as one route under three names —
  Lima & Findlay in 1905, Lima & Toledo in 1905, and by 1921 the Findlay end of the Western Ohio —
  without asserting that any two of the three are one company.

  **The county chapter counts directions instead, and gets four.** "Traction lines cross the county
  through the county seat in four directions." [verified] — same source. West to
  [Delphos](../place/delphos.yml), [Elida](../place/elida.yml) and Fort Wayne; north-east through
  Bluffton and Beaverdam; south toward Dayton; and east, where [Lafayette](../place/lafayette.yml)
  in 1905 had only "our railroad, and soon-to-be traction line paralleling it". [verified] — same
  source. Three running and one promised is how a chapter counts four. [inference]

  **By 1921 the count is two, and the sources agree on which two.** "There being two interurban
  railways, with their lines touching surrounding cities in every direction ... The Ohio Electric
  and the Western Ohio, with their freight and passenger service, open up a great deal of territory
  contributing to the commercial prosperity of Lima." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **A federal census four years earlier says what the local books cannot: who owned whom.** The 1917
  directory of operating electric railway companies lists the Ohio Electric as an operator, class
  A-Y, with the Fort Wayne, Van Wert & Lima printed in italics beneath it as a lessor, and lists the
  Western Ohio separately as B-X. Of the three companies named in 1905, one operates, one is leased,
  and the Lima & Toledo does not appear under its own name. [verified] —
  [Census of Electrical Industries, 1917](../../catalog/census-electrical-industries-1917.md).

  [open] When the interurban ended in Allen County. The corpus's newest source on it is the 1921
  history, and no held source reaches an abandonment date for either company or a mile of track.
properties:
  parameter: interurban railway companies serving Lima
  value: "2"
  unit: companies
  as_of: "1921"
  method: |
    Read from the transportation, township and county chapters of the 1906 history, the 1921
    history, and the 1917 federal directory. The 1905 figure of three counts names printed in one
    chapter; a fourth name appears in another chapter of the same book and is not added, because
    nothing establishes that it is a fourth company rather than a fourth name. [verified]
