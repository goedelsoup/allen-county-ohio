class: measure
label: Lima population, 1970–1990
description: |
  **53,734 in 1970, 47,827 in 1980 and 45,549 in 1990.** [verified] —
  [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md),
  which marks the 1980 figure `r` for revised. Housing units ran 18,443, 19,096 and 18,666 across the
  same three counts.

  **This locates a peak the corpus said one phase ago it could not see.** Reading only
  [7,567 in 1880, 21,723 in 1900 and 41,306 in 1920](lima-population-1880-1920.yml) against 40,307 in
  2000 — the 1920 figure has since been corrected to 41,326 — the corpus concluded that "eighty
  years net to roughly nothing" and the peak was somewhere inside them. It is: **the city was 53,734
  in 1970**, thirty per cent above its 1920 count and half again what it is today. The rise and the
  fall were both real and the corpus had a chord across them. [inference]

  **And 1970 is the peak, not a lower bound on it.** The four counts this node could not see are
  42,287 (1930), 44,711 (1940), 50,246 (1950) and 51,037 (1960), every one of them below 53,734 and
  each above the one before. [verified] —
  [1960 Census, Number of Inhabitants, Ohio](../../catalog/census-1960-number-of-inhabitants-ohio.md);
  see [the federal series](lima-population-1850-1960.yml). The caveat this node wrote against its own
  figure is answered by evidence rather than dropped.

  So Lima's series, at the census years the corpus holds: 7,567 (1880) · 21,723 (1900) · 41,326 (1920) ·
  51,037 (1960) · **53,734 (1970)** · 47,827 (1980) · 45,549 (1990) · 40,307 (2000) · 35,579 (2020). Between 1970 and 2020 the
  city lost 18,155 people, **33.8 per cent of itself**, while
  [the county](allen-county-population-1940-1990.yml) lost 8,927, or 8.0 per cent. Lima's loss is
  twice the county's, which means the rest of Allen County **gained 9,228** over the same fifty years.
  [inference] — computed from the two series. That is a different story from the one the corpus has
  been telling from four years of recent data, where the ring shrinks too: over the long run the
  ring grew while the city emptied, and only lately have both been falling.

  **And the boundary moved underneath these counts.** Between 1980 and 1990 Lima annexed ground from
  American, Bath and Shawnee townships. [verified] — same source, Geographic Change Notes. So the
  fall from 47,827 to 45,549 happened while the corporation was getting larger, which makes it an
  understatement of the decline inside the old boundary. [inference] This is the first annexation
  event this corpus has ever held, against a
  [comparability caveat](../../skills/boundary-comparability.md) it has carried since genesis.

  **Run against 1960, the comparability check returns the answer that is not an edge.**
  [boundary-comparability](../../skills/boundary-comparability.md) was asked whether 53,734 may be
  set beside [51,037 in 1960](lima-population-1850-1960.yml). It read the two measures, the
  [place](../place/lima.yml) and the [corporation](../jurisdiction/city-of-lima.yml), the
  [annexation record](allen-county-annexations-1990-2024.yml), and every boundary change the corpus
  holds for this city — and it found none between the two dates. The record it searched is not
  silent about Lima. Six boundary events are on it, four into the city and two out of it: 1902,
  1903, 1905 and 1906 from
  [the 1910 supplement's footnote](../../catalog/census-1910-abstract-supplement-ohio.md), 1944
  from [the 1950 volume](../../catalog/census-1950-number-of-inhabitants-ohio.md), and the
  annexations from American, Bath and Shawnee in the 1980s from the volume this node is read out
  of. [verified] — those three sources; see [the place](../place/lima.yml).

  **It is silent about the interval, and finding nothing there is not the same as there being
  nothing.** Every one of those notes is a census volume reporting its own decade; this corpus
  holds no volume for 1970; so nothing in it would have reported a change between 1945 and 1979 if
  there had been one, and the decades on either side of that gap each hold one. [inference] A
  `comparable-to` edge written on this pair would be
  [the claim the apparatus exists to make somebody stand behind](../../decisions/comparability-is-a-judgement-not-a-join.yml),
  manufactured out of a record nobody asked, so **no judgement is written here** — and the absence
  is the run's finding rather than a gap in it.

  **What the risk is, if the line did move.** Annexation moves people into a city without anybody
  moving house, so the gain of 2,697 would be that much too large and the flatness of the 1950s
  that much sharper against it. The peak is not what is at risk: every count after 1970 stands on
  ground at least as large as 1970's, by the annexations this corpus does hold, and every one of
  them is smaller. What an unrecorded annexation would take is the shape of the approach to the
  peak. [inference]

  [open] Whether Lima's corporation line moved between 1960 and 1970. The 1970 *Number of
  Inhabitants* volume's geographic change notes for Ohio would settle it, and no source held here
  can. It is one retrieval, and until it is made the two counts stay unjudged against each other.

  [open] Nothing about the peak. What remains unmeasured is the path between the census years, and
  why the 1950s gained only 791 people before the 1960s gained 2,697.
properties:
  parameter: total resident population, decennial
  value: "53734"
  unit: persons
  as_of: "1970"
  method: |
    Read from the places table of the 1990 Ohio CPH-2 volume. The `value` above is the series
    maximum and also its first term, which made it a lower bound on the city's peak until the
    1960 volume supplied the twelve counts before it. It is the peak. [verified]
