class: measure
label: Allen County's railroads, 1872–1921
description: |
  The network three county histories describe, and what it employed. [verified] —
  [1885](../../catalog/leeson-allen-county-1885.md),
  [1906](../../catalog/miller-allen-county-1906.md) and
  [1921](../../catalog/rusler-allen-county-1921.md).

  **In 1883 there were about 102 miles of main track and 22 miles of side track in the county.**
  [verified] — [the 1885 history](../../catalog/leeson-allen-county-1885.md), compiling the official
  records of 1883. It is the only measurement of the county's railroad extent this corpus holds from
  any year, and it comes two years before
  [the oil strike](../event/lima-oil-strike.yml).

  **The county voted for two of those lines and eight people voted against.** The Boesel railroad
  bill passed the Legislature in April 1872, and at a special election on 25 May 1872 Lima and
  Ottawa Township voted on $100,000 of bonds for the Lima, Lafayette & Mississippi and the Lake Erie
  & Louisville. "Something over 700 votes were cast and only eight of those were against the
  appropriation." Both roads were put through in 1872 and later consolidated as the Lake Erie &
  Western. [verified] — [the 1906 history](../../catalog/miller-allen-county-1906.md).

  **The paper quoted below is now a catalogued title.** The *Allen County Republican* of Lima ran
  weekly from 1877 to its last number, volume 16 number 57 of 17 July 1891, and the Ohio History
  Connection reports film of 4 January 1889 to 17 July 1891 and nothing earlier — so the issue of
  14 March 1879 quoted here survives, as far as any union list knows, only inside the 1906 history.
  [verified] — [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md); see
  [the county's newspapers](allen-county-newspapers-1843-2026.yml).

  **Lima was a railroad town six years before it was an oil town.** In March 1879, at a population
  of about 7,000, the *Allen County Republican* described the city as standing at the crossing of the
  Pittsburg, Fort Wayne & Chicago, the Dayton & Michigan and the Lake Erie & Louisville, with all
  three keeping repair shops there, a street railroad running from the Union Depot, and the Dayton &
  Michigan shops covering some eight acres and employing 200 to 300 men. [verified] — same source,
  quoting the paper of 14 March 1879.

  **Those shops were the largest employer in the county on any figure the corpus holds for that
  decade**, and there is no rival in the 1879 list: the next largest establishments named are
  furniture factories of seven to twenty-five hands. [inference] — computed from the same list.

  **By 1906 two shops employed more than five hundred men each** — the Cincinnati, Hamilton &
  Dayton, successor to the Dayton & Michigan, and the Lake Erie & Western, whose shops came to Lima
  about 1880 — and the city was "one of the five great trunk lines, which center in this city".
  [verified] — same source. Ten fast passenger trains a day passed through Lima on the Chicago &
  Erie alone, besides the mails and the limited express.

  **The lines, and when each arrived.** [verified] — the three histories together; see
  [the first railroad](../event/the-first-railroad-reaches-allen-county.yml) for the three years the
  sources give for the first of them, and [Benjamin Faurot](../person/benjamin-faurot.yml) for the
  last.

      1854  Ohio & Indiana, Crestline-Fort Wayne, later the Pennsylvania
      1858  Dayton & Michigan, later the Cincinnati, Hamilton & Dayton
      1872  Lima, Lafayette & Mississippi and Lake Erie & Louisville, later the Lake Erie & Western
      1881  Toledo, Cincinnati & St. Louis narrow gauge, Shane's Crossing to Delphos, extended to Dayton
            Cleveland, Delphos & St. Louis, leaving the county east of Bluffton
      1883  Chicago & Atlantic, Lima to Marion, opened 1 May, later the Chicago & Erie
      1887  Columbus, Lima & Milwaukee, begun by B. C. Faurot, later the Columbus & Lake Michigan

  **Delphos kept a roundhouse.** In 1921 it held 100 railway employees besides the engineers and
  conductors living in the town, the shops of the Toledo, Delphos & Western — the Clover Leaf — and
  a terminal on the Northern Ohio Railway, with interurban service to Lima and Fort Wayne.
  [verified] — [the 1921 history](../../catalog/rusler-allen-county-1921.md).

  **Two of the three gaps this node opened are closed.** There is now an employment count rather
  than a range: 108 men in Lima's railway yards and 74 in the freight offices in 1905, **182**
  exactly. [verified] — [the traffic of 1905](lima-railroad-traffic-1905.yml). And the interurban is
  held — three companies named in 1905, two serving Lima in 1921, and a federal directory's word on
  who owned whom. [verified] — [the interurban](allen-county-interurban-1901-1921.yml).

  **The mileage gap is not closed and the second figure shows why.** 1905 gives 73 miles of
  *aggregate yard trackage in Lima*, against 1883's 102 miles of *main track in the county*. The two
  cannot be differenced, subtracted or trended: they count different things over different ground.
  [inference] — see
  [the control is the figure that cannot move](../../decisions/the-control-is-the-figure-that-cannot-move.yml).

  **The man the bond bill is named for is in the county's senate roster and cannot be joined to it.**
  A Charles Boesel stands sixteenth of the thirty-five entries in the 1906 history's list of the
  county's state senators, and that list carries no years at all. [verified] —
  [the county in the General Assembly](allen-county-general-assembly-1833-1906.yml). The corpus does
  not assert they are the same man; see
  [an order is not a chronology](../../decisions/an-order-is-not-a-chronology.yml).

  **The Lake Erie & Louisville is where a United States Senator started.** Calvin S. Brice's first
  railroad work was in that road's legal department; he became a stockholder in it as the Lake Erie &
  Western, carried through the Nickel Plate, bought the Northern Ohio because it ran past his boyhood
  farm, and died with plans for a seaboard outlet for the Lake Erie & Western "diverging at Bluffton
  over the Northen Ohio, via Akron and Youngstown to the East". [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md) and
  [the 1921 history](../../catalog/rusler-allen-county-1921.md); see
  [Calvin S. Brice](../person/calvin-s-brice.yml). The Delphos terminal on the Northern Ohio recorded
  above is the county end of that scheme. [inference]

  [open] Main-track mileage for any year but 1883. And the count above is the yards and the freight
  offices only: the shops were the larger employer and remain a floor of "more than 500 men each".
  The corpus cannot say how large the railroad workforce of this county ever was.
properties:
  parameter: railroad main track in the county
  value: "102"
  unit: miles
  as_of: "1883"
  method: |
    Read from the full text of three county histories on archive.org, the 1885 book in two
    independent scans. The mileage is the 1885 book's, compiled from official records of 1883 and
    prefaced "about". The employment figures are as the sources print them: a range for 1879, a floor
    for the shops in 1906, and an exact count for the yards and freight offices in 1905. Nothing here
    averages a range or treats "more than 500" as 500, and the three are not added together. [verified]
