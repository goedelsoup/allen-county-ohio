    because: >-
      One file's own two endpoints. The intercensal series is fitted *between* two enumerations
      rather than projected from one, so 40,307 and 38,771 are the base and the count that the
      same sub-county file was built to run between — a publisher setting the two figures side by
      side, which is the strongest licence this corpus recognises. Two things move underneath and
      both push the same way. **Lima annexed 601 acres in eight acts between June 2002 and December
      2009**, so the later figure counts ground the earlier one did not and the fall of 1,536 is a
      **floor** on the loss inside the 2000 line. And three federal figures exist for 1 April 2000
      — 40,081 in the 2000 volume, 40,307 here, and 41,581 as the 2010 volume restates it after
      moving fifteen hundred people from American Township into the city. A difference taken
      against either of the other two is a different difference, and neither is the one this pair
      states. See [a bound is not a break](../../decisions/a-bound-is-not-a-break.yml).
