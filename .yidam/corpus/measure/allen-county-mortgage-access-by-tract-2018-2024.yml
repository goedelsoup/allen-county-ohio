class: measure
label: Where Allen County's mortgages went, and what they cost there, 2018-2024
description: |
  **The tracts where a mortgage is hardest to get are the tracts where it is dearest to have, and
  the two rank almost together.** Across the county's 34 tracts with enough decisions to rate, the
  correlation between a tract's denial rate and its share of higher-priced loans is 0.828.
  [verified] — [the HMDA register](../../catalog/hmda-loan-application-register.md), seven years,
  the denial rates of [the lending node](allen-county-home-lending-2018-2024.yml) against the
  prices of [the price node](allen-county-mortgage-prices-2018-2024.yml). Denial runs from 9.5 to
  52.0 per cent across those tracts and the higher-priced share from 4.8 to 42.5.

  **All thirty-five tracts are in the `table` property, and the correlation is computed from
  them rather than illustrated by a few.** It used to print six rows, an ellipsis and four more,
  which is enough to show the shape and not enough to check the coefficient or to draw either
  map. [verified] — the same source, row by row.

  **Lending is not spread over this county's houses at anything like an even rate.** The sixteen
  tracts that are majority Lima hold 14,913 one-to-four-family houses and took 2,958 first-lien
  loans in seven years — 19.8 per 100 houses. The other nineteen tracts hold 26,595 houses and took
  11,738 — 44.1 per 100. [verified] — the same source, and its own
  `tract_one_to_four_family_homes` column.

  **In figures: tract 39003013700 holds 522 houses and took 28 mortgages in seven years — one loan
  for every nineteen houses — and 46.4 per cent of them were higher-priced.** At the other end of
  the same county, tract 39003010801 holds 1,894 houses, took 1,577 loans, and 6.0 per cent were.
  [verified] — the same source, by tract. The six thinnest tracts are all inside Lima and the four
  thickest are all outside it.

  **A borrower in the city pays more dollars to close a smaller loan.** The median first-lien loan
  in Lima's tracts is $85,000 and costs $3,181 to close; outside them it is $135,000 and costs
  $2,920. [verified] — the same source. As a share that is 3.65 per cent against 2.07.

  **The city's price premium is real at every size but the largest, where it disappears.** Under
  $50,000 the higher-priced share is 27.8 per cent inside Lima's tracts and 20.0 outside; from
  $50,000 to $100,000, 13.9 against 9.9; to $150,000, 10.7 against 6.1; above $150,000, 4.2 against
  4.5. [verified] — the same source. Whatever is being priced stops mattering at the top of this
  county's market.

  **The largest lender in the county prices the same way inside the city as the market does.**
  Superior Credit Union made 27.0 per cent of the loans in Lima's tracts and 31.2 per cent of those
  outside; its own higher-priced share is 15.7 per cent inside and 7.4 outside. [verified] — the
  same source; see [the lender](../organization/superior-credit-union.yml). One institution and one
  underwriting policy on both sides of the line.

  **This node does not establish that these houses could not be borrowed against.** A loan count is
  a count of loans made, and a tract with few of them may hold owners who did not ask, houses owned
  outright, or landlords who borrow elsewhere. What it shows is where the county's mortgage credit
  went, not what was available. See
  [a denial rate is not an underwriting file](../../decisions/a-denial-rate-is-not-an-underwriting-file.yml).

  [open] How many of the county's houses carry a mortgage at all. The register counts loans made in
  a window and the survey counts owners with a mortgage; neither is the other, and the corpus has
  not put them beside each other.
