  method: |
    "Lima tracts" is the sixteen of the county's thirty-five whose 2020 population is majority
    Lima, the same set the denial work used. [verified] The house counts are the register's own
    `tract_one_to_four_family_homes`, taken from the 2022-2024 rows, so both sides of the ratio come
    from one file. [verified] The tract identifiers change vintage in 2022; the two tracts that
    split are carried on their first successor so that seven years land in one row. [verified] The
    correlation is over the 34 tracts with at least thirty decisions and thirty priced
    originations — every tract but 39003013700, which has 71 decisions and 28 priced
    originations and is in the table with the rest. [verified]

    The table's columns come from two different books and the difference matters. `decisions` and
    `denial_pct` are every application acted on, actions 1, 2 and 3, with no restriction on
    product — the same reckoning [the lending node](allen-county-home-lending-2018-2024.yml) uses.
    `loans`, `priced`, `higher_priced_pct` and `median_loan` are the comparable book
    [the price node](allen-county-mortgage-prices-2018-2024.yml) defines: first liens originated
    on site-built principal residences, 14,703 of them, of which 13,991 report a rate spread and
    a loan is higher-priced above 1.5. [verified] A tract's `priced` is therefore smaller than its
    `loans`, and both are smaller than its `decisions`; reading one column against another from a
    different book is the error this note exists to prevent.
