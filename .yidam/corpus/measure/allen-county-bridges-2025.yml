class: measure
label: Allen County's bridges, 2025
description: |
  **364 highway bridges stand in Allen County**, and not one of the hundred and three the state
  owns is in poor condition. [verified] —
  [the National Bridge Inventory](../../catalog/national-bridge-inventory.md), 2025 Ohio file,
  county code 3.

  **Three owners, three conditions.** Poor is the lowest of the deck, superstructure, substructure
  and culvert ratings being 4 or less.

      owner        bridges   poor    share
      state            103      0     0.0%
      county           242     29    12.0%
      municipal         19      4    21.1%
      township           0      —        —
      all              364     33     9.1%

  [verified] — same source, counted here. Written out: **not one of the state's 103 bridges here is
  in poor condition, 29 of the county's 242 are, and 4 of the municipalities' 19 — 0.0, 12.0 and
  21.1 per cent.** **A bridge in this county is in poor condition or not according to who owns
  it**, and in this edition the ladder runs from the government furthest away to the one nearest.
  [inference] —
  computed here. The corpus does not know why the state replaced its bad bridges and the county did
  not; the obvious answer is money, and no source held here carries either agency's capital budget.

  **The two readings this node could not separate are now separated, and the age one is wrong.**
  The state's median bridge in this county was built in 1970 and the county's in 1982, and 57 of the
  state's 103 predate 1980 against 112 of the county's 242 — so the state's stock is the older of
  the two, not the newer. [verified] — same source, computed here; see
  [the condition series](allen-county-bridge-condition-1992-2025.yml).

  **And the ladder ran the other way inside living memory.** In the 1992 edition twenty-one of the
  state's ninety-six bridges here were in poor condition, 21.9 per cent, against 5.8 per cent of the
  county's. Eighteen of those twenty-one are absent from the 2025 file and the state's holding grew
  from 96 structures to 103, so they were replaced. [verified] — the 1992 and 2025 editions, linked
  on structure number; see [the condition series](allen-county-bridge-condition-1992-2025.yml).

  **The 12.0 per cent in the table above is one edition and it is the odd one.** The county's poor
  count was 5 in the 2023 edition and 31 in the 2024, while Ohio as a whole moved from 4.64 to 4.71
  per cent and none of this county's six neighbours moved at all. [verified] — the Ohio files for
  those editions. The last figure this corpus can compare with the rest of the series is the 2022
  edition's 2.0 per cent. [inference] — see
  [the condition series](allen-county-bridge-condition-1992-2025.yml).

  **No township owns a bridge, and that is the law rather than an accident.** The county engineer
  "shall have general charge of the ... maintenance, and repair of all bridges and highways within
  the engineer's county, under the jurisdiction of the board of county commissioners"; townships
  build and improve roads. [verified] —
  [Ohio Revised Code §5543.01](../../catalog/ohio-revised-code.md). Three hundred and sixty-four rows
  of a federal file agree with one sentence of state law; see
  [the county engineer](../office/allen-county-engineer.yml).

  **The county's own count is 371 and this one is 364, and neither is wrong.** The engineer's office
  reports 371 bridges and over 1,400 culverts. This inventory admits a structure only if it spans
  more than twenty feet, and the rule holds in the data: the shortest of the 364 is 6.4 metres
  against a threshold of 6.1, with no exception. So the seven are not missing — they are short.
  [inference] — computed here; see
  [a farm count is a definition](../../decisions/a-farm-count-is-a-definition.yml).

  **Half of them predate 1980.** 179 of 364 were built before that year, with the peak in the
  interstate decades — 69 in the 1960s and 72 in the 1970s, 39 per cent of the county's bridges in
  twenty years. [verified] — same source, counted here. The median structure is 19.2 metres long;
  the longest is 241.2 metres, a 1964 state structure carrying County Road 185 over Interstate 75,
  a Norfolk Southern line and another county road at once.

  **The oldest was built in 1909 and it is still a county bridge.** [verified] — same source; see
  [the Hay Road bridge](../site/hay-road-bridge.yml).

  [open] Why the state replaced and the county did not. The crossing of condition against year built
  is done and it rules out age; what it cannot reach is the money, and neither the county engineer's
  budget nor the state's district programme is in any source held here.
properties:
  parameter: highway bridges in Allen County
  value: "364"
  unit: structures
  as_of: "2025"
  method: |
    Selected from the 2025 Ohio delimited file on `COUNTY_CODE_003` = 3 and counted here. "Poor" is
    the minimum of items 58, 59, 60 and 62 being 4 or less, which is the Federal Highway
    Administration's own rule; structures with no rating in any of the four are not counted either
    way, and there were none. The count is of structures in the county whatever the owner, which is
    not the same as the count of bridges the county maintains. [verified]
