class: measure
label: Federal contracts performed in Allen County, 2008–2025
description: |
  **$1,088,368,417 of federal contract work has been performed in Allen County since 2008, and
  97.4 per cent of it was bought by the Department of Defense.** [verified] —
  [USAspending](../../catalog/usaspending.md), place of performance, by awarding agency.

      agency                          2008-2025
      Department of Defense         1,060,110,812
      Veterans Affairs                 16,594,375
      General Services Administration  11,081,336
      Transportation                      363,168
      Social Security Administration       84,137
      everything else                     134,589

  **Four firms are 92.2 per cent of it and only one of them is from here.** [verified] — same
  source, by recipient.

      performer                              performed here    what for
      General Dynamics Land Systems Inc.      453,692,926      tanks
      Husky Marketing and Supply Company      328,850,129      jet fuel
      Siemens Government Technologies Inc     119,408,473      the tank plant's utilities
      Superior Forge & Steel Corp             101,917,494      warhead casings

  **Three of those four vanish when the same file is asked who was paid.** $901,951,528 of work
  done on this county's ground is recorded, in the recipient view, against corporate addresses
  elsewhere; Superior Forge & Steel is a Lima firm and appears in both. [verified] — same source,
  both scopes. See [a dollar has two addresses](../../decisions/a-dollar-has-two-addresses.yml).

  **The largest single award names the customer and it is not the United States.** $71,709,279 to
  General Dynamics Land Systems, 30 December 2010 to 2 July 2012, for "(42) MATERIAL SETS FOR THE
  CONVERSION OF M1A2 TANKS TO M1A2S CONFIGURATION FOR THE KINGDOM OF SAUDI ARABIA". [verified] —
  same source, the award endpoint. The plant is
  [the Army's](../site/lima-army-tank-plant.yml), the work is a foreign military sale, and the money
  is an Army contract. [inference]

  **The refinery sells the military jet fuel.** Three awards to Husky Marketing and Supply from the
  Defense Logistics Agency for `TURBINE FUEL, JP8` — $178,794,000 running from March 2009,
  $84,717,360 from April 2010 and $64,361,472 from April 2008. [verified] — same source. Husky is
  the name [the Lima refinery](../site/lima-refinery.yml) was operated under from 2010, and JP8 is
  a kerosene the refinery's own product slate would carry. [inference]

  **The tank plant's utilities are a twenty-two-year contract.** $127,157,950 to Siemens Government
  Technologies for "ENERGY CONSERVATION MEASURES AT JSMC LIMA, OH", 30 December 2016 to 31 May 2038.
  [verified] — same source. It is the longest period of performance in the county's contract record
  and it is about a boiler house. [inference]

  **A Lima forge makes the casings for the largest conventional bomb the Air Force has.** Superior
  Forge & Steel Corp holds five Air Force awards worth $94,389,046 between 2018 and 2025 for
  "BLU-137/B PENETRATOR WARHEAD PRODUCTION" and "MASSIVE ORDNANCE PENETRATOR WARHEAD CASES".
  [verified] — same source, by award. This is the county's own firm in the county's largest
  industry, and the corpus had it in no other file. [inference]

  **The war and the county's payroll are the same series.** Contract dollars performed here run
  $336,002,168 in 2008 and $187,216,406 in 2009, fall to $4,193,943 by 2015, and rise again to
  $83,924,189 in 2020 and $83,167,145 in 2021. [verified] — the same source, by federal year. The
  corpus does not read that as a measure of employment at any plant, because a contract's dollars
  are obligated in the year it is signed and the work runs for years afterwards. [inference]

  **This corpus cannot say how many people in Allen County are paid out of these contracts.** An
  award records an obligation to a company, not a payroll, and the file carries no employment
  figure at all. [verified] — the fields this source has; against
  [the county's private employers](allen-county-private-employers-1986-2023.yml).

  [open] Whether General Dynamics Land Systems is the operator of the tank plant or a customer of
  it. The award data puts $453,692,926 of the company's work on this ground over eighteen years and
  a contract is not an operating agreement; the plant's node has wanted that distinction since it
  was written.
properties:
  parameter: federal contract dollars performed in Allen County
  value: "1088368417"
  unit: dollars
  as_of: "2025"
  method: |
    USAspending's geography, category and award endpoints for county 39003 with award-type codes A,
    B, C and D, filtered on `place_of_performance_locations` for every figure here except where the
    sentence says recipient location. Federal years 2008 to 2025, each running 1 October to 30
    September and named for the year it ends in. Award amounts are obligations recorded against the
    award, not disbursements, and an award's dollars sit in the year it was signed. Every recipient
    named here is a corporation. [verified]
