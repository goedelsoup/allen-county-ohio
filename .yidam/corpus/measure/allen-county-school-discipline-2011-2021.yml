class: measure
label: School discipline in Allen County, 2011–2021
description: |
  **This corpus has counted the county's schoolchildren for thirty-seven years and never once
  counted what was done to them.** Enrolment by race, buildings, staffing, money, graduation and
  proficiency, and no figure for how many were sent home. [verified] —
  [the enrolment](allen-county-school-enrolment-by-race-1988-2024.yml) and
  [the buildings](allen-county-school-buildings-1986-2024.yml).

  **In the 2013–14 school year 30.6 per cent of Allen County's Black schoolchildren were suspended
  out of school, and 8.1 per cent of its white ones.** Nearly one Black child in three. [verified] —
  [the Civil Rights Data Collection](../../catalog/crdc-civil-rights-data-collection.md), the
  county's twelve districts, its own enrolment as the denominator.

      out-of-school suspension, per cent of pupils suspended at least once
              Allen County                        Ohio
      year   enrolled  suspended   all  white  Black  ratio    all  white  Black  ratio
      2011     17,656      1,565   8.9    5.8   21.6   3.74    7.3    4.6   19.0   4.17
      2013     16,786      2,136  12.7    8.1   30.6   3.78    7.5    4.9   19.2   3.96
      2015     16,802      1,972  11.7    7.4   29.1   3.91    7.2    4.1   20.0   4.82
      2017     16,474        987   6.0    3.8   15.7   4.12    6.7    4.1   17.8   4.39
      2020     14,839        820   5.5    3.7   11.8   3.18    2.1    2.0    2.6   1.34
      2021     15,461      1,140   7.4    5.0   16.2   3.23    6.5    4.4   15.1   3.44

  **The county's racial disparity is smaller than Ohio's and its rate is higher for everybody.** The
  ratio between the Black and white rates is 3.2 to 4.1 here against 3.4 to 4.8 statewide, and in
  every year to 2015 both of this county's rates run above both of the state's — 8.1 against 4.9 for
  white children in 2013 and 30.6 against 19.2 for Black ones. [verified] — the same source. What is
  unusual about Allen County is not that it suspends Black children at several times the rate of
  white ones, which Ohio does too; it is that it suspends more of both. [inference]

  **Suspension halved between 2015 and 2017 and Ohio's barely moved.** The county went from 11.7 per
  cent to 6.0 while the state went from 7.2 to 6.7. [verified] — the same source. Nothing retrieved
  here names a policy, a superintendent or a board resolution, and the corpus records the size and
  the date of the fall without a cause. [inference]

  **In the pandemic year Ohio nearly stopped suspending children and this county did not.** The
  state's rate fell from 6.7 per cent to 2.1 — a fall of more than two thirds — while Allen County's
  fell from 6.0 to 5.5. The county suspended at 2.6 times the state rate that year, the widest gap
  in the series. [verified] — the same source. Both figures cover 2020–21, a year in which children
  were in a building for part of it and at home for the rest, in proportions this file does not
  give. [inference]

  **The other columns are small and one of them is not.** [verified] — the same collection.

      year   in-school suspensions   referred to police   arrested   Black share of suspensions
      2011                   1,186                    6          0                        35.1%
      2013                   1,189                    4          0                        35.6%
      2015                   1,453                   21          0                        37.0%
      2017                   1,061                   29          4                        39.6%
      2020                     718                    2          0                        33.7%
      2021                   1,107                    0          0                        30.5%

  **Black children are between 13.9 and 15.7 per cent of the county's roll and between 30.5 and 39.6
  per cent of its out-of-school suspensions in every one of the six years.** [verified] — the same
  source, computed here. The share of suspensions rose while the share of the roll did not.

  **This corpus cannot say how many children were expelled from an Allen County school in 2013.**
  The county's schools report 836 expulsions that year against 97 in 2011 and 83 in 2015, and the
  figure is an artefact: six of them enter the same number in both of two mutually exclusive columns
  — 110 and 110, 71 and 71, 67 and 67. Across Ohio, 438 of the 570 schools reporting both columns in
  2013 report them equal, against 23 to 48 per cent of schools in every other year. [verified] — the
  same collection, counted here. Halving the duplicates still leaves 442, which is four times any
  neighbouring year, so the column is not repairable and no expulsion figure is published for 2013.

  [open] What happened between 2015 and 2017. A fall from 1,972 out-of-school suspensions to 987 in
  two years, in a county whose enrolment moved by 328, is a decision somebody made. Ohio limited
  out-of-school suspension for the youngest grades in this period and district boards minute their
  own discipline codes; neither the state's act nor any board's minutes has been retrieved.
properties:
  parameter: pupils suspended out of school at least once, Allen County
  value: "1140"
  unit: pupils
  as_of: "2021"
  method: |
    The Civil Rights Data Collection for 2011, 2013, 2015, 2017, 2020 and 2021, read through the
    Urban Institute's mirror of the federal files, filtered to the disability and sex totals and
    summed over the race dimension excluding its own all-pupils code. [verified]

    Schools are identified by `ncessch` and not by district, because the 2020 vintage publishes a
    blank district identifier on every row; and rows with a blank school identifier are dropped,
    because the 2011 vintage carries some and they hold 6,208 pupils that belong to no school.
    [verified] — see
    [a total is checked against one it did not come from](../../decisions/a-total-is-checked-against-one-it-did-not-come-from.yml).

    Out-of-school suspension is the sum of the single-suspension and multiple-suspension columns,
    which count pupils and are mutually exclusive. Rates use this collection's own enrolment and
    never the Common Core's, which is 0.6 to 8.0 per cent larger in the same years. [verified]

    The county is its twelve districts as the district directory reports them, including Apollo
    Career Center and two community schools, and including the Delphos City schools that stand in
    Van Wert County. [inference]
