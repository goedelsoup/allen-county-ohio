class: measure
label: Lima population, 2020 estimates base
description: |
  The April 1, 2020 estimates base for Lima city. [verified] —
  [Census Population Estimates, Vintage 2024](../../catalog/census-popest-2024.md),
  sub-county file.

  Lima held about 34.8% of the county's population at this date. [inference] — computed
  against [the county's base](allen-county-population-2020.yml).
  [The enumeration](lima-population-2020-census.yml) is 35,579 — 48 *more* than this base, where
  the county's enumeration is 11 fewer than its own. [verified] —
  [TIGERweb](../../catalog/tigerweb-census2020.md).

  Lima appears in the sub-county file at three summary levels — `061` as a minor civil
  division, `071` as a place part, and `157` as a place total — with the same figure at each,
  because unlike [Bluffton](../place/bluffton.yml) and [Delphos](../place/delphos.yml) it does
  not cross a county line. [verified]
  This figure describes the **corporation's territory**, not the settlement in the ordinary
  sense: the Census Bureau tabulates Lima at the corporate boundary of the date, so what the
  number counts is whatever ground the [City of Lima](../jurisdiction/city-of-lima.yml) had
  annexed by then. [inference] The node therefore carries a `describes` edge to the
  jurisdiction as well as to the place. Both are true and they are not the same claim — the
  place is what the name denotes, and the jurisdiction is what the boundary encloses.
properties:
  parameter: total resident population
  value: "35531"
  unit: persons
  as_of: 2020-04-01
  method: |
    Decennial enumeration as revised for the Vintage 2024 base. [verified]
links:
  - target: ../place/lima.yml
    relationship: describes
    claim_tag: verified
    source: ../../catalog/census-popest-2024.md
  - target: ../jurisdiction/city-of-lima.yml
    relationship: describes
    claim_tag: verified
    source: ../../catalog/census-popest-2024.md
  - target: lima-population-2020-census.yml
    relationship: not-comparable-to
    claim_tag: inference
    because: >-
      One enumeration of one date, read out of two files: 35,579 summed from the blocks assigned
      to the place and 35,531 as the Vintage 2024 base revised it. The enumeration runs 48 above
      the base here and 11 below it for the county, and disagreements running in opposite
      directions are what says a base is not a rounding of a count. A series may carry either
      figure and never both.
  - target: lima-population-2010.yml
    relationship: comparable-to
    claim_tag: inference
    because: >-
      A revised base against a census count, across ten years. The seam between those two
      instruments is measured at the one date where the corpus holds both: 35,579 enumerated and
      35,531 as the Vintage 2024 base revised it, **forty-eight people**, against a fall of 3,240
      here. That is the bound, and it is two orders of magnitude below the difference it is being
      carried across. The 2017 annexation sits between them as well and pushes the same way as
      every other one: the fall is a floor. What this does not license is the pair this node
      already refuses — the base and the count of the *same* date, where forty-eight people is the
      whole of the difference rather than a bound on it. See
      [a bound is not a break](../../decisions/a-bound-is-not-a-break.yml).
  - target: ../measure.ont.yml
    relationship: instance-of
