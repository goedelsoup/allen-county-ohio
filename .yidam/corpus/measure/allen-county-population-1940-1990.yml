class: measure
label: Allen County population, 1940–1990
description: |
  The county's decennial counts for the six censuses this corpus was missing. [verified] —
  [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md),
  Table 3.

      1940      73,303        housing units  20,650
      1950      88,183                       26,662
      1960     103,691                       32,265
      1970     111,144                       35,477
      1980     112,241                       41,887
      1990     109,755                       42,758

  **The county's peak is 1980, not 1970, and the corpus has been saying 1970 since genesis.**
  112,241 against 111,144 — a rise of 1,097 across the decade the corpus described as the start of
  a decline. [verified] — same source. Every figure this corpus held began at 1970 or later, so
  the sentence "no reversal at any measured point" in
  [deindustrialization](../period/deindustrialization.yml) was true of the data and false of the
  county. See [that node](../period/deindustrialization.yml), which now says so.

  **The 1970 figure matches an unrelated source exactly**, which is how the reading of these columns
  was checked: 111,144 here and 111,144 in the
  [1970–1979 county estimates](../../catalog/census-county-estimates-1970s.md), from a different
  Census product. [verified]

  **Housing grew when population did not.** Between 1970 and 1990 the county gained 7,281 housing
  units and lost 1,389 people. [inference] — computed from the figures above. Household size fell
  across the United States over those decades, so this is not peculiar to Allen County; what it does
  mean is that the county's building stock and its population stopped moving together around 1970,
  and the corpus's account of decline has until now been a population account only.

  **1930 is no longer a gap: 69,419.** [verified] —
  [1950 Census, Number of Inhabitants, Ohio](../../catalog/census-1950-number-of-inhabitants-ohio.md),
  Tables 5 and 6, which give it twice. So the county ran 68,203 in 1920, **69,419 in 1930** and
  73,303 in 1940 — a gain of 1,216 in the 1920s and 3,884 in the 1930s. [inference] — computed
  here; the source prints the second as 5.6 per cent and this corpus's arithmetic agrees. The
  county grew three times faster through the Depression decade than through the boom before it,
  which is the opposite of the shape the decades' reputations suggest and is
  [true of Lima too](lima-population-1850-1960.yml), at 2.3 per cent then 5.7.

  **And 1910 is closed too: 56,580.** [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the 1890–1910 divisions](allen-county-townships-1890-1910.yml). **The county now has a count
  for every decennial census from 1830 to 2020 and an estimate for 2024, with no gaps.** Twenty-one
  observations, every one from a published table. [verified] The two figures that were open when
  this node was written are both closed, one phase apart, and both by volumes older than the one
  this node is named for.
properties:
  parameter: total resident population, decennial
  value: "112241"
  unit: persons
  as_of: "1980"
  method: |
    Read from Table 3 by counting column positions against the header printed earlier in the
    document, and checked against the 1970 count this corpus already held from a different Census
    product. The `value` above is the series maximum, not its last term. [verified]
