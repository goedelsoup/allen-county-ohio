  - target: allen-county-population-1830-1900.yml
    relationship: comparable-to
    claim_tag: inference
    because: >-
      47,976 in 1900 and 112,241 in 1980 are both counts of everyone the census found resident in
      Allen County, and the ground under them did not move. The county line has one recorded
      movement between the reorganization of 1848 and the present — a gain from Putnam by way of
      Marion Township, between the 1990 and 2000 censuses, and therefore after the later figure
      here. That is a record of changes and not a proof that none escaped it, so the join rests on
      the county's parts as well as its outline: the thirteen minor civil divisions that sum to
      47,976 in 1910's supplement are the twelve townships and Lima that still partition this
      county and still close against its printed total, with German renamed American in 1918 and
      Ottawa dissolved into the city it already was. **The seam is the route, and it is measured at
      the earlier end.** The 1900 figure reaches this corpus through a county history transcribing
      published returns rather than through a Census volume — and the 1910 supplement's own table
      gives the same 47,976 for that year, so the compiler this pair depends on is checkable
      against the office it was copying. What the pair does not license is a rate, and it does not
      have to be asked for one: seven censuses lie between these two figures and this corpus holds
      every one of them, so the growth of 64,265 people belongs to the series and not to the two
      terms a `parameter` string happens to have grouped.
  - target: ../measure.ont.yml
    relationship: instance-of
