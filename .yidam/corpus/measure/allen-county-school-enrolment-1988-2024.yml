class: measure
label: Enrolment in Allen County's twelve school districts, 1988–2024
description: |
  Fall enrolment in every school district holding ground in Allen County, for thirty-seven
  consecutive years. [verified] —
  [the Common Core of Data](../../catalog/nces-common-core-of-data.md), district enrolment by year.

      1988  22,760   1996  21,616   2004  19,557   2012  17,565   2020  16,124
      1989  22,170   1997  21,369   2005  19,609   2013  17,634   2021  16,127
      1990  22,219   1998  21,370   2006  19,319   2014  17,656   2022  16,113
      1991  22,047   1999  20,994   2007  19,158   2015  17,518   2023  15,995
      1992  22,137   2000  20,705   2008  18,952   2016  17,333   2024  15,850
      1993  21,987   2001  19,980   2009  17,985   2017  17,107
      1994  21,931   2002  20,016   2010  17,830   2018  16,921
      1995  21,743   2003  19,728   2011  17,766   2019  16,774

  **Allen County has 6,910 fewer schoolchildren than it had in 1988 — 30.4 per cent of them — and
  the high of the whole run is its first year.** [verified] — the same files. The county's
  population went from 109,755 in 1990 to 100,866 in 2024, a fall of 8.1 per cent, so the schools
  emptied close to four times as fast as the county did. [inference] — against
  [1990](allen-county-population-1940-1990.yml) and
  [2024](allen-county-population-2024.yml).

      district              1988    2006    2024   change
      **Lima**             6,969   4,855   3,370   -51.6%
      Shawnee              2,793   2,695   2,239   -19.8%
      Elida                3,293   2,482   2,016   -38.8%
      Bath                 2,255   1,986   1,588   -29.6%
      **Bluffton**           986   1,132   1,248   +26.6%
      Allen East           1,173   1,051   1,042   -11.2%
      Spencerville         1,019     993     986    -3.2%
      Delphos              1,285   1,127     943   -26.6%
      Columbus Grove         878     927     726   -17.3%
      Perry                  814     844     704   -13.5%
      Pandora-Gilboa         673     613     523   -22.3%
      Waynesfield-Goshen     622     614     465   -25.2%
      all twelve          22,760  19,319  15,850   -30.4%

  **Lima City Schools have lost half their children, and the city has not lost half its people.**
  6,969 pupils in 1988 and 3,370 now, a fall of 51.6 per cent, against a city that went from 45,549
  residents in 1990 to 34,690 in 2024 — 23.8 per cent. The district emptied at more than twice the
  rate of the city it serves. [inference] — the same files against
  [1990](lima-population-1970-1990.yml) and [2024](lima-population-2024.yml). Elida is the
  next-steepest at −38.8 per cent, and it borders the city on the north and west.

  **One district in twelve is larger than it was, and it is the furthest one from Lima.** Bluffton
  has grown 26.6 per cent since 1988 while every other district shrank. [verified] — same files.

  **The fourteen years this corpus already held were labelled one year too late.**
  [The finance-survey series](allen-county-school-enrolment-2010-2023.yml) gives 17,985 for "2010"
  and this file gives 17,985 for 2009; the two agree in fourteen years of fourteen at a one-year
  shift and in none at the same year, and in twelve districts of twelve at both ends of the run.
  [verified] — the two sources compared here. The finance survey labels a count by the fiscal year
  the autumn opens and this file by the autumn itself, and the earlier node read the former as the
  latter.

  **What a district staffs, which the finance survey does not carry.** [verified] — the 2023
  district directory. The cross-section below is one year of
  [a thirty-three-year series](allen-county-school-staffing-1992-2024.yml) taken since, in which
  the county's teachers fall 19.11 per cent against these pupils' 28.40 and its certified
  librarians fall from 24 to 4.

      district              pupils   teachers FTE   pupils per teacher   counsellors   psychologists
      Lima                   3,332          255.0                 13.1           8.5             4.0
      Shawnee                2,275          131.0                 17.4           7.0             0.0
      Elida                  2,081          120.0                 17.3           4.0             2.0
      Bath                   1,625          100.0                 16.2           4.0             0.0
      Bluffton               1,236           67.0                 18.4           3.0             0.0
      Allen East             1,058           59.0                 17.9           1.0             1.0
      Spencerville           1,018           54.0                 18.9           1.0             0.0
      Delphos                  890           61.0                 14.6           4.0             0.0
      Columbus Grove           755           51.0                 14.8           2.4             0.0
      Perry                    727           47.0                 15.5           2.0             0.0
      Pandora-Gilboa           514           40.0                 12.8           2.0             0.0
      Waynesfield-Goshen       484           36.0                 13.4           2.0             0.0

  **Nine of the twelve districts report no school psychologist at all, and the county's
  psychologists work for the service center.** The column is filled for every district, so those
  are reported zeros and not empty cells; Lima has four, Elida two and Allen East one. In the same
  file and the same year the
  [Allen County Educational Service Center](../jurisdiction/allen-county-educational-service-center.yml)
  reports 14.45 of them against an enrolment of zero — twice the twelve districts put together.
  [verified] — same directory, the service center's own row.

  **Pupils per teacher does not sort by anything simple.** The range is 12.8 to 18.9 and its two
  lowest are Pandora-Gilboa, among the smallest districts in the county, and Lima, the poorest —
  which are low for opposite reasons, a small school needing a floor of staff and a poor one
  drawing categorical aid. [inference] — the reasoning is this corpus's; see
  [where a district's money comes from](allen-county-school-finance-2023.yml).

  [open] What happened in 2009. It is the largest single-year fall in the record, 967 pupils, and
  **the only year in thirty-six in which all twelve districts fell together**. Twelve districts
  moving the same way in one year is the shape of a change in what is counted rather than of
  families leaving, and this file does not say which it was.

  **How the districts do, which this node could not say when it was written.** Reading proficiency
  in 2018 runs from 42 per cent in Lima to 83 in Bluffton and Delphos, and the four-year graduation
  rate from Lima's 63 per cent to bands of 95 to 100 in Bluffton and Spencerville. [verified] —
  [the assessment results](allen-county-test-proficiency-2009-2020.yml) and
  [the graduation rates](allen-county-graduation-rates-2010-2019.yml), from
  [EDFacts](../../catalog/edfacts-outcomes.md). Enrolment and outcome do not sort together: Bluffton
  is the only district in the county that has grown and it is also the highest-scoring, and Shawnee
  has lost a fifth of its pupils and scores within two points of it.
properties:
  parameter: enrolment in the county's twelve school districts
  value: "15850"
  unit: pupils
  as_of: "2024"
  method: |
    One request per year to the district enrolment endpoint for Ohio, `grade-99` and race code 99,
    filtered here to the twelve districts by NCES agency identifier. Every year from 1988 to 2024
    returns all twelve; none is imputed and none is missing. [verified] The twelve are the districts
    holding ground in Allen County, three of which the federal file files under a neighbouring
    county — Delphos under Van Wert, Columbus Grove and Pandora-Gilboa under Putnam,
    Waynesfield-Goshen under Auglaize — so a filter on county code returns eight and not twelve.
    Staffing is the 2023 district directory, which is the fall of the 2023–24 school year and one
    year later than the fall the finance survey would call 2024. [verified]
