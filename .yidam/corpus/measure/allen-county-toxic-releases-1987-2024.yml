class: measure
label: Toxic releases reported in Allen County, 1987–2024
description: |
  **743.6 million pounds of listed toxic chemicals in thirty-eight years, from 47 of the 49
  facilities on the county's register, and four fifths of it from one plant.** [verified] —
  [the Toxics Release Inventory](../../catalog/epa-tri.md), all reporting years, summed here over
  every release row a facility in this county has filed. Which facilities those are, and for how
  long each has filed, is [the reporters](allen-county-tri-reporters-1987-2024.yml).

