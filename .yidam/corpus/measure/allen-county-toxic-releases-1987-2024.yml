      2006     3,414       303     11,832         0     15,549          14,909
      2007     3,849       294      8,995         0     13,139          12,580
      2008     2,993       305     10,629         0     13,927          13,315
      2009     3,838       163      8,839         0     12,840          12,494
      2010     3,393       304      9,868         0     13,565          13,036
      2011     3,983       303      8,890         0     13,175          12,474
      2012     5,695       192      7,363         0     13,249          12,716
      2013     5,857       184      7,157         0     13,198          12,825
      2014     5,069       131      7,345         1     12,545          12,156
      2015     3,298       133      7,571         1     11,002          10,533
      2016     3,384       105      7,465         3     10,957          10,566
      2017     3,322       136      8,249         1     11,707          11,124
      2018     3,378       223      9,398         1     13,000          12,507
      2019     3,357       134      9,742         0     13,232          12,746
      2020     3,066       131      7,031         0     10,228           9,853
      2021     3,541       132     12,892         0     16,565          16,251
      2022     3,504       167      6,959         0     10,630          10,107
      2023     3,268       161      5,208         0      8,637           8,299
      2024     2,836       172      6,410         0      9,418           9,047

  Quantities are thousands of pounds. **Injected** is release to a deep underground well;
  **like-for-like** restricts the total to the 85 chemicals reportable in every year of the series.
  [verified] — same source.

  **Allen County released more listed toxic chemical in 2024 than any other county in Ohio.**
  9,417,778 pounds, 18.0 per cent of the state's 52.2 million — ahead of Ashtabula's 6.2 million
  and Cuyahoga's 4.7 million, from 28 and 122 reporting facilities against this county's 17.
  [verified] — same dataset, the whole state for 2024, summed here by county. The county holds
  0.85 per cent of Ohio's people.

  **That first place is made by a disposal method almost nobody else in Ohio uses.** 6.4 million of
  the 9.4 million went down a deep injection well, and only two counties in the state injected
  anything at all in 2024 — this one and Sandusky. Set the wells aside and Allen is fifth, behind
  Ashtabula, Gallia, Cuyahoga and Coshocton. [verified] — same source, `UNINJ` media codes.

  **Per resident it is second either way.** 93.4 pounds a person against Gallia's 190.9, on
  Census population estimates for 2024; on air releases alone, 28.1 pounds a person and third.
  [inference] — computed here from the state file and
  [the population estimates](../../catalog/census-popest-2024.md).

  **The headline fall is 86.5 per cent and the honest one is 64.2.** From 69,836,754 pounds in 1987
  to 9,417,778 in 2024 on the raw totals; from 25,249,928 to 9,047,255 on the 85 chemicals
  reportable throughout. The gap is one chemical: ammonium sulfate (solution), 126 million pounds
  reported here in three years, off the list since 1993. [verified] — same source, against the
  chemical dictionary's `active_date` and `inactive_date`. See
  [a revision that changes the roll](../../decisions/a-revision-that-changes-the-roll.yml).

  **The air series needs no such repair.** Air releases fall from 9,392,220 pounds to 2,836,097, a
  drop of 69.8 per cent raw and 69.9 per cent like-for-like — the delisted chemicals went almost
  entirely down the wells, so they never sat in this stream. [verified] — same dataset, the `AIR
  FUG` and `AIR STACK` media codes.

  **The air stream changed hands.** In 1987 the nitriles plant put 8,295,100 pounds into the air,
  88.3 per cent of the county's total; in 2024 it put out 77,227. The largest air emitter now is
  PCS Nitrogen at 2,485,957 pounds, 87.7 per cent of a much smaller total, and almost all of it
  ammonia. One plant cut its air releases by ninety-nine per cent and a fertiliser works became the
  county's chimney. [verified] — same source, by facility.

  **What goes into the air fell and what goes down the well did not.** Carcinogenic releases to air
  fall from 546,216 pounds in 1987 to 45,369 in 2024, down 91.7 per cent. Carcinogenic releases to
  injection wells go from 2,160,000 to 1,947,066, down 9.9 per cent, and average 2.59 million a
  year over the first decade against 2.08 million over the last. [verified] — same dataset,
  `carc_ind` in the chemical dictionary.

  **Two facilities are 97.1 per cent of what the county reported in 2024**, and one of them is 81.7
  per cent of everything it has reported since 1987 — 607.3 million pounds from the nitriles plant
  alone. [verified] — same source, by facility and year.

  **Counting facilities gives three different answers for one year, and the difference is what a
  form is.** Twenty filed for 2024; seventeen of those appear in the release table; fifteen reported
  a nonzero quantity in pounds. The three missing from the release table filed the certification
  form, which says a facility is under the threshold and carries no quantities, and two more —
  Dana Driveshaft and Randall Bearings — reported only ranges. Every count in this node is on the
  release table, so seventeen is the figure it uses. [verified] — same source, against
  [the reporters](allen-county-tri-reporters-1987-2024.yml).

  **The chemicals are what a refinery, a nitriles plant and a fertiliser works would put out.**
  Across the series: ammonia 204.2 million pounds, acetonitrile 151.0, ammonium sulfate 126.0,
  methanol 42.7, acrylic acid 42.4, acrylamide 40.3 and acrylonitrile 38.0. 109 chemicals have been
  reported here in all. [verified] — same dataset, by chemical.

  **In figures, the four largest single-year totals and the four smallest**: 69,837 thousand pounds
  in 1987, 59,213 in 1988, 58,030 in 1989 and 28,715 in 1991; 8,637 in 2023, 9,418 in 2024, 10,228
  in 2020 and 10,630 in 2022. [inference] — read from the table above.

  [open] Why the reporting of ammonium sulfate stopped after 1989, four years before the chemical
  left the list. The county's total falls by more than half between 1989 and 1990 and that one
  chemical is the whole of it. The file records the quantity and not the reason, and this corpus
  has not found the permit, the process change or the threshold determination that would say which
  it was.

  [open] What the wells hold and where it goes. Deep injection places the material in a confined
  formation below the drinking-water zone, and the inventory stops at the wellhead.

  **This corpus cannot say that the fall in reported releases caused the improvement in measured
  air quality**, and the arithmetic runs against it: the county's air quality is set by ozone and
  fine particles, which are regional and mostly not on this list, while what is on this list is
  ammonia, acetonitrile and propylene. Both series improve over the same decades. Neither is
  offered here as the reason for the other. [inference] — from
  [what the monitors measured](allen-county-air-quality-1980-2024.yml).
properties:
  parameter: on-site releases of listed toxic chemicals reported by facilities in the county
  value: "9417778"
  unit: pounds
  as_of: "2024"
  method: |
    Envirofacts `tri_facility` filtered to Ohio and Allen County, joined to `tri_reporting_form`
    and `tri_release_qty`, all 55,329 release rows across reporting years 1987–2024. Quantities in
    grams — 252 rows, 11.5 grams in total, all dioxin — are excluded rather than converted. 1,506
    rows carrying a range code instead of a quantity are excluded and could add at most 1.5 million
    pounds across the whole series. Historical media codes `LANDF8795` and `UNINJ8795` are summed
    with their replacements after checking that no form carries a nonzero quantity under both. The
    like-for-like column restricts to chemicals whose dictionary entry has an `active_date` of 1987
    or earlier and no `inactive_date`. [verified]
