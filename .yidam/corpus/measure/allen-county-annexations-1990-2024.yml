    3904752     Beaverdam           0     NA  NA          NA
    3907426     Bluffton            9  477.5  1994-10-14  2024-11-12
    3910884     Cairo               1   10.4  2016-05-10  2016-05-10
    3921602     Delphos            26  784.4  1990-05-22  2018-02-28
    3924808     Elida               5  912.9  1990-05-08  2021-05-11
    3927944     Fort-Shawnee        0     NA  NA          NA
