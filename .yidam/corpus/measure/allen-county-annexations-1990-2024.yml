class: measure
label: Allen County annexations, 1990–2024
description: |
  **Fifty-seven annexations, all of them dated, none of them held by this corpus until now.**
  Seven Allen County municipalities reported a boundary change to the Census Bureau between
  12 April 1990 and 12 November 2024, each with the legal instrument that authorised it, the day
  it took effect and an acreage. [verified] —
  [the Boundary and Annexation Survey](../../catalog/census-bas-boundary-changes-ohio.md), Ohio
  files for 1991–2000, 2001–2010, 2011 and each survey year from 2012 to 2025.

  **The rows are in the `table` below rather than printed here**, keyed on the seven-digit place
  code so a municipality's own entry can find its line without matching a name — and carrying all
  ten codes the method searched, which is what makes the three that reported nothing a fact rather
  than an absence from a list. The prose table this replaces was the second copy, and the drift
  between it and the method is the paragraph about Westminster below.

  Written out: **Delphos reported twenty-six annexations totalling 784.4 acres, Lima eleven
  totalling 622.0, Bluffton nine totalling 477.5, Elida five totalling 912.9, Spencerville four
  totalling 209.7, and Cairo and Harrod one each of 10.4 and 12.9 — fifty-seven records and 3,029.8
  acres in thirty-five years.** [verified] — same files. Five of the fifty-seven state no acreage,
  so every total here is a floor.

  **Every one is an annexation.** No detachment, merger, incorporation or dissolution appears in
  thirty-five years of Ohio's file for this county, and the corpus reads that as a property of the
  survey rather than of the county: a government that gives ground up has less occasion to file
  than one that takes it. [inference] — the reasoning is this corpus's; the absence is
  [the survey's](../../catalog/census-bas-boundary-changes-ohio.md).

  **The one boundary change of consequence in this window is not in the file either, and it is not
  an annexation.** Fort Shawnee's electors ended the village on 6 November 2012 and the survey has
  no row for it. [verified] —
  [the Secretary of State's report of miscellaneous questions](../../catalog/ohio-sos-local-issue-reports.md);
  see [the Village of Fort Shawnee](../jurisdiction/village-of-fort-shawnee.yml). That sharpens the
  reading above rather than replacing it: the survey misses what a government gives up, and the
  largest thing a government can give up is itself. [inference]

  **Three villages that annexed nothing.** Beaverdam, Lafayette and Fort Shawnee have no record in
  the series at all. For [Fort Shawnee](../place/fort-shawnee.yml) that is a fact worth having
  beside the rest: the largest of the county's villages by population never once moved its own
  line. [verified] — same files, searched on all ten Allen County place codes.

  **This paragraph said four and named [Westminster](../place/westminster.yml), and that was a
  category error rather than a miscount.** Westminster is a census designated place and has never
  been incorporated; it has no corporation and therefore no line for an annexation to move, so it
  is not among the ten place codes this node's method searched and could not have appeared in the
  file whatever it did. [verified] — [the place node](../place/westminster.yml), which had already
  written the distinction down: one of these places has "a council and a corporate boundary that
  annexation can move" and the other "a statistical outline the Census Bureau draws". Ten codes
  less seven with records is three, and the sentence that said four was reporting a silence that
  belongs to the Census Bureau's definition of a place rather than to any government's conduct.
  [inference] Found by writing the table below, which is the return on making a figure a machine
  can read: nine names in prose and ten codes in the method could disagree indefinitely, and a
  keyed table cannot.

  ## The acts themselves

  **All fifty-seven are now held one instrument at a time, in five nodes**, because that is the
  grain a municipality's own entry has to draw and this node's table is one row per municipality:
  [Delphos's twenty-six](delphos-annexations-1990-2018.yml),
  [Lima's eleven](lima-annexations-1990-2017.yml),
  [Bluffton's nine](bluffton-annexations-1994-2024.yml),
  [Elida's five](elida-annexations-1990-2021.yml),
  [Spencerville's four](spencerville-annexations-1997-2023.yml), and Cairo's and Harrod's one
  each, which are their summary rows and want no node. [verified] — same files. What stays here is
  what this node argues across them.

  **One of the fifty-seven is not in this county.** Bluffton's ordinance 10-2024 of 12 November
  2024 is attributed by the file to **Hancock**, the village being on that line — the only record
  in thirty-five years the survey places outside Allen County, and it carries no acreage. So the
  `last` cell in Bluffton's row above is a boundary change somewhere else. [verified] — same
  files, county column; see [the village's record](bluffton-annexations-1994-2024.yml). The column
  that makes this sayable arrives with the 2019 survey year and nothing before it is attributed at
  all, so the same may be true of earlier Bluffton and Delphos acts and cannot be shown. [open]

  **Ten of the fifty-seven are resolutions and eight of those state an acreage.** That qualifies a
  reading this corpus made when it held only Lima's record, where the single resolution is also
  the single act with no acreage: the instrument type does not explain a missing figure, because
  most resolutions here carry one. Three of the five blank acreages are ordinances. [verified] —
  same files, counted here; see [Lima's eleven](lima-annexations-1990-2017.yml). What survives is
  the procedural reading itself — a resolution is the commissioners' half of an act the
  municipality completes by ordinance — which says a resolution reported alone may be an
  incomplete act and not that it must be. [inference]

  **The shape is a decade of nothing, then a burst, then nothing again.** Lima annexed 21.0 acres
  in 1990 and 1991, then reported no boundary change for ten and a half years; then took 601.0
  acres in eight annexations between June 2002 and December 2009; then one more in June 2017 and
  nothing since. [verified] — same source. Twenty-nine of the county's fifty-seven records fall in
  the 2000s and only eleven in the fifteen years after.

  **The largest single annexation in the county's record is Lima's ordinance 90-02**, 215.9 acres
  effective 24 June 2002, and it is the act that ends the ten-year pause. [verified] — same source.

  **The last one is the odd one.** Resolution 408-17 of 29 June 2017 is the only Lima record in
  thirty-five years authorised by resolution rather than by ordinance, and the only one with no
  acreage on it — an Ohio annexation begins with a resolution of the county commissioners and ends
  with an ordinance of the city, so a resolution reported alone is the first half of the act.
  [inference] — the two-instrument procedure is [the survey readme's](../../catalog/census-bas-boundary-changes-ohio.md)
  and the reading is this corpus's.

  ## The acreage checks against a polygon

  **Lima reported 601.0 acres of annexation effective inside the 2000s, and the Census Bureau's own
  measurement of Lima grew by 582.4 acres over the same decade.** The city's total area was 12.88
  square miles in the 2000 geography and 13.79 in the 2010 geography, a rise of 0.91 square miles.
  [verified] — [the 2000 volume](../../catalog/census-phc-3-37-ohio.md) and
  [the 2010 volume](../../catalog/census-cph-2-37-ohio-2010.md), county-subdivision tables.

  The two figures agree to 3.1 per cent, and they have nothing in common: one is the sum of numbers
  a city clerk wrote on eight forms across eight years, the other is a polygon the Census Bureau
  measured twice ten years apart. [inference] — the comparison is this corpus's. Against Lima's
  **land** area rather than its total the same reported acreage covers only 83 per cent, and the
  gap is the water inside annexed ground plus a remeasurement that touched every entity in Ohio;
  see [the control is the figure that cannot move](../../decisions/the-control-is-the-figure-that-cannot-move.yml).

  ## Where the arithmetic does not work

  **Elida reports more annexation than Elida is.** The village's five records total 912.9 acres,
  and the village occupied 703.6 acres in the 2012 geography and 745.6 in the 2024 one.
  [verified] — the survey files against
  [the gazetteer series](../../catalog/census-gazetteer-2020.md), Ohio place files for 2012 and
  2024. A single record, ordinance 622-92 of 11 March 1992, claims 640.0 acres — one square mile,
  to the acre, which is the size of a survey section and not the size of a parcel.

  Two of the five are the same acreage four months apart: resolutions 344-2009 and 348-2009, both
  61.6 acres, effective 7 April and 7 August 2009. [verified] — same files.

  [open] Whether that pair is one annexation reported twice or two of identical size. The corpus
  does not treat it as 123.2 acres of ground either way.

  **What the total is not.** 3,029.8 acres is 4.73 square miles, and the seven municipalities did
  not grow by that. It is the sum of what was reported, on a form, by the party that benefited,
  with no adjustment for double-reporting, for water, or for the difference between a legal
  description and a measured polygon. [inference] — computed here. The figure it should be read
  against is not the county's area but the county's other annexation record, which for the 2000s
  is Lima's 601 reported against 582 measured.
