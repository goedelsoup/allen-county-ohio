    3974034     Spencerville        4  209.7  1997-01-21  2023-06-05
  method: |
    Every row of Ohio's BAS boundary-change files whose entity FIPS place code is one of the ten
    Allen County places — Beaverdam 04752, Bluffton 07426, Cairo 10884, Delphos 21602, Elida 24808,
    Fort Shawnee 27944, Harrod 34118, Lafayette 41118, Lima 43554, Spencerville 74034. Sixteen
    tab-delimited files, two record layouts, joined on the fields the readme names. Delphos and
    Bluffton cross county lines and the pre-2018 layout carries no county column, so their totals
    include ground on the Van Wert and Hancock sides. [verified]
