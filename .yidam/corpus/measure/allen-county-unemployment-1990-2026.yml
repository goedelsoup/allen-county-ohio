class: measure
label: Allen County unemployment, 1990–2026
description: |
  Thirty-six annual averages and four hundred and thirty-nine months, from the first county-level
  labour figure this corpus holds that is not counted through an employer. [verified] —
  [Local Area Unemployment Statistics](../../catalog/bls-laus.md), series `LAUCN39003…` for the
  county, `LAUST39000…` for Ohio; the national rate is the Current Population Survey's own
  `LNU04000000`, averaged over each year's months.

      year  county  Ohio  U.S.   labour force  employed  unemployed
      1990     7.7    5.7  5.62        52,652    48,573       4,079
      1991     8.1    6.6  6.82        52,517    48,273       4,244
