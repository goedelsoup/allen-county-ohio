      2007     6.3    5.6  4.62        52,562    49,239       3,323
      2008     7.5    6.6  5.77        52,029    48,122       3,907
      2009    11.4   10.2  9.27        51,239    45,377       5,862
      2010    10.5   10.0  9.62        51,852    46,405       5,447
      2011     9.5    8.8  8.95        50,744    45,944       4,800
      2012     7.7    7.4  8.07        49,965    46,103       3,862
      2013     7.8    7.4  7.38        49,416    45,570       3,846
      2014     5.8    5.8  6.17        48,504    45,682       2,822
      2015     4.9    5.0  5.29        48,028    45,670       2,358
      2016     5.0    5.0  4.87        48,954    46,514       2,440
      2017     4.9    4.9  4.35        49,283    46,866       2,417
      2018     4.4    4.5  3.90        48,514    46,379       2,135
      2019     4.0    4.1  3.67        48,637    46,684       1,953
      2020     8.5    8.2  8.09        48,173    44,088       4,085
      2021     5.9    5.3  5.37        47,840    45,017       2,823
      2022     4.2    4.0  3.65        47,309    45,336       1,973
      2023     3.8    3.7  3.63        47,499    45,682       1,817
      2024     4.5    4.4  4.02        47,852    45,720       2,132
      2025     4.8    4.6  4.29        48,288    45,950       2,338

  [verified] — same dataset, all three series as published; the county and state columns are annual
  averages the agency computes, and the national column is averaged here from its twelve months.

  **The county's rate was above its state's for twenty-four years running, and then it stopped.**
  Every year from 1990 to 2013 Allen County's annual rate exceeded Ohio's, by a mean of 1.0 points
  and by as much as 2.1 in 1996. From 2014 the mean gap is 0.10 points and the county is at or below
  the state in six of twelve years. [inference] — computed from the table above. The break is not
  gradual: the gap is 0.4 points in 2013 and 0.0 in 2014, and it has not been above 0.6 since.

  **It converged on the state and not on the country.** Against the national rate the county's mean
  gap is +1.14 points in the 1990s, +1.25 in the 2000s and +0.28 from 2014 — narrower, but it has
  been below the nation in only two of the last twelve years. Ohio sits above the nation over the
  same span, and what the county caught up with is Ohio. [inference] — computed here.

  **The convergence is a subtraction.** Across the record Ohio's labour force grew 10.3 per cent and
  Allen County's fell 8.3. Measured from the county's own peak in 2006 the two are further apart
  still: Ohio is level at −0.1 per cent and the county is down 8.7 per cent, 4,623 people. The county
  stopped having a higher share of its workers out of work partly by having fewer workers. [inference]
  — computed from the same table and Ohio's own labour force series in the
  [same dataset](../../catalog/bls-laus.md).

  [open] How much of the labour-force fall is retirement, how much is people leaving the county and
  how much is people who stopped looking. This series counts the three the same way and separates
  none of them.

  **Fewer people work in this county now than in 1990.** Employed residents peaked at 49,671 in 2006
  and stand at 45,950 in 2025 — 3,721 fewer, a fall of 7.5 per cent — and the 2025 figure is 2,623
  below 1990's. Thirty-five years of record and the employment column ends lower than it began.
  [inference] — computed from the table above.

  **April 2020 is the worst month in the record and nothing else is close.** The county's rate was
  18.6 per cent, against a previous worst of 12.7 in March 2009. Employed residents fell from 46,352
  in March to 38,831 in April, 7,521 people — 16.2 per cent of everyone working — inside thirty days,
  while the labour force fell by only 1,395. They were counted as unemployed rather than as gone.
  [verified] — same dataset, monthly series; [inference] on the arithmetic between months.

  **The same county met its two recessions in opposite shapes.** In 2009 it ran 2.3 points above
  Ohio at the worst month and was still above the state in 2010, 2011, 2012 and 2013. In 2020 it ran
  2.7 points above Ohio in April and was *below* the state by June, and it has never since been more
  than 0.6 above. [verified] — same dataset. The 2008 shock left a mark on this county that the 2020
  shock did not. [inference] — the comparison is this corpus's.

  [open] Why the two recessions left different marks. Nothing held here distinguishes a shock that
  closed a plant from one that shut a dining room for a season.

  **In figures: the county's annual rate was 7.7 per cent in 1990, 4.7 in 2000, 11.4 in 2009, 5.8 in
  2014, 4.0 in 2019, 8.5 in 2020 and 4.8 in 2025**, and its labour force fell from 52,911 in 2006 to
  48,288 in 2025. [inference] — read from the table above.

  **One month in the record has no rate at any level of government.** October 2025 is empty for the
  county, for Ohio and for the United States, carrying the agency's footnote *"Data unavailable due
  to the 2025 lapse in appropriations."* The 2025 annual averages here are eleven-month averages that
  exclude it, which the file also says in a footnote of its own. So the calendar holds 439 months
  between January 1990 and July 2026 and this series holds 438 figures. [verified] —
  [the footnote file and the county's own rows](../../catalog/bls-laus.md).

  **The lowest month in the record is the most recent one it can be.** May 2026 reads 3.0 per cent,
  below April 2019's 3.3, which had stood as the record's floor. The last three months are marked
  preliminary in the file. [verified] — same dataset.
properties:
  parameter: unemployment rate, Allen County, annual average
  value: "4.8"
  unit: per cent
  as_of: "2025"
  method: |
    Allen County's four series were extracted from the 336 MB national county file and the file
    deleted; Ohio's from the states file; the national rate from the Current Population Survey's
    `LNU04000000` through the public API, because this programme does not publish a national figure
    of its own. Period `M13` is the agency's annual average and is quoted as published rather than
    recomputed, except for the national column, which has no `M13` here and is the mean of the
    year's months. County estimates are modelled and controlled to a state total; a tenth of a point
    between two counties in one month is not a finding, and nothing here rests on one. [verified]
