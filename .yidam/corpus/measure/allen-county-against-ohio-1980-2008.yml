class: measure
label: Allen County's Republican share against Ohio's and the nation's, 1980–2008
description: |
  One file gives the presidential vote of this county, this state and this country for eight
  consecutive elections, which makes a comparison possible that no single return supports.
  **Allen County's Republican share ran between 12.7 and 15.4 points above Ohio's at every one of
  the eight, on a share of its own that moved 19.5 points.** [verified] —
  [USA Counties](../../catalog/census-usa-counties.md), the county, state and national rows of
  table ELE.

      year   Allen   Ohio     US    Allen − Ohio   Ohio's leading party
      1980   65.8    51.5    50.7      +14.3       Republican
      1984   73.0    58.9    58.8      +14.1       Republican
      1988   69.0    55.0    53.4      +14.0       Republican
      1992   53.5    38.3    37.4      +15.2       Democratic
      1996   55.3    41.0    40.7      +14.3       Democratic
      2000   65.4    50.0    47.9      +15.4       Republican
      2004   66.1    50.8    50.7      +15.3       Republican
      2008   59.6    46.9    45.7      +12.7       Democratic

  [verified] — same source, the file's own percentages; the differences are computed here.

  **The level swings seven times as far as the offset.** The county's Republican share runs from
  53.5 per cent in 1992 to 73.0 in 1984, a range of 19.5 points; the distance from Ohio's runs from
  12.7 to 15.4, a range of 2.7. Its mean is 14.4. [inference] — computed from the table above.

  A county whose share moves twenty points while its distance from the state moves under three is
  not deciding these elections on anything local. It is taking the national swing and adding a
  constant. [inference] — the reasoning is this corpus's; the file supports the arithmetic and not
  the explanation.

  **Ohio changed its mind three times in the eight and this county did not change its mind at
  all.** The state's leading party was Democratic in 1992, 1996 and 2008 and Republican in the
  other five; Allen County's was Republican in all eight. [verified] — same source, the
  leading-party code for each row. Forty-seven of Ohio's eighty-eight counties voted Republican at
  all eight, and 1,202 of the country's 3,146. [inference] — counted here from the same file.

  **The rank moves twenty-three places while the gap moves under three points.** Among Ohio's
  eighty-eight counties this one stands 5th on Republican share in 1980, 24th in 1984, 18th in
  1988, 3rd in 1992, 7th in 1996, 11th in 2000, 14th in 2004 and 26th in 2008 — and nationally
  199th of 3,146 at its highest standing and 1,353rd at its lowest. [inference] — computed here
  from the file's vote counts. The rank is a fact about how the other counties bunched, not about
  how this one voted.

  **Its neighbours sit above it more often than below.** Putnam County is more Republican than
  Allen at all eight elections and Hancock at seven of the eight; Hardin is less Republican at all
  eight; Auglaize and Van Wert cross it in both directions. [inference] — computed here from the
  same file. This county is inside a Republican block and is not the hardest part of it.

  **This node cannot say why the distance is constant.** Nothing in a vote file distinguishes a
  county that leans Republican for reasons that never change from one whose reasons change and
  cancel. The stability is measured; its cause is not.
properties:
  parameter: Allen County Republican presidential share less Ohio's, 1980–2008
  value: "14.4"
  unit: percentage points, mean of eight elections
  as_of: "2008"
  method: |
    The differences use the file's own percentages, which are printed to one decimal for every
    area, so each difference is good to about two tenths of a point and the 2.7-point band is
    wider than that error by an order of magnitude. Ranks and the all-eight counts were computed
    from the vote counts instead, because rounded percentages tie counties that are not tied.
    Eight elections is what the file holds; it begins at 1980 and stops at 2008, and the corpus's
    [1960 and 1964](allen-county-presidential-vote-1960-1964.yml) come from a volume that prints
    only the leading party's share and so cannot extend this table. [verified]
