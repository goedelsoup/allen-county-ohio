class: measure
label: Allen County's housing in 1990
description: |
  The county's houses as the 1990 census described them, in the two volumes that describe the
  building rather than the household. [verified] —
  [the 1990 Ohio housing volumes](../../catalog/census-1990-housing-characteristics-ohio.md),
  CH-1 and CH-2, Table 1 in each.

      Allen County, 1990                              county        Lima
      housing units                                   42,758      18,666
      occupied                                        39,408      16,311
      owner-occupied                                   71.7%       59.1%
      one unit, detached or attached                   74.1        67.9
      in buildings of ten units or more                 5.7         8.1
      median rooms                                      5.7         5.5
      median year structure built                      1957        1950
      built 1939 or earlier                            27.8%       37.2%
      lacking complete plumbing facilities               0.4         0.4
      lacking complete kitchen facilities                0.6         0.9
      no vehicle available                               8.4        14.9
      no telephone in unit                               5.0         9.1
      1.01 or more persons per room                      1.7         2.1
      householder 65 years and over                     24.0        25.9
      median value                                   $51,800     $38,900
      median contract rent                              $262        $251

  **Lima has lost 2,864 housing units since — 15.3 per cent of what it had.** 18,666 in 1990,
  16,784 in 2010, 16,028 in 2020 and 15,802 in the current survey. [verified] — this volume against
  [the vacancy series](allen-county-vacancy-status-2010-2020.yml) and
  [the housing stock](allen-county-housing-stock-2023.yml). The county's own total moved from
  42,758 to 44,697 across the same thirty-three years, so the city's loss is the ring's gain and a
  little more. [inference]

  **The city was still a county of owners in 1990.** 59.1 per cent owner-occupied against 50.6 in
  2010, 45.9 in 2020 and 46.4 in the survey. [verified] — this volume against
  [the tenure series](allen-county-tenure-2010-2020.yml). That extends a series this corpus began
  at 2010 by two decades, and it puts the whole of the fall before the census that first recorded
  it. [inference]

  **Almost nothing lacked plumbing then.** Four tenths of one per cent of the county's units and
  the same of Lima's — about 171 and 75 buildings. Today the county's figure is 2.97 per cent and
  Lima's 4.19. [verified] — this volume against
  [the facilities](allen-county-housing-facilities-2023.yml). The count has risen roughly sevenfold
  in the county and ninefold in the city, on a stock that has barely grown. [inference]

  **A quarter of the 1990 year-built answers were allocated rather than reported.** 25.2 per cent
  for Allen County against 24.1 for the state; plumbing was allocated for 1.0 per cent and vehicles
  for 1.2. [verified] — CH-2, Table 102. The volume publishes its own imputation rate, which the
  survey that replaced it does not.

  **5,622 households in this county have been in the same house since before that census was
  taken.** Owner-occupied units whose householder moved in during 1989 or earlier: 13.7 per cent of
  all households here, against 11.9 for Ohio and 9.5 for the nation. [verified] —
  [American Community Survey](../../catalog/census-acs-summary-file.md), table B25038. Renter
  households in that band number 248. [verified] — same source.

  **This corpus cannot say what became of the units Lima lost.** A count in 1990 and a count in 2023
  bound the loss and say nothing about demolition, conversion, merger or fire, and the question
  [the vacancy node](allen-county-vacancy-status-2010-2020.yml) left open is left open. [inference]
properties:
  parameter: Allen County housing units
  value: "42758"
  unit: housing units
  as_of: "1990"
  method: |
    CH-1-37 and CH-2-37, Table 1, county summary rows, read from `pdftotext -layout` output.
    [verified] The volumes print shares against a base they also print, so counts recovered from a
    share carry the rounding of one decimal place — about twenty-one units on a base of forty-two
    thousand — and every such conversion here says "about". [inference] The 1990 owner-occupancy and
    room figures are from the complete count; plumbing, kitchen, telephone, vehicles and year built
    are from the sample and carry sampling error the volume does not print. [verified]
