class: measure
label: Birth outcomes in Allen County, 2000–2021
description: |
  What happens when a child is born here, for twenty-two years. [verified] —
  [CDC's Tracking Network](../../catalog/cdc-tracking-network.md), which publishes the national
  vital statistics birth file at county grain.

      year   low birthweight   preterm   fertility rate   infant mortality
             Allen   Ohio      Allen  Ohio   Allen   Ohio    Allen   Ohio
      2000    8.5%   6.3%      11.5%  10.2%  2,360.7 2,020.4    —      —
      2005    7.3    6.8       11.1   11.2   2,208.1 1,978.8  10.33   7.81
      2010    6.7    6.7       11.2   10.4   2,082.1 1,897.1   7.17   7.72
      2013    6.0    6.7       11.4   10.3   2,036.1 1,879.9   6.37   7.64
      2015    7.5    6.7        8.0    8.3   2,072.3 1,869.1   6.79   7.36
      2020    7.7    6.9        8.6    8.6   1,954.2 1,712.4   6.95   7.03
      2021   10.2    7.1       10.8    8.9   2,022.8 1,716.6    —      —

  **This county has more children per woman than Ohio, in every one of the twenty-two years.**
  Its total fertility rate is 2,360.7 per 1,000 women in 2000 against the state's 2,020.4, and
  1,954.2 against 1,712.4 in 2020 — a lead of between 6.6 and 19.0 per cent that never closes and
  never reverses. [verified] — the same source, both geographies. Both fell by about the same
  proportion: 17.2 per cent here and 15.2 in Ohio.

  **It crossed below replacement in 2010 and Ohio was already there in 2000.** A rate of about
  2,100 per 1,000 women is the level at which a population replaces itself without migration; this
  county last stood above it in 2009. [inference] — computed here from the same series. That is
  eleven years later than the state and it is the demographic form of a fact
  [the children node](allen-county-children-2010-2024.yml) have carried as a falling birth count.

  **Prematurity fell by a quarter and low birthweight did not move.** Preterm births run 11.5 per
  cent in 2000 and 8.0 in 2019, while low birthweight begins at 8.5 and ends the pre-2021 record at
  7.7. [verified] — the same source. Allen County is above Ohio on low birthweight in 14 of the 21
  comparable years and above it on prematurity in 13.

  **Infant mortality nearly halved and then stopped falling.** The five-year rate runs 10.33 deaths
  per 1,000 live births in the window ending 2005, 6.37 in the window ending 2013, and 6.95 in the
  window ending 2020, against Ohio's 7.81, 7.42 and 7.03. [verified] — the same source. This county
  was well above the state for the first decade and is at it for the second.

  **2021 is the worst year in the file on both birth measures and one year is not a trend.** Low
  birthweight reads 10.2 per cent and prematurity 10.8, against 7.7 and 8.6 the year before, while
  Ohio moved 6.9 to 7.1 and 8.6 to 8.9. [verified] — the same source. The low-birthweight count went
  from 88 to 120: 32 babies on a base of 88, which is about 2.2 times the square root of the
  counts and is a reading rather than a finding. See
  [a count of tens is a draw](../../decisions/a-count-of-tens-is-a-draw.yml). The state not moving
  is what makes it worth recording at all.

  **The publisher splits three of these measures at 2018 and the overlap says what changed.** Low
  birthweight, prematurity and their counts are identical to the digit in all three overlapping
  years across the two measures; the fertility rate differs in all three — 2,063.7 against 2,064.8
  in 2018 and 1,954.2 against 1,965.8 in 2020. [verified] — [the same source](../../catalog/cdc-tracking-network.md), the two measures of each pair. The
  quantity with a population denominator moved and the quantities counted off birth certificates did
  not, and the same holds at state grain. See
  [an overlap names what changed](../../decisions/an-overlap-names-what-changed.yml).

  **This corpus cannot say whether these outcomes differ by race in Allen County.** The Tracking
  Network offers a county-by-race stratification for these measures and returns no rows for this
  county, which is what small-count suppression looks like. The 6.91-year gap in life expectancy
  between this county's Black and white residents has no counterpart here.

  [open] Where the children are delivered. Every figure above is attributed to the mother's county
  of residence, and this corpus holds no count of births by hospital; whether a Allen County birth
  happens at St. Rita's, at Lima Memorial, or outside the county is not in any source it has
  reached.
properties:
  parameter: low birthweight, prematurity, fertility and infant mortality
  value: "2022.8"
  unit: total fertility rate per 1,000 women, 2021
  as_of: "2021"
  method: |
    Measures 36 and 1416 (percent low birthweight), 30 and 1412 (percent preterm), 35 and 1415 and
    29 and 1411 (the counts), 45 and 1425 (fertility rate) and 279 (infant mortality), all at
    stratification level 2 for FIPS 39003 and for Ohio. [verified] Where a measure exists in two
    variants the table above reads the pre-2018 variant through 2020 and the 2018-onward variant for
    2021, and the two are never averaged. [verified] Infant mortality is a five-year rate labelled
    by its final year, so its 2020 figure covers 2016–2020 and is not comparable year to year with
    the single-year measures beside it. [verified] Low birthweight and prematurity are singleton
    births only, which is the publisher's definition and excludes the twins in whom both are
    commonest. [verified]
