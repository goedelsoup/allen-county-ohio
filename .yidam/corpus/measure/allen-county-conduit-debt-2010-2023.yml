class: measure
label: Conduit debt issued in Allen County's name, 2010–2023
description: |
  **Two billion two hundred and four million dollars of bonds stand issued in Allen County's name
  and the county owes none of it.** The audited statements for the year ended 31 December 2023 put
  the aggregate outstanding principal on the county's conduit debt at $2,204,995,000, and the note
  ends the way it ends every year: the county "is not obligated in any way to pay the debt and
  related charges on these revenue bonds from any of its funds." [verified] —
  [the county auditor](../../catalog/allen-county-auditor-financials.md), the report for 2023,
  Note 19. That is $21,622 for every person in the county, and 21.8 times the $101,209,924 of
  expenses the same report gives the county government for the same year.

  **Every issue the note itemises was for one hospital system.** Through the 2021 report the note
  lists each bond by year, amount and borrower, and the nine issues outstanding at 31 December 2021
  — $1,327,075,000 in all — are Catholic Healthcare Partners and its successor Mercy Health, in
  issues of 2008, 2010, 2012 and 2015. [verified] — the same source, the 2021 report, Note 19,
  summed here. The system's hospital in this county is
  [St Rita's](../organization/mercy-health-st-ritas-medical-center.yml).

      conduit debt outstanding at 31 December, from the county's own audits
      2015   $1,563,890,000        2020   $1,359,350,000
      2017    1,483,250,000        2021    1,327,075,000
      2018    1,429,575,000        2022    2,254,490,000
      2019    1,393,935,000        2023    2,204,995,000

  **What a conduit issue is.** A county lends its name and its tax exemption to a private borrower,
  which then raises money more cheaply than it could alone; the bonds are secured on the financed
  property and payable only from the borrower's payments, and on repayment the property belongs to
  the borrower. [verified] — the same source, the 2010 and 2015 reports, which state the mechanism
  in full before the later reports compress it. Nothing about it appears in the county's own assets
  or liabilities, and no county tax secures a dollar of it. [verified] — the same reports, Note 19.

  **The federal survey put this county first in Ohio on it.** In its 2017 file the Census Bureau
  gives Allen County $1,523,140,000 of long-term industrial revenue debt outstanding — $14,586 for
  every resident, the highest of the fifty-two Ohio counties carrying the item, ahead of Seneca at
  $11,396 and nearly six times Franklin County's $2,516. [verified] —
  [the government finance survey](../../catalog/census-government-finances.md), item `44T`, ranked
  here on the survey's own populations. Allen's figure is flagged as reported by the county; the
  figures for Franklin, Montgomery, Lucas and Butler are the Bureau's imputations.

  **Two instruments measuring the same date land within three per cent of each other.** The federal
  file's $1,523,140,000 for 31 December 2017 against the audit's own itemised sum of $1,483,250,000
  for the same day — a difference of 2.7 per cent, from two collections that share no method.
  [verified] — the same source pair.

  **The balance appears to grow by nine hundred million dollars in the year the disclosure rule
  changed.** $1,327,075,000 at the end of 2021 and $2,254,490,000 at the end of 2022, in the year
  the county adopted GASB Statement No. 91 and the note stopped itemising. [verified] — the same
  source, its reports for 2021 and 2022, Note 19 and the summary of significant accounting policies. Whether the county
  put its name on another nine hundred million dollars or began disclosing obligations it had not
  disclosed before is not decidable from these reports; see
  [a reporting change has a date and a control](../../decisions/a-reporting-change-has-a-date-and-a-control.yml).

  **The corpus cannot follow it after 2017 in any federal file.** The item the Bureau published it
  under is gone from the 2022 release, along with every other government in the country that had
  one. [verified] — [the survey](../../catalog/census-government-finances.md), the two releases
  searched for the code. The county's own audits are now the only source for it.

  **A county that issues two billion dollars for a hospital system is doing something, and this node
  does not say what.** [inference] The arrangement is ordinary municipal finance and it is not
  nothing: a public body's name and its tax exemption are a subsidy with a value, granted by
  commissioners at a meeting, to a borrower that is not the county's. What that subsidy is worth,
  what the county was paid for it, and why a hospital system whose reach is far wider than this
  county issues through it are four questions this file leaves alone.

  **This node does not assert that Allen County is at risk from any of this money.**

  [open] Why this county. The largest single issue is $334,015,000, and nothing in the audits
  explains why an Ohio county of a hundred thousand people is the issuer of record for it. Closing it needs the bond official statements, which are filed with the Municipal
  Securities Rulemaking Board and were not read here, or the commissioners' resolutions authorising
  each issue.

properties:
  parameter: conduit debt outstanding, issued by the county for private borrowers
  value: "2204995000"
  unit: dollars outstanding at 31 December 2023
  as_of: "2023"
  method: |
    The 2010, 2013, 2022 and 2023 figures are the aggregates the reports themselves print; the 2015
    through 2021 figures are the sum of the balances the note gives for each issue, which the
    reports do not total. [verified] The 2010 and 2013 aggregates are not used in any comparison
    here, because each contradicts its own paragraph: the 2010 note describes a $195,000,000 issue
    of that year and then gives an aggregate of $22,460,000, and the 2013 note omits the
    $300,000,000 issue of 2008 that every later report carries as outstanding. [verified] The
    per-resident figure divides by the 2022 population the finance survey attaches to the county
    government, 101,980. [verified] The ranking of Ohio counties on industrial revenue debt uses the
    survey's own population column for all fifty-two, which is one consistent denominator.
    [verified]
