class: measure
label: Allen County population by race, 2023
description: |
  Race and Hispanic origin for the county, its thirteen civil subdivisions, the state and the
  nation. [verified] — [American Community Survey](../../catalog/census-acs-summary-file.md),
  2023 five-year estimates.

      geography              population    white    Black   two+   Hispanic
      United States         332,387,540    63.4%    12.4%  10.7%      19.0%
      Ohio                   11,780,046    77.8%    12.3%   5.7%       4.6%
      Allen County              101,685    80.9%    10.6%   6.2%       3.4%
      ---------------------------------------------------------------------
      **Lima**                   35,304    64.0%    23.5%   9.7%       4.8%
      American Township          14,435    84.3%    10.1%   3.6%       2.8%
      Shawnee Township           12,502    87.2%     4.1%   5.6%       4.0%
      Perry Township              3,364    90.3%     5.2%   4.2%       3.1%
      Marion Township             6,663    94.5%     1.7%   3.3%       1.4%
      Richland Township           5,859    91.2%     1.6%   2.9%       1.7%
      Spencer Township            3,024    96.6%     1.2%   1.2%       0.6%
      Jackson Township            3,103    92.7%     1.0%   5.7%       0.4%
      Bath Township               9,337    91.0%     0.9%   5.3%       3.4%
      Auglaize Township           2,779    96.4%     0.6%   2.7%       0.6%
      Amanda Township             1,823    93.6%     0.3%   2.6%       1.7%
      Monroe Township             2,094    90.5%     0.0%   9.1%       9.3%
      Sugar Creek Township        1,398    95.8%     0.0%   3.8%       1.1%

  **A century ago the county was 2.0 per cent Black and Lima 3.0.** 1,385 of 68,223 and 1,243 of
  41,326 at the census of 1920, against 10,805 of 101,685 and 8,290 of 35,304 now. [verified] —
  [the 1920 census](allen-county-population-by-race-1920.yml). Lima's Black population is nearly
  seven times what it was; the city's total is fifteen per cent smaller. [inference] — computed here.

  **The rise is not steady and the corpus can now say when it happened.** 1,385 in 1920, 1,686 in
  1930, 1,916 in 1940, then 4,391 in 1950 and 7,322 in 1960 — more growth in the single decade of
  the 1940s than in the two decades before it together. [verified] —
  [the four censuses between](allen-county-population-by-race-1930-1960.yml). It went on rising
  without a break for four more censuses: 9,234 in 1970, 10,975 in 1980, 12,313 in 1990 and 13,225
  in 2000, which is nine consecutive counts and eighty years. [verified] —
  [the censuses after 1960](allen-county-population-by-race-1970-2020.yml).

  **Lima's share is not the end of a long slide, and this node said it was.** It fell from 89.7 per
  cent in 1920 to 74.7 in 1950 and then went back up, to 88.9 by 1990 — its 1920 level — before
  falling again to 78.8 at the census of 2020. [verified] — the same series. The 76.7 measured here
  is the low point of a thirty-year fall, not a hundred-year one. [inference] — computed against
  the same.

  **Lima holds a third of the county's people and three quarters of its Black residents.** 8,290 of
  10,805, or 76.7 per cent ± 4.6, against a 34.7 per cent share of the population. [verified] — same
  source. The twelve townships hold the other 2,515, and the two sum exactly to the county's figure.

  **Eight of the twelve townships have fewer than a hundred Black residents**, and two report none.
  [verified] Outside Lima and the two townships that adjoin it — American at 10.1 per cent and
  Shawnee at 4.1 — the county is between 90 and 97 per cent white. [verified]

  **The census counted 1,768 more Black residents here in 2020 than this survey estimates for
  2019–2023, and the interval does not reach it.** 12,573 counted against 10,805 ± 658, a gap of 2.7
  margins, on a county whose total moved by 521 people between the two. The same pair disagrees the
  other way on White alone — 80,753 counted against 82,251 ± 428 — and agrees almost exactly on the
  multiple-race total, 6,237 counted against 6,255 ± 762. [verified] —
  [the 2020 count](allen-county-population-by-race-1970-2020.yml) and this source, table B02001.
  Every share on this page is a survey's share and the county has a count of the same thing three
  years earlier that puts it at 12.3 per cent rather than 10.6. [inference] — computed here; see
  [a survey is not a count](../../decisions/a-survey-is-not-a-count.yml).

  This does not establish why the county is distributed this way. It measures where people live.
  Two of the four records this sentence once said the corpus did not hold have arrived —
  [the housing](allen-county-housing-stock-2023.yml) and
  [the lending](allen-county-home-lending-2023.yml) — and they narrow the question rather than
  closing it: the county's housing is sorted the way its people are, and its mortgage market denies
  a purchase loan inside Lima at the rate it denies one anywhere else. No zoning map and no
  annexation record has been read. A distribution is still not an explanation.
properties:
  parameter: population by race (B02001) and Hispanic origin (B03003)
  value: "10805"
  unit: residents identifying as Black or African American alone, Allen County
  as_of: "2023"
  method: |
    2023 five-year estimates. Race categories are "alone" except the two-or-more column; Hispanic
    origin is asked separately and overlaps every race column, so the rows do not sum to 100.
    The twelve townships and Lima partition the county: 2,515 plus 8,290 is 10,805, the county
    row. [verified]
