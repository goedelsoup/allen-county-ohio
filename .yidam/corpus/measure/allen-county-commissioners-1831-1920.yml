class: measure
label: The Allen County board of commissioners, 1831–1920
description: |
  Seventy-five annual photographs of a three-man board, sixty-eight men, and a printing convention
  that turns out to be an audit. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), "Board of County
  Commissioners", and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), "County
  Commissioners".

  **The 1906 book prints the board at the end of every year from 1831 to 1905 — seventy-five rows,
  three names each, and fifty-three men.** The county's first board, seated in June 1831, was James
  S. Daniels, John G. Wood and Samuel Stewart. [verified] — the 1906 history, counted row by row.
  The 1921 book adds fifteen more names to 1920, so sixty-eight men held the office in its first
  ninety years. [verified] — both rosters compared.

  **Every row is the row before it, shifted one place right.** The new commissioner is written
  first, the previous first name second, the previous second name third — and the man in third place
  is the one who goes. Of the sixty-three transitions from 1842 to 1905, fifty-eight are exactly
  that and five are not. [verified] — the seventy-five rows, differenced in order.

  **The rule holds even in the twenty-two years when nobody new arrives.** In every one of those the
  three men are the same three and the order still turns over: the third name becomes the first,
  twenty-two times out of twenty-two, without a single exception in seventy-five years. [verified] —
  same series. So the first column is not one thing. In an election year it is the incoming
  commissioner; in a year without one it is the incoming president of the board.

  **Both books explain that column and neither explains all of it.** The 1906 book says "the first
  person named is in most cases the commissioner elected that year". The 1921 book says the old
  rosters name "the president of the board first", and that "it seems that there has sometimes been
  reorganization when there has not been an election". [verified] — the two prefaces. The
  reorganization was not sometimes. It was every year the board did not change, and it went round in
  order. [inference] — computed from the series.

  **The five deviations after 1842 are the whole of what the roster can be made to confess.** Each
  is a departure out of course, and only one of them is annotated:

      1848  Samuel B. Walker leaves from second place, a year early; Samuel Rockhill enters
      1865  Almon E. Hadsell and Freeman Bell both go; George W. Goble and Johnzey Keeth both enter
      1884  "Alexander Shenk (vice Marshall)" — the book's own annotation, and its only one
      1890  not an event: 1889 is missing, so this row has no true predecessor to be shifted from
      1894  George D. Kanawl and William Bice both go; James A. Jacobs and Aaron J. Osman enter

  [verified] — the same differencing; the 1884 quotation is the book's. Four turns out of course
  that the book does not mark are visible because the shape of the list marks them. [inference] —
  see [the shape of a list is evidence](../../decisions/the-shape-of-a-list-is-evidence.yml).

  **The book skips 1889 and says nothing about it.** It runs 1888 to 1890 with no row between, and
  the hole manufactures two false careers: John Akerman and William Bice both appear to leave the
  board and return, and neither did. [verified] — the printed list. Any commissioner who served only
  1889 is invisible and this corpus cannot rule one out. [open]

  **Before 1842 the pattern is not there.** Eight of the first eleven transitions break it, against
  five of the next sixty-three. [verified] — same series. Either the board's terms were not yet
  regular or the compiler's early sources were not good enough, and nothing held here chooses.
  [open]

  **The seat's calendar has moved twice and the corpus can date neither move.** The 1906 book says
  that in its later years "the term of office began in September following the election"; the 1921
  book reports a term "expiring January 21, 1923"; the county's three seats now begin on the first,
  second and third of January. [verified] — the two histories and
  [the Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md); see
  [the board](../office/allen-county-board-of-commissioners.yml).

  **The 1921 roster is undated, drops one man, and respells seven.** It gives the names "without
  further effort to show their time of service" and, once its spellings are reconciled, contains
  every one of the 1906 book's fifty-three except John P. Mitchell, commissioner in 1832 and 1833 —
  four of the other missing five being named in the paragraph above the list. [verified] — the two
  rosters compared name by name. It writes Ackerman for Akerman, Bixbey for Bixby, Zanglenn for
  Zanglein, Johnzy for Johnzey, Lippencott for Lippincott, James C. for James H. Coleman, and
  **Albert Shenk for Alexander Shenk** — which is a different given name, not a different spelling.
  [verified] — same comparison; see [Alexander Shenk](../person/alexander-shenk.yml).
properties:
  parameter: men named as county commissioner, 1831–1920
  value: "68"
  unit: persons
  as_of: "1920"
  method: |
    The 1906 list was parsed from the archive.org full text and then checked by hand against the
    scan, because the OCR breaks names across lines and the shift-register test is worthless if a
    name is wrong in one row and right in the next: "H. B. Thorn" for Henry B. Thorn in 1837 alone
    would have manufactured two departures. Four such artifacts were reconciled — that abbreviation,
    "Bernard Escli" for Esch, "Franeis M. Clum" for Francis, and a stray comma in "Alexander,
    Conrad" — and each is a scan defect rather than a difference between editions. The 1921 list was
    transcribed by hand. The count of 68 is persons: fifty-three in the dated list plus fifteen names
    the 1921 book adds after Charles W. Johnston, with the initialled forms matched to their full
    forms only where the surname and the position in sequence both agree. [verified]
