class: measure
label: Eviction filings in Allen County, 2002–2018
description: |
  Eviction cases filed in this county's courts, and the households they were filed against, for
  every year the federal-scale collection covers. [verified] —
  [the Eviction Lab](../../catalog/eviction-lab-county-data.md), court-issued series, `fips_county`
  39003.

      year  filings  households  renters   filing rate
      2002      766         690   11,590         6.61%
      2005      887         783   11,939         7.43%
      2008      982         838   12,288         7.99%
      2011      922         809   12,757         7.23%
      2014      863         783   13,466         6.41%
      2017      806         729   14,176         5.69%
      2018      925         831   14,412         6.42%

  **One renter household in fifteen has an eviction filed against it in this county every year.**
  The rate runs between 5.69 and 7.99 per cent across seventeen years and averages 6.79. [verified]
  — the same file; the rates are the file's own numerator over its own denominator. Against the
  35.7 per cent of this county's renters who pay more than a third of their income for housing, it
  is the sharp end of the same fact. [inference] — see
  [the cost burden](allen-county-housing-cost-burden-2006-2022.yml).

  **The count does not move and the rate barely does.** Filings run from 766 to 982 with a mean of
  865 and a standard deviation of 56, across seventeen years that contain a foreclosure crisis, a
  recession and a quarter more renter households. [verified] — the same file. The filing rate falls
  by 0.058 points a year, which is 0.92 points over the run against a mean of 6.79, on a standard
  error of 0.024 — a t of 2.4 on seventeen annual points. [inference] — the regression computed
  here. That is a real drift and a weak one, and it is about as small a movement as seventeen
  readings of this series could have found; see
  [a flat series is a claim](../../decisions/a-flat-series-is-a-claim.yml).

  **The year-to-year movement is twice what chance alone would give and it goes nowhere.** A
  Poisson draw at a mean of 865 has a standard deviation of 29 and this series has 56. [inference] —
  computed here, and the test is the one
  [a count of tens is a draw](../../decisions/a-count-of-tens-is-a-draw.yml) asks for. So the county
  does have real eviction years and quiet ones — 982 in 2008 against 766 in 2002 — without having a
  direction.

      Allen against Ohio        state rate   Allen   rank of 87
      2002                           7.57%   6.61%           16
      2010                           7.18%   7.20%            8
      2018                           6.18%   6.42%           11

  **This county is below the state's rate and in the top fifth of its counties, and both are true.**
  The state figure is filings over renter households across all 87 reporting counties, so it is
  weighted towards the large urban ones where the rate is highest; the ranking gives every county
  one place regardless of size. Allen's rank runs from 8th to 22nd across the seventeen years, with
  a median of 14th. [verified] — the same file, all 87 Ohio counties. A sentence that says *below
  average* and a sentence that says *among the worst* are answering different questions here.
  [inference]

  **A filing is not a household and neither is an eviction.** 925 cases were filed in 2018 against
  831 households; the ratio runs from 1.100 to 1.195 across the run, so between a tenth and a fifth
  of filings in any year are repeats against a household already sued. [verified] — the same file.

  This corpus cannot say how many people were put out of their homes. [inference] — the court-issued
  file counts filings and households sued; the legacy file counts judgments and stops in 2016; and a
  judgment is an order rather than a record that anyone moved.
  **A fourth witness, and it is the same witness.** The Supreme Court of Ohio's statistical report
  gives the Lima Municipal Court's new forcible entry and detainer filings for 2007 to 2017, and for
  2008, 2011 and 2014 they are 982, 922 and 863 — the figures in the table above, to the unit. 2017
  differs by four, 802 against 806. [verified] —
  [the court's own returns](allen-county-foreclosures-and-evictions-2007-2017.yml), out of
  [the Ohio Courts Statistical Report](../../catalog/ohio-courts-statistical-report.md). Both chains
  begin at that court's docket, so the agreement establishes that neither pipeline mangles the
  count rather than that the count is independently confirmed; see
  [an exact match is a question](../../decisions/an-exact-match-is-a-question.yml).

  **What the court adds is the other side of the same courthouse.** Foreclosure filings in the
  county's general division peaked at 996 in 2008 — within fourteen of that year's evictions — and
  fell to 264 by 2017, while these filings did not move. [verified] — the same returns.

properties:
  parameter: eviction cases filed
  value: "925"
  unit: filings
  as_of: "2018"
  method: |
    The Eviction Lab's court-issued county file, `fips_county` 39003, seventeen years from 2002 to
    2018. [verified] Rates are `filings_observed` over `renting_hh`, both from that file; the
    denominator is interpolated between census and survey vintages and moves smoothly every year.
    State figures are sums over all Ohio rows in the same file — 87 counties in every year but 2017,
    which has 88 — and the rank is of county filing rates within each year. The trend is an ordinary
    least-squares fit of the annual rate on the year with the standard error from the residuals; no
    correction is made for serial correlation, which would widen it. The legacy and proprietary
    series are held and not used here, and their spread against this one is recorded in the
    catalogue entry.
