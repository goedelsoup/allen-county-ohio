class: measure
label: Allen County presidential vote, 1888–1908
description: |
  Six presidential elections from the Secretary of State's own returns, filling six of the eight
  the corpus had between [1884](allen-county-presidential-vote-1856-1884.yml) and
  [1920](allen-county-presidential-vote-1920.yml). [verified] —
  [the 1888–1910 series](../../catalog/ohio-election-statistics-1888-1910.md).

      year  Republican             Democratic            others   total    margin
      1888  Harrison      3,761    Cleveland    5,123       274    9,158   D+1,362
      1892  Harrison      3,579    Cleveland    4,945       902    9,426   D+1,366
      1896  McKinley      4,959    Bryan        6,360       210   11,529   D+1,401
      1900  McKinley      5,281    Bryan        6,540       200   12,021   D+1,259
      1904  Roosevelt     6,091    Parker       4,980       532   11,603   R+1,111
      1908  Taft          5,841    Bryan        7,195       682   13,718   D+1,354

  [verified] — same series. The Republican and Democratic columns are printed; "others" is the
  residual where a total is printed and the sum of the minor columns where an abstract is held, and
  the two cases are named in the method below. [inference] — computed here.

  **The realignment of 1896 did not reach this county.** William McKinley was Ohio's own governor
  and the head of the ticket, and he gained five points here over Harrison's 1892 share — and still
  lost Allen County by 1,401 votes, the widest Democratic margin of the six. [verified] —
  [the 1896 abstract](../../catalog/ohio-election-statistics-1888-1910.md). Bryan appears twice on
  the 1896 ballot, Democratic and People's; the 34 votes on the second line put his share at 55.5
  per cent rather than 55.2. [inference] — computed here.

  **The county's first Republican presidential majority since the Civil War is 1904, and it lasted
  one election.** Roosevelt takes 52.5 per cent; four years later Bryan takes 7,195 votes, the
  largest Democratic vote anywhere in this run, and the county goes back. [verified] — same series;
  the only earlier Republican win in the record is
  [the estimated 1864](allen-county-presidential-vote-1856-1884.yml).

  **The county did not turn at an election. A fixed block of votes was diluted.** Across the seven
  presidential elections from 1884 to 1908 the margin never leaves a band 331 votes wide — 1,070,
  1,362, 1,366, 1,401, 1,259, 1,111 and 1,354 — while the vote cast grows from 7,903 to 13,718, or
  74 per cent. As a share the Democratic edge falls almost monotonically: 13.5 points, 14.9, 14.5,
  12.2, 10.5, −9.6 and 9.9, the negative term being 1904 and the only one the Republican carried.
  [inference] — computed from the table above and
  [the 1884 return](allen-county-presidential-vote-1856-1884.yml). This corpus does not know who the
  arriving voters were; the county gained 16,662 residents between 1880 and 1900 and no source held
  here says how they voted. [inference] — against
  [the county's own series](allen-county-population-1830-1900.yml).

  **The third-party vote is where this county is least like its state.** 1892 puts 902 votes, 9.6
  per cent, outside the two parties — against 6.0 per cent statewide in the same table. [verified] —
  [the 1893 report](../../catalog/ohio-election-statistics-1888-1910.md), county and state rows. By
  1896 that collapses to 210, and 1904 and 1908 rebuild it to 532 and 682, which is Debs.

  **Warren G. Harding lost this county before he won it.** Running for governor in 1910 he took
  3,825 votes here against Judson Harmon's 5,837, on a total of 10,574; ten years later he carried
  it for president 13,978 to 11,658. [verified] —
  [the 1910 report](../../catalog/ohio-election-statistics-1888-1910.md) and
  [the 1920 return](allen-county-presidential-vote-1920.yml).

  **The office printed one of these figures two ways.** McKinley's 1896 vote here is 4,959 in the
  abstract and in the 1904 volume, and 4,956 in the 1908 volume. [verified] — same series; see
  [a reprint is not a second witness](../../decisions/a-reprint-is-not-a-second-witness.yml).

  [open] 1912 and 1916. Archive.org holds no Ohio volume covering either general election, and the
  two of them are what stands between this table and the Republican county of 1920.
properties:
  parameter: presidential votes cast, Allen County
  value: "13718"
  unit: votes
  as_of: "1908"
  method: |
    Every figure read from a page render; no figure taken from a text layer, which for these
    volumes is either column-major and unassemblable or row-major and wrong — it gives Allen 3,079
    and 4,946 in 1892 where the page prints 3,579 and 4,945. Totals: 1892, 1900 and 1908 are the
    volumes' own printed total-vote columns and "others" is the residual; 1888, 1896 and 1904 are
    abstracts with every candidate column, and the total is this corpus's addition. 1888 and 1904
    check against printed plurality columns, 1892 and 1896 and 1900 and 1908 against a second
    printing of the same county row in a different volume. [verified]
