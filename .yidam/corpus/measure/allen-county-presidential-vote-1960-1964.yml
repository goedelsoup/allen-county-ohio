class: measure
label: Allen County presidential vote, 1960 and 1964
description: |
  Two elections from a federal reference volume, in the shape that volume prints them: which party
  led, and with what share of the whole vote. **Allen County's leading party was Republican in both,
  with 65.5 per cent in 1960 and 51.2 in 1964, on a 1964 turnout of 38,887 votes.** [verified] —
  [the County and City Data Book for 1967](../../catalog/census-county-and-city-data-book-1967.md),
  items 13 to 15.

  These are the first two elections the corpus has held between
  [1920](allen-county-presidential-vote-1920.yml) and 1980, and the hole they open into is the one
  an open block in [the modern series](allen-county-presidential-vote-2000-2016.yml) named as the
  place where this county turned Republican.

  **The same volume puts Ohio's 1964 leading party on the other side, at 62.9 per cent
  Democratic.** Johnson carried the state on 3,969,196 votes cast; Goldwater carried this county.
  In 1960 the state's leading party was Republican with 53.3 per cent, so the county ran 12.2
  points ahead of it. [verified] — same volume, Table 1, Ohio.

  That is the finding and it does not need a subtraction: in 1964 the party that led Ohio and the
  party that led Allen County were different parties. [inference] — the two rows, compared here.

  **Nixon's share here in 1960 and Reagan's in 1980 are three tenths of a point apart.** 65.5 per
  cent against 65.8, twenty years and five elections apart, with the county's turnout up by 5,267
  votes across the same span. [inference] — computed against
  [the 1980–1996 returns](allen-county-presidential-vote-1980-1996.yml).

  **The 1964 turnout is 37.5 per cent of the county's 1960 population.** 38,887 votes against
  103,691 residents — not a participation rate, because the denominator counts children and
  non-citizens, but the only ratio the two volumes together support. [inference] — computed against
  [the county's 1960 count](allen-county-population-by-race-1930-1960.yml).

  **This node cannot say what the losing candidate got in either year.** The volume prints a party
  letter and one percentage for each election and no second column, so there is no Democratic
  figure to subtract from, no margin, and no two-party share. Where the county's other returns give
  a Republican share out of a total that includes third parties, these two give the leading party's
  share of the same denominator — which is the same quantity only because the Republican led both
  times. [verified] —
  [the volume's note to items 13–15](../../catalog/census-county-and-city-data-book-1967.md).

  **The figures were confirmed in a second table before they were published.** The volume's OCR
  shifts the last three columns of the county table down by one row, so Allen County's numbers
  appear under Ashland's name. They were taken instead from Table 3, which carries `Lima, Ohio`
  with a 1960 population of 103,691 — the county's own figure, because in 1960 the Lima
  metropolitan area was Allen County and nothing else — and which does not shift. [verified] —
  same volume, Tables 2 and 3.

  **The corpus now holds twenty-eight of the forty-two presidential elections from 1856 to 2020.**
  Fourteen are unread: 1912 and 1916, then 1924 through 1956 without a break except the 1920 the
  corpus already had, and then 1968, 1972 and 1976. [inference] — counted here against
  [1856–1884](allen-county-presidential-vote-1856-1884.yml),
  [1888–1908](allen-county-presidential-vote-1888-1908.yml),
  [1920](allen-county-presidential-vote-1920.yml),
  [1980–1996](allen-county-presidential-vote-1980-1996.yml) and
  [2000–2016](allen-county-presidential-vote-2000-2016.yml).
properties:
  parameter: presidential votes cast, Allen County
  value: "38887"
  unit: votes
  as_of: 1964-11-03
  method: |
    Read from the archive.org OCR of the 1967 volume rather than from its 212 MB scan. The county
    table's last three columns lag one row in that OCR — Adams's triple prints under Allen's code,
    Allen's under Ashland's name — so every figure here was taken from Table 3, the metropolitan
    areas, where the Lima row is Allen County exactly and no lag occurs, and then checked back
    against the lagged position in Table 2. The 1960 population printed beside the vote in Table 3
    is 103,691, which is the county's own census figure and is what identifies the row. [verified]
