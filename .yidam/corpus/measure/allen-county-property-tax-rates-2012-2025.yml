class: measure
label: Property tax rates in Allen County by taxing district, 2012–2025
description: |
  **Thirty-six taxing districts, six authorities levying on each, and no two districts charging the
  same.** [verified] —
  [the Auditor's tax rate summaries](../../catalog/allen-county-auditor-tax-rates.md), tax years
  2012 through 2025, one file each.

      tax year   county column   tax sets   lowest full   highest full   mean reduction
      2012          6.150         37        47.200        69.343           19.6%
      2013          6.150         36        49.320        74.305           18.8%
      2014          6.150         37        49.160        71.276           18.2%
      2015          6.150         37        49.570        72.174           20.0%
      2016         11.400         36        49.310        70.694           20.3%
      2017         11.400         36        49.360        70.744           19.8%
      2018         11.400         36        49.170        70.191           20.7%
      2019         11.400         36        48.790        71.060           20.7%
      2020         11.400         36        48.490        70.850           20.5%
      2021         11.400         36        48.490        74.988           23.1%
      2022         11.400         36        48.490        74.708           23.2%
      2023         11.400         36        48.380        74.470           24.3%
      2024         11.400         36        47.297        71.951           28.9%
      2025         11.400         36        46.947        71.974           29.0%

  Rates are in mills — dollars per thousand dollars of taxable value. **Mean reduction** is the
  share of the full voted rate that Ohio's reduction factors take off before a residential or
  agricultural bill is computed, averaged over the districts. [verified] — same source.

  **The county column is not a series.** It reads 6.150 in every tax set from 2012 through 2015 and
  11.400 in every tax set from 2016, and across that boundary the total full rate of the
  thirty-six districts present in both years moves by between −1.710 and +0.700 mills, mean −0.332.
  Five mills moved out of *Library/Other* and into *County* when the report changed layout.
  [verified] — same files, differenced by tax set. See
  [a rule written for a classification caught a layout](../../decisions/a-rule-written-for-a-classification-caught-a-layout.yml).

  **What the county actually charges is in a different document, and it rose by a third.** The
  audited statements put the full rate for all county operations at $8.70 per $1,000 for the reports
  of 2010 to 2013, $9.70 for 2014 and 2015, and $11.40 from 2017 to 2023. [verified] —
  [the audited financial statements](../../catalog/allen-county-auditor-financials.md), the
  *Property Taxes* note in each; see
  [the tax base](allen-county-assessed-valuation-2010-2023.yml).

  **The reduction factors have roughly doubled their bite in fourteen years.** The average district
  lost 19.6 per cent of its voted millage to them in tax year 2012 and 29.0 per cent in 2025, and
  the step is at 2024, the second year after the 2021 reappraisal. [verified] — same source,
  computed here across all districts in each year.

  **A tax set is an intersection and not a place.** *Shawnee L. S. D.* is four sets in 2025 — F20
  at 53.674 mills, M39 at 52.174, G23 at 61.174 and L35 at 71.974 — one school district crossed by
  four combinations of township, village and library. [verified] — same source.

  **The school district is most of the bill everywhere.** Local school plus joint vocational millage
  is between 50.1 and 73.2 per cent of the full rate in every one of the thirty-six districts.
  [inference] — computed here from the 2025 table.

  **The highest and lowest bills are not the highest and lowest votes.** In 2025 Shawnee L35 has
  both the highest full rate at 71.974 and the highest effective rate at 54.233. But Delphos City
  S.D. votes 70.250 mills and collects 34.460, half of it reduced away, while Bath L.S.D. votes
  51.497 and collects 44.322. The lowest effective rate in the county is Pandora-Gilboa's 30.562 on
  a full rate of 52.750. [verified] — same source.

  **In figures, the 2025 effective residential rates at four points: 54.233 in Shawnee L35, 44.322
  in Bath, 34.460 in Delphos City S.D. and 30.562 in Pandora-Gilboa.** [verified] — read from the
  table below, same source.

