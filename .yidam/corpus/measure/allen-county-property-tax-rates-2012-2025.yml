  **The Village of Fort Shawnee has a tax set here and stops levying inside it.** Set L36, *Fort
  Shawnee Corp.*, carries 2.150 mills of village tax in tax year 2012 and a township rate of 10.200
  against the 15.600 its neighbours pay. It is absent from the 2013 file altogether. It returns in
  2014 and 2015 with no village millage and a township rate of 15.600 — identical to the township's
  own set in every column — and is gone from 2016. [verified] — same source, tax sets L35 and L36.
  See [the village](../jurisdiction/village-of-fort-shawnee.yml), whose electors ended it five weeks
  before that first tax year, and
  [the question that closes on it](../question/what-happened-to-the-village-of-fort-shawnee.yml).

  **The millage in these tables is what was voted, and the corpus can now see it being voted.**
  Eighty tax and bond questions were put in this county between 2003 and 2012, and the words the
  ballot uses — renewal, replacement, additional — decide the result far more sharply than the
  amount does: 57 of 58 renewals and replacements carried and 6 of 17 additional levies did.
  [verified] — [the ballot record](allen-county-ballot-questions-2003-2012.yml). A replacement
  re-levies the same millage against current valuations rather than the frozen base the reduction
  factors hold a renewal to, so it collects more money than a renewal of the same size — and this
  electorate passed the two at indistinguishable rates. [inference] — the reduction factors above,
  against the same record.

  [open] What the county's tax rates were before 2012. Five scanned volumes on the Auditor's own
  site cover 1936 to 2010 and a sixth covers 2011, and none of the six has a text layer.
properties:
  parameter: full tax rate, highest taxing district in the county
  value: "71.974"
  unit: mills
  as_of: "2025"
  method: |
    The Auditor's tax rate summary PDF for each tax year 2012 through 2025, extracted with
    `pdftotext -layout` and parsed by tax set. Tax years 2012–2015 use one column order and 2016
    onward another; the parser reads the layout from the page header rather than assuming one. Tax
    year 2013 prints the district name and its rates on separate lines and needs its own pairing
    rule. Effective rates are the file's own `RES-AGR EFFECTIVE RATE`, and reduction shares are
    computed here as one minus the effective rate over the full rate. Tax year 2011 and the five
    historical volumes are scans and are not read. [verified]
