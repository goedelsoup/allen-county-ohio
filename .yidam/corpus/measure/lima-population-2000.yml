class: measure
label: Lima population, 2000 estimates base
description: |
  The April 1, 2000 estimates base for Lima city. [verified] —
  [Census Intercensal Estimates, 2000–2010](../../catalog/census-intercensal-2000-2010.md),
  sub-county file.

  This is the earliest figure the corpus holds for Lima, and against the
  [2024 estimate](lima-population-2024.yml) of 34,690 the city has lost 5,617 people, or
  13.9%, over 24 years — twice the county's 7.0% over the same span. [inference] — arithmetic
  this corpus's; all four figures verified.

  Like every Census figure for Lima this counts the corporation's territory on the date, so
  the comparison assumes the boundary did not move materially. It did move: Lima annexed 601 acres
  between June 2002 and December 2009 and 5.9 acres in 1991, so the 2024 figure is for ground about
  a square mile larger than the 2000 figure's. [verified] —
  [the Boundary and Annexation Survey](../../catalog/census-bas-boundary-changes-ohio.md), as read
  in [the annexation record](allen-county-annexations-1990-2024.yml). The loss is therefore an
  understatement of the loss inside the 2000 line. [inference]

  **Three federal figures exist for Lima on 1 April 2000 and they differ by fifteen hundred.** The
  2000 volume prints 40,081, this node's intercensal base is 40,307, and the 2010 volume restates
  the 2000 count as 41,581 with a revision mark. [verified] —
  [the 2000 volume](../../catalog/census-phc-3-37-ohio.md) and
  [the 2010 volume](../../catalog/census-cph-2-37-ohio-2010.md).

  **The revision is a transfer and it balances.** Against the 2000 volume, the 2010 volume moves
  Lima +1,500, American Township −1,491 and Bath Township −9, summing to zero, and the county's
  2000 total is 108,473 in both books. [verified] — the same tables. Lima's 2000 housing count
  differs between them by three units and American's by two.

  Fifteen hundred people and no houses is a group quarters, and the corpus holds two correctional
  institutions on one piece of ground at the north edge of the city, one of which
  [closed in 2004](../site/allen-correctional-institution.yml). [inference] — the arithmetic is
  verified, the identification is not; no correction note in either volume says what moved.
properties:
  parameter: total resident population
  value: "40307"
  unit: persons
  as_of: "2000-04-01"
  method: |
    Decennial enumeration as revised for the intercensal series. [verified]
