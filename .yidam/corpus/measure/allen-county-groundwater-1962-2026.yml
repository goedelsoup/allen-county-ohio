class: measure
label: Water levels in Allen County's wells, 1962–2026
description: |
  **Eighty-seven of the county's ninety groundwater wells have a water level on record, and the
  record is 904 readings across sixty-four years.** [verified] —
  [USGS NWIS](../../catalog/usgs-nwis.md), the field-measurements collection, county 39003, site
  type `GW`, parameter `72019`. The county has 185 water monitoring sites and this is the half of
  them the corpus had never read; see [the gauges](allen-county-water-gauges-2026.yml).

  **Eight hundred and three of the 904 are from 1998.** Thirty readings cover the thirty-six years
  from October 1962 to April 1997. Then one year holds seventy-five wells and forty days of work —
  383 readings at 68 wells across five days in October alone, and 258 at 28 wells across four days
  in December. Then nothing until 2010. [verified] — the same source, its field-measurements
  collection, counted by date.

  **Every reading taken in this county since 1998 is from one well.** All seventy-one of them,
  between 23 July 2010 and 16 July 2026, are from AL-5, a well in
  [Shawnee Township](../place/shawnee-township.yml) read four or five times a year by the Ohio
  Department of Natural Resources. Eighty-nine wells and one instrument. [verified] — the same
  source, grouped by site.

  **The water in it has fallen eleven and a half feet.** Its mean depth to water was 21.61 feet
  below land surface across its first three years and 33.30 across its last three, a drop of 11.70
  feet, at a fitted 0.849 feet a year with an R² of 0.81. [verified] — the same source, its
  seventy-one readings; the fit computed here. The well is 203 feet deep, stands at 829 feet, was
  constructed on 20 September 2005, and takes water from the Silurian aquifer under confinement.
  [verified] — the same source's monitoring-locations collection.

  **It falls three times as fast as any well around it and it is the only one that falls in a
  line.** The same agency reads one or two wells in each of the six adjoining counties, in the same
  national aquifer, at the same cadence, published in the same file. [verified] — the same
  source, queried for counties 39011, 39137, 39161, 39063, 39065 and 39107.

      well                  n   ft/yr   first 3 yr   last 3 yr    change     R²
      Allen      AL-5      71  +0.849       21.61       33.30    +11.70   0.81
      Auglaize   AU-4      68  +0.283       51.46       56.75     +5.29   0.19
      Mercer     MR-2      65  +0.254       68.76       72.07     +3.31   0.52
      Van Wert   VW-1      70  +0.175       26.77       28.44     +1.66   0.13
      Auglaize   AU-3      70  +0.115        6.40        8.12     +1.72   0.16
      Hancock    HA-3      63  +0.097        4.57        5.91     +1.34   0.23
      Putnam     PU-1      56  +0.079       13.28       13.65     +0.37   0.03
      Hardin     HN-2A     92  +0.045        8.32        8.86     +0.54   0.02
      Hardin     HN-1      70  -0.125       13.88       11.96     -1.91   0.11

  In figures: the eight neighbour wells run from a fall of 0.283 feet a year at Auglaize's AU-4 to a
  rise of 0.125 at Hardin's HN-1, with Mercer's MR-2 at 0.254 and Van Wert's VW-1 at 0.175, against
  0.849 here; their median R² is 0.15 against 0.81. [verified] — the same source, the nine
  series fitted here.

  **This node does not assert that the county's water table is falling.** One well is not a water
  table, and a confined well measures pressure rather than a surface. What the geographic control
  buys is narrower and it is stated at its own strength: whatever is lowering the water at AL-5 is
  not lowering it in the six counties around it, so the movement is not the instrument. See
  [the control can be the county next door](../../decisions/the-control-can-be-the-county-next-door.yml).

  **The 1998 campaign is concentrated on one point and the file does not say what is there.**
  Thirty-six of the eighty-seven measured wells stand within two kilometres of 40.755°N,
  84.331°W — near Southworth, on the Marion–Spencer–Amanda township corner — and carry 571 of the
  904 readings, 562 of them in 1998. Forty-three of the county's ninety wells are in
  [Amanda Township](../place/amanda-township.yml) alone. [verified] — the same source's
  coordinates, against
  [the TIGER county-subdivision layer](../../catalog/census-tiger-hydrography.md),
  point-in-polygon here. Sixty-eight wells read five times over five days in one October is the
  shape of an aquifer test rather than a survey. [inference] — the reading is this corpus's; the
  file carries an observing procedure and a measuring agency and no project.

  **Three townships and the city have no well at all.** [Bath](../place/bath-township.yml),
  [Perry](../place/perry-township.yml) and [Sugar Creek](../place/sugar-creek-township.yml)
  townships and [Lima](../place/lima.yml) hold none of the ninety. [verified] — the same source's
  coordinates, the same point-in-polygon.

  **Where the water stood in October 1998, at the one moment the county was measured across.**
  Depth to water ran from 10.2 to 66.5 feet below the surface with a median of 20.0, and the
  water-level elevation from 739.9 to 797.8 feet above NAVD88, a range of 57.9 feet across 68
  wells. [verified] — the same source, parameters `72019` and `62611`.

  **Half the wells are not assigned to an aquifer and the ones that are, are mostly one.** Thirty-six
  of the ninety are coded to the Silurian-Devonian aquifers and ten to the glacial sand and gravel;
  forty-four carry no national aquifer code. Of the twenty-nine that state a type, twenty-eight are
  confined. [verified] — the same source's monitoring-locations collection.

  **Four of the ninety are not water wells in any ordinary sense.** They are 444, 1,996, 2,030 and
  3,133 feet deep, in Shawnee, Richland, Auglaize and Shawnee townships, against a median of 82 feet
  across the seventy that state a depth. [verified] — the same source. A three-thousand-foot hole
  four miles from the Lima oil field is more likely a test hole that was later read for water than
  a well drilled for it. [inference]

  [open] What is at 40.755, -84.331, and who paid for forty days of work there in 1998. The file
  names an observing procedure — electric tape, mostly — and a measuring agency, and no purpose.

  [open] Why AL-5 is falling. A confined well responds to pumping anywhere in its aquifer, and this
  corpus holds no withdrawal figures for Allen County at all: not the quarries, not the refinery,
  not the irrigators, and not the eight community water systems, four of which pump groundwater.
properties:
  parameter: fall in water level at Allen County's one continuously read well
  value: "11.70"
  unit: feet below land surface, mean of 2010–2012 against mean of 2024–2026
  as_of: "2026"
  method: |
    Readings are parameter `72019`, depth to water below land surface, one row per visit; the same
    visit is also published as `62610` and `62611` and a count of raw rows triples it. [verified]
    The change is the mean of the first three calendar years of a well's record against the mean of
    its last three, which is robust to the four-or-five-readings-a-year cadence in a way a
    first-and-last difference is not. [verified] The slope is ordinary least squares on time in
    years, and the R² beside it is what separates a trend from a scatter. [verified] The neighbour
    wells are every site in the six adjoining counties with at least ten readings since 2010, which
    is all of them. [verified] Township attribution is point-in-polygon against the 2024 TIGER
    county-subdivision layer. [verified]
