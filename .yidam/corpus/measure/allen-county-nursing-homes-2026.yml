class: measure
label: Allen County nursing homes, 2026
description: |
  Every Medicare- or Medicaid-certified nursing home in Allen County, with its beds, its residents,
  its owner, its staffing and its inspection record. [verified] —
  [CMS Care Compare](../../catalog/cms-nursing-home-care-compare.md), the August 2026 file.

      home                          city          beds   res  occ%  owner   ★  staff  turn
      Shawnee Manor                 Lima           137 126.4  92.3  chain   4   3.31  35.4
      Vancrest of Delphos           Delphos         99  85.8  86.7  chain   5   3.51  42.7
      CareCore at Lima              Lima            88  70.9  80.6  chain   3   3.11  62.7
      Lima Convalescent Home        Lima            72  66.5  92.4  local   4   3.90  36.4
      Springview Manor              Lima            62  58.0  93.5  chain   4   3.20  34.6
      Liberty Retirement Community  Lima            60  46.2  77.0  local   2   4.27  59.7
      Mennonite Memorial Home       Bluffton        60  54.5  90.8  local   3   4.02  46.8
      The Springs of Lima           Lima            56  53.4  95.4  chain   5   3.86  30.6
      Lost Creek Rehabilitation     Lima            54  43.1  79.8  local   1   3.11  51.2
      The Meadows of Delphos        Delphos         54  45.4  84.1  chain   4   3.62  31.4
      Roselawn Manor                Spencerville    49  44.7  91.2  chain   5   3.48  44.7
      Willow Ridge                  Bluffton        20  17.6  88.0  local   5   5.30  32.3

  `staff` is total nurse staffing hours per resident per day, `turn` annual nursing-staff turnover.
  **Twelve homes, 811 certified beds, 712.5 residents a day — 87.9 per cent occupancy against 83.6
  for Ohio's 922 homes and 80.3 for the country's 14,690.** [verified] — the same file.

  **There are twelve and CMS's county column finds eleven.** It puts The Meadows of Delphos in Van
  Wert; the Census Bureau's address ranges return an exact match for 800 Ambrose Drive in **Allen
  County**, and CMS's own cost report reads ALLEN in each of that certification's six Delphos years.
  [verified] — [the Census geocoder](../../catalog/tigerweb-census2020.md) and
  [the cost reports](../../catalog/cms-snf-cost-reports.md); a fourth instance of
  [a postal address is not a municipality](../../decisions/a-postal-address-is-not-a-municipality.yml).

  **Two thirds of the county's beds are run from somewhere else.** 545 of the 811 belong to four
  chains — Trilogy Health Services (123 homes, three of these), HCF Management (22, two), Vancrest
  (13, one) and CareCore Health (10, one). Nine of the twelve are for profit; the three that are
  not hold 152 beds. [verified] — the same file.

  **The county's homes are fuller, better rated and less churned than the state's, and no better
  staffed.** Mean overall rating 3.75 against Ohio's 3.15 and the country's 2.98; nursing-staff
  turnover 39.5 per cent at the median against 48.5 and 44.9; total nurse staffing 3.57 hours per
  resident per day against 3.57 and 3.68. The spread inside the county is wider than any of those
  gaps: staffing runs 3.11 to 5.30, turnover 30.6 to 62.7, and one home sits at every rating from
  one star to five. [verified] — the same file, all 14,690 rows.

  **287 deficiencies in seven years, eleven of them for harm actually done.** Inspectors cited the
  twelve homes 287 times between 21 February 2019 and 20 May 2026. Nine citations reached
  scope-and-severity G — actual harm to a resident — and **two reached immediate jeopardy**:
  Springview Manor on 10 January 2024 for accident hazards, Liberty Retirement Community on 19
  March 2026 for respiratory care. The commonest are infection control (16), care not given as
  ordered (14), accident hazards (13) and pressure-ulcer care (12), and seventeen are failures of
  the residents' freedom from abuse, neglect and exploitation, at seven of the twelve homes.
  **$130,230 in fines stands against four.** [verified] —
  [the deficiency file](../../catalog/cms-nursing-home-care-compare.md).

  **A five-star home can be the most dangerous workplace in the county.** The Springs of Lima
  carries five stars overall, five on health inspection, no deficiency in its latest cycle and no
  fine — and its workers recorded 89 injuries on 883,063 hours, a rate of 20.16 against 3.69 for
  the county. [verified] — [the injury record](allen-county-workplace-injuries-2016-2024.yml); see
  [a rating rates one thing](../../decisions/a-rating-rates-one-thing.yml).

  This corpus cannot say how well anybody here is cared for. A rating combines an inspection
  record, a staffing figure and a set of clinical measures by a formula CMS chose, and none of them
  is a resident's experience. [open]
properties:
  parameter: certified nursing homes, beds and average residents per day
  value: "811"
  unit: certified beds
  as_of: 2026-08-01
  method: |
    All 922 Ohio rows pulled from the Care Compare provider file; county membership settled by
    Census address ranges on each provider's street address rather than by the file's own county
    column, and cross-checked against point-in-polygon on the published coordinates. Deficiency
    counts are every row in the health-deficiency file for the twelve certification numbers.
    [verified]
