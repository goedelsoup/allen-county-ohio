  method: |
    Every figure is the newspaper's own. [verified] `party_a` and `party_b` carry `R` and `D` as
    the paper letters them, `NP` for the five judicial races, which Ohio elects without party
    labels, and `NA` where the row is a ballot question or an unopposed candidate with no opponent
    printed. [verified] `none` in a candidate column means the paper printed one name under that
    heading. [verified] The two commissioner rows are this corpus's pairing of four names the
    paper prints under one heading; the ballot elected two of the four and the source does not say
    which. [inference] Spellings are the paper's, including `McCoulloch` for the congressman the
    corpus elsewhere records as McCulloch. [verified]
