class: measure
label: The whole Allen County ballot, November 1956
description: |
  **Twenty-seven contests from one election, which is the only complete county ballot this corpus
  holds from any year before 1960.** President down to coroner, five judicial races and two state
  questions, as the county's own weekly printed them the week after the vote. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 8 November 1956, under the heading
  "GOP Makes Clean Sweep Again Of County Offices".

  **A Republican sweep, and an eighteen-point spread down one ballot.** Eisenhower took 70.2 per
  cent of the two-party presidential vote in this county, O'Neill 60.8 for governor and Bender
  52.1 for United States senator. [verified] — computed here from the table below. All three were
  counted by the same boards on the same night from the same precincts, so the spread is a
  within-table comparison and rests on nothing the canvass's own qualifier undermines.

  **Frank Lausche came within 1,653 votes of carrying a county Eisenhower won by 16,351.** The
  Democratic governor was running for the Senate; the paper notes that he "outpulled Taft in Allen
  county for governor at the 1952 election" and "ran under Bender in the Senatorial race this
  election". [verified] — the same source. His 18,838 votes are 2,513 more than any other Democrat
  on the ballot received, and 6,803 more than the presidential nominee of his own party.

  **The county coroner outpolled the president.** Biery, unopposed, took 31,907 votes against
  Eisenhower's 28,386, and the state senator Pepple, also unopposed, took 29,598. [verified] — the
  same source. An unopposed candidate on a partisan ballot collects from both columns, which is
  why the two largest figures on this sheet are the two races nobody contested.

  **Both state questions passed and one of them passed by nearly four to one.** A bonus for
  veterans of the Korean conflict carried 28,005 to 7,687, and four-year terms for state senators
  21,635 to 11,638. [verified] — the same source.

  **This node does not know which two of the four commissioner candidates were elected.** The paper
  prints four names under one heading for two seats and does not mark the winners; the two rows
  below pair the higher Republican with the higher Democrat and the lower with the lower, which is
  this corpus's arrangement of the figures and not the ballot's. See
  [a newspaper canvass is not a certified return](../../decisions/a-newspaper-canvass-is-not-a-certified-return.yml).

  [open] What the county's total ballots cast were. Every contest here has its own denominator and
  none of them is the turnout: the presidential race drew 40,421 votes between two candidates and
  the coroner drew 31,907 alone, and neither is the number of people who came to the polls.
