class: measure
label: COVID-19 vaccination in Allen County, 2020–2023
description: |
  **Forty-five and a half per cent of Allen County completed a primary vaccination course, and the
  county is sixty-sixth of Ohio's eighty-eight.** 46,579 people, against a state median of 50.5 per
  cent, on the last day the federal series was published — 10 May 2023, the end of the public
  health emergency. [verified] —
  [the CDC county files](../../catalog/cdc-covid-19-county-data.md), the county vaccination series.
  49,815 residents, 48.7 per cent, had at least one dose.

  **The old were vaccinated and the young were not.** 81.7 per cent of the county's residents aged
  65 and over completed a course against 15.8 per cent of its children aged 5 to 17, and 55.5 per
  cent of everybody 18 and over. [verified] — the same series. The gap between the two ends of the
  county is 66 points.

  **Of those who finished a course, just over half went back for a booster.** 24,782 booster doses
  against 46,579 completed courses — 53.2 per cent. [verified] — the same series.

      Ohio counties, share completing a primary course, 10 May 2023
      Delaware      78.6%          Allen            45.5%
      Cuyahoga      68.1%          Auglaize         40.2%
      Lake          67.6%          Hardin           39.7%
      Hancock       52.5%          Mercer           39.2%
      Putnam        50.2%          Holmes           18.6%

  **This county sits in the low half of a state whose own spread is enormous.** Ohio's counties run
  from Delaware's 78.6 per cent to Holmes's 18.6, and Allen's neighbours run from Hancock at 52.5
  down to Hardin at 39.7. [verified] — the same series, all eighty-eight counties.

  **The series stops and nothing continues it at this grain.** [inference] Federal county
  vaccination reporting ended with the emergency declaration, so 45.5 per cent is not the county's
  vaccination rate now; it is the rate on the last day anyone published one. Whatever has been
  given here since is unrecorded in any source this corpus can reach.

  **A share of the county is not a share of the eligible.** [inference] The denominator is the whole
  resident population including children under five, who were eligible only from June 2022 and were never
  going to be vaccinated in the years this series covers. The 81.7 and the 15.8 above are the figures to read for what
  people did; the 45.5 is the figure to read for how much of the county was covered.

  **This node does not know why this county vaccinated less than the state.**

  [open] Whether the county's vaccination share is explained by its politics, its age structure or
  its rural half. The corpus holds all three and the vaccination file carries none of them, and a
  county-level correlation across eighty-eight points is not an answer about anybody here.

properties:
  parameter: share of residents completing a primary COVID-19 vaccination course
  value: "45.5"
  unit: per cent of the resident population, 10 May 2023
  as_of: "2023"
  method: |
    Figures are the last row of the county's daily series, 10 May 2023, when federal county
    reporting ended. [verified] The shares are the file's own, computed by CDC on its own
    population denominators rather than recomputed here, so they are comparable across counties and
    are not comparable with a rate this corpus computes on the census count. [verified] The county's
    `completeness_pct` is 98.6, which is the share of doses administered in Ohio for which a county
    of residence was recorded; doses given to Allen County residents in another state are not in it.
    [verified] The booster share is booster doses over completed courses, which is the file's own
    `booster_doses_vax_pct` and is a share of the vaccinated rather than of the county. [verified]
