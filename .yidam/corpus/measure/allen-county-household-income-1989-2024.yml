class: measure
label: Allen County's median household income, 1989–2024
description: |
  **The median household in Allen County earned ninety-seven cents on the national dollar in 1989
  and eighty-three in 2024, and that fall is one of the few things in this series large enough to
  clear its own interval.** [verified] —
  [the Small Area Income and Poverty Estimates](../../catalog/census-saipe-county.md), thirty-one
  produced years. As a share of the national median the county's bounds are 89.3 to 104.2 per cent
  in 1989 and 79.5 to 86.3 in 2024, and the two do not overlap.

  **In figures: $27,967 in 1989 and $67,677 in 2024, which is $70,750 and $67,677 in the dollars of
  2024.** [verified] — the same source, deflated here with
  [the all-items consumer price index](../../catalog/bls-cpi.md). The national median went from
  $73,125 to $81,604 in the same dollars, a rise of 11.6 per cent, while this county's fell 4.3.

  **The fall in real income on its own does not separate, and the fall relative to the nation
  does.** The county's 1989 bounds are $65,275 and $76,194 in 2024 dollars against $64,897 and
  $70,457 for 2024, which overlap. Divided by a national median whose own interval is a few hundred
  dollars wide, the same two years part company. [verified] — the same source, its published bounds
  and the national row. That is what a ratio buys over a level, and it is the reason this node
  leads with the share. See
  [a series that cannot see a year](../../decisions/a-series-that-cannot-see-a-year.yml).

  **The floor is 2012 and the county has not been back to where it started.** Real median household
  income was $70,930 in 1998 and $57,620 in 2012, a fall of 18.8 per cent, and the 2024 figure of
  $67,677 is below 1998, below 1989 and below the single highest year in the series, which is 2019
  at $71,498. [verified] — the same source, deflated here. Two of the thirty-one years stand above
  1989 — 1998 and 2019 — and twenty-eight stand below it.

  **This node does not know why the share fell.** Median household income moves with what work pays,
  with how many earners a household has, with who moves away and with who is left, and this file
  separates none of them. See
  [what money reaches this county](allen-county-personal-income-1969-2024.yml), which counts the
  income and not the household.

  **The survey puts the same figure lower and the two overlap.** The five-year American Community
  Survey gives $62,001 ± $2,572 for 2023 and this file gives $65,665 with bounds of $60,301 and
  $71,029. [verified] — [the survey](allen-county-income-and-poverty-2023.yml) and the same source.
  They are not independent: the model reads the survey.

  [open] Whether the 2019 and 2023 jumps are the county or the model. Real income rises $8,661 in
  2019 and $2,878 in 2023 on a series whose year-to-year moves this file cannot resolve, and both
  years sit beside a change in how the survey behind the model was collected.
