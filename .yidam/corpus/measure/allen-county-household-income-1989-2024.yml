  as_of: "2024"
  method: |
    `median`, `lo` and `hi` are the file's own nominal figures and ninety per cent bounds.
    `real2024` and `us_real2024` are deflated with the annual average all-items consumer price
    index for all urban consumers, series `CUUR0000SA0`, on a 2024 base. [verified] `pct_of_us` is
    computed on the nominal figures, where the deflator cancels, so it does not depend on the price
    index at all. [verified] Separation is tested by whether two ninety per cent intervals overlap.
    [verified] Every produced year was taken except 1996, whose every path answers HTTP 520.
