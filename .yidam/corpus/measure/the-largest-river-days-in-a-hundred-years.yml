class: measure
label: The forty largest river days in a hundred and eleven years, and which the corpus had written
description: |
  **Twenty-nine of the forty largest rises on the rivers that drain this county have no event node,
  and the six with insurance claims beside them include the biggest unwritten flood in the record.**
  Taking the twenty-five largest daily means at each of the two long gauges and merging rises within
  six days gives forty days; eleven carry an event node and twenty-nine do not. [verified] —
  [USGS](../../catalog/usgs-nwis.md), sites 04186500 and 04191500, against this corpus's flood
  events.

  **The strongest of them is 5–7 February 2008**, which was the 2nd-highest day in 105 years at Fort
  Jennings and the 4th in 111 at Defiance, with **ten insurance claims paying $390,087** and 3.75
  inches of rain in four days. The corpus had it in a table as a day with one record, "no gauge and
  no storm row", and said it stayed unwritten for want of a witness.
  [It now has a node](../event/the-flood-of-5-7-february-2008.yml). [verified] — the three sources.

  **The next is 13–15 July 1992, and it is the largest day the Fort Jennings gauge has ever
  recorded** — 12,000 cubic feet a second, first of 36,624 days. The Ottawa at Lima ran 2,150 on the
  13th, 54th of its own 10,340. Three claims are dated the 12th and 13th and 5.81 inches fell in five
  days. [verified] — the same three.
  [Its node is written here](../event/the-flood-of-13-15-july-1992.yml).

  **Four more unwritten days carry three or more claims and are named rather than written**: 8–11
  March 2009, six claims paying $39,908 with the Auglaize at Defiance 12th of 40,518; 8 July 2013,
  four claims and $125,491 with the Ottawa at Lima at its 165th but Fort Jennings at its 1,130th —
  one basin and not the other; 10–12 July 2017, three claims; and 1 July 1986, three claims on a day
  when **every gauge here was ordinary** — Fort Jennings 1,889th, Defiance 2,511th — after 5.29
  inches of rain. [open] Each needs a record this corpus has not reached.

  **The largest day in the whole 111-year record belongs to a flood nobody here wrote down.** On 14
  March 1982 the Auglaize at Defiance ran 52,300 cubic feet a second, first of 40,518 days; the
  county's own gauge at Allentown ran 3,310 on the 12th, 15th of its 18,545 days, **nine days before
  it closed forever**; and one insurance claim was paid, at Fort Shawnee. [verified] — the three
  sources. It is one witness read at three points on one river and one claim, and the corpus states
  it rather than writing it. [open]

  **Twenty-three of the twenty-nine unwritten days have no claim at all**, and eleven of those fall
  before 1978, when this county's first flood insurance claim was paid. A river that rose before the
  programme existed leaves no insured building behind it, which is a property of the record and not
  of the water. [verified] — [the claims file](../../catalog/openfema-nfip.md), earliest loss date
  14 March 1978.
properties:
  parameter: >-
    The largest daily mean discharges on the Auglaize near Fort Jennings and near Defiance, with the
    insurance claims, rainfall and event node of each
  value: >-
    Forty distinct rises; eleven carry an event node and twenty-nine do not
  unit: cubic feet per second
  as_of: "2026-09-09"
  method: |
    The twenty-five largest daily means at each of 04186500 (36,624 days from 1 September 1921) and
    04191500 (40,518 days from 1 October 1915), taking only one day per rise by discarding any day
    within five of a larger one, then merging the two lists on a six-day window. The four days this
    corpus had already named as having a single record are added whether or not they rank.

    Ranks are over every day the gauge has recorded and are tie-aware: 1 is the largest. `lima_cfs`
    and its rank are the highest daily mean at 04187100 in the window from two days before to four
    days after, which is where that gauge's own crest falls relative to the downstream ones — the
    Ottawa at Lima crests first and Defiance last, by two to three days.

    `claims` and `paid_usd` count every Allen County flood insurance claim whose date of loss falls
    within four days either side, net of building and contents payments; `rain_in` is the total at
    the Lima station over the four days ending the day after the crest. `node` is the date of this
    corpus's event node for the rise, or `none`.

    **A gauge downstream of another is not a second witness.** Fort Jennings, Defiance and Waterville
    measure the same water at three distances, so the three columns are one record read three times.
    What makes a day in this table a candidate for an event node is a claim, a storm row or a rain
    total beside them, per [a flood needs two records](../../decisions/a-flood-needs-two-records.yml).
