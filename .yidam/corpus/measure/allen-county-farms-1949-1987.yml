class: measure
label: Allen County farms, 1949–1987
description: |
  Four census years inside the ninety-two the corpus could not see, and they say the farmland did
  not leave at a steady rate. [verified] —
  [the historical Census of Agriculture volumes](../../catalog/census-of-agriculture-historical.md),
  Ohio 1954 County Table 1 and Ohio 1987 Table 5.

                    1950      1954      1982      1987
      farms        2,560     2,097     1,202     1,148
      acres      227,944   215,018   197,256   201,190
      mean size     89.0     102.5       164       175
      $ per acre  203.87    248.33     2,023     1,504
      cropland
        harvested  152,122* 150,305   167,054   158,826

  [verified] — same source; the starred figure is the crop year 1949, which is how both censuses
  date harvested acreage. Read off the page images and checked by arithmetic: 227,944 acres over
  2,560 farms is the 89.0 the table prints, and 215,018 of 262,400 acres is the 81.9 per cent it
  prints.

  **The county's farmland fell 61,551 acres between 1910 and 2022, and a fifth of that went in four
  years.** Between 1950 and 1954 it lost 12,926 acres — 21.0 per cent of the whole century's loss,
  at 3,232 acres a year, against 313 a year for the forty years before it. [inference] — computed
  here from [1910](allen-county-farms-1900-1910.yml), the table above and
  [2002–2022](allen-county-farms-2002-2022.yml).

  **In figures: 12,528 acres went in the 40 years to 1950, 12,926 in the 4 years to 1954, 17,762 in
  the 28 years to 1982 and 18,335 in the 40 since.** [inference] — same computation; the four sum to
  61,551.

  **It is not a local event and it is probably not a definition.** Ohio lost 4.66 per cent of its
  land in farms over the same four years and Allen County 5.67; Ohio lost 11.2 per cent of its farms
  and Allen 18.1. [verified] — the 1954 volume's state column, read beside the county's. The county
  falls harder than the state and in the same direction, which is what a real national turn looks
  like and what a changed definition would look like too. [inference] The known break in the farm
  definition is 1959, outside this pair. [open]

  **Between 1954 and 1982 the county lost farmland and grew more crops on what was left.** Land in
  farms fell 17,762 acres; harvested cropland rose 16,749. [inference] — same table. The two nearly
  cancel, so the land that went was pasture, woodland and farmstead rather than the ground under the
  corn.

  **The only rise in the whole series is the 1980s farm crisis.** Land in farms went *up* 3,934
  acres between 1982 and 1987 while the value of an acre fell 25.7 per cent, from $2,023 to $1,504,
  and the value of a farm 17.0 per cent. [verified] — the 1987 volume. In the same five years the
  county's "other cropland" went from 3,593 acres to 20,121 and its cover crops and legumes not
  harvested from 893 to 8,493. [verified] — same source. Land retired from production is still land
  in farms, which is the obvious reading of a rise that happens while the price collapses.
  [inference]

  **Seven farms in ten have gone, and the same four years are the steepest stretch of that too.**
  2,939 farms in 1910, 2,560 in 1950, 2,097 in 1954, 1,202 in 1982, 1,148 in 1987, 897 in 2022.
  [verified] — the four sources together. That is 116 farms a year lost between 1950 and 1954 against
  nine a year in the forty years before and thirty-two a year in the twenty-eight after. [inference]
  — computed here. The mean farm has more than doubled, from 81.8 acres to 199.

  **Soybeans passed oats between 1949 and 1954.** In 1949 the county harvested 26,213 acres of oats
  and 17,393 of soybeans for beans; in 1954, 22,498 of oats and 22,991 of soybeans. [verified] — the
  1954 volume, County Table 9. Soybeans were not a crop in this county in 1909 at all, and oats took
  30,156 acres that year. See [the crops](allen-county-crops-2022.yml).

  **Corn held and wheat did not.** Corn for all purposes took 49,183 acres in 1949 and 51,215 in
  1954; wheat threshed or combined fell from 33,937 acres to 23,630 in the same five years.
  [verified] — same table.

  **Most of the sheep had already gone by 1950.** The county held 41,240 sheep and lambs in 1910,
  16,150 in 1950, 17,194 in 1954 and 835 in 2002 — so 62 per cent of the fall is before this window
  opens and the rest is after it closes. [verified] —
  [the 1910 animals](allen-county-domestic-animals-1910.yml), the 1954 volume's County Table 7, and
  [the modern livestock](allen-county-livestock-2002-2022.yml).

  **Cattle rose while milk cows fell.** 22,224 cattle and calves in 1950 and 24,119 in 1954, against
  10,114 milk cows and 8,576. [verified] — the 1954 volume.

  [open] Horses. The 1954 volume's livestock table was read for cattle and sheep and its horse rows
  were not located, so the corpus still has 14,676 horses in 1910 and 618 in 2002 with nothing
  between.
properties:
  parameter: land in farms
  value: "215,018"
  unit: acres
  as_of: "1954"
  method: |
    Read off page images rendered at 400 dpi from the two archive.org scans, because the text layers
    of both volumes are unusable — the 1987 PDF drops its numeric grid entirely and the djvu text of
    both delivers digits as an unaligned stream. The headline value is 1954's because it is the
    figure the four-year fall lands on and the one most heavily cross-checked. Each figure was
    verified against another in the same column: an acreage against the farm count and the printed
    average, and an acreage against the printed proportion in farms. The 1950 and 1982 columns are
    taken from the 1954 and 1987 volumes respectively rather than from the censuses of those years,
    which is what makes each pair internally comparable. [verified]
