class: period
label: The Lima oil boom
description: |
  The span opened by [the 1885 strike](../event/lima-oil-strike.yml), in which the Lima–Indiana
  field made this county a centre of national petroleum production and Lima an industrial city.
  [inference]

  Its character is the attachment of a local agricultural economy to national capital. The
  refinery, the growth of Lima's population, and much of the built fabric of the city date from
  it. [inference] *Attachment* is the right word and *replacement* is not: the agriculture was
  still there at the end of the period, on 92.5 per cent of the county's land. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the county's farms](../measure/allen-county-farms-1900-1910.yml). The field's dominance was relatively brief — it was displaced as new fields
  opened elsewhere — but the refining capacity it justified is still operating, which is why
  the period's most durable legacy is [a site](../site/lima-refinery.yml) rather than an
  industry. [inference]

  **The city it attached was already industrial, and this node did not say so.** Six years before
  the strike Lima stood at the crossing of three railroads, all of which kept repair shops there,
  and the Dayton & Michigan shops alone covered eight acres and employed 200 to 300 men — the
  largest establishment in a city of about 7,000. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), quoting a Lima
  newspaper of 14 March 1879; see [the network](../measure/allen-county-railroads-1883-1921.yml).
  The county had about 102 miles of main track in 1883 and its manufactures were already above
  $2,000,000. [verified] — [the 1885 history](../../catalog/leeson-allen-county-1885.md).

  So *attachment* is still the right word and the thing attached was not only farmland. What the oil
  did was multiply an industrial base that the railroads had put there thirty years earlier.
  [inference] Nothing here weighs the two against each other: this corpus has one employment figure
  from before the boom and it is a range printed in a newspaper.

  **The start bound is now supported from the other side.** The 1885 county history, printed as the
  boom began, treats the county's petroleum as prospective — "a subject for the enterprise of the
  future" — while cataloguing everything else in Lima to the dollar. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). A source
  that would have reported the field and does not is a lower bound on the field. [inference]

  **The start bound is now a date: May 9, 1885.** [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). It is also, on the same source,
  a slightly later date in substance — the first *persistent* production came from the second well
  that autumn, the pioneer having broken. [inference]

  **The boom is now measurable and the measure is large.** Allen County gained 9,330 people between
  1880 and 1890 — **29.7 per cent, the largest decennial gain in its history** — and Lima "doubled
  her population" in the same decade, going from 7,567 to 21,723 by 1900. [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md); see
  [the county series](../measure/allen-county-population-1830-1900.yml) and
  [Lima's](../measure/lima-population-1880-1920.yml). The 1906 compilers attribute the increase to
  the discovery without qualification, and they were living in the town when it happened.

  **And the end bound has a shape at last, though not a date.** By 1920 Lima had reached 41,326 —
  the Census figure; the 1921 history says 41,306 and see
  [the federal series](../measure/lima-population-1850-1960.yml) — and
  by 1921 the whole residue of the field was, in the later historian's words, "the Solar refinery and
  the different companies dealing in oil commodities", with "little oil now being pumped in Allen
  County". [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). So the
  *field* was substantially finished before 1921 while the *city* kept growing — which is why this
  period's legacy is a site rather than an industry, and why 1910 as a placeholder is defensible for
  production and wrong for consequence. [inference]

  [open] The end bound is the weakest claim in this node. The field declined rather than
  stopping, and any date given for the end of the boom is an interpretation the corpus has not
  argued for. The 1910 below should be read as a placeholder for an argument not yet made.
properties:
  began: "1885"
  ended: "1910"
  character: |
    A local discovery converted into national industry, added on top of a farming county that
    kept farming. This field said "the county's shift from agriculture to manufacturing" until
    the agriculture was measured and had not shifted. [inference]
  boundary_basis: |
    The start is fixed by the strike and is firm. The end is not argued and is a placeholder.
    [open]
