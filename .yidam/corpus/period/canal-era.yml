class: period
label: The canal era
description: |
  The span in which [the Miami and Erie Canal](../site/miami-and-erie-canal.yml) was the
  organizing transport fact of western Allen County — roughly the 1840s to the end of the
  nineteenth century, when rail had comprehensively displaced it. [inference]

  Its character is a geographic asymmetry rather than a countywide condition, and that is the
  reason it is worth naming as a period at all. The canal ran through the county's western
  edge and made [Delphos](../place/delphos.yml) and Spencerville into places; it did not touch
  Lima, which grew instead around a railway junction. So for several decades the county had
  two economies oriented to two different transport systems, and its later concentration on
  Lima is partly the story of one of them winning. [inference]

  **The opening bound is now sourced and the corpus's guess was right.** The Miami extension was
  formally opened in June 1845, and traffic was moving at Spencerville by 1844. [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).
  1845 was written here as "the corpus's rough placement" and is the date the state used.

  **The closing bound now has an argument, and it moves.** The railways reached this county while
  the canal was still young: the Ohio & Indiana opened Crestline to Fort Wayne in 1854 and was
  consolidated into the Pennsylvania system in 1856; the Dayton & Michigan was chartered in 1856-57
  and **completed through Allen County in 1858**. [verified] — same source. A canal whose parallel
  railway is finished thirteen years after it opens did not organize the county's west until 1900.
  [inference] The end bound is left at 1900 for now because "displaced" and "abandoned" are
  different dates and this corpus has argued neither.

  **The name this period is called by is younger than the period.** An act of 14 March 1849 folded
  the Miami Canal, the Miami Extension Canal and the Wabash and Erie into one Miami and Erie Canal,
  four years after boats were running through this county and twenty-four after the state resolved
  to dig. [verified] — [Miller, 1906](../../catalog/miller-allen-county-1906.md).

  **What the water was for, in one price.** Coal at 90 cents a ton in Cincinnati, delivered to
  Spencerville and Delphos for a dollar of freight. [verified] —
  [Rusler, 1921](../../catalog/rusler-allen-county-1921.md), reporting it in 1921 as a rate worth
  having back — which is the clearest statement any source here makes of what the county lost when
  the canal stopped. [inference]

  [open] The date of commercial abandonment. What is now known is that the displacement began in
  1858, which is the argument the end bound needs and not yet the date.
properties:
  began: "1845"
  ended: "1900"
  character: |
    Water transport as the organizing fact of the county's west, and a divided county
    economy. [inference]
  boundary_basis: |
    The start is fixed: the Miami extension was formally opened in June 1845. [verified] The
    competitor is dated now — a railroad through Lima and Delphos in 1854 and a second through the
    county in 1858 — and the displacement is sourced: under railroad competition the canal was
    leased and then went out of commercial use entirely. [verified] —
    [the 1921 history](../../catalog/rusler-allen-county-1921.md) and
    [the first railroad](../event/the-first-railroad-reaches-allen-county.yml).

    The end is still an approximation. What arrived in 1854 was competition and not closure, and no
    source here gives the year the lease was made or the year commercial traffic stopped. [open]
