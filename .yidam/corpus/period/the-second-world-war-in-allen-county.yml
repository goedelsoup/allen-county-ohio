class: period
label: The Second World War in Allen County
description: |
  **The third of this county's wars to be named here, and the first the corpus counts by its dead
  rather than by its service.** One hundred and seventy-one men from Allen County died or were
  still missing in the Army between May 1941 and January 1946 — one for every 429 people the county
  held in 1940. [verified] —
  [the Honor List](../measure/allen-county-world-war-ii-dead-1941-1946.yml); the rate computed
  against [the 1940 census](../measure/allen-county-population-1940-1990.yml). [inference]

  **The county's war began before the country's, and two independent sources say so.** In February
  1941 [the Locomotive Works](../site/lima-locomotive-works-plant.yml) had a new $290,000 factory
  building under construction which the local press read as conversion to defense work, and by that
  August medium tank production was scheduled for the autumn. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 20 February 1941, and the *Evening
  Star*, 24 August 1941. The War Department's own roll of the dead opens on 27 May 1941, the
  declaration of unlimited national emergency. [verified] —
  [the Honor List](../../catalog/ww2-honor-list-ohio.md). Both dates are before Pearl Harbor.

  **Its character is a county that made vehicles for a war it never saw, in three separate
  undertakings two years apart.** The Locomotive Works built medium tanks from 1941;
  [the Lima Tank Depot](../site/lima-tank-depot.yml) was under construction in January 1943 and by
  August 1944 was "the central supply base for combat vehicles", finishing tanks built elsewhere
  and dispatching them by road train; and [the tank plant](../site/lima-army-tank-plant.yml) that
  carries the county's name today was not built until the ground was bought in 1951. [verified] —
  the sources on each of those nodes. Two of the three are this war and the third is the one after
  it, and the corpus keeps them apart because the county's own memory does not. [inference]

  **What the war did to the county's balance sheet is one figure and its attribution is broken.**
  "Allen county has experienced $27,629,000 in industrial expansion during the wartime emergency,
  according to a report released by" — and the optical character recognition loses the rest of the
  sentence. [verified] — [The Bluffton News](../../catalog/chronicling-america.md), 9 August 1945,
  page 6. The corpus records the figure and cannot name its author. [open]

  **And it was organised, as the last war was, out of committees and canvasses.** Bluffton's
  contribution to the nationwide war chest campaign was $1,800 in 1943, "about $75 more than the
  total contributed" the year before, announced by its mayor as co-chairman of the canvass.
  [verified] — same source, 4 November 1943, page 1. That is the grain at which this corpus can
  see the home front: one village's collection, in a weekly published there.

  **A third of the dead did not die in battle.** Fifty-six of the 171 are the source's DNB
  category — sickness, homicide, suicide or accident outside combat areas, "including training and
  maneuver deaths". [verified] —
  [the Honor List](../measure/allen-county-world-war-ii-dead-1941-1946.yml).

  [open] How many of the county's people served, which is what the corpus holds for
  [1861](the-civil-war-in-allen-county.yml) and [1917](the-world-war-in-allen-county.yml) and not
  for this war. Also its Navy, Marine Corps and Coast Guard dead, whom the Army's list does not
  carry; the date the county's last serviceman came home; and any local observance of either
  surrender. The corpus has read a village weekly for this war and no county history covers it.
properties:
  began: "1941-05-27"
  ended: "1946-01-31"
  character: |
    A county that built and finished tanks for a war it never saw, and paid one death for every 429
    of its people. Its industry converted before the country entered, its home front is legible only
    at village scale, and a third of its dead died away from combat. [inference]
  boundary_basis: |
    Both dates are the War Department's and neither is the county's: 27 May 1941 is the declaration
    of unlimited national emergency, from which its roll of the dead runs, and 31 January 1946 is
    that roll's cut-off. [verified] —
    [the Honor List](../../catalog/ww2-honor-list-ohio.md). The county's own industrial conversion
    is dated earlier than the first and its consequences run long past the second, so these bounds
    are the source's reach and not the span's. [inference] [open] A local beginning and a local end.
