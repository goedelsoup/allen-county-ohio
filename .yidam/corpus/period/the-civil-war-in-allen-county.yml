class: period
label: The Civil War in Allen County
description: |
  The four years in which a county of 19,185 people put **1,920 men** into United States service —
  one person in ten, counting women, children and the old. [inference] — computed here against
  [the 1860 count](../measure/allen-county-population-1830-1900.yml); the 1,920 is
  [the roster's own total](../measure/allen-county-civil-war-service.yml). It is the first period
  this corpus has named that is not about what the county produced.

  **It begins on a Sunday morning at the courthouse, and the source has the day wrong.** Rusler puts
  Lima's congregations in church on "a bright Sunday morning, April 12, 1861" when the word came
  that Fort Sumter had been fired on; a flag went up on a wire between Ashton Hall and the
  courthouse, the congregations gathered under it when services ended, and a store box was made
  into a platform. [verified] —
  [the 1921 history](../../catalog/rusler-allen-county-1921.md).

  April 12, 1861 was a **Friday**. The Sunday was the 14th, the day Sumter's garrison marched out,
  which is when the news would have reached a town in northwestern Ohio. [inference] — computed
  here. The scene is not in doubt; its date is off by two days, and the book supplies the correction
  four sentences later by dating everything that follows.

  **The county's war has three dates and they are not the same measurement.** Nothing in the record
  reconciles them, because they were never the same question:

      776      Allen County men traced into the roster of the 100,224 Ohio contributed in 1861
      1,100-1,200  volunteers mustered from the county before the close of 1861
      1,200    credited to the army and navy in the official report of October 1, 1863
      1,920    names of record for the whole war

  [verified] — [the 1885 history](../../catalog/leeson-allen-county-1885.md) for the first, second
  and fourth; the 1921 history for the third, which attributes it to an official report it does not
  name. See [what the county sent](../measure/allen-county-civil-war-service.yml), where the
  transmission of the first of them is traced through three books and found to have been corrupted
  on the way.

  **What it cost is not in any of the three books as a number.** The 1885 roster records the fate of
  each man and never adds them up. Counted, at least **165** of the 1,920 died in service, and only
  about one in four of those was killed. More Allen County men died at Nashville, a hospital town,
  than in any battle. [inference] — [the dead](../measure/allen-county-civil-war-dead.yml).

  **It ends without an ending in the record.** The rosters stop at muster-out and the county
  histories move to the Grand Army posts, Memorial Hall and the Woman's Relief Corps — organized
  within three years of the close, and the oldest women's society in the county. [verified] — the
  1921 history. The character of the span is set by the going out and not the coming home, because
  that is what the sources chose to record.

  [open] What the war did to the county's economy, its politics and its population. The 1870 census
  shows 23,623 people against 19,185 in 1860, so the county grew through the war; nothing here says
  by what mixture of birth, migration and the return of soldiers.

  [open] The county's draft. An enrollment of 3,792 and a Board of Enrollment are named, and no
  draft call, quota, credit, commutation or substitute figure is. The Provost Marshal General's
  district records would carry them and are not held.
properties:
  began: "1861-04-14"
  ended: "1865"
  character: |
    A rural county of nineteen thousand people sustaining a military effort of nineteen hundred men
    for four years, and organizing itself around that effort — an aid society, a military committee,
    a relief tax, a board of enrollment, and a camp of rendezvous for eight counties. [inference]
  boundary_basis: |
    The start is fixed by the Sunday the news reached Lima, which the source misdates as April 12
    and describes as a Sunday; April 14, 1861 is the Sunday, and it is the day Fort Sumter's
    garrison marched out. [inference] — computed here from
    [the 1921 history](../../catalog/rusler-allen-county-1921.md).

    The end is the war's own, not a local one. No source here records a date on which Allen County
    stopped being at war; the last muster-outs in the roster run to 1866, and the roster is a list
    of departures rather than returns. [open]
