class: period
label: The World War in Allen County
description: |
  The nineteen months in which a county of sixty-eight thousand put **at least 4,158 men** into
  United States service — one person in sixteen — and organised itself around a war it never saw.
  [inference] — computed here against the 1920 census; the roster count is
  [the list's own](../measure/allen-county-world-war-service.yml).

  **It has no local beginning the sources will give.** The Civil War period in this corpus opens on
  a named Sunday at the courthouse with a flag on a wire. This one opens with committees. The 1921
  history describes the county before the war as "resting secure in their remoteness, the farmer
  continued to till his fields", and dates nothing between that and the draft board. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **What the county built for it was a truck.** "Lima industry was represented on the war front by
  the Liberty truck", built by
  [Gramm-Bernstein](../organization/gramm-bernstein-motor-truck-company.yml), and the book's own
  caption calls it the first truck used in the war. [verified] — same source. Three of the
  volume's photographs are of it, one a convoy in Lima's Public Square before leaving for
  Washington.

  **What it built for itself was an administration.** A draft board serving without pay — F. M.
  Watt and Clarence Breese for the county outside Lima, with James J. Weadock, George H. Quail,
  Dr. T. R. Thomas and J. L. Van Pelt; a Council of Defense chaired by B. A. Gramm, whose woman's
  branch passed from Mrs. Kent W. Hughes to Mrs. Lena B. Davis to avoid overlapping the Red Cross;
  a War Savings committee under H. E. Simonton. [verified] — same source.

  **And it met its money quota and then stopped.** Allen County's War Savings quota was $1,297,000
  and it subscribed $1,367,000, $70,000 over. In 1919, with the war finished, Ohio as a whole took
  25 per cent of its quota and Allen County 30 — "a good relative showing", and the book adds that
  "the people did not incline to make a sacrifice again". [verified] — same source.

  **Its induction hall is a building this corpus already holds.**
  [Memorial Hall](../site/lima-memorial-hall.yml) was where men were sworn in, "from a radius many
  miles in every direction from Lima", and luncheons were served to everybody entering the service.
  [verified] — same source.

  **The war reached the county's map.** German Township became American on 16 August 1918, on a
  petition of its own citizens. [verified] —
  [the renaming](../event/renaming-of-german-township-1918.yml). And it reached the state hospital:
  244 cases of influenza that autumn, of which 8 per cent died. [verified] —
  [the hospital](../site/lima-state-hospital.yml).

  [open] What the county's war cost it in men is knowable only as a list of ninety-five names with
  no unit, no date and no place beside them; the influenza of that autumn and the Argonne cannot be
  told apart in it. See [the dead](../measure/allen-county-world-war-dead.yml).
properties:
  began: "1917-04"
  ended: "1918-11-11"
  character: |
    A county with no camp, no battle and no invasion, organising a war out of committees: a draft
    board, a council of defense, a Red Cross chapter, a war savings drive, a truck factory and a
    hall where men were sworn in and fed lunch. [inference]
  boundary_basis: |
    The start is the United States' and not the county's, because no local date exists: the sources
    describe the county's war as beginning with administrative bodies whose founding dates they do
    not give. [open] The end is the armistice, which the book names. [verified] —
    [the 1921 history](../../catalog/rusler-allen-county-1921.md).
