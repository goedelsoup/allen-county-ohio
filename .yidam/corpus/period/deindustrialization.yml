class: period
label: Deindustrialization
description: |
  The span from roughly 1970 in which the county's manufacturing employment contracted and
  [Lima](../place/lima.yml) began the sustained population decline it is still in. [inference]

  It is `concentrated-in` Lima rather than distributed across the county, and that edge is a
  claim this node can defend in a sentence: the county's manufacturing was concentrated in and
  around the city, so its contraction was too, and the townships' populations have not moved as
  Lima's have. [inference] The Census figures in this corpus are consistent with that — the
  county fell about 1.3% between its 2020 base and the 2024 estimate while Lima fell about
  2.4% — though four years is far too short a window to carry the claim, and it is the
  long decline from the 1970s that the claim actually rests on. [inference]

  [open] That long decline is asserted here from general knowledge and is not sourced. The
  corpus holds no population figure earlier than 2020, so it cannot presently demonstrate the
  trend it names this period for. Decennial counts back to 1900 would close this, and they are
  the most valuable single addition the corpus could make.
properties:
  began: 1970
  character: |
    Contraction of manufacturing employment and sustained population loss concentrated in the
    county seat. [inference]
  boundary_basis: |
    The start is a conventional placement, not an argued one; no end is claimed because the
    corpus does not assert the period has closed. [open]
links:
