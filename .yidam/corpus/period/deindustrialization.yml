class: period
label: Deindustrialization
description: |
  The span from roughly 1970 in which the county's manufacturing employment contracted and
  [Lima](../place/lima.yml) entered the sustained population decline it is still in.
  [inference]

  **The decline is now demonstrated rather than asserted.** Allen County counted 111,144 at
  the 1970 census and 100,866 at the 2024 estimate — a loss of 10,278 people, or 9.2%, across
  five decades with no reversal at any measured point: 111,144 (1970), 108,464 (2000), 106,331
  (2010), 102,217 (2020), 100,866 (2024). [verified] — see
  [1970](../measure/allen-county-population-1970.yml),
  [2000](../measure/allen-county-population-2000.yml),
  [2010](../measure/allen-county-population-2010.yml),
  [2020](../measure/allen-county-population-2020.yml) and
  [2024](../measure/allen-county-population-2024.yml). The arithmetic is this corpus's; every
  input is a Census figure.

  **The concentration is now evidenced too, over one decade.** This node carries a
  `concentrated-in` edge to Lima, and between 2000 and 2010 Lima fell 3.8% while the balance
  of Allen County — everything outside every incorporated place — fell 1.5%, from 50,809 to
  50,048. [verified] —
  [Census Intercensal Estimates, 2000–2010](../../catalog/census-intercensal-2000-2010.md).
  Lima declined about two and a half times as fast as the rest of the county. [inference]

  **The county's 1970 peak is no longer an artefact of where the data began.** The series now runs
  578 in 1830 through 47,976 in 1900 and 68,203 in 1920 to 111,144 in 1970, and every decade of it
  rises. [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md) and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the county series](../measure/allen-county-population-1830-1900.yml). Four counts are still
  missing, 1930 to 1960, and nothing in ninety years of ascent suggests a reversal inside them.
  [inference] For the county, this node's start date is now argued rather than assumed.

  **For Lima it is worse than assumed — it may be wrong.** The city was **41,306 in 1920** against
  40,307 in 2000. [verified] —
  [Lima 1880–1920](../measure/lima-population-1880-1920.yml). Eighty years net to roughly nothing,
  so the city's peak lies somewhere the corpus cannot see and the claim that Lima's decline begins
  in 1970 has no support at either end. [open] A city that was the same size in 1920 and 2000 did
  not necessarily start falling in 1970, and this node names 1970 for the county's reasons and
  applies it to Lima's.

  **What the evidence does not establish, stated plainly.** It does not establish that 1970 is
  the start for Lima. 1970 is the earliest *Lima* figure the corpus holds from a federal source, and
  a series that begins at its own first observation cannot show that the first observation was a
  peak — see [the pre-1970 series](../question/pre-1970-population-series.yml). It does not establish
  anything about *manufacturing employment*, which is the mechanism this period is named for
  and which the corpus does not measure at all: every figure above is population, and
  population decline is a consequence being read back as evidence for a cause. [open] And it
  does not establish that Lima's decline began in 1970 rather than later, because the earliest
  Lima figure is from 2000.

  A boundary caveat applies to the Lima comparison: Census figures for Lima count the
  corporation's territory on the date, and the corpus holds no annexation events, so the
  assumption that the boundary did not move is untested. [open]

  **The mechanism, for the first time.** Across the four full years 2021 to 2024 the county lost
  1,271 people: **506 to natural decrease and 793 to net migration**, with a residual of 28.
  [verified] — [natural change](../measure/allen-county-natural-change-2021-2024.yml) and
  [net migration](../measure/allen-county-net-migration-2021-2024.yml), both from the same
  Population Estimates file this node has cited since its second phase. More people leave than
  arrive, and more die than are born, and the first is the larger of the two.

  It does not establish that either mechanism reaches back before 2020. The components of change
  are published for the estimate years only, so a period named for 1970 is explained here for four
  of its fifty-four years and described for the rest.

  **The last year of the series does not continue it.** The 2024 estimate is 15 higher than 2023 —
  natural change +7 and net migration +8, the first year since the series began in which neither
  was negative, because international arrivals rose every year to 165 while domestic departures
  fell to 157 and the two crossed. It does not establish that the decline has ended: fifteen people
  on 100,851 is far inside what a modelled estimate can resolve, one year is not a direction, and
  the same programme revises its own earlier years with every vintage. [open]

  **The decline is broad and uneven.** Between the 2020 estimates base and 2024, eleven of the
  county's thirteen civil subdivisions lost population. Lima lost most in absolute terms — 841
  of a county loss of 1,351 — and the only two that grew were Auglaize township, by 55, and
  Marion township, by 102, at the county's south-eastern and Delphos ends. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. So this
  is not a city emptying into its own suburbs: the suburban ring is shrinking too, slower.
  [inference]

properties:
  began: "1970"
  character: |
    Contraction of manufacturing employment and sustained population loss concentrated in the
    county seat. The population half is verified; the manufacturing half is not. [inference]
  boundary_basis: |
    The start is a conventional placement rather than an argued one, and the corpus cannot yet
    test it: 1970 is the earliest population figure it holds. No end is claimed, because the
    2024 figure is still below every earlier one. [open]
