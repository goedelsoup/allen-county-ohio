class: period
label: Deindustrialization
description: |
  The span from roughly 1970 in which the county's manufacturing employment contracted and
  [Lima](../place/lima.yml) entered the sustained population decline it is still in.
  [inference]

  **There was a reversal, and this node said there was none.** Between 1970 and 1980 the county
  *grew*, from 111,144 to **112,241** — its highest count ever — before falling to 109,755 in 1990
  and 108,464 in 2000. [verified] — [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md), Table 3. This node has said since genesis that there was
  "no reversal at any measured point", and that was true of the corpus's data and false of the
  county: every figure it held began at 1970 or later, so the one decade that rose was the one
  decade outside the window. **The county's peak is 1980.** See
  [the 1940–1990 series](../measure/allen-county-population-1940-1990.yml).

  The period keeps its name and its subject and its start moves to what the record shows: the
  county's population turned in the 1970s and fell from 1980. [inference] Whether manufacturing
  employment turned earlier is still unmeasured here, and it is the thing the period is named for.

  **The decline itself is demonstrated rather than asserted.** Allen County counted 111,144 at
  the 1970 census and 100,866 at the 2024 estimate — a loss of 10,278 people, or 9.2%, across
  five decades: 111,144 (1970), 108,464 (2000), 106,331
  (2010), 102,217 (2020), 100,866 (2024). [verified] — see
  [1970](../measure/allen-county-population-1970.yml),
  [2000](../measure/allen-county-population-2000.yml),
  [2010](../measure/allen-county-population-2010.yml),
  [2020](../measure/allen-county-population-2020.yml) and
  [2024](../measure/allen-county-population-2024.yml). The arithmetic is this corpus's; every
  input is a Census figure.

  **The concentration is now evidenced too, over one decade.** This node carries a
  `concentrated-in` edge to Lima, and between 2000 and 2010 Lima fell 3.8% while the balance
  of Allen County — everything outside every incorporated place — fell 1.5%, from 50,809 to
  50,048. [verified] —
  [Census Intercensal Estimates, 2000–2010](../../catalog/census-intercensal-2000-2010.md).
  Lima declined about two and a half times as fast as the rest of the county. [inference]

  **The county's 1970 peak is no longer an artefact of where the data began.** The series now runs
  578 in 1830 through 47,976 in 1900 and 68,203 in 1920 to 111,144 in 1970, and every decade of it
  rises. [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md) and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the county series](../measure/allen-county-population-1830-1900.yml). Four counts are still
  missing, 1930 to 1960, and nothing in ninety years of ascent suggests a reversal inside them.
  [inference] For the county, this node's start date is now argued rather than assumed.

  **For Lima the 1970 date is supported after all, and by a wide margin.** The city was **53,734 in
  1970**, 47,827 in 1980, 45,549 in 1990 and 40,307 in 2000. [verified] —
  [Lima 1970–1990](../measure/lima-population-1970-1990.yml). Two phases ago this node reasoned from
  41,306 in 1920 — since corrected to 41,326 — against 40,307 in 2000 that "eighty years net to
  roughly nothing" and the peak was unlocatable. There was a peak and the corpus had drawn a chord across it. The city rose thirty per
  cent above its 1920 count by 1970 and has fallen at every count since.

  **And the long run is a different story from the short one.** Between 1970 and 2020 Lima lost
  18,155 people while the county lost 8,927 — so the rest of Allen County **gained 9,228** over the
  same fifty years. [inference] This node's finding from four recent years, that the suburban ring is
  shrinking too, stands for 2020–2024 and does not describe the half-century: over the long run the
  ring grew while the city emptied, and only lately have both been falling.

  **The ring turned between 2000 and 2010, and this node asked when.** The county outside Lima held
  28,592 people in 1940, 68,157 in 2000, and 66,627 at the 2020 census — growth at every count for
  sixty years, and a fall at both counts since. [inference] —
  [the balance series](../measure/allen-county-outside-lima-1890-2020.yml), computed from Census
  counts on both sides. **So the county has three peaks and they are thirty years apart**: Lima in
  1970, the county in 1980, the county outside Lima in 2000. [inference] This period is named for a
  process that reached the three of them in that order, and a single line labelled "Allen County"
  shows none of it.

  **The corporation's boundary moved underneath the city's counts.** Between 1980 and 1990 Lima
  annexed ground from American, Bath and Shawnee townships. [verified] — [1990 Census, Population and Housing Unit Counts, Ohio](../../catalog/census-cph-2-37-ohio.md), Geographic Change
  Notes. So the fall from 47,827 to 45,549 happened while the corporation was growing, and
  understates the decline inside the old line. [inference] This is the first annexation event the
  corpus has held against a caveat it has carried since genesis.

  **Lima peaked in 1970, and this node's own caveat is what got answered.** It said 1970 was the
  first of three federal counts, and that a series beginning at its own first observation is no
  evidence that the observation was a peak — the city might have been larger in 1960. It was not: 51,037 in 1960,
  50,246 in 1950, 44,711 in 1940, 42,287 in 1930, and every count below that lower again. [verified]
  — [1960 Census, Number of Inhabitants, Ohio](../../catalog/census-1960-number-of-inhabitants-ohio.md);
  see [the federal series](../measure/lima-population-1850-1960.yml). Twice now a refusal in this
  node has been retired by retrieval rather than by argument, and both times the refusal was about
  where the corpus's window began.

  It does not establish anything about *manufacturing employment*, which is the mechanism this period
  is named for and which the corpus does not measure at all: every figure here is population, and
  population decline is a consequence being read back as evidence for a cause. [open]

  **The mechanism, for the first time.** Across the four full years 2021 to 2024 the county lost
  1,271 people: **506 to natural decrease and 793 to net migration**, with a residual of 28.
  [verified] — [natural change](../measure/allen-county-natural-change-2021-2024.yml) and
  [net migration](../measure/allen-county-net-migration-2021-2024.yml), both from the same
  Population Estimates file this node has cited since its second phase. More people leave than
  arrive, and more die than are born, and the first is the larger of the two.

  It does not establish that either mechanism reaches back before 2020. The components of change
  are published for the estimate years only, so a period named for 1970 is explained here for four
  of its fifty-four years and described for the rest.

  **The last year of the series does not continue it.** The 2024 estimate is 15 higher than 2023 —
  natural change +7 and net migration +8, the first year since the series began in which neither
  was negative, because international arrivals rose every year to 165 while domestic departures
  fell to 157 and the two crossed. It does not establish that the decline has ended: fifteen people
  on 100,851 is far inside what a modelled estimate can resolve, one year is not a direction, and
  the same programme revises its own earlier years with every vintage. [open]

  **The decline is broad and uneven.** Between the 2020 estimates base and 2024, eleven of the
  county's thirteen civil subdivisions lost population. Lima lost most in absolute terms — 841
  of a county loss of 1,351 — and the only two that grew were Auglaize township, by 55, and
  Marion township, by 102, at the county's south-eastern and Delphos ends. [verified] —
  [Census Population Estimates](../../catalog/census-popest-2024.md), sub-county file. So this
  is not a city emptying into its own suburbs: the suburban ring is shrinking too, slower.
  [inference]

properties:
  began: "1970"
  character: |
    Contraction of manufacturing employment and sustained population loss concentrated in the
    county seat. The population half is verified; the manufacturing half is not. [inference]
  boundary_basis: |
    The start is argued for population and assumed for everything else. The county's series runs
    from 1830 and Lima's from 1850, and both rise without interruption to their peaks — 1980 and
    1970 — so the population turn is located rather than placed. The manufacturing turn, which is
    what the period is named for, is still unmeasured. [open] No end is claimed.
