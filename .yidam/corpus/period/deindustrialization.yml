class: period
label: Deindustrialization in Allen County
description: |
  The span in which Allen County's manufacturing employment fell from a peak of 18,400 to a trough
  of 7,775 — fifty-eight per cent, across thirty years. [verified] —
  [the employment series](../measure/allen-county-manufacturing-employment-1969-2022.yml).

  **This node was two periods until this phase.** It carried the county's population decline as well,
  on one start date of "roughly 1970" that was argued from population and applied to manufacturing.
  The population half now lives at [depopulation](depopulation.yml), which begins ten years earlier
  on one subject and has not ended. See
  [one period was doing two jobs](../../decisions/one-period-was-doing-two-jobs.yml).

  **It has an end, and that is the change this phase makes.** Manufacturing employment bottomed at
  7,775 in 2009 and has been above that figure in every year since, standing at 8,715 in 2022.
  [verified] — same series. Thirteen years without a new low is the strongest end bound this corpus
  has for any period, and the node claims 2009 rather than leaving the end open. [inference] Whether
  a recovery of a fifth is an end or a plateau is the thing to watch. [open]

  **What the city's industry looked like seventy years before this period.** Lima had 1,980
  manufacturing wage earners in 1899, 2,733 in 1904 and 3,607 in 1909, in 85 establishments.
  [verified] — [Lima manufactures](../measure/lima-manufactures-1899-1909.yml). That is the first
  measurement of work this corpus has ever held, and it is a picture of the industrial city sixty
  years before this period opens: a workforce that grew 82 per cent in a decade, in a city that grew
  40. [inference] It is a baseline and not a starting level, and the forty years between it and this
  period are now counted. [inference]

  **They contain no peak.** Allen County's factories held 6,164 wage earners in 1939, and 14,709
  employees in 1947, 14,691 in 1954, 13,526 in 1958, 14,897 in 1963 and 16,400 in 1967 — every one
  of them below the 17,623 this period's series opens at. [verified] —
  [the county at 1939 to 1967](../measure/allen-county-manufactures-1939-1967.yml). So the rise into
  1973 is continuous from the Depression, and this period does not begin on the far side of an
  earlier summit. [inference]

  **What those forty years do contain is a move, and it is the reason this is a county period and
  not a city one.** Lima held 75.4 per cent of the county's factory workforce in 1954 and 35.9 per
  cent in 1963, while the ground outside the city line went from 3,618 employees to 9,551.
  [inference] —
  [what stands outside the city line](../measure/allen-county-manufacturing-outside-lima-1929-1967.yml).
  Sixteen years before this period begins, the city had already lost half its factory work to its
  own townships, and the county had not lost any. [inference]

  **The refusal that stood on this node from genesis is answered.** It said the corpus established
  nothing about manufacturing employment inside this period — first in the form "does not measure it
  at all", then narrowed to "inside this period" when the 1909 figures arrived. The corpus now holds
  fifty-four years of it: **Allen County manufacturing employment fell from a peak of 18,400 in 1973
  to 7,775 in 2009, a fall of 58 per cent.** [verified] —
  [the long series](../measure/allen-county-manufacturing-employment-1969-2022.yml), corroborated in
  shape by [County Business Patterns](../measure/allen-county-manufacturing-employment-1986-2022.yml).
  The period's named mechanism is measured, and it happened.

  **The sector that shrank is still the one that pays.** Manufacturing is 17.9 per cent of the
  county's covered jobs in 2024 and 28.0 per cent of its wages, at an average annual pay of $92,088
  — the only sector here whose share of pay is more than half again its share of employment.
  [inference] — computed from
  [what work pays](../measure/allen-county-wages-2024.yml). Health care overtook it in headcount and
  pays $60,502; retail trade and food service together employ more people than manufacturing and
  take 9.7 per cent of the county's wages.

  So a period named for the loss of manufacturing employment ended with manufacturing still the
  county's best-paid large sector, and what replaced the jobs did not replace the pay. [inference]
  This corpus has one year of wages and cannot say when that gap opened. [open]

  **What happened after the trough is why this period can be closed.** Manufacturing employment rose
  to 8,917 in 2020 and stood at 8,573 in 2022 on the County Business Patterns count, up a fifth from
  its bottom. Private employment fell 3,709 between 2010 and 2022 while manufacturing rose 1,446, so
  the losses of those twelve years were entirely outside manufacturing — the largest of them in
  health care, which fell from 11,744 to 9,151. [verified] —
  [County Business Patterns](../measure/allen-county-manufacturing-employment-1986-2022.yml) and
  [the sector composition](../measure/allen-county-employment-by-sector-1986-2022.yml). Whatever has
  been emptying this county since 2010, it is not its factories. [inference]

  **The caveat this node has always carried needs a new subject, and it has one.** A population chart
  of this county invites the reading that the people left because the factories did.

  It does not establish that the county's population decline was caused by its manufacturing
  decline. That was unlicensed while manufacturing employment was unmeasured, and it is now
  contradicted for the recent past: between 2010 and 2022 the county's private employment fell by
  3,709 while its manufacturing employment *rose* by 1,446. [verified] —
  [the series](../measure/allen-county-manufacturing-employment-1986-2022.yml). For the last twelve
  years of this period the proposed cause moves opposite to the effect.

  **The years this node called open one phase ago are measured, and they do not contain a decline.**
  Allen County manufacturing employment was 17,623 in 1969, rose to a peak of **18,400 in 1973**, and
  stood at 18,389 as late as 1979. [verified] —
  [the long series](../measure/allen-county-manufacturing-employment-1969-2022.yml). The county's
  factories were still adding workers through the decade this period says the decline began in.

  **That is why this period no longer starts in 1970.** The old start was fixed from population and
  applied to manufacturing, and manufacturing did not turn until 1973 at the earliest and did not
  fall durably until after 1979. [verified] — same source. The node now begins at 1979, the last
  year within one per cent of the peak, and the population start it used to carry has gone with the
  population to [depopulation](depopulation.yml). [inference]

  **The order is the part that matters.** [Lima](../place/lima.yml) peaked in 1970. Manufacturing
  peaked in 1973 and held near its peak until 1979. The county peaked in 1980. Employment of every
  kind peaked in 2000. [verified] — the long series,
  [total employment](../measure/allen-county-total-employment-1969-2022.yml) and the county's own
  population series. The city began emptying while the factories were still filling. [inference]
properties:
  began: "1979"
  ended: "2009"
  character: |
    Contraction of manufacturing employment across the county, from a plateau at the 1973 peak to a
    trough in 2009, with a recession trough and recovery in the middle of it. It is not a period of
    falling employment generally: the county's total jobs rose through the first twenty-one years of
    it. [verified]
  boundary_basis: |
    The start is the last year manufacturing employment stood within one per cent of its all-time
    peak — 18,389 in 1979 against 18,400 in 1973 — after which the series never returns to that
    level. [verified] The peak years 1973, 1974 and 1979 are all within one per cent of each other,
    so the plateau rather than the peak fixes the start. The end is the trough, 7,775 in 2009, with
    thirteen subsequent years all higher. [verified] Both bounds are computed from one series and
    would move if a second series with a different frame were preferred; County Business Patterns
    puts the trough one year later, in 2010. [inference]
