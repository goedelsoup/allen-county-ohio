class: event
label: The flood of 12 March 1939
description: |
  **Big and Little Riley creeks left their banks at five on a Sunday morning, crested at eleven,
  and were back inside them by Monday.** "Torrential rainfall that fed Big and Little Riley creeks
  over the weekend reached a climax shortly before noon on Sunday when Bluffton experienced its
  worst flood since the disastrous 1913 inundation." [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 16 March 1939, page one. The water
  "blocked four Bluffton streets, stalled automobiles, washed out portions of two roads and a
  segment of a railroad right-of-way", "marooned a few residences and inundated hundreds of acres
  of farm land", and left Harmon field "under five feet of water, with the concrete stadium rising
  like an island". [verified] — the same page. The paper used that superlative again of
  [6 June 1947](the-flood-of-6-june-1947.yml); see
  [a worst-since is not a ranking](../../decisions/a-worst-since-is-not-a-ranking.yml).

  **The rain gauge agrees on the day.** Lima recorded 0.48 inches on 11 March and **2.53 on the
  12th** — three inches in two days, and nothing above a tenth for the rest of the month.
  [verified] — [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551. Two records
  landing on one date is what makes this an event here; see
  [a flood needs two records](../../decisions/a-flood-needs-two-records.yml).

  **The county's own river crested three days later and it is the second-largest peak that gauge
  ever recorded.** The Ottawa at Allentown reached **6,160 cubic feet a second at 10.10 feet on
  15 March 1939**, behind only [22 January 1959](the-ottawa-river-flood-of-1959.yml) in fifty-two
  water years, and it is published as a historic peak rather than a reading because the gauge was
  out from 31 December 1935 to 1 September 1943. [verified] —
  [USGS peak streamflow](../../catalog/usgs-nwis.md), site 04187500; see
  [the peak flows](../measure/ottawa-river-peak-flows-1924-2025.yml). **The paper is describing a
  different basin from the gauge** — Riley Creek drains to the Blanchard, the Ottawa does not — and
  only 0.08 inches fell on the 15th, so the two are the flashy and the slow halves of one storm and
  not two storms. [inference]

  **What the village measured against was 1913, and three men had marks to measure with.** No
  instrument in Bluffton recorded this flood: Riley Creek near Bluffton has never carried a flow
  series and the Blanchard gauge was itself out from 1937 to 1940. [verified] — the same source,
  sites 04189172 and 04189000. So the paper gave depth the way the village held it, in inches
  against a private high-water mark:

      Cherry street        "lacked about one foot of being as deep as the 1913 inundation";
                           two feet stood in the Scott and Ewing plant in 1913, one foot in 1939
      Albert Benroth       in 1913 water ran between the old George Benroth property and the
                           Mabel Jones property; in 1939 it stopped at the alley one lot nearer
                           the Cherry street bridge
      Charles Matthey      "made a mark near his home when the 1913 inundation was at its crest";
                           1939 "lacked only four inches of being as high"

  [verified] — the same issue, its "Flotsam and Jetsam from Bluffton's Flood Sunday" column;
  Matthey lived "on the Allen-Hancock county line near Marsh Run". A mark cut at a crest is a datum
  belonging to one property; see [a flood mark belongs to one place](../../decisions/a-flood-mark-belongs-to-one-place.yml).

  **This is the corpus's only testimony to the flood of March 1913 from inside the county, and it
  is second-hand by twenty-six years.** No Allen County newspaper of 1913 is digitized anywhere
  this corpus has reached. What the instrument record holds of that flood is one reconstructed
  figure from the next basin north — **22,000 cubic feet a second at 18.50 feet on the Blanchard
  near Findlay, the largest of ninety-nine water years**, against 14,500 at 18.46 feet in
  [August 2007](the-flood-of-22-august-2007.yml). [verified] — the same source, site 04189000. The
  two highest floods in that record stand four hundredths of a foot apart and are credited with
  discharges half as far apart again — about a rating curve and a century of channel, not about the
  water. See [a rating rates one thing](../../decisions/a-rating-rates-one-thing.yml).

  **A year later the same paper made it 1913's equal, and a weekend that did not flood is why.** On
  2 and 3 March 1940 heavy rain on melting snow brought "fears that the flood of a year ago March
  12th might be duplicated", and the creeks "overflowed their banks at some points" but "failed to
  attain a serious flood stage" — the same setup, the same month, no flood. In reporting it the
  paper called the 1939 inundation "one of the worst in the history of the town and **the equal of
  the memorable flood of 1913**". [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 7 March 1940, page two; Lima recorded
  0.61 and 0.36 inches on the two days and the snow depth that stood on 27 February was gone by the
  2nd. [verified] — [GHCN-Daily](../../catalog/ghcn-daily-lima.md). **In 1939 this flood was worst
  *since* 1913 and in 1940 it was 1913's equal, on no new measurement**; see
  [a worst-since is not a ranking](../../decisions/a-worst-since-is-not-a-ranking.yml).

  [open] What 1913 did in Allen County. Three marks in one village, a reconstructed peak in
  another county's basin, and the phrase "the disastrous 1913 inundation" used as though every
  reader knew it — and no account of the flood itself that this corpus can reach.
