class: event
label: Allen County is declared for COVID-19, March 2020
description: |
  **The most recent thing this corpus can date**, and the longest incident in the county's federal
  record by a factor of twenty-nine. Allen County was named in EM-3457-OH on 13 March 2020 and again
  in DR-4507-OH on 31 March 2020, both carrying an incident window from 20 January 2020 to 11 May
  2023 — **1,207 days**, against forty-one for the longest of the county's other declarations.
  [verified] — [OpenFEMA](../../catalog/fema-disaster-declarations.md); see
  [the declarations](../measure/allen-county-disaster-declarations-1965-2020.yml).

  **Two declarations, one incident.** The emergency declaration came eighteen days before the major
  disaster declaration, on identical incident dates. That is the same pattern as June 2012, where an
  emergency was declared on the 30th and a major disaster seven weeks later for one four-day storm.
  [verified] — same source. Counting rows here counts federal acts, not events in the world.
  [inference]

  **Neither carried Individual Assistance.** Both designated Public Assistance and the major
  disaster declaration added Hazard Mitigation. [verified] — same source.

  **It is the only event in this corpus that overlaps a census.** The 2020 census was taken inside
  this incident window, and the county's group-quarters counts, its housing occupancy and its
  population were all enumerated during it. [inference] — see
  [the group quarters](../measure/allen-county-group-quarters-2020.yml) and
  [the 2020 count](../measure/allen-county-population-2020-census.yml). The corpus does not assert
  that the enumeration was affected; it records that the two overlap, which is a thing a reader of
  those figures should know and could not otherwise learn here.

  [open] What happened in the county. Deaths, cases, hospital load, school closure, the fate of the
  two prisons and the state hospital, all of which are institutions this corpus holds and none of
  which it can say anything about for these three years.
  **It is by far the most expensive thing that has happened to this county on the federal books.**
  Seven projects and $8,940,505 of public assistance — 84.28 per cent of every federal disaster
  dollar this county's applicants have received since 2005 — of which $8,777,201 went to
  [Lima Memorial Health System](../organization/lima-memorial-health-system.yml), $89,863 to the
  Mennonite Memorial Home at Bluffton and $68,948 to the Allen County Health Department for a
  project titled "ACPH Super POD Project #1". [verified] —
  [OpenFEMA assistance programs](../../catalog/openfema-assistance-programs.md); see
  [the assistance](../measure/allen-county-disaster-assistance-2005-2025.yml).

  **It also paid households, which the corpus had said it did not.** $3,595,938 reached 507 Allen
  County households under the Individuals and Households Program, none of it for repair and none of
  it for rent, with not one property inspected. [verified] —
  [the household aid](../measure/allen-county-household-disaster-aid-2007-2020.yml). What it was
  for is not in that file. [open]

  **And it bought a house out of a floodplain.** The mitigation allocation this declaration
  generated funded a riverine property acquisition, approved April 2023 and closed 18 August 2026.
  [verified] — [the mitigation](../measure/allen-county-hazard-mitigation-2003-2026.yml). A
  declaration generates money for hazards it had nothing to do with. [inference]

