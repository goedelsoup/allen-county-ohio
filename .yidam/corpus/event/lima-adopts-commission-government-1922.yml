class: event
label: Lima abolishes the mayor, January 1, 1922
description: |
  **"The commission form of government comes into effect January 1, 1922, at the end of the term of
  Mayor Burkhardt. Henceforth initiative, referendum and recall enter into the conduct of public
  service."** [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **It replaced an aldermanic government of eighty years.** "For four-score years Lima has been
  ruled by a mayor", and "the mayor and members of City Council have hitherto served two years".
  [verified] — same source. Four-score is exact: the town organized in March 1842 and the charter
  took effect in January 1922, seventy-nine years and nine months. [inference] — computed here.

  **The movement began in 1919 and the charter was drafted to order.** "A movement to replace the
  aldermanic form of government with the commission-manager charter plan was begun early in 1919,
  and a commission was named and instructed to draft a charter." [verified] — same source. The 1912
  revision of the Ohio Constitution is what made it available. [verified] — same source.

  **What the charter secures and what it does not.** "It secures home rule for Lima except that the
  charter shall in no way interfere with the tax limit laws of the state governing municipalities;
  city officials are not granted any greater debt-incurring power than they now possess. Public
  hearings are required upon appropriations of public money." [verified] — same source. That
  answers, from a source and with a date, what
  [the office node](../office/mayor-of-lima.yml) had only inferred from three term calendars: Lima
  is a home-rule city under a charter of its own, and this is when.

  **The reason given is that the county had changed under the law.** "When many laws on the statutes
  of Allen County were enacted it was purely an agricultural county, but Lima is now an industrial
  center with manufacturing and commercial interests." [verified] — same source. The book is
  arguing, not reporting, and the argument is the same one
  [the oil boom](../period/lima-oil-boom.yml) makes about everything else in the county.
  [inference]

  [open] Whether Lima had a mayor at all under the commission charter, and when it returned to
  one. The city's site names a sitting mayor first elected in 2021 and no predecessor; no source
  here spans the ninety-nine years between.
properties:
  occurred: 1922-01-01
  event_type: charter change
  location_description: |
    The city of Lima. The charter was drafted by a commission named for the purpose; the book does
    not say where it sat or when the electors voted on it. [open]
