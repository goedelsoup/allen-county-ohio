class: event
label: The reorganization of February 28, 1848
description: |
  The sitting at which the Allen County commissioners redrew every township line in the county
  at once, "consequent on the formation of Auglaize County". [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), which resumes the
  commissioners' record. Both scans carry the act's text identically.

  **The county lost its southern half and gained a northern one.** In March 1846 Allen County
  assessed sixteen townships in four districts, eight of which — Deuchoquette, Moulton,
  Washington, Pusheta, Clay, Union, Wayne and Goshen — are in Auglaize County today. [verified]
  — same source, the 1846 assessors' districts. In exchange the act took ground from
  Putnam and Van Wert Counties: Riley Township's south tier to
  [Richland](../place/richland-township.yml), the south half of Jennings to
  [Marion](../place/marion-township.yml), and Salem's north-east quarter with Jennings' east half
  set off as [Spencer](../place/spencer-township.yml).

  **The transfer was settled in cash.** In May 1853 the commissioners of Allen and Putnam met and
  agreed that Allen owed Putnam **$3,848.76** arising from the changes. [verified] — same source.
  Two counties reconciling an account five years later is the strongest internal evidence that
  the 1885 compiler was reading a real record rather than composing one.

  **Allen County's population before and after this date is not a series.** The 1885 statistics
  chapter gives county totals of 578 in 1830 and 9,079, 12,116, 19,185, 23,623 and 31,314 for
  1840 to 1880, and footnotes that the marked townships "form a portion of the adjoining county
  of Auglaize" since the change. [verified] — same source. The 1840 figure therefore counts
  ground that has not been in this county since 1848, and does not count Sugar Creek, Monroe or
  Richland, which were Putnam's. Any trend drawn across 1848 is a trend about two different
  counties — see [the pre-1970 series](../question/pre-1970-population-series.yml).

  [open] The book transcribes the act as taking the south half of Jennings "from Putnam County"
  while [Marion's](../place/marion-township.yml) own chapter puts Jennings in Van Wert. The
  corpus records the discrepancy rather than choosing; the commissioners' book would settle it.
properties:
  occurred: 1848-02-28
  event_type: reorganization
  location_description: |
    In session at Lima. The act text names no place; the commissioners had met in the court
    house since 1842. [inference]
