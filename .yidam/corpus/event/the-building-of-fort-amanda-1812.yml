class: event
label: The building of Fort Amanda, September 1812
description: |
  Col. Thomas Poague's command built a stockaded post on the west bank of the Auglaize in
  September 1812, and Poague named it for his wife. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans, whose
  wording is that it "is, therefore, conceded" — the compiler is inferring the date from
  Harrison's correspondence rather than reading it off an order.

  **What Harrison was doing.** Appointed commander-in-chief of the Northwestern Army on
  17 September 1812, he massed troops at Wooster, Urbana, St. Marys and Defiance and made the
  southern line of the Black Swamp, from Upper Sandusky to St. Marys, his base. The posts on the
  Auglaize appear first in the report of military affairs that followed the appointment, alongside
  the Ohio cavalry under Col. Finley, the Kentucky cavalry under R. M. Johnson, and the infantry
  under Cols. Poague, Barbee and Jennings — "the former of whom erected Fort Amanda and the latter
  Fort Jennings". [verified] — same source, both scans.

  **The 1921 history tells it as a road first and a fort second.** Poague "cleared the way through
  the wilderness from St. Marys, where General Harrison had his headquarters, to Fort Defiance at
  the junction of the Auglaize and the Maumee", and built the fort on the return journey.
  [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md), single
  witness. It also has the road following ground already cut: Wayne had ordered a military road
  from the present St. Marys to a point on the Auglaize near where the fort was built, after Fort
  Recovery was retaken, and that stretch is part of Wayne's Trace. [verified] —
  [the 1885 history](../../catalog/leeson-allen-county-1885.md), both scans.

  **The month is not agreed.** The 1885 history says September 1812; the bronze tablet the State
  of Ohio put on the monument in 1915 says the fort was erected by Harrison's order "in October,
  1812". [verified] — the 1885 history and
  [the 1921 history](../../catalog/rusler-allen-county-1921.md) quoting the tablet. The corpus
  records both and dates this node September, because that is the reading a book gives with its
  reasoning shown against a tablet that gives none. [inference]

  [open] Whether any order, return or muster roll fixing the date survives. The garrison's records
  were taken by the British and destroyed, which the same source gives as the reason the men
  buried there are nameless.
properties:
