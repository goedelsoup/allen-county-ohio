class: event
label: The incorporation of Delphos, 1851
description: |
  **Delphos became a municipal corporation on 7 February 1851.** "The first election for Delphos
  Village under the Act of Incorporation February 7, 1851, took place March 8 of that year."
  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md).

  **The two scans of that book disagree about the day of the first election and not about the
  incorporation.** Scan A reads "March 8" and scan B reads "March 3"; both read February 7, 1851
  for the act. The corpus records the act's date and prints the election as the 3rd or the 8th.
  [verified] — same source, both scans.

  **Lester Bliss was elected mayor**, Smith Talbott recorder, and N. White, E. N. Martin,
  J. P. Cowan, J. P. Murphy and T. Wrocklage councilmen; F. J. Lye treasurer and E. N. Talbott
  marshal followed on 21 March. **The corporation's expenses for its first year were $80.67**, a
  figure scan A renders as "180.67" with the dollar sign read as a digit. [verified] — same source,
  scan B; the roll of town officials from 1852 to 1884 follows it.

  **It is the second-oldest municipal corporation in the county** and the only one the sources
  attribute to an act of incorporation rather than to a county commissioners' order or a ballot.
  [verified] — see
  [the incorporations](../measure/allen-county-municipal-incorporations-1842-1904.yml).

  **The corporation's date was in this book the whole time.** The corpus has cited the 1885 history
  in dozens of nodes and had never asked it this question; the field on
  [the city](../jurisdiction/city-of-delphos.yml) stood empty for sixty-eight phases. [inference] —
  see [a count of absences is not an agenda](../../decisions/a-count-of-absences-is-not-an-agenda.yml).

  [open] When Delphos became a city rather than a village. That question is older than this node and
  this source does not answer it: the 1885 book calls it a village throughout.
properties:
  occurred: "1851-02-07"
  event_type: incorporation
  location_description: |
    Delphos, then wholly described within [Marion Township](../place/marion-township.yml) by the
    1885 book's chapter that carries it, and today a city standing in Allen and Van Wert counties.
    [verified] — the same source.
