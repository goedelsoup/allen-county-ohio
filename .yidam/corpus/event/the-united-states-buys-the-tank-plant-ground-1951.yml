class: event
label: The United States buys the tank plant's ground
description: |
  Between 20 and 28 June 1951 the United States of America took the north-west quarter of section
  14, township 4 south, range 6 east, from five private owners in five warranty deeds — 60.24
  acres, 5 acres, 40 acres of the west half of the east half, and two parcels described only as
  "Pt". Each was recorded on the day it was signed or the day after. [verified] —
  [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md), volume 0034A
  pages 89–92, at volumes 320 pages 573, 574 and 577 and 321 pages 245 and 246.

  It is the ground the
  [Joint Systems Manufacturing Center](../site/lima-army-tank-plant.yml) stands on, and this is the
  corpus's answer to a question that node has carried since genesis. [verified] — same pages and
  [the survey sections](../measure/allen-county-survey-sections.yml).

  **The date is the finding.** The received account of tank building at Lima is a wartime one, and
  this corpus had assembled its own version of it: the Lima Locomotive Works taking a medium tank
  contract in 1941, [the Lima Tank Depot](../site/lima-tank-depot.yml) under construction in
  January 1943. None of that is this ground. Through the whole of that war it was a mortgaged farm
  — borrowed against in 1940, 1941 and 1944, leased to a fishing and game club in April 1940, and
  crossed by pipeline rights of way its private owners granted in 1939, 1940 and 1949. [verified] —
  same pages.

  The Army arrived here six years after that war ended, in the second year of the Korean one.
  [inference]

  **Nine days, five sellers, same-day recording.** That is what a government buying to a deadline
  looks like rather than a farm changing hands, and it is the only thing the record says about how
  the acquisition was conducted. [inference]

  Whether any of the five sold willingly, and whether condemnation was threatened or used, is not
  in the abstract. [open]

  This node does not establish when anything was built on the ground it describes. A deed dates a
  purchase. [open]

  It covers one quarter section. The installation may hold ground in others, whose sheets have not
  been read. [open]
