class: event
label: The mob at the Allen County jail, 1916
description: |
  On 30 August 1916 a mob came to the county jail in Lima to take a Black prisoner, and when the
  sheriff would not say where he had hidden him they put a rope round the sheriff's neck. [verified]
  — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The book's account, in its own words.** "The feeling of smoldering hatred burst into flame when
  the sheriff extended protection to a negro prisoner — Charles Daniels. ... When the mob appeared at
  the Allen County jail and demanded the negro, the sheriff removed him and concealed the hiding
  place — simply discharging his duty as an officer of the law. When they were unable to force from
  the lips of the sheriff the secret, a rope was fastened about his neck and the frenzied mob was
  about suspending him from a lamppost when there was friendly intervention — but Sheriff Eley
  required hospital attention." [verified] — same source, quoted as printed, including the period's
  term for the prisoner.

  **The book gives the mob a motive that is not about the prisoner at all.**
  [Sherman E. Eley](../person/sherman-e-eley.yml) had called on the State Militia to stop a prize
  fight in Lima and had been "elected by the dry vote of Allen County", and the book says "the
  outlaws in the community held that fact against him" in the wet-and-dry quarrel then dividing the
  town. [verified] — same source. Whether that explains a lynch mob or excuses one is the book's
  judgment and not this corpus's. [inference]

  **What became of the two men.** Charles Daniels "was later sent to the penitentiary"; Eley "was
  later the recipient of a medal given him in recognition of his bravery". [verified] — same source,
  which says neither what Daniels was accused of, nor by what court, nor who gave the medal. [open]

  **It is the second of three times a mob has come to this jail and the corpus held only the
  third.** Fifty armed men guarded it against a threatened mob the night before
  [Andrew Brentlinger's execution in 1872](the-execution-of-andrew-brentlinger-1872.yml), and
  [Sheriff Jess Sarber was shot dead in it in October 1933](allen-county-jail-raid-1933.yml).
  [verified] — the same book for the first two and
  [Chronicling America](../../catalog/chronicling-america.md) for the third. Three attacks in
  sixty-one years, and the office's own duty as the book states it is "to prevent lynchings, riots
  and all violent disorders".
properties:
  occurred: "1916-08-30"
  event_type: riot
  location_description: |
    The Allen County jail, Lima. The corpus holds no site node for the building and the book gives
    no address. [verified]
