class: event
label: The flood of 29 June 1957
description: |
  **The county's flood study names a June 1957 flood on the Ottawa River and the gauge dates it to
  the day.** The study lists it among eight floods "of lesser intensity"; the Ottawa at Allentown
  took its water year's largest daily mean on 29 June 1957, 3,660 cubic feet a second at the 99.9th
  percentile of the gauge's 18,545 days. [verified] —
  [the flood insurance study](../../catalog/fema-flood-insurance-study.md), §2.3, and
  [USGS](../../catalog/usgs-nwis.md), site 04187500. Its instantaneous peak, 5,300 cubic feet a
  second at a stage of 9.45 feet, is **fifth of the gauge's fifty-two water years**. [verified] — the
  same source's annual peaks; see
  [the peak flows](../measure/ottawa-river-peak-flows-1924-2025.yml).

  **Two records agree on the month and only one of them can give the day**, which is the arrangement
  this corpus expects from a prose flood history read against an instrument. The study names months;
  the gauge names days; neither alone establishes a flood here. [inference] — see
  [a flood needs two records](../../decisions/a-flood-needs-two-records.yml).

  **Three and a half inches fell over two days into a month that took seven.** 2.00 inches on
  28 June and 1.56 on the 29th, in a June of 7.14 inches at the Lima station. [verified] —
  [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551. Neither day is in the
  station's twenty wettest: the 28th ranks 105th of 45,272.

  **It is one of the county's larger floods and it left no other trace this corpus can reach.** The
  federal storm record began in 1950 and has no Allen County flood row before 1996; the flood
  insurance record begins in 1978; no digitized Lima newspaper survives after 1 March 1912.
  [verified] — [the storm record](../measure/allen-county-storm-events-1950-2026.yml),
  [the claims](../measure/allen-county-flood-insurance-1978-2023.yml) and
  [the county's newspapers](../measure/allen-county-newspapers-1843-2026.yml).

  [open] What this flood did. Nothing retrieved here describes damage, depth or ground: the study
  gives it four words in a list, and the gauge gives a number. The study's authority is its
  Reference 5, the flood insurance study for the
  City of Lima of August 1978, which this corpus has not retrieved.
properties:
  occurred: 1957-06-29
  event_type: flood
  location_description: |
    The Ottawa River at Allentown, gauged at site 04187500 draining 160 square miles. The study
    places the flood on the Ottawa River and no more finely than that. [verified] —
    [the study](../../catalog/fema-flood-insurance-study.md) and [USGS](../../catalog/usgs-nwis.md).
