class: event
label: The Army begins building south of Lima, May 1942
description: |
  **In May 1942 the Ohio Steel Foundry Company began building a government-owned,
  contractor-operated plant about five miles south of the centre of Lima, on open land previously
  used for agriculture, to produce centrifugally cast gun tubes.** [verified] —
  [the historic properties report](../../catalog/dtic-lima-army-tank-plant-reports.md), *World War
  II to 1950*. The site covered 170 acres.

  **The mission it was built for was cancelled before it was finished.** A new process for piercing
  seamless steel tubing to form light artillery pieces made the casting plant unnecessary, and only
  a few months after construction began the Ordnance Corps decided to use the facility as a depot
  for modifying and processing tanks and other combat vehicles instead. [verified] — the same
  source. The installation that stands here was therefore never built for the thing it has done for
  eighty years, nor for the thing it was begun for.

  **In November 1942 United Motors Service, a General Motors subsidiary, took it over under
  contract**, and the plant opened in 1943. [verified] — the same source. That is the same company
  and the same arrangement this corpus had already found in a 1944 trade paper, arrived at from the
  other end.

  **Building 147 is the war still standing.** The primary factory building, irregular in plan,
  originally provided 582,000 square feet of floor space — a steel-frame, high-bay structure whose
  curtain walls were glazed from near ground line to roof line with single-pane glass in steel
  sash. About fifty numbered buildings or structures stood at Lima during the war, and Building 147
  and seven others named in the report still form the core of the plant. [verified] — the same
  source. The Detroit architectural engineering firm of Shreve, Anderson and Walker planned and
  designed the installation from March to September 1942, and the work was completed by another
  Detroit firm headed by William Edward Lapp.

  **More than a hundred thousand combat vehicles passed through before the war was over.**
  [verified] — the same source. That corroborates the figure this corpus refused to write down: a
  headline of August 1944 gave `75,01)0` through damaged scanning, and seventy-five thousand by that
  August is what a hundred thousand by 1945 implies. [inference] See
  [two scans of one book](../../decisions/two-scans-of-one-book.yml).

  **The ground stayed at 163 acres for eight years.** A seven-acre sale in 1943 reduced the
  installation from 170 acres to 163 contiguous ones, and it remained that size until 1951.
  [verified] — the same source; see
  [the 1951 purchase](the-united-states-buys-the-tank-plant-ground-1951.yml), which is an expansion
  of this and not a founding.

  **This corpus cannot say who owned the 170 acres before the Army did.** The Recorder's abstract it
  has read covers the north-west quarter of section 14, which the report places among the parcels
  bought nine years later; the sheets for the original ground have not been identified, and the
  report names no seller. See
  [a parcel is not an installation](../../decisions/a-parcel-is-not-an-installation.yml).

  [open] Which township the original 163 acres lie in. The installation's coordinate of record falls
  in [Shawnee Township](../place/shawnee-township.yml), and the 1942 ground lies north-west of the
  parcels that coordinate sits among, so the corpus has a direction and not a boundary.
properties:
  occurred: "1942-05"
  event_type: construction
  location_description: >-
    About five miles south of the centre of Lima, on 170 acres of open agricultural land. The
    report gives no legal description and no seller.
