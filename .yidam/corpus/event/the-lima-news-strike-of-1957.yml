class: event
label: The Lima News strike of 1957
description: |
  A seven-week stoppage that shut the county seat's only daily and left two newspapers behind it.
  [verified] — [the U.S. newspaper directory](../../catalog/us-newspaper-directory.md), three
  bibliographic records read together.

  **The Lima News was suspended from 10 May to 27 June 1957 due to a strike.** That is the whole of
  what its own record says about it, in one sentence. [verified] — same source; see
  [The Lima News](../organization/the-lima-news.yml).

  **The strikers printed their own paper on the day the presses stopped.** *The Bulletin*, Lima,
  Ohio — "No. 1 (May 10, 1957)-no. 4 (June 27, 1957)", imprint "Lima, Ohio : Union Newspaper
  Workers, 1957", and the note "Published by striking and locked out workers of the Lima news".
  [verified] — same source. Its first issue and the suspension share a date, and so do its last and
  the resumption.

  **Four numbers in seven weeks, and every one of them survives.** The Ohio History Connection
  reports the full run, 10 May to 27 June 1957, on microfilm roll 25189. [verified] — same source,
  the holdings record. It is one of the shortest complete newspaper runs the county has.

  **Four days after the News came back, Lima had a second daily.**
  [The Lima Citizen](../organization/the-lima-citizen.yml) is dated first year, number 1,
  1 July 1957, and ran to 7 January 1964. [verified] — same source. The directory states the two
  facts and does not join them; the corpus joins them and says so. [inference]

  **The words "locked out" are the record's, not this corpus's.** A lockout and a strike are
  different acts and the note uses both. [verified] — same source. Which it was, who the union was,
  what the dispute was about and how it ended are not in any source held here. [open]
properties:
  occurred: "1957-05-10"
  occurred_through: "1957-06-27"
  event_type: strike
  location_description: |
    Lima, Ohio. No address is given for the plant or for the strikers' press. [verified]
