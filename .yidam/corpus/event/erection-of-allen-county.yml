class: event
label: Erection of Allen County
description: |
  The act of the Ohio General Assembly laying out Allen County in 1820 from the lands ceded at
  [St. Marys](treaty-of-st-marys.yml). [inference]

  Laying out a county and organizing its government were separate acts in Ohio practice, often
  years apart: a county could exist on paper, attached to a neighbouring county for judicial
  and administrative purposes, before it had its own courts and officers. Allen County is
  understood to have been organized about a decade after it was created. [inference] — see
  [when Allen County's government was organized](../question/when-allen-county-was-organized.yml).

  [open] The act itself has not been retrieved, so its date, its exact text, and the boundaries
  it described are all unverified.
properties:
  occurred: 1820
  event_type: erection
