class: event
label: Erection of Allen County
description: |
  **The organic act of 1820, which divided the cession into fourteen counties and laid out Allen
  as one of them.** [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), which gives the act's
  disposition county by county: Allen was "all of the second townships to the northern limits of
  the organized counties", and the act further provided that it "be attached to Shelby County for
  judicial purposes". Allen was afterwards attached to Mercer, and stayed attached until
  [the organization of 1831](../question/when-allen-county-was-organized.yml).

  Laying out a county and organizing its government were separate acts in Ohio practice, often
  years apart. The corpus had reasoned to that from general practice and put the gap at "about a
  decade"; the record makes it eleven years, and names both counties Allen was attached to in the
  meantime. [verified] — same source.

  **The 1885 book does not name the same treaty this corpus does.** It says the 1820 act divided
  "the lands ceded by the Indians in the treaty of Maumee", and that Allen was not organized "for
  fourteen years after the treaty of the Maumee Rapids" — an 1817 treaty, and fourteen years from it
  is 1831. This corpus attributes the cession to
  [St. Marys in 1818](treaty-of-st-marys.yml). [open] Both treaties ceded ground in north-west
  Ohio and both are real; which of them covers the specific ground of Allen County is not settled
  here, and the corpus is now carrying two sources that answer it differently rather than one that
  answers it at all.

  [open] The act's own text and the exact date within 1820 remain unretrieved. What is recorded
  above is an 1885 compiler's account of it.
