class: event
label: The contested commissioner election of 1920
description: |
  Three men were elected to the Allen County board in November 1920 and one of them refused the term
  he was given. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The dispute was not about who won. It was about which of the three seats each winner got.** "In
  the 1920 election the short term expiring January 21, 1923, fell to Mr. Craig, Gray and Thompson
  filling the terms expiring two years later; however, Mr. Craig took exception to the election
  returns, claiming that he received more votes than either of the others, entitling him to the long
  term of service. He has since been awarded one of the long terms and Mr. Gray the short term."
  [verified] — same source, quoted in full because the outcome is a single clause of it.

  **It is the only account this corpus holds of how a staggered board assigns its terms.** The
  office is three seats with terms that do not expire together, and the statute this corpus has read
  says only when each begins. What happens when three men are elected at once to seats of unequal
  length is answered here, and answered by a protest rather than by a rule: the largest poll took
  the longest term. [inference] — see
  [the board](../office/allen-county-board-of-commissioners.yml).

  **It dates a term boundary that has since moved.** The short term expired on 21 January 1923; the
  county's three commissioners now take office on the first, second and third of January.
  [verified] — same source and
  [the Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  [open] When the award was made, by whom, and on what authority. The book says only "he has since
  been", and the corpus holds no election returns for this county from 1920.
