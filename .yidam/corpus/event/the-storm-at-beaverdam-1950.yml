class: event
label: The storm at Beaverdam and Orange Township, 19 July 1950
description: |
  **A second tornado crossed the county's northern edge about an hour after the one the federal
  record holds, and the federal record does not hold it.** "The tornado ripping thru this area,
  however, was apparently a different one than that which ravaged Lima more than an hour earlier.
  It struck here shortly after 6 p. m., while the Lima tornado occurred at 4:50." [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 27 July 1950. See
  [the Lima tornado](the-tornado-of-19-july-1950.yml).

  **It cut five miles and three hundred yards wide in a semicircle around Bluffton.** It headed
  north-east from a farm on the Allen–Hancock county line road and "finally blew itself out" five
  miles away on a farm on State Route 103. [verified] — the same source. The Lima tornado's stated
  track is 9.7 miles and the same 300 yards at its widest, which is why two storms of one evening
  are easy to read as one.

  **Its named damage in this county is at [Beaverdam](../place/beaverdam.yml)**, where it levelled
  one barn, demolished two more and took down trees at a roadside park, and where a farmer was
  buried in the debris and his son's leg was broken by a flying barn door. [verified] — the same
  source; the same paragraph is quoted at
  [the Lima tornado](the-tornado-of-19-july-1950.yml), because the paper's own account cannot
  finally separate them either.

  **Most of its track is in the next county and the corpus records it anyway.** The five miles of
  heaviest damage are in Orange Township, which is Hancock County; the storm's start on the county
  line road and its damage around Beaverdam are in
  [Richland Township](../place/richland-township.yml). [inference] — read from the road and township
  names in the same account. A storm that begins on a county line is not a county's event and is
  not not one.

  **Nobody was killed and the roads took a day.** "It was nearly 24 hours after the storm struck
  before all roads in its path were re-opened", by township trustees and farmers with tractors, and
  in some places by shoving fallen trees to the side of the highway "where they will remain until
  there is time to remove them later". [verified] — the same source. The paper's Beaverdam
  correspondent wrote that "although several families in the rural community here received heavy
  losses in last week's wind storm, we feel it is very fortunate that no lives were lost or anyone
  seriously injured". [verified]

  **The clearest thing it left was in the woodlots.** Trees "more than two feet in diameter were
  twisted off and others uprooted", and the tops were taken out of most of what stayed standing; in
  the heavily damaged woodlots "a lot of dead rabbits and pheasants could be found, leading to
  conjecture that the storm had come up so quickly that the game birds and animals had no chance to
  find shelter". [verified] — the same source.

  **This node does not assert that this was a separate tornado.** The paper says "apparently", an
  hour of separation and a different bearing are consistent with two storms and with one storm's
  second touchdown, and the federal file records one track that ends where this account's damage
  begins. What is established is that a second damaging wind crossed this county's north on the
  evening of 19 July 1950 and is in no dataset the corpus holds. See
  [an instrument dates it and a witness describes it](../../decisions/an-instrument-dates-it-and-a-witness-describes-it.yml).

  [open] Whether Hancock County's row in the same federal file carries it. The corpus filtered the
  storm database to Allen County and has not asked the counties around it what they hold for that
  evening.
