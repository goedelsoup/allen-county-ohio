class: event
label: Davis v. Watkins, 1973–1980
description: |
  **A federal class action on behalf of everyone confined in Allen County's state hospital, brought
  in 1973 and decided in three published opinions over six years.** All three are the United States
  District Court for the Northern District of Ohio on docket C 73-205 before Judge Walinski, and the
  defendant's name changes each time because the superintendent did: *Davis v. Watkins*,
  384 F. Supp. 1196 (9 September 1974); *Davis v. Balson*, 461 F. Supp. 842 (28 September 1978);
  *Davis v. Hubbard*, 506 F. Supp. 915 (16 September 1980). [verified] —
  [the Caselaw Access Project](../../catalog/caselaw-access-project.md), the three opinions.

  **The class is everyone committed to [the hospital](../site/lima-state-hospital.yml) on or after
  23 May 1973.** The suit was brought under 42 U.S.C. § 1983 for deprivations of rights under the
  First, Fifth, Sixth, Eighth, Thirteenth and Fourteenth Amendments, and it sought the
  right to treatment — which, the 1974 order records, the defendants admitted existed and asked the
  court to define. [verified] — same source, 384 F. Supp. 1196 and 461 F. Supp. 842.

  **The Civil Rights Division of the United States Department of Justice appeared in it.** The
  reported counsel are attorneys from Toledo and from A.B.L.E. for the plaintiffs, the Ohio Attorney
  General for the defendants, and the Assistant Attorney General and two attorneys of the Civil
  Rights Division for the United States. [verified] —
  [CourtListener](../../catalog/courtlistener.md), the reported appearances.

  **The first opinion is a remedy and it says whose.** It states that the court "agrees almost
  totally with the reasoning" of *Wyatt v. Stickney* and that "many of these paragraphs have been
  excerpted verbatim from that opinion" — an Alabama case about Alabama institutions. Its
  requirements are therefore a standard and not a description of this place. [verified] — same
  source, 384 F. Supp. 1196; see
  [a remedy is not a finding](../../decisions/a-remedy-is-not-a-finding.yml).

  **What it required.** Eighty square feet per patient in a shared room, one toilet for every six
  patients and one shower for every eight, forty square feet of dayroom and ten of dining room per
  patient, linen changed at least every seven days, a physician on call at all times, no censorship
  of books or newspapers, unmonitored telephone calls, and a prohibition on "repetitive,
  nonfunctional, degrading, and unnecessary tasks (so-called 'make work') such as buffing a waxed
  floor that has already been sufficiently buffed, polishing brass, or shining employees' shoes."
  [verified] — the same source. Every patient then held was to be evaluated by a three-person team
  beginning 15 September 1974, and released, transferred or retained on the team's finding.
  [verified] — same source.

  **What the later opinions found, which is the part that is about this county.** The hospital held
  1,295 patients in March 1971, 783 on 31 August 1973 and 761 that November, and slightly over 400
  by 1980; 73 per cent of them were on a psychotropic drug and 85 per cent were able to decide
  rationally whether to consent to one. [verified] — the same source, 461 F. Supp. 842 and
  506 F. Supp. 915.

      patients                1,295 in March 1971
                                783 on 31 August 1973
                                761 in November 1973
                                slightly over 400 in 1980
      buildings               the old building, 24 wards and 1,010 rooms
                              the Ascherman unit, completed 1952, 4 wards and 276 rooms
      rooms                   6 by 9 feet in the old building, 7 by 11 in the Ascherman
      perimeter               a 13-foot chain link fence topped with barbed wire,
                                7 guard towers manned round the clock
      medication              73 per cent of patients on a psychotropic drug, the usual
                                dose twice-daily thorazine, stelazine and artane
      capacity to refuse      85 per cent able to decide rationally whether to consent,
                                and generally not given the opportunity
      composition             44.8 per cent Black at the time of the stipulations

  **The court declined the plaintiffs' central demand on space and granted the one on medication.**
  It found no judicial precedent for a hundred square feet as a constitutional minimum and refused
  to order new construction, noting the reduced population; and it held that patients had a
  constitutional right to refuse psychotropic medication. [verified] — same source,
  506 F. Supp. 915.

  **A room of six feet by nine is fifty-four square feet, and the order six years earlier had
  required eighty.** The corpus states both because neither alone is the measurement. [inference] —
  computed here; see [a remedy is not a finding](../../decisions/a-remedy-is-not-a-finding.yml).

  **The composition finding lands on something this corpus had already inferred and could not
  show.** The Lima State Hospital node read the 1940 census's race and sex ratios in Bath Township
  — 260 Black residents running 204 men to 56 — as describing a committed population rather than a
  settled one. A stipulated fact from 1980 puts the institution at 44.8 per cent Black in a county
  that was nothing like it. [verified] — the same source, against
  [the county by race](../measure/allen-county-population-by-race-1930-1960.yml). Forty years
  separate the two and neither is evidence for the other; they are two observations of the same
  arrangement. [inference]

  [open] What happened after 1980. The docket ran on — the 1980 opinion orders a compliance plan to
  the Special Master by 1 December 1980 — and no further opinion in this case is published in the
  Federal Supplement.
