class: event
label: Removal of the Ottawa from the Auglaize and Ottawa river reserves
description: |
  The removal of the Ottawa from their reserved lands in and near this county to territory
  west of the Mississippi, following further cession in the early 1830s. [inference]

  It is seeded because the county's civil geography preserves this history in its names —
  [Shawnee Township](../place/shawnee-township.yml), the
  [Ottawa River](../natural-feature/ottawa-river.yml) — while the corpus would otherwise
  contain no node for the people those names refer to or for what happened to them. A place
  named for a nation that was removed is a fact about the removal as much as about the place.

  [open] Nearly everything specific here is unverified: the dates, which bands, the terms of
  the cession, the route, and how much of the reserved land lay within what is now Allen
  County. This node is deliberately thin rather than absent — the alternative was a corpus
  whose account of the county begins with the survey, which would be a claim in itself.
properties:
  occurred: "1832"
  event_type: removal
links:
