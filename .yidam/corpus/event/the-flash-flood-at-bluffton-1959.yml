class: event
label: The flash flood at Bluffton, 21 January 1959
description: |
  **The rain that produced the Ottawa River's largest measured flow put four feet of water in a
  Bluffton lumber yard twenty miles north, on a different river.** [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 29 January 1959, its front-page
  account of "the Wednesday flash flood of last week"; see
  [the flood on the Ottawa](the-ottawa-river-flood-of-1959.yml). Big Riley Creek drains to the
  Blanchard and the Auglaize; the gauge that measured 7,740 cubic feet a second is on the Ottawa.
  One storm, two basins, and only one of them had an instrument in it.

  **Ice broke the village's water main.** "Ice and heavy logs racing down the Big Riley broke a
  water main at the Main street bridge", and a corroded valve near the bridge could not be turned,
  so the shut-off had to be made at the village building instead. Water was cut off from the
  hardware store north to the corporation line and east to Vance Street, and was not restored until
  noon on Sunday; north of the bridge, residents were still without water on Tuesday. [verified] —
  the same source.

  **The ice was six to eight inches thick and struck the bridges "with the impact of trucks".**
  [verified] — the same source, which believes that is what broke the main. At the golf course
  every bridge stood although all of them were "completely covered by flood water and ice packs".
  [verified]

  **Twelve houses were pumped out on two streets, in near-zero weather.** Bluffton firemen, the
  waterworks crew and the village service crew worked Wednesday night "pumping out basements of 12
  homes on Cherry and Railroad streets so that furnace fires could be started in the near zero
  weather that followed the flood", and one woman was carried out of her Cherry Street house on a
  chair. [verified] — the
  same source. A week later the village council agreed to make no charge for the pumping, waiving
  the $10 it ordinarily asked. [verified]

  **The businesses on the water are named and the public works came through.** Water covered the
  display room and offices of the lumber company and stood "nearly four feet deep" in its yard;
  a new builders' supply building on Vance Street was invaded and cement in bags damaged; a lunch
  room closed for several days for want of water and a restaurant hauled its own. The municipal
  swimming pool was under water and "Buckeye quarry and Big Riley were at one level", and officials
  reported no damage to the pool's filtration plant or to the sewage disposal plant. [verified] —
  the same source.

  **The date is the day before the gauge peaked, and the paper dates it three ways.** "The January
  21 inundation" on 5 February, "the January 20-21 flood" on 12 February, "the first flood occurred
  January 20" on 26 February, "the January 21 flood" on 19 March. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), four later issues. This node had
  inferred the 21st from "last Wednesday" against an issue of Thursday the 29th, and the inference
  holds — but a single witness supplied three dates for one night across five weeks; see
  [three witnesses and three dates](../../decisions/three-witnesses-and-three-dates.yml). The
  Ottawa's peak at Allentown is dated the 22nd and the Lima station's two-day rainfall is 1.84
  inches on the 21st and 1.20 on the 22nd. [verified] — [USGS](../../catalog/usgs-nwis.md) and
  [GHCN-Daily](../../catalog/ghcn-daily-lima.md). A small creek rises and falls inside a day and a
  river gauged sixteen miles downstream does not.

  **Three to four inches of snow, and it took a newspaper to say so.** "The flood, which struck
  suddenly after a warm rain melted three to four inches of snow Wednesday morning". [verified] —
  the same page. Lima's snowfall and snow-depth columns read zero through that whole January, a
  column of zeros standing in for blanks; see
  [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml). The witness supplies what the
  instrument deleted, and the federal study's "rain on snow and frozen ground" now has a depth.

  **The quarry took a hundred and fifty million gallons and forty days.** Big Riley filled the
  eighteen-acre Bluffton Stone pit "to its full 28 foot depth", needing "over 40 days and nights of
  steady pumpage", and it had "been thus filled by water only once before, in 1946". [verified] —
  the same page. This corpus read [1947](the-flood-of-6-june-1947.yml) as two-thirds full and
  [1946](the-flood-of-16-june-1946.yml) as full, from those years' own papers; a witness thirteen
  years later draws the same line.

  **A week later the paper withdrew part of the account this node is built from** — a printed
  correction that flood water "did not at any time enter Meadowbrook Lanes, Pandora. as was
  erroneously reported in The Bluffton News of January 29". [verified] — 5 February, page three.
  The withdrawn claim never entered this corpus and nothing in the method would have caught it; see
  [a retraction is never in the issue it corrects](../../decisions/a-retraction-is-never-in-the-issue-it-corrects.yml).

  **The village weekly is where this flood's county-scale record turns out to be.** County engineer
  Thomas Monahan said damage to "Allen county roads and bridges in the January flood" could not be
  known until spring, ice-supported pavement being liable to break at the thaw and "many of the
  abutments still under water". The Allen County Red Cross "disbursed a total of $526.95 to victims
  of the January 21 flood" **in Lima**. A federal supervisor put the seven-county wheat loss after
  the midwinter floods at $250,000, and Richland township withheld road funds against thaw damage
  from "the floods which swept the township twice in three weeks". [verified] — 5 February p13,
  19 March p11 and p1, 9 April p3.

  **The verdict against 1913 hardened over eleven months and no evidence.** 29 January ran
  "Wednesday Flood Approaches 1913 Grandaddy of Them All"; 5 February, page thirteen, hedged —
  "Extremely high water flooded the Bluffton area last week probably the highest since 1913. A
  large log floated across the road at the Feyrman bridge north of town"; and the year-end review
  of 31 December went flat, Riley creek waters at "their highest level since 1913". [verified] —
  three issues. It is the fifth flood in twenty years this paper measures against 1913 and the only
  one where it ever said "probably"; see
  [a worst-since is not a ranking](../../decisions/a-worst-since-is-not-a-ranking.yml).

  **This node does not establish what the Ottawa River did.** Bluffton is on Riley Creek in another
  watershed, and everything above is the same weather in a different place. What happened in Lima
  and along the Ottawa on those two days is still not held here.

  [open] What happened in Lima. The corpus can now name a county engineer, a Red Cross disbursement
  and a seven-county crop loss, so this node's earlier statement that the paper "reports its own
  village" was too strong; what remains missing is the city itself. $526.95 of relief and 125
  evacuees is all anybody recorded for a place of fifty thousand.
properties:
  occurred: 1959-01-21
  event_type: flood
  location_description: |
    Bluffton village and Big Riley Creek, in the north of the county. The account names streets, a
    bridge, a quarry, a golf course and four businesses, and gives no gauge reading and no measured
    stage. [verified] — the same source. In the weeks after, Allen County's roads and bridges,
    Richland township's road beds and Lima. [verified] — the same paper to 9 April 1959.
