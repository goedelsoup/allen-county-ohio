class: event
label: The Ottawa River flood of January 22, 1959
description: |
  **The largest flow ever measured on the Ottawa River: 7,740 cubic feet a second at Allentown on
  22 January 1959, at a gauge height of 10.88 feet.** [verified] —
  [USGS peak streamflow](../../catalog/usgs-nwis.md), site 04187500. It is more than twice that
  gauge's median annual peak of 3,240 across fifty-two water years, and nineteen per cent above the
  next largest. [verified] — same source, computed here; see
  [the peak flows](../measure/ottawa-river-peak-flows-1924-2025.yml).

  **This node was written as a flow and it is now a flood.** A discharge figure says how much water
  passed the gauge and nothing about what the water reached, and for a year nothing here said what
  this one reached. Two federal reports do. **"Lima had 125 evacuees."** [verified] —
  [USGS Circular 418](../../catalog/usgs-ohio-flood-reports.md), its Maumee basin section, which
  also puts ice in the streams at "as much as 18 inches thick" and January damage across the basin
  at "approximately $3 million".

  **And the county's flood insurance study describes the reach.** The river was out of its banks
  "between Schoonover Park and Thayer Road"; rain fell "on snow and frozen ground"; "an ice jam
  occurred at the Rousch Road Bridge aggravating already dangerous conditions"; and in the night the
  water "spilled over the dike portion of track", an estimated "3,000 to 5,000 acre-feet" leaving
  the channel at the break. [verified] —
  [the flood insurance study](../../catalog/fema-flood-insurance-study.md), section 2.3.

  **Which makes 7,740 cubic feet a second a lower bound on what reached Lima.** The study's next
  sentence is "As a result, the river never reached a very high crest below the quarry", and the
  Allentown gauge is six miles below the city. **The largest flow ever measured on this river was
  measured downstream of the place the water left it.** [inference] — the same source against
  [USGS](../../catalog/usgs-nwis.md).

  **A second flood followed in three weeks and the annual series cannot show it.** The Ottawa at
  Allentown reached 5,150 cubic feet a second on 10 February 1959 — a flow that would stand sixth in
  the gauge's whole record — and because both fall in water year 1959 the peak file publishes only
  the larger. [verified] —
  [USGS Water-Supply Paper 1750-A](../../catalog/usgs-ohio-flood-reports.md), station 294.

  **The month is not extraordinary and the two days are.** January 1959 gave the county 4.43 inches
  against a January mean of 2.38 — twelfth wettest of a hundred and thirty-one. The Lima station
  recorded 1.84 inches on the 21st and 1.20 on the 22nd: **3.04 inches in forty-eight hours, sixty-two
  per cent of the month**, with the 21st reaching 56 °F onto ground that had not been above freezing
  on eight of the preceding fourteen days. [verified] —
  [the county's precipitation](../measure/allen-county-precipitation-1895-2025.yml) and
  [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551.

  **A reading this node published is corrected.** It said a month of ordinary rank pointed at snow or
  frozen ground rather than rain. Both were true, and the study says so in as many words. See
  [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml).

  **The one newspaper of that week is in the wrong basin.** The Bluffton News of 29 January carries a
  front-page account of "the Wednesday flash flood of last week" — ice breaking a water main, four
  feet of water in a lumber yard, twelve houses pumped out in near-zero weather. [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md); see
  [the flood at Bluffton](the-flash-flood-at-bluffton-1959.yml). Bluffton is twenty miles north on
  Big Riley Creek, which drains to the Blanchard. The same storm, and not the same water. **A second
  sentence is corrected**: this node said no newspaper here reaches 1959. One does, and what it does
  not do is report Lima. See
  [an instrument dates it and a witness describes it](../../decisions/an-instrument-dates-it-and-a-witness-describes-it.yml).

  [open] What it cost, and whom. A hundred and twenty-five evacuees is the only figure anybody
  recorded for Lima; no damage total, no count of buildings and no list of streets survives where
  this corpus can reach, and none of Lima's sixty-six newspaper titles is digitized.
properties:
  occurred: 1959-01-22
  event_type: flood
  location_description: |
    The Ottawa River through Lima — the reach between Schoonover Park and Thayer Road, the stone
    quarry, and the Rousch Road bridge — and the gauge at Allentown six miles below the city, which
    measured what the channel still carried after the break. [verified] —
    [the flood insurance study](../../catalog/fema-flood-insurance-study.md) and
    [USGS](../../catalog/usgs-nwis.md).
