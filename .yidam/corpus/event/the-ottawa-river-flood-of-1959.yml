class: event
label: The Ottawa River flood of January 22, 1959
description: |
  **The largest flow ever measured on the Ottawa River: 7,740 cubic feet a second at Allentown on
  22 January 1959, at a gauge height of 10.88 feet.** [verified] —
  [USGS peak streamflow](../../catalog/usgs-nwis.md), site 04187500.

  **It is more than twice the median annual peak** of 3,240 cubic feet a second across that gauge's
  fifty-two water years, and it stands nineteen per cent above the next largest, 6,160 in March
  1939. [verified] — same source, computed here; see
  [the peak flows](../measure/ottawa-river-peak-flows-1924-2025.yml).

  **It sits in one of the corpus's two remaining holes in the record of what happened here.** The
  spine had nothing between 1955 and 1965 until this phase, and this is a dated thing in the middle
  of it — established by an instrument rather than by anybody's account. [inference] — see
  [a dataset can make an event](../../decisions/a-dataset-can-make-an-event.yml).

  **It is a flow and not a flood, and the corpus is careful about the difference.** A discharge
  figure says how much water passed the gauge and nothing about what the water reached. Whether
  this one left the banks, what it covered, and whether anyone was harmed are not in this source and
  are not in any source held here — there was no federal disaster declaration for Allen County that
  year, and the county's first is six years later. [verified] —
  [the declarations](../measure/allen-county-disaster-declarations-1965-2020.yml).

  **The weather that produced it is now on the record, and the month is not extraordinary.**
  January 1959 gave Allen County 4.43 inches of precipitation against a January mean of 2.38 — the
  twelfth wettest January of a hundred and thirty-one, not the first, and 1959 as a whole ranks
  twenty-seventh of the county's wet years at 40.48 inches. [verified] —
  [the county's precipitation](../measure/allen-county-precipitation-1895-2025.yml).

  **The two days are.** The Lima station recorded 1.84 inches of precipitation on 21 January 1959
  and 1.20 on the 22nd — **3.04 inches in forty-eight hours, sixty-two per cent of everything that
  fell in the month**, and the 21st reached 56 °F. [verified] —
  [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551. The gauge peaked on the
  second of those days. [inference]

  **It fell on frozen ground.** The maximum temperature was 15 °F on 17 January and 15 °F again on
  the 18th, with a minimum of −2 °F, and had not been above 32 °F on eight of the preceding
  fourteen days. [verified] — same source. Two inches of warm rain in a day, onto ground that had
  been below freezing for a week, is the ordinary mechanism of a January flood. [inference]

  **A reading this node published is corrected.** It said a month of ordinary rank pointed at snow
  or frozen ground rather than rain. The ground was frozen and the rain was extraordinary: the
  monthly total was concealing a two-day event, which is what a monthly total does. Snowfall was
  not reported at this station that January and remains unmeasured. [verified] — same source; see
  [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml).

  [open] What the river did to the county that January, and to Lima in particular. A newspaper of
  that week is the obvious source and this catalog holds none that reaches 1959.
properties:
  occurred: 1959-01-22
  event_type: flood
  location_description: |
    Measured at the Ottawa River gauge at Allentown, downstream of Lima, draining 160 square miles.
    The measurement is of one point on the river; the extent of the event is not established here,
    which is why the edge below points at the county and not at
    [the river](../natural-feature/ottawa-river.yml). [verified] — the same source.
