class: event
label: The organization of Cairo, 1875
description: |
  **Cairo Village was organized on 12 April 1875, on the authority of the county commissioners and
  the petition of forty-one named citizens.** [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), which print the same
  date and the same petition.

  **Dr. J. S. Clippinger was its first mayor**, in 1875; Thomas H. Waltz followed in 1877 and
  David Hartzog in 1879, who was re-elected in 1881 and resigned in October of that year to remove
  to Kansas. Robert E. Davis filled the unexpired term, was re-elected in April 1883, and was mayor
  when the 1885 book went to press. [verified] — the 1885 history.

  **The petition is the largest list of a founding act's participants this corpus holds.**
  Forty-one men signed for it, against one petitioner named for Lafayette in 1867. [verified] —
  same source, counted here; see
  [the village of Lafayette](../jurisdiction/village-of-lafayette.yml).

  **It corporated twenty-seven years after it was platted, and under a different name from the
  ground.** [West Cairo](../place/cairo.yml) was laid out in 1848 by Jacob Miller; the corporation
  of 1875 is *Cairo Village*, and the 1921 history was still calling the incorporated place West
  Cairo in 1920, with 380 people. [verified] — the 1885 and 1921 histories. **A place and the
  corporation over it can carry different names for seventy years.** [inference]

  **It gives the corpus a third witness for a date it held on one.** The date was already recorded
  from the 1921 history, which the corpus noted as "a single witness read once". It is now three,
  from three books, with a mechanism and a first mayor. [verified] — the three histories.

  [open] What the village had in 1875 that it lacked in 1848. The 1921 history says only that it
  "lay dormant awaiting developments".
properties:
  occurred: "1875-04-12"
  event_type: incorporation
  location_description: |
    Cairo, on Sections 29, 30, 31 and 32 of [Monroe Township](../place/monroe-township.yml), west of
    the Perrysburg Road at its crossing with the Bucyrus Road. [verified] — the 1885 history.
