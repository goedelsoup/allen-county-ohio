class: event
label: The Wood party reaches Sugar Creek, April 1824
description: |
  **Four men cut a road twenty-four miles to get here, and it took them sixteen days.** Early in
  April 1824 Christopher Wood, his sons Joseph and Albert G. and his son-in-law Benjamin Dolph left
  Bellefontaine for land they had already entered at the Piqua land office. From Logan County they
  passed a man named Stewart, "who had married an Indian wife", left the borders of the white
  settlements, and cut a road to Wapakonetta, camping in the woods. From Shawnee Town — "now
  Hovers, in Shawnee Township" — they cut a path and reached their land on
  [Sugar Creek](../natural-feature/sugar-creek.yml) after two more days' hard work. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), Bath Township, quoting
  "the original biography of Christopher Wood".

  **They did not stay.** Cabins were raised, land cleared and a crop planted; then the party went
  back to Champaign County and **moved their families out in the fall**. [verified] — the same
  passage. The pioneer list dates the settlement of Bath Township to April 1824 and the households
  arrived six months later, which are two different facts under one year. [inference]

  **The account says they found no civilization and describes three settlements in the same
  breath.** "In all this distance, except at Stewarts, they found not a trace of civilization" is
  followed, within four sentences, by the Indian town of Wapakonetta, by Shawnee Town where the
  chief "Pht" lived in a cabin with **about twenty acres of cleared land in good culture**, and by
  the seed corn and potatoes the party bought there. [verified] — the same passage, both scans
  agreeing word for word. What the sentence means is that they passed no white settlement; what it
  says is broader, and the paragraph refutes it without noticing. [inference] See
  [read a word in its source register](../../decisions/read-a-word-in-its-source-register.yml).

  **And the cabins were raised with Shawnee and Wyandot help.** "They were at once visited by
  Wyandots, who assisted them in the erection of their cabins," and the seed that went into the
  first crop was bought from the chief at Shawnee Town. [verified] — the same passage. The
  wilderness the party recorded crossing was farmed ground with owners, and the first winter here
  depended on them. [inference]

  **The two scans disagree by one digit and the sentence decides it.** Scan A gives "about the 16th
  of April, 1824" and scan B "about the 10th". [verified] — the two digitizations at the same line.
  The party left Bellefontaine "early in this month" and were "sixteen days in the wilderness, since
  quitting Logan County", which puts the arrival on about the 17th and makes the 10th require a
  departure in March. This node reads the 16th. [inference] — see
  [two scans of one book](../../decisions/two-scans-of-one-book.yml), whose rule this is the first
  case to reach by its second clause.

  **This is not one of the book's paid sketches, and the test is the page and the date.** The passage
  sits at pages 417–418 and 475–476, in the narrative half, and the biographical sketches this
  corpus treats as bought content begin at 561; Wood died in 1856, twenty-nine years before
  publication, so he could not have been a subscriber. What the book quotes is "the original
  biography of Christopher Wood", a document it is reproducing rather than selling. [verified] — the
  running heads and the sketch pagination; see
  [what a paid sketch may be quoted for](../../decisions/what-a-paid-sketch-may-be-quoted-for.yml).
  The earlier document is itself unheld and unnamed, which is why the colour in it — Boone, Girty,
  "the notorious", "that marvel of adventurers" — is left where it is. [inference]

  [open] Which quarter-section they landed on. The book puts the party on Sugar Creek in April 1824
  and records Wood's own land entry as section 7 of Bath in 1828 — four years later — so the ground
  they built the first cabins on is either an entry in another name or an occupation before purchase,
  and the tract books at the Piqua district would say which.
properties:
  occurred: 1824-04-16
  event_type: settlement
  location_description: |
    Sugar Creek, in what became Bath Township. The party's route ran from Bellefontaine in Logan
    County through Wapakonetta and Shawnee Town. `occurred` is scan A's date, which the passage's
    own arithmetic supports against scan B's 10th. [inference]
