class: event
label: The flood of 9–10 February 1959
description: |
  **The second flash flood in three weeks, and the one the gauge record calls the year's largest.**
  "With clean-up work from the flood of just three weeks ago not entirely completed, Bluffton and
  surrounding area was hit by another flash flood of Big and Little Riley creeks Monday night and
  Tuesday morning when 3.13 inches of rainfall fell within the span of approximately nine hours."
  [verified] — [The Bluffton News](../../catalog/chronicling-america.md), 12 February 1959, page
  one, headed "Second Flash Flood Hits Bluffton In Three Weeks As Riley Creeks Overflow". The
  village measured itself against its own three-week-old flood: the water stood "approximately 10
  inches under the crest reached in the January 20-21 flood". [verified] — the same page. That is a
  comparison in inches rather than a superlative, and it is the only one this corpus holds between
  two Bluffton floods in one winter; see
  [a worst-since is not a ranking](../../decisions/a-worst-since-is-not-a-ranking.yml).

  **The Blanchard's largest peak of the water year is this flood, not January's.** 12,100 cubic feet
  a second at 16.76 feet on 11 February 1959, **fourth largest of ninety-nine water years** at
  Findlay. [verified] — [USGS peak streamflow](../../catalog/usgs-nwis.md), site 04189000. The
  county's own river answered smaller: the Ottawa at Allentown ran a daily mean of 3,730 cfs on the
  10th against 5,870 on 22 January, and its annual peak stayed in January. [verified] — the same
  source's daily values, sites 04187500 and 04189000, 15 January to 20 February 1959.

  **And the two files disagree about which month the Blanchard's flood was.** Its largest *daily
  mean* of 1959 is **11,600 cfs on 22 January**; its largest *instantaneous* reading is **12,100 on
  11 February**, and the 10th and 11th ran daily means of 8,930 and 10,300. [verified] — the same
  daily series. January was a broad crest a day could hold and February a spike a day could not:
  11,600 mean under an instantaneous that never reached 12,100, against 10,300 mean under a peak of
  12,100. Neither is wrong and they answer different questions, which is why this corpus holds both
  months rather than choosing. [inference]

  **Rain: two figures twenty miles apart, and both are the storm.** The paper's 3.13 inches in nine
  hours is Bluffton's own; Lima recorded **2.34 inches on 10 February**, the largest single day of
  either 1959 flood at that station — January's two days were 1.84 and 1.20. [verified] —
  [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551. The gap is what a storm
  centred to the north looks like from the county seat.

  **What it did.** The Bluffton Stone quarry had been pumped down to about thirteen feet from the
  bottom and "by Tuesday morning the quarry was full again with from 28 to 30 feet of muddy storm
  water" — the third time this corpus has watched that quarry fill, after
  [June 1947](the-flood-of-6-june-1947.yml). About 200 feet of ballast on the A.C.&Y. railroad
  washed out at Dutch run by the municipal swimming pool, where the water was higher than in
  January, and trains were held all Tuesday. Triplett Electrical Instrument's College avenue plant
  did not open; Bluffton College shut down classes with about ten inches in its heating plant's
  boiler room; schools closed; and at 6:10 Tuesday morning a short circuit set the village fire
  alarm off for a quarter of an hour. [verified] — the same page.

  **One thing in it is reported as a first.** "Reports were that a large number of residences on
  North Main street had several inches of water in their basements from overflowing storm sewers.
  This is the first time this condition has existed, oldtimers said." [verified] — the same page.
  North Main street is one of the four streets the water reached again in
  [April 2019](the-flood-at-bluffton-26-april-2019.yml), sixty years later.

  **The snow columns read zero through both floods and that is not evidence.** Lima's daily file
  records no snowfall and no snow depth on any day of January or February 1959, which for a
  northwest Ohio winter is a column of zeros standing in for blanks rather than a measurement.
  [verified] — the same station; see
  [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml). So this corpus cannot say what
  part either flood owed to melt.

  [open] What the January crest was as an instantaneous reading. The village put February ten inches
  below January and the peak file has February higher; the two are reconcilable, because a stage at
  Bluffton and a discharge at Findlay are different quantities in different places, and nothing here
  measures January's instantaneous peak on either the creek or the river.
