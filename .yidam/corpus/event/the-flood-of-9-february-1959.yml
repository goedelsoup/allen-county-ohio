class: event
label: The flood of 9–10 February 1959
description: |
  **The second flash flood in three weeks, and the one the gauge record calls the year's largest.**
  "Bluffton and surrounding area was hit by another flash flood of Big and Little Riley creeks
  Monday night and Tuesday morning when 3.13 inches of rainfall fell within the span of
  approximately nine hours." [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 12 February 1959, page one, with
  clean-up from January "not entirely completed". The village measured itself against it: the water
  "approximately 10 inches under the crest reached in the January 20-21 flood" — a comparison in
  inches rather than a superlative, and the only one this corpus holds between two Bluffton floods
  in one winter. [verified]; see
  [a worst-since is not a ranking](../../decisions/a-worst-since-is-not-a-ranking.yml).

  **The Blanchard's largest peak of the water year is this flood, not January's.** 12,100 cubic feet
  a second at 16.76 feet on 11 February 1959, **fourth largest of ninety-nine water years** at
  Findlay. [verified] — [USGS peak streamflow](../../catalog/usgs-nwis.md), site 04189000. The
  county's own river answered smaller: the Ottawa at Allentown ran a daily mean of 3,730 cfs on the
  10th against 5,870 on 22 January, and its annual peak stayed in January. [verified] — the same
  source's daily values, both sites, 15 January to 20 February 1959.

  **And the two files disagree about which month the Blanchard's flood was.** Its largest *daily
  mean* of 1959 is **11,600 cfs on 22 January**; its largest *instantaneous* reading is **12,100 on
  11 February**, and the 10th and 11th ran daily means of 8,930 and 10,300. [verified] — the same
  daily series. January was a broad crest a day could hold and February a spike a day could not.
  Neither is wrong and they answer different questions, which is why this corpus holds both months
  rather than choosing. [inference]

  **Rain: two figures twenty miles apart, and both are the storm.** The paper's 3.13 inches in nine
  hours is Bluffton's own; Lima recorded **2.34 inches on 10 February**, the largest single day of
  either winter flood there against January's 1.84 and 1.20. [verified] —
  [GHCN-Daily](../../catalog/ghcn-daily-lima.md), USC00334551.

  **What it did.** The quarry, pumped down to about thirteen feet from the bottom, "was full again
  with from 28 to 30 feet of muddy storm water" by Tuesday morning — the third fill this corpus has
  watched, after [June 1947](the-flood-of-6-june-1947.yml). About 200 feet of A.C.&Y. ballast
  washed out at Dutch run, where the water was higher than in January; Triplett did not open,
  Bluffton College shut classes with ten inches in its boiler room, schools closed. [verified]

  **One thing in it is reported as a first.** "Reports were that a large number of residences on
  North Main street had several inches of water in their basements from overflowing storm sewers.
  This is the first time this condition has existed, oldtimers said." [verified] — the same page.
  North Main street is one of the four the water reached again in
  [April 2019](the-flood-at-bluffton-26-april-2019.yml), sixty years later.

  **The snow columns read zero through both floods and a newspaper answered for one of them.**
  Lima's file records no snowfall and no snow depth on any day of January or February 1959, a
  column of zeros standing in for blanks; see
  [a zero is not a blank](../../decisions/a-zero-is-not-a-blank.yml). January's paper says a warm
  rain "melted three to four inches of snow"; **this** flood's says nothing of snow, and what
  February owed to melt is still unsaid. [verified] — the same station.

  **The two floods cost the village its sewers and bought the quarry a dike.** The street
  commissioner told council that "recent flash floods which taxed the village sewer system beyond
  capacity has left the ancient network with no less than 27 caveins"; the stone company, "still
  cleaning up after two flash floods filled the quarry with water twice within a threeweek period",
  began a dike along the pit's south and east edges, four pumps running day and night. [verified] —
  the same paper, 26 February, page one. Those sewers backed up again in September; see
  [the cloudburst of 1 September](the-cloudburst-of-1-september-1959.yml).

  [open] What the January crest was as an instantaneous reading. The village put February ten inches
  below January and the peak file has February higher; the two are reconcilable, because a stage at
  Bluffton and a discharge at Findlay are different quantities in different places, and nothing here
  measures January's instantaneous peak on either the creek or the river.
