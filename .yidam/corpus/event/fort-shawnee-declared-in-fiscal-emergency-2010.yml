class: event
label: Fort Shawnee declared in fiscal emergency, 16 September 2010
description: |
  **On 16 September 2010 the Auditor of State declared that a fiscal emergency existed at the
  Village of Fort Shawnee.** [verified] —
  [the fiscal emergency analysis](../../catalog/ohio-auditor-of-state-audit-search.md), certified
  that day and filed with the village's mayor, its director of finance, the president pro tempore of
  its council, the Treasurer, Secretary of State and Governor of Ohio, the Director of Budget and
  Management, and the secretary of the Allen County Budget Commission.

  **The village asked for it.** The analysis was performed at the request of Mayor Dennis Shaffer
  under Sections 118.021 and 118.04(A) of the Revised Code, to determine whether the village's
  condition justified a declaration of fiscal watch or of fiscal emergency. [verified] — the same
  source. It is not something that happened to the village; it is the answer to a question the
  village put.

  **Three of the six statutory conditions were met, and the sums are small.** The unprovided portion
  of the aggregate deficit was $70,778 at 31 December 2009 and $50,761 at 31 May 2010; the treasury
  was short of its own funds by $5,075 and then $18,211; the general fund's accounts payable more
  than thirty days past due came to $761. [verified] — the same source, Schedules I to VI. One-sixth
  of the general fund budget, which is the threshold every test is measured against, was $53,372.

      fund, at 31 May 2010                      balance
      Street Construction                      $214,273
      Water Contract                             19,948
      Mayors Court Computer                      16,323
      State Reparations                          16,616
      General                                    31,692
      Permissive Motor Vehicle                  (81,468)
      Contract Police                           (54,657)
      Street Improvement Levy                   (11,636)

  **The village had $164,982 in the bank and had promised $315,419 to its own funds.** That is the
  whole of the condition: no debt was outstanding, no payroll had been missed, and the treasury
  simply held less than the positive balances it was carrying. [verified] — the same source,
  Schedule VI. See
  [a declaration is a ratio not a sum](../../decisions/a-declaration-is-a-ratio-not-a-sum.yml).

  **Twenty-five months later its electors surrendered the corporation.** On 6 November 2012 Fort
  Shawnee voted 1,058 to 858 to give up its corporate powers. [verified] —
  [the Secretary of State's report of miscellaneous questions](../../catalog/ohio-sos-local-issue-reports.md);
  see [what happened to the village](../question/what-happened-to-the-village-of-fort-shawnee.yml).

  **This corpus cannot say whether the emergency caused the surrender.** The two are the right
  distance apart for it and nothing read here connects them: no petition, no council resolution, no
  campaign and no argument from either side is held, and a village may be dissolved for reasons that
  have nothing to do with its books.

  [open] What the financial planning and supervision commission did. A declaration under Chapter 118
  puts a state commission over the village's finances until the conditions are corrected, and the
  corpus holds no record of that commission, its membership, its plan or its termination — and the
  audit search carries no termination report for Fort Shawnee at all.
