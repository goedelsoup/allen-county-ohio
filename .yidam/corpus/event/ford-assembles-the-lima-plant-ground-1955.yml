class: event
label: The assembly of the Ford Lima engine plant's ground
description: |
  Between 24 August 1955 and 17 August 1956, Ford Motor Company took the ground its Lima engine
  plant stands on, in five conveyances, all of them recorded in the Recorder's tract abstract for
  the north-west quarter of section 17, township 3 south, range 7 east. [verified] —
  [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md), volume 0028A
  pages 163–166; see [the plant](../site/ford-lima-engine-plant.yml).

  **It is the corpus's first dated event since 1933.** The history this corpus can put a day on
  ran 1818, 1820, 1832, 1848, 1885, 1918, 1933 and then stopped, which the site has been saying in
  those words. This is the first thing to fill that end of it, and it arrived from a land record
  rather than from a newspaper. [verified] — the corpus's own event nodes.

  **Ford did not buy this ground in its own name first.** DTI Enterprises Inc bought from the
  National Lime & Stone Company on 2 June 1955 and from a private owner on 24 December 1955, and
  conveyed to Ford four times between August 1955 and August 1956; a fifth parcel came to Ford
  directly from two individuals in January 1956. [verified] — same pages.

  A company acquiring adjacent parcels over eighteen months and passing them to one manufacturer
  is the ordinary shape of a site assembly, in which the assembler exists so that the buyer's name
  does not appear and the price does not move. [inference]

  Whether DTI Enterprises was Ford's agent, and whether it is connected to the Detroit, Toledo &
  Ironton Railroad that held ground in this same quarter from 1924 to 1943, this corpus does not
  know. [open]

  **What it was before.** A quarry. National Quarries Company held it from 1917, conveyed to the
  National Lime & Stone Company in January 1944, and it was National Lime & Stone that sold to the
  assembler in 1955. [verified] — same pages.

  **What followed, on the same ground.** A mechanic's lien for $91,546.07 was filed against Ford
  Motor Company by Carlson Manufacturing Inc on 30 September 1957 — a claim for work done, and so
  the first dated evidence this corpus holds that the plant was being built. [verified] — same
  pages.

  This node does not establish when the plant opened or when it first made an engine. A lien dates
  construction and a deed dates a purchase, and neither is a ribbon. [open]

  It covers one quarter section. The plant's parcel runs the whole west half of section 17 and
  crosses into the south-west quarter, whose sheets have not been read, so five conveyances is
  what this quarter records and not necessarily what Ford bought. [open]
