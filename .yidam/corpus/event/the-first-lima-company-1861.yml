class: event
label: The raising of the first Lima company
description: |
  Eight days between the news of Fort Sumter reaching Lima and the county's first company being
  inducted into United States service — ninety-two men, rank and file. [verified] —
  [the 1921 history](../../catalog/rusler-allen-county-1921.md).

      Sun 14 Apr   the news reaches Lima; a flag between Ashton Hall and the courthouse;
                   the congregations gather; Rev. T. P. Johnson and Martin Armstrong speak
                   from a store box, and men come forward under Capt. M. H. Nichols
      Mon 15 Apr   Lincoln calls for 75,000 militia
      Tue 16 Apr   Charles N. Moyer, a printer at the Gazette and the first man to volunteer,
                   goes to Columbus
      Fri 19 Apr   the company is in readiness, ninety-two men rank and file
      Mon 22 Apr   it is inducted into the service

  The officers were M. H. Nichols captain, C. M. Hughes lieutenant, T. J. Hustler second lieutenant,
  J. A. Anderson sergeant, J. N. Cunningham second sergeant, William Bradley third, W. H. Ward
  fourth, and C. C. Oldfield, Milton Titus, J. B. Davison and Samuel McClure corporals. [verified] —
  same source.

  **The book dates the first day April 12 and calls it a Sunday, and it cannot be both.** April 12,
  1861 was a Friday; the Sunday of that week was the 14th, the day the garrison marched out of Fort
  Sumter and the day the wires would have carried it into northwestern Ohio. The corpus takes the
  weekday over the date, because the scene the book describes — congregations in church, a flag
  raised, a crowd on the way out — is a Sunday scene and the rest of the sequence is dated
  consistently around it. [inference] — computed here.

  **It happened at the second courthouse, not the one that stands.** The flag was strung between
  Ashton Hall and the courthouse, "in the days of the second Allen County courthouse on the site of
  the Cincinnati Block". [verified] — same source. The building on Main Street today is the third
  and opened in 1884; see [the courthouse](../site/allen-county-courthouse.yml).

  **This is the sixty hours, corrected.** Two of the three county histories say the county had men
  on the road to Washington within sixty hours; the phrase belongs to the First Ohio Volunteer
  Infantry, not to Allen County, and this sequence — from the same book that repeats it — is what
  actually happened. [inference] — see
  [what the county sent](../measure/allen-county-civil-war-service.yml).

  [open] What became of the company. Captain M. H. Nichols appears in the 1885 officers' roster with
  the 20th Ohio, April to August 1861, which is a three-month regiment and a plausible destination
  for a company raised in April; the corpus has not established that it is the same body of men.

  [open] Martin Armstrong's death, which the two books date one day apart. The 1885 roster has him
  killed at Pittsburg Landing on April 7, 1862; the 1921 history has him killed at Shiloh on April
  6. They are the same battle and the same man, and both days are days of it.
