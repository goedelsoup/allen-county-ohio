class: event
label: The naming and incorporation of Bluffton, 1861
description: |
  **On 17 August 1861 the town voted, in one ballot, both to incorporate and to stop being called
  Shannon.** "Ballot, on August 17, 1861, to incorporate the place and call it 'Bluffton.'
  J. S. Powell was elected first mayor, and E. H. Edsal, the first clerk." [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). The 1921 history gives
  the same date: "The matter of changing the name was voted on August 17, 1861, and the town was
  duly incorporated as Bluffton." [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **It is the only incorporation in this county the sources put to a vote of the people.** The other
  seven were granted by the county commissioners on a petition or passed as an act. [verified] —
  see [the incorporations](../measure/allen-county-municipal-incorporations-1842-1904.yml).

  **This closes a dangling qualifier the corpus has carried since the settlements phase.** The 1885
  history says the name "was changed to Bluffton in 1872-73, although long prior to this the latter
  name was bestowed upon it", and the corpus quoted that phrase without being able to say what
  "long prior" meant. It meant a ballot eleven years earlier. [inference] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md); see
  [the place](../place/bluffton.yml).

  **The two dates are reconcilable and describe different things.** The 1861 vote named the
  *corporation*; the 1885 book's 1872–73 is the *post office*, which had been Croghan and then
  Shannon and which the same book says was "again in 1873 named Bluffton". A town and its post
  office changed names twelve years apart. [inference] — the 1885 book, both scans.

  **Why the name existed to be voted on.** The post office could not be called Shannon because of
  another Shannon in Ohio, and Jacob Mosier, who had come from Bluffton, Indiana, proposed the name
  so that the town and the post office might match. [verified] — the 1921 history.

  [open] Which authority held the ballot, and under what statute. Neither book names it, and the
  1885 history — which prints a corporation section for Cairo, Beaverdam, Lafayette and Delphos —
  has none for Bluffton.
properties:
  occurred: "1861-08-17"
  event_type: incorporation
  location_description: |
    Bluffton, on Sections 1 and 12 of [Richland Township](../place/richland-township.yml), platted
