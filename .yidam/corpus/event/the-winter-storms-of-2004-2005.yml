class: event
label: The winter storms of December 2004 and January 2005
description: |
  **The broadest disaster in the county's federal record: twenty-two separate governments and
  bodies were paid for it, more than any other event before or since.** [verified] —
  [OpenFEMA assistance programs](../../catalog/openfema-assistance-programs.md), DR-1580; see
  [who was paid](../measure/allen-county-disaster-aid-applicants-2005-2025.yml).

  **It ran from 22 December 2004 to 1 February 2005** — forty-one days, and the forty-one days
  [the declarations](../measure/allen-county-disaster-declarations-1965-2020.yml) already named as
  the longest non-pandemic incident window this county has — and was declared on 15 February 2005 as
  "Severe Winter Storms, Flooding, and Mudslides". [verified] —
  [OpenFEMA](../../catalog/fema-disaster-declarations.md); see
  [the declarations](../measure/allen-county-disaster-declarations-1965-2020.yml).

  **The weather record holds two events inside that window and no more.** A winter storm on
  22 December 2004, the first day of the incident, and an ice storm on 5 January 2005. [verified] —
  [the storm record](../measure/allen-county-storm-events-1950-2026.yml).

  **What it cost was mostly branches.** Forty-one projects, $1,243,330 of federal money, and twenty
  of the forty-one are Debris Removal at $964,518 — seventy-eight cents in the dollar for clearing
  what the ice brought down. One project in the whole declaration is Roads and Bridges. [verified] —
  [the assistance](../measure/allen-county-disaster-assistance-2005-2025.yml).

  **It is why the corpus can name the county's local governments from a federal grant file.** Nine
  of the county's ten municipal corporations, eight of its twelve townships, the county, its
  commissioners, its engineer, a village fire department and a township of Auglaize County all
  filed for this one storm. [verified] — same source.

  **And it is the corpus's only dated event that is established by an accounting record rather than
  by an observation or a book.** The storm file records two days of weather; the grant file records
  forty-two days of consequence and twenty-two bodies clearing it. [inference] — see
  [a dataset can make an event](../../decisions/a-dataset-can-make-an-event.yml).

  [open] What the ice did. No narrative, no depth, no outage count, and the county's own account of
  the winter of 2004–05 is not in this catalog.
