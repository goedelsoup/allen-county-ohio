class: event
label: The flood of 16–19 June 1946
description: |
  **A flood the county's own river has no row for.** "Paced by a violent electrical storm
  accompanied by tomado-like [sic] winds and a near cloudburst which swept the Bluffton district
  Sunday night and early Monday morning, rains which continued Tuesday and Wednesday have inundated
  the Bluffton district with the heaviest downpours in recent years." [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 20 June 1946, page one, headed "FLOODS
  FOLLOW VIOLENT STORM — FIELDS INUNDATED". Many fields stood "under water for the past three days"
  and the lowlands along the creeks were "covered with the overflow of flood waters".

  **What it looked like from the street is in the gossip column and not the news story.** "Big Riley
  went on a wild rampage and flooded dozens of basements and turned Harmon field into a lake with
  dozens of barefooted kids enjoying a splash Monday morning when the writer went over Cherry street
  and College avenue — and one of the tables at Harmon field floated down stream to the Buck[eye]".
  [verified] — the same issue, page seven. The front page has the acreage and the columnist has the
  basements, which is the division of labour this paper keeps.

  **Lima's gauge holds the storm and the one four days before it.** 1.88 inches on 17 June, 0.70 on
  the 19th — on ground that had already taken **2.35 inches on 13 June**, the wettest day of that
  month. [verified] — [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551.

  **Three separate rises in one June, and the two peak files name two of them — neither pair
  agreeing on which was the flood.** Daily mean discharge at Findlay ran 3,490 cubic feet a second
  on the 13th, **4,930 on the 18th** and 960 on the 27th; at Allentown 1,290, 1,080 and **1,830**.
  [verified] — [USGS daily values](../../catalog/usgs-nwis.md), sites 04189000 and 04187500. The
  Blanchard's water-year 1946 peak is **6,400 cfs on 18 June**, thirty-sixth of ninety-nine water
  years, and it is this flood. **The Ottawa's is 3,140 cfs on 27 June** — a storm ten days later
  that this newspaper does not report as a flood at all. [verified] — the same source's peak
  streamflow.

  **So the county's river contributes nothing to this event and its annual row points at a different
  week.** A corpus reading the Ottawa's peak file alone would find one June 1946 flood and it would
  be the wrong one; a corpus reading the daily file finds three rises and a newspaper that reports
  the middle one. This is the second case for
  [a peak is one row a year](../../decisions/a-peak-is-one-row-a-year.yml), and it is the harder
  one: in water year 1959 the annual row named the right storm on the wrong reckoning, and here it
  names a different storm.

  **Cherry street again, for the third time in eight years.** The columnist walks it on the Monday
  morning; the water was there in [1939](the-flood-of-12-march-1939.yml) measured against 1913, in
  [1947](the-flood-of-6-june-1947.yml) blocking the business places, in
  [1959](the-flash-flood-at-bluffton-1959.yml) and again in
  [2019](the-flood-at-bluffton-26-april-2019.yml). Six floods, one street, a hundred and six years.
  [inference]

  [open] Whether the 27 June storm flooded anything. It is the Ottawa's largest instant of the water
  year and it fell four days after this issue went to press; 2.17 inches were recorded at Lima that
  day, and the issue of 4 July has not been read.
