class: event
label: The flood of 16–19 June 1946
description: |
  **A flood the county's own river has no row for.** "Paced by a violent electrical storm
  accompanied by tomado-like [sic] winds and a near cloudburst which swept the Bluffton district
  Sunday night and early Monday morning, rains which continued Tuesday and Wednesday have inundated
  the Bluffton district with the heaviest downpours in recent years." [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 20 June 1946, page one, "FLOODS FOLLOW
  VIOLENT STORM — FIELDS INUNDATED". Fields stood "under water for the past three days" and the
  lowlands were "covered with the overflow of flood waters".

  **What it looked like from the street is in the gossip column and not the news story.** "Big Riley
  went on a wild rampage and flooded dozens of basements and turned Harmon field into a lake with
  dozens of barefooted kids enjoying a splash Monday morning when the writer went over Cherry street
  and College avenue". [verified] — the same issue, page seven. The front page has the acreage and
  the columnist has the basements, which is the division of labour this paper keeps.

  **Lima's gauge holds the storm and the one four days before it.** 1.88 inches on 17 June, 0.70 on
  the 19th — on ground that had already taken **2.35 inches on 13 June**, the wettest day of that
  month. [verified] — [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551.

  **Three separate rises in one June, and the two peak files name two of them — neither pair
  agreeing on which was the flood.** Daily mean discharge at Findlay ran 3,490 cubic feet a second
  on the 13th, **4,930 on the 18th** and 960 on the 27th; at Allentown 1,290, 1,080 and **1,830**.
  [verified] — [USGS daily values](../../catalog/usgs-nwis.md), sites 04189000 and 04187500. The
  Blanchard's water-year 1946 peak is **6,400 cfs on 18 June**, thirty-sixth of ninety-nine water
  years, and it is this flood. **The Ottawa's is 3,140 cfs on 27 June**, ten days later.

  **The 27 June storm flooded nothing, and the issue that says so was in reach the whole time.**
  This node asked whether the Ottawa's largest instant of the water year had flooded anything, and
  named the issue of 4 July as the way to find out. Read: it carries that storm as **"Lightning
  Damages Two Homes Here"** — it "swept Bluffton shortly after 5 o'clock last Thursday morning" and
  damaged the houses of Postmaster Ed Reichenbach and Orville Matter, a burnt-out radio, shattered
  windows, a house full of smoke and no fire. **No flood, no high water and no creek appears
  anywhere in the issue.** Its one flood story is *this* flood, eleven days on and in the next
  county: "Flood Washes Out Hardin Crops". [verified] — the same paper, 4 July 1946, pages five,
  six and seven.

  **So the river's flood of the year is a lightning strike on two houses.** 3,140 cfs is
  **twenty-seventh of fifty-two water years** against a median annual peak of 3,240 — the most
  ordinary row in the file. [verified] — [USGS](../../catalog/usgs-nwis.md), site 04187500, ranked
  here. A corpus reading the Ottawa's peak file alone would find one June 1946 flood and it would be
  the wrong one, and this is the third and hardest case for
  [a peak is one row a year](../../decisions/a-peak-is-one-row-a-year.yml): the annual row exists
  whether or not anything happened, so its presence asserts no more than its silence does.

  **And the issue of 27 June, also unread here, is this flood's own aftermath.** Its front page runs
  "FARMERS BUSY IN FIELDS — STORM'S DAMAGE IS SMALL", and the loss it names is time: "at least a
  full week's work was lost right at the peak of the busy summer season". Hay cut just before the
  storm "proved a complete loss" and "potatoes probably suffered the most damage"; Harmon field's
  recreation programme was cancelled for a week by rainfall "that twice flooded the recreation
  center". [verified] — the same paper, 27 June 1946, pages one, four and five.

  **Cherry street again, for the third time in eight years.** The columnist walks it on the Monday
  morning; the water was there in [1939](the-flood-of-12-march-1939.yml) measured against 1913, in
  [1947](the-flood-of-6-june-1947.yml) blocking the business places, in
  [1959](the-flash-flood-at-bluffton-1959.yml) and again in
  [2019](the-flood-at-bluffton-26-april-2019.yml). Six floods, one street, a hundred and six years.
  [inference]
