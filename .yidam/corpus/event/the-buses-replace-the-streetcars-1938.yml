class: event
label: Motor buses begin replacing Lima's street cars, 1938
description: |
  **"It was in 1938 that motor busses began replacing the electric street cars that had served the
  city for over fifty years."** [verified] —
  [History of Lima, Ohio](../../catalog/hackman-history-of-lima-1951.md), the booklet's chronology
  of the 1930s.

  **It is the end of a railway this corpus could follow for forty-three years and not out of them.**
  [The street railway](../measure/lima-street-railway-1878-1921.yml) is recorded under four company
  names from June 1878 to 1921 and no source held here said what became of it. [verified] — the same
  booklet. Fifty years before 1938 is 1888, which sits between the two dates the corpus holds for
  the electrification and is consistent with either.

  **"Began replacing" is the whole of what the source says.** The booklet gives a year for the start
  of a substitution and no date for its end, no company, no mileage and no count of cars.
  [verified] — the same booklet.

  **This corpus cannot say when the last electric car ran in Lima.** A process that began in 1938
  may have taken a month or a decade, and nothing read here follows it.

  [open] Who ran the buses. The booklet names no operator, and the corpus's last named operator of
  the electric system is [the Ohio Electric](../organization/ohio-electric-railway.yml) in 1921.
