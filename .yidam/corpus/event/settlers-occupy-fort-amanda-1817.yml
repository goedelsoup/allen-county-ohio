class: event
label: Settlers occupy the blockhouses at Fort Amanda, 1817
description: |
  **The first American settlement in Allen County was three men moving into an abandoned army
  post.** "In 1817 a few settlers arrived, who occupied the block-houses within the stockade
  around this fort." [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), both scans, and
  reprinted word for word in [the 1906 history](../../catalog/miller-allen-county-1906.md).

  They were **Andrew Russell**, who died five years later and was buried in the military cemetery;
  **Peter Diltz**, who went back to Montgomery County in August 1818 and returned in 1821; and
  **William Van Ausdall**, who died in 1824 and was laid next to Russell. [verified] — same source,
  both scans. Two of the county's first three settlers are buried inside the fort's cemetery, which
  makes the graves there a mixed burial ground of soldiers and civilians and not the national
  cemetery the same page calls it. [inference]

  **The 1885 history is emphatic about the precedence and puts it twice.** "The initial point in
  the history of the settlement of Allen County must be known as Fort Amanda," and, opening the
  township chapter, "This division of the county was the first to fall into the possession of the
  American pioneer, and one of the first divisions of the entire Northwest to be occupied by
  United States troops." [verified] — same source, both scans.

  **And the ground it happened on has not been in Allen County since 1848.** [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the fort](../site/fort-amanda.yml) and
  [of here is not located here](../../decisions/of-here-is-not-located-here.yml). The settlement
  that follows is inside the present county: Henry Hartel in 1820, Dye Sunderland and family in
  1821, and a roll of some thirty names to 1829. [verified] —
  [the 1885 history](../../catalog/leeson-allen-county-1885.md).

  **What made the fort habitable is what made it a place to die in.** The storehouse at the centre
  of the quadrangle had a second storey added in 1813 to serve as an army hospital, and most of
  those in the cemetery died in that room. Four years later three men moved their families into
  the same enclosure. [verified] — [the 1921 history](../../catalog/rusler-allen-county-1921.md),
  which calls it "rather an uncanny introduction to the place as a home for the settlers a few
  years later".
properties:
  occurred: "1817"
  event_type: settlement
  location_description: |
    Inside the stockade at Fort Amanda, on the west bank of the Auglaize — in Allen County at the
    time and in Auglaize County now. [verified]
