class: event
label: Lima returns to mayor and council, 1933
description: |
  **"In 1933 Lima changed its city government from the Manager-Commission form to Mayor-Council."**
  [verified] — [History of Lima, Ohio](../../catalog/hackman-history-of-lima-1951.md), the booklet's
  chronology of the 1930s.

  **It closes a question this corpus has carried since it read the 1921 history.**
  [The commission charter](lima-adopts-commission-government-1922.yml) took effect on 1 January
  1922, announced by a book written before it happened, and the corpus then found a Lima mayor
  cutting twelve men from the street department in November 1939 without any instrument for the
  seventeen years between. [verified] — the same booklet against
  [the 1921 history](../../catalog/rusler-allen-county-1921.md). The office came back in 1933, and
  the commission form lasted eleven years.

  **The city that adopted it was told it would be a model, and the booklet says it was one.** "The
  City Manager-Commission form of government was inaugurated in 1922 and for years the city of Lima
  served as a model for this type of municipality." [verified] — the same booklet. That sentence is
  a chamber of commerce's and the year in it is corroborated; the judgement in it is not taken here.
  [inference]

  **This corpus cannot say how the change was made.** A charter amendment, a repeal, a new charter
  and a vote of the electors are all consistent with a booklet that gives a year and names no
  instrument, no ballot and no majority.

  [open] Whether the charter of 1922 survived the change. Lima is a home-rule city and the
  distinction between amending a charter and abandoning one is the difference between two kinds of
  municipality; the source read here does not draw it.
