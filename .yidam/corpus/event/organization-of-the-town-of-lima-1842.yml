class: event
label: The organization of the town of Lima
description: |
  Lima got a government of its own on **29 March 1842**, eleven years after the county
  commissioners platted it and told it what to do. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), whose two scans carry
  the date identically.

  **The corpus has held this date since the settlements phase and never as an event.**
  [The corporation](../jurisdiction/city-of-lima.yml) records it in prose; nothing put it on the
  dated record, so the timeline ran from 1848 to 1854 with the county seat's own founding inside
  the gap. This node is the same fact promoted to the class the corpus counts. [verified]

  **The town was platted in 1831 and run by the county until 1842.** "The original town as platted
  in 1831 was entirely controlled by the county commissioners. In 1841 a movement to organize a
  system of village government was favorably received; the commissioners were petitioned in the
  matter, and as a result the village of Lima was established." [verified] — same source, scan B;
  scan A reads 1881 for 1831, which is impossible on the book's own account of a county organized
  in 1831 and a book printed in 1885.

  **The first officers, as the book prints them.** H. D. V. Williams, mayor; W. McHenry, recorder;
  John Alexander Jr., Samuel Black, H. Davison, T. K. Jacobs and D. D. Tompkins, trustees. The
  council then elected John B. Wamsley treasurer and Amos Clutter marshal, and in April appointed
  Alexander Beatty, Daniel Bowyer and R. E. Thomas street commissioners and Daniel Musser
  supervisor. [verified] — same source. See
  [Henry D. V. Williams](../person/henry-d-v-williams.yml).

  **Five officers and five trustees is not the government the city has now.** Lima today elects a
  mayor, an auditor, a director of law, a president of council and seven council members by ward,
  and its marshal, recorder and street commissioners are gone. [verified] —
  [the city's government](../measure/lima-city-government-2026.yml).

  [open] What "the village of Lima was established" in 1841 means beside "the town of Lima was
  organized" on 29 March 1842 — whether the first is the commissioners' order and the second the
  first election, or two stages of one act. The book uses village, town and city interchangeably in
  the same paragraph and this corpus cannot say which was the legal event.
properties:
  occurred: "1842-03-29"
  event_type: incorporation
  location_description: |
    Lima, then the county seat of a county eleven years old, platted in 1831 on ground the
    commissioners controlled. [verified]
