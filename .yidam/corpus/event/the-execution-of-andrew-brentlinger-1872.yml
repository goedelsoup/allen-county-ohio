class: event
label: The execution of Andrew Brentlinger, 1872
description: |
  The only hanging this corpus holds any record of in Allen County, and the book that records it
  cannot say which day it happened. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **"There is a bit of rope hanging in the office of Sheriff Baxter that was used in the execution
  of Andrew Brentlinger, Friday, April 7 or 15, 1872 — there being conflicting reports about it."**
  [verified] — same source, writing while
  [Charles W. Baxter](../person/charles-w-baxter.yml) was sheriff, 1918 to 1923.

  **Neither date the book offers was a Friday.** 7 April 1872 fell on a Sunday and 15 April on a
  Monday; the Fridays that month were the 5th, 12th, 19th and 26th. [inference] — computed here from
  the calendar. So the book's two candidates and its weekday cannot all three be right.

  [open] Which of the three the book got wrong, and what the true date was.

  **The sequence the book does give.** Brentlinger, a man of fifty living in Shawnee, stabbed his
  second wife to death on 24 October 1871 — she was twenty-seven and the book does not name her —
  buried her near the house and ploughed and harrowed the ground over the grave. His children raised
  the alarm; he was found hidden in the garret, having swallowed poison, and was saved by a doctor.
  A ten-day trial before Judge Mackenzie ended in a verdict of guilty and a sentence to hang on
  20 January 1872. [verified] — same source.

  **A governor of Ohio, later a president, gave him a hundred days.** "Governor Rutherford B. Hayes
  granted a reprieve of 100 days." [verified] — same source. A hundred days from 20 January 1872 is
  29 April, which is later than either date the book gives for the execution. [inference] — computed
  here; the corpus cannot reconcile the reprieve with the dates and records both. [open]

  **Fifty men guarded the jail the night before.** "He heard the talk of a threatened mob, and fifty
  men assembled that night to guard the jail. The light of the lanterns and the glitter of the
  muskets held the mob spirit under subjection." [verified] — same source. It is the earliest of
  three occasions on which a crowd came to this jail; see
  [1916](the-mob-at-the-allen-county-jail-1916.yml) and
  [1933](allen-county-jail-raid-1933.yml).

  **He was moved between two buildings for it.** He was held in a cell in the basement of the second
  county courthouse, where "there were so many curious visitors that it was very annoying to the
  sheriff", and moved to the new jail before the execution. The commissioners had ordered a high
  board fence built for an out-of-door hanging in January. [verified] — same source; see
  [the courthouse](../site/allen-county-courthouse.yml).
properties:
  occurred: "1872-04"
  event_type: execution
  location_description: |
    The Allen County jail, Lima. The condemned man had been held in the basement of the second
    courthouse and was moved to the new jail before the execution. [verified]
