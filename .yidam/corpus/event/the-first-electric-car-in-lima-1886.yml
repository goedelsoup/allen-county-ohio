class: event
label: The first electric car in Lima, July 4, 1886
description: |
  **"It is said the mule was emancipated in Lima in 1886 — July 4th, when the first electric car in
  use west of the Allegheny Mountains, was seen in Lima. The town was full of people, although it
  rained all day; some would take a ride were there horses or mules to draw them. The Lima public
  square was full of people who 'took the rain,' watching the first electric car in the city. It was
  a curiosity — no horse or mule to draw it."** [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The claim is a superlative and the corpus cannot test it.** Nothing here establishes what ran
  west of the Alleghenies in 1886, and the book prefaces it with "it is said". It is recorded as
  what the book says, on
  [a single witness read once](../../decisions/a-single-witness-read-once.yml).

  **The 1906 history makes a different superlative about the same thing.** Under a photograph
  captioned "First electric car in Lima" it prints: "(Lima had the second electric street railway
  line in the United States)". [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md). First west of the
  mountains and second in the country are compatible statements, and neither book cites the other or
  anything else. Two boasts that do not contradict are still one piece of evidence apiece.
  [inference]

  **What is on firmer ground is the local sequence.** [Benjamin Faurot](../person/benjamin-faurot.yml)
  installed Lima's first electric light plant in 1883 beside his opera house; the street railway
  organized in 1878 ran horse cars; and this is the year the two met. [verified] — the 1921 history
  for the light plant, and
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) for the horse cars; see
  [the street railway under four names](../measure/lima-street-railway-1878-1921.yml).

  **It happened one year into the oil.** The strike was May 1885 and the electric car July 1886, so
  the city electrified its streetcars in the first full year of the field. [inference]

  [open] Who ran it, over what track, and whether the whole line converted that day or one car did.
  The 1921 account is a crowd in the rain and no company name.
properties:
  occurred: 1886-07-04
  event_type: first operation
  location_description: |
    The Lima public square, where the crowd stood. [verified] — the 1921 history. The route is not
    stated; the street railway's 1878 lines ran from the Fort Wayne depot along Wayne, Main and
    Market.
