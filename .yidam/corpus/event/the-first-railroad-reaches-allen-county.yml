class: event
label: The first railroad reaches Allen County
description: |
  The opening of the Ohio & Indiana Railroad from Crestline to Fort Wayne, through Lima and
  Delphos, under authority the Legislature granted on 20 March 1850. It was consolidated into the
  Pittsburgh, Fort Wayne & Chicago in 1856 and is now part of no trunk line at all. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md), whose two scans agree
  word for word, and [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md),
  which calls it "Lima's first railway".

  **Three county histories name the same road and three different years.** 1853 in Miller, 1854 in
  Leeson, 1856 in Rusler. [verified] — the three sources named here and
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md). None of the
  three is a company record and none cites one, so what the corpus holds is a spread of three years
  in which its own sources disagree, not a date three of them confirm.

  **1854 is the reading that survives both checks the corpus can run.** It is Leeson's, the nearest
  witness in time, carried identically by both scans of that book; and Rusler, who dates the opening
  latest, also reports that the first steam locomotive in the county arrived in **1854**, brought by
  canal from Toledo as freight to Delphos, named the *Lima*, and used for construction work on this
  same road. [verified] — [the 1921 history](../../catalog/rusler-allen-county-1921.md). A
  construction engine delivered in 1854 is not consistent with a line already open in 1853.
  [inference]

  **The county paid for it and got the money back.** Allen County subscribed $50,000 in stock, and
  the stock was later sold at par, "so the railroad cost the county nothing". [verified] — same
  source.

  **The second road came four years later and was the one that built the shops.** The Dayton &
  Michigan was chartered in 1856–57 and completed through Allen County in 1858; its passenger trains
  began running to Dayton on **5 April 1858** and the line was finished to Toledo in August 1859.
  [verified] — [1885](../../catalog/leeson-allen-county-1885.md) and
  [1906](../../catalog/miller-allen-county-1906.md), which agree on the year. Rusler puts it in 1857,
  one year after his own date for the first road, so his pair is internally consistent and two years
  earlier than everyone else's. [inference]

  **What it did to the county is the thing that is not in dispute.** Within a decade Lima stood at
  the crossing of the two roads and Delphos, the canal town, did not. [inference] — see
  [Lima](../place/lima.yml), [the canal](../site/miami-and-erie-canal.yml) and
  [the network the two roads became](../measure/allen-county-railroads-1883-1921.yml).

  [open] Which day, and whether "opened" in these books means the first train, the first scheduled
  service or the formal completion. A county history is a compilation and none of these three prints
  the record it compiled from.
properties:
  occurred: "1854"
  event_type: opening
  location_description: |
    The line ran east and west across the county through Lima and Delphos, on the route now held by
    the Chicago, Fort Wayne & Eastern. No source here gives a route in survey terms. [verified]
