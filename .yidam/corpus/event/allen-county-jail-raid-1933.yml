class: event
label: The raid on the Allen County jail
description: |
  On the night of 12 October 1933 three armed men walked into the Allen County jail at Lima, shot
  Sheriff [Jess L. Sarber](../person/jess-l-sarber.yml), freed the prisoner John Dillinger from his
  cell, locked the sheriff's wife and his deputy in it, stripped the building of its guns and
  ammunition and drove west out of town. [verified] —
  [Chronicling America](../../catalog/chronicling-america.md), *The Times-News* (Hendersonville,
  N.C.), 13 October 1933, page 1, carrying a United Press dispatch datelined Lima.

  It is the county's most widely reported hour and the corpus's first event of the twentieth
  century. Before this node the county's dated happenings stopped in 1885. [verified] — the
  corpus's own event nodes.

  **Why the man was in this county's jail.** Dillinger was being held on a charge of robbing a bank
  in Allen County — "the Bluffton, O., Commercial Bank of $2200" — and had been brought up from
  Dayton about a week before. [verified] — same archive, *The Washington Daily News*, 13 October
  1933, page 3.

  A retrospective published nine months later puts the same robbery at $2,800, and the two figures
  are not reconciled here. [open]

  So the night was not a national story that happened to land in Lima. It began with a bank in
  [Bluffton](../place/bluffton.yml), forty minutes up the road, and the county was holding the man
  who was charged with robbing it. [inference]

  **What the first dispatch says happened.** It is worth quoting at length, because it is the only
  account this corpus has from within a day of the event:

      LIMA, 0., Oct. 13.—(UP).— A pang [sic] of desperadoes stormed into the county jail here
      last night, shot and fatally wounded Sheriff Jess L. Sarber, liberated John Dillinger,
      alleged bank robber. from his jail cell, stole all guns and ammunition in the jail and
      raced from town in two automobiles.

      Three of the men entered the jail with guns drawn. There they met the sheriff's wife and
      Deputy Sheriff Wilbur Sharp, in addition to the sheriff. Sharp's presence was the only
      detail in which their plans went wrong.

      The men demanded that Dillinger be freed. An argument ensued. The men became violent in
      their demands. Sheriff Sarber tried to fight them. Two shots were fired. One went wild
      and the other struck Sarber.

  [verified] — same page.

  **The same dispatch contradicts itself about how long the sheriff lived.** In its fourth
  paragraph he "died 20 minutes later in a hospital"; nine paragraphs on, a pedestrian hears
  shouting, fetches the chief of police, and the sheriff is taken to the hospital "where he died a
  few minutes later". [verified] — same page. That a wire story can hold both readings in one
  column is the plainest evidence this corpus has for how a newspaper differs from the records it
  was built on, and it is the case that produced
  [two papers printing one dispatch](../../decisions/two-papers-printing-one-dispatch-are-one-witness.yml).

  **Who was named.** Harry Pierpont, Charles Makley and Russell Clark were tried at Lima for the
  murder, and Pierpont was named the trigger man. Sarber himself, before he died, identified his
  assailant as "Harry Copeland"; officers said they were convinced the right name was Pierpont.
  [verified] — same archive, *Evening Star* (Washington, D.C.), 13 October 1933, page 10.

  **The county tried all three of them, and it took the National Guard to do it.** Three trials at
  Lima, each about a week, through February and March 1934, prosecuted by Ernest M. Botkin before
  Judge E. E. Everett, with Ohio National Guardsmen under Brig. Gen. Harold M. Bush holding the
  town — machine gun nests at the approaches to the jail, another at the end of the cell corridor,
  sandbag defenses, and nobody admitted without a written order from the sheriff, the prosecutor or
  the judge. [verified] — same archive, *Evening Star*, 4 March 1934, page 3, and 25 March 1934,
  page 2.

  This corpus does not establish what the trials cost the county or how they were paid for. A
  three-week military occupation of a county seat is an expense, and the newspaper record names no
  figure. [open]

  **How it ended.** Pierpont was found guilty in the early morning hours of 11 March 1934.
  [verified] — same archive, *Evening Star*, 12 March 1934, page 3. Pierpont and Makley were
  sentenced to die and Clark, alone, "drew a verdict of guilty with mercy, obligating the court to
  pronounce sentence of life imprisonment". [verified] — *Evening Star*, 25 March 1934, page 2,
  whose Lima dateline has an illegible day.

  On 22 September 1934 Pierpont and Makley tried to bluff their way off death row at the Ohio
  Penitentiary with guns carved from soap; guards shot both, and Makley died within the hour.
  [verified] — *Evening Star*, 23 September 1934, page 2. Pierpont was electrocuted shortly after
  midnight on 17 October 1934. [verified] — same archive, *The Daily Alaska Empire*, 17 October
  1934, page 1. Twelve months and five days after the raid, all three of the men who came into the
  jail were dead or serving life, and so was the sheriff.

  **What it did to this county's government, which is the reason the corpus went looking.** The
  sheriff's office passed to his son, [Donald F. Sarber](../person/donald-f-sarber.yml). [verified]
  — same archive, *Evening Star*, 4 March 1934, which calls the dead man "the elder Sarber, who
  preceded his son as sheriff". See
  [the two irregular sheriff transitions](../question/two-irregular-sheriff-transitions.yml), the
  question this event was retrieved to answer.

  This node does not establish where the jail stood. Every account places it at Lima, near Main
  Street, and none of them gives an address or says whether the building survives — so there is no
  `occurred-at` edge to a site, and the courthouse is not it. [open]
  **It is the third time a crowd has come to this jail and the corpus now holds all three.** Fifty
  armed men held off a threatened mob the night before
  [Andrew Brentlinger's execution in 1872](the-execution-of-andrew-brentlinger-1872.yml), and a mob
  nearly hanged [Sheriff Sherman Eley](../person/sherman-e-eley.yml) on
  [30 August 1916](the-mob-at-the-allen-county-jail-1916.yml) for hiding a Black prisoner from them.
  Sixty-one years, three crowds, and the only sheriff killed was the one who faced the smallest.
  [verified] — [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md)
  for the first two.

