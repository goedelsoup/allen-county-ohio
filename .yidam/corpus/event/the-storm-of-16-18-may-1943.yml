class: event
label: The storm of 16–18 May 1943
description: |
  **Three days of rain, a flood on the Riley creeks, and a tornado that was not in this county.**
  "Swept by flood and tornado the first of the week, the Bluffton district was returning to normal
  Wednesday as cloudy and cooler weather gave respite from the heaviest downpour of rain and the
  most destructive windstorm in recent years." [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 20 May 1943, page one. "Several feet
  of water which covered bottomlands of Big and Little Riley creeks, Monday, had receded on
  Tuesday"; telephone service was curtailed "because of watersoaked cable", and farmers said no
  ground could be worked before the following week. [verified] — the same story, continued page 8.

  **Lima's gauge holds the three days.** 0.63 inches on 16 May, **1.35 on the 17th and 1.50 on the
  18th** — 3.48 inches in three days, against 0.23 on the 20th and nothing above an inch again that
  month. [verified] — [GHCN-Daily](../../catalog/ghcn-daily-lima.md), station USC00334551. The
  Blanchard near Findlay crested at 4,520 cubic feet a second on 18 May, its annual peak.
  [verified] — [USGS peak streamflow](../../catalog/usgs-nwis.md), site 04189000.

  **And the newspaper dates a peak the gauge would not date.** The Ottawa at Allentown's water-year
  1943 peak is **6,000 cubic feet a second at 10.00 feet, third largest of fifty-two water years**,
  and its date field reads `1943-05-00`: month known, day unknown, published as a reconstructed
  historic peak because the gauge was out from 31 December 1935 to 1 September 1943. [verified] —
  the same source, site 04187500. It is **one of exactly two incomplete dates in the county's two
  long river records** — the other is the Blanchard's March 1913 peak — and the two are the corpus's
  two hardest floods. [verified] — computed here over both peak files. The rain and this account put
  the missing day at the 17th or 18th. [inference]; see
  [an instrument dates it and a witness describes it](../../decisions/an-instrument-dates-it-and-a-witness-describes-it.yml).

  **The tornado struck Orange township, and Orange township is in Hancock County.** "A hedgehopping
  tornado which roared east thru Orange township Monday morning leveled four barns. The wind
  followed generally the route of the Lincoln highway, coming from the west and working east in a
  three mile stretch." [verified] — the same source. Ohio has six Orange townships and the one
  south-east of Bluffton is Hancock's, centred 40.8636, −83.8231. [verified] —
  [GNIS](../../catalog/gnis-domestic-names-ohio.md), feature 1086250; Allen County's twelve
  townships are named in [the civil geography](../../decisions/the-civil-geography.yml) and none is
  Orange. The four barns were on the Albert Matter farm at the junction of routes 69 and 30, the
  Howard Moser farm a quarter mile east, Mrs. Mary Hall's place beside E. W. McKean's, and the
  former Park McElroy place; a poultry house went on the Andy Caris farm and windows in at Carl
  McCafferty's. [verified] — the same source.

  **So it does not antedate this county's tornado record, and this corpus's catalog said it did for
  one phase.** [The tornado of 19 July 1950](the-tornado-of-19-july-1950.yml) is still the first
  Allen County tornado in the federal file and still the first thing in the county's weather record,
  and a 1943 tornado four miles east in the county next door moves neither. See
  [a village weekly does not name its county](../../decisions/a-village-weekly-does-not-name-its-county.yml).

  **What Allen County heard of it is a sound.** "Roar of the tornado was plainly heard in Bluffton
  about 4 a. m. and awakened residents here. The sound was similar to that of a locomotive and was
  mistaken by many for a passing train. There was comparatively little wind here." [verified] — the
  same source. That is the whole of the county's testimony to the wind, and it fixes the hour of a
  storm the federal record does not hold at all, seven years before that record begins.

  [open] Where the three-mile track began. The wind came from the west along the Lincoln highway,
  which crosses the Allen–Hancock line, so a three-mile run ending in Hancock County may have
  started in this one. The paper names nothing west of the Matter barn, this corpus cannot place
  the junction of routes 69 and 30 in 1943, and no second account of the storm has been found.
properties:
  occurred: 1943-05-16
  occurred_through: 1943-05-18
  event_type: storm
  location_description: |
    Bluffton and the bottomlands of Big and Little Riley creeks, in Allen County; the tornado's
    named damage lies east of the county line in Orange township, Hancock County, along the Lincoln
    highway. [verified] — [The Bluffton News](../../catalog/chronicling-america.md), 20 May 1943,
    and [GNIS](../../catalog/gnis-domestic-names-ohio.md).
