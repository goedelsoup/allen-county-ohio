class: event
label: The 1885 Lima oil strike
description: |
  The well at Lima that struck oil in 1885 and opened the Lima–Indiana field. [inference] The
  drilling was after natural gas, following the Findlay boom to the north; oil is what came up.
  [inference]

  It is the hinge event of the county's history. Before it, Allen County was an agricultural
  county with a railway junction; after it, Lima was an oil town with a refinery, national
  capital moving through it, and a population that grew for the better part of a century. The
  [oil boom](../period/lima-oil-boom.yml) is the period this event opens.

  The Lima crude was sour — high in sulphur, and difficult to refine into a saleable
  illuminant by the methods of the day. That property is why the field's development depended
  on a desulphurization process and hence on the capital and patents of
  [Standard Oil](../organization/standard-oil.yml) rather than on local operators. [inference]

  The strike `affected` the county and not only the city: the Lima–Indiana field extended well
  beyond the corporate boundary. [inference] That is why this node carries an `affected` edge to
  the county alongside its `occurred-in` edge to Lima — the two say different things, and only the
  first is true of the ground outside the city.

  **What the strike did to the county was add, not replace.** This node used to say the county's
  economy "was reoriented from agriculture to petroleum and the manufacturing that followed it",
  which was written before the corpus had measured any agriculture at all. It has now. Twenty-five
  years after the strike, Allen County had 2,939 farms against 2,858 in 1900, 92.5 per cent of its
  land area in farms, and improved acreage higher than before the boom began. [verified] —
  [Abstract of the Thirteenth Census, Supplement for Ohio](../../catalog/census-1910-abstract-supplement-ohio.md);
  see [the county's farms](../measure/allen-county-farms-1900-1910.yml). The farms did not go
  anywhere. A city grew beside them. [inference]

  **The one farm figure that moved sharply is price.** An acre of Allen County farmland went from
  $38.39 in 1900 to $76.28 in 1910, and all farm property rose 89.0 per cent against 58.7 for Ohio.
  [verified] — same source, which prints both percentages.

  That the field's money is what bid the land up is the obvious reading, and it is not established
  here; the corpus has no series that would separate oil money from the general rise in Midwestern
  land values in that decade. [open]

  **A source printed in 1885 does not know this happened, and that is evidence.** The county history
  published that year is exhaustive about Lima's industry — it names the paper mills, the machine
  works, the iron fence company, the egg-carrier patent, the gas works, every bank and the year each
  was organized. Its geology chapter disposes of the county's petroleum in two sentences, under the
  heading **GAS FOUNTAINS**:

      Throughout the county evidences of gas wells are manifest. Their development is a
      subject for the enterprise of the future.

  [verified] — [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md). A book that catalogues a $12,000 flour mill would not have missed an oil field
  in the town it is written about. So the strike had not happened, or had not yet registered, when
  this went to press — which bounds it from below without naming a well, and is the first
  independent support this corpus has for the year 1885 at all. [inference]

  **The conditions the received account requires are all in the book, and the oil is not.** Gas
  shows across the county; a gas boom at Findlay, whose "two gas wells" the same volume notes;
  a Lima Gaslight Company with a secretary who married
  [B. C. Faurot's](../person/benjamin-faurot.yml) daughter in January 1885; and Faurot himself
  owning the paper mill that needed the fuel. [verified] — same source. The story of a man drilling
  for gas at his own mill is not verified here, but every one of its preconditions now is.

  **The well was completed on May 9, 1885, and it was not looking for oil.** The drill began work in
  the spring of 1885 on the grounds of the Lima Straw Board Works, on the bank of the
  [Ottawa River](../natural-feature/ottawa-river.yml), under the direction of
  [B. C. Faurot](../person/benjamin-faurot.yml); the contractors were Brownyear and Martin.
  **It was put down for a double purpose** — "they needed a better quality of water and more of it
  for manufacturing purposes, and they hoped they might possibly get a supply of natural gas",
  gas having been found shortly before at Bowling Green and Findlay. [verified] — [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md), both scans
  agreeing on every figure below.

      casing elevation      about 850 feet above tide-water
      lower limestone       1,250 feet down, about 400 feet below tide-water
      in the shale          a small amount of gas
      in the Trenton        no gas at all — "the disappointment was plainly marked on the
                            faces of all concerned" — and oil where the gas was looked for
      after shooting        more than 200 barrels in the first six days, with some salt water
      contractor's estimate an 18-barrel well, by W. M. Martin

  The oil was "dark in color, low in gravity and very offensive in odor", and "to a Pennsylvania oil
  man, these characteristics seemed to condemn the new supply". [verified] — same source. The water
  motive is the detail every retelling drops, and it is the one that makes the event legible: a
  paper mill wanted a better well.

  **The famous well failed.** The pioneer well met "a series of misfortunes that left it useless".
  The Citizens' Gas Company, formed to establish whether there was really oil about Lima, put down a
  **second** well that autumn, and it is that one "to be credited with yielding the first regular and
  persistent supply of petroleum from the Trenton limestone in Ohio" — 40 to 45 barrels a day at
  first, **1,450 barrels in December 1885**, and an average of 26 a day through the first quarter of
  1886. Its oil was the first sent to refineries to be tested at scale, and the tests established
  that Lima crude could be deodorized. [verified] — same source. So the event this corpus named for
  a single strike is two wells: one that made the discovery and broke, and one that proved the
  field. [inference]

  I. E. Dean, experienced in Canada, was among the first outsiders to arrive and organized the
  Trenton Rock Oil Company — which within a year held a lease that nearly cost Lima
  [its refinery](../site/lima-refinery.yml). [verified] — same source and [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md).

  **The first primary record of the boom reaching a named piece of ground.** On 29 September 1885,
  four and a half months after the well, an oil lease over part of the north-west quarter of
  section 17 in [Bath Township](../place/bath-township.yml) — 3.3 miles north-east of Lima's
  internal point — was granted to **B. C. Faurot and others**, and recorded the following April.
  It was later released. [verified] —
  [Section Ground book list](../../catalog/allen-county-recorder-section-ground.md), volume 0028A
  page 164, lease volume L-3 page 121.

  Until now the claim that the field extended beyond the city was an inference from the field's
  name. This is a dated instrument, on ground the corpus can point at, taken by the man who
  financed the well, in the September after it came in. [inference] A second oil lease over the
  same quarter followed on 2 November 1898, also released. [verified] — same pages.

  **And there is an earlier one, twenty days after the well.** An oil lease over part of the
  north-west quarter of section 14 in [Shawnee Township](../place/shawnee-township.yml) — the
  ground the tank plant stands on now — ran to "B C Faurot Et al" dated **29 May 1885**, recorded
  20 July 1886, and was afterwards cancelled. [verified] — same source, volume 0034A page 89, lease
  volume 3 page 410. The well came in on 9 May. [verified] —
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md).

  So within three weeks of the strike its financier was taking oil rights four miles south of the
  city, and by that September four miles north-east of it. [inference] The two leases are the only
  record this corpus holds of what the boom did in its first months, and what it did was move
  across the county in both directions almost at once. [inference]

  **Others followed, and then Standard's operating company.** A second lease over the section 14
  quarter went to H M Earnst in February 1886; the **Ohio Oil Company** took four leases over it
  between September 1895 and September 1897 and three rights of way in April 1907. [verified] —
  same pages.

  Both Faurot leases were released or cancelled, so neither says anything about whether oil was
  found there. A lease is a record of where people expected oil, which is a different and in some
  ways more useful fact. [inference]

  [open] Whether the Straw Board Works site can be placed on the ground today. The corpus has a
  river bank and a mill that no longer stands.
