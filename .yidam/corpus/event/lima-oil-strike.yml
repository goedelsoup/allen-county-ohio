class: event
label: The 1885 Lima oil strike
description: |
  The well at Lima that struck oil in 1885 and opened the Lima–Indiana field. [inference] The
  drilling was after natural gas, following the Findlay boom to the north; oil is what came up.
  [inference]

  It is the hinge event of the county's history. Before it, Allen County was an agricultural
  county with a railway junction; after it, Lima was an oil town with a refinery, national
  capital moving through it, and a population that grew for the better part of a century. The
  [oil boom](../period/lima-oil-boom.yml) is the period this event opens.

  The Lima crude was sour — high in sulphur, and difficult to refine into a saleable
  illuminant by the methods of the day. That property is why the field's development depended
  on a desulphurization process and hence on the capital and patents of
  [Standard Oil](../organization/standard-oil.yml) rather than on local operators. [inference]

  The strike `affected` the county and not only the city: the Lima–Indiana field extended well
  beyond the corporate boundary, and the county's economy was reoriented from agriculture to
  petroleum and the manufacturing that followed it. [inference] That is why this node carries
  an `affected` edge to the county alongside its `occurred-in` edge to Lima — the two say
  different things, and only the first is true of the ground outside the city.

  [open] The date, the well, and its exact location are unverified.
