class: event
label: Allen County is declared for Hurricane Katrina, September 2005
description: |
  **A county in north-west Ohio has a hurricane declaration.** On 13 September 2005 Allen County was
  named in EM-3250-OH, "Hurricane Katrina Evacuation", with Public Assistance designated and an
  incident window running 29 August to 1 October 2005. [verified] —
  [OpenFEMA](../../catalog/fema-disaster-declarations.md).

  **What was declared was the sheltering, not the storm.** An evacuation declaration reimburses a
  state and its local governments for taking in people from somewhere else; the hazard is nine
  hundred miles away and the cost is here. [inference] This is the only one of the county's ten
  declarations whose incident did not happen in Ohio. [verified] — same source; see
  [the declarations](../measure/allen-county-disaster-declarations-1965-2020.yml).

  **It carried no Individual Assistance**, which is the ordinary shape here: eight of the county's
  ten declarations paid governments and two paid households. [verified] — same source.

  **Allen County drew nothing, and neither did eighty-one other Ohio counties.** The
  public-assistance file holds **twenty project worksheets for EM-3250 and $2,541,599.60 obligated**,
  and the counties on them are Franklin, Hamilton, Cuyahoga, Montgomery, Clark and Lawrence, with
  seven rows filed Statewide. **There is no Allen County row.** [verified] —
  [OpenFEMA assistance programs](../../catalog/openfema-assistance-programs.md), public assistance
  funded projects, disaster 3250, all rows read here.

  **Which makes the designation say nothing whatever about this county.** All **eighty-eight** Ohio
  counties were designated under EM-3250 and every one of them carries `paProgramDeclared: true`.
  [verified] — [OpenFEMA](../../catalog/fema-disaster-declarations.md), the same declaration, all
  designated areas read. A blanket designation authorises a claim; it does not record one, and this
  node's opening sentence — "a county in north-west Ohio has a hurricane declaration" — is true of
  every county in Ohio. See
  [a designation is not a county](../../decisions/a-designation-is-not-a-county.yml).

  **The money went where the evacuees went.** Nine of the twenty worksheets are titled "emergency
  shelter operations" and the largest is a statewide $1,743,800; the county rows are the three big
  metros, Springfield and Ironton. [verified] — the same source. Whatever Allen County did for
  people arriving from the Gulf, it did not bill the federal government for it — which is a fact
  about the file and about the county's claim, and not about whether anyone was housed here.
  [inference]

  [open] Whether anyone was sheltered in Allen County at all. The federal file can now only say
  nobody claimed for it; a county emergency management record, a Red Cross chapter report or a Lima
  newspaper of September 2005 would say whether the question is about a claim that was never filed
  or about an event that never happened.
properties:
  occurred: 2005-09-13
  occurred_through: 2005-10-01
  event_type: disaster declaration
  location_description: |
    Allen County. `occurred` is the declaration date; `occurred_through` is the end of the incident
    window the file gives, which for this record is a real window rather than a repeated declaration
    date. [verified] — the same source.
