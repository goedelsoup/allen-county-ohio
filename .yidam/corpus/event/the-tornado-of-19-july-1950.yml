class: event
label: The tornado of 19 July 1950
description: |
  **The first thing in the county's weather record, and it injured thirty people.** An F3 tornado
  tracked 9.7 miles across a path 300 yards wide, killed nobody, and did damage recorded in the
  sixth of nine bands — **$500,000 to $5,000,000**. [verified] —
  [the SPC database](../../catalog/spc-tornado-database.md), tornado `om` 169, whose `loss` reads
  `6.0`, against [Storm Events](../../catalog/noaa-storm-events.md) event 10086810, which prints
  the same band as `$2.5M`; see
  [a damage figure is a category](../../decisions/a-damage-figure-is-a-category.yml).

  **It ran from the south-east edge of Lima to Beaverdam.** The file gives a start at 40.72, −84.08
  — 2.2 miles from [Lima](../place/lima.yml)'s centre — and an end at 40.83, −83.97, two-tenths of
  a mile from [Beaverdam](../place/beaverdam.yml). Those endpoints are 9.53 miles apart against a
  stated track of 9.7. [inference] — computed here from the same source.

  **Its clock is stamped in a timezone this county has never kept.** The row reads 15:15 with
  `CZ_TIMEZONE` = CST, and so does every other row here from 1950 to 1991; Allen County is on
  Eastern time. If the stamp means what it says, the local clock read 16:15. [inference] — same
  source. See [a file has more than one date](../../decisions/a-file-has-more-than-one-date.yml).

  **It is the corpus's first dated happening between the jail raid of 1933 and the government's
  purchase of the tank plant ground in 1951.** [verified] —
  [the jail raid](allen-county-jail-raid-1933.yml) and
  [the tank plant purchase](the-united-states-buys-the-tank-plant-ground-1951.yml).

  **Its damage figure and the 2006 windstorm's cannot be compared, and not only for the currency.**
  1950's is a band nine steps wide and 2006's $1,970,000 is an amount; the file changed grain on
  1 January 1993 and says nothing about it, and it carries no deflator either. [inference] — see
  [the storm record](../measure/allen-county-storm-events-1950-2026.yml).

  **What it struck is now on the record, from the county's own newspaper.** Near
  [Beaverdam](../place/beaverdam.yml), at the far end of the track, it "struck near the Dr. Foust
  farm, one mile southwest of Beaverdam on the Dixie highway, and levelled a barn on the Homer F.
  Weaver farm", blew down trees at a roadside park by the Foust home, and completely demolished
  "the Deeds barn south of Beaverdam and the Fett barn east of Beaverdam". [verified] —
  [The Bluffton News](../../catalog/chronicling-america.md), 27 July 1950.

  **Two injuries are named where the federal file counts thirty.** Weaver was "buried in the
  debris" and "escaped with bruises"; his son Melvin, outside the barn, "received a broken leg when
  he was struck by a flying barn door". [verified] — the same source. The paper is a Bluffton weekly
  writing about the end of the track and does not report Lima's casualties at all, so two named and
  thirty counted are not in conflict: they are different parts of one storm.

  **The paper puts it at 4:50 in the afternoon and the file does not.** The federal row is stamped
  15:15 CST, which this corpus read as 16:15 on the local clock; the newspaper, writing eight days
  after, says "the Lima tornado occurred at 4:50". [verified] — the same source, against
  [the storm record](../measure/allen-county-storm-events-1950-2026.yml). On a twenty-four-hour
  clock the file's stamp read as Central is 16:15 and the paper's afternoon is 16:50 — thirty-five
  minutes apart, and no reading of the timezone field closes the gap, because 15:15 Eastern is an
  hour and a half early and 15:15 Central is thirty-five minutes late.

  **And the money, which this node published as a disagreement, is not one.** The paper calls it "a
  one and one-half-million dollar tornado"; the file's band is $500,000 to $5,000,000, and one and a
  half million is inside it. [verified] — the same source. A weekly rounding to the nearest half
  million and a federal file recording a band agree, and this node said they were a million apart;
  see
  [an instrument dates it and a witness describes it](../../decisions/an-instrument-dates-it-and-a-witness-describes-it.yml).

  [open] What it struck in Lima. The Bluffton weekly reports the Lima tornado only as the thing that
  came an hour before its own, and no Lima newspaper of that week is digitized anywhere this corpus
  can reach; see [the archive](../../catalog/chronicling-america.md), which holds one of the
  county's ninety-nine titles and none of Lima's sixty-six.
