class: event
label: The flood of 16 July 1915
description: |
  **The Ottawa River ran through Lima on 16 July 1915, rising six inches an hour and stopping
  fifteen inches short of the 1913 mark.** [verified] —
  [the Associated Press dispatch](../../catalog/chronicling-america.md) of that day, datelined
  LIMA, in the *Evening Star* of Washington, page one: *"Ottawa river is racing through Lima,
  driving families to the higher portions of the city, and tearing out bridges and viaducts. Since
  midnight it has risen on an average of six inches an hour, and at 1 [a].m. was within fifteen
  inches of high water mark of 1913. More than 200 homes are under water. Every policeman and
  fireman in the city was kept on duty all night aiding in rescue work."*

  **It is the earliest flood this corpus can describe, and there was no instrument in the county
  to measure it.** The Ottawa's peak-flow record begins in water year 1924 at Allentown; nothing
  gauged this river in 1915. [verified] — [the peak flows](../measure/ottawa-river-peak-flows-1924-2025.yml).
  So the whole of what can be said about this flood is what a witness said, and
  [the rule that divides the instrument's work from the witness's](../../decisions/an-instrument-dates-it-and-a-witness-describes-it.yml)
  has only one side to give it. Every figure below is the wire's.

  **One death, and the file does not name her.** *"One woman died from burns received when gas in
  the cellar was exploded and a lamp she was carrying threw burning oil over her. Rising waters had
  put out gas under water heater and she lit a lamp and went to investigate. Four little children
  in the house received minor injuries. The house caught fire, but the blaze was extinguished."*
  [verified] — the same dispatch. **She drowned in no sense; the flood put out a pilot light.**
  [open] Who she was. No dispatch this corpus has read names her, and the Lima papers of that week
  are not digitized anywhere it can reach.

  **By the next day it was over.** *"Ottawa river at Lima has dropped as rapidly as it rose, and by
  tomorrow should be at its normal level ... Late last night the police were called to rescue a
  half dozen families marooned on a small island. The force of the water was weakening the houses,
  and they feared they would be swept downstream."* [verified] — the same paper, 17 July 1915,
  page one. Employees of the city service department stood at the bridges keeping wreckage from
  piling up, and limited traffic was allowed across all of them.

  **The worst of it in this county was not in Lima.** *"Damage at [Harrod], eight miles east of
  Lima, also was severe. Fifteen houses were damaged or demolished, and the Methodist Church was
  destroyed."* [verified] — the same dispatch, which prints the name as "Harron"; the village is
  [Harrod](../place/harrod.yml), 10.25 miles east-south-east of Lima's centre. [inference] —
  computed here. **And Harrod is not on the Ottawa.** The nearest mapped channel to it is an
  unnamed order-2 headwater reach two hundred feet away, in the Auglaize's headwaters and not the
  Ottawa's. [verified] — [the flow network](../../catalog/usgs-nhdplus-high-resolution.md). What
  destroyed the church was a nameless ditch.

  **Three places, three different comparisons to 1913, and only one of them is Lima's.** The
  dispatch says the river at Lima was fifteen inches *below* the 1913 mark; that farmers *"toward
  Elida"* reported water *higher* than 1913; and that at Kenton, in Hardin County, the Scioto
  *"passed the 1913 flood stage at noon."* [verified] — the same page. A reading of this event
  that says it passed the 1913 crest has taken a sentence about the Scioto at Kenton or a
  farmer's field near [Elida](../place/elida.yml) and attached it to the county seat; see
  [a flood mark belongs to one place](../../decisions/a-flood-mark-belongs-to-one-place.yml).

  **Thirty-eight papers carried this and they are one witness.** The story reached front pages
  from Pensacola to Tacoma on 16 and 17 July, and every Lima paragraph in the ones read here is the
  same wire copy. [verified] — [the archive](../../catalog/chronicling-america.md), searched and
  read here; see
  [two papers printing one dispatch](../../decisions/two-papers-printing-one-dispatch-are-one-witness.yml).
  The only independent local trace found is a line of country correspondence in a Mercer County
  weekly a week later: *"Mrs. John Vondrehl was at Lima last Saturday and Sunday seeing the sights
  caused by the flood."* [verified] — *The Celina Democrat*, 23 July 1915, page 8.
properties:
  occurred: 1915-07-16
  event_type: flood
  location_description: |
    The Ottawa River through Lima, and the country east and west of it — [Harrod](../place/harrod.yml)
    ten miles east, where fifteen houses and the Methodist Church went, and the farms toward
    [Elida](../place/elida.yml) to the north-west, where the water was reported higher than in
    1913. No gauge stood anywhere in the county. [verified] —
    [the wire dispatch](../../catalog/chronicling-america.md) of 16 and 17 July 1915.
