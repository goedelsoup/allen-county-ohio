class: office
label: Engineer of Allen County
description: |
  The office responsible for the county's roads and bridges, and the only county office whose
  holder must be qualified twice over. Ohio requires the county engineer to be "a registered
  professional engineer and a registered surveyor, licensed to practice in this state". [verified] —
  [Ohio Revised Code §315.02](../../catalog/ohio-revised-code.md).

  **The same section bars four of this county's other elected officers from holding it**: "No person
  holding the office of clerk of the court of common pleas, sheriff, county treasurer, or county
  recorder is eligible to hold the office of county engineer." [verified] — same source. Every one
  of those four offices exists in this corpus, which is what makes the clause readable as a graph
  constraint rather than a sentence.

  **What the office maintains, in its own numbers:** 353 miles of county road, 550 miles of township
  road, 371 bridges and over 1,400 culverts. [verified] —
  [the county engineer's site](../../catalog/allen-county-official-site.md). Nine hundred miles of
  road is the physical form of a county that is mostly not city; see
  [the townships](../place/allen-county.yml).

  The present term runs 6 January 2025 to 31 December 2028, four years. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md);
  the length is arithmetic on those dates and not a statute this corpus has read. [inference]

  [open] Why the office maintains township roads at all, and on what terms. The corpus records the
  550-mile figure without the arrangement that produces it.
properties:
  office_type: elected
  selection_method: countywide election
  term_length: 4 years
  seats: "1"
