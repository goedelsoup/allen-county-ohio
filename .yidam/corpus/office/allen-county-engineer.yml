class: office
label: Engineer of Allen County
description: |
  The office responsible for the county's roads and bridges, and the only county office whose
  holder must be qualified twice over. Ohio requires the county engineer to be "a registered
  professional engineer and a registered surveyor, licensed to practice in this state". [verified] —
  [Ohio Revised Code §315.02](../../catalog/ohio-revised-code.md).

  **The same section bars four of this county's other elected officers from holding it**: "No person
  holding the office of clerk of the court of common pleas, sheriff, county treasurer, or county
  recorder is eligible to hold the office of county engineer." [verified] — same source. Every one
  of those four offices exists in this corpus, which is what makes the clause readable as a graph
  constraint rather than a sentence.

  **What the office maintains, in its own numbers:** 353 miles of county road, 550 miles of township
  road, 371 bridges and over 1,400 culverts. [verified] —
  [the county engineer's site](../../catalog/allen-county-official-site.md). Nine hundred miles of
  road is the physical form of a county that is mostly not city; see
  [the townships](../place/allen-county.yml).

  The present term runs 6 January 2025 to 31 December 2028, four years. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md);
  the length is arithmetic on those dates and not a statute this corpus has read. [inference]

  [open] Why the office maintains township roads at all, and on what terms. The corpus records the
  550-mile figure without the arrangement that produces it.

  **A federal inventory now stands beside those figures, and the two counts differ by seven.** The
  National Bridge Inventory holds **364** bridges in Allen County — 242 owned by the county, 103 by
  the state, 19 by municipalities and none at all by a township — against this office's 371.
  [verified] — [the bridges](../measure/allen-county-bridges-2025.yml). The inventory admits only
  structures spanning more than twenty feet, and its shortest here is 6.4 metres against a threshold
  of 6.1, so the seven are short rather than absent. [inference]

  **The zero is this office's own statute, seen from Washington.** No township in the county owns a
  bridge, because the county engineer "shall have general charge of the ... maintenance, and repair
  of all bridges and highways within the engineer's county, under the jurisdiction of the board of
  county commissioners", while townships build and improve roads. [verified] —
  [Ohio Revised Code §5543.01](../../catalog/ohio-revised-code.md). §5591.02 puts the bridges inside
  municipal corporations on the commissioners too, where the road is a county road and not a state
  highway. [verified] — same source.

  **And the condition figures are a ladder by owner.** None of the state's 103 is in poor condition;
  29 of this office's 242 are, and 4 of the municipalities' 19. [verified] —
  [the bridges](../measure/allen-county-bridges-2025.yml). Twelve per cent is the number attached to
  this office, and it is the number a reader should attach to it rather than the county-wide nine.
  [inference]

  **It spends nothing from the General Fund and $8,456,595 from the Motor Vehicle and Gas Tax
  fund** — administration $1,243,366, roads $4,113,070, bridges $1,564,124, bill-back $1,212,510 and
  the garage $323,525, in 2025. [verified] — [the Auditor's financial statements](../../catalog/allen-county-auditor-financials.md); see
  [the General Fund](../measure/allen-county-general-fund-2025.yml). The office is paid for by the tax on the
  fuel burned on the roads it maintains, and it costs more than every other elected county office
  except the sheriff. [inference] — computed there.
  **It was the County Surveyor for its first seventy-three years.** John Jackson held it from 1831
  and thirteen more men followed under that title to Charles E. Craig in 1904. [verified] —
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml). The statutory
  requirement this node opens with — a registered professional engineer *and* a registered surveyor
  — is the older office still visible inside the newer one. [inference]

