class: office
label: Clerk of the Lima Municipal Court
description: |
  The elected clerk of the [Lima Municipal Court](../jurisdiction/lima-municipal-court.yml), chosen
  for a six-year term — the longest elective term in this county — and appearing on the ballot of
  all eighty-eight precincts. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **The court has two judges and one clerk, and all three are elected by the same county-wide
  electorate on the same six-year term.** [verified] — same source; see
  [the judgeship](judge-of-the-lima-municipal-court.yml). The corpus held the judgeship since its
  courts phase and not this office, which is the ordinary shape of the omission: a court is
  remembered by who decides in it.

  [open] What the clerk does, and whether the office also serves the county's traffic and small
  claims dockets. The roster gives a name, a term and a website.
properties:
  office_type: elected
  selection_method: countywide election
  term_length: six years
  seats: "1"
