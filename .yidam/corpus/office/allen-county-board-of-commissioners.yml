class: office
label: Board of Allen County Commissioners
description: |
  The county's governing body, and the first multi-seat office in this corpus. Three commissioners
  hold it at once, elected countywide to four-year terms. [verified] —
  [Ohio Revised Code §305.01](../../catalog/ohio-revised-code.md): "The board of county
  commissioners shall consist of three persons."

  **The three seats are distinguished by the day their terms begin, one day apart.** One seat runs
  from the first day of January after its election; of the two elected together, one begins on "the
  second day of January next after his election" and the other on "the third day". [verified] —
  same source. Allen County's roster shows exactly that: 1 January 2023, 2 January 2025 and
  3 January 2025. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md). The
  dates were read before the statute was, and the statute predicted them.

  That staggering is why the board never turns over at once, and why
  [`succession-audit`](../../skills/succession-audit.md) must not treat concurrent holders here as
  the defect they would be on [the sheriff](allen-county-sheriff.yml). This is the office the
  `seats` property was declared for, and until this phase nothing in the corpus used it that way.

  The board meets in general session every Tuesday and Thursday. [verified] —
  [the county's site](../../catalog/allen-county-official-site.md).

  **Sixty-eight men held it in its first ninety years, and the seat's calendar has moved twice.**
  The first board — James S. Daniels, John G. Wood and Samuel Stewart — sat in June 1831, and by
  December Morgan Lippincott had replaced Stewart. [verified] —
  [the board of 1831–1920](../measure/allen-county-commissioners-1831-1920.yml). The 1906 history
  says the term then "began in September following the election"; the 1921 history reports a term
  "expiring January 21, 1923"; the three seats now begin on 1, 2 and 3 January. [verified] — the two
  histories and the lookup above. Three different calendars and the corpus can date neither change.
  [open]

  **The staggering has been fought over.** In November 1920 three commissioners were elected at once
  to seats of unequal length, and W. W. Craig "took exception to the election returns, claiming that
  he received more votes than either of the others, entitling him to the long term of service". He
  got one. [verified] —
  [A Standard History of Allen County, 1921](../../catalog/rusler-allen-county-1921.md); see
  [the contested election](../event/the-contested-commissioner-election-of-1920.yml). It is the only
  account this corpus holds of how the seats are assigned when they are filled together.

  **The 1921 history states the office's reach in a sentence the statute does not.** "While all
  other county officers have their duties outlined by statute, the county commissioners have
  latitude. They may use their own discretion in many things." It adds that they "have control of
  all public property, and if they see fit they may even sell the courthouse", that the county
  auditor is an ex-officio member who keeps the record of proceedings, and that the sheriff
  preserves order. [verified] — same source.

  [open] What the board's powers are, and how they divide from the other eight elected offices.
  The corpus holds the statute that constitutes the board and none of the chapters that empower it.
  **It spent $3,304,189 from the General Fund in 2025**, the second-largest departmental figure in
  the fund, and it is also the fund's only miscellaneous revenue: $115,500 of rent from Marimor
  Industries. [verified] — [the Auditor's financial statements](../../catalog/allen-county-auditor-financials.md); see
  [the General Fund](../measure/allen-county-general-fund-2025.yml).
properties:
