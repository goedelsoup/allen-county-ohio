class: office
label: Auditor of the City of Lima
description: |
  The elected fiscal officer of the [City of Lima](../jurisdiction/city-of-lima.yml), chosen
  citywide for a four-year term running 1 January to 31 December. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  **Lima elects an auditor and no treasurer; Delphos elects both.** The other city in this county
  fills a treasurer's office that Lima's roster does not carry at all. [verified] — same source.
  Two cities of the same class in the same county keeping different sets of fiscal offices is what
  a charter does. [inference]
properties:
  office_type: elected
  selection_method: citywide election
  term_length: four years
  seats: "1"
