class: office
label: Judge of the Court of Common Pleas, Probate Division
description: |
  The single-seat bench for wills, estates, guardianships and — on the county's own arrangement of
  its courts — juvenile matters, which are administered together here. [verified] —
  [the county's court-system page](../../catalog/allen-county-official-site.md), which lists Probate
  Court and Juvenile Court as separate sites; [inference] that one elected judge covers both follows
  from the roster naming only a Probate Division seat among the four.

  One judge holds it, on a six-year term running 9 February 2021 to 8 February 2027. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **Its term expires second-soonest of any seat in this corpus**, on 8 February 2027, behind only
  [the offset commissioner's](allen-county-board-of-commissioners.yml) 31 December 2026. [inference]
  — computed here across the seventeen seats whose current term dates the corpus holds.

  The [court's rules](../../catalog/allen-county-common-pleas-local-rules.md) govern practice in the
  Probate Division and the Juvenile Division "where applicable", treating them as two divisions
  where the ballot treats them as one seat. [verified]
properties:
  office_type: judicial
  selection_method: countywide election
  term_length: 6 years
  seats: "1"
