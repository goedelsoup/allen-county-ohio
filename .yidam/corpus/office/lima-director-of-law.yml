class: office
label: Director of Law of the City of Lima
description: |
  The elected chief legal officer of the [City of Lima](../jurisdiction/city-of-lima.yml), chosen
  citywide for a four-year term running 1 January to 31 December. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  It is the city's counterpart to the
  [county prosecuting attorney](allen-county-prosecuting-attorney.yml), and like it, elected rather
  than appointed. [inference] Delphos elects one too. [verified] — same source.

  [open] Whether this office prosecutes in the
  [Lima Municipal Court](../jurisdiction/lima-municipal-court.yml), whose territory is the whole
  county rather than the city. Nothing read here says who prosecutes a misdemeanour committed in a
  township.
properties:
  office_type: elected
  selection_method: citywide election
  term_length: four years
  seats: "1"
