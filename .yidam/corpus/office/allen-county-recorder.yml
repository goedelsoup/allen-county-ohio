class: office
label: Recorder of Allen County
description: |
  The office that keeps the county's record of who owns what. It maintains deeds, mortgages and
  liens, and also records property lines, maps, plats, powers of attorney and military discharges,
  indexing them so that a chain of ownership and any encumbrance on it can be established.
  [verified] — [the county recorder's site](../../catalog/allen-county-official-site.md).

  **It is the office that would answer several of this corpus's open questions.** The 151 acres of
  [the Hover farm](../person/james-a-hover.yml) contracted to
  [the Solar Refining Company](../organization/solar-refining-company.yml) in 1886, and the
  ownership chain from Solar to [the refinery's](../site/lima-refinery.yml) present operator, are
  both recorded here and in no source this corpus holds. [inference]

  The present term runs 6 January 2025 to 31 December 2028, four years, and the present holder's
  service began in January 2005. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md) and
  [the recorder's site](../../catalog/allen-county-official-site.md).

  The holder of this office is barred by statute from also being
  [county engineer](allen-county-engineer.yml). [verified] —
  [Ohio Revised Code §315.02](../../catalog/ohio-revised-code.md).

  [open] Whether the recorder's index is searchable without charge, and how far back it runs. The
  corpus records what the office holds without establishing what a member of the public can get.

  **It spent $388,472 from the General Fund in 2025.** [verified] — [the Auditor's financial statements](../../catalog/allen-county-auditor-financials.md); see
  [the General Fund](../measure/allen-county-general-fund-2025.yml).
