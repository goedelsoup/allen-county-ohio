class: office
label: Coroner of Allen County
description: |
  The office that determines cause of death where a death is violent, suspicious, or otherwise not
  plainly natural. Ohio requires its holder to be a physician: "a physician who is licensed under
  Chapter 4731. of the Revised Code to practice medicine and surgery or osteopathic medicine and
  surgery, and who is in good standing in the person's profession", and to have held that licence
  for at least two years before election. [verified] —
  [Ohio Revised Code §313.02](../../catalog/ohio-revised-code.md).

  That requirement makes the coroner the only county office here whose candidate pool is fixed by a
  profession rather than by residence, and in a county of about a hundred thousand people the pool
  is small. [inference]

  The office investigates deaths from crime, violence, suicide or suspicious circumstances, performs
  autopsies and toxicology, determines blood alcohol in fatal crashes, and testifies as an expert
  witness. [verified] — [the county's site](../../catalog/allen-county-official-site.md).

  The present term runs 6 January 2025 to 31 December 2028, four years. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  [open] What happens in an Ohio county where no qualified physician stands. §313.02 as read here
  states the requirement and does not say, and the corpus has not found the section that does.

  **It spent $475,391 from the General Fund in 2025.** [verified] — [the Auditor's financial statements](../../catalog/allen-county-auditor-financials.md); see
  [the General Fund](../measure/allen-county-general-fund-2025.yml).
  **It is the only county office whose line does not begin in 1831.** The 1906 roster opens the
  coroners at 1844, thirteen years after the county was organized and after every other office, and
  prints 1862 as a year with no name against it. [verified] —
  [the officers of 1831–1906](../measure/allen-county-officers-1831-1906.yml). Whether the county
  had no coroner in those years or the book had no record of one is not settled here. [open]
properties:
