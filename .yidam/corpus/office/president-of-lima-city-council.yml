class: office
label: President of Lima City Council
description: |
  The presiding officer of the council of the [City of Lima](../jurisdiction/city-of-lima.yml),
  elected citywide for a four-year term, and the only seat on that council that the whole city
  votes for. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  Its term runs 1 January to 2 January four years later, where the mayor's runs 1 December to
  30 November and four of the seven ward seats run 5 January to 6 January. [verified] — same
  source.

  [open] What the office does. Ohio's statutory forms give a council president a presiding role
  and a place in the line of succession to the mayor, and Lima has a charter this corpus has not
  read, so nothing here states this office's powers.
properties:
  office_type: elected
  selection_method: citywide election
  term_length: four years
  seats: "1"
