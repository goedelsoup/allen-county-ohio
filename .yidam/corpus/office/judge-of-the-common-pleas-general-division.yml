class: office
label: Judge of the Court of Common Pleas, General Division
description: |
  The county's trial bench for civil and criminal matters of general jurisdiction, and the office
  the `office` ontology named as a worked example before any instance of it existed.

  **Two judges hold it at once**, which makes it the second multi-seat office in this corpus after
  [the board of commissioners](allen-county-board-of-commissioners.yml). [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md), which
  assigns two of the county's four common pleas judges to the General Division.

  **Its terms run six years and the two seats are offset by two.** One runs 1 January 2025 to
  31 December 2030 and the other 9 February 2023 to 8 February 2029. [verified] — same source; the
  length is arithmetic on those dates. [inference] So the two seats never fall vacant together, the
  same effect the [commissioners'](allen-county-board-of-commissioners.yml) statute achieves by
  staggering, reached here by a different means. [inference]

  [open] Why one seat's term begins in January and the other's in February. The commissioners' and
  the auditor's odd dates both turned out to be statutory, and this corpus has not read the section
  that would explain these.

  The [court's own rules](../../catalog/allen-county-common-pleas-local-rules.md) call this the
  "General Trial Division" and name a separate Criminal Division beside it, which has no elected
  judge of its own. [verified]
properties:
  office_type: judicial
  selection_method: countywide election
  term_length: 6 years
  seats: "2"
