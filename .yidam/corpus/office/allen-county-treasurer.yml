class: office
label: Treasurer of Allen County
description: |
  The office that collects the county's taxes and holds its money. It collects real estate and
  manufactured home taxes, bills the county's sanitary sewers, administers delinquent accounts, and
  invests county funds. [verified] —
  [the county treasurer's site](../../catalog/allen-county-official-site.md).

  **It collects what [the auditor](allen-county-auditor.yml) assesses**, which is why the two
  offices are separate and separately elected: the body that values property does not receive the
  money. [inference]

  The site also names the office as a voter registration location under Ohio Revised Code
  §3503.10. [verified] — same source. The corpus has not read that section. [open]

  **Its term dates are the only irregular ones on the county roster**, running 1 September 2025 to
  2 September 2029 where the other seven single-seat offices run 6 January 2025 to 31 December 2028.
  [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  An off-cycle term ordinarily follows an appointment to a vacancy, and this corpus has retrieved no
  source that says one happened here. The September dates are recorded as read and not explained.
  [open] See [the present tenure](../tenure/treasurer-2025-krista-n-bohn.yml).

  **The treasurer's own site does not print the holder's name in text**, only in an image. The name
  in this corpus comes from the elections roster. [verified] — same source. That is worth saying
  because it is the one county office whose own publication would not have answered the question.

  The holder of this office is barred by statute from also being
  [county engineer](allen-county-engineer.yml). [verified] —
  [Ohio Revised Code §315.02](../../catalog/ohio-revised-code.md).
  **It spent $341,014 from the General Fund in 2025 and passed $139,249,231 through its hands.**
  The office is the cheapest of the county's elected offices to run and it collects the real estate
  tax for every taxing district in the county. [verified] — [the Auditor's financial statements](../../catalog/allen-county-auditor-financials.md); see
  [the General Fund](../measure/allen-county-general-fund-2025.yml). See
  [what passes through the books](../measure/allen-county-funds-2025.yml); the county's own share of
  that collection is 3.3 per cent. [inference]
properties:
  office_type: elected
  selection_method: countywide election
  term_length: 4 years
  seats: "1"
