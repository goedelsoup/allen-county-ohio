class: office
label: Mayor of Lima
description: |
  The elected chief executive of the [City of Lima](../jurisdiction/city-of-lima.yml), a single
  seat filled at a citywide election for a four-year term. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  It was seeded with no holders, on the reasoning that an office node is meaningful without its
  tenures — it records that the position exists, on what terms, and within which jurisdiction —
  while a tenure without an office would have nothing to attach to. It stayed empty for a hundred
  commits, and not because the source was missing: the roster names this mayor, and the corpus had
  read one precinct's page of it. **It now has a holder**, and that holder is
  [Sharetta T. Smith](../tenure/mayor-2025-sharetta-t-smith.yml), 2025 to 2029. [verified]

  **The term dates are now evidence where there was none.** This office's year begins 1 December,
  the city council's on 2 and 5 January, and every office of Delphos on 1 January. [verified] —
  same source. One city keeping three calendars at once is what a charter looks like from outside
  it. [inference]

  **It now has both ends of its line and none of the middle.** The first holder was
  [Henry D. V. Williams](../person/henry-d-v-williams.yml), elected when the town organized on
  29 March 1842. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md); see
  [the organization](../event/organization-of-the-town-of-lima-1842.yml).

  **The 1885 book prints the mayor of every year from 1842 to its own printing**, with the recorder,
  treasurer, marshal and trustees beside each — Baxter, Milligan, Harriott, Melhorn, Newell, Hughes,
  Hamilton and the rest, about forty holders in forty-three years. [verified] — the 1885 history.

  [open] This corpus has written two of them. Forty tenures is a phase of its own and the source is
  already on the shelf.

  **There is a charter.** The city's own site links "Lima City Charter and Code" to the American
  Legal Publishing code library. [verified] —
  [the city's site](../../catalog/city-of-lima-official-site.md).

  So the four term calendars this office sits among are charter-made rather than statutory, and the
  home-rule question this node opened with is answered in one direction. [inference]

  [open] What the charter says — about this office's powers, its term, and who acts when the seat is
  vacant. The code library returns 403 to an automated client, so the document is located and
  unread. Evidence about a charter is still not a charter.
