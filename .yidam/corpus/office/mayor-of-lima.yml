class: office
label: Mayor of Lima
description: |
  The elected chief executive of the [City of Lima](../jurisdiction/city-of-lima.yml), a single
  seat filled at a citywide election for a four-year term. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md).

  It was seeded with no holders, on the reasoning that an office node is meaningful without its
  tenures — it records that the position exists, on what terms, and within which jurisdiction —
  while a tenure without an office would have nothing to attach to. It stayed empty for a hundred
  commits, and not because the source was missing: the roster names this mayor, and the corpus had
  read one precinct's page of it. **It now has a holder**, and that holder is
  [Sharetta T. Smith](../tenure/mayor-2025-sharetta-t-smith.yml), 2025 to 2029. [verified]

  **The term dates are now evidence where there was none.** This office's year begins 1 December,
  the city council's on 2 and 5 January, and every office of Delphos on 1 January. [verified] —
  same source. One city keeping three calendars at once is what a charter looks like from outside
  it. [inference]

  **It now has both ends of its line and none of the middle.** The first holder was
  [Henry D. V. Williams](../person/henry-d-v-williams.yml), elected when the town organized on
  29 March 1842. [verified] —
  [History of Allen County, 1885](../../catalog/leeson-allen-county-1885.md) and
  [History of Allen County, 1906](../../catalog/miller-allen-county-1906.md); see
  [the organization](../event/organization-of-the-town-of-lima-1842.yml).

  **The 1885 book prints the mayor of every year from 1842 to its own printing**, with the recorder,
  treasurer, marshal and trustees beside each. [verified] — the 1885 history.

  **It has been read, and the corpus's estimate of it was wrong twice over.** This node said "about
  forty holders in forty-three years"; the line is **twenty-four men over twenty-seven terms in
  forty-four years**, and three of the twenty-four served two separate terms. [verified] —
  [the line of mayors](../measure/lima-mayors-1842-1886.yml), where every year and every name is
  published.

  **Four of the twenty-four have nodes and twenty do not**, which is a decision rather than an
  unfinished job: a holder earns a node where something about that holder does not fit the line.
  [inference] — see [a line of holders is a table](../../decisions/a-line-of-holders-is-a-table.yml).
  The four are [Samuel A. Baxter](../person/samuel-a-baxter.yml), who was mayor twice and appointed
  once between and probably wrote half the 1906 county history;
  [George W. Overmyer](../person/george-w-overmyer.yml), the only mayor in the line no election
  produced; [Richard Metheany](../person/richard-metheany.yml), who held five offices over
  twenty-six years; and [H. S. Prophet](../person/h-s-prophet.yml), about whom two sources
  disagree.

  **Thirty-six of those years are now read, and the office turns out to have an end date.** The 1906
  history prints the mayors to 1904 with dates and the 1921 history prints them in order to the
  last one, and on **1 January 1922 Lima abolished the office** and went to a commission-manager
  charter. [verified] —
  [the 1906 history](../../catalog/miller-allen-county-1906.md) and
  [the 1921 history](../../catalog/rusler-allen-county-1921.md); see
  [the mayors of 1886 to 1922](../measure/lima-mayors-1886-1922.yml) and
  [the commission government](../event/lima-adopts-commission-government-1922.yml). So the gap is
  not one span of a hundred and thirty-nine years but two offices with a charter between them.

  **The term was two years and is now four.** "The mayor and members of City Council have hitherto
  served two years." [verified] — the 1921 history. The property below is the current roster's.

  **And the sitting mayor's line begins earlier than this corpus said.** The city's own site records
  that Sharetta Smith was **first elected in 2021** and is serving her second term, and that she is
  the first woman and the first African American elected to lead the city. [verified] —
  [the city's site](../../catalog/city-of-lima-official-site.md). The elected-officials roster gives
  a current term and not a start of service, which is what
  [a roster of elected officials is not a record of elections](../../decisions/a-roster-of-elected-officials-is-not-a-record-of-elections.yml)
  says about it in general and what it turns out to mean here.

  [open] The ninety-nine years from 1922 to 2021 — whether Lima had a mayor at all under the
  commission charter, when it returned to one, and who held it. No source here spans them.

  **There is a charter.** The city's own site links "Lima City Charter and Code" to the American
  Legal Publishing code library. [verified] —
  [the city's site](../../catalog/city-of-lima-official-site.md).

  So the four term calendars this office sits among are charter-made rather than statutory, and the
  home-rule question this node opened with is answered in one direction. [inference]

  **And the charter now has a date and an origin.** A movement to replace the aldermanic form with
  the commission-manager plan began early in 1919; a commission was named and instructed to draft a
  charter; the 1912 revision of the Ohio Constitution is what made it available; and it "secures
  home rule for Lima except that the charter shall in no way interfere with the tax limit laws of
  the state governing municipalities". [verified] — the 1921 history. The inference above is
  answered from a source in one direction and dated.

  [open] What the *present* charter says — this office's powers, its term, and who acts when the
  seat is vacant. The 1921 account describes the charter of 1922, and a century of amendment sits
  between. The code library returns 403 to an automated client, so the document is located and
  unread. Evidence about a charter is still not a charter.
properties:
  office_type: elected
  selection_method: citywide election
  term_length: four years
  seats: "1"
