class: office
label: Clerk of Courts of Allen County
description: |
  The custodian of the record for the county's courts. The office handles the "filing, preservation,
  retrieval and public dissemination of all documents and records" for the Court of Common Pleas,
  its Domestic Relations Division, and the Third District Court of Appeals. [verified] —
  [the clerk of courts' site](../../catalog/allen-county-official-site.md).

  **It serves a court that is not the county's own.** The Third District Court of Appeals sits over
  seventeen Ohio counties, and its records for this one are kept here — so the office is the point
  where a county officer does work for a regional court. [inference] The corpus holds no node for
  either court; see the gap below.

  The office also runs an Auto Title Division, which is where a motor vehicle title is issued in
  this county. [verified] — same source. That is the office's highest-volume public function and
  has nothing to do with courts. [inference]

  The present term runs 6 January 2025 to 31 December 2028, four years. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).
  The holder of this office is barred by statute from also being
  [county engineer](allen-county-engineer.yml). [verified] —
  [Ohio Revised Code §315.02](../../catalog/ohio-revised-code.md).

  [open] The courts themselves. Allen County has a Court of Common Pleas with general, domestic
  relations, probate and juvenile divisions, a municipal court, and four sitting common pleas
  judges on six-year terms — and this corpus holds no node for any of them.
properties:
