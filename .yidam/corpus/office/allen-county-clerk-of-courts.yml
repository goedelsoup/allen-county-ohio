class: office
label: Clerk of Courts of Allen County
description: |
  The custodian of the record for the county's courts. The office handles the "filing, preservation,
  retrieval and public dissemination of all documents and records" for the Court of Common Pleas,
  its Domestic Relations Division, and the Third District Court of Appeals. [verified] —
  [the clerk of courts' site](../../catalog/allen-county-official-site.md).

  **It serves a court that is not the county's own.** The
  [Third District Court of Appeals](../jurisdiction/third-district-court-of-appeals.yml) hears
  appeals from seventeen Ohio counties, and its records are kept here — so the office is the point
  where a county officer does work for a regional court. [verified] —
  [the court's own site](../../catalog/third-district-court-of-appeals.md), which names the
  seventeen. That count was an [inference] on this node for one phase and is now read from the
  source.

  The office also runs an Auto Title Division, which is where a motor vehicle title is issued in
  this county. [verified] — same source. That is the office's highest-volume public function and
  has nothing to do with courts. [inference]

  The present term runs 6 January 2025 to 31 December 2028, four years. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).
  The holder of this office is barred by statute from also being
  [county engineer](allen-county-engineer.yml). [verified] —
  [Ohio Revised Code §315.02](../../catalog/ohio-revised-code.md).

  The courts this office serves now have nodes:
  [the Court of Common Pleas](../jurisdiction/allen-county-court-of-common-pleas.yml),
  [the Lima Municipal Court](../jurisdiction/lima-municipal-court.yml) — whose territory is the
  whole county despite its name — and
  [the Third District](../jurisdiction/third-district-court-of-appeals.yml). [verified] — the
  sources named above.

  [open] The relationship between this office and the municipal court. The clerk's own site names
  the common pleas court, its domestic relations division and the Third District, and does not name
  the Lima Municipal Court, which suggests that court keeps its own clerk. The corpus has not
  established it.
