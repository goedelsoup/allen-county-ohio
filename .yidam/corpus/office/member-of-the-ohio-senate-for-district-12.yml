class: office
label: Member of the Ohio Senate, 12th District
description: |
  Allen County's seat in the upper chamber of the Ohio General Assembly, under the map adopted
  29 September 2023. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  Its term is four years, running 1 January 2025 to 31 December 2028. [verified] — same source;
  the length is arithmetic on those dates. [inference] So this county's two legislators serve terms
  of different lengths, and its senator outlasts two of its representative's.

  **This is not a seat Allen County fills by itself.** Under the 2020 map the county was roughly a
  seventh of Senate District 12 by land area, and while the corpus cannot say what fraction it is
  now, a Senate district covering one county is not a shape Ohio draws. [inference] See
  [the district](../division/ohio-senate-district-12-2023.yml).

  [open] Which other counties share this seat. The 2020-map node could not say either, and the
  county-to-district files that would answer it stop at 2020.
