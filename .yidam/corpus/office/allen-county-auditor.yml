class: office
label: Auditor of Allen County
description: |
  The county's chief fiscal officer and its assessor of real property. The auditor is chosen
  "quadrennially in each county" and holds office "for four years", and the term begins "on the
  second Monday in March next after his election". [verified] —
  [Ohio Revised Code §319.01](../../catalog/ohio-revised-code.md).

  **It is the only county office here whose term does not begin in January**, and the roster bears
  the statute out: the present term runs 13 March 2023 to 7 March 2027, and 13 March 2023 was the
  second Monday of that month. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  The office keeps the real-property records and financial statements, licenses dogs, regulates
  weights and measures, administers unclaimed funds and runs the county land bank. It also
  administers **current agricultural use valuation**, which taxes farmland on what it yields rather
  than what it would sell for. [verified] —
  [the county's site](../../catalog/allen-county-official-site.md). That last function is a live
  one here: the county was 92.5 per cent farmland in 1910 and the corpus has no later measurement
  of how much it is now. See [the county's farms](../measure/allen-county-farms-1900-1910.yml).

  [open] How much of Allen County is presently enrolled in current agricultural use valuation. The
  auditor's office is the body that would know, and this corpus has not asked it.
