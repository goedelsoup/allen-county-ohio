description: |
  The single-seat bench for divorce, dissolution, custody and support in Allen County. [inference] —
  the division's subject-matter is not established by any source this corpus holds; the name is.

  One judge holds it, on a six-year term running 1 January 2023 to 31 December 2028. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md); the
  length is arithmetic on those dates. [inference]

  The [court's rules](../../catalog/allen-county-common-pleas-local-rules.md) name a Domestic
  Relations Division among the five divisions they govern, and the county maintains a separate site
  for it. [verified] — same rules and
  [the county's court-system page](../../catalog/allen-county-official-site.md).

  [open] Whether this division also hears juvenile matters. The county's site groups Probate and
  Juvenile together and lists Domestic Relations apart, which suggests not, and the corpus has not
  established the assignment.
