class: office
label: Judge of the Third District Court of Appeals
description: |
  The appellate bench that hears Allen County's appeals, and the office this corpus declined to
  write one phase ago. Four judges hold it, on six-year terms. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  **All four terms begin in February and no two expire in the same year**, running to 8 February
  2027, 8 February 2029, 10 February 2029 and 8 February 2031. [verified] — same source. Two expire
  two days apart in 2029, which is the same device the
  [board of commissioners](allen-county-board-of-commissioners.yml) uses to keep seats
  distinguishable. [inference]

  **Its holders are chosen by seventeen counties, of which this is one.** That is why last phase
  gave them no nodes and why this phase does. The rule then was that this corpus writes a person
  where *Allen County's own electors* choose the officer; applied to its next case that rule also
  excluded the county's state senator and state representative, which would have gutted a civic
  reference. The rule is replaced and this office follows the replacement. See
  [a scope rule met its second case](../../decisions/a-scope-rule-met-its-second-case.yml).

  It is a judicial office at six years, like every other judicial office here, against four for the
  county's elected administrators. [inference] — computed across this corpus.

  [open] How a judge of this court is assigned to a panel, and whether all four sit on every appeal.
  The corpus holds four judges of one court and nothing about how the court decides.

  **Allen County's share of this court cost $30,542 in 2025**, the smallest departmental figure in
  the county's General Fund. [verified] — [the Auditor's financial statements](../../catalog/allen-county-auditor-financials.md); see
  [the General Fund](../measure/allen-county-general-fund-2025.yml). Seventeen counties choose these judges and
  this is what one of the seventeen pays toward them. [inference]
properties:
