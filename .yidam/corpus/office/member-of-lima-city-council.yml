class: office
label: Member of Lima City Council
description: |
  A seat on the council of the [City of Lima](../jurisdiction/city-of-lima.yml), filled by the
  voters of one of the city's seven wards for a four-year term. [verified] —
  [the elected officials roster](../../catalog/ohio-boe-elected-officials-allen.md), which names
  seven separate offices, one per ward, each with a single seat.

  **It is the only elective office in Allen County filled by a district smaller than a whole
  government.** Every village here elects its council at large, both township boards are elected
  township-wide, and Delphos elects three members at large beside two by ward. Lima elects all
  seven of its council members by ward and none at large. [verified] — same source; see
  [the city's government](../measure/lima-city-government-2026.yml).

  **The seven are staggered by the parity of the ward number.** The odd wards — first, third,
  fifth and seventh — began terms on 5 January 2026; the even wards — second, fourth and sixth —
  began on 1 January 2024. [verified] — same source. So four seats and three seats alternate at
  two-year intervals, and no election can turn over the whole council.

  [open] Why the odd wards commence on 5 January and the even ones on 1 January, when both are
  four-year terms of the same office. The roster gives the dates and not the rule behind them.
