class: office
label: Prosecuting Attorney of Allen County
description: |
  The county's prosecutor, and also its lawyer. The office runs five divisions: Criminal, which
  prosecutes "hundreds of felony cases annually"; Juvenile; Civil, which "provides legal
  representation to county officials, townships, and agencies"; Children Services; and Victim
  Assistance. [verified] —
  [the county prosecutor's site](../../catalog/allen-county-official-site.md).

  **The civil division is the part that makes this office structural rather than adversarial.** It
  is counsel to the other eight elected county offices and to all twelve
  [township governments](../jurisdiction/amanda-township.yml), which means one elected officer
  advises every other one. [inference]

  The present term runs 6 January 2025 to 31 December 2028, four years. [verified] —
  [Ohio county elected officials lookup](../../catalog/ohio-boe-elected-officials-allen.md).

  [open] Whether the prosecutor must be an attorney admitted in Ohio. It would be surprising if
  not, and the corpus has not read the section that says so — the same discipline it applied to
  [the coroner](allen-county-coroner.yml), where the requirement was retrieved rather than assumed.
properties:
