class: division
label: Division
foundational_type:
  ontology: ufo
  type: kind
description: |
  A bounded area that an authority defines as a unit of administration, election, or
  statistical reporting, and that holds no governmental authority of its own — a ward, a
  voting precinct, a census tract, a congressional district. It is irreducible because it is
  the grain at which elections and public statistics are reported, and because it is redrawn
  on a schedule that has nothing to do with the jurisdictions it sits inside.
edge_policy: characteristic
# Raised from 30 after the first gate run. A division node that states which ground it
# does and does not coincide with is doing the job the class exists for, and 30 lines
# would not hold that argument.
# Raised again, from 38, when every edge in the corpus gained a `claim_tag` and — where
# verified — a `source`. That is roughly a line and a half per link, and it is structured
# metadata rather than prose. `node-too-long` counts whole files, so a corpus that makes its
# edges auditable is charged for it against a budget written to stop descriptions sprawling.
# The budget is doing the wrong job here; raising it is the local fix and the finding is
# recorded in `.yidam/decisions/upstream-findings.yml`.
max_lines: 45
properties:
  - name: division_type
    type: string
    description: ward | voting precinct | census tract | congressional district | school attendance zone
  - name: identifier
    type: string
    description: The number or code the drawing authority knows it by.
  - name: effective_from
    type: date
    description: When this boundary took effect. A division is only meaningful with its dates.
  - name: effective_to
    type: date
    description: When it was superseded, if it has been.
  - name: drawn_by
    type: string
    description: The authority that drew it.
  - name: area_sq_mi
    type: string
    description: Land area in square miles, with the geography the figure is drawn from.
edges:
  - relationship: nested-in
    target: jurisdiction
    direction: out
    description: The unit of government whose territory contains this division.
  - relationship: nested-in
    target: division
    direction: out
    description: A larger division containing this one — a precinct within a ward.
