class: period
label: Period
foundational_type:
  ontology: ufo
  type: event
description: |
  A named span the corpus interprets as a unit — the canal era, the oil boom,
  deindustrialization. It shares UFO's event type with the class above and is nonetheless a
  different thing: an event has a date and participants, while a period has bounds and a
  character and is what other things are situated in. The distinction is not duration but
  whether the node is a happening or an interpretation of a span, and it is the corpus that
  authors the interpretation.
edge_policy: characteristic
# `max_lines` is this class's p90 description length, rounded up to five, measured
# 2026-09-06 over all 7 instances. The estimator is the decision and is recorded in
# `.yidam/decisions/node-length-limits.yml`; recompute it from the corpus, never raise it
# because a node exceeded it.
max_lines: 100
properties:
  - name: began
    type: date
    description: When the span opens, at the precision the corpus can defend.
  - name: ended
    type: date
    description: When it closes; absent means the corpus treats it as ongoing.
  - name: character
    type: text
    prose: true
    description: What makes this span a unit rather than an arbitrary interval.
  - name: boundary_basis
    type: text
    prose: true
    description: What fixes the start and end dates, and how contested they are.
edges:
  - relationship: precedes
    target: period
    direction: out
    description: The span that follows this one.
  - relationship: evidenced-by
    target: measure
    direction: out
    description: A figure this period's characterization rests on, so the basis is traversable.
