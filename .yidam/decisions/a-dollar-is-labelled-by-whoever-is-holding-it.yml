id: a-dollar-is-labelled-by-whoever-is-holding-it
summary: >-
  The same money that Allen County's libraries book as "state government revenue" appears in the
  county auditor's books as a conduit fund the county holds for somebody else, and would appear in a
  national comparison as the county failing to fund its libraries. Three books, one dollar, three
  labels, and no single set of accounts is wrong. Where the corpus reports who pays for something it
  must say whose books it is reading.
context: |
  [The Public Libraries Survey](../catalog/imls-public-libraries-survey.md) classifies revenue by
  who wrote the cheque. Allen County's three libraries report $4,622,683 from state government,
  $194,728 from local government and $417 from federal — three per cent local, against a United
  States figure of 85.5 per cent. Read alone, the file says this county does not pay for its
  libraries.

  [The county's own fund report](../corpus/measure/allen-county-funds-2025.yml) carries a fund named
  "local government library and township parks" which took in and paid out $4,495,636.25 in 2025,
  to the cent — one of the fifteen conduits that phase identified, money the county holds and passes
  on. Read alone, it says the library money is somebody else's and the county is a cashier.

  [ORC 5747.47](https://codes.ohio.gov/ohio-revised-code/section-5747.47) is the instrument, and it
  names no library at all: the tax commissioner estimates and certifies each *county's* total
  entitlement to the public library fund and pays it monthly to the county auditor, who allocates it
  through the budget commission. So the state's books record a payment to a county, the county's
  books record a fund it does not own, and the library's books record a receipt from the state.

  Each account is accurate about its own transaction. Every one of them, read as an answer to "who
  pays for the library in Allen County", is misleading in a different direction.
decision: |
  **A statement about who pays for something names the books it was read from, and the corpus does
  not difference figures drawn from different sets.** Where two sources describe the same money at
  different points in its passage, the corpus reports both and says they are the same money; it does
  not add them, subtract them, or reconcile them to a residual.

  **Three specific consequences here.**

  1. The libraries' "3 per cent local" is reported as a fact about the survey's classification and
     immediately qualified by Ohio's funding structure. It is not reported as a fact about what this
     county chooses to spend, because Allen is the sixteenth-lowest of Ohio's 88 counties on that
     measure and the county with the lowest is at zero.
  2. The county's $4,495,636.25 conduit and the libraries' $4,622,683 of state revenue are named as
     the same instrument and are not equated. The fund also carries township parks, two of the three
     libraries serve across a county line, and the two figures are for different years.
  3. A comparison across states is a comparison of funding structures before it is a comparison of
     generosity. The national 85.5 per cent local share is not a benchmark Ohio failed to meet; it
     is a description of an arrangement Ohio does not use.
rationale: |
  **This is the third member of a family and the family is now visible.**
  [The administrative key is not the thing](the-administrative-key-is-not-the-thing.yml) catches a
  field that is present and means something other than it appears to.
  [An index of the held is not an inventory of the made](an-index-of-the-held-is-not-an-inventory-of-the-made.yml)
  catches a record that is absent and is read as the absence of the thing. This one catches a fact
  that is present in several records at once, each true, and irreconcilable without naming the
  vantage. The first is answered by asking what act created a row; the second by asking what would
  have listed the row; the third by asking whose ledger this row is in.

  **It is also the first of the three the corpus caught by looking rather than by being surprised.**
  The other two were found when something disagreed — a polygon, a search that came back empty. This
  one was found by reading a new source against a figure the corpus already held, which is the third
  question the administrative-key rule prescribes and the first time a phase has run it deliberately.

  **The narrow reason to write it down is that the corpus is about to accumulate more of these.**
  Sixty-seven sources, and the ones that describe money — a county fund report, a school finance
  survey, a hospital cost report, a disaster assistance file, and now a library survey — each
  classify by a different vantage. Nothing in the corpus has said what to do when two of them
  describe the same dollar. This does.
