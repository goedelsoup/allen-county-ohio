id: a-table-is-the-line-and-a-tenure-is-the-turn
summary: >-
  The tenure class had not gained a node in fifty-six phases, because an earlier decision sent every
  line of holders into a measure and nothing said when a tenure node was still right. This says it:
  the table carries the line, and a tenure node is written where the record says how a holding began
  or ended out of course. A succession is a figure; a turn is a relator.
context: |
  [A line of holders is a table](a-line-of-holders-is-a-table.yml) was written about the sheriffs and
  it was right about them: thirty-nine names and thirty-nine year-pairs are a figure about an office,
  and thirty-nine relator nodes carrying nothing else would be a graph made out of a spreadsheet.

  What it did not say is what tenure is *for*, and the answer turned out to be nothing. Across
  fifty-six phases this corpus dotted a ninety-nine-year hole in Lima's mayoralty, dated thirteen
  judges' admissions to the bar, named four mayors and a fifth, read two villages' election returns
  and found a mayoral candidate shot dead — and every one of those went into a measure, as a row.
  [State after eighty-three phases](state-after-eighty-three-phases.yml) counted the result: `tenure`
  frozen at 80 while `measure` grew by 30.

  The class is not redundant. Nine of the eighty existing tenures carry a `how_ended` that no table
  column would hold — a sheriff shot dead in his own jail in October 1933, his son appointed after
  him, a sheriff who served for part of one year in 2017 — and those nine are why the class was
  built.
decision: |
  **A line of holders goes in a measure. A tenure node is written when the source says something
  about that particular holding which a row of the table cannot carry** — how it began, how it
  ended, or that it did not run its course.

  In practice, three tests, any one of which is enough:

  1. **The holding started or ended out of course.** Appointed to a vacancy, resigned, died in
     office, removed, elected "vice" a named predecessor, or serving part of a year.
  2. **The record gives a reason and not only a date.** "Resigned in 1852 to enter Congress" is a
     fact about a holding. "1855" is a fact about a line.
  3. **The holding is the subject of something else in the corpus** — an event, a question, a
     dispute between sources about who held the seat and when.

  **A tenure node written under this rule cites the table it was lifted from, and the table keeps
  the row.** The two are not alternatives: the measure remains the succession of record and the
  tenure is an annotation on one entry of it. Nothing is moved out of a measure to make a tenure.

  **What this does not license.** It is not a warrant to convert existing tables. The eighty tenures
  that exist stay, the tables that exist stay, and the rule applies going forward to what a new
  source actually says. A roster that gives names and years and nothing else produces a measure and
  no tenures, however many names it has.
rationale: |
  **The frozen class was a symptom of a decision working too well.** `a-line-of-holders-is-a-table`
  answered "how do I record thirty-nine sheriffs" and was read, correctly enough, as "how do I record
  officeholders". A rule that answers a narrow question and is applied to a wide one does not fail
  loudly; it just quietly eliminates a category of node, and the only way to see it is to count the
  class over a long stretch. That is what the state account was for.

  **The test is the same one the corpus already applies to events.** An `event` is written when a
  happening has a date and participants, not when a date can be attached to something that persists.
  A `tenure` is the relator counterpart: it earns a node when the *holding* is the thing with
  properties, not when the office is. The 1906 county roster, read against this rule, produces one
  measure of 169 names and exactly two tenure nodes — for a resignation to enter Congress and the
  election that filled it — which is the proportion the rule should give on a source of that kind.

  **The cost, stated so the next account can check it.** This rule will keep `tenure` small and slow.
  If it is right, the class should grow by ones and twos where a source is talkative and not at all
  where a source is a list. If in fifty phases it is still at 80, the rule is too strict; if it has
  doubled, something is being converted that should have stayed a row.
