id: an-exact-match-is-a-question
summary: >-
  The Eviction Lab and the Supreme Court of Ohio publish the same eviction counts for this county —
  982, 922 and 863, to the unit, in three of the four years both cover. That looks like two sources
  confirming each other and it is one court's docket counted once and published twice. Where two
  publishers agree exactly, the corpus traces the chain before calling it corroboration.
context: |
  This corpus already knows that distance between publishers is not independence.
  [two papers printing one dispatch are one witness](two-papers-printing-one-dispatch-are-one-witness.yml)
  says so about newspapers carrying wire copy, and its rule — *count agencies and datelines, not
  papers* — is written for a world of bylines. Administrative statistics have no datelines, and the
  same failure arrives without any of the signals that rule was built to read.

  Two national-looking sources for evictions in Allen County:

      year   Supreme Court of Ohio    Eviction Lab
      2008                     982             982
      2011                     922             922
      2014                     863             863
      2017                     802             806

  One is a research lab in New Jersey publishing a county panel for the whole country. The other is
  the judicial branch of a state government publishing a 293-page statistical report. Nothing about
  the two institutions suggests a shared origin, and there is only one: **the Lima Municipal Court's
  own docket**, reported to Columbus under Rule 37 of the Rules of Superintendence and separately
  obtained from the court by the lab.

  Read as corroboration this would be very strong — two independent measurements agreeing to the
  unit on a count near a thousand. Read correctly it is one measurement, and the agreement is a
  statement about two transcription pipelines rather than about how many evictions were filed.

  The four-case gap in 2017 is the part that carries information: it shows the two are not literally
  the same file, and it bounds how much the pipelines can disagree.
decision: |
  **Exact agreement between two publishers is treated as a hypothesis about shared origin until the
  chain is traced. Name the origin of each figure; where it is the same, say what the agreement
  tests and what it does not.**

  - **Trace to the act of counting, not to the publisher.** The question is never *who published
    this* but *who counted it*, and administrative data usually has exactly one counter: the office
    that had to open the file in the first place.
  - **Exactness is itself the tell.** Two genuinely independent counts of a real-world quantity
    nearly always differ a little, because they draw their boundaries at slightly different places.
    A match to the unit across several years is evidence of a common ancestor, not of accuracy.
  - **Say what the shared-origin agreement does establish**, because it establishes something: that
    neither pipeline dropped, double-counted or misaligned the figure between the registry and the
    page. That is worth knowing and it is not corroboration of the count.
  - **A small disagreement is more informative than a perfect match.** Where the two differ — four
    cases in 2017 — record the size, because it is the only measurement available of how much the
    pipelines can drift.
rationale: |
  **This is the modern-records half of an existing rule.** The wire-service rule catches a fact
  copied between newspapers. This catches a fact copied between a court, a state compilation, a
  research lab and a corpus, in a world where every link is a different institution with a different
  address and none of them is a witness.

  **The failure flatters.** A corpus that finds two sources agreeing will write *confirmed by two
  independent sources* and mean it, and the sentence is more persuasive than anything the evidence
  supports. Nothing in either publication says where its numbers came from with enough precision to
  stop that, so the check has to be a habit rather than a reading.

  **It bears on which disagreements matter.** The Eviction Lab publishes three county series for
  this county that differ from one another by 47 to 116 filings a year; those disagreements were
  treated as a finding, under [three witnesses and three dates](three-witnesses-and-three-dates.yml).
  The present rule is the same coin: where sources with a common origin *disagree*, the difference
  measures the pipelines; where they *agree*, the agreement measures the pipelines too. Neither
  reaches the county.

  **What this does not license.** Discarding a figure because a second source repeats it, or
  refusing to publish agreement. The eviction count is well established here — by a court that had
  to open a file for each case — and the point of the rule is to attribute that strength to the
  docket rather than to the coincidence of two covers.
status: accepted
date: "2026-09-03"
