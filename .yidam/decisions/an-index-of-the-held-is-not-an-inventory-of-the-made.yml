id: an-index-of-the-held-is-not-an-inventory-of-the-made
summary: >-
  For six phases this corpus treated the digitized newspaper archive as the county's newspaper
  record, and wrote "no Lima newspaper is in it" as though that were a fact about Lima. It is a fact
  about the archive. Ninety-nine papers were printed in this county and one of them is online. The
  rule is that a search index answers what is held, never what was made, and the second question has
  its own source.
context: |
  [Chronicling America](../catalog/chronicling-america.md) has been the corpus's contemporaneous
  source since it was cataloged, and it holds exactly one Allen County title. Everything written
  about the county's press followed from that one weekly: which mayors could be named, which
  elections could be counted, which years of the county's war were legible. The catalog entry stated
  the limit honestly and correctly — "No Lima newspaper is in it. The county seat had daily papers
  through the whole of this period and none of them is digitized here" — and then the corpus went on
  reasoning as though the archive's shape were the county's.

  What was never asked, in six phases of using it, is how many newspapers this county actually had.
  The answer is in a different Library of Congress collection on the same host, reachable by the
  same JSON route, and it took one request:
  [ninety-nine titles](../corpus/measure/allen-county-newspapers-1843-2026.yml), 66 of them printed
  in Lima, running from [4 March 1843](../corpus/organization/the-porcupine.yml) to now.

  The concrete cost is measurable. The corpus carries an open interval for
  [Lima's mayors 1922–1939](../corpus/office/mayor-of-lima.yml) and has treated it as unreachable
  because the digitized Bluffton run opens in 1939. The directory shows that the same paper is on
  microfilm at Bowling Green State University continuously from 28 May 1896 to 31 December 1960. The
  gap was never out of reach. It was outside a search box.
decision: |
  **An index of what is held is not an inventory of what was made, and the corpus asks both
  questions separately.** Before any claim about the absence of a record — no paper covered this, no
  register exists, nothing was published — the corpus must name the source that would list the thing
  if it existed, and say whether that source was consulted. "It is not in the archive I searched" is
  a finding about the archive and must be written that way.

  **Three practical consequences.**

  1. A negative result from a full-text search is evidence about coverage, not about the past. The
     corpus already learned the near version of this — a bad search reported as a property of the
     source, corrected in the Chronicling America entry a phase after it was written. This is the
     far version: a *correct* search reported as a property of the county.
  2. Union lists, finding aids and directories are a distinct class of source, and this corpus has
     been thin on them. They hold no facts about the world; they hold facts about what facts are
     obtainable, which is what tells a reader whether an `[open]` marker is a research task or a
     permanent limit.
  3. Where a holdings record shows that an unread run covers a gap the corpus has marked open, the
     marker gets the location written into it. An open question with a reel number is a different
     object from an open question without one.
rationale: |
  **This is the complement of the administrative key, not a repeat of it.**
  [The administrative key is not the thing](the-administrative-key-is-not-the-thing.yml) is about a
  field that is present and means something other than it appears to. This is about a record that is
  absent and is read as the absence of the thing. Both are failures of the same kind — taking a
  property of the paperwork for a property of the county — and both are silent, but they need
  different checks. The first is answered by asking what act created a row. The second is answered
  by asking what would have listed the row if it existed.

  **The reason it went six phases unnoticed is that the limit was stated.** Nothing was hidden. The
  catalog entry said the archive holds one Allen County paper and named the consequence for every
  fact taken from it. What it did not say, because nobody asked, is what the denominator was. A
  stated limit with no denominator reads as a small qualification; the same limit against
  ninety-nine reads as one per cent.

  **The corpus's own scale is the argument for the rule.** Sixty-five sources were cataloged before
  this one, and not one of them is a finding aid. Every source held here was chosen because it
  answers a question about Allen County. A source that answers *what could be asked* about Allen
  County had never been sought, and the first one retrieved immediately reopened a gap the corpus
  had written off.
