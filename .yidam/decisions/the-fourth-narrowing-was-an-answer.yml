id: the-fourth-narrowing-was-an-answer
summary: >-
  `state-a-refusal-at-the-grain-it-protects` ended by naming a stopping condition: a refusal narrowed
  every time evidence brushes past it can be narrowed into meaninglessness, so if a fourth narrowing
  arrived, that was the moment to ask whether the caveat still had a subject. The fourth event
  arrived, and it was not a narrowing. County Business Patterns answered the refusal outright.
context: |
  [`deindustrialization`](../corpus/period/deindustrialization.yml) has carried one caveat since
  genesis, in three successive wordings, guarded by two tests:

      "It does not establish that 1970 is the start"        retired — the 1990 Census volume
      "that Lima peaked in 1970 rather than earlier"         retired — the 1960 Census volume
      "manufacturing employment ... at all"                  narrowed — the 1910 Ohio supplement
      "manufacturing employment inside this period"          ANSWERED — County Business Patterns

  The answer is thirty-six years of Allen County manufacturing employment, every year of it inside
  the period: 15,762 in 1986, 7,127 in 2010, 8,573 in 2022. The period is named for a mechanism, and
  the mechanism is now measured.

  The stopping condition therefore has to be applied, and applying it means asking a question this
  corpus set for itself in advance and could have quietly skipped.
decision: |
  **The caveat keeps its tests and changes its subject.**

  It used to say the corpus held no measurement of the cause. It now says the corpus does not
  establish that the population decline was *caused by* the manufacturing decline — and it says so
  from a stronger position than before, because the two series can finally be laid side by side and
  between 2010 and 2022 they move in opposite directions: private employment down 3,709,
  manufacturing employment up 1,446.
rationale: |
  **Asking the question honestly meant being willing to delete the tests.** The condition was
  written to catch a corpus that keeps a caveat alive by trimming it, and the failure mode it guards
  is exactly the one available here — "manufacturing employment inside this period" could have been
  trimmed to "before 1986" and the tests left standing. That trim would have been true. It would
  also have been the fourth consecutive retreat of a sentence that never conceded anything, which is
  the pattern the condition exists to stop.

  **What saved the caveat was that its subject was never really the measurement.** A population
  chart invites a causal reading. The corpus declined that reading for eleven phases on the grounds
  that it had not measured the cause — which was true, and was never the whole reason. The reason is
  that a population series cannot establish a cause however many other series sit beside it. The
  absence of the measurement was standing in for the argument, and the measurement arriving is what
  made the difference visible.

  **The new pin is better by the standard that set the old one.**
  [pin the tripwire to what retrieval cannot answer](pin-the-tripwire-to-what-retrieval-cannot-answer.yml)
  asked for a refusal that no retrieval closes. The old pin failed that test in the end — a Census
  file closed it. Causation does not have a file. Nothing downloadable will answer whether the
  people left because the factories did, so this pin is stable in a way its predecessor was not, and
  it is stable for a reason rather than by luck.

  **The finding underneath all this is about the period, not the caveat.** Manufacturing employment
  here bottomed in 2010 and has risen a fifth since, while the county kept losing people and jobs.
  The largest employment loss of the last twelve years is in health care, down from 11,744 to 9,151.
  A period named for a mechanism that stopped operating fifteen years ago has an end-bound problem
  it did not have while the mechanism was merely unmeasured, and the node now says so. [open]

  **The counter-consideration.** Repointing a test rather than deleting it can be a way of keeping a
  favourite sentence alive under a new name, and this is the fourth time this particular test has
  moved. The defence is that the move is a change of subject rather than a trim — the old phrase is
  not a substring of the new one, and the old claim is now asserted rather than refused. If a fifth
  event arrives, the question to ask is not whether the caveat has a subject but whether the test
  has become a habit.
status: accepted
date: "2026-08-30"
