id: a-depth-needs-both-of-its-ends-named
summary: >-
  The National Park Service says the Deep Cut "ranges at places to 52 feet in depth". The
  one-metre elevation model says 45.8 feet, and it also says 31.8 feet. All three numbers are
  right and no two of them measure the same thing: they run from the top of the spoil bank, from
  the top of the spoil bank, and from the surrounding fields, and they stop at the canal's bottom,
  at its water surface, and at its water surface. A depth is a difference between two surfaces and
  is meaningless until both are named.
context: |
  The county's only National Historic Landmark was re-measured from the elevation surface this
  corpus already holds, at one metre rather than the thirty used for the county. Four numbers came
  out of it, and the first three-way disagreement was between the second and the source.

      what was measured                                          feet
      water in the cut, above sea level                         835.3
      highest spoil-bank crest above that water                  45.8
      the fields at that same section, above that water          27.8
      the nomination's claim                                     52

  Nothing is wrong with any of them. The nomination is measuring from the top of the bank to the
  bottom of the canal. The model cannot see the bottom of the canal, because the cut still holds
  water and an elevation surface returns whatever is on top — which is also why the reading is
  level to 1.8 inches over 7,375 feet, a flatness no silted bed would show.
  [Miller's 1906 history](../catalog/miller-allen-county-1906.md) gives the Miami extension five
  feet of water. 45.8 and 5 make 50.8, against a claim of 52, and the disagreement that looked like
  six feet is one foot and a bit.

  The second pair is worse, because both ends are on the surface and the choice is still free. The
  spoil thrown out of the cut sits beside it in banks that stand above the ground they were thrown
  onto. At the deepest section the cut measures 45.8 feet from the crest of its bank and 27.8 feet
  from the fields either side, and the eighteen feet between those two numbers is earth that came
  out of the hole being counted as part of its depth.
decision: |
  **Every depth, height, thickness or fall published here names the two surfaces it runs between,
  in the sentence that carries the figure. Where a re-measurement disagrees with a source, compare
  the datums before concluding that either is wrong.**

  Three consequences, in the order they arise:

  *Name the top.* "Deep" is not a property of an excavation. Depth below the original grade, depth
  below the spoil bank, and depth below the modern road embankment are three different quantities
  about the same trench, and a reader given one of them without its datum cannot convert it into
  either of the others.

  *Name the bottom.* An elevation model returns the topmost return — water, canopy, pavement, spoil
  — and never the floor of anything that is covered. A depth taken from such a surface stops at
  whatever is floating on the thing, and saying so is not a caveat but half the measurement.

  *Reconcile before contradicting.* A published figure that a re-measurement fails to reproduce is
  a datum question until it is shown to be something else. Two of the three figures here were
  reconciled by a third source supplying the five feet of water between them.
rationale: |
  **Why this is not [an extreme in a surface has an address](an-extreme-in-a-surface-has-an-address.yml).**
  That rule governs a single number taken from a surface and asks where it is. This one governs a
  *difference* of two numbers and asks what the other one was. The quarry rule would have passed
  every figure above: each is located, each is on real ground, and each is the height of something
  that is there.

  **The volume is the same defect in another form, and it does not resolve.** The excavation still
  open below the surrounding grade comes to 449,450 cubic yards if the original ground is taken
  from 80 metres out and 706,339 if it is taken from 170 metres out — a spread of 57 per cent that
  is entirely a choice about where the top of the hole is. There is no third source to settle this
  one, so the figure is published as a range with the choice stated, and never as a single number.

  **What it generalises to.** Any quantity that is a difference of two elevations or two levels:
  the depth of a quarry (rim, or the ground before the overburden was stripped), the height of a
  building (grade, or the plinth), a river's stage (gauge datum, or sea level), the fall of a
  ditch, the thickness of a coal seam, the freeboard of a levee. In every case the arithmetic is
  trivial and the two ends are the whole content, and in every case a source that omits them
  invites a re-measurement to disagree with it for no reason.

  **What it cost to learn.** One afternoon in which a federal nomination looked wrong by six feet
  and was not.
status: accepted
date: "2026-09-04"
