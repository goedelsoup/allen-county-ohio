id: located-here-is-not-of-here
summary: >-
  The second-largest field of study in Allen County is vehicle repair, and it is one institution's
  whole output, and two thirds of that institution's entering students come from other states. A
  county-level statistic assembled by summing what sits inside the county's boundary can describe
  something that is only incidentally the county's. This says when to sum and when to say whose.
context: |
  Six post-secondary institutions have addresses in Allen County. Summed, they award 2,918
  credentials a year, of which 706 — 24.2 per cent — are in mechanic and repair technologies. A
  reader would take that for a fact about this county's economy: that it trains mechanics, that it
  has a repair industry, that its young people go into vehicle work.

  Every one of the 706 is from the University of Northwestern Ohio, and of its 877 first-time
  students in autumn 2023, **582 were not Ohio residents** — 101 from Michigan, 83 from Indiana, 48
  from Pennsylvania, 31 from New York. The county's other institutions that report the question
  draw 99.1 and 97.0 per cent of their entering students from Ohio.

  So the aggregate is arithmetically correct and tells the reader something false. It is not that
  the number is wrong; it is that "Allen County awards 706 credentials in vehicle repair" and
  "Allen County trains 706 mechanics" are different sentences, and the first invites the second.

  The corpus has met the shape before without naming it. Its refinery is owned from Illinois and
  its output is sold across a pipeline network. Its tank plant is federal property operated under
  contract. Its largest employer's jobs are half held by people who live in other counties. Each
  time the node said so in prose, and no rule said when saying so is required.
decision: |
  **A county aggregate is a fact about ground, not about a community. Where the two come apart,
  the node must say whose the thing is, in the same block as the figure.**

  - **Sum by boundary when the question is about the boundary.** How many students are enrolled
    inside this county, how many jobs are located here, how much is refined here — these are real
    questions and the sum is the answer.
  - **Do not let a boundary sum stand as a claim about the county's people** without a second
    figure that bears on whose it is: residence, ownership, destination, catchment. Where that
    second figure exists, publish it beside the first. Where it does not, say the sum is a fact
    about ground.
  - **The disclaimer belongs in the block with the number**, not in a later paragraph and not in an
    open. A reader who takes the figure and stops reading must not be able to take the wrong thing.
  - **Where one member dominates an aggregate, name it.** An average of six institutions in which
    one supplies a quarter of the total is not a description of six institutions.

  **The rule fired a second time, on the sharpest quantity a county has.** Ohio published its
  pandemic deaths twice, once by the decedent's county of residence and once by the county the
  death occurred in. **815 people died of COVID-19 in Allen County and 513 of them lived here.**
  Of Ohio's eighty-two counties with a hundred or more resident deaths, this one has the largest
  ratio between the two — 1.589 — ahead of Gallia, of Franklin, of Lucas and of Hamilton, which is
  to say ahead of the counties that hold Columbus, Toledo and Cincinnati. Four of its five land
  neighbours run the other way: Hardin recorded a fifth of its own dead, Putnam two fifths,
  Auglaize a half, Van Wert two thirds. The fifth is Hancock, which has a hospital of its own.
  [verified] — [Ohio's dashboard files](../catalog/ohio-covid-19-dashboard-files.md), the matched
  pair of 3 May 2023; see
  [the place of death](../corpus/measure/allen-county-covid-place-of-death-2020-2023.yml).

  **What the second case adds is that both numbers are wanted, for different questions.** The
  university case had one right answer — say whose the credentials are — because nobody asks how
  many mechanics are trained on a given patch of ground. Here they do: 815 is the load the county's
  hospitals and its coroner carried, and 513 is the loss its households took. A corpus that keeps
  only the residence figure cannot describe what happened inside the county, and one that keeps
  only the occurrence figure has attributed three hundred deaths to the wrong families. Both are
  published, each is labelled, and neither is called the county's death toll without the word that
  says which.

rationale: |
  **This is a different failure from the ones the corpus already has rules for.**
  [a postal address is not a municipality](a-postal-address-is-not-a-municipality.yml) and
  [the name is the seat not the extent](the-name-is-the-seat-not-the-extent.yml) are about a thing
  being in the wrong place on a map. Here nothing is in the wrong place: the university is in Allen
  County, its awards are conferred in Allen County, and the sum is right. What is wrong is the
  inference the sum invites about who the county is.

  **It is also the mirror of [the flow is real and the cell is not](the-flow-is-real-and-the-cell-is-not.yml).**
  That rule protects a figure that is safe in aggregate and unsafe at grain. This one protects
  against a figure that is safe at grain — one university, one field, one year, all verifiable —
  and becomes unsafe when aggregated to a boundary that means something else to the reader.

  **The cost of getting it wrong here would have been particular.** This corpus has spent phases
  establishing that Allen County's largest employer is health care and its best-paid sector
  manufacturing. A finding that its colleges principally train mechanics would have looked like a
  mismatch between education and employment, and somebody would have drawn a conclusion about a
  county failing to train for its own labour market. The mismatch is real and the explanation is
  that one of the six institutions is a national school that happens to stand here.
status: accepted
date: "2026-08-31"
