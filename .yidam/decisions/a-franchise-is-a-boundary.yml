id: a-franchise-is-a-boundary
summary: >-
  Allen County cast 13,718 presidential votes in 1908 and 26,082 in 1920, on a county that grew by
  a fifth. The corpus refuses that subtraction on the same ground it refuses one across an
  annexation: the electorate was enlarged by amendment and nobody moved. Two breaks are written
  into the county's vote series, at 1920 and at 1972, and the shares cross both.
context: |
  The presidential series is six nodes and 132 years — 1884, 1908, 1920, 1964, 1996, 2016 — and
  until this phase it carried no comparability judgement anywhere on it. Judging it meant deciding
  what a count of ballots is a count *of*.

      1884    7,903      county 31,314 (1880)
      1908   13,718      county 56,580 (1910)
      1920   26,082      county 68,223            <- +90% on a county up a fifth
      1964   38,887      county 103,691 (1960)
      1996   43,948      county 109,755 (1990)    <- +13% on a county up 6%
      2016   45,815

  The 1920 step is unmissable and the corpus had already noticed it in prose: that node has said
  since it was written that November 1920 was the first presidential election held here after the
  Nineteenth Amendment, and that no return held here separates the new electors from the old.

  **The 1964-to-1996 step is the one that needed a rule.** Thirteen per cent against six is an
  ordinary-looking difference; it does not announce itself; and the Twenty-sixth Amendment sits
  inside it, putting eighteen-, nineteen- and twenty-year-olds into an electorate that had begun at
  twenty-one — in a county whose baby-boom cohorts were exactly the ones it admitted. A rule that
  only fires on the obvious case is a rule that would have missed this one.
decision: |
  **A change in who is entitled to vote breaks a series of votes cast, and the break is written as
  `not-comparable-to` with the amendment named in `because`.**

  In the range this corpus holds, two breaks fire:

      1920   the Nineteenth Amendment    written on allen-county-presidential-vote-1920
      1972   the Twenty-sixth Amendment  written on allen-county-presidential-vote-1980-1996

  The Fifteenth Amendment of 1870 falls before the series' first published figure and does not
  bite. What crosses a break and what does not:

      crosses          party shares, margins, the county's position against the state's — every
                       ratio taken inside one election
      does not cross   the vote cast, and anything differenced from it: a rise, a rate, a
                       turnout premium computed across the break

  The three joins in the same series that no amendment falls inside — 1884 to 1908, 1920 to 1964,
  1996 to 2016 — are written `comparable-to` in the same phase, each with its own argument about
  publishers and column headings. This rule is not a licence to break a series; it fires on a
  named act and on nothing else.
rationale: |
  **Why this is the annexation rule and not a new one.** A population count is broken by a boundary
  change because the frame moved by an act rather than by anyone arriving —
  [the control is the figure that cannot move](the-control-is-the-figure-that-cannot-move.yml) is
  the whole apparatus for telling those apart. A vote count has a frame too, and it is the
  electorate. An amendment moves it by an act, on a stated date, with nobody moving house. The two
  cases are the same case, and the corpus should not need a second vocabulary for it.

  **What the rule cannot do, and says so.** It names the direction of the difference and never its
  size. Newly admitted electors vote at their own rate, no return held here separates them from
  anybody, and so there is no correction to apply — which is exactly the position the corpus is in
  after an annexation whose acreage it knows and whose population it does not. The break is a
  refusal, not an adjustment.

  **The cost, taken deliberately.** Two of the five joins in the county's longest series are now
  refused, and the tidy sentence — *the county's presidential vote grew from 7,903 to 45,815* —
  cannot be written as a single movement. What survives is better than what it replaces: the
  Democratic margin holding inside a 331-vote band from 1884 to 1908 while the vote cast grew 74
  per cent, the county running two to three points above Ohio's turnout and then two to three
  below. Those are ratios, they cross both breaks, and none of them needed the subtraction.

  **And the limit of the grain.** These are judgements about the figures the nodes publish, not
  about every row in their tables — the same limit
  [comparability is a judgement, not a join](comparability-is-a-judgement-not-a-join.yml) records.
  `allen-county-presidential-vote-1856-1884` publishes 1884 and its table runs back to 1856 across
  the Fifteenth Amendment, and no edge in this corpus says anything about that crossing.
status: accepted
date: "2026-09-06"
