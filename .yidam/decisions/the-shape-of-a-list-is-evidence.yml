id: the-shape-of-a-list-is-evidence
summary: >-
  The 1906 history prints the county board once a year for seventy-five years, and the rows turn out
  to be mechanical: each is the one before it shifted a place right, and the man in third place is
  the one who goes. Fifty-eight of sixty-three transitions after 1842 obey it exactly. The five that
  do not are all events — two double turnovers, two departures out of course, and one hole in the
  printing. Where a roster has a regular internal form, that form is a test the corpus is obliged to
  run, and every deviation is either a fact the source did not state or a defect in the source.
context: |
  This corpus has spent three phases learning what rosters cannot do.
  [An order is not a chronology](an-order-is-not-a-chronology.yml) forbade turning position into a
  year. [A table is the line and a tenure is the turn](a-table-is-the-line-and-a-tenure-is-the-turn.yml)
  set three tests for when a holding deserves a node of its own, the first being that the holder
  "started or ended out of course" — and left the corpus to recognise that by eye.

  The commissioners' roster had been left open for exactly that reason. The
  [officers measure](../corpus/measure/allen-county-officers-1831-1906.yml) said so in its own last
  paragraph: the board is printed year by year, the book admits that "really four names should be
  shown" once the term began in September, and "reading it needs a rule for that overlap and this
  node does not have one".

  The rule turned out not to be about the overlap at all. Differencing the seventy-five rows in
  order shows a shift register: the new commissioner is written first, the previous first name
  second, the previous second name third, and the third name of the old row is gone. In the
  twenty-two years when the board did not change at all, the same three men are reprinted with the
  third name moved to the front — twenty-two times out of twenty-two, without exception. The 1906
  book explains the first column as the man elected that year; the 1921 book explains it as the
  president of the board; both are true and each describes the half of the series the other does
  not.

  Running the test found four departures out of course that neither book mentions, and confirmed the
  one it does — "Alexander Shenk (vice Marshall)", the only parenthesis in seventy-five years of
  list. It also found the printing defect: 1889 is missing, and its absence manufactures two careers
  that appear to break and resume.
decision: |
  **Where a roster has a regular internal form, the corpus derives the form, states it, and treats
  every departure from it as a finding.** Not as noise, and not as something to normalise away. Each
  deviation is written down and classified: an event the source did not narrate, a defect in the
  source, or unexplained.

  **Three practical consequences.**

  1. The form has to be derived from the data and then stated as a claim with its own count, so a
     later reader can falsify it. "Fifty-eight of sixty-three" is the claim; "the list is regular"
     is not.
  2. A deviation is never repaired by editing the data to fit. The scan defects that had to be
     reconciled first — an abbreviation, two OCR misreadings, a stray comma — are named in the
     measure's `method`, because each of them would have manufactured a false event, and a reader
     has to be able to see which corrections were made before the test was run.
  3. Where the form supplies the definition of "out of course", the tenure test in
     [a table is the line and a tenure is the turn](a-table-is-the-line-and-a-tenure-is-the-turn.yml)
     becomes checkable rather than intuitive. It still takes a reason as well as an anomaly to make
     a node: this phase found five anomalies and wrote one tenure, because the book gives a reason
     for one of them.
rationale: |
  **This is the first of the roster rules that adds rather than forbids.** The three before it are
  restraints — do not read a key as a fact, do not read an index as an inventory, do not read a
  position as a year. This one says the corpus is not finished with a source when it has copied the
  source's assertions out: a list has a shape, the shape was produced by a procedure, and the
  procedure is testable. Four county commissioners left office irregularly between 1842 and 1905 and
  no book in this corpus says so. The list says so.

  **The risk it carries is over-reading, and the cost is stated so the next account can check it.**
  A pattern found in sixty-three cases will find spurious meaning in the sixty-fourth, and this
  corpus is now claiming that the 1848, 1865 and 1894 rows record departures that neither history
  narrates. That claim is tagged as inference and rests entirely on the regularity holding — if a
  second source shows the board changed in 1848 exactly as it always did, this rule is what produced
  the error, and the measure names the rows so the check is cheap.

  **It also explains why the early years look different, without deciding it.** Eight of the first
  eleven transitions break the pattern and five of the next sixty-three do. Either the board's terms
  were not yet regular in the 1830s or the compiler's sources for that decade were poorer. The shape
  is evidence that something differs; it is not evidence of which.
