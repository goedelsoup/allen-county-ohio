id: an-unopposed-race-is-not-a-landslide
summary: >-
  Bob Cupp took 100 per cent of Allen County's vote for the Ohio House in 2016 and 34,564 people
  gave it to him, out of 45,894 who came to the polls. A share is a measure of preference only where
  a preference could have been expressed; where the ballot line carried one name, the corpus
  publishes the roll-off and the raw count and refuses the share.
context: |
  Four of the thirteen General Assembly contests this county's returns reach had a single candidate:
  the Ohio House seat in 2008, 2016 and 2020, and the 12th senate district in 2016. Entered into a
  series of vote shares each would read 100 per cent Republican, and the series would then say that
  the county's most one-sided elections were the ones nobody contested.

  What the returns actually record is voters declining to take part:

      Ohio House district 4       votes    share of the top of the ticket
      2006  opposed              36,793                       101.6%
      2012  opposed              46,627                        96.7%
      2014  opposed              27,091                        99.4%
      2018  opposed              35,846                        99.7%
      2008  UNOPPOSED            39,979                        79.5%
      2016  UNOPPOSED            34,564                        75.3%
      2020  UNOPPOSED            38,882                        80.4%

  The last row is against ballots cast, because the 2020 county file carries no presidential row;
  every other is against the highest-voted statewide race on the same ballot.

  The controlled case is one seat and one man four years apart. Matt Huffman's senate district loses
  22.6 per cent of this county's voters in 2016, when nobody ran against him, and 2.9 per cent in
  2020, when somebody did.

  So the unopposed races are not the ones where agreement was greatest. They are the ones where a
  fifth to a quarter of the people who turned up left the line blank, and the winner's total is a
  count of the electorate that could be bothered rather than of the electorate that agreed.
decision: |
  **A vote share is published only for a contest that had more than one candidate. Where the ballot
  line carried one name, publish the count, publish the roll-off against the ballots cast, and say
  the line was uncontested.**

  - **Exclude the year from any series of shares, and say which years were excluded.** A gap in a
    share series with a note beside it is honest; a 100 stands in a chart forever.
  - **Establish the absence of an opponent, do not assume it from a single county's file.** Here the
    test is that the statewide file records one candidate for the district in every county it
    covers, which is what distinguishes an uncontested race from a transcription that lost a row.
  - **Roll-off is the measurement that replaces the share**, and it needs a denominator that is a
    property of the ballot rather than of the race: the highest-voted statewide contest on the same
    ballot, or the ballots cast where the file publishes them. State which was used.
  - **The rule reaches every uncontested line**, not only legislative ones: judges standing for
    retention, county offices with one filer, a levy with no organised opposition.
rationale: |
  **This is a denominator rule and it is not the one already written.**
  [a denominator can be edited](a-denominator-can-be-edited.yml) is about a register that somebody
  changed between two measurements. Here nothing was edited: the denominator is intact and it is the
  *numerator* that has lost its meaning, because a vote for the only candidate and a vote for the
  better of two are not the same act.

  **The failure is quiet and it inflates.** An uncontested race enters a partisan series as the most
  lopsided year in it, so a corpus that does not catch this will report that a county grew more
  one-sided in exactly the years its politics stopped being contested at all. Those are close to
  opposite findings.

  **The roll-off is worth having for its own sake.** It is the only measurement in this corpus of
  what voters do when they are offered no choice, and it is remarkably stable: 19.6, 20.5, 22.6 and
  24.7 per cent across four contests in three different years, against under 3.3 per cent in every
  opposed one. That is a fact about this county's electorate and not only a caveat on a number.

  **What this does not license.** Leaving an uncontested election out of the record. Who held the
  seat, with how many votes, in a year nobody opposed them is exactly the kind of thing a civic
  reference exists to say. The rule governs the share, and the share only.
status: accepted
date: "2026-09-03"
