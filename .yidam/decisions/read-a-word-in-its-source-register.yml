id: read-a-word-in-its-source-register
summary: >-
  A 1952 Census footnote calls Ottawa Township "nonexistent". This corpus has carried an open
  question about whether Ottawa was ever abolished since genesis, and that word would close it in
  one line. It does not, because in a census footnote "nonexistent" is a statement about what the
  Bureau will tabulate, and the question is about Ohio law.
context: |
  [`what-became-of-german-and-ottawa-townships`](../corpus/question/what-became-of-german-and-ottawa-townships.yml)
  has spent three phases circling one absence. Ottawa Township is described in the 1885 and 1921
  county histories, erected in May 1857 out of four named townships with acreages given twice
  thirty-six years apart, and it is in none of the present-day federal sources this corpus holds.

  Three sources have now framed the absence three ways:

    1921 history    "the township a nonentity and Lima the unit of the tax duplicates"
    1990 Census     "does not recognize an Ohio township that is coextensive with a village
                     or a city, and treats such places as independent of any MCD"
    1950 Census     "returned in 1940 as coextensive with nonexistent Ottawa township"

  The third is the bluntest and the most tempting, and it arrived last.
decision: |
  **Read a word in the register of the document that used it, and say which register you read it
  in.**

  The node records the quotation, marks the reading as an inference, and states in the same
  paragraph what the Bureau is and is not saying: that it would not recognize Ottawa as a minor
  civil division for the 1950 tabulation, and not that Ohio had abolished it. The `[open]` stays,
  and now carries its own reason — "the Census's 'nonexistent' is about tabulation and this node
  will not read it as an answer about the statute."

  **The register is sometimes established by the same paragraph, and then the reading is cheap.**
  The 1885 history quotes a settler's biography saying that between Logan County and Wapakonetta the
  Wood party "found not a trace of civilization" — and then, within four sentences, names the Indian
  town of Wapakonetta, Shawnee Town where the chief lived in a cabin beside twenty acres "of cleared
  land in good culture", the seed corn and potatoes the party bought there, and the Wyandots who
  came and helped raise their cabins. [verified] —
  [the arrival](../corpus/event/the-wood-party-reaches-sugar-creek-1824.yml). In a settler's
  narrative "civilization" means white settlement; the corpus does not need outside evidence to say
  so, because the source supplies the refutation itself. **Where a source contradicts its own word
  in its own paragraph, quote both and let the contradiction stand as the reading** — that is
  stronger than a gloss and it costs nothing to source.
rationale: |
  **The word is not wrong; it is answering a different question well.** A census footnote exists to
  explain a discrepancy between two tabulations, and "nonexistent" there means "not a unit of this
  table". The 1885 book's acreages are not in tension with it. A corpus that takes the strongest
  available phrasing from whichever source phrased it most strongly will accumulate a set of claims
  that are individually quotable and jointly incoherent.

  This is a cousin of the failure this repository keeps finding — a rule about what can be seen,
  generalised from the shape of the last thing looked at — but the mechanism is different and worth
  separating. There the error is over-generalising from one observation. Here the error would be
  importing a term of art across a boundary where it changes meaning, which no amount of further
  observation inside either source would catch. Only asking *what is this document for* catches it.

  It cuts both ways, and the same footnote shows it. "Part of Shawnee township annexed to Lima city
  in 1944" is a boundary fact and the Bureau is the right authority for it, so the corpus takes it
  flat. "Beaverdam village returned in 1940 as Beaver Dam" is a fact about census usage, and the
  corpus records it as that rather than as the village's own spelling — then checks the 1885 history
  and finds the two-word form there too. Three clauses of one footnote, read three ways, on purpose.
status: accepted
date: "2026-08-30"
