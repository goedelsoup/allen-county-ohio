id: a-roster-records-the-outcome-not-the-offer
summary: >-
  This corpus knew for ten days that twenty-five of forty-seven village officers here were appointed
  rather than elected, and could not say why, because it was reading a roster. A roster is the
  output of a process and contains none of its inputs. The ballot — the same county, the same
  offices, a public file — says in words how many people filed for each seat, and the answer was
  that nobody did. Where a record shows a state, find the record of the process that produced it
  before explaining the state.
context: |
  [The question](../corpus/question/why-allen-countys-villages-are-staffed-by-appointment.yml)
  opened on 30 August and reasoned carefully from the only file it had: the boards of elections'
  roster of seated officials. It ruled out size, ruled out the smallest-places-failing reading,
  computed seats per thousand residents for villages against the city, and got nowhere, because
  **every one of those figures is downstream of the fact it needed.**

  What it needed was one column the roster does not have: *did anyone file for this seat*. That
  column is printed on the ballot, in words, once per unsought seat — `No Valid Petition Filed`.

      November 2023 and November 2025      seats   candidates   per seat
      the seven villages                      52           25       0.48
      the twelve townships                    55           71       1.29

  [verified] — [the ballot display](../catalog/allen-county-ballot-display.md), 228 precinct
  ballots. **And the ranking the roster could not explain is the same ranking read from the other
  end**: the two villages that appoint least, Bluffton and Beaverdam, draw the most candidates per
  seat; the two that appoint most, Cairo and Harrod, draw the fewest. The roster had the shape of
  the answer in it all along and no way to say what caused it.

  The correction was not a better inference. It was a different file, from the same office, that had
  been reachable the entire time.
decision: |
  **Before explaining a state a record reports — appointed, vacant, closed, denied, imputed — ask
  what process produces that state and whether its record is separately published. Prefer the
  process record to any inference from the outcome.**

  - **Name the missing column.** The useful question is not "why are these seats appointed" but
    "what is the field that would distinguish nobody-stood from someone-left, and who publishes
    it". That reframing is what found the ballot; ten days of reasoning about population did not.
  - **The process record is usually held by the same body.** The roster and the ballots come from
    the same county board of elections, one lookup application apart. This corpus had cited the
    roster twenty times and never asked what else that office publishes.
  - **A state can have a statutory cause, and then the law is a source.** Once the ballots showed
    the seats drew nobody, ORC 731.43 supplied the rest: a village council fills its own vacancies,
    and the mayor fills them if it does not within thirty days. An outcome that looks like a choice
    was a statute operating on an absence. [verified] —
    [the Revised Code](../catalog/ohio-revised-code.md).
  - **The process record has its own blind spot and it is named, not glossed.** A printed ballot
    cannot show a write-in candidate, so a seat marked "No Valid Petition Filed" may still have been
    won by election. The corpus states that rather than letting the ballot stand as a complete
    account of how a seat was filled.
rationale: |
  **This is the civic form of a habit the corpus has been building all month against data files.**
  [a flood is not found by ranking rain](a-flood-is-not-found-by-ranking-rain.yml) says a variable
  that usually causes a thing is not a census of the thing;
  [a neighbour's gauge](a-neighbours-gauge-is-not-this-countys-record.yml) says a measurement
  describes the ground it was taken on. Both are about reading an instrument for what it can
  actually see. This one is about reading an **institution's** file the same way: a roster of who
  holds office can no more explain how they got there than a rain gauge can say a river rose.

  **What makes it worth a rule is how well the wrong reading performed.** The question's own
  paragraphs are sound — it correctly found that appointment does not run with population, and
  correctly refused the arithmetic-of-the-form explanation as insufficient. Good reasoning on the
  outcome file produced true statements and no answer, which is the failure mode that does not
  announce itself.

  **What would change this rule.** Nothing about this county. It applies wherever a corpus holds a
  register of results — officeholders, permits granted, loans made, cases closed — and wants to
  explain the pattern in it. The register is the last frame of the film.
status: accepted
date: "2026-09-09"
