id: a-weekly-reports-events-not-states
summary: >-
  The corpus's largest documented gap — ninety-nine years with no mayor of Lima in it — said "no
  source here spans them." That was true and it was the wrong test. A newspaper already in this
  catalog, published in an Allen County village and covering 1939 to 1959, names four mayors of
  Lima and a fifth as a former one. None of the mentions is an election report. A weekly is a
  witness to events, and a line of officeholders is a state; the source can date a person to a day
  and can never give a term.
context: |
  [The office of mayor of Lima](../corpus/office/mayor-of-lima.yml) carried this: "The ninety-nine
  years from 1922 to 2021 — whether Lima had a mayor at all under the commission charter, when it
  returned to one, and who held it. No source here spans them."

  One of the sources already in this catalog when that was written is
  [The Bluffton News](../catalog/chronicling-america.md), 952 issues from 1939 to 1959, the only
  Allen County newspaper in the national archive. The corpus had used it for four
  paragraphs about other things and had never asked it who the mayor was.
decision: |
  **Ask a periodical for a date, not for a series.** The gap was never going to be spanned; it can
  be sampled, and a sample of a succession is a set of points with no lines between them. Fourteen
  mentions across twenty-one issues give:

      1939–1943  Frank E. McClain      police, parking meters, an economy ax
      1944       Allen L. Metheany     a fire appropriation in March, a probate inventory in August
      1945       William L. Ferguson   a fire bureau, a baseball opener, a non-partisan primary
      1956       Clyde L. Welty        a proclamation
      (former)   Corbin Shook          named in his sister's obituary

  **Not one of them is an election report.** The paper covered Bluffton's own elections office by
  office and vote by vote, and in nothing read here did it print who had won Lima's. What it printed about Lima was
  whatever crossed a wire desk: an appointment, an ordinance, a ballgame, an estate. So the table
  above dates people to days and establishes no term, no beginning and no end for any of them —
  and that is a property of the instrument, not a failure of this reading.

  **The same instrument, turned on its own village, shows the difference and then shows the
  limit.** Bluffton's returns are complete for six elections. Extend them one year past an election
  report and they contradict themselves: W. A. Howe is reported defeated in November 1945 and named
  as mayor in May 1946, April 1951 and September 1952. Even a full election report will not carry a
  line, because holding office between elections is a state and the paper reports events.

  **So the gap is now two gaps and the corpus says so.** 1922 to 1939, where the question is when
  the mayor came back; and 1956 to 2021, where the question is who. The stretch between them is not
  filled — it is dotted.
rationale: |
  **The stated route was wrong again, and this is the fourth time.** The office node named no
  instrument at all, which is worse than naming the wrong one: a marker that says "no source here
  spans them" reads as a fact about the catalog when it is a fact about a question nobody asked.
  [one-marker-is-doing-three-jobs](one-marker-is-doing-three-jobs.yml) named this class of defect
  and this is its clearest case.

  **A negative result was already published about this source and it was too strong.** The catalog
  says "No Lima newspaper is in it. Every fact this corpus has taken from the archive about Lima was
  therefore reported from somewhere else." Both sentences are true. The conclusion drawn from them —
  that the archive is not a source about Lima — does not follow, and cost this corpus five names.

  **Why the mayors of a village are in the same phase as the mayors of a city.** Because the village
  is the control. Without it, "the paper never reported a Lima election" reads as an accident of
  what was digitized. With it, the paper is shown reporting elections in full, twelve miles away,
  in the same issues — and the asymmetry becomes a fact about what a country weekly is for.

  **What this does not license.** It does not license building a line of Lima's mayors out of these
  points, or reading a mention in one year as service in the next. It does not license inferring a
  term from two mentions with a gap between them. And it does not license the reverse either: the
  corpus does not now say the office was continuously held from 1939 to 1956, only that four people
  held it on fourteen named days.
