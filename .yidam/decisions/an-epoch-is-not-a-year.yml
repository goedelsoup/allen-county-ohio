id: an-epoch-is-not-a-year
summary: >-
  The land cover database publishes eight intervals of two and three years and reports a quantity
  per interval. Ranking the intervals by that quantity ranks them partly by how long they are, and
  five of these eight change place when the figure is divided by its own duration. A per-interval
  total from an unevenly spaced series is converted to a rate before it is compared, or it is not
  compared at all.
context: |
  [The National Land Cover Database](../catalog/mrlc-nlcd-land-cover.md) publishes a
  first-disturbance date for every pixel that changed class between 2001 and 2021, coded to the
  epoch step in which the change first appears. The steps are not the same length.

      epoch        years   acres first changed   acres a year
      2001-2004      3                  903.4          301.1
      2004-2006      2                1,131.8          565.9
      2006-2008      2                  795.3          397.6
      2008-2011      3                1,377.1          459.0
      2011-2013      2                  979.9          489.9
      2013-2016      3                  517.3          172.4
      2016-2019      3                  491.3          163.8
      2019-2021      2                  231.7          115.9

  Read down the third column and the county's land changed fastest in 2008–2011. Read down the
  fourth and it changed fastest in 2004–2006, and 2011–2013 — fifth by acres — is second. The top
  three reorder completely and five of the eight rows move.

  Neither column is wrong. The third is the honest answer to *how much ground first changed inside
  this interval* and the fourth to *how fast was it changing*, and only the second of those is a
  question about the county rather than about the publisher's release schedule.
decision: |
  **Divide by the interval before ranking, and print both columns when the ranking moves.**

  - A series whose intervals differ by more than a few per cent is unevenly spaced, and a
    per-interval total from it is a quantity with a unit of *per interval*. It may be summed. It
    may not be compared across intervals, plotted as a curve, or called a peak.
  - Where the rate and the total rank differently, both are published and the difference is stated,
    because a reader who has seen the raw series elsewhere is owed the reason this one disagrees
    with it.
  - The rule fires on the shape of the index, not on the size of the effect. It is checked whenever
    the intervals differ, including when the ranking turns out not to move.

  **And say what the index is an index of.** A *first* disturbance date is not a count of change:
  a pixel that changed twice is recorded once, in the earlier epoch, so the later epochs are
  systematically short. In this county that bias is measurable against the same product's change
  count — 2,992 of 28,902 changed pixels changed more than once, so first-disturbance misses 3,527
  of 32,429 changes, 10.9 per cent — and it runs in the direction that flatters the reading. A
  fall of five to one survives it and a fall of one and a half to one would not.
rationale: |
  The corpus already holds one rule about a number that moves for reasons that are not about its
  subject: [a fixed cost makes its own gradient](a-fixed-cost-makes-its-own-gradient.yml), where a
  ratio slopes because its denominator does. This is the same family and the arithmetic is simpler
  still — here the denominator is not even in the figure, it is in the row label. That is what
  makes it easy to miss. A table of acres against a column of date ranges looks like a series and
  is a series of eight differently sized things.

  **The honest reason to write it down is that the reading survived the correction and the phase
  nearly published the wrong peak.** The county's land-cover change does collapse: 566 acres a year
  in the middle of the 2000s against 116 in 2019–2021, a fall of nearly five to one, and that is
  the finding either way. What changes is which years the county was busiest in, and a civic
  reference that names 2008–2011 when the answer is 2004–2006 has told a reader something specific
  and false about their own decade.

  What this does not license is treating a rate as more real than a total. Where the question is
  how much ground is in a state — how many acres are developed, how many are wooded — the interval
  is not in the quantity and dividing by it produces nonsense. The rule is about a *flow* reported
  over intervals, and the test for a flow is whether doubling the interval would roughly double
  the figure.
status: accepted
date: "2026-09-06"
