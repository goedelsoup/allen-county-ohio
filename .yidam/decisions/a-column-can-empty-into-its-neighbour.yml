id: a-column-can-empty-into-its-neighbour
summary: >-
  Two columns in one federal file fall hard in one year. Allen County's certified school librarians
  go from 24 full-time equivalents to 4; its district administrators go from 76 to 25. One of those
  is a loss and the other is a boundary moving inside the form, and the only thing that separates
  them is summing each column with the columns beside it on the same reporting instrument.
context: |
  The Common Core of Data's district directory splits a school district's payroll into named
  columns. Two of Allen County's fall steeply across the run, and read one column at a time both
  read as decisions somebody made about children.

  **The librarians.** Twenty-four certified school librarians worked in the county's twelve
  districts in 1992 and four do now, a fall of 83.33 per cent. The column beside it on the same
  form is library support staff — the assistant who keeps the room open, which is exactly where the
  work would land if a district replaced a certified post with a cheaper one.

      library staff        1992   2005   2013   2024
      certified              24     15      2      4
      support                12     18     18     11
      both                   36     33     20     15
      per 1,000 pupils     1.63   1.68   1.13   0.95

  The support column did not take them. The group falls with the specialist and falls faster than
  the enrolment under it. The loss is real.

  **The administrators.** District officers fall from 76 full-time equivalents in 2005 to 25 in
  2006, a drop of 67.11 per cent in a single year, and eleven of the twelve districts land on two
  or fewer and stay there — the uniformity that
  [a value shared by unrelated records is a default](a-value-shared-by-unrelated-records-is-a-default.yml)
  says to look for. The form has four administrative columns.

      administration        2003   2004   2005   2006   2007
      district officers       61     76     76     25     25
      district office        84     76     76    116    128
      principals              68     41     42     55     56
      building office        135    120    118     78     91
      all four               348    313    312    274    300
      per 1,000 pupils     17.64  16.00  15.91  14.18  15.66

  Fifty-one full-time equivalents leave the first column in 2006 and forty arrive in the second.
  Thirteen arrive in the third and forty leave the fourth. The group falls 10.87 per cent, on a
  denominator that was itself falling, and by 2024 administration stands at 18.30 per thousand
  pupils — higher than any year before 2001. Nothing was cut. A line on a form moved.
decision: |
  **Before a fall in a reported category is published as a fall, sum it with every category the
  same instrument places beside it and read the group. If the group holds, the fall is a boundary
  move. If the group falls too, the loss is real.**

  - **The group is defined by the form, not by the reader.** Library support staff is next to
    certified librarians because the agency put it there, and that is why it is the right control.
    A grouping assembled from what seems related to a person reading the output will miss the
    reclassifications, which are made by the people who designed the form.
  - **Normalise before comparing.** A category that holds its headcount while the population it
    serves falls by a third has grown, and a category that falls with it has not moved. Both of the
    cases above change sign depending on whether the denominator is applied.
  - **A step change in one year is the tell.** Staffing does not fall by two thirds in twelve
    months and stay there. Where it appears to, look first for the column that gained.
  - **Say which test was run.** A node claiming a real decline states the group it summed and the
    figure the group gives, so a reader can see the reclassification was excluded rather than
    assumed away.
rationale: |
  **The two cases are the same shape and opposite answers, which is what makes this a rule rather
  than a story.** Both are steep single-source falls in a named column of a federal file. Reading
  either one alone gives a confident and publishable sentence, and one of those sentences is false.
  No property of the falling column distinguishes them.

  **It is the within-file counterpart of the corpus's disagreement rules.**
  [two papers printing one dispatch are one witness](two-papers-printing-one-dispatch-are-one-witness.yml)
  and [an exact match is a question](an-exact-match-is-a-question.yml) ask where two sources'
  agreement came from. This asks where one source's numbers went, and answers it the same way: by
  looking for the shared cause rather than accepting the surface.

  **It bites hardest on the findings a civic corpus most wants.** The columns that empty into their
  neighbours are the ones an agency keeps redefining, and an agency redefines what it is arguing
  about — staffing, categories of pupil, kinds of aid. A rule that let this corpus report every
  steep decline would make it loudest exactly where it is least reliable.

  **What this does not license.** Summing until a fall disappears. The group is fixed by the form
  before the arithmetic is read, and where the group still falls the node says so plainly, as it
  does for the librarians.
status: accepted
date: "2026-09-03"
