id: a-source-is-not-exhausted-by-one-question
summary: >-
  The phase before this one catalogued a 2.6 MB county history, took twelve township erection
  dates out of it, and wrote a catalog entry saying what it did not carry. The answers to nine
  standing questions about the county's villages were in the same chapters, forty lines further
  down the file that was already open.
context: |
  [the-townships-were-erected](../../README.md) retrieved the 1885 Warner, Beers & Co. history and
  read it for one thing: when each of the twelve townships was erected. That worked — eleven of
  twelve got a date and an authority — and the phase closed with a catalog entry whose last
  paragraph was headed **What it does not carry**.

  Nine `place` nodes in the same corpus were carrying `[open]` claims of a recognisable shape:

      bluffton      when the name changed from Shannon, when the village was incorporated
      cairo         when the Village of Cairo was incorporated, what the name refers to
      delphos       when the merged town was incorporated
      beaverdam     who established it
      elida         what the name refers to
      lafayette     when the settlement was established
      spencerville  when it was incorporated, and what or whom the name refers to
      harrod        who the Harrods were — no person node exists and the page gives no first names
      gomer         its name, its founding, and the Welsh settlement it is said to descend from

  Every one of them names what the county's own website *did not* say. Each was written the day
  that website was read, as the residue of one source — and then left standing while a second
  source that answers seven of the nine sat in the catalog for a phase.
decision: |
  **Read the source for the corpus's questions, not for the phase's.**

  When a source is catalogued, the standing `[open]` claims across the corpus are the retrieval
  plan, not the phase's own topic. The check is cheap: for each open claim, run the phrase through
  the text before writing "what it does not carry".

  Applied here it produced, from the same two files already on disk: Bluffton platted in 1837 as
  Shannon by Joseph Deford and renamed in 1872-73; Cairo platted in 1848 by Jacob Miller; Delphos
  incorporated by an act of February 7, 1851; Beaverdam laid out by Frederick Shull; Elida platted
  by Griffith John; Lafayette's authority granted September 3, 1867 and first election March 13,
  1868; Spencerville laid out for three Dayton men at the canal lock; William Harrod, born in Knox
  County in 1819; and Gomer laid out in 1850 with its Welsh church on record. Also the name of
  Lima, the incorporation of Lima, and a village called Hartford that died to make Spencerville.

  None of it needed a new retrieval, a new source or a new tool.
rationale: |
  The failure has a shape this corpus keeps finding and should name plainly: **a rule about what
  can be seen, generalised from the shape of the last thing looked at.** It has now appeared as a
  place roster taken from a file of governments, precinct names declared unreachable from one
  file's columns, a calculator reading silence as refutation, an empty class blamed on unopened
  sources, an open question held shut by the method it named — and now a book read for one chapter
  and then described as not carrying what was in its next paragraph.

  The catalog entry's **What it does not carry** section is where this becomes durable damage.
  Written after one pass it reads as a property of the source, and the next phase believes it.
  That section should say what was *checked and absent*, and nothing else — and here it did not:
  it named the twentieth century, which is true, while the nineteenth-century village foundings it
  was silent about were three pages from the township chapters.

  The counter-argument is real: exhausting a source is not free, and a phase that reads everything
  finishes nothing. The rule above is deliberately narrow — it asks for a text search per standing
  open claim, which is minutes, not a reading.
status: accepted
date: "2026-08-29"
