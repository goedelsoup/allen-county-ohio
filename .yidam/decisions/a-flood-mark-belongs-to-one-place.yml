id: a-flood-mark-belongs-to-one-place
summary: >-
  One Associated Press dispatch of 16 July 1915 makes three comparisons to the flood of 1913 and
  attaches each to a different place: the Ottawa at Lima was fifteen inches *below* the 1913 mark,
  farmers toward Elida reported water *higher* than 1913, and the Scioto at Kenton *passed* the
  1913 stage. A sweep of that dispatch reported to this repository that the 1915 flood passed the
  1913 crest at Lima. It did not. A comparison to a past flood is a statement about one gauge or
  one field, and it travels with that place or not at all.
context: |
  The corpus had no event for 16 July 1915 and an issue proposed one, reporting that *"multiple
  independent dispatches reportedly say it passed the 1913 crest at Lima."* Read first-hand, the
  dispatch says the opposite of that about Lima and something like it about two other places:

      Lima, on the Ottawa      "at 1 [a].m. was within fifteen inches of high water mark of 1913"
      toward Elida             "farmers report the water was higher than in the big flood of 1913"
      Kenton, on the Scioto    "Scioto river passed the 1913 flood stage at noon and still rising"

  [verified] — [the dispatch](../catalog/chronicling-america.md), *Evening Star*, Washington,
  16 July 1915, page one, all three from the same column.

  **The three are not in conflict and cannot be merged.** They are a river stage at a city, an
  impression of standing water on farmland six miles away, and a river stage in the next county on
  the other side of the continental divide. Only the first is about the Ottawa at Lima, and it is
  the one that says *below*.

  **What made the error easy is that the dispatch is one column with one headline.** *"Fears That
  Heavy Losses Experienced in 1913 Will Be Duplicated"* runs over the whole of it, and every
  paragraph under it is datelined from somewhere else. A keyword sweep that finds *1913* and *Lima*
  in one column has found them in one column and nothing more.
decision: |
  **A comparison between two floods names the place it is measured at, and the corpus does not
  carry it to a second place.**

  - **The place is part of the claim, not context for it.** "Higher than 1913" is not a fact about
    a storm; it is a fact about a stage at a gauge, a mark on a wall, or one farmer's field. Write
    the place into the sentence or do not write the sentence.
  - **A single dispatch can hold several of them, and often does.** Wire flood copy is assembled
    from datelines. Before quoting a comparison out of one, find its dateline and check that it is
    the place the corpus is writing about.
  - **Where there is no instrument, say so and keep the witness's words.** The Ottawa was not
    gauged until water year 1924, so for 1915 there is no stage to check the wire against. The node
    quotes and does not convert; see
    [an instrument dates it and a witness describes it](an-instrument-dates-it-and-a-witness-describes-it.yml),
    whose division of labour has only one side here.
  - **A place eight miles away is a different place.** The dispatch's own worst damage in this
    county — fifteen houses and a church at Harrod — is not on the Ottawa at all, but on an unnamed
    order-2 headwater reach in the Auglaize's drainage.
rationale: |
  **This is [a county row is a share of a storm](a-county-row-is-a-share-of-a-storm.yml) in prose
  instead of in a file.** There, a federal row's figures were the county's share of a storm and
  were published as the storm's. Here, a wire paragraph's comparison is one town's and would have
  been published as the county seat's. The failure is the same — a quantity read at a wider scope
  than the one it was measured at — and it is worth its own rule because the tell is different: a
  file's scope is a column you can check, and a dispatch's scope is a dateline you have to notice.

  **The corpus's existing newspaper rule is about the opposite error.**
  [Two papers printing one dispatch are one witness](two-papers-printing-one-dispatch-are-one-witness.yml)
  guards against counting one source many times. This guards against reading one source too
  broadly. Both are needed for wire copy, and this event met both: the story reached front pages
  from Pensacola to Tacoma, and every Lima paragraph in it is the same sentence.

  **What it cost to find out.** The claim came from a sweep whose verifiers never ran, and the
  issue that carried it said so. Two dispatches read end to end settled it in an afternoon, and
  the same reading turned up what the sweep had also got wrong — that three named people died. One
  woman died, of burns, when rising water put out a pilot light and she carried a lamp into the
  cellar. No dispatch read here names her.

  **What would change this rule.** Nothing about floods; it is a rule about how a comparison is
  scoped, and it would apply unchanged to a snow depth, a crowd estimate or a price. What would
  *extend* it is a case where the two places are the same place under two names, which is the
  failure this corpus has already met in
  [a postal address is not a municipality](a-postal-address-is-not-a-municipality.yml).
status: accepted
date: "2026-09-07"
