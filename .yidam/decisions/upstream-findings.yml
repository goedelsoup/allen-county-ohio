id: upstream-findings
summary: >-
  Eight findings against the pinned yidam, of which five are now fixed upstream and three remain
  open. Two defects in `yidam crates-index` found while writing the first crate — both closed by
  template v0.3.0 — two gaps in the corpus format found while tagging every edge in the graph,
  one in what genesis installs, found the first time CI ran on a remote, and one in what a
  vendored crate does to this repository's own formatting gate. Four were filed on 2026-09-04 as
  goedelsoup/yidam#587 through #590 and three of those closed at template v0.4.0. What is still
  open is #587, that an edge cannot carry a claim tag while the conventions call it a claim,
  #647, that a REGEN block the CLI gates on `--check` reads git refs and so cannot be correct in
  two checkouts of one commit at the same time — demonstrated on this repository's own `main` at
  the v0.5.0 re-vendor, where it is red — and finding 8, unfiled, that the CI staleness report
  warns on a file where it means a table.
context: |
  Found on 2026-08-28 against the pinned yidam, 0.5.0 at commit 1162287 — the version this
  repository builds from `.yidam.toml`, and the newest the origin then had. Finding 5 was found
  on 2026-08-31 against the same pin, by a different route: the repository acquired a remote and
  CI ran somewhere other than a developer's machine for the first time.

  Revisited on 2026-09-04, when the repository re-vendored to template v0.3.0 at commit 7b0cef2.
  Two of the five were fixed upstream in the interval, by an author who had not read this file —
  which is the case for keeping it, not against it: the fixes are recognisable here only because
  the findings were written down, and the workaround one of them licensed could be removed only
  because this record said where it was. Finding 6 was found the same day, by the re-vendor
  itself.

  Revisited again on 2026-09-06, at the re-vendor to template v0.4.0 (commit fc961757, cli
  v0.10.0), 112 commits upstream. Three of the four filed issues closed in that interval —
  #588 by 5a0249e, #589 by 4e75999, #590 by 59961bd — which is the return path working at the
  speed the last revisit hoped for rather than the six days of maintaining a dead workaround it
  recorded. Each closure was checked against the commit that made it and, where it licensed
  removing something here, against this repository rather than against the changelog: finding 6
  was confirmed by running the formatting gate the old way and watching it pass.

  Two remain, and they are the two this record most wanted to keep. #587 has survived two
  re-vendors and sixteen new lint checks without an edge-provenance rule among them; #647 is
  untouched. Both still carry live workarounds in this repository, which is the case for the
  file: neither is discoverable from the code that implements it.

  The directory conventions say a defect in the prelude, CI, CLI or conventions should go
  upstream rather than being worked around locally, because a local workaround is invisible to
  every other derived repository and is discarded at the next re-vendor. This record exists so
  that both findings and the workarounds are recoverable when that report is made.
  Revisited a third time on 2026-09-07, at the re-vendor to template v0.5.0 (commit 29962860,
  cli/v0.11.0), 65 commits upstream. Nothing closed in that interval and nothing was expected to:
  the release is about which keys hold prose and a kuten revision, and neither is where these two
  live. Both were re-checked at the pin rather than assumed — #587 against the registered check
  set, #647 against the tracker and then against this repository's own `main`, where it stopped
  being a reasoned hazard and became a red build. One new finding was found by the re-vendor
  itself, which is now the second time that has happened and the reason this file is opened on a
  re-vendor at all.

decision: |
  **Finding 1 — `crates-index` misses `description` when the key is aligned. FIXED upstream in
  template v0.3.0.**

  A `[package]` table written as

      description  = "..."     # two spaces before =

  renders as an em dash in the crates-index REGEN block. Written as

      description = "..."      # one space

  it renders correctly. Both are valid TOML and the first is ordinary formatting for an aligned
  manifest.

  Isolated by bisection. It is **not** the dotted workspace-inheritance keys
  (`edition.workspace = true`), which were the first suspect and read fine. It is the
  whitespace alone. The CLI appears to read the manifest line-wise, although `yidam-core`
  already depends on the `toml` crate.

  Severity is in how quiet it is. `yidam regen` succeeds, `yidam regen --check` passes, `mise
  run ci` is green, and the generated table is wrong. Nothing anywhere reports it.

  **Worked around**, in `crates/succession/Cargo.toml`: the keys use single spacing and a
  comment says the spacing is load-bearing and why. Remove that comment and reformat freely
  once the CLI parses TOML.

  **Closed.** `cmd/build.rs` was rewritten between cli/v0.5.0 and cli/v0.8.0 to parse the
  manifest with the `toml` crate rather than line-wise — `parse_cargo_manifest`, which also
  resolves `description.workspace = true` against the workspace table. The whitespace no longer
  signifies. The workaround comment in `crates/succession/Cargo.toml` was removed on adopting
  v0.3.0; the diagnosis above is kept because the shape of the defect is the useful part, not
  its lifetime.

  **Finding 2 — `crates-index` lists a virtual workspace manifest as a crate. FIXED upstream in
  template v0.3.0.**

  `crates/Cargo.toml` is a virtual manifest: `[workspace]` with members, no `[package]`. The
  index renders a row for it with an em dash for both name and description — a table cell whose
  link text and target are both empty of meaning, of the literal form
  `| [<em dash>](crates/) | <em dash> |`. It is written here with the em dash spelled out
  rather than pasted, because pasting the row makes `broken-prose-link` read it as a real link
  into a directory that does not exist relative to this file — which it did, and which is a
  small demonstration that quoting generated output inside a decision record is itself a thing
  the gate has opinions about.

  A virtual manifest is not a crate. This is not worked around and cannot be locally: the
  workspace needs that file, and the conventions' own layout — `crates/` holding several
  crates — makes a workspace the normal arrangement. Any derived repository with more than one
  crate will hit it.

  **Closed** by the same rewrite. `parse_cargo_manifest` returns nothing for a file with no
  `[package]` table, so the row is not emitted at all rather than emitted empty. The phantom row
  left `crates/README.md` in the `regen:` commit that followed the re-vendor, which is the only
  visible trace this finding ever had.

  **Finding 3 — an edge cannot carry a claim tag, and the conventions say it is a claim.**
  Filed as goedelsoup/yidam#587.

  `CLAUDE.md`, generated from the prelude, states that "an edge is a claim". Prose claims are
  governed hard: they must carry `[verified]`, `[inference]` or `[open]`, untagged inference is
  a defect, and `verified-unsourced` is a lint **error**. A link carries `target` and
  `relationship`, and there is nothing in the class contract, the graph check or the linter
  that lets it say which of the three it is or where it came from.

  So the corpus's most load-bearing assertions — the graph a calculator actually walks — are
  the only claims exempt from its epistemic discipline.

  This is not theoretical here. Every location error this repository made across six phases was
  an edge: two sites `located-in` the wrong place, two places `within` a county they only partly
  lie in, and a river `flows-into` a watershed. Each sat next to prose that was correctly
  tagged. `person/lawrence-oneill.yml` is the sharpest case — its description says a
  `resided-in` edge "is a legal inference rather than a fact the roster states. [inference]",
  and the edge two lines below says nothing at all.

  **Worked around, and the workaround is the proposal.** This repository now writes `claim_tag`
  and, where verified, `source` on every empirical link, and enforces it from
  [`crates/provenance`](../../crates/provenance/) because the vendored linter has no such rule
  and `.yidam/.vendor/` is read-only. Extra keys on a link pass `graph-check` and `graph-lint`
  untouched, so nothing upstream had to be broken to do it — but nothing upstream validates it
  either, and a typo in `claim_tag` would be silent without the crate.

  What upstream would need: the two keys in the link schema, `structural` relationships exempt
  (`instance-of`, `concerns`, `subject-of`), and two lint rules mirroring the prose ones —
  untagged empirical edge, and verified edge without a source.

  **Still open at template v0.4.0.** Re-checked directly at each pin rather than assumed. The
  set of checks a plain `yidam lint` registers here grew from 36 ids to 52 across this
  re-vendor, and not one of the sixteen additions is an edge-provenance rule: six read prose
  citations, two read a class's foundational alignment, one counts tags in class prose, and
  seven want a sangha. The edge rules are still `claim-tag-malformed`, `dangling-edge`,
  `edge-target-class`, `unlicensed-edge` and `verified-unsourced` — the same five, across two
  re-vendors. `crates/provenance` keeps its job.

  (36 and 52 are registered-check counts, measured by diffing `lint --format json` from both
  binaries against one tree. The 43 and 49 above were counted from source at the previous
  revisit and are not the same measurement; the conclusion is unchanged either way.)

  **Still open at template v0.5.0.** Third re-vendor, same answer, measured the same way. The
  registered set went 52 ids to 53 and the one addition is `malformed-yaml`, which reports a file
  that will not parse. The edge rules are still `claim-tag-malformed`, `dangling-edge`,
  `edge-target-class`, `unlicensed-edge` and `verified-unsourced` — the same five across three
  re-vendors, and across the 65 commits of this one. `crates/provenance` keeps its job.

  This release is worth naming even so, because it moved the ground under this finding's own
  argument without reaching it. A class may now declare which of its top-level keys hold prose,
  and a property may declare that its value is prose — so the format grew a way for a corpus to
  tell the tool what a field *is*, which is the shape of what #587 asks for on a link, arriving
  one level up. And the upstream note says in as many words where it stops: prose under `links:`
  is "the edge vocabulary" and is not in this release. After three re-vendors the gap is a named
  gap rather than an unconsidered one, which is the most movement this finding has had.

  **Finding 4 — `node-too-long` charges a node for being auditable.** Filed as
  goedelsoup/yidam#588.

  `max_lines` counts whole files. Adding a `claim_tag` and a `source` to each link costs about a
  line and a half per edge, so three nodes went over a limit that had been set to stop
  *descriptions* sprawling. The budget and the thing it now measures have come apart: a corpus
  that documents where its edges come from pays for it out of its prose allowance.

  Raised locally in `division.ont.yml`, `measure.ont.yml` (twice) and `tenure.ont.yml` with the
  argument in a comment. Upstream the fix is to count the `description` block rather than the file,
  which is what the check is named for.

  The `tenure` case is the clearest evidence for that fix, because the ratio is worst there. A
  tenure's fixed structure — frontmatter, two properties, three links with tags and sources — is
  18 lines before any prose, against a budget of 25. Seven lines of allowance for a class whose
  whole job is to say who held what, when, how it began and how it ended. Raising the number to 35
  brought eleven pre-existing findings under the limit as a side effect, which is a sign the limit
  was measuring the wrong thing rather than that the nodes were long.

  The second `measure` raise, 42 to 60, is the same ratio problem in a second dimension. `describes`
  takes four target classes, so a measure about the county's five hospitals carries six such edges —
  twenty-six lines — where a measure about one place carries eight. The fixed cost scales with how
  many subjects a node names, and a budget written against prose sprawl charges the node for naming
  them. Counting the `description` block would fix all four cases at once.

  **And that raise exposed the sharper version of this finding.** At 42, eleven of the forty
  measures were already over — two of them at 103 and 113 lines — and every one of those had been
  sitting in the lint baseline unremarked for the life of the corpus. So the declared limit was not
  a budget being enforced against; it was a number the class had drifted away from, and three nodes
  were compressed this phase against a constraint that a quarter of their class ignores. 60 still
  leaves eight over. A check whose baseline permanently carries a quarter of a class is measuring
  something nobody is willing to act on, and the value of raising the number is only that the
  declared figure stops being fiction.

  **FIXED upstream in template v0.4.0**, by 5a0249e, and fixed as asked: `node-too-long` now
  measures the `description` block rather than the file, so a node stops paying for its
  provenance out of a budget written against prose sprawl. goedelsoup/yidam#588 is closed.

  Measured across this re-vendor, both binaries on one tree: 258 findings at cli/v0.8.0, 139 at
  cli/v0.10.0. That 119-finding drop is the whole of the difference the upgrade made to `lint` —
  every other check reports an identical count at both pins.

  The upgrade notes say to re-bless afterwards, because a baseline holding the old counts still
  passes while leaving room for regressions nothing reports. **That does not apply here.**
  `.yidam/lint-baseline.yml` is `violations: {}` and has been since it was installed, so there is
  nothing to loosen. It was left alone.

  **Two of the three local raises are now unnecessary, and one is not.** `division` (45) and
  `tenure` (35) report zero findings at the new measurement, so both could return to what they
  were arguing against. `measure` (60) reports 139 of 282 — 49% of the class, up from the
  quarter that made this finding sharpen last time. So the fix removed the distortion this
  finding named and left the older question underneath it standing: a limit half a class exceeds
  is still not a budget anybody is enforcing. Whether `measure` nodes are too long or the number
  is fiction is a corpus question, not an upstream one, and it is now askable on its own terms.

  **The fix generalised at template v0.5.0, and the question underneath it did not move.**
  `node-too-long` now counts every field the ontology declares as prose rather than
  `description` by name, so the budget follows what a class says it writes rather than what
  serde happened to name. With nothing declared here the effective set is `{description}` and
  every count is identical: the only difference in 1,597 lines of lint output is the word —
  `36 lines of prose` where it read ``36 lines of `description` `` — and every file named and
  every number beside it is unchanged. So the repair this finding asked for has been generalised
  past what it asked for, at no cost until a class declares.

  It will cost the moment one does, and this corpus is the one the upstream note measured. 380 of
  694 nodes carry a block scalar under `properties:` — 287 `method`, 35 `location_description`,
  21 `table` and eleven more declarations — and the note records flagging fourteen of them moving
  a corpus from 58 findings to 94. 58 is this repository's `node-too-long` count today. That is
  not a regression waiting to happen; it is the length those nodes have always been, unread.
  Whether to declare it is the same corpus question this finding has carried across three
  revisits, now with a second and better way to ask it.

  **Finding 5 — genesis replaces one workflow and leaves six.** Filed as goedelsoup/yidam#589.

  `.github/workflows/ci.yml` is installed at genesis and its own header explains the reasoning:
  yidam's CI builds paths that "do not survive the `vendor:` step, so inheriting that workflow
  gives you a green build that compiles nothing." The argument is correct and was applied to
  exactly one file. The template's other six — `docs`, `editor`, `install-channels`,
  `publish-crates`, `release`, `tap` — were carried into this repository unchanged, and every
  one references the same layout that does not survive: `yidam/web/docs`, `yidam/cli`,
  `yidam/editors/vscode`, `yidam/bundle.yiz`, or publishes to `goedelsoup/tap` and
  `goedelsoup/yidam-vscode`.

  What it cost: nothing for 459 commits, because the repository had no remote and Actions never
  ran. The first push to a remote turned `main` red — `docs` triggers on every push and pull
  request and fails resolving `cache-dependency-path: yidam/web/docs/package-lock.json`. The
  cost is not the failure but where it lands: on the first push a derived repository ever
  publishes, on `main`, at the moment its history becomes public, and attributable to whatever
  change happened to be in that push rather than to genesis. Four of the remaining five are
  latent behind tag namespaces a derived repo will never cut; `install-channels` carries a
  Monday 07:00 UTC cron and would have failed weekly and silently.

  Upstream the fix is that genesis should remove the template's workflow directory rather than
  overwrite one file in it — the same reasoning `ci.yml` already documents, carried to the other
  six. A derived repository cannot discover this by reading, because the workflows are correct
  YAML referring to paths that were real in the repository they came from.

  **Worked around** by deleting all six, in the commit preceding this one. Nothing to restore on
  re-vendor: if genesis is fixed they will not arrive again, and if it is not, they will and
  should be deleted again.

  **Confirmed at template v0.3.0**, in the sense that mattered: the re-vendor did not bring them
  back. `yidam-vendor-update` writes only `.yidam/.vendor/prelude/`, `.yidam.toml`,
  `mise.yidam.toml` and a marked region of `mise.toml`, so `.github/workflows/` was untouched and
  still holds one file. Whether genesis has been fixed for the *next* repository is not visible
  from here.

  **FIXED upstream in template v0.4.0**, by 4e75999 — "genesis left five of yidam's own workflows
  behind" — which closes goedelsoup/yidam#589. The fix is for the next repository to be born, and
  the sentence above is why nothing changes here: this repository already deleted them, and the
  re-vendor again did not touch `.github/workflows/`. Nothing to restore, nothing to remove.

  **Finding 6 — a vendored crate a derived repo must depend on is not rustfmt-clean, and its own
  formatting gate reaches it.** Filed as goedelsoup/yidam#590.

  `crates/proximity` depends on the vendored geodesics crate by path, because
  `.yidam/.vendor/prelude/domains/geodesics/rust` is where the prelude puts it and finding 3's
  sibling argument — a call, not an affinity — is why it is kept. `cargo fmt --all` is documented
  as "Format all packages, **and also their local path-based dependencies**", so the derived
  repository's formatting gate formats a directory the conventions forbid it to edit.

  It is latent, not constant, which is what makes it worth writing down. Upstream does not run
  rustfmt over `prelude/domains/`, so whether the vendored copy is clean is an accident of the
  pin. At 1162287 it was, and this repository ran `cargo fmt --all` green for its whole life. At
  7b0cef2 it is not — a wrapped arithmetic expression that fits on one line, and an unsorted
  `use` — and `mise run ci` failed at its formatting step on the commit that adopted the pin,
  the first time this repository had ever seen that gate fail.

  There is no legal repair downstream. `cargo fmt` over it is an edit under `.vendor/`, discarded
  at the next re-vendor and invisible until then.

  **Worked around** by naming the six members instead of `--all`, in `mise.toml`'s `fmt` and `ci`
  tasks and in the crates job of `.github/workflows/ci.yml`. The workaround has its own cost,
  stated in the commit that made it: the list now appears in three places, nothing checks that a
  seventh crate was added to each, and a crate left off is not reported — it is silently never
  formatted.

  What upstream would need, in rough order of value: run rustfmt over `prelude/domains/` in its
  own gate, so that what a derived repository vendors is clean by construction. Failing that, say
  in the directory conventions that `--all` reaches `.vendor/` and that a derived repo should
  name its members — the conventions already discuss `crates/` layout and are where somebody
  would look. A `rustfmt.toml` carrying `ignore` would be the obvious third answer and is not
  one: `ignore` is nightly-only, and this repository pins stable 1.88.

  **FIXED upstream in template v0.4.0**, by 59961bd — a CI gate that glob-discovers the domain
  crates and formats them, rather than naming a list that rots. It is the first repair this
  finding asked for and closes goedelsoup/yidam#590. 9a9a891 formatted the fourteen crates
  rustfmt had never been run against.

  Verified here rather than inferred: at the new pin the vendored geodesics crate is
  rustfmt-clean, and `cargo fmt --manifest-path crates/Cargo.toml --all --check` exits 0 for the
  first time since 7b0cef2. What changed is not that this pin happens to be clean — 1162287 also
  was — but that a gate upstream now keeps it so, which is what the finding asked for and what
  turns an accident of the pin into a property of the template.

  **The workaround is removed.** `mise.toml`'s `fmt` and `ci` tasks and the crates job in
  `.github/workflows/ci.yml` say `--all` again, and the three-place member list — whose cost this
  finding recorded, and whose real failure mode was a ninth crate silently never formatted — is
  gone. It was removed one commit after the re-vendor rather than inside it, because a gate change
  does not belong in a commit meant to be reviewable as one event.

  `crates/publish/tests/gate.rs` changed shape rather than losing a test.
  `both_gates_format_check_every_workspace_member` compared two hand-written lists against the
  workspace; `both_gates_format_check_the_whole_workspace` asserts instead that neither gate
  narrows — both must say `--all`, and neither may name `-p`. That is a stronger guarantee, since
  `--all` cannot check six of eight the way two lists could and a ninth member now needs no edit
  anywhere. Both mutations were run and both went red.

  **The reintroduction path is named rather than closed.** `--all` still reaches
  `.vendor/prelude/domains/geodesics/rust`, and if a future re-vendor lands an unclean crate
  there this gate fails again with no legal repair from inside this repository. What has changed
  is only that upstream now guarantees cleanliness by gate rather than by accident. The response
  if it recurs is an upstream report, not a second narrowing — the assertion against `-p` says so
  at the point somebody would reach for it.

  **Re-checked at template v0.5.0, and it did not recur.** The vendored geodesics crate is
  rustfmt-clean at 29962860 and `cargo fmt --manifest-path crates/Cargo.toml --all --check` exits
  0 — the second consecutive pin, which is the difference between a gate upstream and a lucky
  accident. One new thing arrived under that directory: upstream committed 33 domain lockfiles
  this cycle, and geodesics' `rust/Cargo.lock` is one of them. It is invisible to git here,
  because a `Cargo.lock` rule in this machine's global gitignore reaches under `.vendor/`. That
  costs nothing in a tree replaced wholesale, and it is recorded only because it is the second
  thing this repository has learned about that directory from a tool rather than from reading it.

  **Finding 7 — a `--check`-gated REGEN block counts git refs, so it cannot be right in two
  checkouts at once.** Filed as goedelsoup/yidam#647.

  `yidam status` writes the block in `README.md`, and every field but one is read from
  `.yidam/corpus/`: node count, open questions, sources, claim counts, genesis. **`active
  phase(s)` is read from `refs/remotes/origin/phase/*`**, and refs are not in the tree.

  `yidam regen --check` gates that block. So the same commit is green or red depending on which
  branches the checkout happens to hold, and there is no committed value that satisfies both:

      clone with the phase ref    computes 1    committed 0 fails
      CI without it               computes 0    committed 1 fails

  Verified rather than reasoned. With `origin/phase/a-period-is-not-a-date-range` present the
  gate failed on `1d33ce5`; `git update-ref -d` on that one ref alone made `regen` produce no
  diff; fetching it back made the gate fail again. Nothing else changed.

  It is also unstable over time with no commit involved. Pushing or deleting a phase branch
  changes what `--check` computes for a commit that did not change, so a repository can go red on
  work nobody did — the failure mode `.yidam/lint-baseline.yml` and the publication gate's
  `answers` list are both built to avoid.

  The rule this rests on is worth stating in the CLI's own terms: **a REGEN block held by
  `--check` must be a pure function of the committed tree**, because the tree is the only thing
  every checkout of a commit has in common. `active phase(s)` is the one field that is not, and
  `yidam phases` already reports it on demand, where being live is the point rather than a
  hazard. Dropping it from `status` costs a reader of `README.md` nothing they cannot get.

  **What the filing found that this record had not.** goedelsoup/yidam#74 met this defect's
  local-branch half two months ago, in a different derived repository, and wrote the contract
  down while fixing it: *the output is the same in a fresh clone as on a developer machine.*
  That contract is right and **no ref-derived value can meet it**, so the fix — read
  remote-tracking refs rather than local ones — moved the split one refspec along rather than
  removing it. `actions/checkout` creates a remote-tracking ref for the ref it checks out and no
  other. The stopgap that repository shipped is the one this one shipped, reached independently:
  materialise the branches before the generators run.

  So the finding is not that the count is wrong. It is that the class of fix already tried cannot
  work, and the rule has to be about where a gated field may read from at all.

  **Worked around, not fixed.** The corpus job now fetches every branch head explicitly, so both
  ends count the same refs and the committed block is the true one. That is the third option in
  the local issue and the one it ranked last, because it makes the two agree without making the
  field stable: the block still goes stale when somebody pushes a branch. `fetch-depth: 0` was
  believed to do this already and does not — it is a depth, not a refspec — and the workflow
  comment that said so has been corrected. `crates/publish/tests/gate.rs` keeps the fetch step
  from being removed as redundant.

  **Still open at template v0.4.0.** goedelsoup/yidam#647 is OPEN, checked against the tracker
  rather than inferred from the changelog, and nothing in the 112 commits between the pins
  touches where a gated REGEN field may read from. The workaround stands and so does the rule
  this finding is really about.

  **Still open at template v0.5.0, and it is no longer a hazard. `main` is red.** #647 is OPEN
  and nothing in the 65 commits touches where a gated field may read from. What is new is that
  this repository stopped reasoning about the defect and started being failed by it. The CI run
  on `14b0720` — the merge of phase/three-marks-for-1913 — fails at `yidam regen --check` with
  `1 REGEN block(s) stale: README.md (status)`, and fails again on a re-run, so it is not a
  timing accident.

  On this machine that same commit is green. Both binaries were run against a worktree detached
  at `14b0720` and both reproduce the committed block character for character, including its
  `1 active phase(s)`. Nothing in the tree differs; the corpus is identical; the CLI version is
  not the variable, because 0.10.0 and 0.11.0 agree.

  The variable is one ref, and it was isolated the way the original finding was.
  `git update-ref -d refs/remotes/origin/phase/three-marks-for-1913` turns that green checkout
  red with the identical message, and `status` then computes `0 active phase(s)` against the
  committed `1`. Restoring the ref makes it green again. So `main` holds a value that is true
  here and false in CI, and no commit can be authored that is true in both while the branch
  exists in one and not the other.

  **The repair for `main` is not a commit.** phase/three-marks-for-1913 is merged and still on
  origin; the house habit is to delete a phase branch when it lands, which the last two
  `regen:` commits both say they did. Deleting it makes `0 active phase(s)` true everywhere and
  the block can then be regenerated once. Committing `0` while the branch survives would only
  move the red from CI to every developer machine, which is the deadlock this finding named and
  the reason it is about where a gated field may read from rather than about a count.

  **Finding 8 — the staleness report warns on a file where it means a table.** Found at the
  v0.5.0 re-vendor, by the re-vendor. Not filed.

  `.github/workflows/ci.yml`'s staleness step prints how far behind the pin is and escalates to
  nothing, with one documented exception: it raises a `::warning::` when
  `yidam/prelude/GRAPH.md` has moved, because that is where the closed commit vocabulary lives
  and, in its own words, "your log is already written against the old one and cannot be rewritten
  to match." The reasoning is right. The proxy has stopped being.

  GRAPH.md gained 121 lines at v0.5.0 and not one of them is a verb. The vocabulary table holds
  32 rows at both pins — counted at each rather than assumed, because the warning is exactly the
  reason not to assume — and `refresh` and `reconcile` were already among them. What the file
  gained is the ontology's prose rules: which top-level keys hold prose, and whether a property
  does. A corpus can adopt or decline that at leisure and no history becomes unrewritable either
  way.

  So the warning fired on `main`, at the top of the run, for a change that cannot affect what it
  warns about. The cost is the ordinary cost of a warning that cries wolf, and it is already
  being paid: this re-vendor answered it by counting verb rows at both pins, and the next
  repository's answer will be to stop reading it.

  What upstream would need: warn on the vocabulary rather than on the file. The verb list is
  enumerable, `yidam vocabulary` already prints it, and two printed lists can be diffed where
  today two file blobs are. Until v0.5.0 the two were the same thing, so the proxy was sound when
  it was written; this is the first release in which GRAPH.md carries something else, and it will
  carry more of it.

  **Not worked around.** The step is `continue-on-error` and warns rather than gating, so nothing
  is broken. Narrowing it here would be a repair invisible to every other derived repository that
  inherits this workflow at genesis, which is the thing this file exists to stop.

rationale: |
  Why these are recorded rather than quietly fixed and forgotten.

  Findings 1 and 2 are invisible to every gate this repository runs, which is what makes them
  worth writing down rather than remembering. The first produces a REGEN block that regenerates
  successfully and says something false — the same shape as the stale-figure problem the
  directory conventions describe for `docs/`, arriving in generated content where a reader
  would least expect to have to check.

  The second is the one that generalizes. It will appear in every derived repository that uses
  a Cargo workspace, which the conventions treat as the standard layout for `crates/`, and it
  will appear the moment the first crate is written — the point at which nobody is yet looking
  closely at the index.

  Findings 3 and 4 are a different kind and the more valuable one. They are not defects in the
  tool; they are places where the conventions promise something the format cannot express. The
  prelude tells a derived repository that an edge is a claim and then gives it no way to say
  what kind. This repository has 205 empirical edges and six phases of evidence about what that
  costs, which is the sort of report a derived repository is uniquely placed to make and a
  template author is not.

  Finding 5 is the only one of the five a derived repository cannot find by reading its own
  files. The six workflows are valid YAML naming paths that were real where they came from, so
  nothing is malformed and no gate objects; they are wrong only in a repository that vendored
  them. It took a remote and a first public push to surface, which means every derived repo
  that has not yet acquired one is carrying it undetected — and will meet it at the least
  convenient moment, when `main` goes red on the commit that published the repository.

  Finding 6 is the second of that last kind and arrived by the same route as finding 5 — a gate
  failing somewhere the reasoning had not reached. It is also the first evidence here about what
  re-vendoring itself costs, which the conventions describe as a decision worth its own commit
  and say nothing else about. The answer, measured once: a corpus that had never seen its own
  formatting gate fail saw it fail, on code it is forbidden to touch, because an upstream author
  hand-edited two lines in a directory nobody formats.

  What an upstream report should carry, per the conventions: the pins — 1162287 for findings 1
  through 5, 7b0cef2 for finding 6 and for the confirmation that 1 and 2 are closed — what it
  cost here (one bisection of a manifest, one workaround comment since removed, 1,270 tagged
  empirical edges and a crate to keep them tagged, six deleted workflow files, and a formatting
  gate narrowed in three places), and where each surviving workaround is so it can be removed.

  **Filed on 2026-09-04**, on the elector's instruction, as goedelsoup/yidam#587 through #590 —
  one issue per open finding rather than one report, because each has a different fix and a
  different scope label, and a single issue would have been closed when the easiest of the four
  was done. Findings 1 and 2 were not filed: a defect already fixed upstream is a re-vendor and
  not an issue, which the conventions say in as many words.

  Each was re-verified against origin HEAD (090a683) before filing rather than against the pin
  this repository sits on, because the pin is three days behind and an issue against something
  already fixed wastes the reader rather than informing them. Two of the four sharpened in the
  checking. Finding 4 was written when a quarter of one class exceeded its declared limit; it is
  now 207 of 238, and `node-too-long` reports 212 findings that gate nothing. Finding 5 gained a
  second half: `sadhana/github/workflows/index.yml` now ships and `bootstrap.md` never installs
  it, so the scaffold carries three workflows and delivers two.

  The cost of the delay is not hypothetical. Findings 1 and 2 were fixed upstream between 27
  August and 2 September by somebody who reached them independently, which is six days this
  repository spent maintaining a workaround comment for a defect that no longer existed — and
  the conventions' own example of this failure, two repositories reasoning correctly from
  evidence neither could see, is exactly the shape it took.

  The return path now has traffic in both directions, and one immediate confirmation that it
  was needed: #584, filed hours earlier from a different derived repository, measures the
  40-line node cap across seventeen corpora and reaches this repository's finding 4 from the
  population end. Neither report knew about the other. A comment on #588 now links them.

  **Two days later, three of the four were closed.** That is the return this record was written
  to make possible, and it is worth saying what it actually bought, because "filed and fixed" is
  the least interesting reading. Finding 4 licensed three local `max_lines` raises; the fix made
  two of them unnecessary and left the third standing on a question the raise had been hiding,
  which is a better outcome than either the workaround or a simple revert. Finding 6 licensed
  narrowing the formatting gate in three places; the fix makes that removable, and the record is
  what says where the three places are. Finding 5's fix changes nothing here at all and closing
  it is still worth recording, because the next derived repository is the one it was for.

  What that leaves is a rule about workarounds rather than about findings. Every one of the
  three was removable only because the record said where it was — and one of the three has been
  removed only in this file so far, deliberately: a gate change does not belong in a `vendor:`
  commit. A workaround outlives the defect unless something is holding its address.
