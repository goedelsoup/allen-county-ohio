id: kuten
summary: the `inquiry` kuten at revision 2, with the two bands that measured age retired
kuten: inquiry
revision: 2
decision: |
  This corpus's practice is `inquiry`: the corpus grows through sustained inquiry — questions
  opened, and settled. That is unchanged.

  This supersedes the revision-1 adoption in `0eaf32d`. The profile vendored at
  `.yidam/.vendor/prelude/kuten/inquiry/kuten.yml` is at revision 2, which deletes its
  `classes:` slot: `nodes_per_commit` and `median_node_lines` are no longer bands. Nothing else
  in the profile moved, and nothing about how this corpus works changed.

  The revision is copied from that profile, and every consumer reads the kuten at the vintage
  this repository holds rather than at upstream's current one. Recording it is what makes an
  upstream revision a visible `decide:` event rather than a silent adoption — the one
  obligation revision 1 took on, met here for the first time.
rationale: |
  Why a revision bump is an argument rather than a digit.

  **The one divergence this record carried was not answered. The band was withdrawn.** Revision
  1 declared that the median node here ran 64 lines against a declared 35–62, and said so in
  its summary line. It is 66.0 now, over 694 nodes. Nothing was shortened and nothing was
  reconciled: the metric left the kuten. `yidam kuten check` reports three rows where it
  reported five, and this corpus conforms on all three.

  **Two of the four bands the adoption rested on are also gone, and this corpus is now outside
  both.** The revision-1 rationale cited four holding bands as evidence that "this repository
  has not moved", and `nodes_per_commit` was one of them — 0.50 against a declared 0.50–1.12.
  It is 0.4816 today, 694 nodes over the 1,441 commits `kuten check` measures, which is below a
  floor this corpus helped set. So of five bands, the two retired are exactly the two this
  corpus has left, and it left them by doing nothing but continue.

  **That is the retirement's own argument, and this repository is a witness for it rather than
  against it.** Upstream's case is that both metrics measure how old a repository is and not how
  it works — nodes per commit halves over a life, so an unmatched comparison reads age — and
  that every member of the fit exits both by ageing. The fit was observed on 2026-09-06. This
  corpus adopted at 16:44 that same day already reading 64 against a 35–62 it had helped
  measure, and reads 66.0 a day later. **It is almost certainly the fit's sixth member
  [inference]** — that member records `median_lines: 62` and `instances: 673`, against 683 and
  64 here hours later — which is why the hours matter: a band a corpus exits within a day of
  helping to set it is not measuring the thing it was written to measure. [verified] — the two
  figures are `measurement.median_node_lines` and `measurement.nodes / measurement.commits` in
  `yidam kuten check --format json` at this pin.

  **What the retirement does not do is answer the length question.** It moves it. Whether the
  nodes here are long or the declared numbers are fiction is
  [upstream-findings](upstream-findings.yml) finding 4, carried across three revisits and still
  standing at `measure`'s `max_lines: 60`. Revision 1 valued the kuten for making that question
  arrive from the population end without anybody running a lint check; revision 2 stops it
  arriving that way. The question is now `node-too-long`'s alone, which is where it was before
  the kuten existed and where this record says it should be watched.

  **The three surviving bands hold, measured rather than assumed.** Phase-commit share 12.3%
  against 12%–27% (177 of 1,441); off-vocabulary 0.6% against 0%–2% (8 commits);
  question-pressure epistemic, 456 open. The release also taught the vocabulary check to read
  `verb(scope):` as a verb wearing a scope, and `suffixed_commits` here is 0 — so the 0.6% is
  eight genuine coinages and not a punctuation habit, which is a distinction this number could
  not previously make.

  **What does not change.** A kuten still binds nobody: divergence is a question for a person,
  `kuten check` writes nothing and exits zero, and it stays deliberately outside `mise run ci`
  on the argument that a question wired into a gate becomes a defect the next person learns to
  silence. The `clocks` the profile proposes — `due.questions_after: 100`, `due.phases_after:
  60`, `due.index_after: 25`, `catalog.ttl_days: 180` — are still declined, for the reason
  revision 1 gave and which a second adoption event does not weaken.
