id: a-village-weekly-does-not-name-its-county
summary: >-
  A Bluffton weekly reported a tornado in "Orange township" and this corpus's catalog wrote it down
  as an Allen County tornado seven years ahead of the federal storm record's first one. Orange
  township is in Hancock County; Ohio has six of them. The rule is that an unqualified place name
  in a local source is qualified by that source's own catchment and not by the corpus's subject,
  and that the resolution happens in the pass that reads the page.
context: |
  The catalog entry for [Chronicling America](../catalog/chronicling-america.md) was amended one
  phase ago with what the Bluffton News still holds unread. It named the issue of 20 May 1943,
  headed "RAIN, FLOOD AND TORNADO SWEEP BLUFFTON AREA", and said it "reports a tornado that blew
  down four barns in Orange township early on Monday 17 May 1943 — **seven years before the first
  Allen County tornado in the federal storm record**, which begins in 1950."

  Every clause of that is true except the one doing the work. The tornado is real, the four barns
  are named farm by farm, the hour is fixed at about 4 a.m. by residents in Bluffton who took the
  roar for a train — and **Orange township is in Hancock County**. Ohio has Orange townships in
  Ashland, Carroll, Delaware, Hancock, Meigs and Shelby counties, and the one south-east of Bluffton
  is Hancock's. [verified] — [GNIS](../catalog/gnis-domestic-names-ohio.md), feature 1086250; Allen
  County has twelve townships and none of them is Orange, which
  [the civil geography](the-civil-geography.yml) settled when it wrote all twelve into the corpus.

  The paper never says Hancock because its readers are standing in it. Bluffton straddles the
  Allen–Hancock line, the weekly runs a county page for four counties, and a township four miles
  east of the village needs no more qualification than a street does. The county the corpus wanted
  was supplied by the corpus.
decision: |
  **An unqualified place name in a local source is qualified by the source's catchment, not by the
  corpus's subject. Resolve it against an authority before it is written down.**

  - **Township, village, road and farm names get looked up in the pass that reads the page**, not
    later. The check is one lookup in a gazetteer already in the catalog and it costs less than the
    sentence it protects.
  - **Where the source's catchment straddles a county line, the subject county is not the default.**
    It is the least likely answer, because the whole reason the source is useful is that it sits on
    the line.
  - **A duplicate name inside one state is the ordinary case.** Six Orange townships in Ohio, two
    Allen Counties in the archive's own facet, an Allen County in Kansas and another in Kentucky.
    The corpus has been warning itself about the last three in this very entry since the witness
    phase.
  - **When the correction lands, say what it cost.** Here it cost a claim of priority: nothing in
    this county is now known to precede [the tornado of 19 July
    1950](../corpus/event/the-tornado-of-19-july-1950.yml) in the weather record, and a reader who
    had taken the catalog's sentence would have believed otherwise.
  - **The out-of-county half is still written down.** The storm is an Allen County event — three
    days of rain, the Riley creeks over their bottomlands, a peak on the county's river the gauge
    would not date — and the wind belongs to the county next door. See
    [the storm of 16–18 May 1943](../corpus/event/the-storm-of-16-18-may-1943.yml).
rationale: |
  **The rule already existed and was one day old when it was broken.**
  [an instrument dates it and a witness describes it](an-instrument-dates-it-and-a-witness-describes-it.yml)
  says, in as many words, "Check the basin, the township and the county line before the witness is
  allowed to be about the same thing." It was written on 6 September and the catalog sentence was
  written on the 7th. So the useful part of this decision is not the principle; it is the
  observation that **the principle was stated where it could not fire**. That rule governs writing a
  node. The claim that failed was in a catalog entry — prose, in a file no graph check reads for
  content, describing work not yet done. A finding parked in a catalog entry as a lead for the next
  phase is an unverified claim wearing a verified tag, and this one carried `[verified]` because the
  ALTO of the front page had genuinely been read.

  **It is the third shape of one family and it is worth keeping the three apart.**
  [located here is not of here](located-here-is-not-of-here.yml) is a thing correctly inside the
  line that says something false about the people. [of here is not located here](of-here-is-not-located-here.yml)
  is a thing the county's own histories put inside a line that later moved out from under it. This
  one is neither: the fact is where the source says it is, and the source did not say the part the
  reader needed. Nothing moved and nothing misleads on aggregation — a name was simply shared, and
  the reader supplied the missing half from what he was already looking for.

  **What this does not license.** Discarding a local source's geography as unreliable. The Bluffton
  News is exact about which farm, which street and which creek, and it named the township correctly;
  the imprecision was never the paper's. Nor does it license demanding a county for every name: most
  of what this paper says about Cherry street and Harmon field needs no gazetteer, because those are
  in the village and the village is the subject. The rule fires on names the source treats as
  neighbours — the next township, the next village, a road that leaves town.
status: accepted
date: "2026-09-07"
