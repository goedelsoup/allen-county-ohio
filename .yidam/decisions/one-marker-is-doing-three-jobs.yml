id: one-marker-is-doing-three-jobs
summary: >-
  When this phase opened the corpus carried 342 `[open]` markers across 269 of its 451 nodes, and
  its own account of itself
  names them as a single gap that nothing ranks. They are not one register. Some are tasks with an
  instrument, some are questions no source can answer, and some are not questions at all — they are
  scope statements and standing refusals wearing the only marker the notation provides.
context: |
  [a-count-of-absences-is-not-an-agenda](a-count-of-absences-is-not-an-agenda.yml) was written one
  phase ago about blank fields, and said in its own rationale that the same failure was queued
  behind it: "347 `[open]` markers across 265 nodes, and nothing ranks them ... Counting them again
  will not separate them."

  This is the separation. It was done by reading every marker in the corpus, and it produced a
  finding about the notation before it produced one about the backlog.
decision: |
  **`[open]` means "not established here" and the corpus has been reading it as "to do".** Three
  different things carry the marker and they have nothing in common but the absence:

  - **A task.** A question with a named instrument, closable by work. "Harrod's instrument and
    date. The Allen County commissioners' journal for 1884 to 1890 would carry it."
  - **A limit.** A statement of what this node is not, recorded so a reader does not overread it.
    "These are wages paid by establishments in Allen County, not incomes of Allen County
    residents." "This is a roster of seats and not a description of a government." Nothing closes
    these and nothing should.
  - **A refusal.** A claim the corpus declines to make and would decline again with better sources.
    "This does not establish that these seats go unfilled because nobody stands for them."

  **So say which, in the sentence, and stop counting the marker as a backlog.** A phase chosen by
  reading the register must read for tasks; the other two are the instrument working and their
  number should never fall.

  **And where a task names an instrument, check that the instrument is the one you hold.** Three
  markers in this corpus read "Who its board members are. The Putnam County roster would name them"
  — naming a source the catalog does not hold, when the source it does hold carried the answer under
  a different query. That is the third consecutive phase in which the corpus's stated route to an
  answer was wrong and the answer was already on the disk.

  **What the register looks like when counted rather than read.** 342 markers, 269 of 451 nodes:

      measure 70   person 46   event 37   jurisdiction 30   site 26   place 26
      organization 25   office 24   tenure 20   question 15   period 14
      division 6   natural-feature 3

  **Sixty-six of the 342 are on `person` and `tenure` nodes, and twenty of those sixty-six are four
  questions asked over and over** — where a state or federal officer lives (7), whether a judge was
  admitted to the Ohio bar (6), a person's dates of birth and death (5), and how a seat came to be
  filled (2). Four instruments would close twenty markers, and no phase has ever gone looking for
  them, because a list of 342 does not show that twenty of them are four.
rationale: |
  **The taxonomy is not bookkeeping; it changes what the number means.** "More than half of every
  node in this corpus carries an unanswered question" was published as a diagnosis. Part of that
  half is a research backlog and part of it is the corpus being careful, and the two move in
  opposite directions as the work goes on: closing tasks lowers the count, and writing better
  caveats raises it. A single number over both is uninterpretable, and the corpus has been
  publishing it since the ninth phase.

  **The repetition is the finding a count hides.** Twenty markers, four questions. That is not a
  backlog of twenty problems; it is four, and each has one instrument. The same shape found four
  municipal founding dates in books already held one phase ago, and three school boards in a roster
  already held in this one. Every time the corpus has decomposed a counted gap it has found that
  most of the count was one thing.

  **Why this phase closed three markers and not thirty.** The three school boards were chosen
  because they were the clearest test of the previous decision: they named an instrument, the
  instrument was wrong, and the right one was already held. They took one form submission. What
  that demonstrates is worth more than the three, and the corpus reports the demonstration rather
  than a sprint.

  **What this does not license.** Deleting the marker or inventing three. `[open]` is doing a real
  job and doing it in one place, which is why it is legible at all; the fix is in the sentence
  after it, not in the notation. Nor does it license treating a limit as a failure: the corpus's
  caveats are the part of it a reader should trust most, and a phase that "closes" one by deleting
  it has made the corpus worse and its own number better.
