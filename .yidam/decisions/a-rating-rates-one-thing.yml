id: a-rating-rates-one-thing
summary: >-
  The Springs of Lima carries five stars from CMS on every published component, no deficiency in its
  latest survey cycle and no fine — and its workers recorded 89 injuries on 883,063 hours, the
  highest rate of any nursing home in Allen County and five times the county's. Both are true and the
  rating was never asked the second question. A composite rating may be published only beside a
  statement of what it scores and what, at the same address, it is silent about.
context: |
  CMS's five-star system combines three things: an inspection record, a staffing figure, and a set
  of clinical quality measures taken from resident assessments. All three are about residents. None
  of them is about the people who lift them.

  Set the county's twelve homes side by side:

      home                    overall ★   deficiencies   fines    injury rate, 2016-2024
      The Springs of Lima             5              0       $0                     20.16
      Lost Creek Rehabilitation       1             11  $55,088                     17.64
      Springview Manor                4              7  $16,113                     14.15
      Willow Ridge                    5              8       $0                      2.16
      Vancrest of Delphos             5              0       $0                      4.09

  The two most injurious workplaces among them hold the highest and the lowest overall rating in
  the county. Across all twelve the correlation between rating and injury rate is −0.165 over nine
  years and −0.617 with the pandemic years removed, on twelve points — and the second figure was the
  sixth thing tried, so at those odds it arrives about once in five by chance. **Neither the
  agreement nor the disagreement is established.** What is established is that a reader who takes
  five stars as a statement about the building has been told something the rating never said.

  This is not an argument that the rating is bad. It measures what it measures, publishes its
  formula, and is the best public account of these homes that exists. The failure is entirely on the
  side of a corpus that prints it beside a street address and lets the reader supply the scope.
decision: |
  **A composite rating is published only alongside what it scores and what it does not. Name the
  inputs, name at least one consequential outcome at the same address that the formula does not
  see, and state whether this corpus holds a measurement of it.**

  - **The scope statement is specific, not a disclaimer.** "Ratings have limitations" is worth
    nothing. "This rates inspection findings, staffing hours and resident clinical measures, and it
    does not rate what happens to the staff" is a fact a reader can act on.
  - **Where a second measurement of the same address exists, print it.** The injury summaries reach
    every one of these twelve homes, so the omission is visible rather than hypothetical, and a node
    that holds both and shows only one has chosen.
  - **Do not convert the gap into a correlation the data cannot carry.** Twelve homes support a
    statement about two named homes and not a coefficient. Where a correlation is computed anyway,
    report how many were tried before it.
  - **The rule reaches every composite this corpus holds**, not only this one: a health ranking, a
    school report card, a bond rating, a walkability score. Each is a formula over chosen inputs and
    each is read as a verdict on a place.
rationale: |
  **This is not the rank rule.** [a rank is an estimate](a-rank-is-an-estimate.yml) governs the
  noise in an ordering of noisy quantities — whether 14th is really different from 20th. This
  governs something a bigger sample cannot fix: the rating could be measured with perfect precision
  and still say nothing about the thing the reader wanted to know.

  **Nor is it the proxy rule.** [a proxy must outlast what it proxies](a-proxy-must-outlast-what-it-proxies.yml)
  governs standing in for a quantity nobody measured. A rating is not standing in for anything; it
  is a real measurement of a real thing, being read as a measurement of a larger thing.

  **The failure mode is silent and flattering.** A composite index arrives with an authority the
  underlying numbers do not have — a single digit, from a federal agency, on a five-point scale —
  and its scope lives in a methodology document nobody following a link will read. Every reader
  supplies their own idea of what the stars cover, and the corpus that prints the digit has endorsed
  all of them.

  **What this does not license.** Withholding a rating, or hedging it into uselessness. The five
  stars at The Springs of Lima are a real finding about the care given there and belong on the page;
  what the rule governs is the sentence that has to stand beside them.
status: accepted
date: "2026-09-03"
