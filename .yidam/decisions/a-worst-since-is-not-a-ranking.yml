id: a-worst-since-is-not-a-ranking
summary: >-
  The Bluffton News called a flood "the worst since 1913" twice — in March 1939 and again in June
  1947 — and the gauge record shows the two were in different basins, with neither instrument
  present for both. The phrase is dated testimony about what the village measured against, not a
  ranking of floods, and the corpus does not order events by it. Where a superlative is the only
  comparison available, it is quoted with its date and its speaker and no rank is derived.
context: |
  [The flood of 12 March 1939](../corpus/event/the-flood-of-12-march-1939.yml) reached this corpus
  through a sentence: "Torrential rainfall that fed Big and Little Riley creeks over the weekend
  reached a climax shortly before noon on Sunday when Bluffton experienced its worst flood since
  the disastrous 1913 inundation." [verified] —
  [The Bluffton News](../catalog/chronicling-america.md), 16 March 1939.

  Eight years later the same paper ran the headline **"Worst Flood Since 1913 Strikes Here — As
  Streams Go On 24-Hour Rampage"**, over a story opening "Bluffton's worst flood since 1913 wreaked
  widespread damage here last Friday night and Saturday as rampaging water spilled over the banks
  of Big and Little Riley creeks for nearly a 24-hour period", with a deck reading "Half of Town's
  Basements Are Flooded Following Friday Night Downpour". [verified] — the same paper, 12 June 1947;
  the issue is now written up as [the flood of 6 June
  1947](../corpus/event/the-flood-of-6-june-1947.yml).

  Read as ranking claims the two cannot both be true, and the obvious repair is to take the later
  one as superseding the earlier — 1947 was worse, so 1939's superlative expired. That repair is
  wrong, and the instrument record is what shows it.
decision: |
  **A newspaper's "worst since X" is testimony about X, not a rank order of the events it spans.**
  The corpus quotes it with its date and its speaker, uses it as evidence of what the community held
  as its datum, and derives no ordering from it. Two such phrases from one paper are two data points
  about the datum, not a contradiction to resolve.

  **What the gauges say about these two, which is that they were not the same water.**

      gauge                                 12 Mar 1939        6-7 Jun 1947
      Ottawa at Allentown  (04187500)       6,160 cfs          2,220 cfs
        — 52 water years, median 3,240      2nd largest ever   below median
      Blanchard nr Findlay (04189000)       no record          8,160 cfs
        — gauge out 1937-1940                                  largest of the 1940s

  [verified] — [USGS peak streamflow](../catalog/usgs-nwis.md), both sites. **March 1939 was an
  Ottawa-basin flood and June 1947 was a Blanchard-basin one**, and no instrument was present for
  both: the Ottawa gauge makes 1939 look like the century's flood and 1947 like an ordinary June,
  and the Blanchard gauge — which is the basin Bluffton's own creek drains to — was not running in
  1939 at all.

  **The 1947 column is one storm read by two instruments, which is stronger than it first looked.**
  Both peaks are dated now: the Ottawa's on **7 June**, the morning Bluffton crested, and the
  Blanchard's on **8 June**. So the June storm was not confined to one basin — it crossed both on
  one night, and the Ottawa's answer to it was still its fortieth peak in fifty-two years while the
  Blanchard's was its largest in ten. The two rivers disagreed about the same rain. [verified] — the
  same source, dates read here.

  **And neither gauge is on the creek the paper is describing.** Riley Creek near Bluffton, site
  04189172, has never carried a flow series; the nearest is Riley Creek below Pandora, 3.7 miles
  outside the county and not installed until the 2000s. [verified] — the same source. So the only
  instrument that observed both floods at Bluffton is the sentence, and a sentence is not one.

  **Three consequences.**

  1. Both nodes may carry their own superlative as a quotation. Neither may say the other was
     smaller, and this corpus holds no ranking of Bluffton's floods.
  2. The value in the phrase is the **denominator**. "Since 1913" repeated across eight years and
     two storms is evidence that 1913 was the fixed point of local memory, which is what makes the
     three measured marks in the 1939 column worth having.
  3. A superlative is not a second record. It cannot satisfy
     [a flood needs two records](a-flood-needs-two-records.yml), because it is the same witness
     saying the same thing louder.
rationale: |
  **Why not simply believe the later paper.** Because the reason to prefer 1947 would be that it is
  later, and recency is not evidence about 1939 — the 1947 writer had no gauge either. Taking the
  later superlative as authoritative would have written into the corpus the exact claim the
  instruments refute: that these two floods are commensurable.

  **Why the disagreement is not an error in the source.** Both statements are defensible from
  Bluffton. Riley Creek runs through the village and drains to the Blanchard, so a Blanchard-basin
  storm hits it directly; the Ottawa is the next basin south and Allen County's own river. A village
  on the divide can honestly have its worst flood twice in eight years from two different
  directions. The paper is not being loose; it is reporting from a place, and a place is not a
  basin. See [read a word in its source register](read-a-word-in-its-source-register.yml).

  **Why this is not the two-witnesses rule again.** [Two papers printing one
  dispatch](two-papers-printing-one-dispatch-are-one-witness.yml) is about a claim copied sideways.
  This is one witness speaking twice about different events, and the failure mode is the opposite —
  not double-counting a source, but reading a rhetorical constant as a measurement that varies.

  **What would change the answer.** A record on Riley Creek itself for both years: a high-water mark
  series, a USGS reconnaissance of either flood, or the village's own damage accounts stated in
  comparable units. The 1939 column already shows what that would look like — three marks read in
  inches — and it exists for 1939 and 1913 only, which is why those two *can* be compared and 1939
  and 1947 cannot.

  **A limit of this decision.** It is drawn from two floods and one newspaper. If the same phrase
  turns up a third time in the unread remainder of this run — 527 pages match `flood` and roughly a
  score have been read — the pattern is the paper's habit rather than a coincidence of two, and that
  is worth recording here rather than re-deciding.
status: accepted
