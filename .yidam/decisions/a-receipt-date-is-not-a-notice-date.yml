id: a-receipt-date-is-not-a-notice-date
summary: >-
  The WARN Act requires sixty days' notice of a plant closing. Ohio's register records the day the
  state marked a notice received, and twelve of this county's twenty-three notices are dated less
  than sixty days before the layoff beside them — one of them on the layoff day itself. That is a
  finding about a state's file and not a finding about compliance, because the interval the statute
  names and the interval the file measures run between different events.
context: |
  The Act obliges most employers of a hundred or more to give sixty days' notice of a plant closing
  or mass layoff to three parties: the affected workers, any representative of theirs, and the
  state's dislocated-worker unit. [Ohio's register](../catalog/ohio-warn-notices-1996-2017.md)
  records one date, headed `Date Rcvd`, and one other, headed `Layoff Date`. The first is the day
  the Rapid Response Section marked the notice in. Nothing in the file dates the letter, its
  posting, or the moment anybody on the floor was told.

  Differencing those two columns for Allen County, 1996 to 2017:

      interval, state's receipt to layoff        notices   workers
      under 60 days                                  12     1,220
      60 days or more                                11     1,404
      of which: 0 days                                1        55

  The nought is Superior Forge & Steel of Lima, 7 February 2001, fifty-five workers, received and
  laid off on one day.

  There are at least four readings of a short interval here and the file distinguishes none of
  them. The employer gave late notice. The employer gave timely notice to the floor and filed late
  with the state. The state logged a letter days after it arrived. Or the layoff date printed is a
  revision of an earlier one and the original was sixty days out. The first is a violation of the
  Act, the second is a violation of a different part of it, and the last two are not violations at
  all.
decision: |
  **Name the two events an interval runs between before comparing it to any standard, and where
  the standard's endpoints differ from the file's, report the interval under the file's name and
  not the standard's.**

  - This corpus publishes "days between the date Ohio recorded receiving the notice and the layoff
    date printed beside it". It does not publish "days of notice", and it does not say whether the
    Act was complied with.
  - Where a short interval admits several readings, the readings are listed rather than ranked.
    Listing them is what stops a reader supplying the most damning one.
  - The refusal is stated at the grain of the finding: this corpus cannot say when anybody was
    told. See [state a refusal at the grain it protects](state-a-refusal-at-the-grain-it-protects.yml).
  - The figure is still published. An administrative interval that falls short of a statutory one
    in twelve cases of twenty-three is a fact about the record that a reference for this county
    ought to hold, and withholding it because it cannot be made into a compliance finding would be
    a different kind of error.
rationale: |
  **The temptation is specific and strong.** "Sixty days" is in the name of the Act, and the file
  has a column that can be subtracted from another to produce a number of days. Every step of the
  arithmetic is right and the sentence it wants to write — *half of this county's layoffs broke the
  sixty-day rule* — is not supported by anything in the file.

  **The rule is the interval version of a rule this corpus already applies to distances.**
  [A depth needs both of its ends named](a-depth-needs-both-of-its-ends-named.yml) settled the case
  where three sources measured a canal from three different surfaces and all three were right. A
  duration is the same object: two ends, freely chosen, and a number that means nothing until they
  are named. What is new here is that the second pair of ends is written into a statute, which
  makes the misreading feel like a legal conclusion rather than an arithmetic slip.

  **It is neighbouring but not identical to the `as_of` rule.**
  [A file has more than one date](a-file-has-more-than-one-date.yml) is about which of a row's
  dates a figure belongs to. This one is about a figure that belongs to two of them at once, and
  about what the difference between them is called.

  **What would falsify it.** A source that dates the employer's letter, or the workers' notice,
  against the same layoffs. The employer letters Ohio posts individually often carry their own date
  at the top; where one of those is held for a row in this register, the interval it supports is a
  different and better one, and this rule asks for it to be named differently again rather than
  substituted silently.

  **What it generalises to.** Any file kept by a regulator about a regulated act. An inspection
  date is not the date of the condition; a filing date is not the date of the decision; a permit's
  issue is not the day the ground was broken. The register is evidence of the regulator's
  knowledge, and only sometimes evidence of the thing regulated.
status: accepted
date: "2026-09-04"
