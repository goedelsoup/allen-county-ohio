id: what-a-tract-page-may-be-quoted-for
summary: >-
  The first tract pages arrived and settled the question the previous decision left open on
  purpose. A page answering "when did Ford acquire this ground" also carries fifty conveyances
  between private people, several of them recent. The rule is that the question chooses the rows:
  take what answers it, count the rest, and name a party only where the party is the answer.
context: |
  [what-crosses-from-the-recorder](what-crosses-from-the-recorder.yml) closed by naming the line
  it had not drawn: *how much of a page may be quoted when the question is "when did the Army
  acquire this" and the answer sits three rows above a 2019 sale between two private people.* It
  said that was better decided against a real page. Four real pages arrived.

  Volume 0028A pages 163–166 are the NW quarter of section 17, T3S R7E — part of the ground under
  the Ford engine plant. Between them they carry about 95 deed rows and 90 mortgage rows from 1834
  to 2003. Perhaps a dozen of those rows are about Ford. The rest are a farming quarter changing
  hands: named couples, decedents' estates, life estates terminated, small mortgages to building
  and loan companies, and conveyances as recent as 2003.

  Ohio makes these public records and the county publishes them. That is not the question. The
  question is what this corpus, which has [no need](auditor-parcels-access-terms.yml) for a
  private individual's name attached to their ground, should carry.
decision: |
  **The written question chooses the rows.**

  1. **Take the rows that answer it.** For "when did Ford acquire this ground", that is every row
     where Ford Motor Company or its assembler is a party, and the chain of corporate owners
     behind them.
  2. **Count the rest rather than transcribing them.** "About 95 deed rows, of which twelve
     involve Ford" is a true and useful statement about the page that names nobody. It preserves
     what a reader needs — how much this ground moved, and how much of that was Ford — without
     republishing a private conveyance.
  3. **Name a party where the party is the answer.** Companies, government bodies, and the
     historical figures this corpus already holds are named: National Lime & Stone, DTI
     Enterprises, the D.T.&I. Railroad, the United States, B. C. Faurot. A private individual is
     named only where the corpus is answering a question about that person.
  4. **The grantors of a landmark's site are described, not named.** Ford bought part of this
     ground from a married couple in January 1956. The corpus records the date, the volume and
     page, and that the grantors were individuals. Their names answer no question it is asking.

  Rule four is where this is deliberately conservative, and the cost is real: a reader who wants
  to know which family farmed the ground the engine plant stands on will not learn it here. The
  volume and page are recorded, so the record itself is one lookup away for anyone with the
  question — which is the balance this corpus strikes everywhere else between citing a source and
  becoming one.
rationale: |
  **The generalisable form: a source is not a licence to publish everything on the page it
  answered from.** This corpus already works that way with every other source and has never had to
  say so, because a census table has no individuals on it. The tract books are the first source
  where the answer and a stranger's private business are printed on the same line, and the rule
  that was implicit everywhere else has to become explicit here.

  **Why counting is not a dodge.** A count is a fact about the record and a strong one: this
  quarter changed hands about 95 times in 169 years, and a dozen of those were one company
  assembling a factory site over eighteen months. That is the shape of the page. What the count
  drops is exactly the part with no bearing on any question the corpus has written down.

  **What this does not settle.** Where a private party's name *is* the answer — a question about
  who assembled a site, or who a road is named for — rule three admits it and rule four does not
  forbid it. The two are in tension by design, and the tension is the judgment. What is not
  admitted is naming someone because they happened to be on a page fetched for another reason.

  **A note on age.** It is tempting to draw the line at a date — anything before 1950 is history,
  anything after is somebody's business. That was considered and rejected: it would have licensed
  transcribing every row on sheets 1 and 2 of this quarter, which is 40 rows of nineteenth-century
  farm conveyances that answer nothing this corpus is asking either. The question is the filter,
  not the calendar.
status: accepted
date: "2026-08-30"
