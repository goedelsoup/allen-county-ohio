id: an-address-of-record-is-not-a-residence
summary: >-
  The Supreme Court of Ohio's attorney directory can be searched by county, and it puts thirteen of
  this corpus's named officers in Allen County. It does not put one of them at home there. The
  county in that register is the county of a business address, the source says so in its own
  disclaimer, and a result does not say whether the address it returned is a business or a
  residence. Seven `[open]` markers asking where a district officer lives stay open, and now stay
  open for a cited reason.
context: |
  [one-marker-is-doing-three-jobs](one-marker-is-doing-three-jobs.yml) counted the repeated
  questions in the `person` and `tenure` classes and found that twenty markers were four questions:
  where a state or federal officer lives (7), whether a judge was admitted to the Ohio bar (6),
  a person's dates (5), and how a seat was filled (2). It said four instruments would close twenty
  markers and that no phase had gone looking.

  This phase went looking for one instrument and found that it answers one of the four questions
  and forbids itself from answering another.
decision: |
  **The bar question is closed, for all six, to the day.** Every judge of this county's courts is an
  Ohio attorney admitted by examination, and so are the four appellate judges, the prosecuting
  attorney and Lima's director of law. Thirteen of this corpus's named officers return from a
  county-scoped query on the register, each with an admission date, a registration number and an
  active status, and every one of the thirteen was admitted by examination rather than by motion.
  The earliest is 7 May 1979 and the most recent 17 November 2008. [verified]

  **The residence question is refused, and the refusal is now sourced.** The directory's own
  disclaimer reads: "The directory lists an attorney's business address. An attorney's residence
  address is displayed only if the attorney has not provided a valid business address." Four judges
  of [the Third District Court of Appeals](../corpus/office/judge-of-the-third-district-court-of-appeals.yml)
  carry an Allen County address in that register, and the Third District sits in Lima — so the
  register would return Allen County for an appellate judge living in any of the seventeen counties
  the district covers. The datum is consistent with residence here and equally consistent with a
  desk here. It does not distinguish them.

  **And two of the seven are not in the register at all.** The state senator does not appear as an
  Ohio attorney under any address. The congressman's district reaches this county, and the only
  James Jordan in the statewide register carries a different middle name; joining them would be a
  guess.

  **So: where a source's geography is the geography of its paperwork, name the paperwork.** This is
  the fourth consecutive phase in which a federal or state file's county field turned out to be an
  administrative address rather than ground —
  [a grant file counts offices not ground](a-grant-file-counts-offices-not-ground.yml) for the
  applicant's domicile, the ballot-versus-register split for
  [the elected seats](../corpus/measure/allen-county-elected-seats-2026.yml), and now the address
  of record. The pattern is stable enough to check for by default.
rationale: |
  **A cited refusal is worth more than a closed marker.** Seven nodes said "this corpus has not
  read the provision that says so", which invited the next phase to go and read it. The provision
  is not the difficulty; the register is, and the register cannot answer. Turning seven "not
  looked" markers into one "looked, and here is why it cannot" is the larger gain, and it is the
  kind of `[open]` the preceding decision called a refusal rather than a task.

  **The temptation this resists is specific and it would have been easy.** Thirteen of this corpus's
  officers return from a county-scoped query on their own names. Writing "the register places them
  in Allen County" would have been true of the register and silent about the fact that the register
  is a mailing list. The corpus's own worked example of that error is
  [the FEMA applicant file](../corpus/measure/allen-county-disaster-aid-applicants-2005-2025.yml),
  where a shared identifier put another state's county in an Allen County total.

  **The county field is self-reported, and the county's geography proves it.** Of 305 Lima, Ohio
  addresses in the register, 298 name Allen County and seven name none — and Lima lies wholly in
  Allen County. [Delphos](../corpus/place/delphos.yml) divides thirteen Allen to seven Van Wert
  with none left over, and [Bluffton](../corpus/place/bluffton.yml) six Allen to two Hancock with
  none left over. The field is complete exactly where a county line runs through a city and
  incomplete where none does, which is the opposite of what a careless reader would predict, and it
  means 334 is a floor.

  **What this does not license.** It does not license deleting the seven markers, and it does not
  license the reverse inference either: an officer absent from the register is not thereby a
  non-resident, only a non-attorney. Nor does it license reading the register's 144 active
  registrations as the county's practising bar. That number is a count of addresses on file.
