id: an-order-is-not-a-chronology
summary: >-
  The 1906 county history prints three rosters of the county's legislators on facing pages. One
  carries districts and years and can be checked line by line against the federal record; the other
  two carry seventy names in order and not a single date. A sequence of names is not a series of
  facts, and the corpus may not turn one into the other by counting positions and dividing by years.
  Where a roster gives order without dates, the corpus records the order, records that the dates are
  missing, and looks for them somewhere else entirely.
context: |
  The corpus went to the 1906 history's legislative chapter expecting three lines of holders, having
  settled in [a table is the line and a tenure is the turn](a-table-is-the-line-and-a-tenure-is-the-turn.yml)
  that a succession of officeholders belongs in a measure as a table. That decision assumed the
  table would have years in it. Two of these three do not.

  The congressional list is everything a roster should be: five district headings, twenty entries,
  each with a home county and a span. Laid against
  [the federal record](../catalog/congress-legislators.md) Congress by Congress, nineteen of the
  twenty survive intact. See [the county in Congress](../corpus/measure/allen-county-in-congress-1831-1933.yml).

  The two state lists are names separated by commas. Thirty-five representatives "beginning with the
  36th General Assembly which began its session on December 4, 1837"; thirty-five senate entries
  from the 32nd, seated 2 December 1833. No years follow. The same book cites the 74th General
  Assembly as of 1901, so thirty-five representatives are spread over at least thirty-nine
  assemblies and thirty-five senate entries over at least forty-three, and three senate names recur
  with another between them — which proves the senate list is a list of terms and not of men, and
  proves nothing about which terms. See
  [the county in the General Assembly](../corpus/measure/allen-county-general-assembly-1833-1906.yml).

  The temptation is arithmetic, and it is very strong. Sixteenth of thirty-five, over a span of
  seventy-three years, interpolates to about 1866 — and the corpus already holds "the Boesel
  railroad bill", passed in April 1872, which put $100,000 of bonds to a vote in Lima and Ottawa
  Township and carried with eight votes against. A Charles Boesel is sixteenth in the senate roster.
  The interpolation would have joined them and would have been a fabrication with a plausible error
  bar on it.
decision: |
  **A roster without dates establishes order and nothing else, and position is never converted to a
  year.** No interpolation, no even spacing, no "roughly the 1860s". The corpus may say a name is
  sixteenth of thirty-five and may say what the list's first year is; it may not say when the
  sixteenth served.

  **Three practical consequences.**

  1. An undated roster cannot produce tenure nodes and cannot produce a dated table. It produces a
     count, an order, and an `[open]` naming exactly what is missing. The measure that holds it says
     so in its own first lines rather than in a footnote.
  2. Where the corpus already holds a dated event and an undated roster name that plausibly join,
     the two stay apart and the near-miss is written down. The Boesel case is recorded in the
     General Assembly measure not as a fact about Boesel but as a demonstration of what the list
     costs.
  3. The repair for an undated list is not in the list. Isaiah Pillars is the twenty-fifth of the
     thirty-five representatives and the only one this corpus can date — "In 1871 he was elected
     Representative, but declined a second term" — and that sentence is in the book's chapter of
     legal biographies, ninety pages away. Dating a roster of this kind is done one person at a
     time, from prose, and the corpus should expect to date very few of them.
rationale: |
  **This is the fourth member of a family and the first one about form rather than vantage.** The
  three before it are all about reading a source's content wrongly:
  [the administrative key is not the thing](the-administrative-key-is-not-the-thing.yml) — a field
  that is present and means something else; [an index of the held is not an inventory of the
  made](an-index-of-the-held-is-not-an-inventory-of-the-made.yml) — a record that is absent and read
  as an absent thing; [a dollar is labelled by whoever is holding it](a-dollar-is-labelled-by-whoever-is-holding-it.yml)
  — a fact true in several ledgers at once. This one is about a source's shape. The names are right,
  the order is right, nothing is mislabelled and nothing is missing that the compiler thought he
  owed the reader. The list simply does not answer the question the corpus wants to ask it, and the
  danger is that it looks as though it nearly does.

  **The same page proves the rule is not about county histories being careless.** The compiler who
  printed seventy undated names printed, immediately below them, a congressional roster with home
  counties and years that survives a check against a federal database he could not have imagined.
  He knew what a dated roster was. He did not have the dates for the other two, and he did not
  pretend to.

  **The cost is stated so the next account can check it.** Sixty-six named people enter this corpus
  with no year attached to any of them — the largest such block it holds. If a later phase finds an
  Ohio legislative roster with years, that block becomes sixty-six datable claims at once, and the
  measure that holds it is written to be replaced rather than amended.
