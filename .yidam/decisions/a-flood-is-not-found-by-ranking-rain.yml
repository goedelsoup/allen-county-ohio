id: a-flood-is-not-found-by-ranking-rain
summary: >-
  Last phase ranked the county's twenty wettest days and carried each to a river. Six of the
  eighteen floods this corpus now holds are in that list; twelve are not. The best-evidenced flood
  found since — a major one at Fort Shawnee, named to the day by the county's own study, carrying
  the first insurance claims ever paid here — fell on a day that ranks 1,316th of 45,272. A rain
  ranking is a finding aid for one kind of flood and blind to the rest, and the corpus says which
  kind when it uses one.
context: |
  [The twenty wettest days](../corpus/measure/the-twenty-wettest-days-against-the-river.yml) was a
  good phase and it found a real flood. It was also a method, and the method is now measurable
  against its own results, because the corpus can rank every flood it holds by the rain that fell on
  it.

      flood                          wettest day within ±2   rank of 45,272
      22 Aug 2007                              5.08 in                  1
      16 Jun 2015                              4.93 in                  2
      13–14 Jun 1981                           4.38 in                  4
      16 Jul 1915                              4.02 in                  5
      Mar 1913                                 3.35 in                 10
      26 Apr 2019                              3.26 in                 13
      12 Mar 1939                              2.53 in                 46
      9 Feb 1959                               2.34 in                 67
      28 Feb 2011                              2.15 in                 86
      28 May 2014                              2.01 in                104
      29 Jun 1957                              2.00 in                105
      16 Jun 1946                              1.88 in                131
      22 Jan 1959                              1.84 in                140
      21 Apr 1964                              1.70 in                187
      6 Jun 1947                               1.68 in                199
      16–18 May 1943                           1.50 in                292
      13 Feb 1950                              1.41 in                374
      **14 Mar 1978**                      **0.84 in**            **1,316**

  [verified] — [GHCN-Daily](../catalog/ghcn-daily-lima.md), station USC00334551, each flood's date
  taken from its node and its window ranked here. **Six in the top twenty; the median flood is near
  rank 130.** A twenty-day list is a third of the answer.

  **And the shape of what it misses is not random.** The largest flow ever measured on this river
  came from 1.84 inches falling on frozen ground; thirty insurance claims came from 2.15 inches on
  snow; and 0.84 inches on a melting seventeen-inch snowpack was called *major* by the engineers who
  wrote the county's flood maps. Every one of the three is a winter or early-spring flood where the
  ground, not the sky, decided the outcome — and a rain ranking sorts them to the bottom by
  construction. The county's flood insurance study names eight Ottawa River floods and five fall in
  January, February, March or April.
decision: |
  **A ranking of one variable is a finding aid for the floods that variable causes. Before it is
  used to look for what is missing, name the mechanism it cannot see, and pair it with a ranking of
  the thing that carries the water.**

  - **Rank the river, not only the sky.** The daily discharge series is in the same catalog entry as
    the peaks and covers 1923 onward. Ranking *its* largest days finds the snowmelt floods directly,
    and it is one request per gauge.
  - **A prose flood history outranks both.** The study named 14 March 1978 with a date, a village
    and a mechanism, and no instrument ranking would have surfaced it. Where a source enumerates
    events, read the enumeration before ranking anything.
  - **Say what a list is a list of.** The wet-days node is not withdrawn and is not wrong: it
    settled fifteen days and found a flood. What it must not be read as is a census of the county's
    floods, and it now says so.
  - **This does not put the previous phase's figures in doubt.** Every rank, crest and percentile it
    published stands. The defect is in what a reader would infer from the list's completeness, which
    is the same failure as
    [a filter that is ignored](a-filter-that-is-ignored-is-worse-than-one-that-is-refused.yml) — a
    correct number that invites a wrong conclusion.
rationale: |
  **The corpus keeps rediscovering that its instruments have a shape.**
  [a zero is not a blank](a-zero-is-not-a-blank.yml) found an observer who stopped measuring snow;
  [a neighbour's gauge](a-neighbours-gauge-is-not-this-countys-record.yml) found a basin sixteen
  kilometres east; this finds a variable that is only sometimes the cause. All three are cases where
  the data are correct and the question they answer is narrower than the question asked.

  **What makes this one worth a rule is that the corpus wrote the method itself, last phase, and
  the method was reasonable.** Ranking rain to find floods is what anyone would do. It is measurably
  a third right, and the third it misses is the third this county actually has — a flat, cold,
  agricultural county whose largest measured flow came from under two inches of rain in January.

  **What would change this rule.** A record of soil moisture or frost depth for this county, which
  would let the ranking be conditioned rather than replaced. Nothing in this catalog carries one
  before 1996.
status: accepted
date: "2026-09-09"
