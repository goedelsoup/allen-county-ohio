id: a-model-fitted-to-a-survey-is-not-a-second-witness
summary: >-
  The corpus now holds two annual accounts of who in Allen County has no health insurance, and one
  of them is fitted to the other. The Small Area Health Insurance Estimates take the American
  Community Survey's direct estimate as their dependent variable and shrink it toward administrative
  covariates that include Medicaid enrolment. Where the two agree, that is the fit; where they
  disagree, the difference is the model. Neither case is corroboration.
context: |
  The Bureau publishes a county uninsured rate for every year since 2008 and it is the only annual
  county series that exists. It also publishes, in the American Community Survey, a direct estimate
  of the same quantity for the same county in the same years, with margins roughly twice as wide.

  For Allen County under 65 the two run together and then part:

      year   ACS one-year        SAHIE
      2021   8.37 ± 1.63        8.2 ± 0.9
      2022   6.57 ± 1.86        6.8 ± 0.9
      2023   6.66 ± 1.52        6.8 ± 0.8
      2024   5.57 ± 1.37        7.1 ± 0.8

  In 2024 the model is 1.5 points above the survey it is fitted to — 5,613 people against 4,410 —
  and its interval is little more than half as wide. The narrower interval is not more observation.
  It is what borrowing strength from tax returns, food-stamp counts, business patterns and Medicaid
  enrolment buys, and the price of it is that the estimate is no longer only about the people the
  survey asked.

  The temptation this creates is specific. The county's modelled uninsured rate falls from 12.8 per
  cent in 2013 to 7.2 in 2016, and Ohio expanded Medicaid on 1 January 2014. The obvious sentence
  writes itself, and the model was told the Medicaid enrolment.
decision: |
  **Four rules, and the first two are about the agreement rather than the disagreement.**

  1. **Never report a model and its own dependent variable as two sources agreeing.** Say which is
     the observation and which is the reading of it. Where this corpus quotes both, it quotes the
     survey for the level and the model for the path, and says so in the same breath.

  2. **Where they differ, attribute the difference to the model and not to the county.** A
     divergence between an estimate and the survey it was fitted to is a statement about shrinkage,
     covariates and vintage. It is never evidence that something happened on the ground.

  3. **Rule 2 of [a modelled estimate is not an observation](a-modelled-estimate-is-not-an-observation.yml)
     binds this source too.** Medicaid participation, CHIP participation, SNAP recipients, federal
     tax returns, County Business Patterns employment, and decennial tenure are all model inputs
     here. So this file may not be used to show that the expansion cut the county's uninsured rate,
     that coverage follows income, or that the county's transfer receipts and its coverage move
     together. It may be used to say what the Bureau estimates, and to compare one county's estimate
     with another's on the same model.

  4. **What the survey counts directly, take from the survey.** The American Community Survey's
     coverage-type tables count who reports Medicaid, employer coverage or none, by age and by
     place, and that is an observation of households rather than a prediction about them. Every
     compositional claim in this corpus about coverage comes from there.
rationale: |
  **The corpus already had the rule and this is its second case, on a source that looks nothing like
  the first.** PLACES is a small-area model built from a telephone survey that never sampled the
  tracts it publishes; nobody would mistake it for a count. SAHIE publishes a county figure for a
  county that really was sampled, with a margin of error, from the agency that ran the sample. It
  has every mark of a direct estimate and is not one, which makes it the more dangerous of the two.

  **It is not the same failure as a reprint.**
  [A reprint is not a second witness](a-reprint-is-not-a-second-witness.yml) and
  [two papers printing one dispatch are one witness](two-papers-printing-one-dispatch-are-one-witness.yml)
  are about identical text arriving twice. A fitted model does not repeat its source — it differs
  from it, by construction, and the difference looks exactly like independent information. The 2024
  row above is a gap of 1,203 people between two federal publications about one county, and there is
  nothing in the county behind it.

  **What it costs.** The single most quotable finding in the phase: that Ohio's Medicaid expansion
  halved the number of uninsured people in Allen County. The corpus states the fall, states the
  date the expansion began, states that the fall is in the adults and not the children — and does
  not join them, because the joint is inside the model.

  **What it buys.** A reason to hold both files rather than one. The survey is the witness and is
  too noisy to see a single year; the model is precise and is partly made of the thing a reader
  wants to explain. Neither alone would have been enough to notice the 2024 divergence, and the
  divergence is the most useful thing either of them said.
status: accepted
date: "2026-09-04"
