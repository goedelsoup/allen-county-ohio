id: a-remedy-is-not-a-finding
summary: >-
  A federal court ordered in 1974 that patients at Lima State Hospital must not be required to
  shine employees' shoes, must have eighty square feet each, and must be given clean linen at least
  weekly. Read as evidence those sentences describe a place. They do not: the order says in its own
  second paragraph that many of its paragraphs were "excerpted verbatim" from an Alabama case about
  Alabama institutions. What a court orders is a remedy. What it finds is a finding. Only the second
  is evidence about the ground.
context: |
  *Davis v. Watkins*, 384 F. Supp. 1196, is the first of three published opinions in one class
  action on one docket about the state hospital north of Lima. It is fifty-six thousand characters
  of specific, quotable, terrible detail — floor space, toilets per patient, showers per patient,
  bans on corporal punishment, a prohibition on "repetitive, nonfunctional, degrading, and
  unnecessary tasks (so-called 'make work') such as buffing a waxed floor that has already been
  sufficiently buffed, polishing brass, or shining employees' shoes."

  Every sentence of that invites the reading *therefore this is what was happening here*. The
  opinion forecloses it in its own second paragraph:

      The Court has carefully studied the opinion of Judge Johnson in Wyatt v. Stickney, 344
      F.Supp. 373 ... and agrees almost totally with the reasoning of that case and the remedies
      announced therein. Many of these paragraphs have been excerpted verbatim from that opinion.

  So the shoes are Alabama's. A corpus quoting that clause as a fact about Allen County would be
  reporting a 1972 finding about Bryce Hospital in Tuscaloosa.

  The same case file contains the other thing, and the contrast is what makes the rule usable.
  *Davis v. Balson*, 461 F. Supp. 842 (1978), and *Davis v. Hubbard*, 506 F. Supp. 915 (1980), are
  findings of fact under Rule 52 on a record built from stipulations, depositions and a trial.

      what the 1974 order requires        what the 1978 and 1980 opinions find
      80 sq ft per patient in a           rooms of 6' x 9' in the old building and
        multi-resident room                 7' x 11' in the Ascherman unit
      one toilet for six patients         a thirteen-foot fence with barbed wire and
      one shower for eight                  seven guard towers manned round the clock
      linen changed every seven days      1,295 patients in March 1971, 783 in August
      no "make work"                        1973, and slightly over 400 in 1980
                                          73 per cent of patients on a psychotropic
                                            drug and 85 per cent able to decide for
                                            themselves whether to take it
                                          a patient population 44.8 per cent Black

  The left column is a standard. The right column is Allen County.
decision: |
  **A court's order is evidence of what a court required. Only its findings of fact are evidence of
  what was there. Before quoting a remedial order as description, establish that the sentence is a
  finding.**

  - **Read the opinion for its own provenance.** Remedial orders in institutional litigation are
    routinely copied from earlier cases in other states; the copying is usually stated, as it is
    here, and it is stated near the top.
  - **Prefer the later opinions in a long case.** A consent-shaped interim order comes first because
    it is quick; the findings come years later, after a trial. In this case the useful evidence is
    in the third opinion, six years after the first.
  - **A prohibition is not an accusation.** "Patients shall not be required to shine employees'
    shoes" is compatible with its never having happened at this institution, and a node that treats
    the two as equivalent has invented a fact with a citation attached.
  - **Where the finding and the standard are both available, print both and label them.** The
    distance between them is the actual measurement — 54 square feet against an ordered 80 is a
    fact, and either number alone is not.
rationale: |
  **The failure produces the most vivid and most citable sentences a corpus can find.** That is
  precisely the danger. A remedial order is written to be specific and is drafted by lawyers to
  cover every contingency, including contingencies nobody alleges; its specificity is a property of
  legal drafting rather than of the place. Nothing in the prose distinguishes the copied paragraph
  from the local one.

  **It is the case-law form of a rule this corpus already has.**
  [the legend is not the record](the-legend-is-not-the-record.yml) says a map's vocabulary is chosen
  for drawing. An order's vocabulary is chosen for enforcement — it has to be enforceable against a
  future superintendent, so it states floors rather than describing floors.

  **The distinction is not a reason to avoid the source.** This case is the best evidence this
  corpus holds about the largest institution ever built in Allen County: a population, a racial
  composition, a fence, a room size and a medication rate, all stipulated or tried. Every one of
  those comes from the two opinions the rule points at.

  **What this does not license.** Treating a remedial order as saying nothing. That a court thought
  a provision necessary enough to enter against these defendants is itself a fact about the
  litigation, and where the order departs from the case it copied, the departure is local by
  construction.
status: accepted
date: "2026-09-03"
