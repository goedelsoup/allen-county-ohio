id: state-after-eighty-three-phases
summary: >-
  Fifty-six phases since the last account. The corpus has grown from 429 nodes to 485 and every one
  of those 56 nodes is in one of seven classes; the other six have not moved at all. The last
  account read that as thinness. It is mostly completeness — and what it hides is a real freeze in
  one class the corpus built on purpose and then stopped using.
supersedes: state-after-sixty-six-phases
context: |
  `yidam status`: **485 nodes** · 69 sources · 85 assertions · claims 2237v / 856i / 382o · genesis
  2026-08-28. Eighty-three phases merged, 84 decisions recorded.

      class          then   now          class          then   now
      measure          85   115          site             16    16
      person           86    89          question         13    14
      tenure           80    80          natural-feature   8    10
      jurisdiction     38    38          division          8     8
      organization     21    32          period            6     7
      event            16    28          place            25    25
      office           23    23

  **Six of the thirteen classes are exactly where they were fifty-six phases ago.** Tenure at 80,
  jurisdiction at 38, place at 25, office at 23, site at 16, division at 8. All 56 new nodes are
  measures, organizations, events, people, features, questions and one period.

  The catalog moved in a way the last account asked for and did not predict. Of 69 sources, 12 are
  published in this county — three histories, the county's site, GIS, auditor, recorder and common
  pleas rules, the city's site, the sheriff's roster and the appellate court — against seven at the
  last account. The rest are still Washington and Columbus, and three of the newest are neither a
  federal statistic nor a local record but a *finding aid*: a union list of newspapers, a survey of
  libraries, a census of congregations. That class of source did not exist here at all.
decision: |
  **The last account's central number was wrong about what it measured.** "Six of thirteen classes
  have fewer than twenty instances" was ranked a defect. Five of those six are small because the
  county is: there are 25 named places, 38 units of government, 12 townships and 9 municipalities,
  and the Census Bureau's gazetteer and census of governments closed both lists. A class that has
  stopped growing because it has enumerated its subject is finished, not thin.
  [A count of absences is not an agenda](a-count-of-absences-is-not-an-agenda.yml) said the same
  thing about blank fields; this says it about class sizes, and the two together retire counting as
  this corpus's way of choosing work.

  **One of the six frozen classes is genuinely frozen and it is the one the corpus built for
  itself.** `tenure` — one person's holding of one office over one interval — has not gained a node
  in fifty-six phases, across which the corpus dotted a ninety-nine-year hole in the mayoralty,
  dated thirteen judges' admissions to the bar, named four mayors of Lima and read two villages'
  election returns. Every one of those went into a *measure*, as a table, because
  [a line of holders is a table](a-line-of-holders-is-a-table.yml) said it should. That decision was
  right about the sheriffs and it has had a consequence nobody chose: the relator class exists, has
  80 instances, and is no longer how this corpus records who held what.

  **Where the work goes next is a source question, not a count question.** Three of the last four
  phases were opened by asking what a source is keyed to, what would have listed a thing, and whose
  ledger a figure is in — and each returned something the corpus had written off. The instrument
  that is working is the one that reads a held source a second way. The instrument that is not
  working is the one that ranks gaps by how many blanks they have.
rationale: |
  **What the shape says now.** Measure is 115 of 485 nodes, 24 per cent, against 20 per cent at the
  last account, and 77 of the 115 carry an `as_of` in the 2020s — 67 per cent, up from 62. The
  corpus reaches for the current file first and has got *more* inclined to, not less, even in a
  stretch that added a war roll from 1946, a church survey from 1920, a newspaper directory running
  to 1843 and a permit series to 1990. Those are dated by their subject and the habit is dated by
  its denominator.

  **What has gone right and is worth naming because it was not obvious.** The corpus stopped
  treating a surprise as a local anomaly. Seven consecutive phases found an administrative key
  meaning something other than it appeared to, and the eighth wrote the rule down instead of the
  eighth instance. Two phases later the complement arrived — a record absent, read as absence — and
  one after that the third member, a fact true in several ledgers at once. Three rules in four
  phases, each general, each cited since. That is the corpus doing the thing it exists to do, and it
  did not happen by counting anything.

  **The risk this account is recording against itself.** Eighty-three phases in, the easiest
  remaining work is another federal dataset about the present, and the corpus is good at it: a file
  arrives, four nodes and an assertion come out, the gate passes. The three source rules were all
  found by going back to something already on the disk. Nothing in the workflow makes that the
  default, and this node does not fix it — it names it, so the next account can say whether it got
  worse.
