id: a-declaration-is-a-ratio-not-a-sum
summary: >-
  The Village of Fort Shawnee was declared to be in a state of fiscal emergency by the Auditor of
  State on 16 September 2010. The unprovided portion of its aggregate deficit was $50,761 and its
  treasury deficiency was $18,211. Every test in Ohio Revised Code 118.03 is a ratio against
  one-sixth of a year's receipts, so the label says the village was small before it says anything
  about how badly it was run, and a node that prints the label without the denominator has
  published the wrong fact.
context: |
  The statute names six conditions and a village is in fiscal emergency if any one holds. Fort
  Shawnee met three of them, and the amounts are these:

      condition                             31 Dec 2009    31 May 2010
      unprovided aggregate deficit             $70,778        $50,761
      treasury deficiency                       $5,075        $18,211
      general fund accounts payable 30 days       $761              —
      one-sixth of the general fund budget     $51,543        $53,372

  A general fund of about $320,000 a year. The largest single hole is a permissive motor vehicle
  fund $81,468 in deficit and a contract police fund $54,657 in deficit; the largest positive
  balance is a street construction fund holding $214,273, which is more than the whole treasury.
  The village had no debt at all.

  Written as sums, none of this reads as an emergency. Written as ratios it is one, and the ratio is
  the statute's: a body that has promised $315,419 to its own funds and holds $164,982 in the bank
  is out of proportion whatever the size of the numbers.

  There is a second thing the label conceals. Mayor Dennis Shaffer asked the Auditor of State to
  perform the analysis, under Sections 118.021 and 118.04(A). The declaration is not something that
  happened to the village; it is the answer to a question the village put.
decision: |
  **Where a source states a legal determination, the node prints the test, the amounts and the
  denominator. The label on its own is not a finding.**

  - **Name the statute and the conditions met.** "Fiscal emergency" is four words; 118.03(A)(4),
    (A)(5) and (A)(6) are three tests with three schedules behind them, and a reader who is told
    only the label cannot tell a village that missed payroll from a village that did not.
  - **Print the denominator beside the amount.** One-sixth of a year's receipts is what the
    threshold is measured against, and without it $50,761 is a number with no size.
  - **Never rank units by a determination.** A declaration is a legal act on a ratio, so two bodies
    carrying the same label are not in comparable trouble and a count of declarations across a
    county is a count of ratios crossed, not of money lost.
  - **Record who asked.** Ohio's fiscal analyses are begun on the auditor's own motion, on a
    council's request, or on the mayor's. Which of the three it was is a fact about the government
    and it is printed on the first page.
  - **An absent determination is not health.** A body that has never been analysed has no row, and
    the corpus says so rather than reading the silence as solvency; see
    [a zero is not a blank](a-zero-is-not-a-blank.yml).
rationale: |
  **The failure this prevents is a real one and it is close by.** This corpus holds 62 findings for
  recovery against 36 Allen County bodies and no amount for any of them, because the amount is
  inside a PDF and the search carries a flag. It would be easy to write *nine of the county's twelve
  townships have had money found against them* and let a reader supply the scale. Nine of twelve is
  true. The scale is not in the file.

  **It is not the small-count rule.** [A count of tens is a draw](a-count-of-tens-is-a-draw.yml)
  governs a number that moves on its own because it is small. Nothing here is noisy: $50,761 is
  $50,761, and the question is what to compare it with. The two rules meet on the same page whenever
  a small government is the subject and they are answering different objections.

  **Nor is it the rating rule.** [A rating rates one thing](a-rating-rates-one-thing.yml) governs a
  compound score whose inputs are hidden. A statutory determination is the opposite: the test is
  written in the Revised Code, the schedules are printed, and every input is visible. What makes it
  dangerous is not opacity but the word — *emergency* carries a magnitude the arithmetic does not.

  **What this does not license.** Declining to report the determination. It is a legal fact with a
  date, an authority and consequences — a financial planning and supervision commission follows it —
  and it belongs on the node of any body that has one. The constraint is on reporting it alone.
status: accepted
date: "2026-09-04"
