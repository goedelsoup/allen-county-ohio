id: a-roster-of-elected-officials-is-not-a-record-of-elections
summary: >-
  The source is called an elected officials lookup and forty of the two hundred and eleven people
  on it were not elected to the seat they hold. It marks them, so the corpus is not misled — but
  the roster's own name is a claim about how these offices are filled, and for a quarter of this
  county's local government that claim is false.
context: |
  Read across all eighty-eight of its precinct pages, the roster gives 218 elective seats over
  ground in Allen County: 211 held, 7 vacant, and 40 of the 211 marked `*Appointed*`.

  Where they fall is the whole of the finding:

      county offices and judgeships    22 seats     0 appointed
      townships                        48           1
      school boards and the ESC        50           7
      cities                           21           6
      villages                         52          25, and 5 seats empty

  A reader coming to this corpus for *who governs Cairo* would, from a roster of elected
  officials, take away five names and the impression that Cairo elected them. Its council is five
  appointees and a vacancy. Not one member of it stood before the village's voters for the seat.
decision: |
  **Read the marker, and infer nothing about elections from a roster of officials.**

  Three claims the corpus is now entitled to make from this source, and one it is not.

  Entitled: who holds a seat; on what term, to the day; and whether the roster says that holder was
  appointed to fill it. All three are printed. The seat count node states each of them and no more.

  Not entitled: anything about *why*. The appointment rate does not establish that nobody stood,
  that nobody filed, that turnout was low, or that these villages are failing. A roster records
  the state of an office, and the mechanism that produced the state is in a different file — the
  election returns, which this corpus holds for three general elections and has never read at the
  village level. Every node written in this phase that names an appointment carries that refusal
  in its own voice rather than relying on this record to carry it.

  The corollary is a caution about names. This is the third source in four phases whose title
  described it more confidently than its contents warranted — after
  [a register that was not a census](a-register-is-not-a-census.yml) and
  [a survey that is not a count](a-survey-is-not-a-count.yml) — and it is the first where the
  overclaim is in the *title* rather than in the data. `elected officials lookup` is what the
  boards of elections call the file. It is not a description of what is in it.
rationale: |
  **The corpus already had the discipline and applied it in the wrong place.** It refuses to read
  the county's uniform (R) as a fact about this county's voters without an election return beside
  it, and says so twice in the catalog entry for this same source. That is exactly the refusal the
  appointment marker needs, and it was reached for the partisan reading and not for the arrival
  reading — because the party letters looked like an interpretation and the word `*Appointed*`
  looked like a fact. Both are facts about a roster; only one of them is about an election.

  **A note on what this phase did not become.** Two hundred and eleven officeholders arrived and
  the corpus wrote one person node and one tenure. The rule is
  [node-worthiness is a property of the member](node-worthiness-is-a-property-of-the-member.yml),
  and this is its fourth application and the first against the class it was written about. People
  and tenures are 131 of this corpus's 309 nodes already, 42 per cent, and the sheriff roster is
  most of that; a person and a tenure for every seated holder would have been 397 more, leaving
  three quarters of the corpus made of rows. The sheriffs earn their nodes because they are a
  *series* — one office through a hundred and ninety years, where the fact of interest is
  succession. These 211 are a *moment* across 101 offices, where the fact of interest is
  distribution, and a distribution is a measure. Sharetta T. Smith is the exception because the
  office node was seeded empty and said in its own text that it was waiting for exactly one thing.
status: accepted
date: "2026-08-30"
