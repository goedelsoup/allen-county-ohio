id: state-a-refusal-at-the-grain-it-protects
summary: >-
  This corpus's most-guarded refusal said it did not measure manufacturing employment "at all". A
  source then measured it — for 1899, 1904 and 1909, sixty years before the period the refusal
  protects. The claim survived untouched and the wording was false. "At all" was the strongest
  thing that happened to be true, and it was the part that broke.
context: |
  [`deindustrialization`](../corpus/period/deindustrialization.yml) is named for a mechanism it does
  not measure, and has said so since genesis:

    It does not establish anything about *manufacturing employment*, which is the mechanism this
    period is named for and which the corpus does not measure at all.

  Two tests were pinned to that sentence one phase ago, on the reasoning that a refusal about what
  the corpus *measures* is structural where a refusal about what it *holds* is retrievable. That
  reasoning was right. What it did not anticipate is that a sentence can be narrowed without being
  answered.

  The 1910 Ohio supplement gave the corpus Lima's manufacturing wage earners — 1,980 in 1899, 2,733
  in 1904, 3,607 in 1909. The period begins in 1970. Nothing about it is now established that was
  not established before, and "does not measure it at all" is false.
decision: |
  **State a refusal at the grain of the claim it protects, not at the widest grain that happens to
  be true.**

  The sentence now reads "It does not establish anything about *manufacturing employment* inside
  this period", and the paragraph beside it carries the three counts that exist and says they are
  all before 1910. Both tests are repointed to the narrow phrase, and each carries a comment saying
  that this was a narrowing rather than an answer — a third kind of event, after the two retirements
  recorded in
  [pin the tripwire to what retrieval cannot answer](pin-the-tripwire-to-what-retrieval-cannot-answer.yml).
rationale: |
  **"At all" was doing rhetorical work, not epistemic work.** The claim the caveat exists to protect
  is that this node's population evidence says nothing about its named cause *within the span it
  names*. Whether the corpus happens to hold an employment figure from 1899 is irrelevant to that,
  and the sentence was stronger for including it — which is exactly why it was written that way.

  This corpus has recorded the same tell twice before, and the wording is nearly identical each
  time. In [the window was the finding](the-window-was-the-finding.yml): the true-and-narrow version
  "would have been much less satisfying to write. That last part is the tell." In
  [a baseline is a choice](a-baseline-is-a-choice.yml): a claim that was right and inflated. Here:
  a refusal that was right and overstated. Three different sentences, one habit — reaching for the
  widest true form of a claim, and being wrong about the width rather than about the claim.

  The practical rule that falls out is cheap to apply. Before writing "at all", "never", "no
  source", or "nothing", ask what the sentence is protecting and whether the wide form protects
  anything the narrow form does not. Here it protected nothing and cost two test edits.

  **The counter-consideration, recorded because it is real.** A refusal narrowed each time evidence
  brushes past it can be narrowed into meaninglessness, one qualifier at a time, until it guards
  nothing. The defence is that the narrowing must be forced by evidence and must leave the protected
  claim identical — both true here — and that the change is recorded where the next reader meets it.
  If a fourth narrowing arrives, that is the point to ask whether the caveat still has a subject.
status: accepted
date: "2026-08-30"
