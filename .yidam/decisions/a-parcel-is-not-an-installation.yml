id: a-parcel-is-not-an-installation
summary: >-
  This corpus read five warranty deeds of June 1951 for the north-west quarter of section 14, found
  the ground had been a mortgaged farm through the Second World War, and concluded that the Lima
  Army Tank Plant was not the wartime Lima Tank Depot. The Army's own historic properties report
  dates the installation to May 1942 and describes that same 1951 purchase as 295 acres bought
  south-east of a base nine years old. A conveyance is evidence about the parcel it describes. An
  installation is not a parcel, and a quarter section is not an installation's boundary.
context: |
  What the corpus had, and it had it right: volume 0034A pages 89–92 of the Recorder's Section
  Ground books abstract the north-west quarter of section 14, township 4 south, range 6 east. The
  United States took it from five private owners between 20 and 28 June 1951. Before that the
  ground was mortgaged in 1940, 1941 and 1944, leased to a fishing and game club in April 1940, and
  crossed by pipeline easements granted by private owners in 1939, 1940 and 1949. Every one of
  those facts is still true.

  What the corpus did with it: it wrote, on two nodes, that "two installations cannot occupy one
  piece of ground eight years apart with a farm in between", and settled the identity question
  against the obvious reading. The plant, it said, is not the Depot.

  What the Army says: construction began in May 1942 on 170 acres about five miles south of Lima;
  the site held 163 contiguous acres from 1943 until 1951; and in June 1951 the Army bought 295
  contiguous acres **just south-east of the original base**, bringing the installation to 458
  acres. The parcels the corpus read are the expansion. The installation they were added to had
  been standing for nine years.

  The caveat was already written. The 1951 event node's last line reads: *It covers one quarter
  section. The installation may hold ground in others, whose sheets have not been read.* Two site
  nodes then reasoned past it in the same phase. The failure is not that the limit was unknown; it
  is that it was recorded and not applied.

  And a second finding of this corpus, made two phases later, was pointing the same way without
  being read that way. No building stands within a hundred and fifty metres of the plant's
  coordinate of record, and the nearest large footprint — 993,868 square feet, the third largest in
  the county — is 632 metres off. That is what a coordinate on land bought for a test track in 1951
  looks like when the works are on the ground bought in 1942.
decision: |
  **A conveyance is evidence about the ground it describes and about nothing outside its metes.
  Before a purchase is read as a founding, the extent of the thing purchased into must be
  established.**

  - **State the parcel and the boundary separately.** A node that dates a facility from a deed says
    which parcel the deed covers and how much of the facility that parcel is. Where the second is
    unknown, the date is not established and the node says so.
  - **A purchase inside an existing boundary is the ordinary case.** Governments and companies buy
    adjoining land continually. An acquisition is only a founding when something independent says
    there was nothing there before.
  - **A negative identity claim needs a source about each of the two things.** *A is not B* drawn
    from one document about a piece of A is not an argument; it is the absence of an argument
    written in the confident voice.
  - **A caveat on a node binds every inference drawn from that node.** Where a limit has been
    recorded — *this covers one quarter section* — an inference that ignores it is a defect whether
    or not it turns out to be true.
rationale: |
  **This is not the tract-page rule.**
  [What a tract page may be quoted for](what-a-tract-page-may-be-quoted-for.yml) governs what may
  be taken *out* of a conveyance record and said aloud; it worked, and nothing quoted here breached
  it. The failure was one step later, in what the quoted facts were made to support. A rule about
  disclosure does not catch an over-reach in inference.

  **The rule that would have caught it was already on the books and was obeyed for one phase.**
  [A second node is not an assertion of difference](a-second-node-is-not-an-assertion-of-difference.yml)
  held the Depot and the plant apart with the identity question written on both, and listed what
  would settle it: "a property record, a National Register nomination, **an Army real-estate
  history**, or any wartime source giving the Depot an address, an acreage or a township." A
  property record arrived first, and the corpus treated it as the settlement rather than as one of
  four candidates. The Army real-estate history has now arrived and says the opposite.

  **What the deeds are actually good for.** They date the county's ground, they name five sellers
  closing inside nine days, and they show that the south-east 295 acres were farmland until 1951 —
  which is exactly what the Army's account of a test-track expansion predicts. Read as evidence
  about a parcel, the abstract corroborates the report. Read as evidence about an installation, it
  produced a wrong answer and a duplicate node.

  **What this does not license.** Refusing to date anything from a conveyance. A deed remains the
  best evidence this corpus has for when a piece of ground changed hands, and the Recorder's books
  remain the route from a coordinate to a chain of title. The constraint is on the size of the
  conclusion, not on the source.
status: accepted
date: "2026-09-04"
