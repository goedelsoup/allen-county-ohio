id: the-administrative-key-is-not-the-thing
summary: >-
  Seven phases running, in seven unrelated files, the field a reader would take for a fact about the
  world turned out to be a fact about paperwork. A county that is a mailing address, a total that is
  a cashier's drawer, a date that is a press day. This is not a run of coincidences and it is not a
  defect of any of the seven sources. It is what an administrative record is, and the corpus now
  checks for it first.
context: |
  Each of these was written up on its own as though it were a local surprise:

  - [a grant file counts offices not ground](a-grant-file-counts-offices-not-ground.yml) — a federal
    disaster file keyed to an applicant's domicile, which put another state's county in an Allen
    County total.
  - the ballot-and-register split in
    [the elected seats](../corpus/measure/allen-county-elected-seats-2026.yml) — a roster keyed to
    what an elector votes on, read as what governs the ground.
  - [an address of record is not a residence](an-address-of-record-is-not-a-residence.yml) — an
    attorney register keyed to a business address, which cannot say where anyone lives.
  - [a weekly reports events, not states](a-weekly-reports-events-not-states.yml) — a newspaper
    keyed to what happened on a press day, which cannot give a term of office.
  - [a grand total is not a budget](a-grand-total-is-not-a-budget.yml) — a fund report keyed to
    everything that touched the treasurer's hands, nine-tenths of it somebody else's.
  - [a county column is a filing decision](a-county-column-is-a-filing-decision.yml) — a gazetteer
    keyed to where a stream ends, which loses eleven that rise here.
  - and now [the Honor List](../catalog/ww2-honor-list-ohio.md), whose county is the county of an
    address a man gave when he entered the Army — or of his next of kin, or of his draft board.
decision: |
  **Before reading a field as a fact about the world, ask what act of administration produced it.**
  Every one of the seven answers the same shape of question: not *where is this*, *what is this*,
  *who holds this*, but *where did we file it*, *what passed through here*, *what did we print that
  week*. The reading is not wrong; it is the answer to a question nobody asked.

  **The seventh is the one that writes the rule down.** The War Department's foreword sets out its
  county assignment in five numbered rules and then says why counties at all: "Counties were
  selected as the unit of breakdown for two reasons: information media rarely circulate in areas
  smaller than counties, and draft boards are located on a county-population basis." The unit is an
  artefact of newspapers and draft boards. A source that explains its own key is rare and it does
  not make the key any more geographic.

  **So the standing check, in three questions.** What act created this row? What did the creator
  need the key for? And is there a second reading of the same file — by ground, by fund, by
  register — that answers the question actually being asked? Where the second reading exists, run
  both and publish the difference; where it does not, say which one you used.

  **And where a source names its own key, quote it.** Four of the seven do, somewhere a reader
  would not look: in a definitions panel behind a collapsed heading, in a foreword, in a note under
  an index page. Those quotations are now the most load-bearing sentences in four of this corpus's
  catalog entries.
rationale: |
  **Generalising costs nothing and the six separate write-ups did not compound.** Each earlier
  decision ends by noting that the pattern had recurred, and each treats it as a coincidence one
  larger than the last. Seven instances in seven consecutive phases across federal, state, county,
  municipal and private records is not a property of Allen County's sources. It is a property of
  records made to run an organisation and read afterwards by somebody outside it.

  **The failure mode is silent in every case, which is why it needs a standing check.** None of the
  seven throws an error, returns an empty set, or looks wrong. A grant file returns a plausible
  county, a gazetteer returns a plausible list, a fund report returns a real total, a newspaper
  returns a true sentence. The corpus caught six of the seven only because something else in it
  disagreed — a polygon, a second query, a village's own election returns, a source's own
  disclaimer. Without a second witness the error is invisible.

  **What this does not license.** It does not license distrusting these sources; six of the seven
  are the best available and the seventh is the only one there is. It does not license inventing a
  correction where no second reading exists — the Honor List's county cannot be re-derived, and this
  corpus states its 171 with the key named rather than adjusted. And it does not license reading
  the pattern backwards: an administrative key that happens to coincide with the ground is not
  thereby wrong, only unverified.
