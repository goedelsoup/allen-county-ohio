id: arithmetic-that-closes-is-about-the-compiler
summary: >-
  One page of the 1906 county history prints a sum that closes exactly, six products that close
  exactly, and a forecast that does not close under any reading. The three tell you different
  things, and only one of them is evidence about Allen County. This records how a printed table is
  tested against itself before any figure in it is cited.
context: |
  The corpus already has rules for how a source is *read*:
  [two-scans-of-one-book](two-scans-of-one-book.yml) for dates,
  [a-printed-list-is-a-dataset](a-printed-list-is-a-dataset.yml) and
  [one-scan-is-a-floor-and-a-residue](one-scan-is-a-floor-and-a-residue.yml) for counting a roster,
  [a-single-witness-read-once](a-single-witness-read-once.yml) for a claim only one book makes. All
  of them govern the passage from the page to the node.

  None of them governs the page. The 1905 transportation chapter of
  [the 1906 history](../catalog/miller-allen-county-1906.md) prints about thirty figures on Lima's
  railroads, and the corpus's habit would be to lift the interesting ones and tag them `[verified]`
  because a book prints them. Read together, they are not thirty facts.
decision: |
  **Before citing a figure from a printed table, add the table up.** What happens next depends on
  which of three things you find.

  **A sum that closes over a list is evidence, and it is evidence about the list.** The chapter's six
  steam roads carry 14, 10, 12, 6, 6 and 1 daily passenger trains and it reports 49; its two
  interurbans carry 20 and 8 and it reports 28; 49 and 28 make the 77 it prints. Nothing was dropped
  between the enumeration and the total. That is the only available evidence that the list of roads
  is complete as printed — not that any road runs the trains claimed.

  **A product that closes over an average is not evidence at all.** In the same block, 143 trains ×
  52 cars is exactly the 7,436 cars printed; × 30 tons is exactly the 223,080 tons printed; 127 × 30,
  178 × 30, 114 × 5 and 134 × 5 are exactly the four tonnages printed. Five counts and three rates
  produce six more figures: fourteen numbers, eight of them observed. **Cite the inputs; never cite a
  derived figure as a second
  witness to its own inputs.** A node that quotes both "7,436 cars" and "223,080 tons" as verified
  has counted one estimate twice.

  **A total that does not close tells you which numbers were counted.** The same page forecasts 145
  trains for 1906 where its own four additions give 150, and no reading of the paragraph reaches 145.
  The count of what exists closes to the unit; the count of what is coming does not close at all.
  Record the discrepancy and read the forecast as an intention.

  **And a figure that will not reconcile with the table beside it belongs to another return.** The
  freight block's 143 daily trains cannot be made to agree with the 90 freight trains the trunk-line
  list sums to, in or out. Say so, and stop; do not repair one page with another.
rationale: |
  **The rule is cheap and it changes the count of what the corpus knows.** Adding up a table takes a
  minute and it demoted six figures on this page from evidence to arithmetic. Those six are the
  impressive ones — a quarter of a million tons a day through a city that held 21,723 at the census before —
  and they are exactly
  the ones a reference would quote.

  **It cuts the other way too, and that is why it is not merely a caution.** The same test promoted
  the trunk-line list: 49 is not a claim the book makes about the world, it is a claim the book makes
  about its own list, and it holds. The corpus had no way to say a nineteenth-century enumeration was
  complete before this; now it has one, for the narrow case where the source totals its own columns.

  **It is a different failure from the ones already recorded here.** The two-scan rule catches an OCR
  digit. The single-witness rule catches an unsupported claim. Neither would touch a page where the
  scan is clean and the book is the only source — and where the compiler, having gathered three
  averages from the freight agents, multiplied them out into a paragraph that reads like a survey.
  Nothing was fabricated. The figures are all true to their inputs. There are simply fewer of them
  than there appear to be, and only arithmetic reveals it.

  **What it does not license.** A product that closes is not thereby *wrong* — 223,080 tons may well
  have moved. The finding is about how many independent observations a page contains, not about
  whether its numbers are right. And a sum that fails to close is not proof of error in either
  operand; the 145 may be a printer's figure, and the corpus does not correct it, only declines to
  carry it.
