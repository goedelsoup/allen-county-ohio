id: a-compulsory-denominator-is-not-a-voluntary-one
summary: >-
  A flood insurance policy rated outside Allen County's special flood hazard area produced a claim
  4.27 times per hundred policy terms between 2009 and 2026; one rated inside produced 2.76. The
  arithmetic is right and the conclusion it invites — that the map is drawn in the wrong place — is
  unavailable, because purchase inside the mapped floodplain is compulsory for anyone with a
  federally backed mortgage and purchase outside it is not. One denominator is close to a census of
  a population; the other is a sample that selected itself on the thing being measured.
context: |
  Two figures came out of the same pair of files, cut to the eight postal areas that lie wholly
  inside this county and to the years both files cover.

      rated zone     policy terms   claims   per 100
      inside SFHA             905       25      2.76
      outside                1217       52      4.27

  The temptation is immediate and the sentence writes itself: more of the damage is outside the
  line than inside it, so the line is in the wrong place. Three separate objections stand in
  the way.

  *The two groups were recruited by different rules.* Inside the special flood hazard area, a
  federally backed mortgage requires flood insurance. Outside it, nobody is required to buy
  anything. So the inside group is close to every mortgaged building on that ground, and the
  outside group is whoever thought it worth paying for — which, for a household that has been
  flooded before or watches water stand in its street, is exactly the households most likely to
  claim.

  *A policy term is not a building.* A house insured for twelve years contributes twelve rows. If
  the inside group renews more faithfully — and a requirement is a good reason to renew — its
  denominator inflates against the same buildings.

  *The zone is the rating zone.* `ratedFloodZone` is what the policy was priced on, which
  grandfathering and remapping can hold behind the current map for years.
decision: |
  **Where a rate divides an outcome by a population whose membership was determined by a rule, name
  the rule beside the rate. Where two rates are compared and the two populations were recruited by
  different rules — one compulsory, one voluntary — publish both figures and refuse the ratio.**

  In practice:

  *State the recruitment.* "4.27 claims per hundred policy terms outside the mapped floodplain"
  is incomplete. "…among people who chose to buy insurance they were not required to buy" is the
  measurement.

  *Look for a comparison that needs no denominator.* The same claim file records the cause of each
  loss, and a split within the claims answers the underlying question without any population at
  all: 109 of this county's claims are coded to accumulation of rainfall or snowmelt and 103 to
  stream, river or lake overflow. That is a fact about water and not about who bought a policy.

  *Say what remains open.* This corpus holds no measurement of how many buildings stand outside the
  special flood hazard area in Allen County, and without it the claim rate outside cannot be turned
  into a risk.
rationale: |
  **Why the ordinary rules do not catch this.**
  [a total is checked against one it did not come from](a-total-is-checked-against-one-it-did-not-come-from.yml)
  governs a numerator and a denominator drawn from different collections, and is answered by
  checking one against a third. Both figures here come from the same programme, and they agree with
  each other perfectly; the defect is in what the denominator *is*, not in where it came from.
  [a survey is not a count](a-survey-is-not-a-count.yml) governs sampling error, and there is none
  here — these are administrative totals, exact to the row.

  **What refusing bought.** The cause-of-damage split is a better finding than the rate would have
  been, and it is not confounded: in a county three-quarters of which is poorly drained, more
  insured flood damage comes from rain that had nowhere to go than from a river leaving its
  channel. Beside it sits a second unconfounded measurement — across the twelve townships and the
  city, the share of ground that is hydric soil and the share that is mapped floodplain correlate
  at a Spearman 0.099. Wet ground and flood zone are close to unrelated here.

  **What it generalises to.** Any rate whose denominator is a group that had to enrol against one
  that chose to: claims per insured building where cover is mandatory in one zone; positive tests
  per test where one group is screened and the other presents with symptoms; violations per
  inspection where one class of premises is inspected on a schedule and another on complaint;
  arrests per stop where one stop is at a checkpoint and another at an officer's discretion. In
  each the numerator is honest, the denominator is honest, and the quotient is about the
  recruitment rule.
status: accepted
date: "2026-09-04"
