id: a-rule-written-for-a-classification-caught-a-layout
summary: >-
  [a-revision-that-moves-a-category](a-revision-that-moves-a-category.yml) was written about the
  federal Standard Occupational Classification and used the total as the control. Its next case was
  a county auditor's PDF changing which column the county's mills are printed in, where the county
  column reads 6.150 in 2015 and 11.400 in 2016 and nothing was levied differently. The rule holds
  unchanged and its subject is wider than its author thought: not classifications, but any published
  structure whose parts a reader is about to difference.
context: |
  The occupational rule was written against a national statistical standard revised by a federal
  committee, and everything about the case said "classification": SOC codes, a crosswalk, major
  groups, a documented 2018 revision. The control that caught it was the aggregate — total
  employment did not move while two of its parts moved by a quarter.

  The Allen County Auditor's tax rate summaries have no classification in them at all. They are a
  report, printed by an office, in two layouts. In tax years 2012 through 2015 the columns run
  *Library/Other, County, Township, Local School, City/Village, JVS*; from 2016 they run *County,
  Library, Township, Local School, City-Village, JVS*. The county column reads:

      tax 2012   6.150        tax 2016   11.400
      tax 2014   6.150        tax 2017   11.400
      tax 2015   6.150        tax 2025   11.400

  Read as a series that is an 85 per cent rise in the county's property tax in one year. The same
  control kills it. Across the 2015-to-2016 boundary the thirty-six tax sets present in both years
  move on their **total full rate** by between −1.710 and +0.700 mills, mean −0.332, while the
  county column rises 5.250 and the library column falls 5.050. Nothing was levied. Five mills
  moved one column to the left.

  A second witness agrees. The county's audited financial statements state the full rate for all
  county operations independently of these files: $8.70, then $9.70, then $11.40. That series rises
  31 per cent over the same period the column suggests 85.
decision: |
  **The rule is unchanged and its scope is restated.** Where any *published structure* is revised
  between two readings — a classification, a report layout, a column order, a form — the aggregate
  is the control and the parts are not comparable until the change has been identified.

  - The trigger is not "a classification was revised". It is **"the parts are about to be
    differenced across a boundary the publisher may have moved"**, and every long series from a
    published document crosses such a boundary somewhere.
  - Difference the aggregate first, per unit, and look at the **distribution** of the change rather
    than its mean. Here the mean total change was a third of a mill and no single district moved
    more than 1.71, which is what a reshuffle looks like; a real five-mill levy would have moved
    every total by five.
  - Where the publisher offers no crosswalk, a **second document from the same office** may serve as
    one. The audited statements were not written to explain the rate summaries and they settle them.
  - Two columns that move by nearly equal and opposite amounts are one fact, not two.
rationale: |
  **A rule tested against one case cannot distinguish the feature that matters from the features
  that happened to be present.** This corpus has made that mistake before and recorded it in
  [a-scope-rule-met-its-second-case](a-scope-rule-met-its-second-case.yml). The occupational rule
  was written with "classification" in every sentence because the first case was a classification.
  The mechanism was never classification; it was that a publisher decides how to arrange parts and
  is under no obligation to arrange them the same way twice.

  **The control transferred with no adaptation at all**, which is the strongest evidence that the
  rule is about the shape of the problem rather than its subject. Total employment there, total
  full tax rate here; both are the sum the reshuffle cannot touch.

  **This case is easier than the first and that is the point.** The occupational case needed a
  crosswalk and a list of missing codes. This one needed one subtraction per district. A rule that
  is cheap to apply should be applied to every long series, not only to the ones that look like
  classifications, and the cost of checking is one column of differences.

  **What this does not buy.** It says nothing about a change that moves parts *and* the aggregate at
  once — a levy passing in the same year a column moves. Here the two are separable because the
  totals barely moved; where they do not separate, the aggregate is no longer a control and this
  corpus has no method for that case.
status: accepted
date: "2026-09-02"
