id: the-name-is-the-seat-not-the-extent
summary: >-
  The Lima Municipal Court's territory is not Lima. Ohio Revised Code §1901.02 gives the general
  rule that municipal courts have jurisdiction "within the corporate limits of their respective
  municipal corporations", then names this one as an exception: "The Lima municipal court has
  jurisdiction within Allen county." A traffic case from Spencerville is heard by a court called
  after a city thirteen miles away.
context: |
  The court was about to be written as serving Lima, because that is what it is called and because
  the corpus had it filed under a page about the county seat. Two things stopped it.

  The statute, read for the term of years and not for the territory, states the exception in the
  same sentence as the rule. And the elections roster lists the court's two judges under *Allen
  County's* elected officials rather than Lima's, which is where they would appear if the electorate
  were the city — an independent confirmation that says nothing about territory directly.

  The same shape appears twice more in the same phase. The
  [Third District Court of Appeals](../corpus/jurisdiction/third-district-court-of-appeals.yml)
  is named for a district of seventeen counties and seated at 204 N. Main Street in Lima, so its
  name gives its extent and hides its seat — the mirror image. And
  [the clerk of courts](../corpus/office/allen-county-clerk-of-courts.yml), an officer of one
  county, keeps the record of that seventeen-county court.
decision: |
  **Before writing a jurisdiction's extent, find the instrument that fixes it. Never take the
  extent from the name.**

  A name records where a body sits, or what it was called when created, or which of several
  identical bodies it is. Any of those can coincide with its territory and none of them states it.
rationale: |
  **The failure mode is that the wrong version is never surprising.** "The Lima Municipal Court
  serves Lima" reads as a fact a reader already knew, so nothing about it invites a check. This
  corpus has a standing worry about claims that are satisfying to write; here the trap is the
  opposite one, a claim so unremarkable that it slides through. Both are failures of the same
  reflex — writing the sentence the shape of the words suggests.

  **It is not a new observation in this corpus, which is the argument for recording it.** Three
  earlier findings are the same thing in different clothes:
  [a postal address is not a municipality](a-postal-address-is-not-a-municipality.yml) — a Lima
  mailing address is not the city of Lima.
  [read a word in its source register](read-a-word-in-its-source-register.yml) — a word means what
  its source meant by it.
  And [what became of German and Ottawa townships](../corpus/question/what-became-of-german-and-ottawa-townships.yml)
  turned on a township and a city with the same ground and different names. Four instances now, all
  in one county, all where a name and an extent were assumed to agree.

  **What makes this one worth a separate record** is that the previous three were caught by reading
  a source more carefully, and this one was caught by reading a *different* source — the statute
  that constitutes the court, rather than anything the court or the county says about itself. A
  jurisdiction's extent has an instrument, and the instrument is a different document from the
  descriptions. That is a retrieval instruction, not a reading instruction.

  **The counter-consideration.** Most names do match their extents — the twelve townships, the seven
  villages, the school districts — and demanding the constitutive instrument for each would be a
  large retrieval bill for a mostly-confirmed answer. The rule is therefore about *order*, not
  effort: the name may suggest the extent and may not be cited for it. Where no instrument has been
  read, the extent is `[open]` rather than assumed, which costs nothing and is honest.

  **A second rule fell out of the same phase and is recorded here rather than separately.** This
  corpus writes a `person` and a `tenure` where Allen County's own electors choose the officer. The
  Third District's four judges are chosen by seventeen counties' electors, so they are named in the
  catalog and given no nodes. The line is a fact about the county rather than a judgment about
  node-worthiness, which is what makes it checkable.

  **That second rule was wrong and is superseded.** It lasted one phase. Applied to its next case —
  the county's state senator and state representative, both elected by multi-county districts — it
  excluded them too, and a county reference that cannot name who represents the county is not a
  reference. It was also already contradicted by `mayor-of-lima`, which existed when it was written.
  Replaced by
  [a scope rule met its second case](a-scope-rule-met-its-second-case.yml): a constituency smaller
  than the state that includes ground in Allen County. The four appellate judges now have nodes.
  The rest of this record stands; only the second rule fell.
status: accepted
date: "2026-08-30"
