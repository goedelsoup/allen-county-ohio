id: where-a-list-loses-a-name
summary: >-
  Three books print Lima's mayors from 1842. They disagree in exactly four consecutive slots, and
  one of them leaves a year with no mayor in it. This records how two printings of one succession
  are collated, where the loss is found, and which list is preferred when they differ.
context: |
  [a-line-of-holders-is-a-table](a-line-of-holders-is-a-table.yml) settled that a succession is
  recorded as a table rather than as one node per holder. It said nothing about what to do when a
  second printing of the same table turns up, and this corpus now has three of them: the 1885
  history's year-by-year narration from the council's minutes, the 1906 history's dated list, and
  the 1921 history's undated ordered list, which says outright that it follows "the most recent
  report in Lima".

  [two-scans-of-one-book](two-scans-of-one-book.yml) governs two readings of one printing.
  [a-single-witness-read-once](a-single-witness-read-once.yml) governs one printing of one claim.
  Neither governs two printings that are not independent and do not agree.
decision: |
  **Align the lists by name, not by date, and read the disagreement as a block.** The 1885, 1906 and
  1921 lists agree on every one of forty-odd names except four consecutive slots in the 1850s. A
  disagreement confined to a run is a transcription event; a disagreement scattered through a list
  is two different records.

  **Look at the repeated names first, because that is where a list loses one.** The 1885 line reads
  Milligan, Baxter, Milligan, Baxter. The 1906 list drops the second Baxter. The 1921 list drops the
  second Milligan and the second Baxter both. Neither loses anything anywhere else in eighty years.
  A copyist's eye returning to the wrong instance of a name it has already seen is the oldest defect
  in the transmission of any list, and a succession of a small town's officers is full of repeated
  names by construction.

  **Prefer the list that leaves no hole, because a hole is evidence and a disagreement is not.**
  Deleting one entry from a dated list makes the entries after it slide earlier until a firm date
  stops them, and the collision leaves a span with nobody in it. The 1906 list has exactly one such
  span in thirty-four entries — April 1857 to April 1858, no mayor — and it sits immediately after
  the slots in dispute. That is not an argument about who was right in 1854; it is a demonstration
  that the 1906 list lost material, and it is available without leaving the page.

  **An undated list cannot be checked this way, and must not be treated as a witness for dates.**
  The 1921 list lost two entries and shows nothing at all, because there is no arithmetic for an
  order to violate. Use an undated list for order and for names, and for the count of entries when
  something else supplies the term.

  **Count entries, not terms, and say which you counted.** These lists give a consecutive
  re-election its own entry twice and fold three consecutive terms into one entry once. A number
  labelled "terms" that was taken off such a list is wrong in a way nothing downstream will catch.
rationale: |
  **The rule earned itself immediately, in the direction that costs something.** Collating the three
  lists found a defect in this corpus, not only in the books: the 1885 mayor list prints "John B.
  Townsend" where the same volume prints James in its election returns, its index and a biography of
  the man, and this corpus had carried John since the line was written. Two later books pointed at
  it and the source itself settled it.

  **It also stopped two corrections that looked identical and were not.** The later books also print
  Dalzell for Delzell and Isaac T. Hickman for J. T. Heckman. Those are not the same kind of
  finding: the 1885 book prints Delzell seventeen times against Dalzell four, so it is not a slip,
  and the 1906 and 1921 lists are one lineage rather than two witnesses. Three books that disagree
  can be one book against one, and counting heads would have overturned the older reading twice on
  no evidence.

  **And it dated eighteen years the sources leave undated.** Nine entries follow the last dated one;
  the 1921 book states a two-year term and dates the abolition to 1 January 1922; nine two-year
  terms from April 1904 land in April 1922. The closure is the evidence, in the sense
  [arithmetic that closes is about the compiler](arithmetic-that-closes-is-about-the-compiler.yml)
  gives it: it says the list is complete as printed, not that any man served the years assigned.

  **What this does not license.** Preferring the older printing as a rule. The preference here is
  for the printing that does not contradict itself, and on Townsend that was the newer pair. Nor
  does a run of agreement between two lists of one lineage count twice; the 1921 book names its
  source, and a corpus that reads it as a third witness has invented one.
