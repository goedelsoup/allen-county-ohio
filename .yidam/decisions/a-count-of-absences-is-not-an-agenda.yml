id: a-count-of-absences-is-not-an-agenda
summary: >-
  "Twenty-two of thirty-eight jurisdictions carry no `erected` date" was ranked the corpus's third
  worst gap and stood for fifty-seven phases. Four of the twenty-two were answerable from books
  already on this disk, one is documented as unrecordable by two historians who looked, and eleven
  are a different kind of thing entirely. A count of blank fields is not a research agenda.
context: |
  [state-after-sixty-six-phases](state-after-sixty-six-phases.yml) ranked six gaps by counting: how
  many jurisdictions lack a date, how many classes hold fewer than twenty instances, how many
  `[open]` markers stand unranked. Counting was the right instrument for noticing them and the
  wrong one for working them.

  The `erected` gap had been named twice — once at nine phases and once at sixty-six — and had moved
  from four of nine municipalities to four of nine in between. It looked like a hard gap. It was
  four easy ones, one impossible one, and fourteen that belong to another question.
decision: |
  **Decompose a counted gap before working it, and do it by asking what instrument would close each
  member.** The twenty-two jurisdictions without a founding date turn out to be five kinds:

  - **Four were in sources the corpus already held.** Delphos (7 February 1851), Bluffton
    (17 August 1861) and Cairo (12 April 1875) are in the 1885, 1906 and 1921 county histories,
    which this corpus has cited in dozens of nodes. Lima's date had been established as an *event*
    and never written to the corporation's own field.
  - **One is documented as unrecordable.** Bath Township's erection is in no record: the 1885
    compiler found "no record of its establishment either in the records of Allen or Mercer
    County", and the 1921 compiler, independently, "neither the records of Allen nor Mercer give the
    time of its organization". Two historians looked and said so. That blank is not the corpus's.
  - **One is bounded and needs an instrument nobody here has opened.** Harrod is absent from the
    1885 history, present as a village in the 1890 census, and a taxed corporation by 1904; its
    date is in the county commissioners' journal.
  - **Eleven are school districts**, creatures of twentieth-century consolidation whose founding is
    a different act in a different archive.
  - **Three are courts**, established by statute the corpus already holds and has not read for this.

  **So: before retrieving anything, sweep the held catalog for the gap.** `obtained: true` in a
  catalog entry means a source was fetched, never that it was read for this question. A source is
  read *for* something, and every phase brings its own question to it — this corpus went to the 1885
  history for mayors, for railroads, for townships, for a jail raid, and never once asked it when
  the villages were incorporated.

  **And record the kind of absence, not only the absence.** A blank field that means "nobody wrote
  it down" is a different object from one that means "we have not looked", and only the second is
  work. The first is a finding.
rationale: |
  **The cost of not decomposing is measured in phases.** This gap was named at nine phases and still
  half open at sixty-six. Four of its members were an afternoon's grep of files already on the disk.
  Nothing about the way it was counted said so, because a count reports a cardinality and hides a
  taxonomy.

  **The same failure is queued behind it.** "347 `[open]` markers across 265 nodes, and nothing ranks
  them" is the sixth gap in that same decision, and it is the same shape: a number that will stay
  true for as long as it is treated as one problem. Some of those markers name a source; some name
  an instrument nobody holds; some are refusals that should never close. Counting them again will not
  separate them.

  **This extends rather than repeats the phase before it.**
  [a-grant-file-counts-offices-not-ground](a-grant-file-counts-offices-not-ground.yml) was about
  asking what a field is a property of before summing over it. This is about asking what a *missing*
  field is a property of before working it. Both are the same discipline applied to the two halves
  of a table.

  **What this does not license.** Treating a count as worthless. The count is what made the gap
  visible at all, and no amount of reading nodes one at a time would have shown that four of nine
  municipalities lacked a date. The rule is that counting opens the question and never answers it,
  and a phase that goes from the count straight to a retrieval has skipped the step where it finds
  out the answer was already here.
