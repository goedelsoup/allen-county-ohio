id: one-period-was-doing-two-jobs
summary: >-
  `deindustrialization` has carried two processes on one start date since genesis: the county's
  manufacturing contraction and its population loss. Measured separately they are not the same span.
  Manufacturing peaked in 1973, fell from 1979, bottomed in 2009 and has risen since; the population
  turned in 1970 for Lima and 1980 for the county and has not stopped. One has ended and one has not.
  The node is split.
context: |
  [a period that named one date for two things](a-period-that-named-one-date-for-two-things.yml)
  faced a version of this a dozen phases ago, when the two things were a county and a city. It
  considered splitting and refused, for a stated reason:

    Splitting was considered. It would require a start date for Lima's decline, and the corpus does
    not have one: the peak is somewhere in 1930–1990 and nothing held here narrows it further. A
    second period node with an unknown start would be an assertion dressed as a structure.

  That reason is void. Lima's peak is 53,734 in 1970 with twelve rising counts behind it, and the
  county's is 112,241 in 1980 with fifteen. Both were retrieved in the phases since. The refusal to
  split was correct when written and expired without anyone noticing.

  What forced the question now is a different pair. The node is named for manufacturing and, until
  two phases ago, was evidenced entirely by population — eleven `evidenced-by` edges, ten of them to
  population measures and one to a 1909 manufactures table. The mismatch was visible in the edge
  list for twelve phases.
decision: |
  **Two periods.**

  [`deindustrialization`](../corpus/period/deindustrialization.yml) keeps its name and takes the
  subject its name describes: manufacturing employment, 1979 to 2009, ended. Its start is the last
  year employment stood within one per cent of the 1973 peak; its end is the trough, with thirteen
  subsequent years all higher.

  [`depopulation`](../corpus/period/depopulation.yml) is new and takes the population: 1970, from
  Lima's peak, continuing. It carries the population measures, the `concentrated-in` edge to Lima,
  and the components-of-change work.
rationale: |
  **The test for whether one period is doing two jobs is whether its bounds are argued from one
  subject and applied to another.** That is exactly what "roughly 1970" was: a date read off the
  population series and written on a node named for industry. It survived twelve phases because
  nothing had measured the other subject, so nothing could disagree with it.

  **A period with an end is worth more than a period without one.** `deindustrialization` can now
  say that the thing it names stopped, which is the single most useful sentence a period node can
  carry and one this corpus has been unable to write about its central subject. That sentence is
  only available once the period is about one process: a compound period ends when its last
  component ends, which is to say never.

  **The split makes the causal question sharper rather than burying it.** The two nodes now sit
  beside each other with a fourteen-year overlap and a divergence at the end, and each carries the
  refusal that the corpus does not establish the one caused the other. Before, that refusal was a
  node declining to explain itself. Now it is a node declining to explain a different node, which is
  a claim a reader can check.

  **The counter-consideration, and it is not small.** Two nodes where there was one means two places
  for a reader to look and two places for a claim to go stale, and the ordinary reason a corpus
  splits a node is that the author found the original hard to write rather than that the world has
  a seam there. The defence is that the seam is measured: three years between the peaks, thirty
  years against fifty-five in length, and one process demonstrably over while the other continues.
  If a later series showed manufacturing falling again to a new low, the right response would be to
  extend `deindustrialization`, not to merge the nodes back.
status: accepted
date: "2026-08-30"
