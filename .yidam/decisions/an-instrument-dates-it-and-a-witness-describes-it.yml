id: an-instrument-dates-it-and-a-witness-describes-it
summary: >-
  Two of this corpus's events were made by datasets — a tornado from a federal storm file, a flood
  from a river gauge — and each carried an open block saying it had no idea what happened. A
  newspaper of the week answers both and disagrees with the file about the clock, the cost and how
  many storms there were. The rule is that a dataset and a witness are good at different halves of
  an event, and where they overlap the corpus prints both readings rather than choosing.
context: |
  [A dataset can make an event](a-dataset-can-make-an-event.yml) admitted things into the corpus's
  spine that nobody wrote about: a gauge peak becomes a flood, a row in a storm file becomes a
  tornado. Both nodes then said the same thing in different words — *this is a number and I do not
  know what it did*.

  The county's own weekly answers them, and the two accounts do not line up.

      the tornado of 19 July 1950     federal storm file        The Bluffton News, 27 July
      time                            15:15 CST                 "occurred at 4:50"
      property damage                 $2,500,000                "one and one-half-million dollar"
      tornadoes that evening          one, Lima to Beaverdam    "apparently a different one"

  On the flood the disagreement is of a different kind and larger. The gauge is on the Ottawa; the
  newspaper is published twenty miles north on Big Riley Creek, in another basin. Its four feet of
  water in a lumber yard is the same storm and not the same water, and reading it as a description
  of the Ottawa's peak would be the whole of the error this rule exists to stop.
decision: |
  **Where a dataset made the event, a witness may describe it and may not re-date it, and the
  disagreements are published as disagreements.**

  - **The instrument keeps the date and the magnitude; the witness keeps the extent and the
    detail.** A gauge measures discharge to three figures and cannot say whose basement filled; a
    newspaper names the street and rounds the damage to the nearest half million. Neither is
    corrected by the other and the node says which is which.
  - **Print both numbers.** $2.5 million and "one and one-half-million dollar" are two claims about
    one storm, one made eight days after by a paper five miles from the track and one compiled
    later at national scale. The corpus holds both and states neither as the figure.
  - **Check the basin, the township and the county line before the witness is allowed to be about
    the same thing.** The strongest-looking answer in this phase — a flood account in the right
    week — is about a different creek, and the node that carries it says so in its own refusal.
  - **A witness that adds an event adds an event.** Where the account describes a happening the
    dataset has no row for, that is a node, and the node says which file was searched and did not
    hold it.
rationale: |
  The corpus has been careful for a long time about a source that says less than it seems to. This
  is the opposite failure and it is easier to fall into: a contemporaneous, specific, vivid account
  that answers the open question, offered by a source with no reason to be exact. Weekly newspapers
  round money, mistime afternoons, and describe the part of a storm that hit their own subscribers.
  They are still the only thing that will ever say that the trees more than two feet through were
  twisted off, or that the ice came down the creek with the impact of trucks.

  **The rule's real work is on the third row of that table.** A file with one tornado and a paper
  saying there were two is not a detail; it is a question about what the record counts. The corpus
  writes the second storm as its own node, says the federal file has no row for it, and refuses to
  assert that the two winds were separate — because "apparently" is the paper's own word and an
  hour's gap fits a second touchdown as well as a second storm.

  **And it corrects a sentence of the corpus's own.** The flood node said no newspaper in this
  catalog reaches 1959. One did, and had for six phases. An open question that names the source
  that would close it is only useful if somebody checks the shelf, and the failure here was not
  retrieval but indexing.
status: accepted
date: "2026-09-06"
