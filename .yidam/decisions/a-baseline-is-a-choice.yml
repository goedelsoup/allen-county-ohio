id: a-baseline-is-a-choice
summary: >-
  Last phase this corpus published "every one of the county's twelve townships is larger now than
  it was in 1930". True, and 1930 was near the bottom: eight of the twelve reached their lowest
  recorded count between 1900 and 1940. The baseline was not chosen, it was the oldest figure that
  had arrived, and the claim borrowed force from that.
context: |
  The 1950 Census volume reached back to 1930 at township grain, so 1930 was where the corpus's
  township series began, so 1930 is what the comparison used. The finding was real — every township
  is larger now — and it went to the public site as an assertion.

  One phase later the 1910 supplement supplied 1890, 1900 and 1910. Against 1890 the same twelve
  townships still all grew, and six of them grew *less*:

                     from 1930   from 1890
      Monroe            x1.3        x1.0
      Amanda            x2.1        x1.5
      Auglaize          x1.7        x1.4
      Jackson           x2.0        x1.7
      Spencer           x1.3        x1.2
      Perry             x2.2        x2.2

  Monroe is the case that shows it: a third larger than in 1930, three per cent larger than in 1890.
  The county's countryside emptied between 1890 and 1940 and refilled after, and a comparison
  anchored at 1930 measures the refilling and not the round trip.
decision: |
  **Where a comparison's baseline is the oldest observation held rather than a chosen date, say so
  in the claim, and carry a second baseline as soon as one exists.**

  The ratio table in
  [`allen-county-townships-1930-1950`](../corpus/measure/allen-county-townships-1930-1950.yml) now
  has two columns, from 1930 and from 1890, side by side and unreconciled. The paragraph beneath
  says which is which and why they differ. The site's assertion says the same in one sentence.
rationale: |
  **This is a different failure from the one this corpus recorded two phases ago, and the difference
  is worth keeping.** In [the window was the finding](the-window-was-the-finding.yml) the caveat was
  right and the headline was wrong: the county grew through the 1970s and the corpus said it had
  not. Here the headline is right. Every township *is* larger than in 1930 and larger than in 1890.
  What was wrong was the force of it — a claim that sounds like ninety years of growth describing
  ninety years of decline followed by eighty of growth.

  A false claim gets caught by the gate, by a reader, by the next source. An inflated one does not,
  because there is nothing to catch. The only defence is to notice that the baseline was handed to
  you.

  **And the tell was available before the correction.** The 1950 volume's own columns showed five of
  the twelve townships falling between 1930 and 1940. A series whose first observation is followed
  by a decline in nearly half its members is a series that probably did not start at the bottom by
  accident — it started wherever the volume stopped. That was visible one phase early and nobody
  looked.
status: accepted
date: "2026-08-30"
