# Provenance of the design system this repository's token layer was ported from.
#
# Written and updated by the `design-pull` skill. Read by `web/test/port.test.ts`,
# which holds `web/src/styles/tokens/` to `upstream/` plus the declared departures.
#
# The shape follows .yidam.toml deliberately: a pin is a pin, and that file already
# teaches a reader how to read one. The difference is what a pin can be. yidam pins a
# git commit, which is resolvable and orderable. A claude.ai design project has no
# commit and no version — so `files` below is the pin: the sha256 of every mirrored
# file at the moment it was pulled. Drift is detected by re-hashing, not by comparing
# revisions.
#
# `pulled` is when the mirror was last refreshed. It says how stale `upstream/` is, and
# nothing more — the project may have moved the same afternoon.

[design_system]
name    = "Allen County Atlas Design System"
project = "4f74bdb5-feb9-4d1f-98b5-7f752049cb53"
url     = "https://claude.ai/design/p/4f74bdb5-feb9-4d1f-98b5-7f752049cb53"
pulled  = "2026-09-05"

# ── the mirror ────────────────────────────────────────────────────────────
#
# One entry per file under upstream/, path relative to that directory, with the
# sha256 of the bytes as pulled.
#
